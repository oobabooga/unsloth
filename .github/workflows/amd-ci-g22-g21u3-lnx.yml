name: "AMD CI: validate PR 20103"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-g22-g21u3-lnx]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "20103"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  AMD1_BASE_OVERRIDE: "3f4a7e5fc52ae85e20cbff8c0d7c17f12a9e7166"
  AMD1_HEAD_OVERRIDE: "7d692c57614d2468182b8fc32b71242ba3b49650"
  MERGED: "0"
  # Set by scaffold.py --patch: base = PATCH_BASE, head = PATCH_BASE plus this diff (relative to the checkout).
  PATCH_BASE: ""
  PATCH_FILE: ""
  PATCH_SHA256: "__PATCH_SHA256__"

jobs:

  gpu:
    name: "PR 20103 GPU check (shared GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 420
    # --shared-gpu: no concurrency group, so a co-tenant may share the card.
    # Correctness only; capability.py reports `exclusive_gpu` as a gap.
    env:
      AMD_CI_SHARED_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr20103-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          if [ -n "$PATCH_FILE" ]; then ARGS="--patch-base $PATCH_BASE --patch $GITHUB_WORKSPACE/$PATCH_FILE --patch-sha256 $PATCH_SHA256"; fi
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and host gate (no Studio)
        run: |
          set -euo pipefail
          echo "AMD_CI_PY=$(command -v python3)" >> "$GITHUB_ENV"
          # No torch here, so rocm/gpu read UNDETERMINED: the criteria gates prove the GPU ran.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/train5_probe.py \
            --criteria amd_ci/criteria/amdgate_rocm.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --unit g21u3 --state-repo unsloth --transformers 5.24.0 --trl 1.18.0 --cells env,flm16 --companion-repo https://github.com/unslothai/unsloth-zoo --companion-base c2b1a436e91161dd0d7301283ca9c01e60f7d515 --companion-head 429e00f97fc2d524a033c4e89affe2f09dbb872c --venv "$AMD_CI_WORK/tvenv" --tests tests/diffusion/test_diffusion_masked.py tests/python/test_docker_update_helpers.py tests/python/test_online_dpo_mm_token_type_ids.py tests/python/test_windows_python_venv_hardening.py tests/saving/test_gguf_intermediate_keeps_prior_export.py tests/saving/test_residual_lora_reload_merge.py tests/test_auto_fit_optimizer.py tests/test_block_cudagraphs_gpu.py tests/test_context_parallel_split_generation.py tests/test_distillation_teacher_tokenizer.py tests/test_dpo_vision_collator_pixel_rows.py tests/test_ep_collective_safety_gloo.py tests/test_ep_expert_shapes_gloo.py tests/test_fastlanguagemodel_new_tokens_tied.py tests/test_fp8_no_rowwise_scaled_mm.py tests/test_fp8_rowwise_compile_guards.py tests/test_fp8_torchao_import_route.py tests/test_fsdp2_native_sharded_load_gloo.py tests/test_fsdp2_submesh_bnb_optimizer_gloo.py tests/test_generic_decode_graphs.py tests/test_gguf_packed_lora.py tests/test_import_keeps_plain_model_backends.py tests/test_installer_system32_guard.py tests/test_int8_lora_recipe.py tests/test_layer_major_ga_ddp.py tests/test_moe_load_logging.py tests/test_on_policy_distillation.py tests/test_optimized_precision_conflicts.py tests/test_portable_resume_state_offload.py tests/test_qat_scheme_new_model_path.py tests/test_rocm_torch_gates.py tests/test_tp_native_gloo.py tests/test_uma_safetensors_load.py tests/saving/test_torchao_staging_dir_cleanup.py tests/test_decode_gqa_in_place.py tests/test_ep_packed_checkpoint_load_gloo.py tests/test_fsdp2_native_offloaded_optimizer_save_nccl.py tests/test_gguf_load_trainable.py tests/test_kernels_utils_no_import_stream_query.py tests/test_parallel_auto.py tests/test_parallel_deepsee