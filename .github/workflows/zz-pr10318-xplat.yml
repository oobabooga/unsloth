name: "PR 10318 cross-platform RAG budget check"

on:
  pull_request:
  push:
    branches: [pr-10318-xplat-ci]

permissions: {}

concurrency:
  group: zz-pr10318-${{ github.ref }}
  cancel-in-progress: true

env:
  UNSLOTH_IS_PRESENT: "1"
  UNSLOTH_COMPILE_DISABLE: "1"

jobs:
  rag-budget:
    name: "RAG budget (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies (CPU only)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'

      - name: Affected suites
        shell: bash
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=short --timeout=600 \
            tests/test_rag_whole_document.py \
            tests/test_rag_retrieval.py \
            tests/test_conversation_recall_injection.py \
            tests/test_tool_result_fits_window.py

      - name: Deterministic routing assertion
        shell: bash
        working-directory: studio/backend
        run: python ../../zz_routing_check.py

  wsl:
    name: "RAG budget (WSL on windows-latest)"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable WSL
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
      - name: Run the affected suites inside WSL
        shell: wsl-bash {0}
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv >/dev/null
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          cd "$(wslpath '${{ github.workspace }}')"
          pip install -q --upgrade pip
          pip install -q -r studio/backend/requirements/studio.txt
          pip install -q python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx
          pip install -q --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install -q 'transformers>=4.51,<5.5'
          cd studio/backend
          UNSLOTH_IS_PRESENT=1 UNSLOTH_COMPILE_DISABLE=1 \
            python -m pytest -q --tb=short --timeout=600 tests/test_rag_whole_document.py
          UNSLOTH_IS_PRESENT=1 UNSLOTH_COMPILE_DISABLE=1 \
            python ../../zz_routing_check.py
