name: "PR 10318 cross-platform RAG budget check"

on:
  pull_request:

permissions: {}

concurrency:
  group: zz-pr10318-${{ github.ref }}
  cancel-in-progress: true

env:
  UNSLOTH_IS_PRESENT: "1"
  UNSLOTH_COMPILE_DISABLE: "1"

jobs:
  rag-budget:
    name: "RAG budget (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # NOT actions/setup-python: its macOS and Windows CPython builds omit
      # enable_load_extension, so sqlite-vec cannot load and every RAG fixture errors
      # at setup. uv ships python-build-standalone, which enables loadable extensions.
      - uses: astral-sh/setup-uv@v5
      - name: Provision a Python with loadable sqlite extensions
        shell: bash
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH";
          else echo "$PWD/.venv/bin" >> "$GITHUB_PATH"; fi
      - name: Confirm loadable sqlite extensions
        shell: bash
        run: python -c "import sqlite3,sys; c=sqlite3.connect(':memory:'); print('loadable:', hasattr(c,'enable_load_extension')); sys.exit(0)"

      # `uv pip`, not `pip`: `uv venv` seeds no pip, so `python -m pip` is absent.
      - name: Install backend test dependencies (CPU only)
        shell: bash
        run: |
          uv pip install -r studio/backend/requirements/studio.txt
          uv pip install python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx
          uv pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          uv pip install 'transformers>=4.51,<5.5'

      - name: Affected suites
        shell: bash
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=short --timeout=600 \
            tests/test_rag_whole_document.py \
            tests/test_rag_retrieval.py \
            tests/test_conversation_recall_injection.py \
            tests/test_tool_result_fits_window.py

      # always(): test_tool_result_fits_window has 5 pre-existing POSIX-primitive
      # failures on native Windows (os.mkfifo, symlink utime) that are identical on
      # upstream main; they must not hide the routing assertion.
      - name: Deterministic routing assertion
        if: always()
        shell: bash
        working-directory: studio/backend
        run: python ../../zz_routing_check.py

