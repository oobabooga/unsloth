name: "k6 d589f58080: Windows build with LLAMA_BUILD_TESTS=ON (hosted windows-2022, release CPU recipe) + the k6 unit tests"

on:
  push:
    branches: [amd-ci-llama-k6r6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-win-tests:
    name: "k6 Windows CPU build with tests ON, run test-alloc / test-sched-lend / test-sysmem / test-arg-parser"
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Source (b11721 + k6 patch)
        run: |
          $BASE = "ff5a23376725e5a889fa0bfb987b7541dc304da0"
          git init -q src; git -C src config core.autocrlf false
          git -C src remote add origin https://github.com/ggml-org/llama.cpp
          git -C src fetch -q --depth 1 origin $BASE; git -C src checkout -q --detach $BASE
          python -c "import gzip,shutil,sys; shutil.copyfileobj(gzip.open(sys.argv[1]), open(sys.argv[2],'wb'))" k6p\k6.patch.gz k6.patch
          git -C src apply --whitespace=nowarn ..\k6.patch
          if ($LASTEXITCODE -ne 0) { throw "k6 patch does not apply" }
          Get-Content k6p\K6_SHA
      - name: Build (clang toolchain, OpenMP, BACKEND_DL, CPU_ALL_VARIANTS, tests ON)
        working-directory: src
        shell: cmd
        run: |
          pip install -q ninja
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_OPENMP=ON -DGGML_RPC=ON -DLLAMA_BUILD_TESTS=ON ^
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_OPENSSL=OFF
          if errorlevel 1 exit /b 1
          cmake --build build --config Release -- -k 0 > ..\build_tests.log 2>&1
          set BRC=%ERRORLEVEL%
          findstr /c:"FAILED:" /c:"error:" ..\build_tests.log
          echo build rc=%BRC%
          for /r "%VSDIR%\VC" %%f in (libomp140.x86_64.dll) do if exist "%%f" copy /y "%%f" build\bin\Release\ >nul
          exit /b %BRC%
      - name: Run the k6 unit tests
        working-directory: src
        run: |
          $ErrorActionPreference = "Continue"
          $fail = 0
          foreach ($t in "test-alloc", "test-sched-lend", "test-sysmem", "test-arg-parser") {
            $exe = "build\bin\Release\$t.exe"
            if (-not (Test-Path $exe)) { "MISSING $t"; $fail++; continue }
            & $exe *> "..\$t.log"
            $rc = $LASTEXITCODE
            "$t rc=$rc $((Get-Content "..\$t.log" | Select-Object -Last 1))"
            if ($rc -ne 0) { $fail++; Get-Content "..\$t.log" | Select-Object -Last 30 }
          }
          "failures: $fail"
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-win-tests
          path: |
            build_tests.log
            test-*.log
          retention-days: 7
          if-no-files-found: warn
