name: "AMD CI: does the 60 to 5 fps collapse reproduce?"

# A CAPABILITY question about the APP, not a differential one. There is no base/head pair:
# nothing is under test, the ladder rung is the independent variable, and the control for
# "the rung caused this" is the same rung measured again. So lib/differential.py is not used
# and its VOID rule is not simulated by pointing two states at the same tree.
#
# Why it exists: users report Unsloth Studio going from 60 fps to 5 fps as a thread grows from
# 0K to 100K to 500K tokens. The only venue we had was headless Chromium on a server, where all
# four rungs, both arms and the null sat at 60.0 fps with a 1-2% busy main thread, so every
# metric was VOID against its own measured floor. A previous run on this branch's sibling
# established that this host composites WebKitGTK on the real gfx1151 -- the engine and the
# render path Studio actually uses on Linux. This run puts Studio in front of it.

on:
  push:
    branches: [amd-ci-studio-ladder]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  ladder:
    name: "Studio ladder in WebKitGTK (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 330
    # Compositing a browser and seeding a 2 MB thread both allocate on the one gfx1151 that the
    # four ephemeral slots share, so this takes the GPU group like any other measuring job. The
    # group holds one runner plus one waiter and a third arrival evicts the waiter.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "studio-ladder"

      - name: Hardware gate
        run: |
          set -euo pipefail
          # Fails rather than skips. Only `linux` is checkable before Studio brings a torch
          # along; that this is really the gfx1151 APU is established by the sibling
          # display-capability run and is not re-litigated here.
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"

      - name: Toolkit self-test
        run: |
          set +e
          python3 amd_ci/selftest.py 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          echo "selftest rc=$rc"
          [ "$rc" -eq 0 ] || exit "$rc"

      # Deliberately its own step and deliberately early: step logs are only served once the
      # JOB completes, so anything needed while a 4-hour job is in flight has to be visible in
      # the per-step status, and anything needed afterwards comes from the artifact.
      - name: Engine inventory
        run: |
          set +e
          for p in /usr/bin/python3 /usr/bin/python3.12; do
            [ -x "$p" ] || continue
            echo "== $p"
            "$p" -c "import gi; gi.require_version('WebKit2','4.1'); from gi.repository import WebKit2; print('  WebKit', WebKit2.get_major_version(), WebKit2.get_minor_version(), WebKit2.get_micro_version())" 2>&1 | tail -2
          done
          node --version 2>&1
          npm --version 2>&1
          echo "always exits 0: this is inventory, the probe's own gate decides"
          exit 0

      - name: Ladder probe
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 220
        run: |
          set +e
          python3 amd_ci/lib/capability_run.py \
            --probe amd_ci/probes/studio_ladder_probe.py \
            --criteria amd_ci/criteria/studio_ladder_collapse.py \
            --out-dir "$AMD_CI_WORK/out/ladder" \
            -- --rungs 0K,100K,500K --reps 2
          cat "$AMD_CI_WORK/out/ladder/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 amd_ci/lib/announce.py "$AMD_CI_WORK/out/ladder"

      # ATTRIBUTION. Same job as the ladder deliberately: the GPU concurrency group holds one
      # runner plus one waiter and a THIRD arrival cancels the waiter silently, so a second job
      # here would race the Tauri work on the same box. One job, arms serialised inside it.
      - name: Ablation probe (mechanism attribution at 500K)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 200
        run: |
          set +e
          python3 amd_ci/lib/capability_run.py \
            --probe amd_ci/probes/studio_ablate_probe.py \
            --criteria amd_ci/criteria/studio_ablate_mechanism.py \
            --out-dir "$AMD_CI_WORK/out/ablate" \
            -- --rung 500K --reps 2
          cat "$AMD_CI_WORK/out/ablate/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 amd_ci/lib/announce.py "$AMD_CI_WORK/out/ablate"

      # PR 9477 PIECE 4, REASONING PAGINATION. Five arms, two of which are one-line isolations,
      # measured on `action:reasoning_toggle`. Replaces the piece 2 step rather than running
      # beside it: piece 2 is already answered (1.069x at r500K, run 32807566159), and the GPU
      # concurrency group holds one runner plus ONE waiter, so a second measuring job here would
      # evict somebody silently.
      #
      # BOTH rungs, and the criteria reports per rung. r100K is where the window is worst in
      # Chromium (80% busy) but this host is not Chromium: here the reasoning toggle is known to
      # sit around 25% busy at r100K, which is the VOID condition. Running both is what turns
      # that from an assertion into a measurement, and the criteria says which rung carried the
      # verdict instead of averaging a loaded rung with an unloaded one.
      - name: PR 9477 piece 4 (reasoning pagination) on action:reasoning_toggle
        timeout-minutes: 210
        run: |
          set +e
          python3 amd_ci/lib/capability_run.py \
            --probe amd_ci/probes/studio_p4_probe.py \
            --criteria amd_ci/criteria/studio_p4_pagination.py \
            --out-dir "$AMD_CI_WORK/out/p4" \
            -- --rungs 100K,500K --reps 2 --hog-ms 200
          cat "$AMD_CI_WORK/out/p4/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 amd_ci/lib/announce.py "$AMD_CI_WORK/out/p4"

      - name: Stop anything left holding the GPU
        if: always()
        run: |
          set +e
          # By PORT, then by PID. A pattern-matching process killer would match this very
          # step's own shell, because the pattern ends up on its command line; that has cost a
          # real run before. A Studio or an Xvfb that outlives the job holds VRAM on a machine
          # three other slots share, so this cannot simply be skipped either.
          for p in $(seq 5451 5500); do
            pid=$(ss -lptnH "sport = :$p" 2>/dev/null | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2)
            [ -n "$pid" ] && { echo "killing $pid on port $p"; kill -TERM "$pid" 2>/dev/null; }
          done
          sleep 3
          exit 0

      # The logs, separately from the verdict, because the ask is to SEE that Studio functions
      # rather than be told it does: Studio's own --verbose log per run, the browser console and
      # page-error stream, and every failed resource load.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-ladder-logs
          path: |
            ${{ env.AMD_CI_WORK }}/ladder/out/logs
            ${{ env.AMD_CI_WORK }}/ladder/out/*.jsonl
            ${{ env.AMD_CI_WORK }}/ladder/**/logs/*.log
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-ladder
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
