name: FastFlowLM live validation
'on':
  push:
    branches:
    - fastflow-ci-fe2e0255
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - name: Probe hardware and install isolated test environment
      run: 'set -e

        uname -a

        free -h

        ls -l /dev/accel* /dev/accel/* 2>/dev/null || true

        ulimit -l

        python3 -m venv "$RUNNER_TEMP/fastflow-venv"

        "$RUNNER_TEMP/fastflow-venv/bin/python" -m pip install httpx psutil structlog requests pyyaml packaging pillow tokenizers

        git clone --depth 1 --filter=blob:none --sparse https://github.com/unslothai/unsloth.git source

        git -C source sparse-checkout set studio unsloth unsloth_cli

        git -C source fetch --depth 1 origin c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        git -C source checkout c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        '
    - name: Check exact token caps and sampling controls
      run: "cat > \"$RUNNER_TEMP/sampling.py\" <<'PYSCRIPT'\nimport os,sys,pathlib,json,time,traceback\nfrom tokenizers import\
        \ Tokenizer\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'fastflow-sampling';root.mkdir(exist_ok=True)\nos.environ['UNSLOTH_HOME']=str(root/'state');os.environ['UNSLOTH_STUDIO_HOME']=str(root/'state/studio')\n\
        repo=pathlib.Path.cwd()/'source';sys.path[:0]=[str(repo/'studio/backend'),str(repo/'studio')]\nfrom core.inference.npu_backend\
        \ import LemonadeNpuBackend\nout=root/'evidence';out.mkdir(exist_ok=True);rows=[]\ndef record(name,fn):\n t=time.monotonic()\n\
        \ try:v=fn();r=dict(test=name,ok=True,seconds=round(time.monotonic()-t,2),value=v)\n except Exception as e:r=dict(test=name,ok=False,seconds=round(time.monotonic()-t,2),error=str(e),trace=traceback.format_exc())\n\
        \ rows.append(r);print(json.dumps(r,default=str),flush=True);(out/'results.json').write_text(json.dumps(rows,indent=2,default=str));return\
        \ r.get('value')\nb=LemonadeNpuBackend();record('enable',b.enable)\nm=next(m for m in b.catalog() if m.checkpoint=='qwen3.8-mtp:27b')\n\
        def download():\n last=-1\n for e in b.download(m.id):\n  if e.get('percent',0)>=last+10 or e.get('event') in ('complete','error'):print('DOWNLOAD',e,flush=True);last=e.get('percent',0)\n\
        \ return True\nrecord('download',download);record('load',lambda:b.load(m.id,context_length=4096).to_json())\ntokenizer=Tokenizer.from_file(str(b._model_files(m.checkpoint,b._flm_binary()).folder/'tokenizer.json'))\n\
        def req(prompt,limit=24,temp=0,**params):\n body=dict(model=m.id,messages=[{'role':'user','content':prompt}],max_tokens=limit,temperature=temp,think=False,top_p=1.0,top_k=0,**params)\n\
        \ r=b._server.request('POST','/v1/chat/completions',json_body=body,timeout=240);r.raise_for_status();v=r.json();message=v['choices'][0]['message'];content=message.get('content','')\n\
        \ return {'request':body,'response':v,'encoded_content_tokens':len(tokenizer.encode(content,add_special_tokens=False).ids)}\n\
        for limit in [1,2,4,8,16]:record('cap_'+str(limit),lambda limit=limit:req('Count from one to one hundred separated\
        \ by commas.',limit))\nprompt=\"Invent a new imaginary planet. Begin your reply with exactly 'Planet:' followed by\
        \ a unique invented name and a short description. Be imaginative.\"\nfor i in range(2):record('greedy_'+str(i),lambda:req(prompt,32,0))\n\
        for i in range(5):record('temperature_2_'+str(i),lambda:req(prompt,32,2.0))\nrecord('presence_penalty_2',lambda:req(prompt,32,2.0,presence_penalty=2.0))\n\
        record('repetition_penalty_2',lambda:req(prompt,32,2.0,repeat_penalty=2.0))\nif b._server:(out/'runtime-tail.txt').write_text(b._server.log_tail(200))\n\
        b.shutdown()\n\nPYSCRIPT\n\"$RUNNER_TEMP/fastflow-venv/bin/python\" -u \"$RUNNER_TEMP/sampling.py\""
    - name: Upload sampling evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fastflow-sampling-linux
        path: ${{ runner.temp }}/fastflow-sampling/evidence
        retention-days: 7
