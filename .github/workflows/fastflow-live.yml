name: FastFlowLM live validation
'on':
  push:
    branches:
    - fastflow-ci-fe2e0255
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - name: Probe hardware and install isolated test environment
      run: 'set -e

        uname -a

        free -h

        ls -l /dev/accel* /dev/accel/* 2>/dev/null || true

        ulimit -l

        python3 -m venv "$RUNNER_TEMP/fastflow-venv"

        "$RUNNER_TEMP/fastflow-venv/bin/python" -m pip install httpx psutil structlog requests pyyaml packaging pillow

        git clone --depth 1 https://github.com/unslothai/unsloth.git source

        git -C source fetch --depth 1 origin c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        git -C source checkout c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        '
    - name: Exercise interrupted download vision streaming tools and direct CLI
      run: "cat > \"$RUNNER_TEMP/advanced.py\" <<'PYSCRIPT'\nimport os,sys,json,time,traceback,subprocess,pathlib,base64,io\n\
        import httpx\nfrom PIL import Image,ImageDraw\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'fastflow-advanced';root.mkdir(exist_ok=True)\n\
        os.environ['UNSLOTH_HOME']=str(root/'state');os.environ['UNSLOTH_STUDIO_HOME']=str(root/'state/studio')\nrepo=pathlib.Path.cwd()/'source';sys.path[:0]=[str(repo/'studio/backend'),str(repo/'studio')]\n\
        from core.inference.npu_backend import LemonadeNpuBackend\nout=root/'evidence';out.mkdir(exist_ok=True);results=[]\n\
        def record(name,fn):\n t=time.monotonic()\n try:v=fn();row=dict(test=name,ok=True,seconds=round(time.monotonic()-t,2),value=v)\n\
        \ except Exception as e:row=dict(test=name,ok=False,seconds=round(time.monotonic()-t,2),error=str(e),trace=traceback.format_exc())\n\
        \ results.append(row);print(json.dumps(row,default=str),flush=True);(out/'results.json').write_text(json.dumps(results,indent=2,default=str));return\
        \ row.get('value')\ndef until(fn,seconds=180):\n end=time.monotonic()+seconds\n while time.monotonic()<end:\n  try:\n\
        \   r=fn()\n   if r:return r\n  except httpx.HTTPError:pass\n  time.sleep(1)\n raise TimeoutError('Live server not\
        \ ready')\nb=LemonadeNpuBackend();record('enable',b.enable)\nmodels=record('catalog',lambda:[m.to_json() for m in\
        \ b.catalog()]) or []\nm=next(x for x in models if x['checkpoint']=='qwen3.8-mtp:27b');mid=m['id'];tag=m['checkpoint']\n\
        def interrupt_download():\n iterator=b.download(mid)\n try:\n  for event in iterator:\n   if event.get('percent',0)>=2:\n\
        \    print('INTERRUPT',event,flush=True);return event\n finally:iterator.close()\nrecord('interrupt_download_at_2_percent',interrupt_download)\n\
        record('shutdown_after_interrupt',b.shutdown)\nb=LemonadeNpuBackend();record('restart_after_interrupt',b.enable)\n\
        record('resume_catalog',lambda:[x.to_json() for x in b.catalog() if x.id==mid])\ndef finish_download():\n last=-1\n\
        \ for event in b.download(mid):\n  p=event.get('percent',0)\n  if p>=last+10 or event.get('event') in ('complete','error'):print('RESUME',event,flush=True);last=p\n\
        \ return [x.to_json() for x in b.catalog() if x.id==mid]\nrecord('resume_download_complete',finish_download)\nrecord('load',lambda:b.load(mid,context_length=8192).to_json())\n\
        image=Image.new('RGB',(640,480),'white');draw=ImageDraw.Draw(image);draw.rectangle((160,80,480,400),fill='red');image.save(out/'red-square.png');buf=io.BytesIO();image.save(buf,format='PNG');data='data:image/png;base64,'+base64.b64encode(buf.getvalue()).decode()\n\
        def payload(prompt,**extra):return dict(model=mid,messages=[{'role':'user','content':prompt}],max_tokens=128,temperature=0,think=False,**extra)\n\
        def req(body):\n r=b._server.request('POST','/v1/chat/completions',json_body=body,timeout=400);r.raise_for_status();return\
        \ r.json()\ndef vision():\n v=req(payload([{'type':'text','text':'What color is the square? Answer only its color.'},{'type':'image_url','image_url':{'url':data}}]));assert\
        \ 'red' in v['choices'][0]['message'].get('content','').lower(),v;return v\nrecord('vision_color',vision)\nrecord('length_cutoff_nonstream',lambda:req(dict(payload('Count\
        \ from one to twenty.'),max_tokens=1)))\ndef sreq(body,cancel=False):\n body=dict(body,stream=True,stream_options={'include_usage':True});lines=[];start=time.monotonic();first=None\n\
        \ with b._server.stream('POST','/v1/chat/completions',json_body=body,timeout=400) as response:\n  response.raise_for_status()\n\
        \  for line in response.iter_lines():\n   if line:\n    if first is None:first=time.monotonic()-start\n    lines.append(line)\n\
        \   if cancel and len(lines)>=5:break\n if not cancel:assert any('[DONE]' in s for s in lines),lines\n return {'ttft':first,'seconds':time.monotonic()-start,'lines':lines}\n\
        record('stream_text',lambda:sreq(payload('What is 17 plus 25? Answer only the number.')))\nrecord('stream_reasoning',lambda:sreq(dict(payload('What\
        \ is 17 plus 25?'),think=True)))\nrecord('stream_length_cutoff',lambda:sreq(dict(payload('Count from one to twenty.'),max_tokens=1)))\n\
        record('cancel_stream',lambda:sreq(payload('Write a detailed essay about gardening.'),True))\nrecord('recover_after_cancel',lambda:req(payload('What\
        \ is 17 plus 25? Answer only the number.')))\ntool={'type':'function','function':{'name':'get_weather','description':'Get\
        \ the weather for a city','parameters':{'type':'object','properties':{'city':{'type':'string'}},'required':['city']}}}\n\
        v=record('tools',lambda:req(payload('Use get_weather to check the weather in Paris.',tools=[tool])))\nif v and v['choices'][0]['message'].get('tool_calls'):\n\
        \ msg=v['choices'][0]['message']\n record('tool_roundtrip',lambda:req(dict(payload(''),tools=[tool],messages=[{'role':'user','content':'Use\
        \ get_weather to check the weather in Paris.'},msg,*[{'role':'tool','tool_call_id':c['id'],'content':'{\"temperature_c\"\
        :21,\"condition\":\"sunny\"}'} for c in msg['tool_calls']]])))\nrecord('code_throughput_128',lambda:sreq(payload('Write\
        \ a Python function that computes the Fibonacci sequence and explain it.')))\nrecord('long_prompt',lambda:req(payload('Remember\
        \ the passphrase amber lighthouse. '+('A red bird sat on a fence. '*300)+'What was the passphrase at the beginning?\
        \ Answer only the passphrase.')))\nrecord('unload',b.unload)\nflm=b._flm_binary();modeldir=b._flm_model_dir\nif b._server:(out/'lemonade-tail.txt').write_text(b._server.log_tail(200))\n\
        b.shutdown()\nenv=dict(os.environ,FLM_MODEL_PATH=str(modeldir),FLM_DISABLE_UPDATE_CHECK='1')\ndef cli():\n p=subprocess.Popen([str(flm),'run',tag,'--ctx-len','4096'],env=env,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,encoding='utf-8',errors='replace')\n\
        \ try:stdout,_=p.communicate('/think\\nWhat is 17 plus 25? Answer only the number.\\n/bye\\n',timeout=300)\n except\
        \ subprocess.TimeoutExpired:p.kill();stdout,_=p.communicate();raise RuntimeError('CLI timeout: '+stdout[-4000:])\n\
        \ (out/'cli.txt').write_text(stdout);assert p.returncode==0,(p.returncode,stdout[-3000:]);assert '42' in stdout,stdout[-3000:];return\
        \ {'returncode':p.returncode,'output':stdout[-7000:]}\nrecord('direct_cli',cli)\nlog=open(out/'direct-server.log','w');server=subprocess.Popen([str(flm),'serve',tag,'--ctx-len','4096','--port','8872','--host','127.0.0.1'],env=env,stdout=log,stderr=subprocess.STDOUT)\n\
        try:\n record('direct_server_ready',lambda:until(lambda:httpx.get('http://127.0.0.1:8872/v1/models',timeout=5).status_code==200))\n\
        \ def direct():\n  r=httpx.post('http://127.0.0.1:8872/v1/chat/completions',json=dict(payload('What is 17 plus 25?\
        \ Answer only the number.'),model=tag),timeout=300);r.raise_for_status();v=r.json();assert v['choices'][0]['message']['content'].strip()=='42',v;return\
        \ v\n record('direct_server_chat',direct)\nfinally:\n server.terminate()\n try:server.wait(timeout=15)\n except subprocess.TimeoutExpired:server.kill()\n\
        \ log.close()\n\nPYSCRIPT\n\"$RUNNER_TEMP/fastflow-venv/bin/python\" -u \"$RUNNER_TEMP/advanced.py\""
    - name: Upload advanced runtime evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fastflow-advanced-linux
        path: ${{ runner.temp }}/fastflow-advanced/evidence
        retention-days: 7
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
    - name: Probe hardware and install isolated test environment
      run: '$ErrorActionPreference = ''Stop''

        Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize

        Get-PnpDevice | Where-Object {$_.FriendlyName -match ''NPU|Compute Accelerator''} | Format-List

        python -m venv "$env:RUNNER_TEMP/fastflow-venv"

        & "$env:RUNNER_TEMP/fastflow-venv/Scripts/python.exe" -m pip install httpx psutil structlog requests pyyaml packaging
        pillow

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git clone --depth 1 https://github.com/unslothai/unsloth.git source

        git -C source fetch --depth 1 origin c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        git -C source checkout c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        '
