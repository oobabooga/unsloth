name: FastFlowLM live validation
'on':
  push:
    branches:
    - fastflow-ci-fe2e0255
permissions: {}
jobs:
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
    - name: Probe hardware and install isolated test environment
      run: '$ErrorActionPreference = ''Stop''

        Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize

        Get-PnpDevice | Where-Object {$_.FriendlyName -match ''NPU|Compute Accelerator''} | Format-List

        python -m venv "$env:RUNNER_TEMP/fastflow-venv"

        & "$env:RUNNER_TEMP/fastflow-venv/Scripts/python.exe" -m pip install httpx psutil structlog requests pyyaml packaging
        pillow tokenizers pywinpty

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git clone --depth 1 --filter=blob:none --sparse https://github.com/unslothai/unsloth.git source

        git -C source sparse-checkout set studio unsloth unsloth_cli

        git -C source fetch --depth 1 origin c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        git -C source checkout c6db48dd3859e8eaa73fdee3b599b321f29d0bea

        '
    - name: Exercise interactive FastFlowLM in Windows ConPTY
      run: "@'\nimport os,sys,pathlib,json,time,traceback\nfrom tokenizers import Tokenizer\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'fastflow-terminal';root.mkdir(exist_ok=True)\n\
        os.environ['UNSLOTH_HOME']=str(root/'state');os.environ['UNSLOTH_STUDIO_HOME']=str(root/'state/studio')\nrepo=pathlib.Path.cwd()/'source';sys.path[:0]=[str(repo/'studio/backend'),str(repo/'studio')]\n\
        from core.inference.npu_backend import LemonadeNpuBackend\nout=root/'evidence';out.mkdir(exist_ok=True);rows=[]\n\
        def record(name,fn):\n t=time.monotonic()\n try:v=fn();r=dict(test=name,ok=True,seconds=round(time.monotonic()-t,2),value=v)\n\
        \ except Exception as e:r=dict(test=name,ok=False,seconds=round(time.monotonic()-t,2),error=str(e),trace=traceback.format_exc())\n\
        \ rows.append(r);print(json.dumps(r,default=str),flush=True);(out/'results.json').write_text(json.dumps(rows,indent=2,default=str));return\
        \ r.get('value')\nb=LemonadeNpuBackend();record('enable',b.enable)\nm=next(m for m in b.catalog() if m.checkpoint=='qwen3.8-mtp:27b')\n\
        def download():\n last=-1\n for e in b.download(m.id):\n  if e.get('percent',0)>=last+10 or e.get('event') in ('complete','error'):print('DOWNLOAD',e,flush=True);last=e.get('percent',0)\n\
        \ return True\nrecord('download',download);record('load',lambda:b.load(m.id,context_length=4096).to_json())\n\nrecord('unload_before_terminal',b.unload)\n\
        flm=b._flm_binary();modeldir=b._flm_model_dir;b.shutdown()\ndef conpty():\n from winpty import PtyProcess\n import\
        \ subprocess,threading,re\n env=dict(os.environ,FLM_MODEL_PATH=str(modeldir),FLM_DISABLE_UPDATE_CHECK='1')\n p=PtyProcess.spawn(subprocess.list2cmdline([str(flm),'run',m.checkpoint,'--ctx-len','4096']),env=env,dimensions=(40,140))\n\
        \ chunks=[]\n def read():\n  try:\n   while p.isalive():\n    text=p.read(4096)\n    if text:chunks.append(text)\n\
        \  except (EOFError,OSError):pass\n thread=threading.Thread(target=read,daemon=True);thread.start()\n def waitfor(predicate,timeout):\n\
        \  deadline=time.monotonic()+timeout\n  while time.monotonic()<deadline:\n   text=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',\
        \ ''.join(chunks))\n   if predicate(text):return text\n   time.sleep(.2)\n  raise TimeoutError('ConPTY output: '+''.join(chunks)[-6000:])\n\
        \ try:\n  waitfor(lambda t:'>>>' in t,90)\n  p.write('What is 17 plus 25? Answer only the number.\\r\\n')\n  text=waitfor(lambda\
        \ t:'42' in t,180)\n  # Wait for the second prompt before sending the exit command.\n  text=waitfor(lambda t:t.count('>>>')>=2,60)\n\
        \  p.write('/bye\\r\\n')\n  waitfor(lambda t:not p.isalive(),30)\n  return {'output':text[-10000:],'exited':not p.isalive()}\n\
        \ finally:\n  (out/'conpty-transcript.txt').write_text(''.join(chunks),encoding='utf-8')\n  if p.isalive():p.terminate(force=True)\n\
        record('interactive_conpty_cli',conpty)\n\n'@ | Set-Content -Encoding UTF8 \"$env:RUNNER_TEMP/terminal.py\"\n& \"\
        $env:RUNNER_TEMP/fastflow-venv/Scripts/python.exe\" -u \"$env:RUNNER_TEMP/terminal.py\"\nif ($LASTEXITCODE -ne 0)\
        \ { exit $LASTEXITCODE }"
    - name: Upload terminal evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fastflow-terminal-windows
        path: ${{ runner.temp }}/fastflow-terminal/evidence
        retention-days: 7
