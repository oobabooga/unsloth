        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'fastflow-advanced';root.mkdir(exist_ok=True)\nos.environ['UNSLOTH_HOME']=str(root/'state');os.environ['UNSLOTH_STUDIO_HOME']=str(root/'state/studio')\n\
