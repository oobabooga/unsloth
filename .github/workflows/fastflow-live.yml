        \ import LemonadeNpuBackend\nout=root/'evidence';out.mkdir(exist_ok=True);results=[]\ndef record(name,fn):\n t=time.monotonic()\n\
        \ try:v=fn();row=dict(test=name,ok=True,seconds=round(time.monotonic()-t,2),value=v)\n except Exception as e:row=dict(test=name,ok=False,seconds=round(time.monotonic()-t,2),error=str(e),trace=traceback.format_exc())\n\
        \ results.append(row);print(json.dumps(row,default=str),flush=True);(out/'results.json').write_text(json.dumps(results,indent=2,default=str));return\
