name: "AMD CI: torch 2.11 vs 2.14.1 rocm7.2 timing A/B (unslothai/unsloth#14350)"

on:
  push:
    branches: [amd-ci-rocm72-torch214-perf]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  linux:
    name: "Linux gfx1151: ABBA timing, torch 2.11.0 vs 2.14.1 (rocm7.2)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    concurrency:
      group: amd-ci-gfx1151-gpu-rocm72-perf-14350
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "rocm72-perf"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran with no torch; every run records torch.__version__"

      - name: ABBA
        timeout-minutes: 220
        run: |
          set +e
          python3 -u amd_ci/probes/torch_perf_ab.py --work "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/perf"
          echo "probe rc=$?"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocm72-perf
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
