name: "AMD CI (Windows): studio_device_checks run.ps1 against a real Studio install"

on:
  push:
    branches: [amd-ci-devchecks-win]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  linux-control:
    name: "devchecks linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"

  windows:
    name: "devchecks on Windows (Studio install + run.ps1 quick)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "devchecks-windows"

      - name: Install Studio the normal way (hosted install.ps1)
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "$env:AMD_CI_WORK\out" | Out-Null
          $env:UNSLOTH_STUDIO_HOME = "$env:AMD_CI_WORK\studio"
          $env:UNSLOTH_SKIP_AUTOSTART = "1"
          $env:UNSLOTH_INSTALL_NO_ROLLBACK = "1"
          Add-Content -Path $env:GITHUB_ENV -Value "UNSLOTH_STUDIO_HOME=$env:UNSLOTH_STUDIO_HOME"
          Write-Host "RUNNER_OS reads '$env:RUNNER_OS'; machine $env:COMPUTERNAME; arch $env:PROCESSOR_ARCHITECTURE"
          $t = Get-Date
          & powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://unsloth.ai/install.ps1 | iex" *>&1 |
            Tee-Object -FilePath "$env:AMD_CI_WORK\out\studio_install.log" | Select-Object -Last 40 | Out-String | Write-Host
          Write-Host ("install took {0:N0} s" -f ((Get-Date) - $t).TotalSeconds)
          $py = "$env:UNSLOTH_STUDIO_HOME\unsloth_studio\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $py)) {
            Write-Host "FATAL: no Studio venv at $py; out\studio_install.log has the whole log"
            exit 1
          }
          & $py -c "import sys, importlib.util as u; print(sys.version); print('studio pkg', u.find_spec('studio').submodule_search_locations); print('pytest', u.find_spec('pytest') is not None)"

      - name: run.ps1 dry run, default discovery (UNSLOTH_STUDIO_HOME)
        run: |
          $ErrorActionPreference = "Continue"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\studio_device_checks\run.ps1" `
            -DryRun --work-dir "$env:AMD_CI_WORK\devchecks" --out "$env:AMD_CI_WORK\out\dry_default"
          Write-Host "dry run (default discovery) exit $LASTEXITCODE"

      - name: run.ps1 dry run, -StudioHome override with the env var cleared
        run: |
          $ErrorActionPreference = "Continue"
          $h = $env:UNSLOTH_STUDIO_HOME
          Remove-Item Env:\UNSLOTH_STUDIO_HOME
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\studio_device_checks\run.ps1" `
            -DryRun -StudioHome $h --work-dir "$env:AMD_CI_WORK\devchecks" --out "$env:AMD_CI_WORK\out\dry_override"
          Write-Host "dry run (-StudioHome) exit $LASTEXITCODE"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\studio_device_checks\run.ps1" `
            -DryRun -StudioHome "$env:AMD_CI_WORK\no_such_studio" --work-dir "$env:AMD_CI_WORK\devchecks" --out "$env:AMD_CI_WORK\out\dry_missing"
          Write-Host "dry run (missing home, expect exit 2) exit $LASTEXITCODE"

      - name: run.ps1 -Mode quick
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = "Continue"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\studio_device_checks\run.ps1" `
            -Mode quick --work-dir "$env:AMD_CI_WORK\devchecks" --out "$env:AMD_CI_WORK\out\quick"
          Write-Host "quick exit $LASTEXITCODE"
          Get-ChildItem -Recurse "$env:AMD_CI_WORK\out\quick" | Select-Object -First 80 | ForEach-Object { Write-Host $_.FullName }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devchecks-windows
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
