name: "staging-19355 ubuntu-latest"
on:
  push:
    branches: ["pr-19355-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_audio_cpp_runtime_specs.py studio/backend/tests/test_audio_token_detection.py studio/backend/tests/test_companion_listing_reuse.py studio/backend/tests/test_consent_gate.py studio/backend/tests/test_cosmos3_guardrail_preflight.py studio/backend/tests/test_export_absolute_paths.py studio/backend/tests/test_hf_offline_spellings.py studio/backend/tests/test_hub_token_caller_identity.py studio/backend/tests/test_hub_token_rejected_retry.py studio/backend/tests/test_llm_compressor_export_consent_flag.py studio/backend/tests/test_llm_compressor_export_probe.py studio/backend/tests/test_llmcompressor_shadow_source.py studio/backend/tests/test_mlx_load_hub_reads_ahead.py studio/backend/tests/test_mlx_reload_skips_redundant_waits.py studio/backend/tests/test_offline_gguf_cache_fallback.py studio/backend/tests/test_offline_inference_parent.py studio/backend/tests/test_offline_local_cache_discovery.py studio/backend/tests/test_trainer_load_error_traceback.py studio/backend/tests/test_trainer_modelscope_gate.py studio/backend/tests/test_transformers_latest.py studio/backend/tests/test_transformers_version.py studio/backend/tests/test_transformers_version_optional_tiktoken.py studio/backend/tests/test_trc_approval_cache.py studio/backend/tests/test_untrusted_unc_paths.py studio/backend/tests/test_vision_cache.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found. Please install .*)$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found)/ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. (torch|unsloth_zoo|transformers) not found" pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
