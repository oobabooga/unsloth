name: "AMD CI: validate PR 19933"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-g22-g20z-lnx]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "19933"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  AMD1_BASE_OVERRIDE: "a8fb477bf85d914f1a4cf248c874ba0d505b43eb"
  AMD1_HEAD_OVERRIDE: "3f4a7e5fc52ae85e20cbff8c0d7c17f12a9e7166"
  MERGED: "0"
  # Set by scaffold.py --patch: base = PATCH_BASE, head = PATCH_BASE plus this diff (relative to the checkout).
  PATCH_BASE: ""
  PATCH_FILE: ""
  PATCH_SHA256: "__PATCH_SHA256__"

jobs:

  gpu:
    name: "PR 19933 GPU check (shared GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 600
    # --shared-gpu: no concurrency group, so a co-tenant may share the card.
    # Correctness only; capability.py reports `exclusive_gpu` as a gap.
    env:
      AMD_CI_SHARED_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr19933-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          if [ -n "$PATCH_FILE" ]; then ARGS="--patch-base $PATCH_BASE --patch $GITHUB_WORKSPACE/$PATCH_FILE --patch-sha256 $PATCH_SHA256"; fi
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and host gate (no Studio)
        run: |
          set -euo pipefail
          echo "AMD_CI_PY=$(command -v python3)" >> "$GITHUB_ENV"
          # No torch here, so rocm/gpu read UNDETERMINED: the criteria gates prove the GPU ran.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/train5_probe.py \
            --criteria amd_ci/criteria/amdgate_rocm.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --unit g20z --state-repo unsloth --transformers 5.24.0 --trl 1.18.0 --cells env,flm16 --companion-repo https://github.com/unslothai/unsloth-zoo --companion-base 31fab5c7bd56f1a4887109824c1b9d66c16829d6 --companion-head c2b1a436e91161dd0d7301283ca9c01e60f7d515 --venv "$AMD_CI_WORK/tvenv" --tests tests/test_bf16_stochastic_rounding_ddp_gloo.py --repeat flm16 --companion-tests tests/test_block_swap_disk.py tests/test_block_swap_layer_major.py tests/test_cpu_ce_head_cast_once.py tests/test_cpu_ce_head_grad_inplace.py tests/test_cpu_ce_softcap.py tests/test_cpu_dpo_kto_chunked_logps.py tests/test_cpu_gguf_load_trainable.py tests/test_cpu_gguf_tokenizer.py tests/test_cpu_orpo_chunked_logps.py tests/test_csm_merge_frame_padding.py tests/test_deepseek_v41_indexer_replay.py tests/test_grpo_packed_grad_oom_recovery.py tests/test_grpo_packed_verify_raw_logits.py tests/test_grpo_pad_is_eos_mask.py tests/test_grpo_policy_token_caps.py tests/test_grpo_score_centering.py tests/test_grpo_score_centering_packed.py tests/test_higher_precision_layernorm_scope.py tests/test_inductor_nonowning_inplace.py tests/test_mixed_gpu_operand_device.py tests/test_moe_gc_same_routing.py tests/test_moe_grouped_mm_probe_all_devices.py tests/test_moe_grouped_mm_probe_not_at_import.py tests/test_moe_grouped_triton_generic.py tests/test_moe_rocm_gfx1151_prefers_unsloth_triton.py tests/test_moe_triton_autotune_dims.py tests/test_moe_triton_compute_dtype.py tests/test_moe_triton_config_cache_dtype.py tests/test_moe_triton_down_lora_roworder.py tests/test_moe_triton_half_input.py tests/test_responses_only_tool_results.py tests/test_routing_replay_sigmoid.py tests/test_safetensors_pread.py tests/test_speculative_mtp.py tests/test_speculative_trainer.py tests/test_temporary_patches_imports.py tests/test_triton_fp_fusion.py tests/test_triton_moe_transposed_dims.py tests/test_vllm_renamed_lora_adapter.py tests/test_block_swap.py tests/test_block_swap_cuda_error.py tests/te