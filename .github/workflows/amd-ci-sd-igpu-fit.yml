name: "AMD CI: sd.cpp auto-fit on integrated GPUs, master aba3a1c5 vs master + igpu_fit.patch on gfx1151"

# base = unslothai/stable-diffusion.cpp master aba3a1c5; head = base + sdrc/igpu_fit.patch (src/core/backend_fit.cpp only).
# Vulkan builds run on GitHub-hosted runners with the prebuilt leg recipe; the ROCm builds (gfx1151 only) run on the box.
# Each backend's base and head run in ONE job on ONE machine, interleaved per rep.

on:
  push:
    branches: [amd-ci-sd-igpu-fit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vk-linux:
    name: "build vk linux ${{ matrix.label }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: base, patch: "0"}
          - {label: head, patch: "1"}
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: 241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf
      SHA: aba3a1c1e0c61a20f3db0c41641704cda279d043
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Vulkan build deps (as the prebuilt leg)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev xz-utils ninja-build
          archive="$RUNNER_TEMP/vulkansdk.tar.xz"; sdk_root="$RUNNER_TEMP/vulkansdk"
          curl --fail --location --retry 3 --output "$archive" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          echo "$VULKAN_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$sdk_root" && tar -xJf "$archive" -C "$sdk_root" --strip-components=1
          echo "VULKAN_SDK=$sdk_root/x86_64" >> "$GITHUB_ENV"
          echo "$sdk_root/x86_64/bin" >> "$GITHUB_PATH"
      - name: Build
        run: bash sdrc/build.sh ${{ matrix.label }} "$SHA" ${{ matrix.patch }} vk "$RUNNER_TEMP/out/${{ matrix.label }}"
      - name: Pack (tar keeps the exec bits)
        run: tar -C "$RUNNER_TEMP/out" -cf "$RUNNER_TEMP/vk-${{ matrix.label }}.tar" ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with: { name: "vk-${{ matrix.label }}", path: "${{ runner.temp }}/vk-${{ matrix.label }}.tar", retention-days: 5 }

  build-vk-win:
    name: "build vk windows ${{ matrix.label }}"
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: base, patch: "0"}
          - {label: head, patch: "1"}
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c
      SHA: aba3a1c1e0c61a20f3db0c41641704cda279d043
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: choco install ninja --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Install Vulkan SDK (as the prebuilt leg)
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SHA256) { throw 'Vulkan SDK installer SHA256 mismatch' }
          $install = Start-Process -FilePath $installer -ArgumentList @('--root', "`"$sdkRoot`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdkRoot"
          Add-Content $env:GITHUB_PATH "$sdkRoot\Bin"
      - name: Build
        run: ./sdrc/build_win.ps1 -Label ${{ matrix.label }} -Sha $env:SHA -Patch ${{ matrix.patch }} -Out "$env:RUNNER_TEMP/out/${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with: { name: "vkwin-${{ matrix.label }}", path: "${{ runner.temp }}/out/${{ matrix.label }}", retention-days: 5 }

  gpu-linux:
    name: "gfx1151 Linux: ROCm + RADV, base vs head"
    needs: [build-vk-linux]
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    concurrency: {group: amd-ci-gfx1151-gpu, cancel-in-progress: false}
    env:
      ROCM_VERSION: "7.14.0"
      SHA: aba3a1c1e0c61a20f3db0c41641704cda279d043
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "sd-igpu-fit-linux"
      - name: Host gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require linux vulkan --out "$AMD_CI_WORK/out/host.json"
          python3 amd_ci/lib/capability.py > "$AMD_CI_WORK/out/capability.json" 2>&1 || true
          (vulkaninfo --summary 2>&1 | head -60) > "$AMD_CI_WORK/out/vulkaninfo.txt" || true
          (rocminfo 2>&1 | grep -E "Marketing|gfx" | head -10) > "$AMD_CI_WORK/out/rocminfo.txt" || true
          free -m > "$AMD_CI_WORK/out/free.txt" || true
          uname -n
      - name: Install ROCm (TheRock wheels, gfx1151) + build base/head
        timeout-minutes: 90
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK"
          python3 -m venv .rocm
          . .rocm/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q ninja pillow numpy
          python -m pip install -q --no-cache-dir --index-url https://repo.amd.com/rocm/whl-multi-arch/ \
            "rocm[libraries,devel,device-gfx1151]==${ROCM_VERSION}"
          ROCM_PATH="$(rocm-sdk path --root)"
          export ROCM_PATH HIP_PATH="$ROCM_PATH" CMAKE_PREFIX_PATH="$(rocm-sdk path --cmake)"
          export PATH="$(rocm-sdk path --bin):$AMD_CI_WORK/.rocm/bin:$PATH"
          echo "ROCM_LIB=$ROCM_PATH/lib" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          bash sdrc/build.sh base "$SHA" 0 rocm "$AMD_CI_WORK/bin/rocm/base" 2>&1 | tail -5
          bash sdrc/build.sh head "$SHA" 1 rocm "$AMD_CI_WORK/bin/rocm/head" 2>&1 | tail -8
      - uses: actions/download-artifact@v4
        with: { path: "${{ runner.temp }}/dl", pattern: "vk-*" }
      - name: Unpack vk
        run: |
          set -euo pipefail
          mkdir -p "$AMD_CI_WORK/bin/vk"
          for l in base head; do tar -C "$AMD_CI_WORK/bin/vk" -xf "$RUNNER_TEMP/dl/vk-$l/vk-$l.tar"; done
          cat "$AMD_CI_WORK"/bin/vk/*/srcinfo.txt
      - name: "RADV: base vs head"
        timeout-minutes: 90
        run: |
          set +e
          V="$AMD_CI_WORK/bin/vk"
          "$AMD_CI_WORK/.rocm/bin/python" -u sdrc/run.py --bin base=$V/base --bin head=$V/head \
            --models "$AMD_CI_WORK/models" --out "$AMD_CI_WORK/out/vk" --reps 3 2>&1 | tail -150
          exit 0
      - name: "ROCm: base vs head"
        timeout-minutes: 90
        run: |
          set +e
          R="$AMD_CI_WORK/bin/rocm"
          LD_LIBRARY_PATH="$ROCM_LIB" "$AMD_CI_WORK/.rocm/bin/python" -u sdrc/run.py --bin base=$R/base --bin head=$R/head \
            --models "$AMD_CI_WORK/models" --out "$AMD_CI_WORK/out/rocm" --reps 3 2>&1 | tail -150
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sd-igpu-fit-linux
          path: |
            ${{ env.AMD_CI_WORK }}/out
            !${{ env.AMD_CI_WORK }}/out/**/*.png
          retention-days: 7
          if-no-files-found: warn

  linux-control:
    name: "linux control (selector diagnosis for the Windows job)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "machine: $(uname -n)"

  gpu-windows:
    name: "gfx1151 Windows AMD driver Vulkan: base vs head"
    needs: [build-vk-win]
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    # Shared GPU (no amd-ci-gfx1151-gpu group): base and head are interleaved per rep on one machine,
    # so a co-tenant hits both arms alike. exclusive_gpu is a gap for this job.
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "sd-igpu-fit-windows"
      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_OS=[$env:RUNNER_OS]"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe", "C:\Program Files\Python311\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) { Write-Host "FATAL: no system Python"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"
      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\capability.py" 2>&1 | Out-File -Encoding ascii "$env:AMD_CI_WORK\out\capability.json"
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List | Out-File -Encoding ascii "$env:AMD_CI_WORK\out\gpu.txt"
          Get-Content "$env:AMD_CI_WORK\out\gpu.txt"
      - uses: actions/download-artifact@v4
        with: { path: "${{ runner.temp }}/dl", pattern: "vkwin-*" }
      - name: Venv
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          & "$env:AMD_CI_WORK\venv\Scripts\python.exe" -m pip install -q pillow numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\dl\vkwin-base\srcinfo.txt", "$env:RUNNER_TEMP\dl\vkwin-head\srcinfo.txt"
      - name: "Vulkan (AMD Windows driver): base vs head"
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = "Continue"
          $d = "$env:RUNNER_TEMP\dl"
          & "$env:AMD_CI_WORK\venv\Scripts\python.exe" -u sdrc\run.py --bin "base=$d\vkwin-base" --bin "head=$d\vkwin-head" `
            --models "$env:AMD_CI_WORK\models" --out "$env:AMD_CI_WORK\out\vkwin" --reps 3 2>&1 | Select-Object -Last 150
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sd-igpu-fit-windows
          path: |
            ${{ env.AMD_CI_WORK }}/out
            !${{ env.AMD_CI_WORK }}/out/**/*.png
          retention-days: 7
          if-no-files-found: warn
