name: SAC 4551 unit tests on Windows

on:
  push:
    branches: [sac4551-tests]

permissions: {}

jobs:
  tests:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Clone
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --branch sac4551-ab-fix https://github.com/oobabooga/unsloth C:\t\src
          git -C C:\t\src log -1 --format='%H %s'
      - name: PowerShell classifier test (fix)
        shell: pwsh
        working-directory: C:\t\src
        run: pwsh -NoProfile -File tests/studio/test_application_control_cli_fallback.ps1
      - name: PowerShell classifier test with main's install.ps1 (expected to fail)
        shell: pwsh
        working-directory: C:\t\src
        run: |
          git show HEAD~1:install.ps1 | Set-Content -LiteralPath install.ps1 -Encoding utf8NoBOM
          pwsh -NoProfile -File tests/studio/test_application_control_cli_fallback.ps1 | Select-String -Pattern 'FAIL|failure'
          "exit $LASTEXITCODE"
          git checkout -- install.ps1
          exit 0
      - name: Python launcher tests on Windows
        shell: powershell
        working-directory: C:\t\src
        run: |
          python -m pip install --quiet pytest typer
          python -m pytest -q tests/python/test_windows_studio_update_launcher.py -p no:cacheprovider
