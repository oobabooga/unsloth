name: "AMD CI: test-backend-ops from unslothai/llama.cpp#146 on the shipped b11160 Vulkan and ROCm bundles (gfx1151)"

# unslothai/llama.cpp#146 ships test-backend-ops inside the Vulkan and ROCm
# prebuilts so a user can check every ggml op on their GPU against the CPU. The
# motivation is garbled output on Strix Halo (8060S, gfx1151) that we cannot
# reproduce. RX 6500 XT passed 18952/18952; RX 5700 XT failed 2 (MUL_MAT iq4_xs,
# m=16 n=8 k=256/4096). This asks the same of gfx1151.
#
# Built the way the PR ships it: test-backend-ops compiled from the release's
# own source tarball, then dropped next to the SHIPPED libs of the release
# bundles, so the kernels under test are the ones users download, not a local
# rebuild. The exe is backend-DL, so it carries no GPU code of its own.
#
#   build  cmake/ninja from pip (no root here), compiles one target, no GPU lock
#   gpu    exclusive; Vulkan0 on the vulkan bundle, then ROCm0 on the gfx1151 bundle

on:
  push:
    branches: [amd-ci-llamacpp-tbo146]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAG: "b11160-mix-a6922cc"
  REL: "https://github.com/unslothai/llama.cpp/releases/download/b11160-mix-a6922cc"

jobs:

  build:
    name: "build test-backend-ops from the b11160 source tarball"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 90
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "tbo146-build"

      - name: Toolchain
        run: |
          set +e
          for t in gcc g++ cc c++ clang clang++ cmake ninja make python3 curl git; do
            printf '%-8s ' "$t"; command -v "$t" || echo MISSING
          done
          g++ --version 2>&1 | head -1
          python3 -m venv "$AMD_CI_WORK/venv" && "$AMD_CI_WORK/venv/bin/pip" install -q cmake ninja
          echo "PATH=$AMD_CI_WORK/venv/bin:$PATH" >> "$GITHUB_ENV"
          "$AMD_CI_WORK/venv/bin/cmake" --version | head -1
          "$AMD_CI_WORK/venv/bin/ninja" --version

      - name: Source
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK"
          curl -fsSL -o src.tgz "$REL/llama.cpp-source-$TAG.tar.gz"
          mkdir -p src && tar -xzf src.tgz -C src --strip-components=1
          sha256sum src.tgz | tee out/source.sha256

      - name: Build
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK"
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_RPC=ON \
            -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            2>&1 | tail -25
          cmake --build build -j "$(nproc)" --target test-backend-ops 2>&1 | tail -15
          mkdir -p out/exe && cp build/bin/test-backend-ops out/exe/
          ls -la out/exe

      - uses: actions/upload-artifact@v4
        with:
          name: tbo146-exe
          path: ${{ env.AMD_CI_WORK }}/out/exe
          retention-days: 7
          if-no-files-found: error

  gpu:
    name: "test-backend-ops ROCm0 per op + SOLVE_TRI rocBLAS check, gfx1151 (exclusive)"
    needs: build
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "tbo146-gpu"

      - uses: actions/download-artifact@v4
        with:
          name: tbo146-exe
          path: ${{ env.AMD_CI_WORK }}/exe

      - name: Host facts
        run: |
          set +e
          O="$AMD_CI_WORK/out"
          { cat /etc/os-release; echo; uname -a; echo; free -g; } > "$O/host.txt" 2>&1
          { vulkaninfo --summary; } > "$O/vulkaninfo.txt" 2>&1
          { rocminfo; } > "$O/rocminfo.txt" 2>&1
          { cat /sys/module/amdgpu/version; ls /opt/rocm* -d; cat /opt/rocm/.info/version; } > "$O/rocm_version.txt" 2>&1
          cat "$O/host.txt"
          grep -E "driverName|driverInfo|deviceName|apiVersion" "$O/vulkaninfo.txt" | head -12
          grep -m3 -E "gfx|Marketing" "$O/rocminfo.txt"
          cat "$O/rocm_version.txt"

      - name: Fetch the shipped bundles and drop the exe in
        timeout-minutes: 30
        run: |
          set -eu
          python3 amd_ci/lib/fetch_llamacpp.py --url "$REL/app-$TAG-linux-x64-rocm-gfx1151.tar.gz" \
            --dest "$AMD_CI_WORK/lcpp/rocm" --out "$AMD_CI_WORK/out/bin_rocm.json"
          python3 amd_ci/lib/emit_bin_env.py "$AMD_CI_WORK/out" | tee -a "$GITHUB_ENV"
          eval "$(python3 amd_ci/lib/emit_bin_env.py "$AMD_CI_WORK/out" | grep -v '^#')"
          for D in "$ROCM_BIN"; do
            cp "$AMD_CI_WORK/exe/test-backend-ops" "$D/" && chmod +x "$D/test-backend-ops"
            ls "$D" | grep -E '^lib(ggml|llama)' | tr '\n' ' '; echo
          done

      - name: Which rocBLAS the bundle loads, and what kernels it carries
        if: always()
        run: |
          set +e
          O="$AMD_CI_WORK/out/rocblas.txt"
          {
            echo "## bundle top level"; ls "$ROCM_BIN" | grep -vE '^llama-' | tr '\n' ' '; echo
            echo "## ldd libggml-hip"; LD_LIBRARY_PATH="$ROCM_BIN" ldd "$ROCM_BIN/libggml-hip.so" | grep -iE 'rocblas|hipblas|amdhip|hsa|rocsolver'
            for L in "$ROCM_BIN"/rocblas/library "$ROCM_BIN"/lib/rocblas/library /opt/rocm/lib/rocblas/library; do
              [ -d "$L" ] || { echo "## $L: absent"; continue; }
              echo "## $L: $(ls "$L" | wc -l) files, gfx1151: $(ls "$L" | grep -c gfx1151)"
              ls "$L" | grep gfx1151 | head -8
            done
            for S in "$ROCM_BIN"/librocblas.so* /opt/rocm/lib/librocblas.so.*.*; do
              [ -f "$S" ] || continue
              echo "## $S offload targets:"; strings "$S" | grep -oE 'amdgcn-amd-amdhsa--gfx[0-9a-z]+' | sort -u | tr '\n' ' '; echo
            done
          } > "$O" 2>&1
          cat "$O"

      - name: SOLVE_TRI repro, shipped rocBLAS vs the host's ROCm 7.2.1 rocBLAS
        if: always()
        timeout-minutes: 20
        run: |
          set +e
          cd "$ROCM_BIN"
          mkdir -p "$AMD_CI_WORK/sysrb"
          for f in /opt/rocm/lib/librocblas.so*; do ln -sf "$f" "$AMD_CI_WORK/sysrb/"; done
          for V in shipped host; do
            LP="$ROCM_BIN"; [ "$V" = host ] && LP="$AMD_CI_WORK/sysrb:$ROCM_BIN"
            echo "== $V rocBLAS (LD_LIBRARY_PATH=$LP)"
            LD_LIBRARY_PATH="$LP" timeout 600 ./test-backend-ops test -b ROCm0 -o SOLVE_TRI 2>&1 \
              | sed -E 's/\x1b\[[0-9;]*m//g' | grep -vE 'graph warmup|^\[New LWP|^#[0-9]' > "$AMD_CI_WORK/out/solve_tri_$V.txt"
            echo "exit=${PIPESTATUS[0]}" | tee -a "$AMD_CI_WORK/out/solve_tri_$V.txt"
            grep -E 'SOLVE_TRI|tests passed|Backend ROCm0|error' "$AMD_CI_WORK/out/solve_tri_$V.txt" | head -30
          done

      - name: ROCm0, one op per process so a crash only takes out its own op
        if: always()
        timeout-minutes: 240
        run: |
          set +e
          cd "$ROCM_BIN"
          D="$AMD_CI_WORK/out/rocm_ops"; mkdir -p "$D"
          S="$AMD_CI_WORK/out/rocm_per_op.tsv"
          printf 'op\texit\tpassed\tfail_lines\n' > "$S"
          for OP in ABS SGN NEG STEP TANH ELU RELU SIGMOID GELU GELU_QUICK SILU HARDSWISH HARDSIGMOID EXP EXPM1 SOFTPLUS GELU_ERF FLOOR CEIL ROUND TRUNC RELU_SQR GELU_MUL SILU_MUL SIGMOID_MUL SOFTPLUS_MUL SNAKE_FUSE DSV4_HC_COMB DSV4_HC_PRE DSV4_HC_POST REGLU GEGLU SWIGLU GEGLU_ERF GEGLU_QUICK SWIGLU_OAI SWIGLU_CLAMP GET_ROWS GET_ROWS_BACK SET_ROWS ROPE_SET_ROWS POOL_2D POOL_1D IM2COL IM2COL_3D CONV_2D CONV_2D_DW CONV_3D CONV_TRANSPOSE_1D COL2IM_1D CONV_TRANSPOSE_2D COUNT_EQUAL ARGMAX REPEAT REPEAT_BACK DUP SET CPY CONT ADD SUB MUL DIV SCALE SOFTCAP SILU_BACK NORM RMS_NORM NORM_SCALE RMS_NORM_SCALE RMS_NORM_BACK L2_NORM L2_NORM_BATCH RMS_NORM_MUL_ROPE RMS_NORM_MUL_ADD NORM_MUL_ADD ADD_RMS_NORM ADD_ADD SSM_CONV SSM_CONV_BIAS_SILU SSM_SCAN SSM_SCAN_ROLLBACK RWKV_WKV6 RWKV_WKV7 GATED_LINEAR_ATTN MUL_MAT_HADAMARD MUL_MAT MUL_MAT_ID MUL_MAT_ID_FUSION OUT_PROD ADD_ID SQR SQRT LOG SIN COS CLAMP LEAKY_RELU DIAG_MASK_INF SOFT_MAX SOFT_MAX_BACK ROPE ROPE_BACK CONCAT ARGSORT TOP_K TOPK_QSA UPSCALE SUM MEAN SUM_ROWS GROUP_NORM GROUP_NORM_MUL_ADD ACC PAD PAD_REFLECT_1D ROLL ARANGE TIMESTEP_EMBEDDING CUMSUM XIELU TRI FILL DIAG SOLVE_TRI FLASH_ATTN_EXT FLASH_ATTN_EXT_BANDED CROSS_ENTROPY_LOSS CROSS_ENTROPY_LOSS_BACK OPT_STEP_ADAMW OPT_STEP_SGD MUL_MAT_VEC_FUSION TOPK_MOE MOE_REDUCE GATED_DELTA_NET GATED_DELTA_NET_CACHE_FUSION LIGHTNING_INDEXER; do
            LD_LIBRARY_PATH="$ROCM_BIN" timeout 1800 ./test-backend-ops test -b ROCm0 -o "$OP" 2>&1 \
              | sed -E 's/\x1b\[[0-9;]*m//g' > "$D/$OP.txt"
            rc=${PIPESTATUS[0]}
            p=$(grep -oE '[0-9]+/[0-9]+ tests passed' "$D/$OP.txt" | head -1 | cut -d' ' -f1)
            printf '%s\t%s\t%s\t%s\n' "$OP" "$rc" "${p:-none}" "$(grep -c FAIL "$D/$OP.txt")" | tee -a "$S"
          done
          cat "$D"/*.txt > "$AMD_CI_WORK/out/strix-rocm-per-op.txt"

      - name: Report
        if: always()
        run: |
          set +e
          cd "$AMD_CI_WORK/out"
          {
            echo '```'
            grep -m2 -E "found [0-9]+ ROCm|Device 0:" strix-rocm-per-op.txt
            awk -F'\t' 'NR>1 && $3!="none"{split($3,a,"/");p+=a[1];t+=a[2]} END{print p"/"t" passed across ops that completed"}' rocm_per_op.tsv
            echo "ops that did not exit 0:"; awk -F'\t' 'NR>1 && $2!=0' rocm_per_op.tsv
            echo "FAIL lines: $(grep -c FAIL strix-rocm-per-op.txt)"
            grep FAIL strix-rocm-per-op.txt | head -200
            echo "iq4_xs RDNA1 cases:"
            grep -E 'MUL_MAT\(type_a=iq4_xs,type_b=f32,m=16,n=8,k=(256|4096),bs=\[1,1\],nr=\[1,1\],per=\[0,1,2,3\],k_v=0,o=1' strix-rocm-per-op.txt
            echo '```'
          } | tee REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tbo146-gfx1151-rocm-per-op
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
