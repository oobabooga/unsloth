name: "AMD CI: two-machine LAN probe for the home cluster link"

# Can two strix-halo boxes reach each other, and does UDP multicast (239.255.77.77:50079, TTL 1, the
# cluster discovery group) cross between them? Three jobs run at once: probe-a and probe-b on Linux,
# probe-w on Windows (best effort). Each starts nonce-gated listeners + multicast beacons, publishes
# its addresses as an artifact, finds the others' artifacts through the API with its own run token,
# and tests TCP / UDP / RTT / bandwidth against them. No GPU is touched (no GPU concurrency group),
# no secrets are used, every listener lives only for the probe window and answers only proofs of
# its per-job nonce. The summary job writes VERDICT.md:
# SAME_L2_MULTICAST_OK / UNICAST_ONLY / ISOLATED / NOT_CONCURRENT / SAME_MACHINE.

on:
  push:
    branches: [amd-ci-homelink-lan-probe]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HIP_VISIBLE_DEVICES: ""
  ROCR_VISIBLE_DEVICES: ""

jobs:
  probe-a:
    name: "LAN probe a (Linux)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "lanprobe-a"

      - name: Start listeners
        run: |
          set -uo pipefail
          D="$AMD_CI_WORK/out/lan"; mkdir -p "$D"
          setsid python3 "$GITHUB_WORKSPACE/amd_ci/lanprobe/lanprobe.py" serve --role a --out-dir "$D" --window-s 900 > "$D/serve.stdout" 2>&1 < /dev/null &
          echo $! > "$D/serve.pid"
          for i in $(seq 60); do [ -s "$D/self.json" ] && break; sleep 0.5; done
          cat "$D/serve.stdout"; test -s "$D/self.json" || { echo "FATAL: listener did not start"; exit 1; }
          echo "runner: ${RUNNER_NAME:-?} host: $(hostname)"; ip -br addr; ip route show default

      - uses: actions/upload-artifact@v4
        with:
          name: lanprobe-self-a-${{ github.run_attempt }}
          path: ${{ env.AMD_CI_WORK }}/out/lan/self.json
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Find peers and test
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/amd_ci/lanprobe/lanprobe.py" client --role a --peers b,w --linux-peers b --out-dir "$AMD_CI_WORK/out/lan"

      - name: Stop and collect
        if: always()
        run: |
          set +e
          D="$AMD_CI_WORK/out/lan"; touch "$D/STOP"
          PID=$(cat "$D/serve.pid" 2>/dev/null)
          for i in $(seq 30); do [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null || break; sleep 0.5; done
          [ -n "$PID" ] && kill "$PID" 2>/dev/null
          python3 "$GITHUB_WORKSPACE/amd_ci/lanprobe/lanprobe.py" collect --out-dir "$D"
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lanprobe-result-a-${{ github.run_attempt }}
          path: |
            ${{ env.AMD_CI_WORK }}/out/lan/result.json
            ${{ env.AMD_CI_WORK }}/out/lan/serve.stdout
          retention-days: 7
          overwrite: true

  probe-b:
    name: "LAN probe b (Linux)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "lanprobe-b"

      - name: Start listeners
        run: |
          set -uo pipefail
          D="$AMD_CI_WORK/out/lan"; mkdir -p "$D"
          setsid python3 "$GITHUB_WORKSPACE/amd_ci/lanprobe/lanprobe.py" serve --role b --out-dir "$D" --window-s 900 > "$D/serve.stdout" 2>&1 < /dev/null &
          echo $! > "$D/serve.pid"
          for i in $(seq 60); do [ -s "$D/self.json" ] && break; sleep 0.5; done
          cat "$D/serve.stdout"; test -s "$D/self.json" || { echo "FATAL: listener did not start"; exit 1; }
          echo "runner: ${RUNNER_NAME:-?} host: $(hostname)"; ip -br addr; ip route show default

      - uses: actions/upload-artifact@v4
        with:
          name: lanprobe-self-b-${{ github.run_attempt }}
          path: ${{ env.AMD_CI_WORK }}/out/lan/self.json
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Find peers and test
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/amd_ci/lanprobe/lanprobe.py" client --role b --peers a,w --linux-peers a --out-dir "$AMD_CI_WORK/out/lan"

      - name: Stop and collect
        if: always()
        run: |
          set +e
          D="$AMD_CI_WORK/out/lan"; touch "$D/STOP"
          PID=$(cat "$D/serve.pid" 2>/dev/null)
          for i in $(seq 30); do [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null || break; sleep 0.5; done
          [ -n "$PID" ] && kill "$PID" 2>/dev/null
          python3 "$GITHUB_WORKSPACE/amd_ci/lanprobe/lanprobe.py" collect --out-dir "$D"
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lanprobe-result-b-${{ github.run_attempt }}
          path: |
            ${{ env.AMD_CI_WORK }}/out/lan/result.json
            ${{ env.AMD_CI_WORK }}/out/lan/serve.stdout
          retention-days: 7
          overwrite: true

  probe-w:
    name: "LAN probe w (Windows, best effort)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        shell: powershell
        run: .\amd_ci\lib\preamble.ps1 -Name "lanprobe-w"

      - name: Start listeners
        shell: powershell
        run: |
          $D = Join-Path $env:AMD_CI_WORK "out\lan"
          New-Item -ItemType Directory -Force -Path $D | Out-Null
          $py = "C:\Program Files\Python312\python.exe"
          $script = Join-Path $env:GITHUB_WORKSPACE "amd_ci\lanprobe\lanprobe.py"
          $p = Start-Process -FilePath $py -ArgumentList @("`"$script`"", "serve", "--role", "w", "--out-dir", "`"$D`"", "--window-s", "900") -RedirectStandardOutput (Join-Path $D "serve.stdout") -RedirectStandardError (Join-Path $D "serve.stderr") -WindowStyle Hidden -PassThru
          Set-Content -Path (Join-Path $D "serve.pid") -Value $p.Id -Encoding ascii
          for ($i = 0; $i -lt 60; $i++) { if (Test-Path (Join-Path $D "self.json")) { break }; Start-Sleep -Milliseconds 500 }
          Get-Content (Join-Path $D "serve.stdout") -ErrorAction SilentlyContinue
          Get-Content (Join-Path $D "serve.stderr") -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $D "self.json"))) { Write-Host "FATAL: listener did not start"; exit 1 }
          Write-Host "runner: $env:RUNNER_NAME host: $env:COMPUTERNAME"
          ipconfig | Select-String -Pattern "IPv4|adapter"

      - uses: actions/upload-artifact@v4
        with:
          name: lanprobe-self-w-${{ github.run_attempt }}
          path: ${{ env.AMD_CI_WORK }}/out/lan/self.json
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Find peers and test
        shell: powershell
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          $D = Join-Path $env:AMD_CI_WORK "out\lan"
          & "C:\Program Files\Python312\python.exe" (Join-Path $env:GITHUB_WORKSPACE "amd_ci\lanprobe\lanprobe.py") client --role w --peers a,b --out-dir $D
          exit $LASTEXITCODE

      - name: Stop and collect
        if: always()
        shell: powershell
        run: |
          $D = Join-Path $env:AMD_CI_WORK "out\lan"
          New-Item -ItemType File -Force -Path (Join-Path $D "STOP") | Out-Null
          $procId = Get-Content (Join-Path $D "serve.pid") -ErrorAction SilentlyContinue
          if ($procId) {
            Wait-Process -Id $procId -Timeout 15 -ErrorAction SilentlyContinue
            Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
          }
          & "C:\Program Files\Python312\python.exe" (Join-Path $env:GITHUB_WORKSPACE "amd_ci\lanprobe\lanprobe.py") collect --out-dir $D
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lanprobe-result-w-${{ github.run_attempt }}
          path: |
            ${{ env.AMD_CI_WORK }}/out/lan/result.json
            ${{ env.AMD_CI_WORK }}/out/lan/serve.stdout
            ${{ env.AMD_CI_WORK }}/out/lan/serve.stderr
          retention-days: 7
          overwrite: true

  summary:
    name: "LAN probe verdict"
    needs: [probe-a, probe-b, probe-w]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/download-artifact@v4
        with:
          pattern: lanprobe-result-*-${{ github.run_attempt }}
          path: results

      - name: Verdict
        run: |
          set -uo pipefail
          python3 amd_ci/lanprobe/lanprobe.py summarize --in results --out verdict
          cat verdict/VERDICT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lanprobe-verdict-${{ github.run_attempt }}
          path: verdict
          retention-days: 7
          overwrite: true
