name: "AMD CI (Windows): sd.cpp PR recheck (#37 #38) on gfx1151"

# Builds run on GitHub-hosted runners with the exact unsloth-sd-prebuilt.yml leg recipes, then the
# gfx1151 boxes run base and head of every item in ONE job on ONE machine (renders interleaved per rep).
#   vk   : #35 base (344a3b66) vs #37 head (030a7999) vs #38 head (a2c3b975), Linux RADV + Windows AMD driver
#   cpu  : #35 base vs #48 head (0ad6060c, CPU stack tip) on Zen 5, Linux CPU-all-variants leg
#   rocm : #14's build-linux-rocm recipe on current master (aba3a1c5); #14 itself conflicts with master

on:
  push:
    branches: [amd-ci-sdrc-amd-win]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vk-win:
    name: "build vk windows ${{ matrix.label }}"
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: base, pr: "35", sha: 344a3b663b31612586f9e9a0f3582eef385fa73c}
          - {label: h37, pr: "37", sha: 030a7999d2dae43e27c5dd10aee87d1e12a378ef}
          - {label: h38, pr: "38", sha: a2c3b975a261d745d7a5ff9f5020c602c9a2df70}
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: choco install ninja --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Install Vulkan SDK (as the prebuilt leg)
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SHA256) { throw 'Vulkan SDK installer SHA256 mismatch' }
          $install = Start-Process -FilePath $installer -ArgumentList @('--root', "`"$sdkRoot`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdkRoot"
          Add-Content $env:GITHUB_PATH "$sdkRoot\Bin"
      - name: Build
        run: ./sdrc/build_win.ps1 -Label ${{ matrix.label }} -Pr ${{ matrix.pr }} -Sha ${{ matrix.sha }} -Out "$env:RUNNER_TEMP/out/${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with: { name: "vkwin-${{ matrix.label }}", path: "${{ runner.temp }}/out/${{ matrix.label }}", retention-days: 5 }

  linux-control:
    name: "linux control (selector diagnosis for the Windows job)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "machine: $(uname -n)"

  gpu-windows:
    name: "gfx1151 Windows 11: Vulkan AMD driver (#35/#37/#38)"
    needs: [build-vk-win]
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "sdrc-windows"
      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe", "C:\Program Files\Python311\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) { Write-Host "FATAL: no system Python"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"
      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\capability.py" 2>&1 | Out-File -Encoding ascii "$env:AMD_CI_WORK\out\capability.json"
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List | Out-File -Encoding ascii "$env:AMD_CI_WORK\out\gpu.txt"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-File -Encoding ascii -Append "$env:AMD_CI_WORK\out\gpu.txt"
          Get-Content "$env:AMD_CI_WORK\out\gpu.txt"
      - uses: actions/download-artifact@v4
        with: { path: "${{ runner.temp }}/dl", pattern: "vkwin-*" }
      - name: Venv
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          & "$env:AMD_CI_WORK\venv\Scripts\python.exe" -m pip install -q pillow numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\dl\vkwin-base\srcinfo.txt", "$env:RUNNER_TEMP\dl\vkwin-h37\srcinfo.txt", "$env:RUNNER_TEMP\dl\vkwin-h38\srcinfo.txt"
      - name: Vulkan (AMD Windows driver)
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = "Continue"
          $d = "$env:RUNNER_TEMP\dl"
          & "$env:AMD_CI_WORK\venv\Scripts\python.exe" -u sdrc\run.py --plan vk --bin "base=$d\vkwin-base" --bin "h37=$d\vkwin-h37" --bin "h38=$d\vkwin-h38" `
            --models "$env:AMD_CI_WORK\models" --out "$env:AMD_CI_WORK\out\vk" --reps 3 2>&1 | Select-Object -Last 80
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdrc-windows
          path: |
            ${{ env.AMD_CI_WORK }}/out
            !${{ env.AMD_CI_WORK }}/out/**/*.png
          retention-days: 7
          if-no-files-found: warn

