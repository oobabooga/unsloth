name: AMD H3 tensor views native A/B
'on':
  push:
    branches:
    - amd-h3-native-ci-20261006
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 190
    steps:
    - name: Prepare Q4 models
      shell: python3 {0}
      timeout-minutes: 60
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\nwin=platform.system()=='Windows'\nprint(platform.platform(),flush=True)\nif win: run(['powershell','-Command','Get-CimInstance\
        \ Win32_VideoController | Format-List Name,DriverVersion; Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory'],'hardware',60)\n\
        else: run(['bash','-c','uname -a; free -h; lspci -nn; ls /opt/rocm*/lib/libhip*; cat /sys/class/drm/card*/device/mem_info_vram_total'],'hardware',60)\n\
        subprocess.check_call([sys.executable,'-m','venv',str(root/'venv')])\npy=str(root/'venv'/('Scripts/python.exe' if\
        \ win else 'bin/python'))\nsubprocess.check_call([py,'-m','pip','install','huggingface_hub==0.36.0','hf_xet'])\nbase='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-813-bfbef5b/'\n\
        def get_binary(kind):\n    suffix=('win-'+kind+'-x64') if win else ('Linux-Ubuntu-24.04-x86_64-'+kind)\n    if kind=='rocm':\
        \ suffix='win-rocm-7.14.0-x64' if win else 'Linux-Ubuntu-24.04-x86_64-rocm-7.14.0'\n    z=root/(kind+'.zip'); urllib.request.urlretrieve(base+'sd-master-bfbef5b-bin-'+suffix+'.zip',z)\n\
        \    dest=root/kind; dest.mkdir(exist_ok=True)\n    with zipfile.ZipFile(z) as f: installer._safe_extractall(f,dest)\n\
        \    for f in dest.rglob('*'):\n        if f.is_file() and not win: f.chmod(0o755)\n    return str(next(dest.rglob('sd-cli.exe'\
        \ if win else 'sd-cli')))\nsrc=root/'source'\nfor relative in ['studio/install_sd_cpp_prebuilt.py','studio/backend/utils/auth_safe.py']:\n\
        \    target=src/relative;target.parent.mkdir(parents=True,exist_ok=True)\n    print('Downloading source',relative,flush=True)\n\
        \    with urllib.request.urlopen('https://raw.githubusercontent.com/unslothai/unsloth/662e65e60a6553913085b794d0a41bc19301ee1d/'+relative,timeout=120)\
        \ as response:\n        target.write_bytes(response.read())\n\nsys.path.insert(0,str(src/'studio'))\nimport install_sd_cpp_prebuilt\
        \ as installer\nbinary=get_binary('vulkan')\nrun([binary,'--list-devices'],'vulkan-devices',60)\nrun([binary,'--help'],'help',60)\n\
        rocm=None\nfiles=['minimax_h3_fl2va_pruned-Q4_K.gguf','qwen3vl_32b_minimax_h3-Q4_K_M.gguf','vae/minimax_h3_video_vae_fp16.safetensors','vae/minimax_h3_audio_vae_fp32.safetensors']\n\
        code=\"from huggingface_hub import snapshot_download; snapshot_download('unsloth/MiniMax-H3-GGUF',allow_patterns=\"\
        +repr(files)+\",local_dir=\"+repr(str(root/'models'))+\")\"\nfor attempt in range(5):\n    result=subprocess.run([py,'-c',code])\n\
        \    if result.returncode==0: break\n    print('Resuming model download',attempt+1,flush=True)\nelse: raise RuntimeError('Model\
        \ download failed after five attempts')\nmodels=root/'models'\ncommon=[binary,'--mode','vid_gen','--diffusion-model',str(models/files[0]),'--llm',str(models/files[1]),'--vae',str(models/files[2]),'--audio-vae',str(models/files[3]),'--prompt','A\
        \ red toy car drives along a road in sunlight.','--cfg-scale','1','--width','1344','--height','768','--video-frames','124','--fps','24','--steps','2','--seed','42','--rng','cpu','-t','16']\n\
        flags=['--offload-to-cpu','--diffusion-fa','--max-vram','20','--stream-layers']\n(root/'config.json').write_text(json.dumps({'common':common,'flags':flags,'binary':binary,'rocm':rocm}))\n"
    - name: Build identical baseline and candidate
      shell: python3 {0}
      timeout-minutes: 30
      run: "\nimport os, pathlib, subprocess, urllib.request, zipfile, shutil, base64\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'h3-native'\n\
        source=root/'native-source'\ndef archive(repo,sha,dest):\n    z=root/(dest.name+'.zip')\n    urllib.request.urlretrieve('https://codeload.github.com/'+repo+'/zip/'+sha,z)\n\
        \    tmp=root/(dest.name+'-unpack')\n    with zipfile.ZipFile(z) as bundle: bundle.extractall(tmp)\n    if dest.exists():\
        \ shutil.rmtree(dest)\n    shutil.move(str(next(tmp.iterdir())),str(dest))\narchive('leejet/stable-diffusion.cpp','bfbef5b7e64e89a0205894853de25d19a7ba54b9',source)\n\
        archive('ggml-org/ggml','eced84c86f8b012c752c016f7fe789adea168e1e',source/'ggml')\npy=str(root/'venv/bin/python')\n\
        subprocess.check_call([py,'-m','pip','install','cmake==3.31.6'])\ndebs=root/'debs';debs.mkdir(exist_ok=True)\nsubprocess.check_call(['apt-get','download','glslc','libshaderc1','libvulkan-dev','spirv-headers'],cwd=debs)\n\
        tools=root/'tools';tools.mkdir(exist_ok=True)\nfor deb in debs.glob('*.deb'):subprocess.check_call(['dpkg-deb','-x',str(deb),str(tools)])\n\
        env=os.environ.copy();env['LD_LIBRARY_PATH']=str(tools/'usr/lib/x86_64-linux-gnu')+':'+env.get('LD_LIBRARY_PATH','')\n\
        cmake=str(root/'venv/bin/cmake');build=root/'build'\nsubprocess.check_call([cmake,'-S',str(source),'-B',str(build),'-DCMAKE_BUILD_TYPE=RelWithDebInfo','-DSD_VULKAN=ON','-DSD_BUILD_EXAMPLES=ON','-DSD_SERVER_BUILD_FRONTEND=OFF','-DSD_WEBP=OFF','-DSD_WEBM=OFF','-DGGML_NATIVE=OFF','-DVulkan_GLSLC_EXECUTABLE='+str(tools/'usr/bin/glslc'),'-DCMAKE_PREFIX_PATH='+str(tools/'usr'),'-DCMAKE_CXX_FLAGS=-I'+str(tools/'usr/include')],env=env)\n\
        subprocess.check_call([cmake,'--build',str(build),'-j','12','--target','sd-cli'],env=env)\nshutil.copy2(build/'bin/sd-cli',root/'sd-cli-before')\n\
        patch=root/'candidate.patch';patch.write_bytes(base64.b64decode(''))\n\
        subprocess.check_call(['git','-C',str(source),'apply',str(patch)])\nsubprocess.check_call([cmake,'--build',str(build),'-j','12','--target','sd-cli'],env=env)\n\
        shutil.copy2(build/'bin/sd-cli',root/'sd-cli-after')\n"
    - name: before
      shell: python3 {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text());common=cfg['common'];flags=cfg['flags'];common[0]=str(root/'sd-cli-before')\n\
        run(common+flags+['-v','--output',str(logs/'before.avi')],'before',1500)\n"
    - name: Save before
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h3-native-ab-before
        path: ${{ runner.temp }}/h3-native/results
        retention-days: 7
    - name: after
      shell: python3 {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text());common=cfg['common'];flags=cfg['flags'];common[0]=str(root/'sd-cli-after')\n\
        run(common+flags+['-v','--output',str(logs/'after.avi')],'after',1500)\n"
    - name: Save after
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h3-native-ab-after
        path: ${{ runner.temp }}/h3-native/results
        retention-days: 7
