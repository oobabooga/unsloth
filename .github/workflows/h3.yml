name: AMD H3 memory probe

on:
  push:
    branches: [amd-h3-mem-probe-20261014]

permissions: {}

jobs:
  linux:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    env:
      TAG: master-951-f89d9b1-uafac7a7
    steps:
      - name: Hardware and eligibility
        run: |
          uname -r; free -g | head -2
          for d in /sys/class/drm/card*/device; do [ -f $d/mem_info_vram_total ] && echo "$d vram_total=$(cat $d/mem_info_vram_total) gtt_total=$(cat $d/mem_info_gtt_total)"; done
          V=$(cat /sys/class/drm/card*/device/mem_info_vram_total 2>/dev/null | sort -n | tail -1)
          if [ "${V:-0}" -ge $((32*1024*1024*1024)) ]; then echo "ELIGIBLE=1" >> $GITHUB_ENV; echo eligible; else echo "ELIGIBLE=0" >> $GITHUB_ENV; echo "small carve-out, skipping"; fi
      - name: Setup
        if: env.ELIGIBLE == '1'
        run: |
          export W="$RUNNER_TEMP/h3"; mkdir -p "$W"/{models,out,vk,tmp,hf}
          export MODELS="$W/models" OUT="$W/out"
          echo "W=$W" >> $GITHUB_ENV; echo "MODELS=$W/models" >> $GITHUB_ENV; echo "OUT=$W/out" >> $GITHUB_ENV
          for f in h3probe.py gttfill.py; do curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/$f" -o "$W/$f"; done
          cd "$W/vk" && curl -fsSL -o b.zip "https://github.com/unslothai/stable-diffusion.cpp/releases/download/$TAG/sd-$TAG-bin-Linux-Ubuntu-22.04-x86_64-vulkan.zip" && unzip -q b.zip && rm b.zip
          echo "VK=$(find "$W/vk" -name sd-cli | head -1)" >> $GITHUB_ENV
          python3 -m venv "$W/venv"; . "$W/venv/bin/activate"; pip -q install -U "huggingface_hub[hf_xet]" vulkan
          export HF_HOME="$W/hf" TMPDIR="$W/tmp"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          for f in ["minimax_h3_fl2va_pruned-Q4_K.gguf","qwen3vl_32b_minimax_h3-Q4_K_M.gguf","vae/minimax_h3_video_vae_fp16.safetensors","vae/minimax_h3_audio_vae_fp32.safetensors"]:
              print(hf_hub_download("unsloth/MiniMax-H3-GGUF", f, local_dir=os.environ["MODELS"]))
          PY
          "$W/venv/bin/python" "$W/gttfill.py" 1000 1000 > "$W/types.log" 2>&1 & P=$!; sleep 8; kill $P; cat "$W/types.log"
      - name: D_ctrl (Studio Auto flags, no filler, budget 14 GiB)
        if: env.ELIGIBLE == '1'
        run: python3 "$W/h3probe.py" D_ctrl "$VK" --offload-to-cpu --diffusion-fa --max-vram vulkan0=14 --clip-on-cpu --backend diffusion=Vulkan0,te=cpu,vae=Vulkan0 || true
      - name: D_auto (Studio Auto flags; 15 GiB VRAM and 22.5 GiB GTT free, budget 14 GiB like a 16 GB card)
        if: env.ELIGIBLE == '1'
        run: |
          "$W/venv/bin/python" "$W/gttfill.py" 22.5 15 > "$W/fill.log" 2>&1 & FP=$!
          for i in $(seq 1 300); do grep -q "FILLED gtt" "$W/fill.log" && break; sleep 1; done; cat "$W/fill.log"
          python3 "$W/h3probe.py" D_auto "$VK" --offload-to-cpu --diffusion-fa --max-vram vulkan0=14 --clip-on-cpu --backend diffusion=Vulkan0,te=cpu,vae=Vulkan0 || true
          kill $FP; wait $FP 2>/dev/null || true
      - name: D_auto_raw (same, --max-vram -1 as Studio passes it)
        if: env.ELIGIBLE == '1'
        run: |
          "$W/venv/bin/python" "$W/gttfill.py" 22.5 15 > "$W/fill.log" 2>&1 & FP=$!
          for i in $(seq 1 300); do grep -q "FILLED gtt" "$W/fill.log" && break; sleep 1; done; cat "$W/fill.log"
          python3 "$W/h3probe.py" D_auto_raw "$VK" --offload-to-cpu --diffusion-fa --max-vram -1 --clip-on-cpu --backend diffusion=Vulkan0,te=cpu,vae=Vulkan0 || true
          kill $FP; wait $FP 2>/dev/null || true
      - name: D_te_gpu (TE on GPU, same constraint)
        if: env.ELIGIBLE == '1'
        run: |
          "$W/venv/bin/python" "$W/gttfill.py" 22.5 15 > "$W/fill.log" 2>&1 & FP=$!
          for i in $(seq 1 300); do grep -q "FILLED gtt" "$W/fill.log" && break; sleep 1; done; cat "$W/fill.log"
          python3 "$W/h3probe.py" D_te_gpu "$VK" --offload-to-cpu --diffusion-fa --max-vram vulkan0=14 --backend diffusion=Vulkan0,te=Vulkan0,vae=Vulkan0 || true
          kill $FP; wait $FP 2>/dev/null || true
      - name: Summary
        if: always() && env.ELIGIBLE == '1'
        run: |
          cat "$OUT/results.jsonl" || true
          for f in "$OUT"/*.log; do echo "=== $f"; grep -iE 'radv|lost|\[E\]|\[W\]|abort|assert|auto-detected|segments|prepared params' "$f" | head -40; done
