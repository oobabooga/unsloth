name: AMD H3 Windows source A/B
'on':
  push:
    branches:
    - amd-h3-native-ci-20261006
permissions: {}
jobs:
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 250
    steps:
    - name: Diagnostic A/B without source downloads
      shell: python {0}
      timeout-minutes: 5
      run: "import os,sys,subprocess,pathlib,base64,gzip,json\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'h3-diagnostics';root.mkdir(exist_ok=True)\n\
        src=root/'source'\ndata=json.loads(gzip.decompress(base64.b64decode('')))\n\
        for relative,body in data['before'].items():\n    target=src/'studio/backend'/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_text(body,encoding='utf8')\n\
        probe=root/'probe.py'\nprobe.write_text('''import sys, pathlib\nfrom core.inference.sd_cpp_engine import SdCppEngine\n\
        reason = \"CUDA error: no kernel image is available for execution on the device\"\nchild = \"import sys; print(\"\
        \ + repr(reason) + \"); [print('#%d native_frame' % i) for i in range(80)]; sys.exit(6)\"\ntry:\n    SdCppEngine(binary=sys.executable)._run([sys.executable,\
        \ '-c', child], str(pathlib.Path(sys.argv[2])/'absent.png'), timeout=30, env=None, on_log=None)\nexcept RuntimeError\
        \ as exc:\n    detail=str(exc)\n    found=reason in detail\n    print(detail)\n    assert found == (sys.argv[1] ==\
        \ 'after'), (sys.argv[1], found)\n    assert '#79 native_frame' in detail\nelse:\n    raise AssertionError('Expected\
        \ native process failure')\n''')\nenv=os.environ.copy();env['PYTHONPATH']=str(src/'studio'/'backend')\nsubprocess.check_call([sys.executable,str(probe),'before',str(root)],env=env)\n\
        (src/'studio/backend/core/inference/sd_cpp_engine.py').write_text(data['after'],encoding='utf8')\nsubprocess.check_call([sys.executable,str(probe),'after',str(root)],env=env)\n\
        print('Native child diagnostic A/B passed',flush=True)\n"
    - name: Prepare Vulkan and Q4 models
      shell: python {0}
      timeout-minutes: 70
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\nwin=platform.system()=='Windows'\nprint(platform.platform(),flush=True)\nif win: run(['powershell','-Command','Get-CimInstance\
        \ Win32_VideoController | Format-List Name,DriverVersion; Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory'],'hardware',60)\n\
        else: run(['bash','-c','uname -a; free -h; lspci -nn; ls /opt/rocm*/lib/libhip*; cat /sys/class/drm/card*/device/mem_info_vram_total'],'hardware',60)\n\
        subprocess.check_call([sys.executable,'-m','venv',str(root/'venv')])\npy=str(root/'venv'/('Scripts/python.exe' if\
        \ win else 'bin/python'))\nsubprocess.check_call([py,'-m','pip','install','huggingface_hub==0.36.0','hf_xet'])\nbase='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-813-bfbef5b/'\n\
        def get_binary(kind):\n    suffix=('win-'+kind+'-x64') if win else ('Linux-Ubuntu-24.04-x86_64-'+kind)\n    if kind=='rocm':\
        \ suffix='win-rocm-7.14.0-x64' if win else 'Linux-Ubuntu-24.04-x86_64-rocm-7.14.0'\n    z=root/(kind+'.zip'); urllib.request.urlretrieve(base+'sd-master-bfbef5b-bin-'+suffix+'.zip',z)\n\
        \    dest=root/kind; dest.mkdir(exist_ok=True)\n    with zipfile.ZipFile(z) as f: installer._safe_extractall(f,dest)\n\
        \    for f in dest.rglob('*'):\n        if f.is_file() and not win: f.chmod(0o755)\n    return str(next(dest.rglob('sd-cli.exe'\
        \ if win else 'sd-cli')))\nsrc=root/'source'\nfor relative in ['studio/install_sd_cpp_prebuilt.py','studio/backend/utils/auth_safe.py']:\n\
        \    target=src/relative;target.parent.mkdir(parents=True,exist_ok=True)\n    print('Downloading source',relative,flush=True)\n\
        \    with urllib.request.urlopen('https://raw.githubusercontent.com/unslothai/unsloth/662e65e60a6553913085b794d0a41bc19301ee1d/'+relative,timeout=120)\
        \ as response:\n        target.write_bytes(response.read())\n\nsys.path.insert(0,str(src/'studio'))\nimport install_sd_cpp_prebuilt\
        \ as installer\nbinary=get_binary('vulkan')\nrun([binary,'--list-devices'],'vulkan-devices',60)\nrun([binary,'--help'],'help',60)\n\
        rocm=None\nfiles=['minimax_h3_fl2va_pruned-Q4_K.gguf','qwen3vl_32b_minimax_h3-Q4_K_M.gguf','vae/minimax_h3_video_vae_fp16.safetensors','vae/minimax_h3_audio_vae_fp32.safetensors']\n\
        code=\"from huggingface_hub import snapshot_download; snapshot_download('unsloth/MiniMax-H3-GGUF',allow_patterns=\"\
        +repr(files)+\",local_dir=\"+repr(str(root/'models'))+\")\"\nfor attempt in range(5):\n    result=subprocess.run([py,'-c',code])\n\
        \    if result.returncode==0: break\n    print('Resuming model download',attempt+1,flush=True)\nelse: raise RuntimeError('Model\
        \ download failed after five attempts')\nmodels=root/'models'\ncommon=[binary,'--mode','vid_gen','--diffusion-model',str(models/files[0]),'--llm',str(models/files[1]),'--vae',str(models/files[2]),'--audio-vae',str(models/files[3]),'--prompt','A\
        \ red toy car drives along a road in sunlight.','--cfg-scale','1','--width','1344','--height','768','--video-frames','124','--fps','24','--steps','2','--seed','42','--rng','cpu','-t','16']\n\
        flags=['--offload-to-cpu','--diffusion-fa','--max-vram','20','--stream-layers']\n(root/'config.json').write_text(json.dumps({'common':common,'flags':flags,'binary':binary,'rocm':rocm}))\n"
    - name: Build baseline, candidate, and current Unsloth source
      shell: python {0}
      timeout-minutes: 55
      run: "\nimport os, pathlib, subprocess, urllib.request, zipfile, shutil, base64\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'h3-native'\n\
        source=root/'native-source'\ndef archive(repo,sha,dest):\n    print('Download source',repo,sha,flush=True)\n    z=root/(dest.name+'.zip')\n\
        \    with urllib.request.urlopen('https://codeload.github.com/'+repo+'/zip/'+sha,timeout=120) as response,z.open('wb')\
        \ as output:shutil.copyfileobj(response,output)\n    tmp=root/(dest.name+'-unpack')\n    with zipfile.ZipFile(z) as\
        \ bundle: bundle.extractall(tmp)\n    if dest.exists(): shutil.rmtree(dest)\n    shutil.move(str(next(tmp.iterdir())),str(dest))\n\
        archive('leejet/stable-diffusion.cpp','bfbef5b7e64e89a0205894853de25d19a7ba54b9',source)\narchive('leejet/ggml','eced84c86f8b012c752c016f7fe789adea168e1e',source/'ggml')\n\
        py=str(root/'venv/Scripts/python.exe')\nsubprocess.check_call([py,'-m','pip','install','cmake==3.31.6','ninja'])\n\
        sdk=root/'vulkan-sdk';installer=root/'vulkan-sdk.exe'\nurl='https://sdk.lunarg.com/sdk/download/1.4.328.1/windows/vulkansdk-windows-X64-1.4.328.1.exe'\n\
        print('Downloading Vulkan SDK',flush=True)\nwith urllib.request.urlopen(url,timeout=120) as response,installer.open('wb')\
        \ as output:shutil.copyfileobj(response,output)\nsubprocess.check_call([str(installer),'--root',str(sdk),'--accept-licenses','--default-answer','--confirm-command','install'],timeout=600)\n\
        vswhere=pathlib.Path(os.environ['ProgramFiles(x86)'])/'Microsoft Visual Studio/Installer/vswhere.exe'\nvs=subprocess.check_output([str(vswhere),'-latest','-products','*','-requires','Microsoft.VisualStudio.Component.VC.Tools.x86.x64','-property','installationPath'],text=True).strip()\n\
        assert vs,'MSVC build tools not found'\nvcvars=str(pathlib.Path(vs)/'VC/Auxiliary/Build/vcvars64.bat')\nenv=os.environ.copy();env['VULKAN_SDK']=str(sdk);env['PATH']=str(root/'venv/Scripts')+';'+str(sdk/'Bin')+';'+env['PATH']\n\
        def command(args):\n    line='call \"'+vcvars+'\" && '+subprocess.list2cmdline(args)\n    print('BUILD',line,flush=True)\n\
        \    subprocess.check_call(['cmd','/d','/s','/c',line],env=env)\ndef compile(src,build):\n    command(['cmake','-S',str(src),'-B',str(build),'-G','Ninja','-DCMAKE_BUILD_TYPE=RelWithDebInfo','-DCMAKE_CXX_FLAGS=/bigobj','-DSD_VULKAN=ON','-DSD_BUILD_EXAMPLES=ON','-DSD_SERVER_BUILD_FRONTEND=OFF','-DSD_WEBP=OFF','-DSD_WEBM=OFF','-DGGML_NATIVE=OFF'])\n\
        \    command(['cmake','--build',str(build),'-j','8','--target','sd-cli'])\nbuild=root/'build';compile(source,build)\n\
        shutil.copy2(build/'bin/sd-cli.exe',root/'sd-cli-before.exe')\npatch=root/'candidate.patch';patch.write_bytes(base64.b64decode(''))\n\
        subprocess.check_call(['git','-C',str(source),'apply',str(patch)])\ncommand(['cmake','--build',str(build),'-j','8','--target','sd-cli'])\n\
        shutil.copy2(build/'bin/sd-cli.exe',root/'sd-cli-after.exe')\nfork=root/'fork-source'\narchive('unslothai/stable-diffusion.cpp','7bbffa35fc3571bcb9116212c60762f461e67e85',fork)\n\
        # Reuse the extraction staging directory name only after removing the previous one.\nshutil.rmtree(root/'ggml-unpack')\n\
        archive('leejet/ggml','f583f393cd5dfdc129360bbf75cb3d49ccc837a8',fork/'ggml')\ncompile(fork,root/'fork-build')\nshutil.copy2(root/'fork-build/bin/sd-cli.exe',root/'sd-cli-fork.exe')\n"
    - name: before
      shell: python {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text());common=cfg['common'];flags=cfg['flags'];common[0]=str(root/'sd-cli-before.exe')\n\
        run(common+flags+['-v','--output',str(logs/'before.avi')],'before',2100)\n"
    - name: Save before
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h3-windows-native-ab-before
        path: ${{ runner.temp }}/h3-native/results
        retention-days: 7
    - name: after
      shell: python {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text());common=cfg['common'];flags=cfg['flags'];common[0]=str(root/'sd-cli-after.exe')\n\
        run(common+flags+['-v','--output',str(logs/'after.avi')],'after',2100)\n"
    - name: Save after
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h3-windows-native-ab-after
        path: ${{ runner.temp }}/h3-native/results
        retention-days: 7
    - name: fork
      shell: python {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text());common=cfg['common'];flags=cfg['flags'];common[0]=str(root/'sd-cli-fork.exe')\n\
        flags.remove('--stream-layers')\nrun(common+flags+['-v','--output',str(logs/'fork.avi')],'fork',2100)\n"
    - name: Save fork
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h3-windows-native-ab-fork
        path: ${{ runner.temp }}/h3-native/results
        retention-days: 7
