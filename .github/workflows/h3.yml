name: AMD H3 Windows HTTP setup retry
'on':
  push:
    branches:
    - amd-h3-native-ci-20261006
permissions: {}
jobs:
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 110
    steps:
    - name: Diagnostic A/B using HTTP source archive
      shell: python {0}
      timeout-minutes: 10
      run: "import os, sys, subprocess, pathlib, base64\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'h3-diagnostics'\nroot.mkdir(exist_ok=True)\n\
        src=root/'source'\nimport urllib.request, zipfile, shutil, socket\nsocket.setdefaulttimeout(120)\nurl='https://codeload.github.com/unslothai/unsloth/zip/662e65e60a6553913085b794d0a41bc19301ee1d'\n\
        print('Downloading public source archive', url, flush=True)\nz=root/'source.zip'\nwith urllib.request.urlopen(url,timeout=120)\
        \ as response, z.open('wb') as output:\n    shutil.copyfileobj(response,output)\nwith zipfile.ZipFile(z) as bundle:\n\
        \    bundle.extractall(root/'unpacked')\nshutil.move(str(next((root/'unpacked').iterdir())),str(src))\nprint('Source\
        \ archive extracted', flush=True)\nprobe=root/'probe.py'\nprobe.write_text('''import sys, pathlib\nfrom core.inference.sd_cpp_engine\
        \ import SdCppEngine\nreason = \"CUDA error: no kernel image is available for execution on the device\"\nchild = \"\
        import sys; print(\" + repr(reason) + \"); [print('#%d native_frame' % i) for i in range(80)]; sys.exit(6)\"\ntry:\n\
        \    SdCppEngine(binary=sys.executable)._run([sys.executable, '-c', child], str(pathlib.Path(sys.argv[2])/'absent.png'),\
        \ timeout=30, env=None, on_log=None)\nexcept RuntimeError as exc:\n    detail=str(exc)\n    found=reason in detail\n\
        \    print(detail)\n    assert found == (sys.argv[1] == 'after'), (sys.argv[1], found)\n    assert '#79 native_frame'\
        \ in detail\nelse:\n    raise AssertionError('Expected native process failure')\n''')\nenv=os.environ.copy();env['PYTHONPATH']=str(src/'studio'/'backend')\n\
        subprocess.check_call([sys.executable,str(probe),'before',str(root)],env=env)\npatch=root/'candidate.patch'\npatch.write_bytes(base64.b64decode(''))\n\
        subprocess.check_call(['git','-C',str(src),'apply',str(patch)])\nsubprocess.check_call([sys.executable,str(probe),'after',str(root)],env=env)\n\
        print('Native child diagnostic A/B passed')\n"
    - name: Prepare Vulkan and Q4 models
      shell: python {0}
      timeout-minutes: 45
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\nwin=platform.system()=='Windows'\nprint(platform.platform(),flush=True)\nif win: run(['powershell','-Command','Get-CimInstance\
        \ Win32_VideoController | Format-List Name,DriverVersion; Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory'],'hardware',60)\n\
        else: run(['bash','-c','uname -a; free -h; lspci -nn; ls /opt/rocm*/lib/libhip*; cat /sys/class/drm/card*/device/mem_info_vram_total'],'hardware',60)\n\
        subprocess.check_call([sys.executable,'-m','venv',str(root/'venv')])\npy=str(root/'venv'/('Scripts/python.exe' if\
        \ win else 'bin/python'))\nsubprocess.check_call([py,'-m','pip','install','huggingface_hub==0.36.0','hf_xet'])\nbase='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-813-bfbef5b/'\n\
        def get_binary(kind):\n    suffix=('win-'+kind+'-x64') if win else ('Linux-Ubuntu-24.04-x86_64-'+kind)\n    if kind=='rocm':\
        \ suffix='win-rocm-7.14.0-x64' if win else 'Linux-Ubuntu-24.04-x86_64-rocm-7.14.0'\n    z=root/(kind+'.zip'); urllib.request.urlretrieve(base+'sd-master-bfbef5b-bin-'+suffix+'.zip',z)\n\
        \    dest=root/kind; dest.mkdir(exist_ok=True)\n    with zipfile.ZipFile(z) as f: installer._safe_extractall(f,dest)\n\
        \    for f in dest.rglob('*'):\n        if f.is_file() and not win: f.chmod(0o755)\n    return str(next(dest.rglob('sd-cli.exe'\
        \ if win else 'sd-cli')))\nsrc=root/'source'\nimport urllib.request, zipfile, shutil, socket\nsocket.setdefaulttimeout(120)\n\
        url='https://codeload.github.com/unslothai/unsloth/zip/662e65e60a6553913085b794d0a41bc19301ee1d'\nprint('Downloading\
        \ public source archive', url, flush=True)\nz=root/'source.zip'\nwith urllib.request.urlopen(url,timeout=120) as response,\
        \ z.open('wb') as output:\n    shutil.copyfileobj(response,output)\nwith zipfile.ZipFile(z) as bundle:\n    bundle.extractall(root/'unpacked')\n\
        shutil.move(str(next((root/'unpacked').iterdir())),str(src))\nprint('Source archive extracted', flush=True)\n\nsys.path.insert(0,str(src/'studio'))\n\
        import install_sd_cpp_prebuilt as installer\nbinary=get_binary('vulkan')\nrun([binary,'--list-devices'],'vulkan-devices',60)\n\
        run([binary,'--help'],'help',60)\nrocm=None\nfiles=['minimax_h3_fl2va_pruned-Q4_K.gguf','qwen3vl_32b_minimax_h3-Q4_K_M.gguf','vae/minimax_h3_video_vae_fp16.safetensors','vae/minimax_h3_audio_vae_fp32.safetensors']\n\
        code=\"from huggingface_hub import snapshot_download; snapshot_download('unsloth/MiniMax-H3-GGUF',allow_patterns=\"\
        +repr(files)+\",local_dir=\"+repr(str(root/'models'))+\")\"\nsubprocess.check_call([py,'-c',code])\nmodels=root/'models'\n\
        common=[binary,'--mode','vid_gen','--diffusion-model',str(models/files[0]),'--llm',str(models/files[1]),'--vae',str(models/files[2]),'--audio-vae',str(models/files[3]),'--prompt','A\
        \ red toy car drives along a road in sunlight.','--cfg-scale','1','--width','640','--height','384','--video-frames','25','--fps','24','--steps','2','--seed','42','--rng','cpu','-t','16']\n\
        flags=['--offload-to-cpu','--diffusion-fa','--max-vram','-1','--stream-layers']\n(root/'config.json').write_text(json.dumps({'common':common,'flags':flags,'binary':binary,'rocm':rocm}))\n"
    - name: small
      shell: python {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text());common=cfg['common'];flags=cfg['flags']\n\nrun(common+flags+['--output',str(logs/'small.avi')],'small',1200)\n"
    - name: Save small
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h3-windows-retry-small
        path: ${{ runner.temp }}/h3-native/results
        retention-days: 7
    - name: full
      shell: python {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text());common=cfg['common'];flags=cfg['flags']\ncommon[common.index('--width')+1]='1344';common[common.index('--height')+1]='768';common[common.index('--video-frames')+1]='124';flags[flags.index('--max-vram')+1]='20'\n\
        run(common+flags+['--output',str(logs/'full.avi')],'full',1200)\n"
    - name: Save full
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h3-windows-retry-full
        path: ${{ runner.temp }}/h3-native/results
        retention-days: 7
