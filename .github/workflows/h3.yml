name: AMD native diagnostics AB
'on':
  push:
    branches:
    - amd-h3-native-ci-20261006
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 10
    steps:
    - name: Native diagnostic before and after
      shell: python3 {0}
      run: "import os, sys, subprocess, pathlib, base64\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'h3-diagnostics'\nroot.mkdir(exist_ok=True)\n\
        src=root/'source'\nsubprocess.check_call(['git','init',str(src)])\nsubprocess.check_call(['git','-C',str(src),'fetch','--depth','1','https://github.com/unslothai/unsloth','662e65e60a6553913085b794d0a41bc19301ee1d'])\n\
        subprocess.check_call(['git','-C',str(src),'checkout','FETCH_HEAD'])\nprobe=root/'probe.py'\nprobe.write_text('''import\
        \ sys, pathlib\nfrom core.inference.sd_cpp_engine import SdCppEngine\nreason = \"CUDA error: no kernel image is available\
        \ for execution on the device\"\nchild = \"import sys; print(\" + repr(reason) + \"); [print('#%d native_frame' %\
        \ i) for i in range(80)]; sys.exit(6)\"\ntry:\n    SdCppEngine(binary=sys.executable)._run([sys.executable, '-c',\
        \ child], str(pathlib.Path(sys.argv[2])/'absent.png'), timeout=30, env=None, on_log=None)\nexcept RuntimeError as\
        \ exc:\n    detail=str(exc)\n    found=reason in detail\n    print(detail)\n    assert found == (sys.argv[1] == 'after'),\
        \ (sys.argv[1], found)\n    assert '#79 native_frame' in detail\nelse:\n    raise AssertionError('Expected native\
        \ process failure')\n''')\nenv=os.environ.copy();env['PYTHONPATH']=str(src/'studio'/'backend')\nsubprocess.check_call([sys.executable,str(probe),'before',str(root)],env=env)\n\
        patch=root/'candidate.patch'\npatch.write_bytes(base64.b64decode(''))\n\
        subprocess.check_call(['git','-C',str(src),'apply',str(patch)])\nsubprocess.check_call([sys.executable,str(probe),'after',str(root)],env=env)\n\
        print('Native child diagnostic A/B passed')\n"
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 10
    steps:
    - name: Native diagnostic before and after
      shell: python {0}
      run: "import os, sys, subprocess, pathlib, base64\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'h3-diagnostics'\nroot.mkdir(exist_ok=True)\n\
        src=root/'source'\nsubprocess.check_call(['git','init',str(src)])\nsubprocess.check_call(['git','-C',str(src),'fetch','--depth','1','https://github.com/unslothai/unsloth','662e65e60a6553913085b794d0a41bc19301ee1d'])\n\
        subprocess.check_call(['git','-C',str(src),'checkout','FETCH_HEAD'])\nprobe=root/'probe.py'\nprobe.write_text('''import\
        \ sys, pathlib\nfrom core.inference.sd_cpp_engine import SdCppEngine\nreason = \"CUDA error: no kernel image is available\
        \ for execution on the device\"\nchild = \"import sys; print(\" + repr(reason) + \"); [print('#%d native_frame' %\
        \ i) for i in range(80)]; sys.exit(6)\"\ntry:\n    SdCppEngine(binary=sys.executable)._run([sys.executable, '-c',\
        \ child], str(pathlib.Path(sys.argv[2])/'absent.png'), timeout=30, env=None, on_log=None)\nexcept RuntimeError as\
        \ exc:\n    detail=str(exc)\n    found=reason in detail\n    print(detail)\n    assert found == (sys.argv[1] == 'after'),\
        \ (sys.argv[1], found)\n    assert '#79 native_frame' in detail\nelse:\n    raise AssertionError('Expected native\
        \ process failure')\n''')\nenv=os.environ.copy();env['PYTHONPATH']=str(src/'studio'/'backend')\nsubprocess.check_call([sys.executable,str(probe),'before',str(root)],env=env)\n\
        patch=root/'candidate.patch'\npatch.write_bytes(base64.b64decode(''))\n\
        subprocess.check_call(['git','-C',str(src),'apply',str(patch)])\nsubprocess.check_call([sys.executable,str(probe),'after',str(root)],env=env)\n\
        print('Native child diagnostic A/B passed')\n"
