name: AMD H3 native experiments
'on':
  push:
    branches:
    - amd-h3-native-ci-20261006
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 100
    steps:
    - name: Prepare binaries and model files
      shell: python3 {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\nwin=platform.system()=='Windows'\nprint(platform.platform(),flush=True)\nif win: run(['powershell','-Command','Get-CimInstance\
        \ Win32_VideoController | Format-List Name,DriverVersion; Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory'],'hardware',60)\n\
        else: run(['bash','-c','uname -a; free -h; lspci -nn; ls /opt/rocm*/lib/libhip*; cat /sys/class/drm/card*/device/mem_info_vram_total'],'hardware',60)\n\
        subprocess.check_call([sys.executable,'-m','venv',str(root/'venv')])\npy=str(root/'venv'/('Scripts/python.exe' if\
        \ win else 'bin/python'))\nsubprocess.check_call([py,'-m','pip','install','huggingface_hub==0.36.0','hf_xet'])\nbase='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-813-bfbef5b/'\n\
        def get_binary(kind):\n    suffix=('win-'+kind+'-x64') if win else ('Linux-Ubuntu-24.04-x86_64-'+kind)\n    if kind=='rocm':\
        \ suffix='win-rocm-7.14.0-x64' if win else 'Linux-Ubuntu-24.04-x86_64-rocm-7.14.0'\n    z=root/(kind+'.zip'); urllib.request.urlretrieve(base+'sd-master-bfbef5b-bin-'+suffix+'.zip',z)\n\
        \    dest=root/kind; dest.mkdir(exist_ok=True)\n    with zipfile.ZipFile(z) as f: installer._safe_extractall(f,dest)\n\
        \    for f in dest.rglob('*'):\n        if f.is_file() and not win: f.chmod(0o755)\n    return str(next(dest.rglob('sd-cli.exe'\
        \ if win else 'sd-cli')))\nsrc=root/'source'\nsubprocess.check_call(['git','clone','--depth','1','https://github.com/unslothai/unsloth',str(src)])\n\
        sys.path.insert(0,str(src/'studio'))\nimport install_sd_cpp_prebuilt as installer\nbinary=get_binary('vulkan')\nrun([binary,'--list-devices'],'vulkan-devices',60)\n\
        run([binary,'--help'],'help',60)\nrocm=get_binary('rocm')\nrun([rocm,'--list-devices'],'rocm-devices',60)\nfiles=['minimax_h3_fl2va_pruned-Q4_K.gguf','qwen3vl_32b_minimax_h3-Q4_K_M.gguf','vae/minimax_h3_video_vae_fp16.safetensors','vae/minimax_h3_audio_vae_fp32.safetensors']\n\
        code=\"from huggingface_hub import snapshot_download; snapshot_download('unsloth/MiniMax-H3-GGUF',allow_patterns=\"\
        +repr(files)+\",local_dir=\"+repr(str(root/'models'))+\")\"\nsubprocess.check_call([py,'-c',code])\nmodels=root/'models'\n\
        common=[binary,'--mode','vid_gen','--diffusion-model',str(models/files[0]),'--llm',str(models/files[1]),'--vae',str(models/files[2]),'--audio-vae',str(models/files[3]),'--prompt','A\
        \ red toy car drives along a road in sunlight.','--cfg-scale','1','--width','640','--height','384','--video-frames','25','--fps','24','--steps','2','--seed','42','--rng','cpu','-t','16']\n\
        flags=['--offload-to-cpu','--diffusion-fa','--max-vram','-1','--stream-layers']\n(root/'config.json').write_text(json.dumps({'common':common,'flags':flags,'binary':binary,'rocm':rocm}))\n"
    - name: baseline
      shell: python3 {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text())\ncommon=cfg['common']; flags=cfg['flags']\n\nenv=os.environ.copy();\
        \ env.update({})\nrun(common+flags+['--output',str(logs/'baseline.avi')],'baseline',900,env)\n"
    - name: no_flash
      shell: python3 {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
        \ pathlib.Path(os.environ['RUNNER_TEMP']) / 'h3-native'\nroot.mkdir(exist_ok=True)\nos.environ['HF_ENDPOINT'] = 'https://huggingface.co'\n\
        os.environ['HF_HUB_ETAG_TIMEOUT'] = '180'\nos.environ['HF_HUB_DOWNLOAD_TIMEOUT'] = '300'\nos.environ['HF_HUB_DISABLE_XET']\
        \ = '1'\nos.environ['HF_HOME'] = str(root / 'hf')\nos.environ['TMPDIR'] = str(root)\nos.environ['TEMP'] = str(root)\n\
        os.environ['TMP'] = str(root)\nos.environ['PIP_CACHE_DIR'] = str(root / 'pip')\nlogs = root / 'results'; logs.mkdir(exist_ok=True)\n\
        def run(cmd, name, timeout=900, env=None):\n    print('RUN', name, cmd, flush=True)\n    t=time.monotonic()\n    with\
        \ (logs/(name+'.log')).open('w',encoding='utf8') as f:\n        p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,env=env)\n\
        \        try: rc=p.wait(timeout=timeout)\n        except subprocess.TimeoutExpired: p.kill(); p.wait(); rc='timeout'\n\
        \    out=(logs/(name+'.log')).read_text(errors='replace')\n    print(out[-18000:],flush=True)\n    result={'name':name,'rc':rc,'seconds':round(time.monotonic()-t,2)}\n\
        \    with (logs/'results.jsonl').open('a') as f: f.write(json.dumps(result)+'\\n')\n    print('::notice title='+name+'::'+json.dumps(result),flush=True)\n\
        \    return out\ncfg=json.loads((root/'config.json').read_text())\ncommon=cfg['common']; flags=cfg['flags']\nflags.remove('--diffusion-fa')\n\
        env=os.environ.copy(); env.update({})\nrun(common+flags+['--output',str(logs/'no_flash.avi')],'no_flash',900,env)\n"
    - name: no_coopmat
      shell: python3 {0}
      run: "import os, sys, subprocess, pathlib, urllib.request, zipfile, platform, time, json, concurrent.futures\nroot =\
