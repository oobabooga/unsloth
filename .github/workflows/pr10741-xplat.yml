name: "PR 10741 mirror: clean_text cross-platform"
on:
  pull_request:
permissions: {}
concurrency:
  group: pr10741-xplat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: "${{ matrix.os }} py${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: ubuntu-24.04-arm, python: "3.12"}
          - {os: macos-26, python: "3.9"}
          - {os: macos-26, python: "3.13"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
          - {os: windows-11-arm, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        shell: bash
        run: |
          python -m pip install -q pytest
          python -m pytest --noconftest -p no:cacheprovider -q tests/test_raw_text.py
      - name: Load paths and behavior
        shell: bash
        run: python .github/scripts/pr10741_xplat_check.py
  wsl:
    name: "WSL Ubuntu-24.04"
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 python3-pip python3-venv
      - name: Tests inside WSL
        shell: wsl-bash {0}
        run: |
          set -e
          uname -a
          python3 -m venv /tmp/v && . /tmp/v/bin/activate
          pip install -q pytest
          python -m pytest --noconftest -p no:cacheprovider -q tests/test_raw_text.py
          python .github/scripts/pr10741_xplat_check.py
