name: "AMD CI (Windows): import unsloth without Triton"

# Generated by scripts/notriton/gen_win.py from scripts/amd_r7/gen.py (scaffold.py --windows job shape).
# No GPU concurrency group: correctness only, no timing, and a shared group evicts its third waiter.

on:
  push:
    branches: [amd-ci-notriton-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOO_MAIN_SHA: "9910e5421a3c1265b0d2a410359236d0ed4874d4"
  UNSLOTH_SHA: "8fec28219290c45e74fae616818707a829a296e4"
  UNSLOTH_REPO: "https://github.com/unslothai/unsloth"
  AMD_TORCH_INDEX: "https://repo.amd.com/rocm/whl-multi-arch/"
  AMD_TORCH_SPEC: "torch[device-gfx1151]==2.11.0+rocm7.14.0"

jobs:

  linux-control:
    name: "linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"

  w_nt:
    name: "unsloth import without Triton: main vs main + fix (zoo main + zoo fix installed), TRL 0.25.1"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    env:
      UNSLOTH_IS_PRESENT: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # LF worktrees for every git call in this job, so the range patch applies as generated.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "core.autocrlf"
      GIT_CONFIG_VALUE_0: "false"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "nt-w_nt"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_OS=[$env:RUNNER_OS] RUNNER_NAME=[$env:RUNNER_NAME] COMPUTERNAME=[$env:COMPUTERNAME]"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\states.py" `
            --repo "https://github.com/unslothai/unsloth" --pr 15244 --patch-base 9e1ddce97f6c02eb368f69c7918afc44f90d6885 --patch "$env:GITHUB_WORKSPACE\amd_ci\patches\unsloth_notriton.diff" `
            --root "$env:AMD_CI_WORK" --out "$env:AMD_CI_WORK\out\states.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:AMD_CI_WORK\out\states.json"

      - name: Test environment
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          & $py -m pip install -q pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $kind = "rocm"
          & $py -m pip install --index-url "$env:AMD_TORCH_INDEX" "$env:AMD_TORCH_SPEC"
          if ($LASTEXITCODE -ne 0) {
            & $py -m pip install --index-url "$env:AMD_TORCH_INDEX" --extra-index-url "https://pypi.org/simple" "$env:AMD_TORCH_SPEC"
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::AMD ROCm torch for gfx1151 did not install; falling back to CPU torch (CPU RUN)"
            $kind = "cpu-fallback"
            & $py -m pip install --index-url "https://download.pytorch.org/whl/cpu" torch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $tv = & $py -c "import torch; print(torch.__version__)"
          $gpu = & $py -c "import torch; print(int(torch.cuda.is_available()))"
          & $py -c "import torch; print('torch', torch.__version__, 'hip', torch.version.hip, 'gpu', torch.cuda.is_available())"
          Set-Content -Path "$env:AMD_CI_WORK\constraints.txt" -Value "torch==$tv" -Encoding ASCII
          # zoo = main (installed); unsloth comes from each state's checkout (pytest runs with cwd = checkout).
          & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" "git+https://github.com/unslothai/unsloth-zoo@$env:ZOO_MAIN_SHA"
          if ($LASTEXITCODE -ne 0) {
            & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" "transformers>=4.52.4,<=5.17.0" "peft>=0.18.0" "accelerate>=0.34.1" "datasets>=3.4.1,<5.0.0" tyro einops packaging sentencepiece tqdm psutil numpy protobuf "huggingface_hub>=0.34.0" pillow regex msgspec typing_extensions filelock requests
            & $py -m pip install -q --no-deps "git+https://github.com/unslothai/unsloth-zoo@$env:ZOO_MAIN_SHA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # zoo main + the no-Triton zoo fix, installed over it (both unsloth states use this zoo).
          $z = "$env:AMD_CI_WORK\zoo_fix"
          git clone -q --filter=blob:none "https://github.com/unslothai/unsloth-zoo" "$z"
          git -C "$z" checkout -q --detach "$env:ZOO_MAIN_SHA"
          git -C "$z" apply --whitespace=nowarn "$env:GITHUB_WORKSPACE\amd_ci\patches\zoo_notriton.diff"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q --no-deps --force-reinstall "$z"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import unsloth_zoo.compiler as c; print('zoo compiler without triton OK, OLD_TRITON_VERSION', c.OLD_TRITON_VERSION)"
          # TRL 0.25.1: the range whose PPO / RLOO / BCO / Online DPO / XPO / Nash-MD trainers these routes patch.
          & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" "trl==0.25.1" "transformers>=4.57.6,<=5.17.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" typer rich pydantic pyyaml nest-asyncio structlog click
          $b = (Get-Content "$env:AMD_CI_WORK\out\states.json" | & $env:AMD_CI_PY -c "import json,sys; print(json.load(sys.stdin)['paths']['head'])")
          Push-Location $b
          & $py -c "import unsloth, unsloth_zoo, trl; print('unsloth', unsloth.__file__, 'zoo', unsloth_zoo.__file__, 'trl', trl.__version__)"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::import unsloth failed on Windows (the probe records it)" }
          Pop-Location
          & $py -m pip list
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_TORCH_KIND=$kind"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_TORCH_GPU=$gpu"
          & $py "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --require windows --out "$env:AMD_CI_WORK\out\host_torch.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Differential (GPU run)
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/pytest_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/pytest_no_regression.py" `
            --out-dir "$env:AMD_CI_WORK\out\w_nt" `
            --python "$env:AMD_CI_PY" -- --subdir . --timeout 1500 --tests tests/test_import_without_triton.py tests/test_ppo_fused_logprobs.py tests/test_rloo_fused_logprobs.py `
            tests/python/test_fused_linear_bco.py tests/python/test_fused_linear_online_dpo.py tests/python/test_fused_linear_xpo_nash_md.py `
            tests/python/test_gkd_fused_linear_jsd.py tests/python/test_gkd_chunked_jsd.py
          Get-Content "$env:AMD_CI_WORK\out\w_nt\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\w_nt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nt-w_nt
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
