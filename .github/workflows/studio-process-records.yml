name: Studio process record validation
on:
  push:
    branches: [test/studio-process-records-windows]
permissions: {}
jobs:
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 30
    steps:
      - name: Live A/B and native process record tests
        shell: powershell
        env:
          VALIDATION_PAYLOAD: 
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'studio-process-records'
          New-Item -ItemType Directory -Force $work | Out-Null
          $archive = Join-Path $work 'validation.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($env:VALIDATION_PAYLOAD))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($archive, $work)
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          python --version
          python -m venv "$work/venv"
          $python = "$work/venv/Scripts/python.exe"
          & $python -m pip install --disable-pip-version-check pytest psutil structlog typer fastapi uvicorn requests cryptography huggingface_hub python-dotenv pyjwt pillow pydantic-settings rich httpx packaging tqdm
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          git init "$work/base"
          git -C "$work/base" fetch --depth 1 https://github.com/unslothai/unsloth.git 56d6f7563a34c66f15feede73dd8c5f0695aadcd
          git -C "$work/base" checkout --detach FETCH_HEAD
          git clone --no-hardlinks "$work/base" "$work/patched"
          git -C "$work/patched" apply "$work/change.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          & $python "$work/native_ab.py" $work
          if ($LASTEXITCODE -ne 0) { throw 'Native live A/B failed' }
          & $python "$work/concurrent_ab.py" $work
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent live A/B failed' }
          $env:UNSLOTH_STUDIO_HOME = "$work/test-home"
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONPATH = "$work/base;$work/base/studio/backend"
          Set-Location "$work/base"
          & $python -m pytest --noconftest -q -p no:cacheprovider --basetemp="$work/baseline-zombie" studio/backend/tests/test_studio_pid_files.py -k test_a_real_unreaped_child_is_not_a_live_sibling
          if ($LASTEXITCODE -ne 1) { throw 'Expected the existing POSIX zombie test to fail on the Windows baseline' }
          Write-Host 'Confirmed baseline failure of the POSIX-only zombie test.'
          $env:PYTHONPATH = "$work/patched;$work/patched/studio/backend"
          Set-Location "$work/patched"
          & $python -m pytest --noconftest -q -p no:cacheprovider --basetemp="$work/pytest" studio/backend/tests/test_pid_records.py studio/backend/tests/test_studio_pid_files.py unsloth_cli/tests/test_studio_stop.py tests/studio/test_studio_pid_file_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Focused Python tests failed' }
          $env:CARGO_HOME = "$work/cargo"
          $env:RUSTUP_HOME = "$work/rustup"
          $env:CARGO_TARGET_DIR = "$work/rust-target"
          Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$work/rustup-init.exe" -UseBasicParsing
          & "$work/rustup-init.exe" -y --profile minimal --no-modify-path --default-toolchain stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          & $python "$work/prepare_rust.py" $work
          foreach ($arm in @('base', 'patched')) {
            & "$work/cargo/bin/cargo.exe" test --manifest-path "$work/rust-$arm/Cargo.toml"
            if ($LASTEXITCODE -ne 0) { throw "Native Rust tests failed: $arm" }
          }
