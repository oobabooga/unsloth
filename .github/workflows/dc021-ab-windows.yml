name: DC-021 browser overlay A/B (Windows)

on:
  push:
    branches: [dc021-mac-ab]

permissions:
  contents: read

jobs:
  ab:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BASE_SHA: 8435a749be1d15368f14d3b526234d9366451ff7
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: Clone upstream at main
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone --filter=blob:none https://github.com/unslothai/unsloth.git repo
          git -C repo config core.autocrlf false
          git -C repo checkout --quiet $env:BASE_SHA
          git -C repo apply --check "$env:GITHUB_WORKSPACE/ci/fix.patch"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Screen probe
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import ImageGrab; im = ImageGrab.grab(); print('screen', im.size)"

      - name: Install Unsloth Studio backend (--local, --no-torch)
        shell: pwsh
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }

      - name: Build frontend dist and debug Tauri app
        shell: pwsh
        run: |
          cd repo/studio/frontend
          npm ci --no-fund --no-audit
          npm run build
          cd ../src-tauri
          cargo build 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

      - name: Add the CI-only harness
        shell: pwsh
        run: |
          Copy-Item ci/dc021-harness.ts repo/studio/frontend/src/dc021-harness.ts
          Add-Content repo/studio/frontend/src/main.tsx 'import "./dc021-harness";'

      - name: A/B runs
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $helper = Start-Process python -ArgumentList "ci/helper.py", "$ws/shots/tmp", "none" -RedirectStandardOutput "$ws/helper.log" -RedirectStandardError "$ws/helper.err" -PassThru -NoNewWindow
          $stateDir = Join-Path $env:APPDATA "ai.unsloth.studio"
          function Run-Side($side) {
            Remove-Item -Recurse -Force "$ws/shots/tmp" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "$ws/shots/tmp" | Out-Null
            # The same window size on both sides, whatever the previous run saved.
            New-Item -ItemType Directory -Force $stateDir | Out-Null
            '{"main":{"width":1280,"height":800,"x":0,"y":0,"prev_x":0,"prev_y":0,"maximized":false,"visible":true,"decorated":true,"fullscreen":false}}' | Set-Content -Encoding ascii (Join-Path $stateDir ".window-state.json")
            # The debug app embeds frontend/dist at compile time (custom-protocol is a default feature).
            Push-Location repo/studio/frontend; npm run build *> "$ws/vite-$side.log"; Pop-Location
            Push-Location repo/studio/src-tauri; (Get-Item src/main.rs).LastWriteTime = Get-Date; cargo build 2>&1 | Select-Object -Last 3; Pop-Location
            $app = Start-Process "repo/studio/src-tauri/target/debug/unsloth-studio.exe" -RedirectStandardOutput "$ws/app-$side.log" -RedirectStandardError "$ws/app-$side.err" -PassThru
            for ($i = 0; $i -lt 480 -and -not (Test-Path "$ws/shots/tmp/DONE"); $i++) { Start-Sleep 1 }
            Start-Sleep 2
            Move-Item "$ws/shots/tmp" "$ws/shots/$side"
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match 'unsloth|llama' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'studio|run\.py' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep 5
          }
          Run-Side "A-main"
          git -C repo apply "$ws/ci/fix.patch"
          git -C repo diff --stat
          Run-Side "B-fix"
          Get-Content "$ws/helper.log"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dc021-ab-windows
          path: |
            shots/
            helper.log
            helper.err
            vite-*.log
            app-*.log
            app-*.err
