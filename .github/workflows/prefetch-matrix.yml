name: PR 10653 prefetch matrix

on:
  push:
    branches: [pr10653-prefetch-matrix-ci]

permissions: {}

env:
  PR_SHA: 5e1e5fcc093c187eca2ee1df4fec566d54a325f5
  UV_VERSION: "0.12.1"

jobs:
  native:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64-torch, os: ubuntu-latest, mode: torch, extra: "" }
          - { label: linux-x64-no-torch, os: ubuntu-latest, mode: no-torch, extra: "" }
          - { label: macos-arm64-torch-mlx, os: macos-15, mode: torch, extra: "--mlx" }
          - { label: macos-x64-auto-no-torch, os: macos-15-intel, mode: auto, extra: "" }
          - { label: windows-x64-torch, os: windows-latest, mode: torch, extra: "" }
          - { label: windows-x64-no-torch, os: windows-latest, mode: no-torch, extra: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch PR head and harness
        run: |
          set -euxo pipefail
          uname -a || true
          python -m pip install -q "uv==$UV_VERSION"
          uv --version
          git init -q pr && cd pr && git remote add origin https://github.com/unslothai/unsloth.git
          git fetch -q --depth 1 origin "$PR_SHA" && git checkout -q FETCH_HEAD && cd ..
          git clone -q --depth 1 --branch pr10653-prefetch-matrix-ci https://github.com/${{ github.repository }}.git harness
      - name: Build prefetch.rs status helper
        run: |
          set -euxo pipefail
          cd harness/ci/status
          PR_REPO="$GITHUB_WORKSPACE/pr" cargo build --release -q
          ls target/release
      - name: Prefetch, isolation, busy lock, offline swap, old CLI
        run: |
          set -euxo pipefail
          BIN="$GITHUB_WORKSPACE/harness/ci/status/target/release/prefetch-status"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          PREFETCH_STATUS_BIN="$BIN" python harness/ci/prefetch_matrix.py "$GITHUB_WORKSPACE/pr" ${{ matrix.mode }} ${{ matrix.extra }}

  wsl:
    name: wsl-ubuntu-no-torch
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: Vampire/setup-wsl@v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: git curl python3 ca-certificates
      - name: Prefetch matrix inside WSL
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          uname -a
          curl -LsSf "https://astral.sh/uv/0.12.1/install.sh" | env UV_NO_MODIFY_PATH=1 sh
          export PATH="$HOME/.local/bin:$PATH"
          cd ~
          git init -q pr && cd pr && git remote add origin https://github.com/unslothai/unsloth.git
          git fetch -q --depth 1 origin "5e1e5fcc093c187eca2ee1df4fec566d54a325f5" && git checkout -q FETCH_HEAD && cd ~
          git clone -q --depth 1 --branch pr10653-prefetch-matrix-ci https://github.com/oobabooga/unsloth.git harness
          python3 harness/ci/prefetch_matrix.py ~/pr no-torch
