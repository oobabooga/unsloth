name: CI measure backend
'on':
  push:
    branches:
    - ci-measure-backend
permissions:
  contents: read
jobs:
  be:
    name: be ${{ matrix.shard }} ${{ matrix.variant }} r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: base
          nw: '4'
          omp: ''
          rep: 1
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: base
          nw: '4'
          omp: ''
          rep: 2
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 1
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 2
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 1
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 2
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: n16omp1
          nw: '16'
          omp: '1'
          rep: 1
        - python: '3.13'
          scope: full
          shard: a-k
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!a-k]*.py
          variant: n16omp1
          nw: '16'
          omp: '1'
          rep: 2
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: base
          nw: '4'
          omp: ''
          rep: 1
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: base
          nw: '4'
          omp: ''
          rep: 2
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 1
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 2
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 1
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 2
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: n16omp1
          nw: '16'
          omp: '1'
          rep: 1
        - python: '3.13'
          scope: full
          shard: l-r
          selection: tests/ --ignore-glob=tests/*/* --ignore-glob=tests/*_test.py --ignore-glob=tests/test_[!l-r]*.py
          variant: n16omp1
          nw: '16'
          omp: '1'
          rep: 2
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: base
          nw: '4'
          omp: ''
          rep: 1
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: base
          nw: '4'
          omp: ''
          rep: 2
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 1
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 2
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 1
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 2
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: n16omp1
          nw: '16'
          omp: '1'
          rep: 1
        - python: '3.13'
          scope: full
          shard: rest
          selection: tests/ --ignore-glob=tests/test_[a-r]*.py
          variant: n16omp1
          nw: '16'
          omp: '1'
          rep: 2
      max-parallel: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python }}
    - name: Restore the pip cache
      id: pip-cache
      uses: ./.github/actions/pip-cache-restore
      with:
        name: studio-backend
        key-files: 'pyproject.toml

          studio/backend/requirements/*.txt

          '
    - name: Install bubblewrap, so the sandbox tests run instead of skipping
      timeout-minutes: 25
      env:
        RETRY_ATTEMPTS: '2'
        RETRY_ATTEMPT_TIMEOUT: '300'
      run: "bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \\\n  'apt-get install -y --no-install-recommends bubblewrap || { apt-get update && apt-get install -y --no-install-recommends bubblewrap;\
        \ }'\n# Ubuntu 24.04 restricts user namespaces. Apply the recommended bwrap\n# AppArmor profile without disabling the host restriction.\nif [ \"$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns\
        \ 2>/dev/null || echo 0)\" = \"1\" ]; then\n  bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \\\n    'apt-get install -y --no-install-recommends apparmor-profiles || { apt-get update &&\
        \ apt-get install -y --no-install-recommends apparmor-profiles; }'\n  # The package ships the profile disabled, under extra-profiles; it has to be copied in to load.\n  [ -f /etc/apparmor.d/bwrap-userns-restrict\
        \ ] || sudo install -m 644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/ || true\n  sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict || true\nfi\n# Report\
        \ unavailable isolation so host-dependent skips are explicit.\nif bwrap --ro-bind / / --unshare-user true; then\n  echo \"bubblewrap can build a sandbox on this runner\"\nelse\n  echo \"::warning::bubblewrap\
        \ cannot build a sandbox here; confinement tests will skip\"\nfi\n"
    - name: Install backend test dependencies (CPU only)
      run: "python -m pip install --upgrade pip\n# Unsloth's declared backend deps:\npip install -r studio/backend/requirements/studio.txt\n# Extras that studio.txt does not list but the import chain needs\n\
        # (python-multipart for FastAPI form/file uploads, sqlalchemy/cryptography\n#  for the auth DB, yaml/jinja2 for utils.models.model_config, psutil for\n#  the orphan-cleanup process scan, etc.):\n\
        pip install \\\n  python-multipart aiofiles sqlalchemy cryptography psutil \\\n  pyyaml jinja2 mammoth unpdf requests \\\n  'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx \\\n\
        \  soundfile librosa\n# soundfile + librosa: test_audio_dataset_decode importorskips both, so without\n# them the no-torchcodec decode path is silently untested here.\npip install --index-url https://download.pytorch.org/whl/cpu\
        \ --extra-index-url https://pypi.org/simple \\\n  'torch>=2.4,<2.11' 'torchaudio<2.11'\n# Tracks pyproject.toml's cap.\npip install 'transformers>=4.51,<=5.17.0'\n# peft: imported at module scope\
        \ by core/inference/inference.py but listed only in\n# files this job does not install, so without it every importorskip of that module\n# SKIPS and stays green. A stub does not work: transformers\
        \ probes\n# `importlib.util.find_spec(\"peft\")`, which raises on a stub whose __spec__ is None.\n# After the CPU torch line: peft depends on torch, so earlier it would pull the CUDA wheel into\n\
        # this CPU job. Version read from extras-no-deps.txt (pinned: peft 0.19.0 breaks the export subprocess).\npip install \"$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)\"\n\
        # torchao: the pre-quant allowlist is built by importing the tensor constructors a\n# checkpoint names, and registration refuses unless one resolves, so without it\n# every pre-quant load returns\
        \ None. CPU-only is fine: it declines its cpp\n# extensions under torch < 2.11 and the pure-Python constructors still import.\npip install torchao\n"
    - name: Backend tests
      if: matrix.scope == 'full'
      working-directory: studio/backend
      run: "if [ -n \"${{ matrix.omp }}\" ]; then export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1; fi\ntimeout --signal=INT --kill-after=60 1500 \\\npython -m pytest --junitxml=$RUNNER_TEMP/junit.xml ${{ matrix.selection\
        \ }} -q --tb=short -n ${{ matrix.nw }} --dist loadgroup --timeout=330 \\\n  --ignore=tests/test_studio_api.py \\\n  --ignore=tests/test_streaming_stripper.py \\\n  --ignore=tests/test_llama_cpp_wait_for_vram_settle.py\
        \ \\\n  --ignore=tests/test_tool_xml_strip.py \\\n  --ignore=tests/test_diffusion_checkpoint_resume.py \\\n  --ignore=tests/test_tool_output_streaming.py \\\n  --ignore=tests/test_web_fetch_extraction.py\
        \ \\\n  --ignore=tests/test_tool_call_parser_strict.py \\\n  --ignore=tests/test_tunnel_safe_long_post.py \\\n  --ignore=tests/test_scan_loras_off_event_loop.py \\\n  --ignore=tests/test_anthropic_messages.py\
        \ \\\n  --ignore=tests/test_profile_stats.py \\\n  --ignore=tests/test_media_auto_switch.py \\\n  --ignore=tests/test_pr5624_regressions.py \\\n  -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection\
        \ and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda'\n"
      continue-on-error: true
    - name: Backend tests that cannot share a worker
      if: matrix.scope == 'full' && matrix.shard == 'a-k'
      working-directory: studio/backend
      run: "python -m pytest -q --tb=short --timeout=330 \\\n  tests/test_streaming_stripper.py \\\n  tests/test_llama_cpp_wait_for_vram_settle.py \\\n  tests/test_tool_xml_strip.py \\\n  tests/test_diffusion_checkpoint_resume.py\
        \ \\\n  tests/test_tool_output_streaming.py \\\n  tests/test_web_fetch_extraction.py \\\n  tests/test_tool_call_parser_strict.py \\\n  tests/test_tunnel_safe_long_post.py \\\n  tests/test_scan_loras_off_event_loop.py\
        \ \\\n  tests/test_anthropic_messages.py \\\n  tests/test_profile_stats.py \\\n  tests/test_media_auto_switch.py \\\n  tests/test_pr5624_regressions.py\n"
    - name: Decision model training tests
      if: matrix.scope == 'full' && matrix.shard == 'a-k'
      working-directory: studio/backend
      run: 'pip install unsloth_zoo "$(grep -m1 -E ''^trl=='' requirements/extras-no-deps.txt)"

        python -m pytest -q --tb=short --timeout=330 tests/test_decision_training.py

        '
    - name: Pre-3.12 branches, on the newest interpreter that takes them
      if: matrix.scope == 'floor-spot-check'
      working-directory: studio/backend
      run: "python -m pytest -q --tb=short --timeout=330 \\\n  tests/test_third_party_source.py \\\n  tests/test_recommended_folders_permission.py \\\n  tests/test_hf_cache_settings.py\n"
    - name: Why a failure here might already be fixed on the base branch
      if: 'false'
      uses: ./.github/actions/merge-ref-age
    - name: Save the pip cache
      if: 'false'
      uses: ./.github/actions/pip-cache-save
      with:
        dir: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ steps.pip-cache.outputs.key }}
        cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}
    - name: junit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: be-${{ matrix.shard }}-${{ matrix.variant }}-${{ matrix.rep }}
        path: ${{ runner.temp }}/junit.xml
        if-no-files-found: ignore
  repo:
    name: repo ${{ matrix.shard }} ${{ matrix.variant }} r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: studio-install
          selection: tests/studio/install tests/studio/studiobench
          variant: base
          nw: '4'
          omp: ''
          rep: 1
        - shard: studio-install
          selection: tests/studio/install tests/studio/studiobench
          variant: base
          nw: '4'
          omp: ''
          rep: 2
        - shard: studio-install
          selection: tests/studio/install tests/studio/studiobench
          variant: n8
          nw: '8'
          omp: ''
          rep: 1
        - shard: studio-install
          selection: tests/studio/install tests/studio/studiobench
          variant: n8
          nw: '8'
          omp: ''
          rep: 2
        - shard: studio-install
          selection: tests/studio/install tests/studio/studiobench
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 1
        - shard: studio-install
          selection: tests/studio/install tests/studio/studiobench
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 2
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py
            --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          variant: base
          nw: '4'
          omp: ''
          rep: 1
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py
            --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          variant: base
          nw: '4'
          omp: ''
          rep: 2
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py
            --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 1
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py
            --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          variant: n8
          nw: '8'
          omp: ''
          rep: 2
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py
            --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 1
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py
            --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 2
        - shard: rest
          selection: tests/ --ignore=tests/studio --ignore=tests/python --ignore=tests/qlora --ignore=tests/saving --ignore=tests/utils --ignore=tests/sh --ignore=tests/vllm_compat --ignore=tests/version_compat
            --deselect tests/test_model_registry.py::test_model_registration --deselect tests/test_model_registry.py::test_all_model_registration
          variant: base
          nw: '4'
          omp: ''
          rep: 1
        - shard: rest
          selection: tests/ --ignore=tests/studio --ignore=tests/python --ignore=tests/qlora --ignore=tests/saving --ignore=tests/utils --ignore=tests/sh --ignore=tests/vllm_compat --ignore=tests/version_compat
            --deselect tests/test_model_registry.py::test_model_registration --deselect tests/test_model_registry.py::test_all_model_registration
          variant: base
          nw: '4'
          omp: ''
          rep: 2
        - shard: rest
          selection: tests/ --ignore=tests/studio --ignore=tests/python --ignore=tests/qlora --ignore=tests/saving --ignore=tests/utils --ignore=tests/sh --ignore=tests/vllm_compat --ignore=tests/version_compat
            --deselect tests/test_model_registry.py::test_model_registration --deselect tests/test_model_registry.py::test_all_model_registration
          variant: n8
          nw: '8'
          omp: ''
          rep: 1
        - shard: rest
          selection: tests/ --ignore=tests/studio --ignore=tests/python --ignore=tests/qlora --ignore=tests/saving --ignore=tests/utils --ignore=tests/sh --ignore=tests/vllm_compat --ignore=tests/version_compat
            --deselect tests/test_model_registry.py::test_model_registration --deselect tests/test_model_registry.py::test_all_model_registration
          variant: n8
          nw: '8'
          omp: ''
          rep: 2
        - shard: rest
          selection: tests/ --ignore=tests/studio --ignore=tests/python --ignore=tests/qlora --ignore=tests/saving --ignore=tests/utils --ignore=tests/sh --ignore=tests/vllm_compat --ignore=tests/version_compat
            --deselect tests/test_model_registry.py::test_model_registration --deselect tests/test_model_registry.py::test_all_model_registration
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 1
        - shard: rest
          selection: tests/ --ignore=tests/studio --ignore=tests/python --ignore=tests/qlora --ignore=tests/saving --ignore=tests/utils --ignore=tests/sh --ignore=tests/vllm_compat --ignore=tests/version_compat
            --deselect tests/test_model_registry.py::test_model_registration --deselect tests/test_model_registry.py::test_all_model_registration
          variant: n8omp1
          nw: '8'
          omp: '1'
          rep: 2
      max-parallel: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Restore the pip cache
      id: pip-cache
      uses: ./.github/actions/pip-cache-restore
      with:
        name: repo-cpu-tests
        key-files: 'pyproject.toml

          studio/backend/requirements/*.txt

          '
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - name: Install uv (for tests/python/* sandboxed venvs)
      run: pip install uv
    - name: Install deps (shared shape with backend pytest job)
      run: "python -m pip install --upgrade pip\npip install -r studio/backend/requirements/studio.txt\npip install \\\n  python-multipart aiofiles sqlalchemy cryptography psutil \\\n  pyyaml jinja2 mammoth\
        \ unpdf requests typer \\\n  'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx\n# pytest-timeout: the --timeout flag on the pytest step below. Same reason as the\n# backend pytest\
        \ job -- without it a test that never returns is reported as the\n# job being \"cancelled\", naming nothing.\n# torchvision: unsloth_zoo.vision_utils imports it at module scope.\npip install --index-url\
        \ https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \\\n  'torch>=2.4,<2.11' 'torchvision<0.26' 'torchaudio<2.11'\n# Tracks pyproject.toml's cap. sentence-transformers\
        \ rides the transformers pin rather than a separate install, so\n# resolving it cannot bump transformers past the ceiling. It is an extra, not a core\n# dependency, and tests/test_st_modules_json_trust_gate.py\
        \ skips without it, so\n# installing it here is what makes that gate run in this shard instead of skipping.\n# version-compat-ci's zoo-imports job runs the same file against the pinned\n# transformers\
        \ matrix; this shard adds the core dependency set, where discovery\n# picks the file up and the importorskip would otherwise skip it for good.\npip install 'transformers>=4.51,<=5.17.0' sentence-transformers\n\
        # bitsandbytes: hard import in unsloth/models/_utils.py. Recent\n# versions ship a CPU build that imports cleanly on Linux.\npip install 'bitsandbytes>=0.45'\n# zoo from git main (needed by the\
        \ conftest preload), with deps so triton is installed.\nfor attempt in 1 2 3; do\n  if pip install \"unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo\"; then\n    break\n  fi\n  [ \"$attempt\"\
        \ -eq 3 ] && { echo \"::error::unsloth_zoo install failed after 3 attempts\"; exit 1; }\n  sleep $((5 * attempt))\ndone\npip install -e . --no-deps\n"
    - name: Install the pinned ruff (formatter fixed-point guard)
      run: "pin=\"$(python -c 'import sys; sys.path.insert(0, \"scripts\"); import run_ruff_format as r; print(r.pinned_ruff_version(r.CONFIG.read_text(encoding = \"utf-8\")) or \"\")')\"\nif [ -z \"$pin\"\
        \ ]; then\n  echo \"::error::.pre-commit-config.yaml no longer pins a ruff for ruff-format-with-kwargs\"\n  exit 1\nfi\npip install \"ruff==$pin\"\n"
    - name: Repo tests (CPU, auto-discovered)
      env:
        PYTHONPATH: ${{ github.workspace }}/studio
        UNSLOTH_COMPILE_DISABLE: '1'
      run: "if [ -n \"${{ matrix.omp }}\" ]; then export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1; fi\ntimeout --signal=INT --kill-after=60 2100 \\\npython -m pytest --junitxml=$RUNNER_TEMP/junit.xml ${{ matrix.selection\
        \ }} -q --tb=short -n ${{ matrix.nw }} --dist loadgroup --timeout=330 \\\n  -m 'not server and not e2e'\n"
      continue-on-error: true
    - name: Hardware-spoof tests (state-sensitive, run in isolation)
      if: matrix.shard == 'studio'
      env:
        PYTHONPATH: ${{ github.workspace }}/studio
        UNSLOTH_COMPILE_DISABLE: '1'
      run: "python -m pytest -q --tb=short \\\n  tests/studio/test_hardware_dispatch_matrix.py \\\n  tests/studio/test_is_mlx_dispatch_gate.py \\\n  tests/studio/test_xpu_spoof_pipeline.py \\\n  tests/studio/test_mlx_context_platform_matrix.py\n"
    - name: Event-loop latency tests (wall clock, run without CPU contention)
      if: matrix.shard == 'studio'
      env:
        PYTHONPATH: ${{ github.workspace }}/studio
        UNSLOTH_COMPILE_DISABLE: '1'
      run: python -m pytest tests/studio/load_freeze -q --tb=short
    - name: CLI tests (unsloth_cli)
      if: matrix.shard == 'rest'
      run: python -m pytest unsloth_cli/tests -q --tb=short
    - name: Docker JupyterLab/notebook feature validation
      if: matrix.shard == 'rest'
      run: python tests/validate_studio_features.py
    - name: Why a failure here might already be fixed on the base branch
      if: 'false'
      uses: ./.github/actions/merge-ref-age
    - name: Save the pip cache
      if: 'false'
      uses: ./.github/actions/pip-cache-save
      with:
        dir: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ steps.pip-cache.outputs.key }}
        cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}
    - name: junit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: repo-${{ matrix.shard }}-${{ matrix.variant }}-${{ matrix.rep }}
        path: ${{ runner.temp }}/junit.xml
        if-no-files-found: ignore
