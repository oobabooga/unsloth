rgs]\nelse: raise ValueError(mode)\nprint(\'RUN_CASE\',case,\'VARIANT\',variant,\'COMMAND\',cmd,flush=True)\nstart=time.time()\nwith (out/(case+\'.log\')).open(\'w\',encoding=\'utf-8\') as f:\n    child=subprocess.Popen(cmd,cwd=code,env=env,stdout=f,stderr=subprocess.STDOUT)\n    try: rc=child.wait(timeout=3600)\n    except subprocess.TimeoutExpired:\n        if sys.platform==\'win32\': subprocess.run([\'taskkill\',\'/PID\',str(child.pid),\'/T\',\'/F\'])\n        else: child.kill()\n        child.wait()\n        rc=124\nrecord=dict(case=case,variant=variant,returncode=rc,seconds=time.time()-start)\n(out/(case+\'-exit.json\')).write_text(json.dumps(record))\nprint(\'CASE_RESULT\',json.dumps(record),flush=True)\nwith (out/(case+\'.log\')).open(encoding=\'utf-8\',errors=\'replace\') as f: print(\'\'.join(deque(f,maxlen=45)),flush=True)\nsys.exit(rc)\n',encoding='utf-8')
