        (root/'execute.py').write_text('import json, os, subprocess, sys, time\nfrom collections import deque\nfrom pathlib import Path\n\nroot=Path(os.environ[\'WORK_ROOT\'])\nout=root/\'out\'\nvariant,case,mode,*args=sys.argv[1:]\npy=str(root/(\'venv/Scripts/python.exe\' if sys.platform==\'win32\' else \'venv/bin/python\'))\ncode=root/(\'code\' if variant==\'base\' else variant)\nenv=dict(os.environ,PYTHONPATH=str(code/\'studio/backend\'))\nenv.pop(\'UNSLOTH_DIFFUSION_VAE_MAX_TILE\',None)\nenv.pop(\'UNSLOTH_ALLOW_ROCM_FUSED_SDPA\',None)\nif mode==\'generate\':\n    cmd=[py,\'-u\',str(root/\'generation_final.py\'),\'--case\',case,\'--output\',str(out),*args]\nelif mode==\'probe\':\n    cmd=[py,\'-u\',str(root/\'probe_final.py\'),args[0],str(out/(case+\'.json\'))]\nelif mode==\'damage\':\n    cmd=[py,\'-m\',\'pip\',\'uninstall\',\'-y\',\'amd-torch-device-gfx115x\']\nelif mode==\'repair\':\n    env[\'UNSLOTH_ROCM_GFX_ARCH\']=\'gfx1151\'\n    env[\'UNSLOTH_ROCM_TORCH_INSTALLED\']=\'1\'\n    snippet="import os,sys,time,json;from pathlib import Path;sys.path.insert(0,os.environ[\'WORK_ROOT\']+\'/pr1/studio\');import install_python_stack as s;s.VERBOSE=True;t=time.perf_counter();before=s._multiarch_device_pack_installed(\'gfx1151\');assert not before;"\n    if sys.platform==\'win32\':\n        snippet+="s._ensure_rocm_torch();"\n    else:\n        snippet+="import subprocess;subprocess.run([sys.executable,\'-m\',\'pip\',\'install\',\'--index-url\',\'https://repo.amd.com/rocm/whl-multi-arch/\',\'--extra-index-url\',\'https://pypi.org/simple\',\'torch[device-gfx1151]==2.11.0+rocm7.14.0\'],check=True);"\n    snippet+="assert s._multiarch_device_pack_installed(\'gfx1151\');record=dict(before=before,after=True,seconds=time.perf_counter()-t,automatic_windows=sys.platform==\'win32\');print(record);Path(os.environ[\'WORK_ROOT\']+\'/out/repair.json\').write_text(json.dumps(record))"\n    cmd=[py,\'-u\',\'-c\',snippet]\nelif mode==\'test\':\n    cmd=[py,\'-m\',\'pytest\',\'-q\',*args]\nelse: raise ValueError(mode)\nprint(\'RUN_CASE\',case,\'VARIANT\',variant,\'COMMAND\',cmd,flush=True)\nstart=time.time()\nwith (out/(case+\'.log\')).open(\'w\',encoding=\'utf-8\') as f:\n    child=subprocess.Popen(cmd,cwd=code,env=env,stdout=f,stderr=subprocess.STDOUT)\n    try: rc=child.wait(timeout=3600)\n    except subprocess.TimeoutExpired:\n        if sys.platform==\'win32\': subprocess.run([\'taskkill\',\'/PID\',str(child.pid),\'/T\',\'/F\'])\n        else: child.kill()\n        child.wait()\n        rc=124\nrecord=dict(case=case,variant=variant,returncode=rc,seconds=time.time()-start)\n(out/(case+\'-exit.json\')).write_text(json.dumps(record))\nprint(\'CASE_RESULT\',json.dumps(record),flush=True)\nwith (out/(case+\'.log\')).open(encoding=\'utf-8\',errors=\'replace\') as f: print(\'\'.join(deque(f,maxlen=45)),flush=True)\nsys.exit(rc)\n',encoding='utf-8')
