name: Final ROCm attention and VAE PR validation
'on':
  push:
    branches:
    - amd-rocm-pr-validation-20261008
permissions: {}
jobs:
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 240
    env:
      STACK: multiarch-7.14.0
      UNSLOTH_IS_PRESENT: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      HF_ENDPOINT: https://huggingface.co
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      OMP_NUM_THREADS: '8'
    steps:
    - name: Prepare and verify exact PR source trees
      run: |2+

        import os,sys,subprocess,platform
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'rocm-final-validation'
        for name in ['out','tmp','cache/huggingface','cache/torch','cache/pip','studio','miopen/db','miopen/kernels']:
          (root/name).mkdir(parents=True,exist_ok=True)
        env={'WORK_ROOT':str(root),'TMPDIR':str(root/'tmp'),'TEMP':str(root/'tmp'),'TMP':str(root/'tmp'),'HF_HOME':str(root/'cache/huggingface'),'HUGGINGFACE_HUB_CACHE':str(root/'cache/huggingface/hub'),'TORCH_HOME':str(root/'cache/torch'),'PIP_CACHE_DIR':str(root/'cache/pip'),'UNSLOTH_HOME':str(root/'unsloth'),'UNSLOTH_STUDIO_HOME':str(root/'unsloth/studio'),'PYTHONPATH':str(root/'pr1/studio/backend'),'MIOPEN_USER_DB_PATH':str(root/'miopen/db'),'MIOPEN_CUSTOM_CACHE_DIR':str(root/'miopen/kernels')}
        os.environ.update(env)
        with open(os.environ['GITHUB_ENV'],'a') as f:
          for k,v in env.items(): f.write(k+'='+v+'\n')
        def run(cmd,**kw):
            print('RUN',cmd,flush=True)
            attempts=3 if cmd[0]=='git' and ('fetch' in cmd or 'checkout' in cmd) else 1
            for attempt in range(attempts):
                try:
                    return subprocess.run(cmd,check=True,timeout=180 if attempts>1 else None,**kw)
                except (subprocess.CalledProcessError,subprocess.TimeoutExpired):
                    if attempt+1==attempts: raise
                    import time
                    print('Retrying source download',attempt+1,flush=True)
                    time.sleep(5)
        with (root/'out/host.txt').open('w') as f:
          f.write(platform.platform()+'\n')
          if sys.platform=='win32': subprocess.run(['powershell','-NoProfile','-Command','Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion; Get-CimInstance Win32_OperatingSystem | Format-List Caption,TotalVisibleMemorySize'],stdout=f,stderr=subprocess.STDOUT)
          else: subprocess.run(['bash','-c','uname -a; lscpu; free -h; df -h'],stdout=f,stderr=subprocess.STDOUT)
        run(['git','init',str(root/'code')]); run(['git','-C',str(root/'code'),'config','core.autocrlf','false'])
        run(['git','-C',str(root/'code'),'remote','add','origin','https://github.com/unslothai/unsloth.git'])
        run(['git','-C',str(root/'code'),'fetch','--depth=1','--filter=blob:none','origin','264eec55213d97ec84df6117c66774971af27442'])
        run(['git','-C',str(root/'code'),'sparse-checkout','set','--no-cone',*['/*', '!/*/', '/studio/', '!/studio/*/', '/studio/backend/', '/unsloth/', '/tests/']])
        run(['git','-C',str(root/'code'),'checkout','--detach','FETCH_HEAD'])

        import base64, zlib, json
        payload = {'pr1': {'commit': '2fb0d5775517ad6f146a0197646582d2492c0d6a', 'tree': '23f0250439459176d01cc85d47a319dee9f6756e', 'patch': ''}, 'pr2': {'commit': 'ec5080a056134e4fc96a603ca22180abbedfab04', 'tree': '547f40ec90d25336dbbbf9098e52f3dc408d3e5a', 'patch': ''}}
        manifest = {}
        for variant, item in payload.items():
            folder = root/variant
            run(['git','-C',str(root/'code'),'worktree','add','--detach','--no-checkout',str(folder),'264eec55213d97ec84df6117c66774971af27442'])
            run(['git','-C',str(folder),'sparse-checkout','set','--no-cone',*['/*', '!/*/', '/studio/', '!/studio/*/', '/studio/backend/', '/unsloth/', '/tests/']])
            run(['git','-C',str(folder),'checkout','--detach','264eec55213d97ec84df6117c66774971af27442'])
            patch = root/(variant+'.patch')
            patch.write_bytes(zlib.decompress(base64.b64decode(item['patch'])))
            run(['git','-C',str(folder),'apply','--index',str(patch)])
            tree = subprocess.check_output(['git','-C',str(folder),'write-tree'],text=True).strip()
            assert tree == item['tree'], (variant,tree,item['tree'])
            manifest[variant] = dict(commit=item['commit'],tree=tree)
        (root/'out/source-manifest.json').write_text(json.dumps(manifest,indent=2))

      timeout-minutes: 20
      shell: python -X utf8 {0}
    - name: Source evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: source-Windows
        path: ${{ env.WORK_ROOT }}/out
        retention-days: 14
    - name: Install AMD Torch device extras
      run: |
        import os,sys,subprocess,time
        from pathlib import Path
        root=Path(os.environ['WORK_ROOT'])
        py=str(root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python'))
        c=root/'torch-constraints.txt'
        def run(cmd,**kw):
            print('RUN',cmd,flush=True)
            return subprocess.run(cmd,check=True,**kw)
        run([sys.executable,'-m','venv',str(root/'venv')])
        py=str(root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python'))
        run([py,'-m','pip','install','--upgrade','pip'])
        stack=os.environ['STACK']
        if stack=='multiarch-7.14.0':
          specs=['torch[device-gfx1151]==2.11.0+rocm7.14.0','torchvision[device-gfx1151]==0.26.0+rocm7.14.0','torchaudio==2.11.0+rocm7.14.0']
          idx='https://repo.amd.com/rocm/whl-multi-arch/'
          cons=['torch==2.11.0+rocm7.14.0','torchvision==0.26.0+rocm7.14.0','torchaudio==2.11.0+rocm7.14.0']
        else:
          specs=['torch==2.11.0+rocm7.13.0','torchvision==0.26.0+rocm7.13.0']
          idx='https://repo.amd.com/rocm/whl/gfx1151/'
          cons=['torch==2.11.0+rocm7.13.0','torchvision==0.26.0+rocm7.13.0']
        run([py,'-m','pip','install','--index-url',idx,'--extra-index-url','https://pypi.org/simple',*specs])
        c=root/'torch-constraints.txt'; c.write_text('\n'.join(cons)+'\n')
      timeout-minutes: 30
      shell: python -X utf8 {0}
    - name: Install Studio dependencies and validation harness
      run: |
        import os,sys,subprocess,time
        from pathlib import Path
        root=Path(os.environ['WORK_ROOT'])
        py=str(root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python'))
        c=root/'torch-constraints.txt'
        def run(cmd,**kw):
            print('RUN',cmd,flush=True)
            return subprocess.run(cmd,check=True,**kw)
        rq=root/'code/studio/backend/requirements'
        run([py,'-m','pip','install','-c',str(c),'-r',str(rq/'studio.txt'),'-r',str(rq/'diffusers-pin.txt')])
        run([py,'-m','pip','install','-c',str(c),'-r',str(rq/'diffusers-main.txt')])
        run([py,'-m','pip','install','-c',str(c),'transformers==5.5.0','accelerate>=1.0','peft>=0.18','sentencepiece','psutil','protobuf','scipy','einops','Pillow','pyyaml','safetensors','tyro','msgspec','wheel','pytest','httpx'])
        run([py,'-m','pip','install','--no-deps','unsloth-zoo>=2026.9.9'])
        run([py,'-m','pip','install','--no-deps',str(root/'code')])
        run([py,'-m','pip','install','--no-deps','torchao==0.17.0'])
        with (root/'out/pip-freeze.txt').open('w') as f: run([py,'-m','pip','freeze'],stdout=f)
        run([py,'-c',"import main, torch; print(torch.__version__, torch.version.hip, torch.cuda.get_device_properties(0)); x=torch.randn((256,256),device='cuda',dtype=torch.bfloat16); print((x@x).sum().item()); from core.inference.diffusion import DiffusionBackend; from diffusers import QwenImage21Pipeline; print('IMPORTS PASSED')"])


        (root/'generation_final.py').write_text('"""Studio\'s own DiffusionBackend: Qwen-Image-2.1 GGUF Q4_K_M, Auto, optionally under a simulated 20 GB discrete card."""\nimport argparse\nimport json\nimport os\nimport sys\nimport threading\nimport time\nimport traceback\nfrom pathlib import Path\n\np = argparse.ArgumentParser()\np.add_argument("--placement", choices=["auto","auto-tiled","resident","resident-tiled","model"], default="auto")\np.add_argument("--query-chunking", default="auto")\np.add_argument("--case", required=True)\np.add_argument("--output", required=True)\np.add_argument("--free-gib", type=float, default=0)\np.add_argument("--te", default="auto")\np.add_argument("--steps", type=int, default=4)\np.add_argument("--repeats", type=int, default=2)\np.add_argument("--size", type=int, default=1024)\np.add_argument("--serialize", action="store_true")\np.add_argument("--disable-fused-sdpa", action="store_true")\np.add_argument("--memory-mode", default="auto")\np.add_argument("--env", action="append", default=[])\np.add_argument("--expect-bounded", action="store_true")\np.add_argument("--expect-tiles", action="store_true")\nargs = p.parse_args()\nout = Path(args.output)\nout.mkdir(parents=True, exist_ok=True)\nlock = threading.Lock()\n\n\ndef emit(event, **fields):\n    line = json.dumps(dict(event=event, case=args.case, t=time.time(), **fields), default=str)\n    with lock:\n        print("PROBE " + line, flush=True)\n        with (out / (args.case + ".jsonl")).open("a", encoding="utf-8") as f:\n            f.write(line + "\\n")\n\n\nfor kv in args.env:\n    k, _, v = kv.partition("=")\n    os.environ[k] = v\nif args.serialize:\n    os.environ["AMD_SERIALIZE_KERNEL"] = "1"\n    os.environ["HIP_LAUNCH_BLOCKING"] = "1"\n    os.environ["CUDA_LAUNCH_BLOCKING"] = "1"\nos.environ["UNSLOTH_QWEN_IMAGE_ROCM_QUERY_CHUNKING"] = args.query_chunking\nos.environ["UNSLOTH_DIFFUSION_COND_CACHE_DIR"] = str(out / (args.case + "-conditioning"))\nimport main as studio_main  # Studio\'s own startup env (AOTriton opt-in, etc.)\n\nimport torch\nimport psutil\n\nemit("env", main=studio_main.__file__, torch=torch.__version__, hip=torch.version.hip,\n     props=str(torch.cuda.get_device_properties(0)),\n     env={k: os.environ.get(k) for k in ("TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL", "MIOPEN_SEARCH_CUTOFF",\n                                         "AMD_SERIALIZE_KERNEL", "PYTORCH_ALLOC_CONF", "PYTORCH_HIP_ALLOC_CONF")},\n     sdp=dict(flash=torch.backends.cuda.flash_sdp_enabled(), mem=torch.backends.cuda.mem_efficient_sdp_enabled(),\n              math=torch.backends.cuda.math_sdp_enabled()),\n     blas=str(torch.backends.cuda.preferred_blas_library()))\nif args.disable_fused_sdpa:\n    torch.backends.cuda.enable_flash_sdp(False)\n    torch.backends.cuda.enable_mem_efficient_sdp(False)\nfrom utils.hardware import ensure_hardware_detected\n\nensure_hardware_detected()\nemit("after_hw_detect", env={k: os.environ.get(k) for k in ("MIOPEN_SEARCH_CUTOFF", "MIOPEN_FIND_MODE")})\nfrom core.inference import diffusion as d\nfrom core.inference import diffusion_memory as dm\nfrom core.inference.diffusion_attention import available_sdpa_kernels\nfrom core.inference.diffusion_device import resolve_diffusion_device_target\n\ntarget = resolve_diffusion_device_target()\nemit("target", target=target.as_public_dict())\nprops = torch.cuda.get_device_properties(0)\nif args.free_gib:\n    cap = int(args.free_gib * 2**30)\n    torch.cuda.set_per_process_memory_fraction(cap / props.total_memory, 0)\n\n    real_memory_info = torch.cuda.mem_get_info\n    def capped_memory_info(device=None):\n        physical_free, _ = real_memory_info(device)\n        return min(physical_free, max(0, cap - torch.cuda.memory_reserved(device))), 20 * 2**30\n    torch.cuda.mem_get_info = capped_memory_info\n    def virtual_memory(backend):\n        free, total = capped_memory_info()\n        return free // 2**20, total // 2**20, "discrete_vram"\n\n    dm._cuda_memory = virtual_memory\n    emit("synthetic_capacity", total_gib=20, free_gib=args.free_gib)\nfrom dataclasses import replace\norig_plan = d.plan_diffusion_memory\n\n\ndef record_plan(**kw):\n    plan = orig_plan(**kw)\n    if args.placement == "auto-tiled":\n        plan = replace(plan, vae_tiling=True)\n    elif args.placement in ("resident", "resident-tiled"):\n        plan = replace(plan, offload_policy="none", stream_text_encoders=False, stream_transformer=False,\n                       vae_tiling=args.placement.endswith("tiled"), resident_transformer_mib=None,\n                       resident_text_encoder_mib=None, reasons=("experimental forced resident placement",))\n    elif args.placement == "model":\n        plan = replace(plan, offload_policy="model", vae_tiling=True, stream_text_encoders=False,\n                       stream_transformer=False, resident_transformer_mib=None, resident_text_encoder_mib=None,\n                       reasons=("experimental whole-component placement",))\n    emit("plan", plan=plan.as_public_dict())\n    return plan\n\n\nd.plan_diffusion_memory = record_plan\nproc = psutil.Process()\n\n\ndef mem():\n    return dict(alloc=torch.cuda.memory_allocated(), reserved=torch.cuda.memory_reserved(),\n                peak=torch.cuda.max_memory_allocated(), rss=proc.memory_info().rss)\n\n\nbackend = d.DiffusionBackend()\ntry:\n    t0 = time.perf_counter()\n    backend.begin_load("unsloth/Qwen-Image-2.1-GGUF", gguf_filename="qwen-image-2.1-Q4_K_M.gguf",\n                       family_override="qwen-image-2.1", memory_mode=args.memory_mode,\n                       **({} if args.te == "auto" else {"text_encoder_quant": args.te}))\n    deadline = time.monotonic() + 3000\n    while True:\n        pr = backend.load_progress()\n        if pr.get("error"):\n            raise RuntimeError(pr["error"])\n        if pr.get("phase") == "ready":\n            break\n        if time.monotonic() > deadline:\n            raise TimeoutError("load > 50 min")\n        time.sleep(10)\n    emit("loaded", seconds=time.perf_counter() - t0, status=backend.status(), mem=mem())\n    import functools\n    pipe = backend._state.pipe\n    from core.inference import diffusion_attention as attention\n    processors = [type(m.processor).__name__ for m in pipe.transformer.modules() if hasattr(m,"processor")]\n    emit("attention_state", processors=sorted(set(processors)), flash=torch.backends.cuda.flash_sdp_enabled(), mem=torch.backends.cuda.mem_efficient_sdp_enabled(), math=torch.backends.cuda.math_sdp_enabled())\n    if args.expect_bounded:\n        from core.inference.diffusion_qwenimage21_math import bounded_math_attention\n        assert bounded_math_attention(pipe), processors\n        assert not torch.backends.cuda.flash_sdp_enabled()\n        assert not torch.backends.cuda.mem_efficient_sdp_enabled()\n    assert not os.environ.get("UNSLOTH_DIFFUSION_VAE_MAX_TILE"), "tile override must be absent"\n    phase_rows = []\n    tile_rows = []\n    from core.inference import diffusion_vae_tiling as vt\n    original_decode_tile = vt._decode_tile\n    def measured_decode_tile(vae, z):\n        row = dict(shape=list(z.shape), ok=False)\n        tile_rows.append(row)\n        try:\n            result = original_decode_tile(vae, z)\n            row["ok"] = True\n            return result\n        except Exception as exc:\n            row["error"] = type(exc).__name__\n            raise\n    vt._decode_tile = measured_decode_tile\n    def instrument(obj, method, phase):\n        if method == "forward":\n            pending = []\n            def before_forward(module, call_args):\n                torch.cuda.synchronize()\n                torch.cuda.reset_peak_memory_stats()\n                pending.append((time.perf_counter(), mem()))\n            def after_forward(module, call_args, output):\n                if not pending:\n                    return\n                began, before = pending.pop()\n                torch.cuda.synchronize()\n                row = dict(phase=phase, seconds=time.perf_counter()-began, before=before, after=mem())\n                phase_rows.append(row)\n                emit("phase", **row)\n            obj.register_forward_pre_hook(before_forward)\n            obj.register_forward_hook(after_forward, always_call=True)\n            return\n        original = getattr(obj, method)\n        @functools.wraps(original)\n        def measured(*a, **kw):\n            torch.cuda.synchronize()\n            torch.cuda.reset_peak_memory_stats()\n            before = mem()\n            began = time.perf_counter()\n            try:\n                return original(*a, **kw)\n            finally:\n                torch.cuda.synchronize()\n                row = dict(phase=phase, seconds=time.perf_counter()-began,\n                           before=before, after=mem())\n                phase_rows.append(row)\n                emit("phase", **row)\n        setattr(obj, method, measured)\n    instrument(pipe, "encode_prompt", "encode")\n    instrument(pipe.transformer, "forward", "denoise")\n    instrument(pipe.vae, "decode", "decode")\n    emit("placement", policy=backend._state.offload_policy, tiling=getattr(pipe.vae,"use_tiling",None),\n         components={name:dict(device=str(next(module.parameters()).device),\n                              bytes=sum(p.numel()*p.element_size() for p in module.parameters()))\n                     for name,module in pipe.components.items() if isinstance(module,torch.nn.Module)})\n    prompts = ["A red ceramic teapot on a wooden table beside a window, soft daylight, photograph.",\n               "A blue ceramic teapot on a wooden table beside a window, soft daylight, photograph.",\n               "A chalkboard menu that reads FRESH COFFEE 2.50 in a small cafe."]\n    for i in range(args.repeats):\n        phase_rows.clear()\n        tile_rows.clear()\n        t1 = time.perf_counter()\n        res = backend.generate(prompt=prompts[i % len(prompts)], width=args.size, height=args.size,\n                               steps=args.steps, guidance=1.0, seed=42)\n        torch.cuda.synchronize()\n        for j, im in enumerate(res["images"]):\n            im.save(out / f"{args.case}-{i}-{j}.png")\n        emit("render", tiles=tile_rows, last_decode_tile=getattr(pipe.vae,"_unsloth_last_decode_tile",None), index=i, seconds=time.perf_counter() - t1, mem=mem(), status=backend.status(),\n             phase_seconds={ph:sum(r["seconds"] for r in phase_rows if r["phase"]==ph) for ph in ("encode","denoise","decode")},\n             peak_allocated=max([r["after"]["peak"] for r in phase_rows] or [torch.cuda.max_memory_allocated()]))\n        if args.expect_tiles:\n            assert tile_rows, "tiled decoder was not exercised"\n            assert all(row["ok"] for row in tile_rows), tile_rows\n            assert all(max(row["shape"][-2:]) <= 32 for row in tile_rows), tile_rows\n            assert tuple(pipe.vae._unsloth_last_decode_tile[:2]) == (32,32)\n        import numpy as np\n        for im in res["images"]:\n            pixels=np.asarray(im)\n            assert pixels.shape[:2] == (args.size,args.size)\n            assert pixels.std() > 1, "blank image"\n    emit("complete", success=True)\nexcept Exception as exc:  # noqa: BLE001\n    emit("failure", error=repr(exc)[:2000], traceback=traceback.format_exc()[-8000:], mem=None)\n    raise\nfinally:\n    try:\n        backend.unload()\n    except Exception:  # noqa: BLE001\n        pass\n',encoding='utf-8')
        (root/'probe_final.py').write_text("import json, sys, time\nfrom pathlib import Path\nstarted=time.perf_counter()\nimport main\nimport torch\nfrom utils.hardware import ensure_hardware_detected\nensure_hardware_detected()\nfrom core.inference.diffusion_device import resolve_diffusion_device_target\nfrom core.inference import diffusion_attention as att\nfrom importlib import metadata\n\ntarget=resolve_diffusion_device_target()\nwant=sys.argv[1]\noutput=Path(sys.argv[2])\nt0=time.perf_counter()\navailable=att.available_sdpa_kernels(target)\ncold=time.perf_counter()-t0\nt0=time.perf_counter()\ncached=att.available_sdpa_kernels(target)\nwarm=time.perf_counter()-t0\ndisabled=att.guard_rocm_fused_sdpa(target)\nrecord=dict(want=want,available=available,cached=cached,disabled=disabled,cold_probe_seconds=cold,cached_probe_seconds=warm,process_seconds=time.perf_counter()-started,torch=torch.__version__,diffusers=metadata.version('diffusers'),device=str(torch.cuda.get_device_properties(0)),target=target.as_public_dict())\noutput.write_text(json.dumps(record,indent=2,default=str))\nprint('FINAL_PROBE',json.dumps(record,default=str),flush=True)\nassert available==cached\nif want=='healthy':\n    assert set(available)=={'math','flash','mem_efficient'}, available\n    assert not disabled\nelse:\n    assert available==('math',), available\n    assert set(disabled)=={'flash','mem_efficient'}, disabled\n    assert att.sdpa_math_only(target)\n\n# Check the final processor's prefill, masks and cache on the actual AMD device.\nfrom diffusers.models.transformers import transformer_qwenimage21 as qmod\nfrom core.inference.diffusion_qwenimage21_math import _processor_class\nfrom torch.nn.attention import sdpa_kernel, SDPBackend\nfrom diffusers.models.attention_dispatch import attention_backend\nwith torch.inference_mode(),sdpa_kernel([SDPBackend.MATH]),attention_backend('native'):\n    torch.manual_seed(7)\n    layer=qmod.QwenImage21Attention(dim=64,heads=2,dim_head=32).to(device='cuda',dtype=torch.bfloat16)\n    states=torch.randn(2,1800,64,device='cuda',dtype=torch.bfloat16)\n    stock=qmod.QwenImage21AttnProcessor()\n    bounded=_processor_class()()\n    mask=torch.ones(2,1800,device='cuda',dtype=torch.bool)\n    mask[1,580:600]=False\n    caches=[qmod.QwenImage21KVLayerCache(),qmod.QwenImage21KVLayerCache()]\n    kwargs=dict(segments=[(0,600,True),(600,1130,False)],key_valid=mask,kv_cache_mode='extract',cache_write_slice=slice(0,1130))\n    reference=stock(layer,states,layer_cache=caches[0],**kwargs)\n    actual=bounded(layer,states,layer_cache=caches[1],**kwargs)\n    torch.testing.assert_close(actual,reference,atol=.02,rtol=.02)\n    torch.testing.assert_close(caches[0].k,caches[1].k,atol=0,rtol=0)\n    torch.testing.assert_close(caches[0].v,caches[1].v,atol=0,rtol=0)\n    prefill_error=(actual.float()-reference.float()).abs().max().item()\n    decode=states[:,1130:]\n    kwargs=dict(kv_cache_mode='cached',attention_mask=mask[:,None,None,:])\n    reference=stock(layer,decode,layer_cache=caches[0],**kwargs)\n    actual=bounded(layer,decode,layer_cache=caches[1],**kwargs)\n    torch.testing.assert_close(actual,reference,atol=.02,rtol=.02)\n    record['processor_checks']=dict(prefill_max_abs=prefill_error,decode_max_abs=(actual.float()-reference.float()).abs().max().item(),kv_cache_exact=True)\noutput.write_text(json.dumps(record,indent=2,default=str))\nprint('PROCESSOR_CHECKS',json.dumps(record['processor_checks']),flush=True)\n",encoding='utf-8')
