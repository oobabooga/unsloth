name: "AMD CI: llama.cpp PR 268 MoE lookup mmap A/B"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-llama268-moe-mmap]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "268"
  UPSTREAM: "https://github.com/unslothai/llama.cpp"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  gpu:
    name: "PR 268 GPU measurement (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 170
    # A shared constant, deliberately: it serialises every GPU measurement across
    # all branches. That is stricter than co-tenancy strictly requires now that the
    # pool is many machines, but nothing in the label set can pin or exclude a
    # machine, so "two GPU jobs never run at once" is the only enforceable version
    # of "no co-tenant moved my number".
    # The cost is that the group holds one runner plus one waiter,
    # so a third arrival evicts the waiter. `cancel-in-progress: false` protects
    # the job already running, not the one queued behind it. Re-run the job.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr268-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Host diagnostics
        run: |
          set +e
          D="$AMD_CI_WORK/out/diag.txt"
          {
            echo "## runner: ${RUNNER_NAME:-?}"; uname -a; cat /etc/os-release | head -4; id; nproc
            echo "## free -m"; free -m
            echo "## df"; df -h "$AMD_CI_WORK" /tmp
            echo "## tools"; for t in hipconfig hipcc amdclang++ rocminfo amd-smi rocm-smi cmake ninja make gcc g++ python3 uv docker curl git hf; do printf '%-10s %s\n' "$t" "$(command -v $t || echo -)"; done
            echo "## /opt"; ls -la /opt 2>&1; ls -d /opt/rocm* 2>&1
            echo "## hipconfig"; hipconfig --full 2>&1 | head -60
            echo "## rocm cmake"; ls /opt/rocm/lib/cmake 2>&1 | head -80
            echo "## kfd"; ls -la /dev/kfd /dev/dri 2>&1; grep -h -E "gfx_target_version|simd_count|mem_banks" /sys/class/kfd/kfd/topology/nodes/*/properties 2>&1
            echo "## drm mem"; for f in /sys/class/drm/card*/device/mem_info_vram_total /sys/class/drm/card*/device/mem_info_gtt_total /sys/class/drm/card*/device/mem_info_vis_vram_total; do echo "$f $(cat $f 2>/dev/null)"; done
            echo "## rocminfo"; rocminfo 2>&1 | grep -E "Marketing Name|Name: +gfx|Device Type|Size:" | head -30
            echo "## ulimit -l"; ulimit -l
            echo "## cgroup"; cat /sys/fs/cgroup/memory.max 2>&1
            echo "## python"; python3 --version; python3 -c "import venv, ensurepip; print('venv ok')" 2>&1
          } > "$D" 2>&1
          cat "$D"

      - name: Toolchain, model download, build base and fix
        timeout-minutes: 90
        run: |
          set -uo pipefail
          W="$AMD_CI_WORK"; OUT="$W/out"
          WANT=87fa81fbc53431ef0cae125e9fa36a947cc101f9
          URL="https://huggingface.co/unsloth/Qwen3-30B-A3B-GGUF/resolve/main/Qwen3-30B-A3B-UD-IQ1_S.gguf"
          mkdir -p "$W/model"
          MODEL="$W/model/Qwen3-30B-A3B-UD-IQ1_S.gguf"
          # Model download runs while the toolchain installs and the tree builds; waited on below.
          ( curl -fL --retry 8 --retry-delay 10 -s -S -o "$MODEL" "$URL" > "$OUT/curl.log" 2>&1; echo "curl rc=$?" >> "$OUT/curl.log" ) &
          CURL_PID=$!

          # venv for cmake/ninja/numpy (and TheRock if the host has no usable ROCm)
          python3 -m venv "$W/venv" || uv venv "$W/venv" || { echo "FATAL: no venv"; exit 1; }
          VP="$W/venv/bin/python"
          "$VP" -m pip --version >/dev/null 2>&1 || uv pip install --python "$VP" pip
          "$VP" -m pip install -q cmake ninja numpy pyyaml || { echo "FATAL: pip cmake ninja"; exit 1; }
          export PATH="$W/venv/bin:$PATH"

          TC=""
          if [ -x /opt/rocm/bin/hipconfig ] && [ -d /opt/rocm/lib/cmake/hipblas ] && [ -d /opt/rocm/lib/cmake/rocblas ]; then
            TC=host; ROCM=/opt/rocm
          else
            TC=therock
            T0=$(date +%s)
            "$VP" -m pip install -q --index-url https://rocm.nightlies.amd.com/v2/gfx1151/ "rocm[libraries,devel]" > "$OUT/therock_pip.log" 2>&1
            prc=$?; tail -20 "$OUT/therock_pip.log"
            [ "$prc" -eq 0 ] || { echo "FATAL: TheRock pip failed rc=$prc"; exit 1; }
            "$W/venv/bin/rocm-sdk" init > "$OUT/therock_init.log" 2>&1; tail -5 "$OUT/therock_init.log"
            ROCM=$("$W/venv/bin/rocm-sdk" path --root)
            echo "TheRock install took $(( $(date +%s) - T0 )) s"
            "$VP" -m pip list 2>/dev/null | grep -i rocm | tee "$OUT/therock_versions.txt"
          fi
          HIPCXX="$ROCM/llvm/bin/clang"; [ -x "$HIPCXX" ] || HIPCXX="$ROCM/lib/llvm/bin/clang"
          [ -x "$HIPCXX" ] || { echo "FATAL: no HIP clang under $ROCM"; ls "$ROCM" "$ROCM/lib" | head -50; exit 1; }
          export HIPCXX HIP_PATH="$ROCM" ROCM_PATH="$ROCM" PATH="$ROCM/bin:$PATH"
          export LD_LIBRARY_PATH="$ROCM/lib:$ROCM/lib64:${LD_LIBRARY_PATH:-}"
          {
            echo "toolchain=$TC"; echo "ROCM=$ROCM"; echo "HIPCXX=$HIPCXX"
            "$HIPCXX" --version 2>&1 | head -3; hipconfig --version 2>&1
          } | tee "$OUT/toolchain.txt"
          {
            echo "HIP_PATH=$ROCM"; echo "ROCM_PATH=$ROCM"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"; echo "PATH=$PATH"
          } >> "$GITHUB_ENV"

          SRC="$W/llama"
          mkdir -p "$SRC"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin https://github.com/unslothai/llama.cpp
          git -C "$SRC" fetch -q --depth 1 origin refs/pull/268/head || { echo "FATAL: fetch pull/268/head"; exit 1; }
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          GOT=$(git -C "$SRC" rev-parse HEAD)
          echo "pull/268/head = $GOT" | tee "$OUT/source.txt"
          [ "$GOT" = "$WANT" ] || { echo "FATAL: #268 head moved: $GOT != $WANT"; exit 1; }

          CMK=(-S "$SRC" -B "$SRC/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
               -DGGML_HIP=ON -DAMDGPU_TARGETS=gfx1151 -DGPU_TARGETS=gfx1151 -DGGML_HIP_ROCWMMA_FATTN=OFF
               -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_EXE_LINKER_FLAGS=-no-pie -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
               -DCMAKE_HIP_COMPILER="$HIPCXX" -DCMAKE_PREFIX_PATH="$ROCM")
          T0=$(date +%s)
          cmake "${CMK[@]}" > "$OUT/cmake_configure.log" 2>&1 || { tail -60 "$OUT/cmake_configure.log"; exit 1; }
          tail -15 "$OUT/cmake_configure.log"
          cmake --build "$SRC/build" --target llama-completion llama-server llama-cli -j "$(nproc)" > "$OUT/build_base.log" 2>&1 || { tail -80 "$OUT/build_base.log"; exit 1; }
          echo "base build took $(( $(date +%s) - T0 )) s" | tee -a "$OUT/toolchain.txt"
          mkdir -p "$W/states/base/bin" "$W/states/head/bin"
          cp "$SRC"/build/bin/llama-completion "$SRC"/build/bin/llama-server "$SRC"/build/bin/llama-cli "$W/states/base/bin/"

          git -C "$SRC" apply --index "$GITHUB_WORKSPACE/amd_ci/moe_materialize.patch" || { echo "FATAL: patch does not apply"; exit 1; }
          git -C "$SRC" diff --cached --stat | tee "$OUT/patch_stat.txt"
          T0=$(date +%s)
          cmake --build "$SRC/build" --target llama-completion llama-server llama-cli -j "$(nproc)" > "$OUT/build_fix.log" 2>&1 || { tail -80 "$OUT/build_fix.log"; exit 1; }
          echo "fix rebuild took $(( $(date +%s) - T0 )) s" | tee -a "$OUT/toolchain.txt"
          cp "$SRC"/build/bin/llama-completion "$SRC"/build/bin/llama-server "$SRC"/build/bin/llama-cli "$W/states/head/bin/"
          md5sum "$W"/states/*/bin/llama-completion | tee -a "$OUT/toolchain.txt"
          grep -c "materialize_mapped" "$W/states/head/bin/llama-completion" "$W/states/base/bin/llama-completion" | tee -a "$OUT/toolchain.txt"
          ldd "$W/states/head/bin/llama-completion" > "$OUT/ldd.txt" 2>&1

          printf '{"pr": 268, "merged": false, "commits": {"base": "%s", "head": "%s+materialize-533edbff60"}, "paths": {"base": "%s", "head": "%s"}}\n' \
            "$GOT" "$GOT" "$W/states/base" "$W/states/head" > "$OUT/states.json"
          cat "$OUT/states.json"

          wait "$CURL_PID"
          cat "$OUT/curl.log"
          ls -la "$MODEL"
          [ -s "$MODEL" ] || { echo "FATAL: model download failed"; exit 1; }
          # MoE cache = about 1/3 of the expert bytes
          MIB=$(PYTHONPATH="$SRC/gguf-py" "$VP" - "$MODEL" <<'PY'
          import sys
          from gguf import GGUFReader
          r = GGUFReader(sys.argv[1])
          b = sum(int(t.n_bytes) for t in r.tensors if "_exps" in t.name)
          print(int(b / 3 / 2**20), file=sys.stdout)
          print(f"expert bytes {b/2**20:.1f} MiB over {sum(1 for t in r.tensors if '_exps' in t.name)} tensors", file=sys.stderr)
          PY
          ) || MIB=""
          case "$MIB" in ''|*[!0-9]*) echo "expert size probe failed, using 2600"; MIB=2600 ;; esac
          echo "cache_mib=$MIB" | tee -a "$OUT/toolchain.txt"
          { echo "AMD_CI_MODEL=$MODEL"; echo "AMD_CI_CACHE_MIB=$MIB"; echo "AMD_CI_PY=python3"; } >> "$GITHUB_ENV"
          free -m | tee "$OUT/free_after_build.txt"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/llama_moe_lookup_probe.py \
            --criteria amd_ci/criteria/llama_moe_lookup.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --model "$AMD_CI_MODEL" --cache-mib "$AMD_CI_CACHE_MIB" --reps 3 --arms mmap:mmap none:none mmap_mat0:mmap:LLAMA_MOE_CACHE_MATERIALIZE=0 auto:auto:1
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr268-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
