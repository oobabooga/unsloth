name: FastFlow NPU context-full parity
'on':
  push:
    branches:
    - amd-fastflow-ux-c5984ef8
permissions: {}
jobs:
  linux-B:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 220
    defaults:
      run:
        shell: bash
    steps:
    - name: Prepare a fresh user and fetch the harness
      run: 'set -euxo pipefail

        root="$RUNNER_TEMP/ab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-B"

        mkdir -p "$root/h" "$root/evidence" "$root/home"

        echo "UX_ROOT=$root" >> $GITHUB_ENV

        echo "PLAYWRIGHT_BROWSERS_PATH=$root/pw-browsers" >> $GITHUB_ENV

        echo "HOME=$root/home" >> $GITHUB_ENV

        echo "$root/home/.local/bin" >> $GITHUB_PATH

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/uxlib.py" -o "$root/h/uxlib.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ui.py" -o "$root/h/ux_ui.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab.py" -o "$root/h/ux_ab.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab2.py" -o "$root/h/ux_ab2.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab3.py" -o "$root/h/ux_ab3.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_final.py" -o "$root/h/ux_final.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_parity.py" -o "$root/h/ux_parity.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/probe_hw.py" -o "$root/h/probe_hw.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/fix.patch" -o "$root/h/fix.patch"

        python3 "$root/h/probe_hw.py" "$root/evidence/hardware.json"'
    - name: Install Studio from source (B)
      timeout-minutes: 60
      run: 'set -uxo pipefail

        unset HF_HOME HF_ENDPOINT HF_HUB_DISABLE_XET XDG_CACHE_HOME HUGGINGFACE_HUB_CACHE TRANSFORMERS_CACHE

        git clone -q --filter=blob:none https://github.com/unslothai/unsloth.git "$UX_ROOT/src"

        git -C "$UX_ROOT/src" checkout -q 5e927b0fa337ad18e84261dd1ca691f98a8931c6

        git -C "$UX_ROOT/src" apply --whitespace=nowarn "$UX_ROOT/h/fix.patch"

        { git -C "$UX_ROOT/src" log -1 --format=%H; git -C "$UX_ROOT/src" status --short; } > "$UX_ROOT/evidence/source.txt"

        start=$(date +%s)

        (cd "$UX_ROOT/src" && ./install.sh --local) 2>&1 | tee "$UX_ROOT/evidence/install.log"

        rc=${PIPESTATUS[0]}

        echo "install rc=$rc seconds=$(( $(date +%s) - start ))" | tee "$UX_ROOT/evidence/install-summary.txt"

        exit $rc'
    - name: Browser for the harness
      timeout-minutes: 15
      run: 'set -euxo pipefail

        python3 -m venv "$UX_ROOT/pw"

        "$UX_ROOT/pw/bin/pip" install -q playwright==1.55.0 requests

        env -u LD_LIBRARY_PATH "$UX_ROOT/pw/bin/python" -m playwright install chromium'
    - name: A/B session (B)
      timeout-minutes: 120
      if: always()
      env:
        UX_SUITE: ab
        UX_OS: Linux
        UX_SIDE: B
      run: env -u LD_LIBRARY_PATH "$UX_ROOT/pw/bin/python" -u "$UX_ROOT/h/ux_parity.py"
    - name: Collect Studio logs
      if: always()
      run: find "$HOME/.unsloth" -name '*.log' -size -50M -exec cp {} "$UX_ROOT/evidence/" \; 2>/dev/null; true
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ab-B-linux
        path: ${{ env.UX_ROOT }}/evidence
        retention-days: 14
  windows-B:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 220
    defaults:
      run:
        shell: powershell
    steps:
    - name: Prepare a fresh user and fetch the harness
      run: '$ErrorActionPreference = ''Stop''

        $root = Join-Path $env:RUNNER_TEMP (''ab-'' + $env:GITHUB_RUN_ID + ''-'' + $env:GITHUB_RUN_ATTEMPT + ''-B'')

        New-Item -ItemType Directory -Force -Path $root, "$root\h", "$root\evidence" | Out-Null

        "UX_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

        "PLAYWRIGHT_BROWSERS_PATH=$root\pw-browsers" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

        "UNSLOTH_STUDIO_HOME=$root\studio" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

        "PYTHONUTF8=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

        "PYTHONIOENCODING=utf-8" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/uxlib.py" -OutFile "$root\h\uxlib.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ui.py" -OutFile "$root\h\ux_ui.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab.py" -OutFile "$root\h\ux_ab.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab2.py" -OutFile "$root\h\ux_ab2.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab3.py" -OutFile "$root\h\ux_ab3.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_final.py" -OutFile "$root\h\ux_final.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_parity.py" -OutFile "$root\h\ux_parity.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/probe_hw.py" -OutFile "$root\h\probe_hw.py"

        Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/fix.patch" -OutFile "$root\h\fix.patch"

        python "$root\h\probe_hw.py" "$root\evidence\hardware.json"'
    - name: Install Studio from source (B)
      timeout-minutes: 60
      run: '$ErrorActionPreference = ''Continue''

        Remove-Item Env:HF_HOME -ErrorAction SilentlyContinue

        Remove-Item Env:HF_ENDPOINT -ErrorAction SilentlyContinue

        Remove-Item Env:HF_HUB_DISABLE_XET -ErrorAction SilentlyContinue

        Remove-Item Env:XDG_CACHE_HOME -ErrorAction SilentlyContinue

        Remove-Item Env:HUGGINGFACE_HUB_CACHE -ErrorAction SilentlyContinue

        Remove-Item Env:TRANSFORMERS_CACHE -ErrorAction SilentlyContinue

        git clone -q --filter=blob:none https://github.com/unslothai/unsloth.git "$env:UX_ROOT\src"

        git -C "$env:UX_ROOT\src" checkout -q 5e927b0fa337ad18e84261dd1ca691f98a8931c6

        git -C "$env:UX_ROOT\src" apply --whitespace=nowarn "$env:UX_ROOT\h\fix.patch"; if ($LASTEXITCODE -ne 0) { exit 1 }

        git -C "$env:UX_ROOT\src" log -1 --format=%H | Out-File "$env:UX_ROOT\evidence\source.txt"

        git -C "$env:UX_ROOT\src" status --short | Out-File -Append "$env:UX_ROOT\evidence\source.txt"

        Push-Location "$env:UX_ROOT\src"

        $sw = [Diagnostics.Stopwatch]::StartNew()

        powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --local *>&1 | Tee-Object -FilePath "$env:UX_ROOT\evidence\install.log"

        $rc = $LASTEXITCODE

        Pop-Location

        "install rc=$rc seconds=$($sw.Elapsed.TotalSeconds)" | Tee-Object -FilePath "$env:UX_ROOT\evidence\install-summary.txt"

        "$env:UNSLOTH_STUDIO_HOME\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

        if ($rc -ne 0) { exit $rc }'
    - name: Browser for the harness
      timeout-minutes: 15
      run: '$ErrorActionPreference = ''Stop''

        python -m venv "$env:UX_ROOT\pw"

        & "$env:UX_ROOT\pw\Scripts\python.exe" -m pip install -q playwright==1.55.0 requests

        & "$env:UX_ROOT\pw\Scripts\python.exe" -m playwright install chromium'
    - name: A/B session (B)
      timeout-minutes: 120
      if: always()
      env:
        UX_SUITE: ab
        UX_OS: Windows
        UX_SIDE: B
      run: '& "$env:UX_ROOT\pw\Scripts\python.exe" -u "$env:UX_ROOT\h\ux_parity.py"'
    - name: Collect Studio logs
      if: always()
      run: Get-ChildItem -Recurse "$env:UNSLOTH_STUDIO_HOME" -Include *.log -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 50MB } | ForEach-Object { Copy-Item $_.FullName "$env:UX_ROOT\evidence\"
        -ErrorAction SilentlyContinue }; exit 0
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ab-B-windows
        path: ${{ env.UX_ROOT }}/evidence
        retention-days: 14
