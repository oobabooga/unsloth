name: FastFlow NPU fixes A/B
'on':
  push:
    branches:
    - amd-fastflow-ux-c5984ef8
permissions: {}
jobs:
  linux-B:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 220
    defaults:
      run:
        shell: bash
    steps:
    - name: Prepare a fresh user and fetch the harness
      run: 'set -euxo pipefail

        root="$RUNNER_TEMP/ab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-B"

        mkdir -p "$root/h" "$root/evidence" "$root/home"

        echo "UX_ROOT=$root" >> $GITHUB_ENV

        echo "PLAYWRIGHT_BROWSERS_PATH=$root/pw-browsers" >> $GITHUB_ENV

        echo "HOME=$root/home" >> $GITHUB_ENV

        echo "$root/home/.local/bin" >> $GITHUB_PATH

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/uxlib.py" -o "$root/h/uxlib.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ui.py" -o "$root/h/ux_ui.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab.py" -o "$root/h/ux_ab.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/ux_ab2.py" -o "$root/h/ux_ab2.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/probe_hw.py" -o "$root/h/probe_hw.py"

        curl -fsSL "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/fix.patch" -o "$root/h/fix.patch"

        python3 "$root/h/probe_hw.py" "$root/evidence/hardware.json"'
    - name: Install Studio from source (B)
      timeout-minutes: 60
      run: 'set -uxo pipefail

        unset HF_HOME HF_ENDPOINT HF_HUB_DISABLE_XET XDG_CACHE_HOME HUGGINGFACE_HUB_CACHE TRANSFORMERS_CACHE

        git clone -q --filter=blob:none https://github.com/unslothai/unsloth.git "$UX_ROOT/src"

        git -C "$UX_ROOT/src" checkout -q 5e927b0fa337ad18e84261dd1ca691f98a8931c6

        git -C "$UX_ROOT/src" apply --whitespace=nowarn "$UX_ROOT/h/fix.patch"

        { git -C "$UX_ROOT/src" log -1 --format=%H; git -C "$UX_ROOT/src" status --short; } > "$UX_ROOT/evidence/source.txt"

        start=$(date +%s)

        (cd "$UX_ROOT/src" && ./install.sh --local) 2>&1 | tee "$UX_ROOT/evidence/install.log"

        rc=${PIPESTATUS[0]}

        echo "install rc=$rc seconds=$(( $(date +%s) - start ))" | tee "$UX_ROOT/evidence/install-summary.txt"

        exit $rc'
    - name: Browser for the harness
      timeout-minutes: 15
      run: 'set -euxo pipefail

        python3 -m venv "$UX_ROOT/pw"

        "$UX_ROOT/pw/bin/pip" install -q playwright==1.55.0 requests

        env -u LD_LIBRARY_PATH "$UX_ROOT/pw/bin/python" -m playwright install chromium'
    - name: A/B session (B)
      timeout-minutes: 120
      if: always()
      env:
        UX_SUITE: ab
        UX_OS: Linux
        UX_SIDE: B
      run: env -u LD_LIBRARY_PATH "$UX_ROOT/pw/bin/python" -u "$UX_ROOT/h/ux_ab2.py"
    - name: Collect Studio logs
      if: always()
      run: find "$HOME/.unsloth" -name '*.log' -size -50M -exec cp {} "$UX_ROOT/evidence/" \; 2>/dev/null; true
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ab-B-linux
        path: ${{ env.UX_ROOT }}/evidence
        retention-days: 14
