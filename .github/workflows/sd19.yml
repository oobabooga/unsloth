name: SD19 AMD A/B

on:
  push:
    branches: [sd19-amd-ab]

permissions: {}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        backend: [hip, vulkan]
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    steps:
      - name: Hardware
        run: |
          uname -a; nproc; free -g
          rocminfo 2>/dev/null | grep -E 'Marketing Name:|gfx' | head -5 || true
          ls /opt/rocm*/bin/hipcc 2>/dev/null || true
      - name: Setup
        run: |
          set -eux
          W="$RUNNER_TEMP/w"; mkdir -p "$W"/{tmp,hf,models}
          python3 -m venv "$W/venv"
          "$W/venv/bin/pip" -q install cmake ninja huggingface_hub hf_transfer numpy pillow
          if [ "${{ matrix.backend }}" = vulkan ]; then
            curl -fsSL --retry 3 -o "$W/vk.tar.xz" https://sdk.lunarg.com/sdk/download/1.4.328.1/linux/vulkansdk-linux-x86_64-1.4.328.1.tar.xz
            echo "241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf  $W/vk.tar.xz" | sha256sum -c
            mkdir -p "$W/vk" && tar -xJf "$W/vk.tar.xz" -C "$W/vk" --strip-components=1
          fi
          git clone -q --filter=blob:none https://github.com/unslothai/stable-diffusion.cpp "$W/src"
          cd "$W/src"
          for n in base:5f222b8 head:338079e; do
            d=${n%%:*}; s=${n##*:}
            git worktree add -q --detach "$W/$d" "$s"
            cd "$W/$d"
            git submodule update -q --init --depth 50 ggml
            for p in scripts/unsloth/ggml-patches/*.patch; do git -C ggml apply "../$p"; done
            echo "$d $(git log -1 --format=%h) patches: $(ls scripts/unsloth/ggml-patches | tr '\n' ' ')"
            python3 - examples/cli/main.cpp <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = '        LOG_INFO("%d/%d images saved", sucessful_reults, num_results);\n        return sucessful_reults != 0;\n    }\n'
          new = '        LOG_INFO("%d/%d images saved", sucessful_reults, num_results);\n        if (generated_audio != nullptr) {\n            write_audio_sidecar(base_path.parent_path() / "audio.wav");\n        }\n        return sucessful_reults != 0;\n    }\n'
          assert s.count(old) == 1
          open(p, "w").write(s.replace(old, new))
          PY
            cd "$W/src"
          done
      - name: Build
        run: |
          set -eux
          W="$RUNNER_TEMP/w"; export PATH="$W/venv/bin:$PATH" TMPDIR="$W/tmp"
          if [ "${{ matrix.backend }}" = hip ]; then
            export HIPCXX=/opt/rocm/llvm/bin/clang HIP_PATH=/opt/rocm
            DEF="-DSD_HIPBLAS=ON -DGPU_TARGETS=gfx1151"
          else
            export VULKAN_SDK="$W/vk/x86_64" PATH="$W/vk/x86_64/bin:$PATH"
            DEF="-DSD_VULKAN=ON"
          fi
          for d in base head; do
            cmake -S "$W/$d" -B "$W/$d/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON \
              -DSD_SERVER_BUILD_FRONTEND=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=OFF -DGGML_BUILD_TESTS=ON $DEF > "$W/$d.cmake.log" 2>&1 || { tail -50 "$W/$d.cmake.log"; exit 1; }
            grep -E "fused|H3" "$W/$d.cmake.log" || true
            cmake --build "$W/$d/build" -j 32 --target sd-cli > "$W/$d.build.log" 2>&1 || { grep -E "error|FAILED" "$W/$d.build.log" | head -40; exit 1; }
          done
          cmake --build "$W/head/build" -j 32 --target test-backend-ops > "$W/tbo.build.log" 2>&1 || { grep -E "error|FAILED" "$W/tbo.build.log" | head -40; exit 1; }
          ls -la "$W/head/build/bin"
      - name: test-backend-ops
        run: |
          set +e
          W="$RUNNER_TEMP/w"
          for op in ROPE_PE_PERMUTE CONV_2D_DW RMS_NORM; do
            echo "== $op"
            "$W/head/build/bin/test-backend-ops" test -o $op > "$W/tbo_$op.log" 2>&1
            echo "exit=$?"
            grep -E "^Backend|tests passed|FAIL" "$W/tbo_$op.log" | head -30
            echo "ok=$(grep -c ': OK' "$W/tbo_$op.log") unsupported=$(grep -c 'not supported' "$W/tbo_$op.log")"
          done
          echo "== ROPE_PE_PERMUTE rms (eps) cases"
          grep "eps=1" "$W/tbo_ROPE_PE_PERMUTE.log" | head -12
          grep "eps=1" "$W/tbo_ROPE_PE_PERMUTE.log" | awk '{print $NF}' | sort | uniq -c
      - name: Models
        run: |
          set -eux
          W="$RUNNER_TEMP/w"; export HF_HOME="$W/hf" HF_HUB_ENABLE_HF_TRANSFER=1
          "$W/venv/bin/python" - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          W = os.environ["RUNNER_TEMP"] + "/w/models"
          for f in ["vae/minimax_h3_audio_vae_fp32.safetensors", "vae/minimax_h3_video_vae_fp16.safetensors",
                    "minimax_h3_fl2va_pruned-UD-Q3_K_XL.gguf", "qwen3vl_32b_minimax_h3-Q2_K_M.gguf"]:
              print(hf_hub_download("unsloth/MiniMax-H3-GGUF", f, local_dir=W), flush=True)
          PY
          du -sh "$W/models"
      - name: Renders
        run: |
          set +e
          W="$RUNNER_TEMP/w"; M="$W/models"
          cat > "$W/cmp.py" <<'PY'
          import sys, glob, os, wave, numpy as np
          from PIL import Image
          a, b = sys.argv[1], sys.argv[2]
          fa = sorted(glob.glob(os.path.join(a, "f_*.png"))); fb = sorted(glob.glob(os.path.join(b, "f_*.png")))
          res = [] if len(fa) == len(fb) else [f"frames {len(fa)} vs {len(fb)}"]
          n = min(len(fa), len(fb)); same = 0; mse = 0.0; maxd = 0
          for x, y in zip(fa[:n], fb[:n]):
              ia = np.asarray(Image.open(x), dtype=np.int16); ib = np.asarray(Image.open(y), dtype=np.int16)
              d = ia - ib; same += int(not d.any())
              mse += float((d.astype(np.float64) ** 2).mean()); maxd = max(maxd, int(np.abs(d).max()))
          mse /= max(n, 1)
          psnr = float("inf") if mse == 0 else 10 * np.log10(255 ** 2 / mse)
          res.append(f"video: {same}/{n} frames identical, max|d|={maxd}, PSNR={psnr:.2f} dB")
          def rw(p):
              with wave.open(p) as w:
                  return np.frombuffer(w.readframes(w.getnframes()), dtype={2: np.int16, 4: np.int32}[w.getsampwidth()]).astype(np.float64)
          wa, wb = os.path.join(a, "audio.wav"), os.path.join(b, "audio.wav")
          if os.path.exists(wa) and os.path.exists(wb):
              xa, xb = rw(wa), rw(wb); m = min(len(xa), len(xb)); xa, xb = xa[:m], xb[:m]
              if np.array_equal(xa, xb): res.append("audio: bit-identical")
              else: res.append(f"audio: differs, SNR={10*np.log10((xa**2).sum()/max(((xa-xb)**2).sum(),1e-30)):.2f} dB")
          else: res.append("audio: missing")
          print(f"{os.path.basename(a)} vs {os.path.basename(b)}: " + "; ".join(res))
          PY
          run() {  # tree tag env...
            tree=$1; tag=$2; shift 2; out="$W/runs/$tag"; mkdir -p "$out"
            env "$@" "$W/$tree/build/bin/sd-cli" -M vid_gen \
              --diffusion-model "$M/minimax_h3_fl2va_pruned-UD-Q3_K_XL.gguf" \
              --vae "$M/vae/minimax_h3_video_vae_fp16.safetensors" --audio-vae "$M/vae/minimax_h3_audio_vae_fp32.safetensors" \
              --llm "$M/qwen3vl_32b_minimax_h3-Q2_K_M.gguf" \
              -p "A cute American Shorthair silver tabby kitten surfs on a tropical ocean wave, riding a white surfboard. Cinematic tracking shot, realistic water, bright sunlight. Upbeat tropical surf-rock background music with cheerful drums and guitar." \
              --cfg-scale 1.0 --steps 4 -W 640 -H 352 --video-frames 49 --fps 24 --seed 42 --diffusion-fa \
              -o "$out/f_%03d.png" > "$out/log.txt" 2>&1
            echo "exit=$?" >> "$out/log.txt"
            echo "$tag: $(grep -E 'sampling completed|decode_first_stage completed|decoding audio latent completed|exit=' "$out/log.txt" | sed 's/.*\] //' | tr '\n' ' ')"
          }
          OFF="SD_H3_FAST_SAGE_QKV=0 SD_TILE_ASYNC_MERGE=0 SD_H3_VAE_ASYNC_ASSEMBLY=0 SD_H3_VAE_REUSE_MEMQUERY=0 SD_H3_VAE_FUSED_QKV=0 SD_H3_VAE_FUSED_QK_NORM=0 SD_H3_AUDIO_DIRECT_DW=0"
          run base base1
          run head head1
          run head head_off $OFF
          run head head_dw0 SD_H3_AUDIO_DIRECT_DW=0
          run base base2
          run head head2
          grep -iE "error|warn|fused|direct|assert" "$W/runs/head1/log.txt" | head -20
          for t in head1 head_off head_dw0 base2; do "$W/venv/bin/python" "$W/cmp.py" "$W/runs/base1" "$W/runs/$t"; done
          "$W/venv/bin/python" "$W/cmp.py" "$W/runs/head1" "$W/runs/head2"
          "$W/venv/bin/python" "$W/cmp.py" "$W/runs/head_dw0" "$W/runs/head1"
          tail -n 30 "$W/runs/head1/log.txt"
