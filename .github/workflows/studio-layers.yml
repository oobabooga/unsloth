name: "AMD CI: does the RenderLayer attribution for the 500K scroll transfer to a real GPU?"

# THE QUESTION, and it is a narrow one.
#
# On the LOCAL WebKitGTK rig (llvmpipe, software) the 500K scroll cost is attributed to
# `RenderLayer::recursiveUpdateLayerPositionsAfterScroll` walking ~22,000 descendant RenderLayers
# once per scroll EVENT. `RenderBoxModelObject::requiresLayer()` returns true for `isPositioned()`
# and `isPositioned()` is `position != static`, so `position: relative` alone buys a layer. The
# walk recurses over every child unconditionally, with exactly one early-out
# (`!m_hasVisibleDescendant && !m_hasVisibleContent`). Locally `[data-role] *{position:static}`
# removes 78% of the cost, `.katex *{position:static}` 79%, and `.katex{visibility:hidden}`
# (which is the only cheap way to reach that early-out) 86%.
#
# But the local rig does NOT reproduce the AMD numbers. Running the exact `amdv_ablate.js` there,
# the drift check FAILED (baseline 17.5 fps against baseline_repeat 30.1), and drift-corrected,
# `content_visibility` reads 0.91x locally against the 11.11x reported here. So one of the two
# venues is measuring something the other is not.
#
# The source-grounded hypothesis: on a real GPU `usesCompositedScrolling()` is true, which adds
# `setNeedsCompositingGeometryUpdate()`, `setDescendantsNeedUpdateBackingAndHierarchyTraversal()`
# and `updateCompositingLayersAfterScroll()` -- a SECOND full descendant walk per scroll event
# that llvmpipe never takes. If that is right, the attribution must transfer to THIS venue and be
# LARGER here, not smaller. That is what this run is for, and it can come back either way.
#
# THE GESTURE IS ONE PIXEL. That is the whole design. Locally, assigning the SAME scrollTop costs
# 1.8 ms/frame while changing it by one pixel costs 30.4 ms/frame, so a 1 px change isolates the
# per-scroll-EVENT descendant walk from per-pixel paint and compositing. A 120 px or 900 px
# gesture confounds them, and the earlier ablation on this runner used 900 px.
#
# THE PRIMARY METRIC IS BLOCKED MILLISECONDS PER FRAME. One scroll event per painted frame means
# that number IS the cost of one scroll event. `busy%` is a share of wall time and in this
# campaign it already hid a 62% work reduction as a 19% change.
#
# NO `overflow-anchor` ARM. `CSSScrollAnchoringEnabled` defaults to false in 2.50.4 and 2.52.0 and
# this venue is 2.52.3, so the declaration is DROPPED and such an arm is vacuous. Three arms were
# wasted that way already. Every arm here re-reads getComputedStyle on a sample of the very nodes
# its selector names, so an arm the engine ignored reports that rather than a clean null.

on:
  push:
    branches: [amd-ci-layers-1px]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  selftest:
    name: "Self-test the scene and the scoring layer (no GPU)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 20
    # Explicitly blind to the device. This job exists to protect the expensive one and must never
    # allocate on the single gfx1151 the four ephemeral slots share.
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "studio-layers-selftest"

      - name: Toolkit self-test
        run: |
          set +e
          python3 amd_ci/selftest.py 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          echo "selftest rc=$rc"
          [ "$rc" -eq 0 ] || exit "$rc"

      # The scoring layer, against synthetic payloads whose right answers are known, including
      # every way this measurement can be wrong: a drifted page, a declaration the engine dropped,
      # an arm that pinned the gesture by collapsing scrollHeight, a jam the channel cannot see,
      # and a negative control that recovers. A criteria module that can only produce one answer
      # is the failure mode that has cost this campaign the most.
      - name: Criteria self-test
        run: |
          set +e
          python3 amd_ci/selftest_layers.py 2>&1 | tail -60
          rc=${PIPESTATUS[0]}
          echo "layers criteria selftest rc=$rc"
          [ "$rc" -eq 0 ] || exit "$rc"

      # The SCENE, run against a hand-rolled DOM stub. It cannot measure anything, but it proves
      # the scene reaches its end, posts the payload shape the criteria module reads, and that the
      # per-arm "did the declaration take" check can return BOTH answers.
      #
      # A missing `node` is the one case that does not fail here, and deliberately: this check is
      # about MY scene, not about the subject or the hardware, and it was run to green locally
      # before the branch was pushed. Failing the workflow over an absent interpreter would only
      # cost the measurement its slot. If node IS present, a failure is fatal.
      - name: Scene self-test
        run: |
          set +e
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node is not on this runner, so the scene self-test did not run here. \
          It was run to green locally before this branch was pushed; see \
          amd_ci/probes/studio_ladder/selftest_amdv_layers.mjs"
            exit 0
          fi
          node amd_ci/probes/studio_ladder/selftest_amdv_layers.mjs 2>&1 | tail -40
          rc=${PIPESTATUS[0]}
          echo "scene selftest rc=$rc"
          [ "$rc" -eq 0 ] || exit "$rc"

  measure:
    name: "One-pixel scroll ablation at r500K in WebKitGTK (exclusive)"
    needs: selftest
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 300
    # Compositing a browser and seeding a 500K thread both allocate on the one gfx1151 the four
    # ephemeral slots share. The group holds one runner plus exactly ONE waiter, and a third
    # arrival silently CANCELS the waiter while the other job stays green, so the loss is easy to
    # miss. Nothing else in this workflow takes the group.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "studio-layers"

      - name: Hardware gate
        run: |
          set -euo pipefail
          # Fails rather than skips. A skip would misreport missing hardware as nothing to see.
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"

      # Its own step, and early, because step logs are only served once the job COMPLETES and this
      # is the diagnostic worth having if the measurement never starts.
      - name: Engine inventory
        run: |
          set +e
          for p in /usr/bin/python3 /usr/bin/python3.12; do
            [ -x "$p" ] || continue
            echo "== $p"
            "$p" -c "import gi; gi.require_version('WebKit2','4.1'); from gi.repository import WebKit2; print('  WebKit', WebKit2.get_major_version(), WebKit2.get_minor_version(), WebKit2.get_micro_version())" 2>&1 | tail -2
          done
          echo "always exits 0: this is inventory, the probe's own gate decides"
          exit 0

      # r500K only, and two repetitions. The interleaved baselines inside ONE session are the
      # floor that matters here (five of them per repetition), because a fresh mount per arm would
      # put 500K-thread mount variance between the arms and that variance is far larger than the
      # effects being separated. The second repetition exists so a per-rep disagreement is
      # visible: a mean over a bimodal draw is a report of how many slow draws landed in an arm,
      # not an estimate of anything, and every table this criteria module prints carries per-rep
      # columns for that reason.
      - name: One-pixel ablation at r500K
        timeout-minutes: 250
        run: |
          set +e
          python3 amd_ci/lib/capability_run.py \
            --probe amd_ci/probes/studio_layers_probe.py \
            --criteria amd_ci/criteria/studio_layers_mechanism.py \
            --out-dir "$AMD_CI_WORK/out/layers" \
            -- --rung 500K --reps 2
          cat "$AMD_CI_WORK/out/layers/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not. A drifted
          # page is a NON-result and must not tick.
          python3 amd_ci/lib/announce.py "$AMD_CI_WORK/out/layers"

      - name: Stop anything left holding the GPU
        if: always()
        run: |
          set +e
          # By PORT, then by PID. A pattern-matching process killer would match this very step's
          # own shell, because the pattern ends up on its command line; that has cost a real run.
          # A Studio or an Xvfb that outlives the job holds VRAM on a machine three other slots
          # share, so this cannot simply be skipped either.
          for p in $(seq 5481 5540); do
            pid=$(ss -lptnH "sport = :$p" 2>/dev/null | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2)
            [ -n "$pid" ] && { echo "killing $pid on port $p"; kill -TERM "$pid" 2>/dev/null; }
          done
          sleep 3
          exit 0

      # The raw observations, separately from the verdict. Every arm's full rAF gap series is in
      # here, so the run can be re-scored offline against the untouched artifact if the reader
      # turns out to be wrong, rather than costing another exclusive slot.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-layers
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-layers-logs
          path: |
            ${{ env.AMD_CI_WORK }}/layers/out/logs
            ${{ env.AMD_CI_WORK }}/layers/out/*.jsonl
            ${{ env.AMD_CI_WORK }}/**/logs/*.log
          retention-days: 7
          if-no-files-found: warn
