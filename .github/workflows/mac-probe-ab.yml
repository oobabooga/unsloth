name: macOS loader probe A/B

on:
  push:
    branches: [mac-probe-ab]

permissions: {}

jobs:
  isolate:
    strategy:
      fail-fast: false
      matrix:
        arm:
          - {name: "1-baseline", repo: "https://github.com/unslothai/unsloth", ref: "1d5210d7a9ec3c42c5f39c12ec25748d8c5287b3"}
          - {name: "2-probe-only", repo: "https://github.com/oobabooga/unsloth", ref: "mac-probe-only-ci"}
          - {name: "3-lazy-only", repo: "https://github.com/oobabooga/unsloth", ref: "mac-lazy-only-ci"}
          - {name: "4-both", repo: "https://github.com/oobabooga/unsloth", ref: "mac-dyld-probe-ci"}
    runs-on: macos-15
    name: ${{ matrix.arm.name }}
    timeout-minutes: 120
    env:
      UNSLOTH_SKIP_AUTOSTART: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install the current release
        run: |
          curl -fsSL https://raw.githubusercontent.com/unslothai/unsloth/main/install.sh -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" </dev/null 2>&1 | grep -aE "llama.cpp  |Installed$" | tail -3
      - name: The arm under test
        run: |
          git clone --quiet --depth 50 "${{ matrix.arm.repo }}" "$RUNNER_TEMP/repo"
          git -C "$RUNNER_TEMP/repo" fetch --quiet origin "${{ matrix.arm.ref }}"
          git -C "$RUNNER_TEMP/repo" checkout --quiet FETCH_HEAD
          git -C "$RUNNER_TEMP/repo" log --oneline -1
      - name: Count what the check costs
        run: |
          # Count every HTTP request by host, and time each subprocess the installer spawns.
          mkdir -p "$RUNNER_TEMP/sc"
          cat > "$RUNNER_TEMP/sc/sitecustomize.py" <<'PY'
          import atexit, subprocess, sys, time, urllib.request
          if "install_llama_prebuilt" in " ".join(sys.argv):
              hosts = {}
              _open = urllib.request.OpenerDirector.open
              def _counted_open(self, fullurl, *a, **k):
                  url = fullurl if isinstance(fullurl, str) else fullurl.full_url
                  host = url.split("/")[2] if "//" in url else url
                  hosts[host] = hosts.get(host, 0) + 1
                  return _open(self, fullurl, *a, **k)
              urllib.request.OpenerDirector.open = _counted_open
              _run = subprocess.run
              def _timed_run(*a, **k):
                  cmd = a[0] if a else k.get("args")
                  s = " ".join(map(str, cmd)) if isinstance(cmd, (list, tuple)) else str(cmd)
                  t = time.time()
                  try:
                      return _run(*a, **k)
                  finally:
                      d = time.time() - t
                      sys.stderr.write(f"[spawn] {d:7.2f}s {s[-90:]}\n")
              subprocess.run = _timed_run
              atexit.register(lambda: sys.stderr.write(f"[requests] {sorted(hosts.items())}\n"))
          PY
          # A copy is what a new llama.cpp release leaves behind: the same install, in files
          # macOS has not assessed. The marker, and so its digests, rides along unchanged.
          cp -R ~/.unsloth/llama.cpp "$RUNNER_TEMP/llama-fresh"
          # An install made by 2026.9.4 or older recorded no host_profile, so the no-network
          # fast path declines and the release walk runs. Every arm pays the load probe here,
          # which leaves the walk as the only difference between them.
          python3 - <<'PY2'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"])/"llama-fresh/UNSLOTH_PREBUILT_INFO.json"
          m = json.loads(p.read_text())
          m.pop("host_profile", None)
          p.write_text(json.dumps(m, indent = 2) + "\n")
          print("host_profile removed from the marker")
          PY2
          export PYTHONPATH="$RUNNER_TEMP/sc"
          S=$(python3 -c 'import time;print(time.time())')
          (cd "$RUNNER_TEMP/repo/studio" && ~/.unsloth/studio/unsloth_studio/bin/python install_llama_prebuilt.py \
             --install-dir "$RUNNER_TEMP/llama-fresh" --llama-tag latest \
             --published-repo unslothai/llama.cpp 2>&1 | perl -e '$|=1; use Time::HiRes qw(time); my $t=time; while(<STDIN>){ printf "%7.2f %s", time-$t, $_ }' > "$RUNNER_TEMP/helper.log")
          echo "EXIT=$? WALL=$(python3 -c "import time;print(round(time.time()-$S,2))")"
          echo "releases_resolved=$(grep -ac 'published_release: tag=' "$RUNNER_TEMP/helper.log")"
          echo "--- full helper log"
          grep -av "published_release:\|published_selection:" "$RUNNER_TEMP/helper.log" | cut -c1-200
