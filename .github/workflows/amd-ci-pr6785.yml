name: "AMD CI: validate PR 6785"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-pr6785]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "6785"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  suites:
    name: "PR 6785 suites, base vs head"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr6785-suites"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Provide missing build deps without root
        run: |
          set -u
          # No root here. The PR-era install.sh treats the libcurl dev headers as
          # REQUIRED and escalates for them; the preamble's privilege shim refuses,
          # so the job dies over a package nothing in this run uses. MOST of the pool
          # lacks curl-config -- the first run's suites leg passing on s01-d06 was
          # luck, not a property of that machine.
          # Unpack the REAL package into the work root rather than stubbing
          # curl-config: a stub would also silence a genuinely broken toolchain.
          # The runner's apt index is STALE against the proxy mirror at
          # 10.255.100.254:8000, which 404s the exact pinned version, so try every
          # version apt knows and then whatever the pool directory actually holds.
          for tool in curl-config cmake gcc git; do
            echo "$tool: $(command -v "$tool" || echo MISSING)"
          done
          if command -v curl-config > /dev/null 2>&1; then
            echo "curl-config already present; nothing to do"
            exit 0
          fi
          PKG=libcurl4-openssl-dev
          POOL=http://archive.ubuntu.com/ubuntu/pool/main/c/curl/
          mkdir -p "$AMD_CI_WORK/deb" "$AMD_CI_WORK/root"
          cd "$AMD_CI_WORK/deb"

          echo "--- versions apt believes exist"
          apt-cache policy "$PKG" || echo "apt-cache policy unavailable"
          VERSIONS=$(apt-cache madison "$PKG" 2>/dev/null | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          echo "candidates: ${VERSIONS:-none}"
          for v in $VERSIONS; do
            echo "--- trying $PKG=$v"
            if apt-get download "$PKG=$v"; then break; fi
          done

          if ! ls "$AMD_CI_WORK/deb"/*.deb > /dev/null 2>&1; then
            echo "--- apt could not fetch any indexed version; reading the pool directory"
            curl -fsS "$POOL" -o "$AMD_CI_WORK/deb/index.html" || echo "pool listing unreachable"
            if [ -f "$AMD_CI_WORK/deb/index.html" ]; then
              FILES=$(grep -oE 'libcurl4-openssl-dev_[0-9A-Za-z.~+:-]+_amd64\.deb' "$AMD_CI_WORK/deb/index.html" | sort -u)
              echo "pool offers: ${FILES:-none}"
              for f in $FILES; do
                echo "--- trying $POOL$f"
                if curl -fsS "$POOL$f" -o "$AMD_CI_WORK/deb/$f"; then break; fi
              done
            fi
          fi

          FOUND=0
          for f in "$AMD_CI_WORK/deb"/*.deb; do
            if [ -e "$f" ]; then
              echo "--- unpacking $f"
              dpkg -x "$f" "$AMD_CI_WORK/root" && FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "could not obtain $PKG; install.sh will fail on the same dep as before"
            exit 0
          fi
          if [ -x "$AMD_CI_WORK/root/usr/bin/curl-config" ]; then
            echo "$AMD_CI_WORK/root/usr/bin" >> "$GITHUB_PATH"
            "$AMD_CI_WORK/root/usr/bin/curl-config" --version
          else
            echo "unpacked but no curl-config binary; install.sh will fail as before"
          fi

      - name: Environment
        timeout-minutes: 60
        run: |
          set -euo pipefail
          # Heavy, and only needed if the suites import torch. Delete otherwise.
          cd "$AMD_CI_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" -m pip install -q pytest pytest-asyncio pytest-timeout

      - name: Differential
        run: |
          set +e
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/pytest_probe.py \
            --criteria amd_ci/criteria/pytest_no_regression.py \
            --out-dir "$AMD_CI_WORK/out/suites" \
            --python "${AMD_CI_PY:-python3}" \
            -- --tests tests/test_amd_apu_unified_memory.py tests/test_integrated_gpu_unified_memory.py tests/test_llama_cpp_context_fit.py tests/test_gpu_selection.py tests/test_gpu_selection_sandbox.py tests/test_vram_estimation.py tests/test_mmproj_vram_accounting.py tests/test_mtp_vram_budget.py tests/test_llama_cpp_wait_for_vram_settle.py tests/test_datacenter_gpu_tuning.py tests/test_windows_gpu_detection_mock.py
          cat "$AMD_CI_WORK/out/suites/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/suites"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr6785-suites
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  gpu:
    name: "PR 6785 GPU measurement (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    # A shared constant, deliberately: it serialises every GPU measurement across
    # all branches. That is stricter than co-tenancy strictly requires now that the
    # pool is many machines, but nothing in the label set can pin or exclude a
    # machine, so "two GPU jobs never run at once" is the only enforceable version
    # of "no co-tenant moved my number".
    # The cost is that the group holds one runner plus one waiter,
    # so a third arrival evicts the waiter. `cancel-in-progress: false` protects
    # the job already running, not the one queued behind it. Re-run the job.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr6785-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Provide missing build deps without root
        run: |
          set -u
          # No root here. The PR-era install.sh treats the libcurl dev headers as
          # REQUIRED and escalates for them; the preamble's privilege shim refuses,
          # so the job dies over a package nothing in this run uses. MOST of the pool
          # lacks curl-config -- the first run's suites leg passing on s01-d06 was
          # luck, not a property of that machine.
          # Unpack the REAL package into the work root rather than stubbing
          # curl-config: a stub would also silence a genuinely broken toolchain.
          # The runner's apt index is STALE against the proxy mirror at
          # 10.255.100.254:8000, which 404s the exact pinned version, so try every
          # version apt knows and then whatever the pool directory actually holds.
          for tool in curl-config cmake gcc git; do
            echo "$tool: $(command -v "$tool" || echo MISSING)"
          done
          if command -v curl-config > /dev/null 2>&1; then
            echo "curl-config already present; nothing to do"
            exit 0
          fi
          PKG=libcurl4-openssl-dev
          POOL=http://archive.ubuntu.com/ubuntu/pool/main/c/curl/
          mkdir -p "$AMD_CI_WORK/deb" "$AMD_CI_WORK/root"
          cd "$AMD_CI_WORK/deb"

          echo "--- versions apt believes exist"
          apt-cache policy "$PKG" || echo "apt-cache policy unavailable"
          VERSIONS=$(apt-cache madison "$PKG" 2>/dev/null | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          echo "candidates: ${VERSIONS:-none}"
          for v in $VERSIONS; do
            echo "--- trying $PKG=$v"
            if apt-get download "$PKG=$v"; then break; fi
          done

          if ! ls "$AMD_CI_WORK/deb"/*.deb > /dev/null 2>&1; then
            echo "--- apt could not fetch any indexed version; reading the pool directory"
            curl -fsS "$POOL" -o "$AMD_CI_WORK/deb/index.html" || echo "pool listing unreachable"
            if [ -f "$AMD_CI_WORK/deb/index.html" ]; then
              FILES=$(grep -oE 'libcurl4-openssl-dev_[0-9A-Za-z.~+:-]+_amd64\.deb' "$AMD_CI_WORK/deb/index.html" | sort -u)
              echo "pool offers: ${FILES:-none}"
              for f in $FILES; do
                echo "--- trying $POOL$f"
                if curl -fsS "$POOL$f" -o "$AMD_CI_WORK/deb/$f"; then break; fi
              done
            fi
          fi

          FOUND=0
          for f in "$AMD_CI_WORK/deb"/*.deb; do
            if [ -e "$f" ]; then
              echo "--- unpacking $f"
              dpkg -x "$f" "$AMD_CI_WORK/root" && FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "could not obtain $PKG; install.sh will fail on the same dep as before"
            exit 0
          fi
          if [ -x "$AMD_CI_WORK/root/usr/bin/curl-config" ]; then
            echo "$AMD_CI_WORK/root/usr/bin" >> "$GITHUB_PATH"
            "$AMD_CI_WORK/root/usr/bin/curl-config" --version
          else
            echo "unpacked but no curl-config binary; install.sh will fail as before"
          fi

      - name: Environment and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          # Now with torch present, the gate is meaningful. It EXITS 1 on a miss.
          # Absolute path: this step cd'd into the head worktree, which has no amd_ci/.
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/integrated_memory_probe.py \
            --criteria amd_ci/criteria/integrated_memory_no_regression.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" 
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr6785-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
