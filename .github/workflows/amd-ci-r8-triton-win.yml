  w_twprobe:
    name: "triton probe: AMD torch + unsloth[huggingface] (pip route), then triton-windows<3.7"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "r8-w_twprobe"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe", "C:\Program Files\Python311\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) { Write-Host "FATAL: no system Python"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Probe Triton in the pip route
        timeout-minutes: 75
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_NAME=[$env:RUNNER_NAME]"
          $out = "$env:AMD_CI_WORK\out\twprobe"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          & $py -m pip install --index-url "$env:AMD_TORCH_INDEX" "$env:AMD_TORCH_SPEC" 2>&1 | Select-Object -Last 3
          $tv = & $py -c "import torch; print(torch.__version__)"
          Write-Host "torch $tv"
          Set-Content -Path "$env:AMD_CI_WORK\constraints.txt" -Value "torch==$tv" -Encoding ASCII
          # Route 1: what `pip install "unsloth[huggingface]"` brings on Windows x86_64 (torch held).
          & $py -m pip install -c "$env:AMD_CI_WORK\constraints.txt" "unsloth[huggingface]" 2>&1 | Tee-Object -FilePath "$out\pip_extras.log" | Select-Object -Last 15
          Write-Host "pip exit $LASTEXITCODE"
          & $py -m pip list 2>&1 | Tee-Object -FilePath "$out\piplist_extras.txt" | Select-String -Pattern "triton|torch|unsloth"
          & $py "$env:GITHUB_WORKSPACE\amd_ci\probes\triton_win_probe.py" --out "$out\probe_extras.json"
          Get-Content "$out\probe_extras.json"
          # Route 2: the torch-2.11 pairing studio/setup.ps1 uses for NVIDIA (triton-windows<3.7).
          & $py -m pip install -c "$env:AMD_CI_WORK\constraints.txt" --force-reinstall --no-deps "$env:TRITON_SPEC" 2>&1 | Select-Object -Last 3
          & $py "$env:GITHUB_WORKSPACE\amd_ci\probes\triton_win_probe.py" --out "$out\probe_tw36.json"
          Get-Content "$out\probe_tw36.json"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-w_twprobe
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  w_studio:
    name: "Studio install.ps1 on AMD Windows: is Triton installed?"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      UNSLOTH_SKIP_AUTOSTART: "1"
      UNSLOTH_SKIP_WHISPER_INSTALL: "1"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "r8-w_studio"

      - name: Run the Studio installer as a user would (PyPI release, default flags)
        timeout-minutes: 100
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_NAME=[$env:RUNNER_NAME]"
          $out = "$env:AMD_CI_WORK\out\studio"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $src = "$env:RUNNER_TEMP\uns"
          git clone -q --depth 1 "$env:UNSLOTH_REPO" "$src"
          git -C "$src" log --oneline -1
          $env:UNSLOTH_STUDIO_HOME = "$env:RUNNER_TEMP\ush"
          Add-Content -Path $env:GITHUB_ENV -Value "UNSLOTH_STUDIO_HOME=$env:UNSLOTH_STUDIO_HOME"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $null | powershell -NoProfile -ExecutionPolicy Bypass -File "$src\install.ps1" 2>&1 |
            Tee-Object -FilePath "$out\install.log" | Select-String -Pattern "triton|Triton|torch|ROCm|rocm|AMD|gfx|ERROR|error" | Select-Object -Last 80
          Write-Host "install exit $LASTEXITCODE after $($sw.Elapsed.TotalMinutes) min"
          exit 0

      - name: Probe Triton in every Python the installer created
        if: always()
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Continue"
          $out = "$env:AMD_CI_WORK\out\studio"
          $pys = Get-ChildItem -Path "$env:UNSLOTH_STUDIO_HOME" -Recurse -Filter python.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Scripts\\python\.exe$' }
          $i = 0
          foreach ($p in $pys) {
            $i++
            Write-Host "== $($p.FullName)"
            & $p.FullName -m pip list 2>&1 | Select-String -Pattern "triton|torch|unsloth"
            & $p.FullName "$env:GITHUB_WORKSPACE\amd_ci\probes\triton_win_probe.py" --out "$out\probe_$i.json"
            Get-Content "$out\probe_$i.json" -ErrorAction SilentlyContinue
          }
          if ($i -eq 0) { Write-Host "no venv python found under $env:UNSLOTH_STUDIO_HOME"; Get-ChildItem "$env:UNSLOTH_STUDIO_HOME" -ErrorAction SilentlyContinue }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-w_studio
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
