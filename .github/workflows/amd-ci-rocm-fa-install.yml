name: "AMD CI: Studio ROCm flash-attn install, base vs head (gfx1151, Linux)"

# Generated by diffusion_bench/amd/gen_fa_pr_workflow.py. Measurement only: no secret, public ungated models.

on:
  push:
    branches: [amd-ci-rocm-fa-install]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: "https://github.com/unslothai/unsloth"
  BASE_SHA: "0efd019b48d2dca02fd8c1123f0eed514a6a1e78"

jobs:

  fa_install_ab:
    name: "Studio ROCm flash-attn install: base vs head (gfx1151, exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 600
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "fa-install-ab"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || echo "note: re-gated after install below"

      - name: Disk, memory, cores
        run: |
          set +e
          df -h "$RUNNER_TEMP"; free -g; nproc
          exit 0

      - name: Resolve states (base = main, head = main + the branch diff)
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "$UPSTREAM" "$AMD_CI_WORK/repo"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/base" "$BASE_SHA"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/head" "$BASE_SHA"
          git -C "$AMD_CI_WORK/states/head" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/rocm_fa_install.patch"
          git -C "$AMD_CI_WORK/states/head" diff --cached --stat
          python3 "$GITHUB_WORKSPACE/diffusion_bench/amd/write_states.py" --work "$AMD_CI_WORK" \
            --base-sha "$BASE_SHA" --patch rocm_fa_install.patch --out "$AMD_CI_WORK/out/states.json"

      - name: Studio install per state (each state's own install.sh, own home)
        timeout-minutes: 120
        run: |
          set -euo pipefail
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          for st in base head; do
            cd "$AMD_CI_WORK/states/$st"
            set +e
            UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio_$st" bash install.sh --local > "$AMD_CI_WORK/out/install_$st.log" 2>&1
            rc=$?
            set -e
            tail -8 "$AMD_CI_WORK/out/install_$st.log"
            grep -i -E "flash-attn|flash_attn" "$AMD_CI_WORK/out/install_$st.log" | tail -8 || true
            [ "$rc" -eq 0 ] || { echo "FATAL: install.sh ($st) rc=$rc"; exit "$rc"; }
            V=""
            for c in "$AMD_CI_WORK/studio_$st"/unsloth_studio "$AMD_CI_WORK/studio_$st"/.venv_t5_*; do
              [ -x "$c/bin/python" ] && { V="$c"; break; }
            done
            [ -n "$V" ] || { echo "FATAL: no Studio venv for $st"; exit 1; }
            echo "PY_$st=$V/bin/python" >> "$GITHUB_ENV"
            cd "$AMD_CI_WORK"
            "$V/bin/python" -c "import importlib.util as u, torch; print('$st torch', torch.__version__, 'hip', torch.version.hip, 'flash_attn installed:', u.find_spec('flash_attn') is not None)"
          done
          echo "AMD_CI_PY=$AMD_CI_WORK/studio_base/unsloth_studio/bin/python" >> "$GITHUB_ENV"

      - name: Head venv facts (Studio env default, flash_attn import, LLM attention unchanged)
        timeout-minutes: 20
        run: |
          set +e
          cd "$AMD_CI_WORK/states/head/studio/backend"
          "$PY_head" - <<'PY' 2>&1 | tail -20 | tee "$AMD_CI_WORK/out/head_facts.txt"
          import os, sys
          sys.path.insert(0, ".")
          from utils.rocm_flash_attn import default_triton_amd_env
          print("default applied:", default_triton_amd_env(), {k: os.environ.get(k) for k in ("FLASH_ATTENTION_TRITON_AMD_ENABLE", "UNSLOTH_ROCM_FLASH_ATTN_DIFFUSION_ONLY")})
          import flash_attn
          from flash_attn import flash_attn_interface as fi
          print("flash_attn", flash_attn.__version__, "USE_TRITON_ROCM", getattr(fi, "USE_TRITON_ROCM", None))
          import torch
          q = torch.randn(1, 1024, 8, 128, device = "cuda", dtype = torch.bfloat16)
          o = flash_attn.flash_attn_func(q, q, q)
          ref = torch.nn.functional.scaled_dot_product_attention(q.transpose(1, 2), q.transpose(1, 2), q.transpose(1, 2)).transpose(1, 2)
          print("flash vs sdpa max abs err", (o.float() - ref.float()).abs().max().item())
          import unsloth
          from unsloth.models import _utils as U
          print("unsloth HAS_FLASH_ATTENTION (must stay False under Studio's default):", U.HAS_FLASH_ATTENTION)
          import transformers.utils as tu
          print("transformers is_flash_attn_2_available:", tu.is_flash_attn_2_available())
          PY
          cd "$AMD_CI_WORK/states/base/studio/backend"
          "$PY_base" -c "import importlib.util as u; print('base flash_attn installed:', u.find_spec('flash_attn') is not None)" | tee -a "$AMD_CI_WORK/out/head_facts.txt"
          exit 0

      - name: Models (Studio snapshots of the official repos)
        timeout-minutes: 120
        run: |
          set +e
          export HF_HOME="$AMD_CI_WORK/hf_home" HF_HUB_DISABLE_TELEMETRY=1
          "$AMD_CI_PY" -m pip install -q safetensors huggingface_hub > /dev/null 2>&1
          "$AMD_CI_PY" -u "$GITHUB_WORKSPACE/diffusion_bench/amd/nov5_prep.py" --groups klein,f3,zimg,q21,wan --snapshot-only \
            --out "$AMD_CI_WORK/cm" --spec "$GITHUB_WORKSPACE/diffusion_bench/specs/amd_nov5.json" \
            --snap-root "$AMD_CI_WORK/snap" --env-file "$GITHUB_ENV" 2>&1 | grep -vE "it/s|B/s" | tail -20
          df -h "$RUNNER_TEMP"
          exit 0

      - name: Clean GPU pool preflight (fail loudly on a co-tenant)
        timeout-minutes: 35
        run: |
          set -euo pipefail
          "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/preflight_free.py" --min-free-gib 50 \
            --timeout-s 1800 --out "$AMD_CI_WORK/out/preflight.json"

      - name: Differential (base main vs head install, each in its own venv)
        run: |
          set +e
          export TORCH_HOME="$AMD_CI_WORK/torch_home"
          export HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe diffusion_bench/amd/diffusion_probe.py \
            --criteria diffusion_bench/amd/criteria_differential.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --spec diffusion_bench/specs/amd_nov5.json --budget-min 240 --cell-timeout 3600 --only klein_s_def --only klein_s_def_2_repeat --only f3_s_def --only zimg_s_def --only q21_s_def --only wan_s_def --defect log:klein_s_def:attention=native:attention=flash --state-set 'head=venv="'"$PY_head"'"'
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - name: Stop anything this job started
        if: always()
        run: |
          set +e
          for d in /proc/[0-9]*; do
            pid=${d#/proc/}
            [ "$pid" = "$$" ] && continue
            cwd=$(readlink "$d/cwd" 2>/dev/null)
            case "$cwd" in
              "$AMD_CI_WORK"*) echo "stopping pid $pid (cwd $cwd)"; kill "$pid" 2>/dev/null ;;
            esac
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa-install-ab
          path: |
            ${{ env.AMD_CI_WORK }}/out
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/record.json
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.mp4
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/dbench/states/*/logs
          retention-days: 14
          if-no-files-found: warn
