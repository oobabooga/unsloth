name: Studio master-root Windows A/B
on:
  push:
    branches: [dc038-windows-ab]
permissions: {}
jobs:
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 60
    steps:
      - name: Install, launch, generate, update, and uninstall before and after
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP 'dc038-live'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors
          python --version
          uv --version
          [IO.File]::WriteAllBytes((Join-Path $work 'change.patch'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $work 'verify.py'), [Convert]::FromBase64String(''))
          git init base-repo
          git -C base-repo remote add origin https://github.com/unslothai/unsloth.git
          git -C base-repo fetch --depth 1 origin 73d2598a2442e7ac8664559362b75f4a0ead2115
          git -C base-repo checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'baseline checkout failed' }
          git clone --shared base-repo changed-repo
          git -C changed-repo apply (Join-Path $work 'change.patch')
          if ($LASTEXITCODE -ne 0) { throw 'patch failed' }
          $model = Join-Path $work 'stories15M-q4_0.gguf'
          Invoke-WebRequest -UseBasicParsing 'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf' -OutFile $model
          $cases = @('base', 'changed')
          foreach ($label in $cases) {
              $caseDir = Join-Path $work $label
              $caseHome = Join-Path $caseDir 'home'
              $repoDir = Join-Path $work "$label-repo"
              New-Item -ItemType Directory -Force $caseHome | Out-Null
              $env:USERPROFILE = $caseHome
              $env:HOME = $caseHome
              $env:APPDATA = Join-Path $caseHome 'AppData\Roaming'
              $env:LOCALAPPDATA = Join-Path $caseHome 'AppData\Local'
              New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
              $env:UNSLOTH_HOME = Join-Path $caseDir 'portable'
              $env:UNSLOTH_STUDIO_HOME = $null
              $env:STUDIO_HOME = $null
              $env:UNSLOTH_LLAMA_CPP_PATH = $null
              $env:UV_CACHE_DIR = Join-Path $work 'cache'
              $env:UNSLOTH_SKIP_AUTOSTART = '1'
              $env:UNSLOTH_NO_TORCH = '1'
              $env:UNSLOTH_LLAMA_CPP_BACKEND = 'cpu'
              $env:NO_COLOR = '1'
              Set-Location $repoDir
              $installLog = Join-Path $caseDir 'install.log'
              & python -c "import subprocess,sys; f=open(sys.argv[2],'w',encoding='utf-8'); r=subprocess.run(['powershell','-NoProfile','-ExecutionPolicy','Bypass','-File',sys.argv[1],'--local','--no-torch','--skip-autostart'],stdout=f,stderr=subprocess.STDOUT); sys.exit(r.returncode)" (Join-Path $repoDir 'install.ps1') $installLog
              $installExit = $LASTEXITCODE
              if ($label -eq 'base' -and $installExit -ne 0) {
                  $baselineText = Get-Content -Raw $installLog
                  if ($baselineText -notmatch 'Virtual environment not found at .*portable\\studio\\unsloth_studio') {
                      Get-Content $installLog -Tail 80
                      throw 'baseline failed for an unexpected reason'
                  }
                  @{ expected = 'base'; install_exit = $installExit; expected_error = 'Virtual environment not found under the master root' } | ConvertTo-Json | Set-Content (Join-Path $caseDir 'verification.json')
                  Get-Content $installLog -Tail 15
                  continue
              }
              if ($installExit -ne 0) { Get-Content $installLog -Tail 80; throw "$label install failed" }
              Get-Content $installLog -Tail 12
              $expected = if ($label -eq 'changed') { 'fixed' } else { 'base' }
              $extra = if ($label -eq 'changed') { @('--update','--uninstall') } else { @('--uninstall') }
              & python (Join-Path $work 'verify.py') --repo $repoDir --case $caseDir --expected $expected --model $model @extra
              if ($LASTEXITCODE -ne 0) {
                  Get-ChildItem $caseDir -Filter '*.log' | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName -Tail 35 }
                  throw "$label verification failed"
              }
          }
          Set-Location (Join-Path $work 'changed-repo')
          uv venv (Join-Path $work 'test-venv') --python 3.12
          $testPython = Join-Path $work 'test-venv\Scripts\python.exe'
          uv pip install --python $testPython pytest
          $env:PYTHONPATH = (Join-Path $work 'changed-repo\tests\_shared')
          & $testPython -m pytest --noconftest -q tests/python/test_installer_master_root.py --basetemp (Join-Path $work 'pytest')
          if ($LASTEXITCODE -ne 0) { throw 'regression tests failed' }

      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dc038-windows-ab
          path: |
            ${{ runner.temp }}/dc038-live/base/*.log
            ${{ runner.temp }}/dc038-live/base/verification.json
            ${{ runner.temp }}/dc038-live/changed/*.log
            ${{ runner.temp }}/dc038-live/changed/verification.json
