name: Studio root regression tests on Windows
on:
  push:
    branches: [dc038-windows-ab]
permissions: {}
jobs:
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 15
    steps:
      - name: Run focused regressions under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP 'studio-root-tests'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          [IO.File]::WriteAllBytes((Join-Path $work 'change.patch'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $work 'test_installer_master_root.py'), [Convert]::FromBase64String(''))
          git init repo
          git -C repo remote add origin https://github.com/unslothai/unsloth.git
          git -C repo fetch --depth 1 origin 73d2598a2442e7ac8664559362b75f4a0ead2115
          git -C repo checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
          git -C repo apply (Join-Path $work 'change.patch')
          if ($LASTEXITCODE -ne 0) { throw 'patch failed' }
          Copy-Item (Join-Path $work 'test_installer_master_root.py') (Join-Path $work 'repo\tests\python\test_installer_master_root.py')
          uv venv (Join-Path $work 'venv') --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'test venv failed' }
          $testPython = Join-Path $work 'venv\Scripts\python.exe'
          uv pip install --python $testPython pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed' }
          $env:PYTHONPATH = Join-Path $work 'repo\tests\_shared'
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'pwsh.exe')) }) -join ';'
          if (Get-Command pwsh -ErrorAction SilentlyContinue) { throw 'pwsh is still on PATH' }
          & powershell -NoProfile -Command '$PSVersionTable.PSVersion'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell is missing' }
          Set-Location (Join-Path $work 'repo')
          & $testPython -m pytest --noconftest -q tests/python/test_installer_master_root.py --junitxml (Join-Path $work 'tests.xml')
          if ($LASTEXITCODE -ne 0) { throw 'regression tests failed' }
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-root-tests-windows
          path: ${{ runner.temp }}/studio-root-tests/tests.xml
