name: Studio root review regressions on Windows
on:
  push:
    branches: [dc038-windows-ab]
permissions: {}
jobs:
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 15
    steps:
      - name: Reproduce Python lookup failure and verify the fix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP 'studio-root-review'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          $PSVersionTable.PSVersion
          [IO.File]::WriteAllBytes((Join-Path $work 'initial.patch'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $work 'followup.patch'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $work 'test_installer_master_root.py'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $work 'verify.py'), [Convert]::FromBase64String(''))
          git init repo
          git -C repo remote add origin https://github.com/unslothai/unsloth.git
          git -C repo fetch --depth 1 origin 73d2598a2442e7ac8664559362b75f4a0ead2115
          git -C repo checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
          git -C repo apply (Join-Path $work 'initial.patch')
          if ($LASTEXITCODE -ne 0) { throw 'initial patch failed' }
          Copy-Item (Join-Path $work 'test_installer_master_root.py') (Join-Path $work 'repo\tests\python\test_installer_master_root.py')
          uv venv (Join-Path $work 'venv') --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'test venv failed' }
          $testPython = Join-Path $work 'venv\Scripts\python.exe'
          uv pip install --python $testPython pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed' }
          $env:PYTHONPATH = Join-Path $work 'repo\tests\_shared'
          Set-Location (Join-Path $work 'repo')
          # The tests prefer pwsh when available; select Windows PowerShell 5.1 explicitly.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'pwsh.exe')) }) -join ';'
          if (Get-Command pwsh -ErrorAction SilentlyContinue) { throw 'pwsh is still on PATH' }
          & powershell -NoProfile -Command '$PSVersionTable.PSVersion'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell is missing' }
          & $testPython (Join-Path $work 'verify.py')
          if ($LASTEXITCODE -ne 0) { throw 'verification failed' }
      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-root-review-windows
          path: |
            ${{ runner.temp }}/studio-root-review/*.log
            ${{ runner.temp }}/studio-root-review/*.xml
