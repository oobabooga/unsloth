name: "staging-10120 ubuntu-latest"
on:
  push:
    branches: ["pr-10120-20260915-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests "numpy<3" httpx soundfile librosa
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.4,<2.11" "torchaudio<2.11"
      - run: python -m pip install "transformers>=4.51,<5.5" peft==0.18.1 torchao
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_context_overflow_truncation.py studio/backend/tests/test_llama_admission_compat_matrix.py studio/backend/tests/test_llama_admission_enforced_max_tokens.py studio/backend/tests/test_llama_admission_enforced_paths.py studio/backend/tests/test_llama_admission_kv_budget_media_and_tools.py studio/backend/tests/test_llama_admission_unstated_max_tokens.py studio/backend/tests/test_llama_cpp_tool_loop.py studio/backend/tests/test_research_internal_call_tool_gate.py tests/studio/test_wsl_shortcut_script_is_valid_powershell.py -q --tb=short
