name: staging-10526 ubuntu-24.04
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      UNSLOTH_ALLOW_CPU: '1'
      PYTHONPATH: studio/backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Prepare exact approved source
      run: 'git fetch --no-tags https://github.com/unslothai/unsloth.git 842c826a95e99a5fd31a4e546604e3d42265fd32
        73eb6fb29d3a3a013d4c730ea092f384ab2eaa74

        git worktree add --detach "$RUNNER_TEMP/studio-approved" 842c826a95e99a5fd31a4e546604e3d42265fd32

        python .github/scripts/check-studio-scope.py'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Enable bubblewrap on this runner
      run: 'sudo apt-get update

        sudo apt-get install -y bubblewrap apparmor-profiles

        if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict;
        fi

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0'
    - name: Install CPU torch
      run: python -m pip install 'torch>=2.4,<2.11' --index-url https://download.pytorch.org/whl/cpu
    - name: Install test dependencies
      run: 'python -m pip install -r studio/backend/requirements/studio.txt

        python -m pip install python-multipart aiofiles sqlalchemy psutil pyyaml jinja2 mammoth unpdf requests
        ''numpy<3'' pytest pytest-asyncio pytest-timeout httpx peft ''transformers>=4.51,<5.5'''
    - name: Require live OS isolation
      run: python -c "from core.inference.os_sandbox import capability_snapshot; c=capability_snapshot(); print(c);
        assert c.available, c.reason"
    - name: Check Studio lifecycle and compatibility
      run: python .github/scripts/check-studio-lifecycle.py "$RUNNER_TEMP/studio-approved"
      if: always()
    - name: Check Python tool images in Chromium
      run: 'python -m pip install playwright

        python -m playwright install chromium

        cd "$RUNNER_TEMP/studio-approved"

        python tests/studio/playwright_tauri_python_tool_images.py'
      if: always()
'on':
  push:
    branches:
    - pr-10526-review-20260915-ci
    paths-ignore:
    - '**/*.md'
  workflow_dispatch: null
