# Disposable cross-platform gate for unslothai/unsloth#9906. Not for merge.

name: "staging 9906 cross-platform"

on:
  push:
    branches: [pr-9906-xplat-ci]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-9906-xplat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: "frontend gates (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci --no-audit --no-fund

      # The PR adds a key to all 12 catalogs. This is the gate that was red
      # before the fix, so it must be exercised on every OS.
      - name: Locale parity (strict)
        run: npm run i18n:check:strict

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build and bundle budget
        run: |
          npm run build
          npm run bundle:check

      # The diff carries Arabic, Hindi, Japanese, Korean, Russian and Chinese
      # text. .gitattributes normalises studio/frontend/** to LF, but a Windows
      # or macOS checkout is where an encoding or line-ending regression would
      # actually surface, so assert the decoded strings byte-for-byte here.
      - name: Locale encoding integrity
        run: node --experimental-strip-types --no-warnings --test ../../.github/scripts/pr9906_encoding.ts

  # WebKit is Safari's engine and the one behind the Tauri WKWebView on macOS. It
  # could not be launched on the Linux box used for the Chromium and Firefox runs,
  # so the engine behaviours the fix depends on are checked here instead.
  webkit:
    name: "WebKit capability (macOS)"
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright WebKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install webkit
      - name: Run the capability check
        run: python .github/scripts/pr9906_webkit_capability.py

  routing:
    name: "deterministic routing checks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: actions/checkout defaults to depth 1, and merge-base against
      # a shallow origin/main exits 1 with no common ancestor.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The diff may not touch install, backend, Tauri, update or routing trees
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          BASE=$(git merge-base HEAD FETCH_HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          FORBIDDEN='^(unsloth/|unsloth_zoo|setup|scripts/|studio/backend/|studio/src-tauri/|pyproject|MANIFEST)'
          if echo "$CHANGED" | grep -qE "$FORBIDDEN"; then
            echo "::error::diff reaches a Studio-sensitive tree"
            exit 1
          fi
          echo "ok: frontend UI and i18n only"
