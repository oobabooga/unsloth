name: sd.cpp prebuilt legs (sync replica)
'on':
  push:
    branches:
    - sdrev-legs
permissions:
  contents: read
jobs:
  build-windows:
    name: build-windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: win-cpu-x64
          vulkan: 'OFF'
        - label: win-vulkan-x64
          vulkan: 'ON'
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c
    environment: release-signing
    steps:
    - name: Checkout tree (tooling)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: oobabooga/stable-diffusion.cpp
        ref: af486f167875e5595c683f6f5b8f8b4d2f9de1a0
        path: tooling
        fetch-depth: 1
    - name: Source tree (as resolve prepares it)
      run: 'set -eux

        git clone -q https://github.com/oobabooga/stable-diffusion.cpp src

        cd src

        git checkout -q af486f167875e5595c683f6f5b8f8b4d2f9de1a0

        git submodule update --init --recursive --depth 1 ggml

        for p in scripts/unsloth/ggml-patches/*.patch; do [ -e "$p" ] || continue; git -C ggml apply --verbose "../$p"; done

        git log --oneline -1

        '
      shell: bash
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Install Ninja
      run: choco install ninja --no-progress
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
    - name: Install Vulkan SDK
      if: ${{ matrix.vulkan == 'ON' }}
      shell: pwsh
      run: "$installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'\n$sdkRoot = Join-Path $env:RUNNER_TEMP 'VulkanSDK'\ncurl.exe --fail --location --retry 3 --output $installer \"https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe\"\
        \nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nif ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SHA256) {\n  throw 'Vulkan SDK installer SHA256 mismatch'\n}\n\
        $install = Start-Process -FilePath $installer -ArgumentList @(\n  '--root', \"`\"$sdkRoot`\"\", '--accept-licenses', '--default-answer', '--confirm-command', 'install'\n) -Wait -PassThru\nif ($install.ExitCode\
        \ -ne 0) { exit $install.ExitCode }\nAdd-Content $env:GITHUB_ENV \"VULKAN_SDK=$sdkRoot\"\nAdd-Content $env:GITHUB_PATH \"$sdkRoot\\Bin\"\n"
    - name: Build sd-cli + sd-server
      shell: pwsh
      working-directory: src
      run: "cmake -S . -B build -G Ninja `\n  -DCMAKE_BUILD_TYPE=Release `\n  -DCMAKE_CXX_FLAGS='/bigobj' `\n  -DSD_BUILD_EXAMPLES=ON `\n  -DSD_SERVER_BUILD_FRONTEND=OFF `\n  -DSD_WEBP=OFF -DSD_WEBM=OFF\
        \ `\n  -DSD_VULKAN=${{ matrix.vulkan }} `\n  -DGGML_NATIVE=OFF\ncmake --build build --config Release -j 3 --target sd-cli sd-server\n"
    - name: Package bundle
      shell: pwsh
      env:
        BIN_DIR: ${{ github.workspace }}/src/build/bin
        OUT_DIR: ${{ github.workspace }}/dist
        TAG: master-951-f89d9b1-uaf486f1
        LABEL: ${{ matrix.label }}
        COMMIT: af486f167875e5595c683f6f5b8f8b4d2f9de1a0
        SOURCE_REPO: ${{ github.repository }}
        LICENSE_FILE: ${{ github.workspace }}/src/LICENSE
      run: python tooling/scripts/unsloth/package_bundle.py
    - name: Upload bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sd-master-951-f89d9b1-uaf486f1-bin-${{ matrix.label }}
        path: dist/sd-master-951-f89d9b1-uaf486f1-bin-${{ matrix.label }}.zip
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 360
