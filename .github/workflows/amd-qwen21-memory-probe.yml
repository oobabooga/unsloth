  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 360
    env:
      UNSLOTH_IS_PRESENT: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
