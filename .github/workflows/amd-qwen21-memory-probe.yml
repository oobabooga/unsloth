name: Studio AMD same runner stock versus search cutoff cold A B
'on':
  push:
    branches:
    - amd-qwen21-memory-probe-20260929
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 360
    env:
      UNSLOTH_IS_PRESENT: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
      HF_ENDPOINT: https://huggingface.co
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      HF_HUB_ETAG_TIMEOUT: '30'
    steps:
    - name: Environment
      shell: python3 -X utf8 {0}
      timeout-minutes: 40
      run: |
        import os,sys,subprocess,json,platform
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'qwen21-expanded'
        root.mkdir(exist_ok=True)
        for name in ['out','tmp','cache/huggingface','cache/torch','cache/pip','cache/triton','cache/uv','studio']:
         (root/name).mkdir(parents=True,exist_ok=True)
        env={'WORK_ROOT':str(root),'TMPDIR':str(root/'tmp'),'TEMP':str(root/'tmp'),'TMP':str(root/'tmp'),'HF_HOME':str(root/'cache/huggingface'),'HUGGINGFACE_HUB_CACHE':str(root/'cache/huggingface/hub'),'TORCH_HOME':str(root/'cache/torch'),'PIP_CACHE_DIR':str(root/'cache/pip'),'UV_CACHE_DIR':str(root/'cache/uv'),'TRITON_CACHE_DIR':str(root/'cache/triton'),'UNSLOTH_HOME':str(root/'unsloth'),'UNSLOTH_STUDIO_HOME':str(root/'unsloth/studio'),'PYTHONPATH':str(root/'code/studio/backend')}
        os.environ.update(env)
        with open(os.environ['GITHUB_ENV'],'a') as f:
         for k,v in env.items(): f.write(k+'='+v+'\n')
        def run(cmd,**kw):
         print('RUN',cmd,flush=True)
         return subprocess.run(cmd,check=True,**kw)
        with (root/'out/host.txt').open('w') as f:
         f.write(platform.platform()+'\n')
         commands=([['powershell','-NoProfile','-Command','Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion,AdapterRAM; Get-CimInstance Win32_OperatingSystem | Format-List Caption,TotalVisibleMemorySize,FreePhysicalMemory; Get-CimInstance Win32_PageFileUsage | Format-List *']] if sys.platform=='win32' else [['uname','-a'],['lscpu'],['free','-h'],['bash','-c','for f in /sys/class/drm/card*/device/mem_info*; do echo "$f"; cat "$f"; done']])
         for c in commands: subprocess.run(c,stdout=f,stderr=subprocess.STDOUT)
        run(['git','init',str(root/'code')])
        run(['git','-C',str(root/'code'),'config','core.autocrlf','false'])
        run(['git','-C',str(root/'code'),'remote','add','origin','https://github.com/unslothai/unsloth.git'])
        sha='4700dbc86f0e9f0d433e8075d32aac4096cbffb2'
        run(['git','-C',str(root/'code'),'fetch','--depth=1','origin',sha])
        run(['git','-C',str(root/'code'),'checkout','--detach','FETCH_HEAD'])
        (root/'out/source-sha.txt').write_text(sha)
        run([sys.executable,'-m','venv',str(root/'venv')])
        py=str(root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python'))
        run([py,'-m','pip','install','--upgrade','pip'])
        specs=['torch==2.11.0+rocm7.13.0','torchvision==0.26.0+rocm7.13.0']
        if sys.platform!='win32': specs+=['triton==3.6.0+rocm7.13.0']
        run([py,'-m','pip','install','--index-url','https://repo.amd.com/rocm/whl/gfx1151/','--extra-index-url','https://pypi.org/simple',*specs])
        constraints=root/'torch-constraints.txt'
        constraints.write_text('\n'.join(specs)+'\n')
        run([py,'-m','pip','install','-c',str(constraints),'-r',str(root/'code/studio/backend/requirements/studio.txt'),'-r',str(root/'code/studio/backend/requirements/diffusers-main.txt'),'transformers==5.5.0','accelerate>=1.0','peft>=0.18','sentencepiece','psutil','protobuf','scipy','einops','Pillow','pyyaml','ninja','safetensors'])
        run([py,'-m','pip','install','--no-deps','unsloth-zoo==2026.9.8'])
        run([py,'-m','pip','install','-c',str(constraints),'tyro','hf_transfer','msgspec','wheel'])
        run([py,'-m','pip','install','--no-deps',str(root/'code')])
        # Match the Studio installer's torch 2.11 selection. Windows source package is pure Python.
        run([py,'-m','pip','install','--no-deps','torchao==0.17.0'])
        with (root/'out/pip-freeze.txt').open('w') as f: run([py,'-m','pip','freeze'],stdout=f)
        run([py,'-c',"import main; import torch; print(torch.__version__, torch.version.hip, torch.cuda.is_available()); assert torch.cuda.is_available(); print(torch.cuda.get_device_properties(0)); x=torch.randn((256,256),device='cuda',dtype=torch.bfloat16); print((x@x).sum().item()); from core.inference.diffusion import DiffusionBackend; from diffusers import QwenImage21Pipeline; print('IMPORTS PASSED')"])

        run([py,"-m","pip","install","pytest"])
    - name: Prepare probe
      shell: python3 -X utf8 {0}
      run: |
        import os
        from pathlib import Path
        (Path(os.environ['WORK_ROOT'])/'full_probe.py').write_text('"""Live Studio Qwen-Image-2.1 probe; capped cases simulate capacity, not a discrete GPU."""\nimport argparse\nimport collections\nimport functools\nimport importlib.metadata\nimport json\nimport os\nfrom pathlib import Path\ntry:\n    import resource\nexcept ImportError:\n    resource = None\nimport sys\nimport threading\nimport time\nimport traceback\n\np = argparse.ArgumentParser()\np.add_argument(\'--case\', required=True)\np.add_argument(\'--free-gib\', type=float, default=0)\np.add_argument(\'--memory-mode\', default=\'auto\')\np.add_argument(\'--output\', required=True)\np.add_argument(\'--speed\', default=\'default\')\np.add_argument(\'--te\', default=\'auto\')\np.add_argument(\'--width\', type=int, default=1024)\np.add_argument(\'--height\', type=int, default=1024)\np.add_argument(\'--steps\', type=int, default=4)\np.add_argument(\'--repeats\', type=int, default=2)\np.add_argument(\'--force-resident\', action=\'store_true\')\np.add_argument(\'--tiling\', action=\'store_true\')\np.add_argument(\'--trace\', action=\'store_true\')\np.add_argument(\'--math-attention\', action=\'store_true\')\np.add_argument(\'--plain-te\', action=\'store_true\')\np.add_argument(\'--reference\', action=\'store_true\')\np.add_argument(\'--host-available-gib\', type=float, default=0)\np.add_argument(\'--vae-mode\',choices=[\'default\',\'immediate\',\'native\',\'channels-last\',\'fast\',\'no-naive\',\'search-cutoff\'],default=\'default\')\nargs = p.parse_args()\nout = Path(args.output)\nout.mkdir(parents=True, exist_ok=True)\n\nemit_lock = threading.Lock()\n\ndef emit(event, **fields):\n    row = dict(event=event, case=args.case, time=time.time(), **fields)\n    line = json.dumps(row, default=str)\n    with emit_lock:\n        print(\'PROBE \' + line, flush=True)\n        with (out / (args.case + \'.jsonl\')).open(\'a\') as f:\n            f.write(line + \'\\n\')\n\nos.environ.setdefault(\'CUDA_DEVICE_ORDER\',\'PCI_BUS_ID\')\nos.environ[\'TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL\'] = \'0\' if args.math_attention else \'1\'\ncache=Path(os.environ[\'WORK_ROOT\'])/\'cache\'/(\'full-vae-\'+args.case)\nfor part in (\'db\',\'kernels\'):(cache/part).mkdir(parents=True,exist_ok=True)\nos.environ[\'MIOPEN_USER_DB_PATH\']=str(cache/\'db\')\nos.environ[\'MIOPEN_CUSTOM_CACHE_DIR\']=str(cache/\'kernels\')\nos.environ.pop(\'MIOPEN_FIND_MODE\',None)\nif args.vae_mode==\'fast\':os.environ[\'MIOPEN_FIND_MODE\']=\'FAST\'\nif args.vae_mode==\'search-cutoff\':os.environ[\'MIOPEN_SEARCH_CUTOFF\']=\'1\'\nif args.vae_mode==\'no-naive\':os.environ[\'MIOPEN_DEBUG_CONV_DIRECT_NAIVE_CONV_FWD\']=\'0\'\nimport main as studio_main\nemit(\'studio_startup_imported\', module=studio_main.__file__)\nimport torch\nimport psutil\ntry:\n    from core.inference import diffusion_qwenimage21_rocm as qchunks\nexcept ImportError:\n    qchunks=None\nchunk_calls=[0]\nif qchunks is not None:\n    real_chunks=qchunks._chunk_attention\n    def counted_chunks(*a,**kw):\n        chunk_calls[0]+=1\n        return real_chunks(*a,**kw)\n    qchunks._chunk_attention=counted_chunks\nemit(\'source\', backend_file=studio_main.__file__, patch_present=qchunks is not None)\n\nassert torch.cuda.is_available(), \'AMD GPU unavailable\'\nassert torch.version.hip or \'rocm\' in torch.__version__.lower(), \'ROCm torch required\'\ntorch.cuda.set_device(0)\ntorch.cuda.init()\nprops = torch.cuda.get_device_properties(0)\nversions = {}\nfor name in (\'torch\', \'torchvision\', \'triton\', \'transformers\', \'diffusers\', \'accelerate\', \'peft\', \'gguf\', \'torchao\', \'unsloth_zoo\'):\n    try:\n        versions[name] = importlib.metadata.version(name)\n    except importlib.metadata.PackageNotFoundError:\n        versions[name] = None\nemit(\'hardware\', name=props.name, properties=str(props), hip=torch.version.hip,\n     architecture=getattr(props, \'gcnArchName\', None), versions=versions,\n     physical_total_bytes=props.total_memory, physical_mem_get_info=torch.cuda.mem_get_info(),\n     host_memory=psutil.virtual_memory()._asdict(),\n     integrated=getattr(props, \'integrated\', getattr(props, \'is_integrated\', None)))\n# A real HIP operation verifies the wheel\'s kernel coverage before downloading models.\nx = torch.randn((1024, 1024), device=\'cuda\', dtype=torch.bfloat16)\ny = x @ x\ntorch.cuda.synchronize()\nassert torch.isfinite(y).all().item()\ndel x, y\ntorch.cuda.empty_cache()\n\nfrom utils.hardware import ensure_hardware_detected\nensure_hardware_detected()\nfrom core.inference import diffusion_memory as dm\nfrom core.inference import diffusion as d\nfrom core.inference.diffusion_device import resolve_diffusion_device_target\n\nemit(\'configuration\', arguments=vars(args), platform=sys.platform)\nif args.plain_te:\n    from plain_te_experiment import install\n    install(emit)\nfrom core.inference.prequant_safetensors import safetensors_prequant_supported\nfrom core._torchao_stub import is_stubbed\nfrom core.inference.diffusion_patch_backend import _helpers\ntry:\n    helpers = _helpers()\n    emit(\'patch_helpers\', available=bool(helpers))\n    if not helpers:\n        from unsloth_zoo.temporary_patches.utils import patch_function\nexcept Exception as exc:\n    emit(\'patch_helper_failure\', error=repr(exc), traceback=traceback.format_exc())\nemit(\'prequant_support\', supported=safetensors_prequant_supported(), torchao_stub=is_stubbed(\'torchao\'))\nimport importlib.util\nemit(\'package_origin\', unsloth=str(importlib.util.find_spec(\'unsloth\')), zoo=str(importlib.util.find_spec(\'unsloth_zoo\')))\ntarget = resolve_diffusion_device_target()\nemit(\'device_target\', target=target.as_public_dict(), native_snapshot=dm.snapshot_device_memory(target).as_public_dict())\nemit(\'blas_backend\', value=str(torch.backends.cuda.preferred_blas_library()), cudnn_benchmark=torch.backends.cudnn.benchmark)\nif args.free_gib:\n    # Limit the HIP caching allocator AND feed the planner a corresponding synthetic reading.\n    # No physical allocations are made to imitate a desktop. Shared-memory transfer bandwidth\n    # and this GPU\'s compute performance remain those of the actual Strix Halo runner.\n    cap = int(args.free_gib * 2**30)\n    assert cap < props.total_memory\n    torch.cuda.set_per_process_memory_fraction(cap / props.total_memory, 0)\n    def virtual_memory(backend):\n        physical_free, _ = torch.cuda.mem_get_info()\n        remaining = max(0, cap - torch.cuda.memory_reserved())\n        return min(physical_free, remaining) // 2**20, 20 * 1024, \'discrete_vram\'\n    dm._cuda_memory = virtual_memory\n    emit(\'synthetic_capacity\', total_gib=20, initial_free_gib=args.free_gib,\n         allocator_cap_bytes=cap, warning=\'Capacity experiment on an APU, not a 7900 XT hardware reproduction\')\n\nplans = []\noriginal_plan = d.plan_diffusion_memory\ndef record_plan(**kwargs):\n    plan = original_plan(**kwargs)\n    if args.force_resident:\n        import dataclasses\n        plan = dataclasses.replace(plan, offload_policy=\'none\', vae_tiling=args.tiling,\n                                   stream_transformer=False, stream_text_encoders=False)\n        emit(\'experimental_override\', description=\'Force resident under allocator cap; not an exposed Studio setting\')\n    plans.append(plan)\n    emit(\'plan\', plan=plan.as_public_dict(), stream_transformer=plan.stream_transformer,\n         stream_text_encoders=plan.stream_text_encoders)\n    for mode in (\'auto\', \'fast\', \'balanced\', \'low_vram\'):\n        other = original_plan(**dict(kwargs, requested_mode=mode))\n        emit(\'planner_comparison\', mode=mode, policy=other.offload_policy,\n             stream_transformer=other.stream_transformer,\n             stream_text_encoders=other.stream_text_encoders, tiling=other.vae_tiling,\n             reasons=other.reasons)\n    return plan\nd.plan_diffusion_memory = record_plan\n\nprocess = psutil.Process()\ndef memory():\n    try:\n        host_stats = dict(torch.cuda.memory.host_memory_stats())\n    except Exception as exc:\n        host_stats = {\'unavailable\':repr(exc)}\n    return dict(host_allocator=host_stats, allocated_bytes=torch.cuda.memory_allocated(), reserved_bytes=torch.cuda.memory_reserved(),\n                peak_allocated_bytes=torch.cuda.max_memory_allocated(),\n                peak_reserved_bytes=torch.cuda.max_memory_reserved(), rss_bytes=process.memory_info().rss,\n                max_rss_bytes=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss * 1024 if resource else getattr(process.memory_info(), \'peak_wset\', process.memory_info().rss),\n                host_available_bytes=psutil.virtual_memory().available, swap=psutil.swap_memory()._asdict(), process_memory=process.memory_info()._asdict(), cpu_percent=process.cpu_percent())\n\nhost_pressure = []\nif args.host_available_gib:\n    # Real, bounded host-memory pressure; this is NOT a system RAM limit.\n    # Leave at least the requested available RAM and never consume over 64 GiB.\n    import numpy as np\n    goal = max(48, args.host_available_gib) * 2**30\n    while psutil.virtual_memory().available > goal + 2**30 and len(host_pressure) < 64:\n        buf = np.empty(2**30, dtype=np.uint8)\n        buf.fill(17)\n        host_pressure.append(buf)\n    emit(\'host_pressure\', bytes=len(host_pressure)*2**30, available=psutil.virtual_memory().available)\ndef memory_maps(phase):\n    try:\n        rows=[m._asdict() for m in process.memory_maps(grouped=True)]\n        rows.sort(key=lambda m:m.get(\'rss\',0),reverse=True)\n        emit(\'memory_maps\', phase=phase, largest=rows[:25])\n    except Exception as exc:\n        emit(\'memory_maps_unavailable\', error=repr(exc))\nbackend = d.DiffusionBackend()\nstop = threading.Event()\ndef monitor():\n    while not stop.wait(5):\n        emit(\'sample\', memory=memory(), progress=backend.generate_progress())\nthreading.Thread(target=monitor, daemon=True).start()\ntry:\n    start = time.perf_counter()\n    backend.begin_load(\'unsloth/Qwen-Image-2.1-GGUF\', gguf_filename=\'qwen-image-2.1-Q4_K_M.gguf\',\n                       family_override=\'qwen-image-2.1\', memory_mode=args.memory_mode, speed_mode=args.speed,\n                       **({} if args.te == \'auto\' else {\'text_encoder_quant\': args.te}))\n    deadline = time.monotonic() + 2400\n    while True:\n        progress = backend.load_progress()\n        emit(\'load_progress\', progress=progress)\n        if progress.get(\'error\'):\n            raise RuntimeError(progress[\'error\'])\n        if progress.get(\'phase\') == \'ready\':\n            break\n        if time.monotonic() > deadline:\n            raise TimeoutError(\'Model load exceeded 40 minutes\')\n        time.sleep(10)\n    torch.cuda.synchronize()\n    state = backend._state\n    pipe = state.pipe\n    emit(\'loaded\', seconds=time.perf_counter()-start, status=backend.status(), memory=memory())\n    memory_maps(\'loaded\')\n    for name, component in pipe.components.items():\n        if not isinstance(component, torch.nn.Module):\n            continue\n        counts = collections.Counter()\n        seen = set()\n        for tensor in list(component.parameters()) + list(component.buffers()):\n            if tensor.device.type == \'meta\':\n                counts[\'meta\'] += tensor.numel() * tensor.element_size()\n                continue\n            storage = tensor.untyped_storage()\n            key = (str(tensor.device), storage.data_ptr())\n            if key in seen:\n                continue\n            seen.add(key)\n            counts[str(tensor.device) + \':\' + str(tensor.dtype)] += storage.nbytes()\n        emit(\'component_storage\', component=name, bytes_by_device_and_dtype=dict(counts))\n\n    # First two passes have no forward wrappers or additional GPU synchronizations inside\n    # inference. Different prompts avoid the prompt-embedding cache hiding encoder cost.\n    prompts = [\n        \'A red ceramic teapot on a wooden table beside a window, soft daylight, photograph.\',\n        \'A blue ceramic teapot on a wooden table beside a window, soft daylight, photograph.\',\n        \'A green ceramic teapot on a wooden table beside a window, soft daylight, photograph.\',\n    ]\n    prompts += [\'A \'+color+\' ceramic teapot on a wooden table beside a window, soft daylight, photograph.\' for color in [\'yellow\',\'purple\',\'orange\',\'white\',\'black\']]\n    import contextlib\n    decode_original=pipe.vae.decode\n    decode_count=[0]\n    if args.tiling:pipe.vae.enable_tiling()\n    if args.vae_mode==\'channels-last\':pipe.vae.to(memory_format=torch.channels_last)\n    def candidate_decode(*a,**kw):\n        index=decode_count[0];decode_count[0]+=1\n        torch.save(a[0].detach().cpu(),out/f\'{args.case}-latent-{index}.pt\')\n        emit(\'vae_before\',index=index,memory=memory(),miopen_immediate=torch.backends.miopen.immediate,cudnn_enabled=torch.backends.cudnn.enabled)\n        if args.vae_mode==\'immediate\':ctx=torch.backends.miopen.flags(immediate=True)\n        elif args.vae_mode==\'native\':ctx=torch.backends.cudnn.flags(enabled=False,benchmark=False)\n        else:ctx=contextlib.nullcontext()\n        try:\n            with ctx:\n                result=decode_original(*a,**kw)\n            return result\n        finally:\n            emit(\'vae_after\',index=index,memory=memory(),miopen_immediate=torch.backends.miopen.immediate,cudnn_enabled=torch.backends.cudnn.enabled)\n    pipe.vae.decode=candidate_decode\n    phase_records = collections.defaultdict(list)\n    def instrument(obj, method, phase):\n        if isinstance(obj, torch.nn.Module) and method == \'forward\':\n            active = []\n            def before(module, inputs):\n                torch.cuda.synchronize()\n                active.append((time.perf_counter(), torch.cuda.memory_allocated(), torch.cuda.max_memory_allocated()))\n            def after(module, inputs, output):\n                torch.cuda.synchronize()\n                began, allocated, peak = active.pop()\n                record=dict(seconds=time.perf_counter()-began, allocated_before=allocated,\n                            allocated_after=torch.cuda.memory_allocated(), peak_allocated=torch.cuda.max_memory_allocated(), peak_before=peak)\n                phase_records[phase].append(record)\n                emit(\'phase_call\', phase=phase, **record)\n            obj.register_forward_pre_hook(before)\n            obj.register_forward_hook(after, always_call=True)\n            return\n        original = getattr(obj, method)\n        @functools.wraps(original)\n        def measured(*a, **kw):\n            torch.cuda.synchronize()\n            began = time.perf_counter()\n            before = torch.cuda.memory_allocated()\n            peak_before = torch.cuda.max_memory_allocated()\n            try:\n                return original(*a, **kw)\n            finally:\n                torch.cuda.synchronize()\n                record = dict(seconds=time.perf_counter()-began, allocated_before=before,\n                              allocated_after=torch.cuda.memory_allocated(), peak_allocated=torch.cuda.max_memory_allocated(), peak_before=peak_before)\n                phase_records[phase].append(record)\n                emit(\'phase_call\', phase=phase, **record)\n        setattr(obj, method, measured)\n    for i, prompt in enumerate(prompts[:args.repeats]):\n        profiled = True\n        if i == 0:\n            instrument(pipe, \'encode_prompt\', \'encode_prompt\')\n            instrument(pipe.transformer, \'forward\', \'transformer_forward\')\n            instrument(pipe.vae, \'decode\', \'vae_decode\')\n        phase_records.clear()\n        torch.cuda.synchronize()\n        torch.cuda.reset_peak_memory_stats()\n        began = time.perf_counter()\n        conditioning = {}\n        if args.reference:\n            import base64\n            source=out/\'encoder-base-0-0.png\'\n            conditioning={\'init_image\':base64.b64encode(source.read_bytes()).decode(), \'reference_resolution\':1024}\n            prompt=\'Change the teapot to \'+(\'blue\' if i==0 else \'green\')+\'. Keep the room unchanged.\'\n        result = backend.generate(prompt=prompt, width=args.width, height=args.height, steps=args.steps, guidance=1.0, seed=42, **conditioning)\n        torch.cuda.synchronize()\n        elapsed = time.perf_counter()-began\n        for j, picture in enumerate(result[\'images\']):\n            picture.save(out / f\'{args.case}-{i}-{j}.png\')\n        emit(\'phase_totals\', index=i, phases={k:dict(calls=len(v),seconds=sum(x[\'seconds\'] for x in v)) for k,v in phase_records.items()})\n        emit(\'render\', index=i, cold=(i == 0), profiled=profiled, seconds=time.perf_counter()-began,\n             inference_seconds=elapsed, memory=memory(), result_keys=list(result), status=backend.status())\n    emit(\'phase_totals\', phases={name: dict(calls=len(rows), seconds=sum(r[\'seconds\'] for r in rows))\n                                for name, rows in phase_records.items()})\n    memory_maps(\'after_generation\')\n    from core.inference.diffusion_gguf_compile import is_compiled_dequant_installed\n    emit(\'compile_status\', installed=is_compiled_dequant_installed())\n    if args.trace:\n        try:\n            with torch.profiler.profile(activities=[torch.profiler.ProfilerActivity.CPU, torch.profiler.ProfilerActivity.CUDA], profile_memory=True, record_shapes=True) as prof:\n                backend.generate(prompt=\'A yellow teapot on a table.\', width=args.width, height=args.height, steps=2, guidance=1.0, seed=42)\n                torch.cuda.synchronize()\n            prof.export_chrome_trace(str(out / (args.case + \'-trace.json\')))\n            (out / (args.case + \'-operators.txt\')).write_text(prof.key_averages(group_by_input_shape=True).table(sort_by=\'self_device_time_total\', row_limit=80))\n            emit(\'trace_complete\')\n        except Exception as exc:\n            emit(\'trace_failure\', error=repr(exc))\n    emit(\'query_chunk_calls\',count=chunk_calls[0])\n    emit(\'complete\', success=True)\nexcept Exception as exc:\n    emit(\'failure\', error=repr(exc), traceback=traceback.format_exc(), memory=memory())\n    raise\nfinally:\n    stop.set()\n    backend.unload()\n',encoding='utf-8')
    - name: paired-stock
      shell: python3 -X utf8 {0}
      timeout-minutes: 35
      continue-on-error: true
      run: |
        import os,sys,subprocess,json,time
        from pathlib import Path
        root=Path(os.environ['WORK_ROOT']);case='paired-stock';out=root/'out'
        py=root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python')
        cmd=[str(py),'-u',str(root/'full_probe.py'),'--case',case,'--output',str(out),*['--vae-mode', 'default', '--width', '1024', '--height', '1024', '--steps', '4', '--repeats', '2', '--free-gib', '19']]
        start=time.time()
        with (out/(case+'.log')).open('w',encoding='utf-8') as f:
         p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT)
         try:rc=p.wait(timeout=2040)
         except subprocess.TimeoutExpired:
          if sys.platform=='win32':subprocess.run(['taskkill','/PID',str(p.pid),'/T','/F'])
