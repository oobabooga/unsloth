name: AMD VAE immediate mode and corrected Windows cache probes
'on':
  push:
    branches:
    - amd-qwen21-memory-probe-20260929
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 360
    env:
      UNSLOTH_IS_PRESENT: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
      HF_ENDPOINT: https://huggingface.co
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      HF_HUB_ETAG_TIMEOUT: '30'
    steps:
    - name: Environment
      shell: python3 -X utf8 {0}
      timeout-minutes: 40
      run: |
        import os,sys,subprocess,json,platform
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'qwen21-expanded'
        root.mkdir(exist_ok=True)
        for name in ['out','tmp','cache/huggingface','cache/torch','cache/pip','cache/triton','cache/uv','studio']:
         (root/name).mkdir(parents=True,exist_ok=True)
        env={'WORK_ROOT':str(root),'TMPDIR':str(root/'tmp'),'TEMP':str(root/'tmp'),'TMP':str(root/'tmp'),'HF_HOME':str(root/'cache/huggingface'),'HUGGINGFACE_HUB_CACHE':str(root/'cache/huggingface/hub'),'TORCH_HOME':str(root/'cache/torch'),'PIP_CACHE_DIR':str(root/'cache/pip'),'UV_CACHE_DIR':str(root/'cache/uv'),'TRITON_CACHE_DIR':str(root/'cache/triton'),'UNSLOTH_HOME':str(root/'unsloth'),'UNSLOTH_STUDIO_HOME':str(root/'unsloth/studio'),'PYTHONPATH':str(root/'code/studio/backend')}
        os.environ.update(env)
        with open(os.environ['GITHUB_ENV'],'a') as f:
         for k,v in env.items(): f.write(k+'='+v+'\n')
        def run(cmd,**kw):
         print('RUN',cmd,flush=True)
         return subprocess.run(cmd,check=True,**kw)
        with (root/'out/host.txt').open('w') as f:
         f.write(platform.platform()+'\n')
         commands=([['powershell','-NoProfile','-Command','Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion,AdapterRAM; Get-CimInstance Win32_OperatingSystem | Format-List Caption,TotalVisibleMemorySize,FreePhysicalMemory; Get-CimInstance Win32_PageFileUsage | Format-List *']] if sys.platform=='win32' else [['uname','-a'],['lscpu'],['free','-h'],['bash','-c','for f in /sys/class/drm/card*/device/mem_info*; do echo "$f"; cat "$f"; done']])
         for c in commands: subprocess.run(c,stdout=f,stderr=subprocess.STDOUT)
        run(['git','init',str(root/'code')])
        run(['git','-C',str(root/'code'),'config','core.autocrlf','false'])
        run(['git','-C',str(root/'code'),'remote','add','origin','https://github.com/unslothai/unsloth.git'])
        sha='4700dbc86f0e9f0d433e8075d32aac4096cbffb2'
        run(['git','-C',str(root/'code'),'fetch','--depth=1','origin',sha])
        run(['git','-C',str(root/'code'),'checkout','--detach','FETCH_HEAD'])
        (root/'out/source-sha.txt').write_text(sha)
        run([sys.executable,'-m','venv',str(root/'venv')])
        py=str(root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python'))
        run([py,'-m','pip','install','--upgrade','pip'])
        specs=['torch==2.11.0+rocm7.13.0','torchvision==0.26.0+rocm7.13.0']
        if sys.platform!='win32': specs+=['triton==3.6.0+rocm7.13.0']
        run([py,'-m','pip','install','--index-url','https://repo.amd.com/rocm/whl/gfx1151/','--extra-index-url','https://pypi.org/simple',*specs])
        constraints=root/'torch-constraints.txt'
        constraints.write_text('\n'.join(specs)+'\n')
        run([py,'-m','pip','install','-c',str(constraints),'-r',str(root/'code/studio/backend/requirements/studio.txt'),'-r',str(root/'code/studio/backend/requirements/diffusers-main.txt'),'transformers==5.5.0','accelerate>=1.0','peft>=0.18','sentencepiece','psutil','protobuf','scipy','einops','Pillow','pyyaml','ninja','safetensors'])
        run([py,'-m','pip','install','--no-deps','unsloth-zoo==2026.9.8'])
        run([py,'-m','pip','install','-c',str(constraints),'tyro','hf_transfer','msgspec','wheel'])
        run([py,'-m','pip','install','--no-deps',str(root/'code')])
        # Match the Studio installer's torch 2.11 selection. Windows source package is pure Python.
        run([py,'-m','pip','install','--no-deps','torchao==0.17.0'])
        with (root/'out/pip-freeze.txt').open('w') as f: run([py,'-m','pip','freeze'],stdout=f)
        run([py,'-c',"import main; import torch; print(torch.__version__, torch.version.hip, torch.cuda.is_available()); assert torch.cuda.is_available(); print(torch.cuda.get_device_properties(0)); x=torch.randn((256,256),device='cuda',dtype=torch.bfloat16); print((x@x).sum().item()); from core.inference.diffusion import DiffusionBackend; from diffusers import QwenImage21Pipeline; print('IMPORTS PASSED')"])

        run([py,"-m","pip","install","pytest"])
    - name: Prepare probe
      shell: python3 -X utf8 {0}
      run: |
        import os
        from pathlib import Path
        (Path(os.environ['WORK_ROOT'])/'vae_probe.py').write_text("import argparse,os,json,time,traceback,sys,threading,shutil\nfrom pathlib import Path\np=argparse.ArgumentParser();p.add_argument('--case',required=True);p.add_argument('--mode',default='default');p.add_argument('--cache',default='cold');p.add_argument('--tiling',action='store_true');p.add_argument('--no-cudnn',action='store_true');p.add_argument('--size',type=int,default=1024);p.add_argument('--ballast',type=float,default=4.7);p.add_argument('--cap',type=float,default=19);p.add_argument('--repeats',type=int,default=2)\np.add_argument('--immediate',action='store_true');p.add_argument('--channels-last',action='store_true')\na=p.parse_args();root=Path(os.environ['WORK_ROOT']);out=root/'out';case=out/a.case;case.mkdir(exist_ok=True)\ncache=root/'cache'/('vae-'+a.case);cache.mkdir(exist_ok=True)\nfor kind in ('db','kernels'):\n target=cache/kind\n source=root/'cache/vae-default-cold'/kind\n if a.cache in ('both',kind) and source.exists():shutil.copytree(source,target,dirs_exist_ok=True)\n target.mkdir(exist_ok=True)\nos.environ['MIOPEN_USER_DB_PATH']=str(cache/'db');os.environ['MIOPEN_CUSTOM_CACHE_DIR']=str(cache/'kernels')\nfor k in ('MIOPEN_FIND_MODE','MIOPEN_FIND_ENFORCE'):os.environ.pop(k,None)\nif a.mode!='default':os.environ['MIOPEN_FIND_MODE']=a.mode\nos.environ.update(MIOPEN_ENABLE_LOGGING='1',MIOPEN_LOG_LEVEL='6',MIOPEN_ENABLE_LOGGING_ELAPSED_TIME='1')\nlock=threading.Lock()\ndef emit(event,**fields):\n d=dict(event=event,time=time.time(),case=a.case,**fields);s=json.dumps(d,default=str)\n with lock:\n  print('PROBE '+s,flush=True)\n  with (case/'events.jsonl').open('a') as f:f.write(s+'\\n')\ndef cache_state(label):\n records=[dict(path=str(x.relative_to(cache)),size=x.stat().st_size) for x in cache.rglob('*') if x.is_file()]\n emit('cache',label=label,files=records)\ncache_state('before')\nimport main\nimport torch,psutil\nfrom core.inference import diffusion as studio_diffusion\nfrom diffusers import AutoencoderKLQwenImage21\nemit('hardware',torch=torch.__version__,hip=torch.version.hip,props=str(torch.cuda.get_device_properties(0)),host=psutil.virtual_memory()._asdict(),env={k:v for k,v in os.environ.items() if k.startswith('MIOPEN_')},args=vars(a))\ntorch.backends.cudnn.benchmark=False\nif a.immediate:torch.backends.miopen.immediate=True\nemit('backend_flags',miopen_immediate=torch.backends.miopen.immediate)\nif a.no_cudnn:torch.backends.cudnn.enabled=False\nprops=torch.cuda.get_device_properties(0);torch.cuda.set_per_process_memory_fraction(a.cap*2**30/props.total_memory)\nprocess=psutil.Process();stop=threading.Event()\ndef memory():return dict(allocated=torch.cuda.memory_allocated(),reserved=torch.cuda.memory_reserved(),peak=torch.cuda.max_memory_allocated(),rss=process.memory_info().rss,host_free=psutil.virtual_memory().available)\ndef sample():\n while not stop.wait(10):emit('sample',memory=memory(),cpu=process.cpu_percent())\nthreading.Thread(target=sample,daemon=True).start()\ntry:\n start=time.perf_counter();vae=AutoencoderKLQwenImage21.from_pretrained('Qwen/Qwen-Image-2.1',subfolder='vae',torch_dtype=torch.bfloat16).to('cuda').eval()\n if a.tiling:vae.enable_tiling()\n if a.channels_last:vae.to(memory_format=torch.channels_last)\n ballast=torch.empty(int(a.ballast*2**30),device='cuda',dtype=torch.uint8);ballast.fill_(0)\n emit('loaded',seconds=time.perf_counter()-start,config=dict(vae.config),memory=memory(),cudnn_enabled=torch.backends.cudnn.enabled,cudnn_benchmark=torch.backends.cudnn.benchmark)\n z=torch.randn((1,vae.config.z_dim,1,a.size//vae.spatial_compression_ratio,a.size//vae.spatial_compression_ratio),generator=torch.Generator().manual_seed(42)).to(device='cuda',dtype=vae.dtype)\n mean=torch.tensor(vae.config.latents_mean,device='cuda',dtype=vae.dtype).view(1,-1,1,1,1);std=torch.tensor(vae.config.latents_std,device='cuda',dtype=vae.dtype).view(1,-1,1,1,1);z=z*std+mean\n # Capture slow convolution shapes and distinguish CPU dispatch time from GPU completion.\n original=torch.nn.functional.conv2d;conv_index=0\n def conv(*args,**kw):\n  global conv_index\n  index=conv_index;conv_index+=1;torch.cuda.synchronize();t=time.perf_counter()\n  try:r=original(*args,**kw)\n  except Exception as e:\n   emit('conv_error',index=index,shape=list(args[0].shape),weight=list(args[1].shape),error=str(e),memory=memory());raise\n  dispatched=time.perf_counter()-t;torch.cuda.synchronize();elapsed=time.perf_counter()-t\n  emit('conv',index=index,shape=list(args[0].shape),weight=list(args[1].shape),stride=kw.get('stride',args[3] if len(args)>3 else 1),dispatch_seconds=dispatched,seconds=elapsed,memory=memory())\n  return r\n torch.nn.functional.conv2d=conv\n with torch.inference_mode():\n  for i in range(a.repeats):\n   torch.cuda.reset_peak_memory_stats();torch.cuda.synchronize();t=time.perf_counter();decoded=vae.decode(z,return_dict=False)[0];torch.cuda.synchronize();elapsed=time.perf_counter()-t\n   emit('decode',index=i,seconds=elapsed,shape=list(decoded.shape),finite=bool(torch.isfinite(decoded).all()),memory=memory())\n   torch.save(decoded.cpu(),case/f'decoded-{i}.pt');del decoded\n   cache_state('after-'+str(i))\n torch.nn.functional.conv2d=original\n emit('complete',success=True)\nexcept Exception as e:\n emit('failure',error=str(e),traceback=traceback.format_exc(),memory=memory());raise\nfinally:\n stop.set();cache_state('final')\n shutil.make_archive(str(case/'miopen-cache'),'zip',cache)\n",encoding='utf-8')
    - name: default-cold
      shell: python3 -X utf8 {0}
      timeout-minutes: 35
      continue-on-error: true
      run: |
        import os,sys,subprocess,json,time
        from pathlib import Path
        root=Path(os.environ['WORK_ROOT']);case='default-cold';out=root/'out'/case;out.mkdir(exist_ok=True)
        py=root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python')
        cmd=[str(py),'-u',str(root/'vae_probe.py'),'--case',case,*[]]
        start=time.time()
        with (out/'full.log').open('w',encoding='utf-8') as f:
         p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT)
         try:rc=p.wait(timeout=2040)
         except subprocess.TimeoutExpired:
          if sys.platform=='win32':subprocess.run(['taskkill','/PID',str(p.pid),'/T','/F'])
          else:p.kill()
          p.wait();rc=124
        (out/'exit.json').write_text(json.dumps({'returncode':rc,'elapsed':time.time()-start}))
        with (out/'full.log').open(encoding='utf-8',errors='replace') as f:
         from collections import deque
         print(''.join(deque(f,maxlen=40)))
        print('CASE_RESULT',case,rc,flush=True)
        sys.exit(rc)
    - name: Evidence default-cold
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vae-linux-default-cold
        path: ${{ env.WORK_ROOT }}/out/default-cold
        retention-days: 14
