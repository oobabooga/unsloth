      if: always()
      run: |
        import os,json
        from pathlib import Path
        root=Path(os.environ['WORK_ROOT'])/'out'
        lines=[]
        for p in sorted(root.glob('*.jsonl')):
         for l in p.read_text(encoding='utf-8').splitlines():
          d=json.loads(l)
          if d['event'] in ('prequant_support','plan','phase_totals','render','failure','compile_status','complete'):
           d.pop('status',None)
           lines.append(json.dumps(d))
        (root/'summary.jsonl').write_text('\n'.join(lines))
        print('\n'.join(lines))
