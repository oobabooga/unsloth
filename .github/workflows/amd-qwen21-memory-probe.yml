name: Qwen image AMD production fixes live A B
'on':
  push:
    branches:
    - amd-qwen21-memory-probe-20260929
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 360
    env:
      UNSLOTH_IS_PRESENT: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
      HF_ENDPOINT: https://huggingface.co
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      HF_HUB_ETAG_TIMEOUT: '30'
    steps:
    - name: Environment
      shell: python3 -X utf8 {0}
      timeout-minutes: 40
      run: |
        import os,sys,subprocess,json,platform
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'qwen21-expanded'
        root.mkdir(exist_ok=True)
        for name in ['out','tmp','cache/huggingface','cache/torch','cache/pip','cache/triton','cache/uv','studio']:
         (root/name).mkdir(parents=True,exist_ok=True)
        env={'WORK_ROOT':str(root),'TMPDIR':str(root/'tmp'),'TEMP':str(root/'tmp'),'TMP':str(root/'tmp'),'HF_HOME':str(root/'cache/huggingface'),'HUGGINGFACE_HUB_CACHE':str(root/'cache/huggingface/hub'),'TORCH_HOME':str(root/'cache/torch'),'PIP_CACHE_DIR':str(root/'cache/pip'),'UV_CACHE_DIR':str(root/'cache/uv'),'TRITON_CACHE_DIR':str(root/'cache/triton'),'UNSLOTH_HOME':str(root/'unsloth'),'UNSLOTH_STUDIO_HOME':str(root/'unsloth/studio'),'PYTHONPATH':str(root/'code/studio/backend')}
        os.environ.update(env)
        with open(os.environ['GITHUB_ENV'],'a') as f:
         for k,v in env.items(): f.write(k+'='+v+'\n')
        def run(cmd,**kw):
         print('RUN',cmd,flush=True)
         return subprocess.run(cmd,check=True,**kw)
        with (root/'out/host.txt').open('w') as f:
         f.write(platform.platform()+'\n')
         commands=([['powershell','-NoProfile','-Command','Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion,AdapterRAM; Get-CimInstance Win32_OperatingSystem | Format-List Caption,TotalVisibleMemorySize,FreePhysicalMemory; Get-CimInstance Win32_PageFileUsage | Format-List *']] if sys.platform=='win32' else [['uname','-a'],['lscpu'],['free','-h'],['bash','-c','for f in /sys/class/drm/card*/device/mem_info*; do echo "$f"; cat "$f"; done']])
         for c in commands: subprocess.run(c,stdout=f,stderr=subprocess.STDOUT)
        run(['git','init',str(root/'code')])
        run(['git','-C',str(root/'code'),'config','core.autocrlf','false'])
        run(['git','-C',str(root/'code'),'remote','add','origin','https://github.com/unslothai/unsloth.git'])
        sha='4700dbc86f0e9f0d433e8075d32aac4096cbffb2'
        run(['git','-C',str(root/'code'),'fetch','--depth=1','origin',sha])
        run(['git','-C',str(root/'code'),'checkout','--detach','FETCH_HEAD'])
        (root/'out/source-sha.txt').write_text(sha)
        run([sys.executable,'-m','venv',str(root/'venv')])
        py=str(root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python'))
        run([py,'-m','pip','install','--upgrade','pip'])
        specs=['torch==2.11.0+rocm7.13.0','torchvision==0.26.0+rocm7.13.0']
        if sys.platform!='win32': specs+=['triton==3.6.0+rocm7.13.0']
        run([py,'-m','pip','install','--index-url','https://repo.amd.com/rocm/whl/gfx1151/','--extra-index-url','https://pypi.org/simple',*specs])
        constraints=root/'torch-constraints.txt'
        constraints.write_text('\n'.join(specs)+'\n')
        run([py,'-m','pip','install','-c',str(constraints),'-r',str(root/'code/studio/backend/requirements/studio.txt'),'-r',str(root/'code/studio/backend/requirements/diffusers-main.txt'),'transformers==5.5.0','accelerate>=1.0','peft>=0.18','sentencepiece','psutil','protobuf','scipy','einops','Pillow','pyyaml','ninja','safetensors'])
        run([py,'-m','pip','install','--no-deps','unsloth-zoo==2026.9.8'])
        run([py,'-m','pip','install','-c',str(constraints),'tyro','hf_transfer','msgspec','wheel'])
        run([py,'-m','pip','install','--no-deps',str(root/'code')])
        # Match the Studio installer's torch 2.11 selection. Windows source package is pure Python.
        run([py,'-m','pip','install','--no-deps','torchao==0.17.0'])
        with (root/'out/pip-freeze.txt').open('w') as f: run([py,'-m','pip','freeze'],stdout=f)
        run([py,'-c',"import main; import torch; print(torch.__version__, torch.version.hip, torch.cuda.is_available()); assert torch.cuda.is_available(); print(torch.cuda.get_device_properties(0)); x=torch.randn((256,256),device='cuda',dtype=torch.bfloat16); print((x@x).sum().item()); from core.inference.diffusion import DiffusionBackend; from diffusers import QwenImage21Pipeline; print('IMPORTS PASSED')"])

        run([py,"-m","pip","install","pytest"])
    - name: Prepare separate baseline and patched checkouts
      shell: python3 -X utf8 {0}
      run: |
        import os,subprocess
        from pathlib import Path
        root=Path(os.environ['WORK_ROOT'])
        p=root/'encoder.patch'
        p.write_bytes(b'diff --git a/studio/backend/core/inference/diffusion_te_prequant.py b/studio/backend/core/inference/diffusion_te_prequant.py\nindex e9943bc719..51e76f9a54 100644\n--- a/studio/backend/core/inference/diffusion_te_prequant.py\n+++ b/studio/backend/core/inference/diffusion_te_prequant.py\n@@ -212,15 +212,14 @@ def te_candidate_is_readable(name: Optional[str]) -> bool:\n     NOT the transformer\'s ``restricted_prequant_load_supported``: this state dict is plain\n     tensors, read under a bare ``weights_only`` load with no constructor allowlist, so a ``.pt``\n     is always readable and asking the DiT\'s question would refuse one on every install whose\n-    torchao lacks some DiT scheme\'s constructors. Only the safetensors container has a\n-    requirement, and a plan that drops the dense encoder for an artifact this install cannot open\n-    leaves the load with neither.\n+    torchao lacks some DiT scheme\'s constructors. The safetensors container needs only\n+    safetensors, not torchao. Check that dependency before planning without dense shards.\n     """\n     if not name:\n         return False\n-    from .prequant_safetensors import is_safetensors_checkpoint, safetensors_prequant_supported\n+    from .prequant_safetensors import is_safetensors_checkpoint, plain_safetensors_supported\n \n-    return safetensors_prequant_supported() if is_safetensors_checkpoint(name) else True\n+    return plain_safetensors_supported() if is_safetensors_checkpoint(name) else True\n \n \n def family_te_prequant_repo(fam: Any, scheme: str, component: str) -> Optional[str]:\n@@ -419,15 +418,15 @@ def load_prequant_text_encoder(\n \n         import torch\n \n-        from .prequant_safetensors import is_safetensors_checkpoint, load_prequant_safetensors\n+        from .prequant_safetensors import is_safetensors_checkpoint, load_plain_prequant_safetensors\n \n         # The layerwise-fp8 state dict is plain tensors, so weights_only=True suffices and no pickle code runs even for\n         # a local path. A future torchao-subclass scheme needs a format bump AND the DiT module\'s allowlist.\n-        # A ``.safetensors`` artifact is read through the shared reader instead, which returns the same dict shape, so\n+        # A ``.safetensors`` artifact is read through the plain-tensor reader instead, which returns the same dict shape, so\n         # ``_validate_checkpoint`` and everything after it are unchanged. Dispatch is on the extension the resolver\n         # asked the Hub for, never on sniffing the bytes.\n         if is_safetensors_checkpoint(path):\n-            ckpt = load_prequant_safetensors(path)\n+            ckpt = load_plain_prequant_safetensors(path)\n         else:\n             ckpt = torch.load(path, weights_only = True, map_location = "cpu")\n         if not _validate_checkpoint(ckpt, scheme, component, base, logger):\ndiff --git a/studio/backend/core/inference/prequant_safetensors.py b/studio/backend/core/inference/prequant_safetensors.py\nindex 2307fca8d0..74d99184bb 100644\n--- a/studio/backend/core/inference/prequant_safetensors.py\n+++ b/studio/backend/core/inference/prequant_safetensors.py\n@@ -135,6 +135,58 @@ def safetensors_prequant_supported() -> bool:\n     return True\n \n \n+def plain_safetensors_supported() -> bool:\n+    """The layerwise-cast encoder format stores plain tensors, without torchao subclasses."""\n+    try:\n+        from safetensors import safe_open  # noqa: F401\n+    except ImportError:\n+        return False\n+    return True\n+\n+\n+def load_plain_prequant_safetensors(path: str, *, device: str = "cpu") -> dict:\n+    """Read a plain-tensor prequant checkpoint without importing torchao.\n+\n+    Refuse subclass metadata and unaccounted tensors before reading weights. The\n+    caller still validates the component, scheme, base model and state-dict keys.\n+    """\n+    from safetensors import safe_open\n+\n+    with safe_open(path, framework = "pt", device = device) as handle:\n+        raw = handle.metadata() or {}\n+        fmt = raw.get(UNSLOTH_FORMAT_KEY)\n+        if not fmt:\n+            raise ValueError(f"{path} is not an Unsloth pre-quant checkpoint")\n+        metadata = json.loads(raw.get(UNSLOTH_METADATA_KEY) or "{}")\n+        names = json.loads(raw.get("tensor_names") or "null")\n+        if not isinstance(metadata, dict):\n+            raise ValueError(f"{path} has invalid pre-quant metadata")\n+        if (\n+            not isinstance(names, list)\n+            or not all(isinstance(name, str) and name for name in names)\n+            or len(names) != len(set(names))\n+        ):\n+            raise ValueError(f"{path} has invalid tensor_names")\n+        keys = set(handle.keys())\n+        roots = {key for key in keys if key.startswith(UNSLOTH_ROOT_PREFIX)}\n+        root_names = {key[len(UNSLOTH_ROOT_PREFIX) :] for key in roots}\n+        if (\n+            any(not name or "." in name for name in root_names)\n+            or root_names.intersection(names)\n+            or set(names).intersection(roots)\n+            or set(names) != keys - roots\n+        ):\n+            raise ValueError(f"{path} has tensors its header does not account for")\n+        for name in names:\n+            if json.loads(raw.get(name) or "null") != {"_type": "Tensor"}:\n+                raise ValueError(f"{path} requires a tensor-subclass reader for {name!r}")\n+        state_dict = {name: handle.get_tensor(name) for name in names}\n+        state_dict.update(\n+            (key[len(UNSLOTH_ROOT_PREFIX) :], handle.get_tensor(key)) for key in roots\n+        )\n+    return {"format": str(fmt), "state_dict": state_dict, "metadata": metadata}\n+\n+\n def _first(value: Any) -> Any:\n     """Both torchao helpers return a 2-tuple whose first element is the dict we want.\n \ndiff --git a/studio/backend/tests/test_prequant_safetensors.py b/studio/backend/tests/test_prequant_safetensors.py\nindex 74c507d35c..ca07a89e6b 100644\n--- a/studio/backend/tests/test_prequant_safetensors.py\n+++ b/studio/backend/tests/test_prequant_safetensors.py\n@@ -594,3 +594,90 @@ def test_torchao_older_than_the_floor_is_not_safetensors_support(monkeypatch):\n     monkeypatch.setattr(ps, "_torchao_version", lambda: "0.14.0")\n     assert ps._torchao_helpers() is None\n     assert ps.safetensors_prequant_supported() is False\n+\n+\n+@pytest.fixture\n+def plain_checkpoint(tmp_path, monkeypatch):\n+    torch = pytest.importorskip("torch")\n+    save_file = pytest.importorskip("safetensors.torch").save_file\n+    monkeypatch.setattr(ps, "_torchao_helpers", lambda: None)\n+\n+    def write(*, tensors = None, header = None):\n+        tensors = {"encoder.weight": torch.ones(2, 3)} if tensors is None else tensors\n+        metadata = {\n+            ps.UNSLOTH_FORMAT_KEY: "unsloth_prequant_text_encoder_state_dict_v1",\n+            ps.UNSLOTH_METADATA_KEY: json.dumps({"scheme": "fp8", "component": "text_encoder"}),\n+            "tensor_names": json.dumps(["encoder.weight"]),\n+            "encoder.weight": json.dumps({"_type": "Tensor"}),\n+        }\n+        metadata.update(header or {})\n+        path = str(tmp_path / "encoder.safetensors")\n+        save_file(tensors, path, metadata = metadata)\n+        return path\n+\n+    return write\n+\n+\n+def test_plain_encoder_needs_no_torchao(plain_checkpoint):\n+    import core.inference.diffusion_te_prequant as te\n+    import torch\n+\n+    path = plain_checkpoint(tensors = {"encoder.weight": torch.ones(2, 3).to(torch.float8_e4m3fn)})\n+    assert te.te_candidate_is_readable(path)\n+    assert not ps.safetensors_prequant_supported()\n+    loaded = ps.load_plain_prequant_safetensors(path)\n+    assert loaded["state_dict"]["encoder.weight"].dtype == torch.float8_e4m3fn\n+    assert torch.equal(loaded["state_dict"]["encoder.weight"].float(), torch.ones(2, 3))\n+    assert loaded["metadata"]["scheme"] == "fp8"\n+\n+\n+@pytest.mark.parametrize(\n+    "header",\n+    [\n+        {"tensor_names": \'["encoder.weight", "encoder.weight"]\'},\n+        {"tensor_names": \'["missing.weight"]\'},\n+        {"tensor_names": \'"encoder.weight"\'},\n+        {"tensor_names": "[1]"},\n+        {"tensor_names": "invalid"},\n+        {"encoder.weight": \'{"_type":"Float8Tensor"}\'},\n+        {"encoder.weight": \'{"_type":"Tensor","unexpected":true}\'},\n+        {ps.UNSLOTH_METADATA_KEY: "[]"},\n+        {ps.UNSLOTH_FORMAT_KEY: ""},\n+    ],\n+)\n+def test_plain_reader_rejects_invalid_headers(plain_checkpoint, header):\n+    with pytest.raises(ValueError):\n+        ps.load_plain_prequant_safetensors(plain_checkpoint(header = header))\n+\n+\n+def test_plain_reader_rejects_unaccounted_tensor(plain_checkpoint):\n+    import torch\n+    path = plain_checkpoint(\n+        tensors = {"encoder.weight": torch.ones(2), "extra.weight": torch.ones(2)}\n+    )\n+    with pytest.raises(ValueError, match = "does not account"):\n+        ps.load_plain_prequant_safetensors(path)\n+\n+\n+def test_plain_reader_restores_root_buffers(plain_checkpoint):\n+    import torch\n+\n+    path = plain_checkpoint(\n+        tensors = {\n+            "encoder.weight": torch.ones(2),\n+            ps.UNSLOTH_ROOT_PREFIX + "buffer": torch.zeros(1),\n+        }\n+    )\n+    state = ps.load_plain_prequant_safetensors(path)["state_dict"]\n+    assert set(state) == {"encoder.weight", "buffer"}\n+    assert torch.equal(state["buffer"], torch.zeros(1))\n+\n+\n+def test_plain_reader_rejects_root_collision(plain_checkpoint):\n+    import torch\n+    path = plain_checkpoint(\n+        tensors = {"buffer": torch.ones(2), ps.UNSLOTH_ROOT_PREFIX + "buffer": torch.zeros(1)},\n+        header = {"tensor_names": \'["buffer"]\', "buffer": \'{"_type":"Tensor"}\'},\n+    )\n+    with pytest.raises(ValueError, match = "does not account"):\n+        ps.load_plain_prequant_safetensors(path)\n')
        subprocess.run(['git','-C',str(root/'code'),'worktree','add','--detach',str(root/'code-encoder'),'HEAD'],check=True)
        subprocess.run(['git','-C',str(root/'code-encoder'),'apply','--check',str(p)],check=True)
        subprocess.run(['git','-C',str(root/'code-encoder'),'apply',str(p)],check=True)
        p=root/'attention.patch'
        p.write_bytes(b'diff --git a/studio/backend/core/inference/diffusion_qwenimage21_rocm.py b/studio/backend/core/inference/diffusion_qwenimage21_rocm.py\nnew file mode 100644\nindex 0000000000..dc187210b3\n--- /dev/null\n+++ b/studio/backend/core/inference/diffusion_qwenimage21_rocm.py\n@@ -0,0 +1,158 @@\n+# SPDX-License-Identifier: AGPL-3.0-only\n+# Copyright 2026-present the Unsloth AI Inc. team. All rights reserved. See /studio/LICENSE.AGPL-3.0\n+\n+"""Bound large Qwen-Image-2.1 query batches on measured ROCm GPUs.\n+\n+On gfx1151, native flash attention slows sharply above 8192 image tokens. Query\n+rows are independent for unmasked, noncausal attention, so each chunk can retain\n+all keys and values. Prefill, masks and explicit alternative backends stay stock.\n+"""\n+\n+from __future__ import annotations\n+\n+import functools\n+import os\n+from typing import Any\n+\n+QUERY_CHUNK_ENV = "UNSLOTH_QWEN_IMAGE_ROCM_QUERY_CHUNKING"\n+QUERY_CHUNK_SIZE = 512\n+MIN_QUERY_TOKENS = 8192\n+\n+\n+def _device_supported(target: Any) -> bool:\n+    if getattr(target, "backend", None) != "rocm" or getattr(target, "device", None) != "cuda":\n+        return False\n+    setting = (os.environ.get(QUERY_CHUNK_ENV) or "auto").strip().lower()\n+    if setting in ("0", "false", "off", "no"):\n+        return False\n+    import torch\n+\n+    if not getattr(torch.version, "hip", None):\n+        return False\n+    if setting in ("1", "true", "on", "yes"):\n+        return True\n+    ordinal = getattr(target, "ordinal", None)\n+    props = torch.cuda.get_device_properties(\n+        torch.cuda.current_device() if ordinal is None else ordinal\n+    )\n+    return str(getattr(props, "gcnArchName", "")).split(":", 1)[0] == "gfx1151"\n+\n+\n+def _native_backend(processor: Any) -> bool:\n+    from diffusers.models.attention_dispatch import _AttentionBackendRegistry\n+\n+    backend = processor._attention_backend\n+    if backend is None:\n+        backend, _ = _AttentionBackendRegistry.get_active_backend()\n+    return backend == "native"\n+\n+\n+def _can_chunk(processor, attn, hidden_states, attention_mask, segments, key_valid) -> bool:\n+    import torch\n+    return not (\n+        segments is not None\n+        or attention_mask is not None\n+        or key_valid is not None\n+        or processor._parallel_config is not None\n+        or hidden_states.device.type != "cuda"\n+        or hidden_states.dtype != torch.bfloat16\n+        or hidden_states.shape[1] < MIN_QUERY_TOKENS\n+        or attn.heads != 32\n+        or attn.inner_dim != 4096\n+        or torch.is_grad_enabled()\n+        or torch.compiler.is_compiling()\n+        or not _native_backend(processor)\n+    )\n+\n+\n+def _chunk_attention(query: Any, key: Any, value: Any, dispatch: Any, **kwargs: Any) -> Any:\n+    import torch\n+    return torch.cat(\n+        [\n+            dispatch(query[:, start : start + QUERY_CHUNK_SIZE], key, value, **kwargs)\n+            for start in range(0, query.shape[1], QUERY_CHUNK_SIZE)\n+        ],\n+        dim = 1,\n+    )\n+\n+\n+@functools.lru_cache(maxsize = 1)\n+def _processor_class() -> type:\n+    import torch\n+    from diffusers.models.transformers.transformer_qwenimage21 import (\n+        QwenImage21AttnProcessor,\n+        _qwenimage21_prepare_qkv,\n+        dispatch_attention_fn,\n+    )\n+\n+    class ChunkedQwenImage21AttnProcessor(QwenImage21AttnProcessor):\n+        def __call__(\n+            self,\n+            attn,\n+            hidden_states,\n+            attention_mask = None,\n+            rotary_emb = None,\n+            layer_cache = None,\n+            kv_cache_mode = None,\n+            cache_write_slice = None,\n+            segments = None,\n+            key_valid = None,\n+        ):\n+            if not _can_chunk(self, attn, hidden_states, attention_mask, segments, key_valid):\n+                return super().__call__(\n+                    attn,\n+                    hidden_states,\n+                    attention_mask,\n+                    rotary_emb,\n+                    layer_cache,\n+                    kv_cache_mode,\n+                    cache_write_slice,\n+                    segments,\n+                    key_valid,\n+                )\n+            query, key, value, seq_len_q = _qwenimage21_prepare_qkv(\n+                attn, hidden_states, rotary_emb, layer_cache, kv_cache_mode, cache_write_slice\n+            )\n+            output = _chunk_attention(\n+                query,\n+                key,\n+                value,\n+                dispatch_attention_fn,\n+                attn_mask = None,\n+                dropout_p = 0.0,\n+                backend = self._attention_backend,\n+                parallel_config = self._parallel_config,\n+            )\n+            output = output[:, :seq_len_q].flatten(2, 3).type_as(query)\n+            return attn.to_out[1](attn.to_out[0](output))\n+\n+    return ChunkedQwenImage21AttnProcessor\n+\n+\n+def install(\n+    pipe: Any,\n+    target: Any,\n+    logger: Any = None,\n+) -> bool:\n+    """Replace only this pipeline\'s stock Qwen-Image-2.1 processors, before placement."""\n+    if not _device_supported(target):\n+        return False\n+    transformer = getattr(pipe, "transformer", None)\n+    if type(transformer).__name__ != "QwenImage21Transformer2DModel":\n+        return False\n+    from diffusers.models.transformers.transformer_qwenimage21 import QwenImage21AttnProcessor\n+\n+    cls = _processor_class()\n+    installed = False\n+    for module in transformer.modules():\n+        processor = getattr(module, "processor", None)\n+        if type(processor) is cls:\n+            installed = True\n+        elif type(processor) is QwenImage21AttnProcessor:\n+            replacement = cls()\n+            replacement.__dict__.update(processor.__dict__)\n+            module.set_processor(replacement)\n+            installed = True\n+    if installed and logger is not None:\n+        logger.info("diffusion.qwenimage21: large ROCm decode queries use 512-row chunks")\n+    return installed\ndiff --git a/studio/backend/core/inference/diffusion_speed.py b/studio/backend/core/inference/diffusion_speed.py\nindex 0f8bc24695..0836c85ea1 100644\n--- a/studio/backend/core/inference/diffusion_speed.py\n+++ b/studio/backend/core/inference/diffusion_speed.py\n@@ -445,6 +445,7 @@ def apply_speed_optims(\n         "fused_qkv": False,\n         "compiled": False,\n         "compiled_dequant": False,\n+        "rocm_query_chunks": False,\n         "compiled_vae_decode": False,\n         "cuda_graph": False,\n     }\n@@ -454,6 +455,13 @@ def apply_speed_optims(\n     if mode == SPEED_OFF:\n         return applied\n \n+    if getattr(target, "backend", None) == "rocm":\n+        try:\n+            from .diffusion_qwenimage21_rocm import install as install_rocm_query_chunks\n+            applied["rocm_query_chunks"] = install_rocm_query_chunks(pipe, target, logger)\n+        except Exception as exc:  # noqa: BLE001 - keep stock attention on unsupported installs\n+            _warn(logger, "qwen-image-2.1 ROCm query chunks", exc)\n+\n     on_cuda = getattr(target, "device", None) == "cuda"\n     family_allows_compile = bool(getattr(family, "supports_torch_compile", True))\n \ndiff --git a/studio/backend/tests/test_diffusion_qwenimage21_rocm.py b/studio/backend/tests/test_diffusion_qwenimage21_rocm.py\nnew file mode 100644\nindex 0000000000..9160e069d8\n--- /dev/null\n+++ b/studio/backend/tests/test_diffusion_qwenimage21_rocm.py\n@@ -0,0 +1,139 @@\n+# SPDX-License-Identifier: AGPL-3.0-only\n+# Copyright 2026-present the Unsloth AI Inc. team. All rights reserved. See /studio/LICENSE.AGPL-3.0\n+\n+from types import SimpleNamespace\n+\n+import pytest\n+\n+from core.inference import diffusion_qwenimage21_rocm as chunks\n+\n+\n+@pytest.mark.parametrize(\n+    "architecture,setting,expected",\n+    [\n+        ("gfx1151", "auto", True),\n+        ("gfx1151:sramecc-", "auto", True),\n+        ("gfx1100", "auto", False),\n+        ("gfx942", "auto", False),\n+        ("gfx1100", "1", True),\n+        ("gfx1151", "0", False),\n+    ],\n+)\n+def test_device_scope(monkeypatch, architecture, setting, expected):\n+    torch = pytest.importorskip("torch")\n+    monkeypatch.setenv(chunks.QUERY_CHUNK_ENV, setting)\n+    monkeypatch.setattr(torch.version, "hip", "7.13")\n+    monkeypatch.setattr(\n+        torch.cuda, "get_device_properties", lambda i: SimpleNamespace(gcnArchName = architecture)\n+    )\n+    target = SimpleNamespace(backend = "rocm", device = "cuda", ordinal = 1)\n+    assert chunks._device_supported(target) is expected\n+    assert not chunks._device_supported(SimpleNamespace(backend = "cuda", device = "cuda"))\n+    assert not chunks._device_supported(SimpleNamespace(backend = "cpu", device = "cpu"))\n+\n+\n+@pytest.mark.parametrize(\n+    "reason",\n+    [\n+        "eligible",\n+        "cpu",\n+        "fp32",\n+        "small",\n+        "heads",\n+        "mask",\n+        "segments",\n+        "key_valid",\n+        "parallel",\n+        "grad",\n+        "compile",\n+        "backend",\n+    ],\n+)\n+def test_runtime_scope(monkeypatch, reason):\n+    torch = pytest.importorskip("torch")\n+    hidden = SimpleNamespace(\n+        device = SimpleNamespace(type = "cuda"), dtype = torch.bfloat16, shape = (1, 8192, 4096)\n+    )\n+    processor = SimpleNamespace(_parallel_config = None)\n+    attn = SimpleNamespace(heads = 32, inner_dim = 4096)\n+    mask = segments = key_valid = None\n+    if reason == "cpu":\n+        hidden.device.type = "cpu"\n+    if reason == "fp32":\n+        hidden.dtype = torch.float32\n+    if reason == "small":\n+        hidden.shape = (1, 4096, 4096)\n+    if reason == "heads":\n+        attn.heads = 16\n+    if reason == "mask":\n+        mask = object()\n+    if reason == "segments":\n+        segments = []\n+    if reason == "key_valid":\n+        key_valid = object()\n+    if reason == "parallel":\n+        processor._parallel_config = object()\n+    monkeypatch.setattr(torch, "is_grad_enabled", lambda: reason == "grad")\n+    monkeypatch.setattr(torch.compiler, "is_compiling", lambda: reason == "compile")\n+    monkeypatch.setattr(chunks, "_native_backend", lambda p: reason != "backend")\n+    assert chunks._can_chunk(processor, attn, hidden, mask, segments, key_valid) is (\n+        reason == "eligible"\n+    )\n+\n+\n+def test_chunks_keep_all_keys_and_values():\n+    torch = pytest.importorskip("torch")\n+    torch.manual_seed(12)\n+    q = torch.randn(2, 1100, 2, 8)\n+    k = torch.randn(2, 1200, 2, 8)\n+    v = torch.randn_like(k)\n+    calls = []\n+\n+    def dispatch(qpart, key, value, **kwargs):\n+        calls.append((qpart.shape[1], key, value, kwargs))\n+        return torch.nn.functional.scaled_dot_product_attention(\n+            qpart.transpose(1, 2), key.transpose(1, 2), value.transpose(1, 2), **kwargs\n+        ).transpose(1, 2)\n+\n+    expected = dispatch(q, k, v, scale = 0.2)\n+    calls.clear()\n+    actual = chunks._chunk_attention(q, k, v, dispatch, scale = 0.2)\n+    torch.testing.assert_close(actual, expected)\n+    assert [c[0] for c in calls] == [512, 512, 76]\n+    assert all(c[1] is k and c[2] is v and c[3] == {"scale": 0.2} for c in calls)\n+\n+\n+def test_processor_output_and_stock_fallback(monkeypatch):\n+    torch = pytest.importorskip("torch")\n+    module = pytest.importorskip("diffusers.models.transformers.transformer_qwenimage21")\n+    torch.manual_seed(8)\n+    attn = module.QwenImage21Attention(dim = 16, heads = 2, dim_head = 8)\n+    stock = module.QwenImage21AttnProcessor()\n+    patched = chunks._processor_class()()\n+    hidden = torch.randn(1, 1100, 16)\n+    with torch.inference_mode():\n+        expected = stock(attn, hidden)\n+        monkeypatch.setattr(chunks, "_can_chunk", lambda *a: True)\n+        torch.testing.assert_close(patched(attn, hidden), expected)\n+        monkeypatch.setattr(chunks, "_can_chunk", lambda *a: False)\n+        mask = torch.ones(1, 1, 1100, 1100, dtype = torch.bool).tril()\n+        torch.testing.assert_close(\n+            patched(attn, hidden, attention_mask = mask), stock(attn, hidden, attention_mask = mask)\n+        )\n+\n+\n+def test_install_is_local_and_idempotent(monkeypatch):\n+    torch = pytest.importorskip("torch")\n+    module = pytest.importorskip("diffusers.models.transformers.transformer_qwenimage21")\n+    monkeypatch.setattr(chunks, "_device_supported", lambda target: True)\n+    attn = module.QwenImage21Attention(dim = 16, heads = 2, dim_head = 8)\n+    untouched = module.QwenImage21Attention(dim = 16, heads = 2, dim_head = 8)\n+    transformer = type("QwenImage21Transformer2DModel", (), {"modules": lambda self: [attn]})()\n+    pipe = SimpleNamespace(transformer = transformer)\n+    stock = attn.processor\n+    assert chunks.install(pipe, None)\n+    installed = attn.processor\n+    assert chunks.install(pipe, None)\n+    assert attn.processor is installed\n+    assert type(untouched.processor) is type(stock)\n+    assert type(installed) is chunks._processor_class()\ndiff --git a/studio/backend/tests/test_diffusion_speed.py b/studio/backend/tests/test_diffusion_speed.py\nindex 9c94c416ed..99346c5e94 100644\n--- a/studio/backend/tests/test_diffusion_speed.py\n+++ b/studio/backend/tests/test_diffusion_speed.py\n@@ -434,6 +434,7 @@ def test_speed_off_applies_nothing(monkeypatch):\n         "fused_qkv": False,\n         "compiled": False,\n         "compiled_dequant": False,\n+        "rocm_query_chunks": False,\n         "compiled_vae_decode": False,\n         "fp16_accum": False,\n         "cuda_graph": False,\n')
