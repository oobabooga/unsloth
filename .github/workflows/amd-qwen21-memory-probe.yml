    - name: free16-auto
      shell: python3 -X utf8 {0}
      timeout-minutes: 30
      continue-on-error: true
      run: |
        import os,sys,subprocess,json,time
        from pathlib import Path
        root=Path(os.environ['WORK_ROOT'])
        py=root/('venv/Scripts/python.exe' if sys.platform=='win32' else 'venv/bin/python')
        case='free16-auto'
        os.environ['TORCHINDUCTOR_CACHE_DIR']=str(root/'cache/inductor')
        cmd=[str(py),'-u',str(root/'probe.py'),'--case',case,'--output',str(root/'out'),*['--free-gib', '16', '--trace']]
        with (root/'out'/(case+'.log')).open('w',encoding='utf-8') as f:
         p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT)
