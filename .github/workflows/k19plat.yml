name: "AMD CI k19 plat r3: test-llama-context recurrent / replay cases on ROCm0 without the debug realloc abort (r2: it stops on the first model): k19-int3 + k19-platfix (fx), gdnreplay trial merge + fix (rpf), 11-06 base (d6)"

# Correctness only (no timing): ctest, test-backend-ops ROCm0 vs CPU, delta-net replay probes, llama-server smoke on a tiny Qwen3 MoE.
# Trees: i3 fetched by commit from the public CI copy (danielhanchen/llama.cpp-staging-ci f85d5f5115b = 1f09fc4a8fb minus its
# .github/workflows), d6 / rp = i3 + k19p/<name>.patch.gz; every tree hash is checked (k19p/TREES).
# No token, secret or credential is sent to the runners. GPU shared (no exclusive group): nothing here is timed.

on:
  push:
    branches: [amd-ci-llama-k19plat]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:

  linux-control:
    name: "k19plat linux control (selector diagnosis for the Windows leg)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"

  gpu-linux:
    name: "k19plat Linux ROCm gfx1151"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "k19plat-linux"
      - name: Hardware gate
        run: |
          set +e
          python3 amd_ci/lib/gate.py --no-torch --out "$AMD_CI_WORK/out/host.json" > /dev/null
          R=$(command -v rocminfo || echo /opt/rocm/bin/rocminfo)
          "$R" 2>&1 | grep -m3 -E "Marketing Name|gfx1151" | tee "$AMD_CI_WORK/out/rocminfo.txt"
          if [ ! -e /dev/kfd ] || ! grep -q gfx1151 "$AMD_CI_WORK/out/rocminfo.txt"; then echo "GATE FAILED: no gfx1151 via KFD"; exit 1; fi
          echo "gate ok"
      - name: Build and check
        timeout-minutes: 285
        run: |
          set +e
          bash k19p/linux.sh
          rc=$?
          echo "job rc=$rc"
          test -s "$AMD_CI_WORK/out/rows.jsonl"
      - name: Stop leftover processes
        if: always()
        run: |
          set +e
          for p in $(pgrep -u "$(id -u)" -x llama-server; pgrep -u "$(id -u)" -x test-backend-op; pgrep -u "$(id -u)" -f "test-llama-c[o]ntext"); do kill -9 "$p"; done
          echo "cleanup done"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k19plat-linux
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  gpu-windows:
    name: "k19plat Windows 11 ROCm gfx1151"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "k19plat-windows"
      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_OS='$env:RUNNER_OS' RUNNER_NAME='$env:RUNNER_NAME'"
          & "C:\Program Files\Python312\python.exe" "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch --require windows --out "$env:AMD_CI_WORK\out\windows\host.json"
          if ($LASTEXITCODE -ne 0) { Write-Host "GATE FAILED"; exit 1 }
      - name: Build and check
        timeout-minutes: 285
        run: |
          $ErrorActionPreference = "Continue"
          & "$env:GITHUB_WORKSPACE\k19p\win.ps1"
          if (-not (Test-Path "$env:AMD_CI_WORK\out\rows.jsonl")) { exit 1 }
      - name: Stop leftover processes
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          Get-Process -Name llama-server, test-backend-ops, test-llama-context, test-llama-archs -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "cleanup done"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k19plat-windows
          path: ${{ env.AMD_CI_WORK }}\out
          retention-days: 7
          if-no-files-found: warn
