name: "AMD CI: validate PR 19568"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-g22-g16-lnx]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "19568"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  AMD1_BASE_OVERRIDE: "0d76f9495addbee9ca111940db657b4cf7a4b6a7"
  AMD1_HEAD_OVERRIDE: "260c206c57b66be01b3e902c48a3640f2417f892"
  MERGED: "0"
  # Set by scaffold.py --patch: base = PATCH_BASE, head = PATCH_BASE plus this diff (relative to the checkout).
  PATCH_BASE: ""
  PATCH_FILE: ""
  PATCH_SHA256: "__PATCH_SHA256__"

jobs:

  gpu:
    name: "PR 19568 GPU check (shared GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 420
    # --shared-gpu: no concurrency group, so a co-tenant may share the card.
    # Correctness only; capability.py reports `exclusive_gpu` as a gap.
    env:
      AMD_CI_SHARED_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr19568-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          if [ -n "$PATCH_FILE" ]; then ARGS="--patch-base $PATCH_BASE --patch $GITHUB_WORKSPACE/$PATCH_FILE --patch-sha256 $PATCH_SHA256"; fi
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and host gate (no Studio)
        run: |
          set -euo pipefail
          echo "AMD_CI_PY=$(command -v python3)" >> "$GITHUB_ENV"
          # No torch here, so rocm/gpu read UNDETERMINED: the criteria gates prove the GPU ran.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/train5_probe.py \
            --criteria amd_ci/criteria/amdgate_rocm.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --unit g16 --state-repo unsloth --transformers 5.24.0 --trl 1.18.0 --cells env,flm16,flm4,grpo_txt,grpo_padeos,grpo_padeos_ref,grpo_padeos_refctl,dpo_txt,vision,tphost,gen_llama,gen_llama_f32,gen_mistral,gen_gemma3,gen_llama_mlpbias,plain_llama,plain_qwen2,plain_after,sa8k_q06,sa8k_q06_r,sa2k_q06,cmp_qwen3,vis_frozen,vis_frozen_ks,vis_unfrozen,aot_q06 --companion-repo https://github.com/unslothai/unsloth-zoo --companion-base c7761938a6faccf0bd35fbf9ed2346cbeb9f3827 --companion-head dba93c5446397abc2de56e4e9d5c7a7a4eae94c9 --venv "$AMD_CI_WORK/tvenv" --tests tests/test_attention_dispatch_saved_attention.py tests/test_grpo_untruncated_rollout_logprobs.py tests/test_grpo_vllm_is_default_on.py tests/test_grpo_vllm_is_mode_default.py tests/test_vllm_generation_quantized_sync_refused.py tests/test_ep_moe_families_gloo.py tests/test_optimizer_state_offload_ring_oom.py tests/test_block_compile.py tests/test_ep_x_cp_gloo.py tests/test_ep_composition_guards.py tests/test_ep_context_parallel_refusal.py tests/test_ep_inherited_env.py tests/test_ep_inkling2_gloo.py tests/test_parallel_capabilities_ep.py tests/test_parallel_cp_compose_gloo.py tests/test_parallel_env.py tests/test_pp_env_gloo.py tests/test_frozen_tower_input_grads.py tests/test_token_balance_ddp_default.py tests/test_fsdp2_native_float32_decay_gloo.py tests/test_split_layer_rope_tables.py tests/test_cp_router_aux_gloo.py tests/test_ep_sharded_load_gloo.py tests/test_parallel_capabilities_evidence.py tests/test_ep_replica_buckets_gloo.py tests/test_ep_expert_shapes_gloo.py tests/test_ep_checkpoint_integrity_gloo.py tests/test_ep_collective_safety_gloo.py tests/test_is_big_gpu_matches_torch.py tests/test_parallel_inkling2_prequantized_gloo.py --repeat flm16,flm4,grpo_txt,dpo_txt,gen_llama,gen_mistral,plain_llama,grpo_padeos_refctl,sa8k_q06,sa2k_q06,cmp_qwen3,vis_frozen,aot_q06 --companion-tests tests/test_vllm_untruncated_logprobs.py tests/test_gc_saved_attention.py tests/test_aot_cache_custom_autograd_function.py tests/test_moe_sonic_zero_copy.py tests/test_tiling_expert_parallel_gloo.py tests/test_rocm_sdk_wheel_detection.py tests/test_chunked_logprob.py tests/test_fp32_out_head_no_copy.py tests/test_grpo_recompute_fp32_lm_head.py tests/test_vllm_fp32_lm_head.py tests/test_grpo_fused_route.py tests/test_grpo_scorer_offload_routing.py tests/test_grpo_prefix_grouper_pad_in_eos.py tests/test_routing_replay.py tests/test_routing_replay_vllm_contracts.py tests/test_cpu_cpo_chunked_logps.py tests/test_vllm_sleep_cache_reset.py tests/test_cpu_packing.py --companion-tests-from-head tests/test_vllm_untruncated_logprobs.py !tests/test_gc_saved_attention.py tests/test_aot_cache_custom_autograd_function.py !tests/test_moe_sonic_zero_copy.py tests/test_tiling_expert_parallel_gloo.py !tests/test_rocm_sdk_wheel_detection.py !tests/test_chunked_logprob.py !tests/test_fp32_out_head_no_copy.py !tests/test_grpo_recompute_fp32_lm_head.py !tests/test_vllm_fp32_lm_head.py !tests/test_grpo_fused_route.py !tests/test_grpo_scorer_offload_routing.py !tests/test_grpo_prefix_grouper_pad_in_eos.py !tests/test_routing_replay.py !tests/test_routing_replay_vllm_contracts.py !tests/test_cpu_cpo_chunked_logps.py !tests/test_vllm_sleep_cache_reset.py !tests/test_cpu_packing.py --tests-from-head !tests/test_attention_dispatch_saved_attention.py tests/test_grpo_untruncated_rollout_logprobs.py !tests/test_grpo_vllm_is_default_on.py !tests/test_grpo_vllm_is_mode_default.py tests/test_vllm_generation_quantized_sync_refused.py !tests/test_ep_moe_families_gloo.py tests/test_optimizer_state_offload_ring_oom.py !tests/test_block_compile.py tests/test_ep_x_cp_gloo.py !tests/test_ep_composition_guards.py !tests/test_ep_context_parallel_refusal.py !tests/test_ep_inherited_env.py !tests/test_ep_inkling2_gloo.py !tests/test_parallel_capabilities_ep.py !tests/test_parallel_cp_compose_gloo.py !tests/test_parallel_env.py !tests/test_pp_env_gloo.py tests/test_frozen_tower_input_grads.py !tests/test_token_balance_ddp_default.py !tests/test_fsdp2_native_float32_decay_gloo.py !tests/test_split_layer_rope_tables.py !tests/test_cp_router_aux_gloo.py !tests/test_ep_sharded_load_gloo.py !tests/test_parallel_capabilities_evidence.py !tests/test_ep_replica_buckets_gloo.py !tests/test_ep_expert_shapes_gloo.py !tests/test_ep_checkpoint_integrity_gloo.py !tests/test_ep_collective_safety_gloo.py !tests/test_is_big_gpu_matches_torch.py !tests/test_parallel_inkling2_prequantized_gloo.py !tests/_tiny_fixture_revisions.py
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr19568-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
