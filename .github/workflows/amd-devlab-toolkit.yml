name: "DevLab: validate PR 9487"

# Generated from devlab/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because the DevLab pool is four ephemeral slots on ONE machine
# sharing ONE GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-devlab-toolkit]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "9487"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  suites:
    name: "PR 9487 suites, base vs head"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 120
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source devlab/lib/preamble.sh "pr9487-suites"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          python3 devlab/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$DEVLAB_WORK" --out "$DEVLAB_WORK/out/states.json"

      - name: Environment
        timeout-minutes: 60
        run: |
          set -euo pipefail
          # Heavy, and only needed if the suites import torch. Delete otherwise.
          cd "$DEVLAB_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$DEVLAB_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "DEVLAB_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" -m pip install -q pytest pytest-asyncio pytest-timeout

      - name: Differential
        run: |
          set +e
          python3 devlab/lib/differential.py \
            --states "$DEVLAB_WORK/out/states.json" \
            --probe devlab/probes/pytest_probe.py \
            --criteria devlab/criteria/pytest_no_regression.py \
            --out-dir "$DEVLAB_WORK/out/suites" \
            --python "${DEVLAB_PY:-python3}" \
            -- --tests tests/test_sd_cpp_install.py
          cat "$DEVLAB_WORK/out/suites/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr9487-suites
          path: ${{ env.DEVLAB_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
