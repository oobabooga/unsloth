name: "staging-10682 macos-15"
on:
  push:
    branches: ["pr-10682-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install 'torch>=2.4' jinja2 'unsloth_zoo>=2026.9.3' 'wheel>=0.42.0' packaging numpy tqdm psutil tyro protobuf 'sentencepiece>=0.2.0' 'datasets>=3.4.1,!=4.0.*,!=4.1.0,<4.4.0' 'accelerate>=0.34.1' 'peft>=0.18.0,!=0.11.0' 'huggingface_hub>=0.34.0' hf_transfer 'diffusers>=0.39.0' 'transformers>=4.51.3,<=5.5.0' 'trl>=0.18.2,<=0.24.0' sentence-transformers
      - run: python -m pip install triton-windows || echo "optional deps unavailable on macos-15"
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/python/test_gemma4_base_bos_token.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && ! grep -qE "^FAILED " pytest_out.txt; then err=0; grep -qE "^ERROR " pytest_out.txt && err=$(grep -cE "^ERROR " pytest_out.txt); dep=0; grep -qE "No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt && dep=$(grep -cE "No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$err" -gt 0 ] && [ "$err" = "$dep" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
