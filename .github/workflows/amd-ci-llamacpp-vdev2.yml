name: "AMD CI: -sm tensor across virtual devices on gfx1151"

# Correction to the previous branch (amd-ci-llamacpp-vdev, run 33066112466).
#
# That run established two things on this gfx1151 host with upstream b10631:
#   A1  GGML_CUDA_DEVICES=3 works on ROCm. 116 layers really split across
#       ROCm0:40 / ROCm1:40 / ROCm2:36 and the model generated tokens. Virtual
#       devices (ggml-org/llama.cpp#25228, merged 79bba02, first in b10043) are
#       the first mechanism to give this host genuine multi-device on ROCm.
#   A2  `-sm row` refused: "device ROCm0 does not support split buffers".
#
# A2's reading was incomplete, and this branch exists to fix that rather than
# publish it. `-sm row` on CUDA/HIP is the LEGACY split-buffer path:
# src/llama-model.cpp:1073-1093 asks the backend for a
# `ggml_backend_split_buffer_type` proc address and throws that exact message
# when it is absent. On current llama.cpp only the SYCL backend still exports
# it; CUDA/HIP, Vulkan and RPC all do not. So "does not support split buffers"
# is not a statement about this host at all - it is what every CUDA, HIP,
# Vulkan and RPC device now returns, on any hardware.
#
# Tensor parallelism moved. include/llama.h:199-202 carries a FOURTH mode,
# LLAMA_SPLIT_MODE_TENSOR, exposed as `-sm tensor` (common/arg.cpp:2808-2822),
# and ggml-cuda.cu's get_proc_address exports ggml_backend_comm_init /
# comm_free / comm_allreduce_tensor. Both are present in b10631, the build
# already used. So the earlier run tested a flag this backend no longer
# implements and concluded too much from the refusal.
#
# What this branch asks, cheapest first:
#   T0  0.6B, GGML_CUDA_DEVICES=3, -sm layer    control; known to work
#   T1  0.6B, GGML_CUDA_DEVICES=3, -sm tensor   is tensor parallelism reachable?
#   T2  0.6B, GGML_CUDA_DEVICES=3, -sm row      re-recorded for the write-up
# and only if T1 reached it, the question #9792 actually wanted:
#   V4  27B V2 vs V3, -sm tensor
#   V5  27B V2 vs V3, -sm tensor + MTP   the shape @kostich flagged on #24492

on:
  push:
    branches: [amd-ci-llamacpp-vdev2]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_TAG: "b10631"
  SMALL_REPO: "unsloth/Qwen3-0.6B-GGUF"
  SMALL_REV: "50968a4468ef4233ed78cd7c3de230dd1d61a56b"
  SMALL_FILE: "Qwen3-0.6B-Q4_K_M.gguf"
  GGUF_REPO: "unsloth/Qwen3.8-27B-GGUF"
  REV_V2: "408fcc1807ab264d8cd644a7c4c0f58fbd32eebc"
  REV_V3: "4ca720788d1e01f1bff70c033e0d0028fd02e502"
  FILE_Q4: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
  FILE_MTP: "MTP/mtp-Qwen3.8-27B-Q4_0.gguf"
  VDEVS: "3"
  CTX: "8192"

jobs:

  gpu:
    name: "-sm tensor across virtual devices on gfx1151 (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 350
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "llamacpp-vdev2"

      - name: Hardware gate
        run: |
          set -eu
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"
          { rocminfo || true; } > "$AMD_CI_WORK/out/rocminfo.txt" 2>&1
          { free -g; } > "$AMD_CI_WORK/out/free.txt" 2>&1
          { uname -a; } > "$AMD_CI_WORK/out/uname.txt" 2>&1
          df -h "$AMD_CI_WORK" | tail -1

      - name: Fetch llama.cpp ROCm build
        timeout-minutes: 30
        run: |
          set -eu
          R="https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG"
          python3 amd_ci/lib/fetch_llamacpp.py \
            --url "$R/llama-$LLAMA_TAG-bin-ubuntu-rocm-7.14-x64.tar.gz" \
            --dest "$AMD_CI_WORK/lcpp/rocm" --out "$AMD_CI_WORK/out/bin_rocm.json"
          python3 amd_ci/lib/emit_bin_env.py "$AMD_CI_WORK/out" >> "$GITHUB_ENV"
          python3 amd_ci/lib/emit_bin_env.py "$AMD_CI_WORK/out"

      - name: Fetch the 0.6B capability model
        timeout-minutes: 20
        run: |
          set -eu
          python3 amd_ci/lib/fetch_gguf.py --repo "$SMALL_REPO" --file "$SMALL_FILE" \
            --revision "$SMALL_REV" --as-name model.gguf \
            --local-dir "$AMD_CI_WORK/models/small" \
            --out "$AMD_CI_WORK/out/model_small.json"

      - name: T0-T2 - which split modes does this backend actually implement?
        if: always()
        run: |
          set +e
          # Observation, not judgement: "is this configuration reachable" is a
          # capability question with no base/head in it, so the probe is run
          # directly and no criteria module is involved.
          M="$AMD_CI_WORK/models/small"
          O="$AMD_CI_WORK/out/cap"
          mkdir -p "$O"
          for MODE in layer tensor row; do
            python3 amd_ci/probes/llamacpp_mtp_probe.py --state "$MODE" --checkout "$M" \
              --out "$O/obs_$MODE.json" --bin-dir "$ROCM_BIN" --gguf model.gguf \
              --ctx-size "$CTX" --env "GGML_CUDA_DEVICES=$VDEVS" \
              --extra-arg=-sm --extra-arg="$MODE" \
              --load-timeout 600 --request-timeout 300
          done
          python3 -c "$CAP_PY" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "$CAP_PY" --env >> "$GITHUB_ENV"
        env:
          CAP_PY: |
            import json, os, sys
            O = os.environ["AMD_CI_WORK"] + "/out/cap"
            def load(n):
                try:
                    return json.load(open(f"{O}/obs_{n}.json"))
                except Exception:
                    return {}
            def accel(o):
                return {d: n for d, n in (o.get("layers_by_device") or {}).items()
                        if not d.upper().startswith("CPU") and not d.upper().endswith("_HOST")}
            got = {m: load(m) for m in ("layer", "tensor", "row")}
            # Reached means generated a token AND really sat on 2+ accelerator
            # devices. Either alone overstates it: a run that collapsed onto one
            # device is a single-device run wearing a multi-device label.
            ok = {m: bool(o.get("succeeded")) and len(accel(o)) >= 2 for m, o in got.items()}
            if "--env" in sys.argv:
                print(f"TENSOR_OK={'1' if ok['tensor'] else '0'}")
                raise SystemExit(0)
            print("### Which split modes this ROCm backend implements (0.6B, "
                  "GGML_CUDA_DEVICES=%s)\n" % os.environ["VDEVS"])
            print("| -sm | devices | tokens | reached | error |")
            print("|---|---|---|---|---|")
            for m, o in got.items():
                tail = (o.get("log_tail") or "")
                err = ""
                for line in tail.splitlines():
                    if "error loading model" in line or "does not support" in line:
                        err = line.strip()[-110:]
                print("| `%s` | `%s` | %s | **%s** | `%s` |" % (
                    m, accel(o) or "-", o.get("tokens_generated"), ok[m], err or "-"))
            print("\n`-sm row` on CUDA/HIP is the legacy split-buffer path "
                  "(src/llama-model.cpp:1073-1093). Only the SYCL backend still "
                  "exports `ggml_backend_split_buffer_type`; CUDA, HIP, Vulkan and "
                  "RPC do not, so that refusal is not specific to this host. "
                  "`-sm tensor` (LLAMA_SPLIT_MODE_TENSOR) is the current tensor "
                  "parallel path and is what the row cell should have been.")
            if not ok["tensor"]:
                print("\nThe 27B cells are skipped: with tensor parallelism "
                      "unreachable, downloading 35 GB would measure nothing new.")
                print("\n`-sm tensor` log tail:\n\n```\n%s\n```"
                      % (got["tensor"].get("log_tail") or "")[-1200:])

      - name: Fetch the 27B models
        if: always() && env.TENSOR_OK == '1'
        timeout-minutes: 120
        run: |
          set -eu
          M="$AMD_CI_WORK/models"
          python3 amd_ci/lib/fetch_gguf.py --repo "$GGUF_REPO" --file "$FILE_Q4" \
            --revision "$REV_V2" --as-name model.gguf --local-dir "$M/v2_q4" \
            --out "$AMD_CI_WORK/out/model_v2_q4.json"
          python3 amd_ci/lib/fetch_gguf.py --repo "$GGUF_REPO" --file "$FILE_Q4" \
            --revision "$REV_V3" --as-name model.gguf --local-dir "$M/v3_q4" \
            --out "$AMD_CI_WORK/out/model_v3_q4.json"
          python3 amd_ci/lib/fetch_gguf.py --repo "$GGUF_REPO" --file "$FILE_MTP" \
            --revision "$REV_V3" --as-name mtp.gguf --local-dir "$M/mtp" \
            --out "$AMD_CI_WORK/out/model_mtp.json"
          echo "MTP_GGUF=$M/mtp/mtp.gguf" >> "$GITHUB_ENV"
          python3 amd_ci/lib/write_states.py --require-file model.gguf \
            --path "base=$M/v2_q4" --path "head=$M/v3_q4" \
            --label "base=V2 408fcc180" --label "head=V3 4ca720788" \
            --out "$AMD_CI_WORK/out/states_rev.json"
          df -h "$AMD_CI_WORK" | tail -1

      - name: V4 - V2 vs V3 under tensor parallelism
        if: always() && env.TENSOR_OK == '1'
        run: |
          set +e
          # The cell #9792 wanted and could not reach. The multidevice criteria
          # module refuses any state whose graph did not really land on two or
          # more accelerator devices, so a run that collapsed back to one device
          # reads INCONCLUSIVE rather than as a confident negative.
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states_rev.json" \
            --probe amd_ci/probes/llamacpp_mtp_probe.py \
            --criteria amd_ci/criteria/llamacpp_multidevice.py \
            --out-dir "$AMD_CI_WORK/out/V4" \
            --title "V4 V2 vs V3, ROCm, GGML_CUDA_DEVICES=$VDEVS, -sm tensor" \
            -- --bin-dir "$ROCM_BIN" --gguf model.gguf --ctx-size "$CTX" \
               --env "GGML_CUDA_DEVICES=$VDEVS" \
               --extra-arg=-sm --extra-arg=tensor \
               --load-timeout 1800 --request-timeout 1800
          cat "$AMD_CI_WORK/out/V4/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/V4"

      - name: V5 - V2 vs V3 under tensor parallelism plus MTP
        if: always() && env.TENSOR_OK == '1'
        run: |
          set +e
          # MTP on multiple devices with a tensor split: @kostich's exact shape on
          # ggml-org/llama.cpp#24492. The V3 sidecar is handed to the V2 weights
          # too, so MTP engages on both states, and a criteria gate refuses the
          # cell outright if it never actually engaged.
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states_rev.json" \
            --probe amd_ci/probes/llamacpp_mtp_probe.py \
            --criteria amd_ci/criteria/llamacpp_multidevice.py \
            --out-dir "$AMD_CI_WORK/out/V5" \
            --title "V5 V2 vs V3, ROCm, GGML_CUDA_DEVICES=$VDEVS, -sm tensor, MTP" \
            -- --bin-dir "$ROCM_BIN" --gguf model.gguf --ctx-size "$CTX" \
               --env "GGML_CUDA_DEVICES=$VDEVS" \
               --spec-type draft-mtp --draft-model "$MTP_GGUF" \
               --extra-arg=-sm --extra-arg=tensor \
               --load-timeout 1800 --request-timeout 1800
          cat "$AMD_CI_WORK/out/V5/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/V5"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llamacpp-vdev2-gfx1151
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
