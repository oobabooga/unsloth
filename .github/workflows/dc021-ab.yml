name: DC-021 browser overlay A/B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BASE_SHA: 8435a749be1d15368f14d3b526234d9366451ff7
    steps:
      - name: Screen capture probe
        run: |
          sw_vers
          screencapture -x /tmp/probe.png && ls -la /tmp/probe.png
          system_profiler SPDisplaysDataType | grep -i resolution || true

      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: Clone upstream at main
        run: |
          git clone --filter=blob:none https://github.com/unslothai/unsloth.git repo
          git -C repo checkout --quiet "$BASE_SHA"
          git -C repo apply --check "$GITHUB_WORKSPACE/ci/fix.patch"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Unsloth Studio backend (--local, --no-torch)
        working-directory: repo
        run: |
          set -o pipefail
          ./install.sh --local --no-torch 2>&1 | tail -40

      - name: Build frontend dist and debug Tauri app
        run: |
          cd repo/studio/frontend
          npm ci --no-fund --no-audit
          npm run build
          cd ../src-tauri
          cargo build 2>&1 | tail -5

      - name: Add the CI-only harness
        run: |
          cp ci/dc021-harness.ts repo/studio/frontend/src/dc021-harness.ts
          echo 'import "./dc021-harness";' >> repo/studio/frontend/src/main.tsx

      - name: A/B runs
        run: |
          set -x
          swiftc -O ci/winid.swift -o winid
          python3 ci/helper.py "$GITHUB_WORKSPACE/shots/tmp" "$GITHUB_WORKSPACE/winid" > helper.log 2>&1 &
          STATE_DIR="$HOME/Library/Application Support/ai.unsloth.studio"
          run_side() {
            side=$1
            rm -rf "$GITHUB_WORKSPACE/shots/tmp"; mkdir -p "$GITHUB_WORKSPACE/shots/tmp"
            # The same window size on both sides, whatever the previous run saved.
            mkdir -p "$STATE_DIR"
            echo '{"main":{"width":1280,"height":800,"x":0,"y":0,"prev_x":0,"prev_y":0,"maximized":false,"visible":true,"decorated":true,"fullscreen":false}}' > "$STATE_DIR/.window-state.json"
            # The debug app embeds frontend/dist at compile time (custom-protocol is a default feature).
            (cd repo/studio/frontend && npm run build > "$GITHUB_WORKSPACE/vite-$side.log" 2>&1)
            (cd repo/studio/src-tauri && touch src/main.rs && cargo build 2>&1 | tail -3)
            ./repo/studio/src-tauri/target/debug/unsloth-studio > "$GITHUB_WORKSPACE/app-$side.log" 2>&1 &
            for i in $(seq 1 480); do [ -f "$GITHUB_WORKSPACE/shots/tmp/DONE" ] && break; sleep 1; done
            sleep 2
            mv "$GITHUB_WORKSPACE/shots/tmp" "$GITHUB_WORKSPACE/shots/$side"
            pkill -f target/debug/unsloth-studio || true
            pkill -f "vite" || true
            pkill -f "studio/backend/run.py|unsloth studio|api-only" || true
            sleep 5
          }
          run_side A-main
          git -C repo apply "$GITHUB_WORKSPACE/ci/fix.patch"
          git -C repo diff --stat
          run_side B-fix
          cat helper.log

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dc021-ab
          path: |
            shots/
            helper.log
            vite-*.log
            app-*.log
            ~/.unsloth/studio/tauri.log
