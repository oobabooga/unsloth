name: AMD vLLM probe 1

on:
  push:
    branches: [amd-vllm-k7q2xz-probe1]

permissions: {}

jobs:
  amd:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 75
    steps:
      - name: Hardware and ROCm
        run: |
          uname -a; cat /etc/os-release | head -3; ldd --version | head -1
          free -h; nproc
          cat /opt/rocm/.info/version 2>/dev/null || echo "no /opt/rocm/.info/version"
          ls -d /opt/rocm* 2>/dev/null || true
          which rocminfo hipconfig amd-smi rocm-smi 2>/dev/null || true
          rocminfo 2>/dev/null | grep -E 'Marketing Name:|gfx' | head -10 || true
          ldconfig -p | grep -E 'amdhip64|hsa-runtime|rocblas|hipblaslt' | head || true
          cat /etc/ld.so.conf.d/*rocm* 2>/dev/null || true
          ls -l /dev/kfd /dev/dri 2>/dev/null || true
          id
          df -h "$RUNNER_TEMP" / | cat
          env | grep -E 'HSA|HIP|ROCM|LD_' || true
      - name: Install vLLM ROCm wheels
        run: |
          set -euxo pipefail
          W="$RUNNER_TEMP/w"; mkdir -p "$W"/{tmp,hf,uvc}
          export TMPDIR="$W/tmp" UV_CACHE_DIR="$W/uvc"
          python3 -m venv "$W/boot"; "$W/boot/bin/pip" -q install uv
          UV="$W/boot/bin/uv"
          "$UV" venv --python 3.12 "$W/env"
          time "$UV" pip install --python "$W/env/bin/python" --index-url https://pypi.org/simple \
            --extra-index-url https://wheels.vllm.ai/rocm/0.30.0/rocm723 'vllm==0.30.0+rocm723' 2>&1 | tail -40
          du -sh "$W/env"
      - name: Torch smoke
        run: |
          W="$RUNNER_TEMP/w"; P="$W/env/bin/python"
          $P -c "import torch,sys; print(torch.__version__, torch.version.hip, torch.cuda.is_available(), torch.cuda.device_count()); print(torch.cuda.get_device_name(0)); print(torch.cuda.get_device_properties(0).gcnArchName); print(torch.cuda.mem_get_info()); a=torch.ones(1024,1024,device='cuda',dtype=torch.bfloat16); print((a@a).float().sum().item())" || echo "SMOKE FAILED rc=$?"
          L=$(ls "$W"/env/lib/python3.12/site-packages/torch/lib/libtorch_hip.so)
          ldd "$L" | grep -E 'amdhip|hsa|rocblas|hipblas|MIOpen|rocm|not found' | head -30
          readelf -d "$L" | grep -E 'RPATH|RUNPATH'
          ls "$W"/env/lib/python3.12/site-packages/torch/lib | head -60
      - name: vLLM serve
        run: |
          W="$RUNNER_TEMP/w"; P="$W/env/bin/python"
          export HF_HOME="$W/hf" TMPDIR="$W/tmp" VLLM_CACHE_ROOT="$W/vc"
          $P -c "import vllm, vllm.platforms as p; print(vllm.__version__, p.current_platform)" 2>&1 | tail -5
          $P -m vllm.entrypoints.openai.api_server --model Qwen/Qwen2.5-0.5B-Instruct --max-model-len 4096 \
             --gpu-memory-utilization 0.3 --host 127.0.0.1 --port 8011 > "$W/serve.log" 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 240); do
            if curl -sf http://127.0.0.1:8011/health >/dev/null; then ok=1; break; fi
            kill -0 $PID 2>/dev/null || break
            sleep 5
          done
          echo "healthy=$ok after $((i*5))s"
          if [ $ok = 1 ]; then
            curl -s http://127.0.0.1:8011/v1/chat/completions -H 'Content-Type: application/json' \
              -d '{"model":"Qwen/Qwen2.5-0.5B-Instruct","messages":[{"role":"user","content":"Say the capital of France in one word."}],"max_tokens":16,"temperature":0}'
            echo
          fi
          kill $PID 2>/dev/null; sleep 3
          tail -150 "$W/serve.log"
