name: "AMD CI: Gemma-4 26B-A4B diagnostics"

# Adapted from amd_ci/templates/workflow.yml (the ci_zoo1582 scaffold). One GPU job: the
# notebook's own install cell builds one venv; differential.py probes base (PyPI unsloth
# 2026.9.14 / unsloth_zoo 2026.9.9) then head (same venv + git unsloth@61afc99cd,
# unsloth-zoo@58d20ca8, --no-deps --force-reinstall), same job, same host.

on:
  push:
    branches: [amd-ci-g4nb-diag]
  workflow_dispatch:

permissions:
  contents: read

env:
  HEAD_UNSLOTH_SHA: "61afc99cd54a5650990cfc3e38f55451373519b0"
  HEAD_ZOO_SHA: "58d20ca844481e01face5264c82c7d5a4f04811f"

jobs:

  gpu:
    name: "Gemma-4 26B-A4B notebooks GPU measurement (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "g4nb-gpu"

      - name: Hardware gate (pre-venv)
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: States
        run: |
          set -euo pipefail
          mkdir -p "$AMD_CI_WORK/states/base" "$AMD_CI_WORK/states/head"
          python3 - "$AMD_CI_WORK" <<'PY'
          import json, os, sys
          w = sys.argv[1]
          doc = {"pr": 0, "merged": False,
                 "commits": {"base": "pypi-unsloth-2026.9.14+zoo-2026.9.9",
                             "head": "unsloth@" + os.environ["HEAD_UNSLOTH_SHA"][:9] + "+zoo@" + os.environ["HEAD_ZOO_SHA"][:8]},
                 "paths": {"base": w + "/states/base", "head": w + "/states/head"}}
          open(w + "/out/states.json", "w", encoding="utf-8").write(json.dumps(doc, indent=2))
          PY
          cat "$AMD_CI_WORK/out/states.json"

      - name: Environment (notebook install cell) and real gate
        timeout-minutes: 90
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP" | tail -1
          export UV_INSTALL_DIR="$AMD_CI_WORK/uvbin"
          curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh >/dev/null
          export PATH="$UV_INSTALL_DIR:$PATH"
          # The runners' /etc/uv/uv.toml adds a PyPI-mirror index that uv ranks ABOVE the notebook's
          # --index-url (run 37402692750: triton-rocm resolved to PyPI's cp310-only 3.0.0rc1). A clean
          # AMD Dev Cloud box has no such config: ignore config files so the notebook's flags hold.
          cat /etc/uv/uv.toml 2>/dev/null | tee "$AMD_CI_WORK/out/runner_uv_toml.txt" || true
          export UV_NO_CONFIG=1
          export UV_CACHE_DIR="$AMD_CI_WORK/uvcache"
          uv venv -q --seed --python 3.12 "$AMD_CI_WORK/venv"
          V="$AMD_CI_WORK/venv"
          export VIRTUAL_ENV="$V" PATH="$V/bin:$PATH"
          {
            echo "UV_NO_CONFIG=1"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "VIRTUAL_ENV=$V"
            echo "PATH=$V/bin:$UV_INSTALL_DIR:$PATH"
            echo "AMD_CI_PY=$V/bin/python"
            echo "HF_HOME=$AMD_CI_WORK/hf"
            echo "HF_XET_HIGH_PERFORMANCE=1"
            echo "UNSLOTH_DISABLE_AUTO_UPDATES=1"
          } >> "$GITHUB_ENV"
          set +e
          bash amd_ci/nb/install.sh 2>&1 | tail -40
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || { echo "FATAL: notebook install cell rc=$rc"; exit "$rc"; }
          # Harness-only: IPython for the Vision notebook's display() cell (a Jupyter kernel has it).
          uv pip install -q ipython
          {
            echo "rocm: $(cat /opt/rocm/.info/version 2>/dev/null || echo unknown)"
            uv pip list 2>/dev/null | grep -iE '^(torch|torchvision|triton|triton-rocm|pytorch-triton-rocm|bitsandbytes|peft|transformers|trl|unsloth|unsloth-zoo|unsloth_zoo|accelerate) ' || true
          } | tee "$AMD_CI_WORK/out/env_versions.txt"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"

      - name: Prefetch model
        timeout-minutes: 60
        run: |
          set +e
          set -uo pipefail
          # Run 37402927596: the runner's HF_ENDPOINT mirror proxy timed out (10 s default read
          # timeout) on the cold 26 GB shards. Try huggingface.co directly, then the mirror, with a
          # long timeout and resume; export the endpoint that worked to the notebook steps.
          echo "runner HF_ENDPOINT=${HF_ENDPOINT:-<unset>}" | tee "$AMD_CI_WORK/out/hf_endpoint.txt"
          MIRROR="${HF_ENDPOINT:-}"
          export HF_HUB_DOWNLOAD_TIMEOUT=300 HF_HUB_ETAG_TIMEOUT=60
          ok=""
          for ep in https://huggingface.co https://huggingface.co https://huggingface.co "$MIRROR" "$MIRROR"; do
            [ -n "$ep" ] || continue
            echo "== snapshot via $ep"
            HF_ENDPOINT="$ep" "$AMD_CI_PY" -c "from huggingface_hub import snapshot_download as s; print(s('unsloth/gemma-4-26B-A4B-it'))" 2>&1 | tail -5
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then ok="$ep"; break; fi
          done
          [ -n "$ok" ] || { echo "FATAL: model download failed on every endpoint"; exit 1; }
          echo "used HF_ENDPOINT=$ok" | tee -a "$AMD_CI_WORK/out/hf_endpoint.txt"
          { echo "HF_ENDPOINT=$ok"; echo "HF_HUB_DOWNLOAD_TIMEOUT=300"; echo "HF_HUB_ETAG_TIMEOUT=60"; } >> "$GITHUB_ENV"
          du -sh "$HF_HOME" || true
          df -h "$RUNNER_TEMP" | tail -1

      - name: Diagnostics
        timeout-minutes: 120
        run: |
          set +e
          O="$AMD_CI_WORK/out/diag"; mkdir -p "$O"; cd "$AMD_CI_WORK"
          unset CI
          export TORCHINDUCTOR_ERROR_ON_CUSTOM_OP_ALIASING=0
          P="$GITHUB_WORKSPACE/amd_ci/probes"
          run() {  # name, then env assignments
            n="$1"; shift
            mkdir -p "$AMD_CI_WORK/d_$n"
            ( cd "$AMD_CI_WORK/d_$n" && env "$@" UNSLOTH_COMPILE_LOCATION="$AMD_CI_WORK/d_$n/cc" timeout 1500 "$AMD_CI_PY" "$P/g4diag_model.py" "$O/model_$n.json" 32 > "$O/model_$n.log" 2>&1 )
            echo "== $n rc=$?"; tail -c 600 "$O/model_$n.json"; echo
          }
          timeout 600 "$AMD_CI_PY" "$P/g4diag_kernels.py" "$O/kernels.json" > "$O/kernels.log" 2>&1; echo "kernels rc=$?"; cat "$O/kernels.json"
          run base_default AMD_SERIALIZE_KERNEL=3
          run base_native UNSLOTH_MOE_BACKEND=native_torch AMD_SERIALIZE_KERNEL=3
          uv pip install --python "$AMD_CI_PY" --no-deps --force-reinstall --no-cache \
            "unsloth @ git+https://github.com/unslothai/unsloth@$HEAD_UNSLOTH_SHA" \
            "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo@$HEAD_ZOO_SHA" > "$O/head_install.log" 2>&1
          echo "head install rc=$?"
          run head_default AMD_SERIALIZE_KERNEL=3
          run head_routed_off UNSLOTH_MOE_ROUTED_KERNEL=0 AMD_SERIALIZE_KERNEL=3
          run head_native UNSLOTH_MOE_BACKEND=native_torch AMD_SERIALIZE_KERNEL=3
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4diag-gpu
          path: |
            ${{ env.AMD_CI_WORK }}/out
            !${{ env.AMD_CI_WORK }}/out/**/*.pt
          retention-days: 7
          if-no-files-found: warn
