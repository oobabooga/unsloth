name: "DevLab concurrency probe"

# How many jobs does the strix-halo pool actually run at once? Slot names
# suggest four, but only two have ever been observed overlapping, and capacity
# planning off an inference is how you end up queueing behind yourself.
#
# Four jobs holding a slot for five minutes each, with a heartbeat, so all four
# are provably resident at the same time rather than merely overlapping briefly.
# Nothing is downloaded, nothing is installed, no GPU work. Note this does
# occupy the entire pool for the duration.

on:
  push:
    branches: [amd-devlab-capacity]
  workflow_dispatch:

permissions: {}

jobs:
  slot:
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - name: Identify and hold
        run: |
          set -uo pipefail
          echo "job=${{ matrix.n }}"
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "host=$(hostname)"
          echo "runner_temp=$RUNNER_TEMP"
          echo "started=$(date -u +%H:%M:%S)"
          nproc; free -g | head -2
          # Five minutes, with a heartbeat so the overlap is visible in the
          # log itself and not only in the API timestamps.
          for i in $(seq 1 10); do
            sleep 30
            echo "job ${{ matrix.n }} alive at $(date -u +%H:%M:%S) (${i}/10)"
          done
          echo "ended=$(date -u +%H:%M:%S)"
