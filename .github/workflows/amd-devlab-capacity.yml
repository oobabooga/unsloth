name: "DevLab concurrency probe"

# How many jobs does the strix-halo pool actually run at once? Slot names
# suggest four, but only two have ever been observed overlapping, and capacity
# planning off an inference is how you end up queueing behind yourself.
#
# Six jobs, each recording when it started and stopped, then holding a slot for
# 45s so any overlap is unambiguous in the timestamps. Nothing is downloaded,
# nothing is installed, no GPU work: the cost is a few slot-seconds.

on:
  push:
    branches: [amd-devlab-capacity]
  workflow_dispatch:

permissions: {}

jobs:
  slot:
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Identify and hold
        run: |
          set -uo pipefail
          echo "job=${{ matrix.n }}"
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "host=$(hostname)"
          echo "runner_temp=$RUNNER_TEMP"
          echo "started=$(date -u +%H:%M:%S)"
          nproc; free -g | head -2
          # Long enough that genuinely parallel jobs must overlap.
          sleep 45
          echo "ended=$(date -u +%H:%M:%S)"
