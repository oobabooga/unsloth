name: "AMD CI: diffusion_bench amd_nov21_r1small on gfx1151 (Linux)"

# Generated by diffusion_bench/amd/gen_workflow.py. Measurement only: no secret is referenced, every model is a
# public download. Base = unsloth 8b7cde79ebf5; baseline UI v0.46.2.

on:
  push:
    branches: [amd-ci-nov21-r1smalle]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: "https://github.com/unslothai/unsloth"
  BASE_SHA: "8b7cde79ebf5a901b2fd936bbee214fb8c7562c7"
  BASELINE_REF: "v0.46.2"
  # the baseline UI's git URL: the repository variable when set, else resolved from its numeric GitHub id (baseline step)
  BASELINE_REPO: ${{ vars.BASELINE_REPO }}
  FA_SHA: "bbe25bacff9f337568b66e69950e549df9839068"

jobs:

  t0_trial:
    name: "Trial (trial__amd-gfx1151-linux-1) (gfx1151, exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    # The shared GPU group: one GPU measurement at a time across all branches.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "dbench-t0_trial"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Disk, memory, cores
        run: |
          set +e
          df -h "$RUNNER_TEMP"; free -g; nproc
          exit 0

      - name: Resolve states (base, and base + dbench_marker.patch)
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "$UPSTREAM" "$AMD_CI_WORK/repo"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/base" "$BASE_SHA"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/head" "$BASE_SHA"
          git -C "$AMD_CI_WORK/states/head" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/dbench_marker.patch"
          git -C "$AMD_CI_WORK/states/head" diff --cached --stat
          python3 "$GITHUB_WORKSPACE/diffusion_bench/amd/write_states.py" --work "$AMD_CI_WORK" \
            --base-sha "$BASE_SHA" --patch dbench_marker.patch --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"
          "$V/bin/python" -c "import torch, diffusers, transformers; print('studio torch', torch.__version__, 'hip', torch.version.hip, 'diffusers', diffusers.__version__, 'transformers', transformers.__version__)"

      - name: flash-attention (Triton AMD backend) into its own --target dir
        timeout-minutes: 30
        run: |
          set +e
          git clone -q https://github.com/Dao-AILab/flash-attention "$AMD_CI_WORK/src/flash-attention"
          git -C "$AMD_CI_WORK/src/flash-attention" checkout -q "$FA_SHA"
          "$AMD_CI_PY" -m pip --version > /dev/null 2>&1 || "$AMD_CI_PY" -m ensurepip -q
          "$AMD_CI_PY" -m pip install -q setuptools wheel packaging psutil ninja einops > "$AMD_CI_WORK/out/fa_deps.log" 2>&1
          cd "$AMD_CI_WORK/src/flash-attention"
          FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE "$AMD_CI_PY" -m pip install --no-build-isolation --no-deps \
            --target "$AMD_CI_WORK/fa_site" . > "$AMD_CI_WORK/out/fa_build.log" 2>&1
          echo "flash-attn --target rc=$?"
          cd "$AMD_CI_WORK"
          FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1 PYTHONPATH="$AMD_CI_WORK/fa_site" \
            "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/fa_smoke.py" --out "$AMD_CI_WORK/out/fa_smoke_studio.json"
          exit 0

      - name: Baseline UI ${{ env.BASELINE_REF }}, README ROCm venv + a venv on Studio's gfx1151 torch
        timeout-minutes: 60
        run: |
          set +e
          # no repository variable on the host fork: resolve the baseline UI's clone URL from its numeric GitHub id
          if [ -z "${BASELINE_REPO:-}" ]; then
            for i in 1 2 3 4 5; do
              BASELINE_REPO=$(python3 -c "import json, urllib.request as u; print(json.load(u.urlopen('https://api.github.com/repositories/589831718', timeout=30))['clone_url'])" 2>/dev/null)
              [ -n "$BASELINE_REPO" ] && break
              sleep 20
            done
            [ -n "$BASELINE_REPO" ] || { echo "FATAL: baseline repo id 589831718 did not resolve"; exit 3; }
            export BASELINE_REPO
            echo "BASELINE_REPO=$BASELINE_REPO" >> "$GITHUB_ENV"
          fi
          python3 "$GITHUB_WORKSPACE/diffusion_bench/baseline_src.py" --dir "$AMD_CI_WORK/baseline" \
            --ref "$BASELINE_REF" --commit-out "$AMD_CI_WORK/out/baseline_commit.txt"
          BASEPY=$("$AMD_CI_PY" -c "import sys; print(sys._base_executable)")
          TV=$("$AMD_CI_PY" -c "import torch; print(torch.__version__)")
          VV=$("$AMD_CI_PY" -c "import torchvision; print(torchvision.__version__)")
          for arm in default rock; do
            "$BASEPY" -m venv "$AMD_CI_WORK/baseline_venv_$arm"
            P="$AMD_CI_WORK/baseline_venv_$arm/bin/python"
            "$P" -m pip install -q --upgrade pip > /dev/null 2>&1
            if [ "$arm" = default ]; then
              PIP_CONFIG_FILE=/dev/null "$P" -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/rocm7.2 > "$AMD_CI_WORK/out/baseline_${arm}_torch.log" 2>&1
            else
              "$P" -m pip install --index-url https://repo.amd.com/rocm/whl/gfx1151/ "torch==$TV" "torchvision==$VV" torchaudio > "$AMD_CI_WORK/out/baseline_${arm}_torch.log" 2>&1
            fi
            echo "baseline $arm torch rc=$?"
            "$P" -m pip install -r "$AMD_CI_WORK/baseline/requirements.txt" psutil > "$AMD_CI_WORK/out/baseline_${arm}_reqs.log" 2>&1
            echo "baseline $arm requirements rc=$?"
            "$P" -c "import torch; print('baseline $arm torch', torch.__version__, 'hip', torch.version.hip, 'gpu', torch.cuda.is_available())"
          done
          echo "DIFFUSION_BENCH_BASELINE_PYTHON=$AMD_CI_WORK/baseline_venv_rock/bin/python" >> "$GITHUB_ENV"
          echo "DIFFUSION_BENCH_BASELINE_DIR=$AMD_CI_WORK/baseline" >> "$GITHUB_ENV"
          exit 0

      - name: Model files ({repo, file} refs in the spec, public downloads)
        timeout-minutes: 150
        run: |
          set -euo pipefail
          export HF_HOME="$AMD_CI_WORK/hf_home" HF_HUB_DISABLE_TELEMETRY=1
          "$AMD_CI_PY" -m pip install -q huggingface_hub > /dev/null 2>&1 || true
          # int8 ConvRot quantizer for the baseline's int8 builds: its repo by numeric GitHub id, at a pinned commit
          CT="$AMD_CI_WORK/src/convrot_tool"
          CR=""
          for i in 1 2 3; do
            CR=$(python3 -c "import json, urllib.request as u; print(json.load(u.urlopen('https://api.github.com/repositories/1213946756', timeout=30))['clone_url'])" 2>/dev/null || true)
            [ -n "$CR" ] && break
            sleep 15
          done
          if [ -z "$CR" ]; then  # API rate limit (runners share one address): derive it from the baseline repo's name
            CR=$(python3 -c "import os, re; n = os.environ.get('BASELINE_REPO', '').rstrip('/').removesuffix('.git').split('/')[-1]; w = re.sub('(?i)ui$', '', n); print(f'https://github.com/{w.capitalize()}-Org/{w.lower()}-model-tools' if w else '')" 2>/dev/null || true)
          fi
          if [ -n "$CR" ]; then
            { git init -q "$CT" && git -C "$CT" remote add origin "$CR"; } || true
            git -C "$CT" fetch -q --depth 1 origin d6797787e6bdb1a1fb0094d588a26f8e71a1c757 && git -C "$CT" checkout -q --detach FETCH_HEAD || true
          fi
          TOOLARG=()
          if [ "$(git -C "$CT" rev-parse HEAD 2>/dev/null)" = "d6797787e6bdb1a1fb0094d588a26f8e71a1c757" ] && [ -f "$CT/quant_int8_convrot.py" ]; then
            TOOLARG=(--convrot-tool "$CT/quant_int8_convrot.py"); echo "int8 quantizer at d6797787e6"
          else
            echo "WARN: int8 quantizer not fetched: baseline int8 builds will fail"
          fi
          "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/targets/fetch_files.py" --spec "$GITHUB_WORKSPACE/diffusion_bench/specs/plan_amd-gfx1151-linux-1.json" \
            --root "$AMD_CI_WORK/cm" --write "$GITHUB_WORKSPACE/diffusion_bench/specs/plan_amd-gfx1151-linux-1.json" "${TOOLARG[@]}"
          df -h "$RUNNER_TEMP"

      - name: Clean GPU pool preflight (fail loudly on a co-tenant)
        timeout-minutes: 35
        run: |
          set -euo pipefail
          "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/preflight_free.py" --min-free-gib 20 \
            --timeout-s 1800 --out "$AMD_CI_WORK/out/preflight.json"

      - name: "Differential (Trial (trial__amd-gfx1151-linux-1))"
        timeout-minutes: 165
        run: |
          set +e
          # harness invariants (gen_workflow.py): AOTriton opt-in on, CI unset, both asserted
          unset CI
          export TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
          [ "${TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL:-}" = 1 ] || { echo "FATAL: AOTriton opt-in missing"; exit 3; }
          [ -z "${CI+x}" ] || { echo "FATAL: CI is still set"; exit 3; }
          "$AMD_CI_PY" -c "import os, sys; ok = os.environ.get('TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL') == '1' and 'CI' not in os.environ; print('HARNESS_ENV', 'ok' if ok else 'BAD'); sys.exit(0 if ok else 3)" || exit 3
          export TORCH_HOME="$AMD_CI_WORK/torch_home"
          export HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe diffusion_bench/amd/diffusion_probe.py \
            --criteria diffusion_bench/amd/criteria_no_regression.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --spec diffusion_bench/specs/plan_amd-gfx1151-linux-1.json --budget-min 60 --cell-timeout 2400 --only trial__amd-gfx1151-linux-1 --only flux-3-klein_amd-gfx1151-linux__s_bf16__parity --only flux-3-klein_amd-gfx1151-linux__c_bf16__parity --state-only head=trial__amd-gfx1151-linux-1
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - name: Stop anything this job started (arms that never exited)
        if: always()
        run: |
          set +e
          # an unset / relative / root work dir would match every process: stop nothing then
          W="${AMD_CI_WORK:-}"
          case "$W" in /?*/?*) ;; *) echo "no usable AMD_CI_WORK root ('$W'): nothing to stop"; exit 0 ;; esac
          [ -d "$W" ] || { echo "AMD_CI_WORK $W is not a directory: nothing to stop"; exit 0; }
          W="${W%/}"
          for sig in TERM KILL; do
            for d in /proc/[0-9]*; do
              pid=${d#/proc/}
              [ "$pid" = "$$" ] && continue
              cwd=$(readlink "$d/cwd" 2>/dev/null)
              case "$cwd" in
                "$W"|"$W"/*) echo "$sig pid $pid (cwd $cwd)"; kill -$sig "$pid" 2>/dev/null ;;
              esac
            done
            sleep 5
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbench-t0_trial
          path: |
            ${{ env.AMD_CI_WORK }}/out
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/record.json
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.mp4
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/dbench/states/*/logs
          retention-days: 14
          if-no-files-found: warn

