          export TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
          [ "${TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL:-}" = 1 ] || { echo "FATAL: AOTriton opt-in missing"; exit 3; }
          [ -z "${CI+x}" ] || { echo "FATAL: CI is still set"; exit 3; }
          "$AMD_CI_PY" -c "import os, sys; ok = os.environ.get('TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL') == '1' and 'CI' not in os.environ; print('HARNESS_ENV', 'ok' if ok else 'BAD'); sys.exit(0 if ok else 3)" || exit 3
          export TORCH_HOME="$AMD_CI_WORK/torch_home"
          export HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe diffusion_bench/amd/diffusion_probe.py \
            --criteria diffusion_bench/amd/criteria_no_regression.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --spec diffusion_bench/specs/plan_amd-gfx1151-linux-1.json --budget-min 300 --cell-timeout 3600 --only flux-3-klein_amd-gfx1151-linux__s_bf16__parity_negctl --only flux-3-klein_amd-gfx1151-linux__s_bf16_notune__parity --only flux-3-klein_amd-gfx1151-linux__s_int8_auto__parity --only flux-3-klein_amd-gfx1151-linux__c_int8__parity --only flux-3-klein_amd-gfx1151-linux__s_bf16__k1p0 --only flux-3-klein_amd-gfx1151-linux__s_bf16_notune__k1p1 --only flux-3-klein_amd-gfx1151-linux__s_int8_auto__k1p2 --only flux-3-klein_amd-gfx1151-linux__c_bf16__k1p3 --only flux-3-klein_amd-gfx1151-linux__c_int8__k1p4 --only flux-3-klein_amd-gfx1151-linux__c_int8__k1p5 --only flux-3-klein_amd-gfx1151-linux__c_bf16__k1p6 --only flux-3-klein_amd-gfx1151-linux__s_int8_auto__k1p7 --only flux-3-klein_amd-gfx1151-linux__s_bf16_notune__k1p8 --only flux-3-klein_amd-gfx1151-linux__s_bf16__k1p9 --only flux-3-klein_amd-gfx1151-linux__s_bf16__k2p0 --only flux-3-klein_amd-gfx1151-linux__s_bf16_notune__k2p1 --only flux-3-klein_amd-gfx1151-linux__s_int8_auto__k2p2 --only flux-3-klein_amd-gfx1151-linux__c_bf16__k2p3 --only flux-3-klein_amd-gfx1151-linux__c_int8__k2p4 --only flux-3-klein_amd-gfx1151-linux__c_int8__k2p5 --only flux-3-klein_amd-gfx1151-linux__c_bf16__k2p6 --only flux-3-klein_amd-gfx1151-linux__s_int8_auto__k2p7 --only flux-3-klein_amd-gfx1151-linux__s_bf16_notune__k2p8 --only flux-3-klein_amd-gfx1151-linux__s_bf16__k2p9 --state-only head=flux-3-klein_amd-gfx1151-linux__s_bf16__parity
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - name: Stop anything this job started (arms that never exited)
        if: always()
        run: |
          set +e
          # an unset / relative / root work dir would match every process: stop nothing then
          W="${AMD_CI_WORK:-}"
          case "$W" in /?*/?*) ;; *) echo "no usable AMD_CI_WORK root ('$W'): nothing to stop"; exit 0 ;; esac
          [ -d "$W" ] || { echo "AMD_CI_WORK $W is not a directory: nothing to stop"; exit 0; }
          W="${W%/}"
          for sig in TERM KILL; do
            for d in /proc/[0-9]*; do
              pid=${d#/proc/}
              [ "$pid" = "$$" ] && continue
              cwd=$(readlink "$d/cwd" 2>/dev/null)
              case "$cwd" in
                "$W"|"$W"/*) echo "$sig pid $pid (cwd $cwd)"; kill -$sig "$pid" 2>/dev/null ;;
              esac
            done
            sleep 5
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbench-m1_cells
          path: |
            ${{ env.AMD_CI_WORK }}/out
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/record.json
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.mp4
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/dbench/states/*/logs
          retention-days: 14
          if-no-files-found: warn
