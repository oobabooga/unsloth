name: "AMD CI: llama.cpp pin-set change base vs head on gfx1151 (Linux ROCm, Windows HIP)"

# Kit in xplat/ (same as the GitHub-runner legs): prepare_states.py builds base = ggml-org tag + pins_base.diff
# and head = base + change.diff from public sources and checks both tree hashes against states.json;
# xplat_tests.py observes (test-backend-ops, test-llama-archs, tiny Inkling-2 perplexity per KV type);
# xplat_compare.py judges head against base from the same job on the same host.
# Correctness only (no timing): no GPU concurrency group, exclusive_gpu is a declared gap.

on:
  push:
    branches: [amd-ci-xplat386-kv]
  workflow_dispatch:

permissions:
  contents: read

env:
  ROCM_GFX: "gfx1151"

jobs:

  gpu:
    name: "HIP gfx1151 base vs head on Linux ROCm (shared GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "xplat386-gpu"

      - name: Host diagnostics
        run: |
          set +e
          uname -a
          nproc
          free -g
          ls -d /opt/rocm* || echo "no /opt/rocm"
          for b in hipconfig hipcc rocminfo amd-smi cmake ninja python3 git glslc vulkaninfo; do
            printf '%-10s %s\n' "$b" "$(command -v $b || echo MISSING)"
          done
          ls -l /dev/kfd /dev/dri || echo "no /dev/kfd or /dev/dri"
          python3 amd_ci/lib/gate.py --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: ROCm toolchain
        timeout-minutes: 45
        run: |
          set -eu
          V="$AMD_CI_WORK/venv"
          python3 -m venv "$V"
          "$V/bin/python" -m pip install -q --upgrade pip
          "$V/bin/python" -m pip install -q "cmake>=3.28" ninja
          ROOT=""
          if command -v hipconfig > /dev/null; then
            ROOT="$(hipconfig -R)"
            echo "using the host ROCm at $ROOT"
          else
            ok=0
            for idx in "https://rocm.nightlies.amd.com/v2/${ROCM_GFX}/" "https://repo.amd.com/rocm/whl/${ROCM_GFX}/"; do
              if "$V/bin/python" -m pip install -q --index-url "$idx" "rocm[libraries,devel]"; then
                ok=1
                echo "ROCm SDK wheels from $idx"
                break
              fi
            done
            if [ "$ok" != 1 ]; then
              echo "FATAL: no ROCm SDK on the host and the wheel install failed"
              exit 1
            fi
            ROOT="$("$V/bin/rocm-sdk" path --root)"
          fi
          if [ ! -x "$ROOT/bin/hipconfig" ] && [ ! -x "$ROOT/bin/hipcc" ]; then
            echo "FATAL: ROCm root $ROOT has no hipconfig/hipcc"
            exit 1
          fi
          CLANG="$ROOT/lib/llvm/bin/clang"
          if [ ! -x "$CLANG" ]; then
            CLANG="$(PATH="$ROOT/bin:$PATH" hipconfig -l)/clang"
          fi
          {
            echo "ROCM_ROOT=$ROOT"
            echo "HIP_PATH=$ROOT"
            echo "ROCM_PATH=$ROOT"
            echo "CMAKE_PREFIX_PATH=$ROOT"
            echo "HIPCXX=$CLANG"
            echo "PATH=$V/bin:$ROOT/bin:$PATH"
            echo "LD_LIBRARY_PATH=$ROOT/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          "$CLANG" --version

      - name: Hardware gate (fails, never skips)
        run: |
          set +e
          rocminfo > "$AMD_CI_WORK/out/rocminfo.txt" 2>&1
          rc=$?
          grep -m3 -E "Name: +gfx" "$AMD_CI_WORK/out/rocminfo.txt"
          if [ "$rc" -ne 0 ]; then
            echo "GATE FAILED: rocminfo exit $rc"
            exit 1
          fi
          if ! grep -q "$ROCM_GFX" "$AMD_CI_WORK/out/rocminfo.txt"; then
            echo "GATE FAILED: no $ROCM_GFX agent"
            exit 1
          fi
          echo "gate ok"

      - name: Prepare states
        run: |
          set -eu
          python3 "$GITHUB_WORKSPACE/xplat/prepare_states.py" --kit "$GITHUB_WORKSPACE/xplat" --root "$AMD_CI_WORK"

      - name: Build base and head (ggml-hip gfx1151)
        timeout-minutes: 150
        run: |
          set +e
          fail=0
          for s in base head; do
            d="$AMD_CI_WORK/src/$s"
            cmake -S "$d" -B "$d/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DGGML_HIP=ON -DGPU_TARGETS="$ROCM_GFX" -DAMDGPU_TARGETS="$ROCM_GFX" \
              -DLLAMA_BUILD_TESTS=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF > "$AMD_CI_WORK/out/cmake_$s.log" 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "cmake failed for $s (rc $rc)"
              tail -40 "$AMD_CI_WORK/out/cmake_$s.log"
              echo "BUILD_RC_$s=cmake$rc" >> "$GITHUB_ENV"
              fail=1
              continue
            fi
            start=$(date +%s)
            cmake --build "$d/build" -j "$(nproc)" --target test-backend-ops test-llama-archs llama-perplexity > "$AMD_CI_WORK/out/build_$s.log" 2>&1
            rc=$?
            echo "$s build rc=$rc in $(( $(date +%s) - start )) s"
            echo "BUILD_RC_$s=$rc" >> "$GITHUB_ENV"
            if [ "$rc" -ne 0 ]; then
              grep -n -B2 -A12 -E "error:" "$AMD_CI_WORK/out/build_$s.log" | head -120
              fail=1
            fi
          done
          echo "fattn-banded diagnostics on head: $(grep -c -E 'fattn-banded\.cu:[0-9]+:[0-9]+: (warning|error)' "$AMD_CI_WORK/out/build_head.log")"
          grep -n -E "fattn-banded\.cu:[0-9]+:[0-9]+: (warning|error)" "$AMD_CI_WORK/out/build_head.log" | head -20
          exit "$fail"

      - name: Tests base and head
        if: always()
        timeout-minutes: 150
        run: |
          set +e
          for s in base head; do
            python3 "$GITHUB_WORKSPACE/xplat/xplat_tests.py" --bin "$AMD_CI_WORK/src/$s/build/bin" --state "$s" \
              --out "$AMD_CI_WORK/out/xplat" --ngl 99 --tbo-backend ROCm0 \
              --models "$GITHUB_WORKSPACE/xplat/inkling2-hd128-s42.gguf" --timeout 3600
          done
          python3 "$GITHUB_WORKSPACE/xplat/xplat_compare.py" --out "$AMD_CI_WORK/out/xplat" --leg linux-hip \
            --build-rc "base=${BUILD_RC_base:-missing},head=${BUILD_RC_head:-missing}" --expect-banded yes --expect-quant-banded yes
          rc=$?
          cat "$AMD_CI_WORK/out/xplat/VERDICT_linux-hip.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Free the work tree (keep only out/)
        if: always()
        run: |
          set +e
          du -sh "$AMD_CI_WORK" 2>/dev/null
          rm -rf "${AMD_CI_WORK:?}/src" "${AMD_CI_WORK:?}/venv"
          du -sh "$AMD_CI_WORK" 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xplat386-linux-hip
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  linux-control:
    name: "linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: same selector with Linux in place of Windows; machine: $(uname -n)"

  windows:
    name: "HIP gfx1151 base vs head on Windows"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "xplat386-windows"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host diagnostics
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_OS=[$env:RUNNER_OS] machine=$env:COMPUTERNAME"
          Write-Host "HIP_PATH=[$env:HIP_PATH] VULKAN_SDK=[$env:VULKAN_SDK]"
          foreach ($b in @("git", "cmake", "ninja", "cl", "link", "clang", "hipcc", "amd-smi", "glslc", "vulkaninfo")) {
            $c = Get-Command $b -ErrorAction SilentlyContinue
            if ($c) { Write-Host ("{0,-10} {1}" -f $b, $c.Source) } else { Write-Host ("{0,-10} MISSING" -f $b) }
          }
          Get-CimInstance Win32_VideoController | ForEach-Object { Write-Host "GPU: $($_.Name) driver $($_.DriverVersion)" }
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch --require windows --out "$env:AMD_CI_WORK\out\host.json"

      - name: Toolchain (HIP SDK or ROCm wheels, MSVC environment)
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = "Continue"
          $V = "$env:AMD_CI_WORK\venv"
          & $env:AMD_CI_PY -m venv $V
          & "$V\Scripts\python.exe" -m pip install -q --upgrade pip
          & "$V\Scripts\python.exe" -m pip install -q "cmake>=3.28" ninja
          $root = $null
          if ($env:HIP_PATH -and (Test-Path -LiteralPath "$env:HIP_PATH\bin\clang.exe")) {
            $root = $env:HIP_PATH.TrimEnd("\")
            Write-Host "using the installed HIP SDK at $root"
          } else {
            foreach ($idx in @("https://rocm.nightlies.amd.com/v2/$env:ROCM_GFX/", "https://repo.amd.com/rocm/whl/$env:ROCM_GFX/")) {
              & "$V\Scripts\python.exe" -m pip install -q --index-url $idx "rocm[libraries,devel]"
              if ($LASTEXITCODE -eq 0) { Write-Host "ROCm SDK wheels from $idx"; break }
            }
            $root = (& "$V\Scripts\rocm-sdk.exe" path --root | Select-Object -Last 1)
            if ($root) { $root = $root.Trim() }
          }
          if (-not $root) { Write-Host "FATAL: no HIP SDK and no ROCm wheels"; exit 1 }
          $clang = $null
          foreach ($c in @("$root\lib\llvm\bin\clang.exe", "$root\bin\clang.exe")) { if (Test-Path -LiteralPath $c) { $clang = $c; break } }
          if (-not $clang) { Write-Host "FATAL: no clang.exe under $root"; exit 1 }
          & $clang --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = $null
          if (Test-Path -LiteralPath $vswhere) { $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) }
          if (-not $vs) { Write-Host "FATAL: no Visual Studio C++ build tools on this box"; exit 1 }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          Write-Host "MSVC environment from $vcvars"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match "^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|UCRTVersion|WindowsSDKVersion)=(.*)$") {
              $val = $matches[2]
              if ($matches[1] -eq "PATH") { $val = "$V\Scripts;$root\bin;$root\lib\llvm\bin;$val" }
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$val" -Encoding ascii
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "HIP_PATH=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "ROCM_ROOT=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "HIPCXX=$clang"
          Add-Content -Path $env:GITHUB_ENV -Value "CLANG_EXE=$clang"

      - name: Prepare states
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\xplat\prepare_states.py" --kit "$env:GITHUB_WORKSPACE\xplat" --root "$env:AMD_CI_WORK"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build base and head (ggml-hip gfx1151)
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = "Continue"
          $fail = 0
          $clangxx = $env:CLANG_EXE -replace "clang\.exe$", "clang++.exe"
          foreach ($s in @("base", "head")) {
            $src = "$env:AMD_CI_WORK\src\$s"
            cmake -S $src -B "$src\build" -G Ninja -DCMAKE_BUILD_TYPE=Release `
              -DGGML_HIP=ON -DGPU_TARGETS="$env:ROCM_GFX" -DAMDGPU_TARGETS="$env:ROCM_GFX" `
              -DCMAKE_C_COMPILER="$env:CLANG_EXE" -DCMAKE_CXX_COMPILER="$clangxx" `
              -DLLAMA_BUILD_TESTS=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF *> "$env:AMD_CI_WORK\out\cmake_${s}_windows.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "$env:AMD_CI_WORK\out\cmake_${s}_windows.log" -Tail 60; Add-Content -Path $env:GITHUB_ENV -Value "BUILD_RC_$s=cmake" -Encoding ascii; $fail = 1; continue }
            $t0 = Get-Date
            cmake --build "$src\build" -j $env:NUMBER_OF_PROCESSORS --target test-backend-ops test-llama-archs llama-perplexity *> "$env:AMD_CI_WORK\out\build_${s}_windows.log"
            $rc = $LASTEXITCODE
            Write-Host "$s build rc=$rc in $([int]((Get-Date) - $t0).TotalSeconds) s"
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_RC_$s=$rc" -Encoding ascii
            if ($rc -ne 0) { Select-String -Path "$env:AMD_CI_WORK\out\build_${s}_windows.log" -Pattern "error" | Select-Object -First 60 | ForEach-Object { Write-Host $_.Line }; $fail = 1 }
          }
          exit $fail

      - name: Tests base and head
        if: always()
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = "Continue"
          $env:PATH = "$env:ROCM_ROOT\bin;$env:PATH"
          foreach ($s in @("base", "head")) {
            $bin = "$env:AMD_CI_WORK\src\$s\build\bin"
            $env:PATH = "$bin;$env:PATH"
            & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\xplat\xplat_tests.py" --bin $bin --state $s `
              --out "$env:AMD_CI_WORK\out\xplat" --ngl 99 --tbo-backend ROCm0 `
              --models "$env:GITHUB_WORKSPACE\xplat\inkling2-hd128-s42.gguf" --timeout 3600
          }
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\xplat\xplat_compare.py" --out "$env:AMD_CI_WORK\out\xplat" --leg windows-hip `
            --build-rc "base=$env:BUILD_RC_base,head=$env:BUILD_RC_head" --expect-banded yes --expect-quant-banded yes
          $rc = $LASTEXITCODE
          Get-Content "$env:AMD_CI_WORK\out\xplat\VERDICT_windows-hip.md" -Encoding utf8 | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $rc

      - name: Free the work tree (keep only out/)
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          Remove-Item -Recurse -Force "$env:AMD_CI_WORK\src", "$env:AMD_CI_WORK\venv" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xplat386-windows-hip
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
