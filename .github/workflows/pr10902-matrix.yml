name: PR 10902 policy differential

on:
  push:
    branches: [pr10902-studio-matrix]

permissions:
  contents: read

env:
  BASE_SHA: 5c04ec19305ecb5f0153c5b4d806a9d7e6e4422d
  HEAD_SHA: 90faa93706643f214cd3f3e5f6f500982c8dad31

jobs:
  native:
    name: "${{ matrix.os }} py${{ matrix.py }} pip ${{ matrix.pips }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, py: "3.13", pips: "26.2.1,23.3.2" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Tools
        shell: bash
        run: |
          python -m pip install -q uv
          uv --version
          python -c "import platform,sys; print(platform.platform(), platform.machine(), sys.version)"
      - name: Base vs head differential
        shell: bash
        run: python harness/run.py "$BASE_SHA" "$HEAD_SHA" "${{ matrix.pips }}"
      - name: PR test files at head
        if: always()
        shell: bash
        run: |
          python -m pip install -q pytest
          cd "$RUNNER_TEMP/pr10902/head"
          python -m pytest -q -p no:cacheprovider tests/python/test_install_python_stack.py tests/python/test_cross_platform_parity.py tests/studio/test_xpu_triton_swap.py 2>&1 | tail -15
