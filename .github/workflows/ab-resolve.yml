name: "A/B resolve (ab-pincheck-d)"

# Atomic daily build for unslothai/llama.cpp. One cron, one workflow run, one
# release per upstream b#### tag. Splits the heavy build work into seven reusable
# children:
#   unsloth-prebuilt-cuda.yml              -- Linux CUDA bundles (x64 + arm64, matrix profiles)
#   unsloth-prebuilt-cuda-windows.yml      -- CUDA Windows bundles (x64, matrix profiles)
#   unsloth-prebuilt-cuda-windows-arm64.yml -- CUDA Windows bundle (arm64, cross-compiled)
#   unsloth-prebuilt-rocm.yml              -- ROCm bundles (Windows + Ubuntu, per gfx target)
#   unsloth-prebuilt-macos.yml             -- macOS bundles (arm64 Metal + x64 CPU)
#   unsloth-prebuilt-cpu.yml               -- CPU-only bundles (Linux + Windows, x64 + arm64)
#   unsloth-prebuilt-vulkan.yml            -- Vulkan bundles (Linux x64/arm64 + Windows x64/arm64)
#
# Atomicity: the `assemble` job depends on all children. GitHub's default
# `needs` semantics require all needs to succeed -- if any matrix entry in
# any child fails, `assemble` skips and no release is published. The
# installer needs the full bundle set at the same tag or it'll dispatch to
# something that isn't there.
#
# Mix builds: scripts/unsloth/pr-set.json can list ggml-org/llama.cpp or
# unslothai/llama.cpp PRs (each pinned to an exact commit) to merge into the
# build. `resolve` merges the open ones onto the base tag and uploads the
# merged tree as a workflow artifact that the children extract instead of
# cloning; the release is tagged b####-mix-<hash>. Empty list = vanilla
# upstream build.

on:
  push:
    branches: [ab-pincheck-d]

permissions:
  contents: write

env:
  # Supply-chain aging: when resolving "latest", only build an upstream release
  # that has been public for at least this many hours, so a malicious or broken
  # release has time to be caught and yanked before we compile and ship it. An
  # explicit b#### tag (manual run) skips it. Per-run override via min_age_hours.
  UNSLOTH_LLAMA_MIN_RELEASE_AGE_HOURS: "6"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || 'scheduled' }}
  # A nightly still in flight when the next one starts is stuck, not busy: a
  # healthy run finishes in a couple of hours. Leaving this false lets one
  # wedged run block every following nightly with nothing to show for it.
  # Only the schedule supersedes; a manual dispatch never kills a live nightly.
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-24.04
    # Read-only: resolve merges third-party PR content but pushes nothing;
    # only assemble needs the workflow-level contents:write (publish).
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      repo: ${{ steps.m.outputs.repo }}
      base: ${{ steps.m.outputs.base }}
      prs: ${{ steps.m.outputs.prs }}
      source_artifact: ${{ steps.m.outputs.source_artifact }}
      commit: ${{ steps.m.outputs.commit }}
      ggml_tree: ${{ steps.m.outputs.ggml_tree }}
      ggml_version: ${{ steps.m.outputs.ggml_version }}
      exists: ${{ steps.m.outputs.exists }}
      # The CUDA matrices pass through the `warm` step, which stamps `shards`.
      cuda_matrix: ${{ steps.warm.outputs.cuda_matrix }}
      win_cuda_matrix: ${{ steps.warm.outputs.win_cuda_matrix }}
      cuda_warm_matrix: ${{ steps.warm.outputs.cuda_warm_matrix }}
      win_cuda_warm_matrix: ${{ steps.warm.outputs.win_cuda_warm_matrix }}
      rocm_matrix: ${{ steps.m.outputs.rocm_matrix }}
      rocm_win_matrix: ${{ steps.m.outputs.rocm_win_matrix }}
      rocm_cutoff: ${{ steps.m.outputs.rocm_cutoff }}
      macos_matrix: ${{ steps.m.outputs.macos_matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Shallow by default (only pr-set.json is needed); a mix build unshallows
      # in-place to merge the PRs.
      - name: Checkout (pr-set.json + mix merge workspace)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - id: r
        run: |
          set -euo pipefail

          # This one step resolves the tag, fetches the base, merges every pinned
          # PR and bakes build-info. 5 of the 12 failures in the 19 runs before
          # 09-18 died somewhere inside it and could not be attributed afterwards,
          # because GitHub serves 410 for run and job logs after a few days. PHASE
          # names the section and the trap copies it, the line and the failing
          # command into the run summary, which survives log expiry.
          PHASE='startup'
          on_err() {
            local rc=$? line=$1
            {
              echo "### Resolve failed"
              echo
              echo "| field | value |"
              echo "|---|---|"
              echo "| phase | \`${PHASE}\` |"
              echo "| line | ${line} |"
              echo "| command | \`${BASH_COMMAND}\` |"
              echo "| exit | ${rc} |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "resolve failed in phase '${PHASE}' at line ${line}: ${BASH_COMMAND} (exit ${rc})" >&2
          }
          trap 'on_err $LINENO' ERR

          PHASE='read inputs'
          REQ='${{ github.event.inputs.tag || 'latest' }}'
          ONLY='${{ github.event.inputs.only_profile || 'all' }}'
          GFX_DEFAULT='gfx1151,gfx1150,gfx120X,gfx110X,gfx103X,gfx90a,gfx908'
          GFX='${{ github.event.inputs.gfx_target }}'; GFX="${GFX:-$GFX_DEFAULT}"
          OS_LIST='${{ github.event.inputs.operating_systems || 'windows,ubuntu' }}'
          AGE_H='${{ github.event.inputs.min_age_hours }}'

          # publish does delete-then-create on the whole release, and the installer
          # treats the published manifest as the authoritative bundle set: a partial
          # build drops bundles and silently downgrades uncovered hosts to slow
          # source builds. Refuse to publish unless the full default set is built;
          # publish=false test runs may use subsets.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            [ "$ONLY" = "all" ] || { echo "refusing to publish only_profile=$ONLY: a partial CUDA set clobbers manifest coverage. Use only_profile=all to publish, or publish=false for an artifact-only test." >&2; exit 1; }
            [ "$GFX" = "$GFX_DEFAULT" ] || { echo "refusing to publish gfx_target='$GFX': publish requires the full default set ($GFX_DEFAULT); use publish=false for a subset test." >&2; exit 1; }
            case "$OS_LIST" in
              *windows*ubuntu*|*ubuntu*windows*) : ;;
              *) echo "refusing to publish operating_systems='$OS_LIST': both windows and ubuntu ROCm bundles are required. Use publish=false for a subset test." >&2; exit 1 ;;
            esac
          fi
          [ -n "$AGE_H" ] || AGE_H="${UNSLOTH_LLAMA_MIN_RELEASE_AGE_HOURS:-6}"
          if [ "$REQ" = "latest" ]; then
            # Newest published b#### build release that has been public for
            # >= AGE_H hours -- the supply-chain aging window. GitHub does not
            # guarantee the list order, so pick the max by published_at
            # explicitly rather than trusting `first`.
            # Select on the tag shape, not on prerelease: since 08-21 upstream
            # marks the b#### builds prerelease and keeps that flag clear only
            # for the semver v#.#.# releases, which are not what we build.
            CUTOFF="$(date -u -d "-${AGE_H} hours" +%s)"
            BASE="$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=100' \
              | jq -r --argjson cutoff "$CUTOFF" '[.[] | select(.draft==false) | select(.tag_name|test("^b[0-9]+$")) | select((.published_at|fromdateiso8601) <= $cutoff)] | max_by(.published_at|fromdateiso8601) | .tag_name')"
            if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
              echo "refusing: no ggml-org b#### release older than ${AGE_H}h in the last 100 releases" >&2
              exit 1
            fi
            echo "selected $BASE (aged >= ${AGE_H}h)"
          else
            BASE="$REQ"   # explicit b#### override skips the aging filter
          fi
          printf '%s' "$BASE" | grep -qE '^b[0-9]+$' || { echo "refusing non-release tag '$BASE'" >&2; exit 1; }

          # Resolve the PR mix set (scripts/unsloth/pr-set.json): PR commit
          # urls from ggml-org/llama.cpp or unslothai/llama.cpp (no other
          # repos). Pins are mandatory -- only an exact, reviewed commit
          # is ever built, so a PR author pushing more commits cannot change
          # what the nightly ships. Non-open PRs are still merged in -- upstream
          # tags lag merges, so dropping a pin on merge leaves the arch in
          # neither the base nor the mix; see the state gate below and the
          # pr-set.json _doc. unsloth-pr-set-lint.yml runs the same checks on every
          # push that edits the file, but that is only a tripwire -- a red
          # lint does not stop the schedule, so the gate must live here.
          # An entry is a bare url string (required) or {"url", "required": false}.
          # Bare strings stay valid, so the file needs no migration.
          jq -e '.prs | type == "array" and all(.[];
                   type == "string"
                   or (type == "object" and (.url | type == "string")
                       and ((if .required == null then true else .required end) | type == "boolean")))' \
             scripts/unsloth/pr-set.json >/dev/null \
            || { echo "scripts/unsloth/pr-set.json: .prs must be an array of PR url strings, or {url, required} objects" >&2; exit 1; }
          PHASE='parse pr-set.json'
          PRS='[]'
          URL_RE='^https://github\.com/(ggml-org|unslothai)/llama\.cpp/pull/([0-9]+)/commits/([0-9a-f]{40})/?$'
          while read -r url REQUIRED; do
            [[ "$url" =~ $URL_RE ]] || { echo "refusing malformed PR url '$url' (expected https://github.com/{ggml-org,unslothai}/llama.cpp/pull/<n>/commits/<40-hex-sha>)" >&2; exit 1; }
            SRC="${BASH_REMATCH[1]}/llama.cpp"; NUM="${BASH_REMATCH[2]}"; SHA="${BASH_REMATCH[3]}"
            # Abort naming the entry on a gh failure (typo'd numbers 404).
            # Title can contain spaces, so it can't ride a space-delimited
            # read -- pull each field out on its own.
            PR_JSON="$(gh api "repos/${SRC}/pulls/${NUM}")" \
              || { echo "refusing ${SRC}#${NUM}: could not fetch PR metadata (nonexistent PR number in '$url', or a transient API failure); fix the pin in scripts/unsloth/pr-set.json or retry" >&2; exit 1; }
            STATE="$(jq -r '.state' <<<"$PR_JSON")"
            HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
            N_COMMITS="$(jq -r '.commits' <<<"$PR_JSON")"
            TITLE="$(jq -r '.title' <<<"$PR_JSON")"
            MERGED_AT="$(jq -r '.merged_at // ""' <<<"$PR_JSON")"
            if [ "$STATE" != "open" ]; then
              # Merging upstream does NOT put an arch in the build: upstream tags
              # lag their merges, and BASE is then aged a further
              # UNSLOTH_LLAMA_MIN_RELEASE_AGE_HOURS on top of that. 26841 merged
              # at 11:07 with the newest tag cut at 07:53, so dropping the pin on
              # merge left the arch in neither the base nor the mix, and repinning
              # was impossible because the old gate refused a non-open pin. So a
              # non-open pin keeps being merged: once BASE contains the commit the
              # merge is an empty no-op, and the pin can be deleted at leisure.
              # "required": false keeps the old rot-away behaviour for an entry
              # that should disappear the moment it stops being open.
              if [ "$REQUIRED" = "false" ]; then
                echo "::warning::skipping optional pin ${SRC}#${NUM} (${STATE}): $url"
                continue
              fi
              if [ -n "$MERGED_AT" ]; then
                echo "::warning::${SRC}#${NUM} merged upstream at ${MERGED_AT}; still mixing its pinned commit until a base tag contains it"
              else
                # Closed unmerged means upstream declined it. Nothing stops it
                # shipping now, so the warning is the only signal -- drop the pin
                # once you have decided you do not want that code.
                echo "::warning::${SRC}#${NUM} is closed without being merged (upstream declined it); still mixing its pinned commit because the entry is required"
              fi
            fi
            # A pin pasted from the wrong PR would build arbitrary code while
            # the manifest blames PR #<num>; require the pinned commit to be
            # a commit of that PR. The commits listing is capped at 250 by
            # the API; past that, skip rather than false-fail. Capture first:
            # under pipefail, grep -q quitting early SIGPIPEs a paginating gh.
            if [ "$N_COMMITS" -gt 250 ]; then
              echo "note: ${SRC}#${NUM} has ${N_COMMITS} commits (over the API listing cap); skipping pin membership check"
            else
              PR_SHAS="$(gh api "repos/${SRC}/pulls/${NUM}/commits" --paginate --jq '.[].sha')" \
                || { echo "refusing ${SRC}#${NUM}: could not list the PR's commits (transient API failure?); retry" >&2; exit 1; }
              if ! grep -qx "$SHA" <<<"$PR_SHAS"; then
                echo "refusing ${SRC}#${NUM}: pinned commit ${SHA} is not a commit of that PR (wrong paste, or force-pushed away); fix the pin in scripts/unsloth/pr-set.json" >&2
                exit 1
              fi
            fi
            [ "$SHA" = "$HEAD" ] || echo "note: ${SRC}#${NUM} is pinned to ${SHA} but its head has moved to ${HEAD}"
            echo "including ${SRC}#${NUM} @ ${SHA}"
            PRS="$(jq -c --arg r "$SRC" --arg n "$NUM" --arg s "$SHA" --arg u "$url" --arg t "$TITLE" '. + [{repo: $r, number: ($n|tonumber), sha: $s, url: $u, title: $t}]' <<<"$PRS")"
          done < <(jq -r '.prs[] | if type == "string" then {url: ., required: true} else . end
                          | "\(.url)\t\(if .required == null then true else .required end)"' scripts/unsloth/pr-set.json | tr '\t' ' ')

          # Decide the tag and source repo first; the source tree is built
          # further down, only if this release isn't already published.
          if [ "$(jq length <<<"$PRS")" = 0 ]; then
            # Plain build: pristine upstream base, no merge. REPO stays the real
            # upstream repo even though we ship our own stamped tarball.
            TAG="$BASE"
            REPO='ggml-org/llama.cpp'
          else
            # The synthetic tag embeds a hash of the pinned repo#number:sha
            # triples in listed order (merge order can matter for conflicts), so
            # a pin update or a reorder yields a new tag and build, while the
            # "exists" check below still skips rebuilding an already-published
            # set. The repo is part of the key so PR #n in the two repos can't
            # hash to the same set. The merged tree exists only as this repo's
            # release assets, never upstream.
            SETHASH="$(jq -r 'map("\(.repo)#\(.number):\(.sha)") | join("\n")' <<<"$PRS" | sha256sum | cut -c1-7)"
            TAG="${BASE}-mix-${SETHASH}"
            REPO="$GITHUB_REPOSITORY"
          fi
          PHASE='check for an existing release'
          SRC_ARTIFACT="app-source-${TAG}"
          COMMIT=""
          GGML_TREE=""
          GGML_VERSION=""

          # Only PUBLISHED releases count as "exists"; a leftover draft (from
          # a failed prior publish) should not block today's rebuild.
          EXISTS=false
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = "false" ]; then
            EXISTS=true
          fi

          # Build the source tree every child compiles, ONCE, here -- but only
          # when something will actually be built. On a scheduled no-op (the aged
          # "latest" was already published) skip the whole checkout/merge/tar +
          # upload; a manual dispatch always rebuilds. Check out the upstream base,
          # merge any pinned PRs (mix builds), then bake the build number/commit
          # and the Unsloth fingerprint into cmake/build-info.cmake. The
          # result is uploaded as the app-source-* artifact every child extracts --
          # one identical tree everywhere, no child clones, fingerprint patch in one
          # place. Nothing is pushed (GITHUB_TOKEN may never push commits touching
          # .github/workflows, which upstream history routinely does).
          if [ "$EXISTS" != "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PHASE='fetch base + merge pins'
            git remote add upstream https://github.com/ggml-org/llama.cpp.git
            # The upstream checkout below takes scripts/unsloth/ away. Copy the
            # whole dir out, not file by file: see the note above the step.
            cp -r scripts/unsloth "${RUNNER_TEMP}/us"
            ADDITIVE_MERGE="${RUNNER_TEMP}/us/additive_merge.py"
            if [ "$(jq length <<<"$PRS")" != 0 ]; then
              # Merges need a merge-base, so unshallow first.
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                git fetch -q --unshallow --no-tags origin
              fi
              git fetch -q --no-tags upstream "refs/tags/${BASE}:refs/tags/${BASE}"
              git checkout -q --detach "refs/tags/${BASE}"
              # Each pin is fetched from the repo its PR lives in (repo/number/
              # sha are machine fields, so the space-delimited read is safe;
              # titles stay out of this loop).
              while read -r SRC NUM SHA; do
                # The PR's own repo first, then our refs/pins mirror, which is
                # the only copy left once an author force-pushes the reviewed
                # commit out of the PR. That is what took the nightly down on
                # 07-31, and it is unrecoverable without a ref of our own.
                git fetch -q --no-tags "https://github.com/${SRC}.git" "$SHA" 2>/dev/null \
                  || git fetch -q --no-tags origin "refs/pins/${SHA}" 2>/dev/null \
                  || { echo "could not fetch commit ${SHA} for ${SRC}#${NUM}; it is gone from ${SRC} and was never mirrored to refs/pins -- update or remove the pin in scripts/unsloth/pr-set.json" >&2; exit 1; }
                if ! git rev-parse --verify -q "${SHA}^{commit}" >/dev/null; then
                  echo "fetched something for ${SRC}#${NUM} but ${SHA} is still missing" >&2; exit 1
                fi
                # diff3 so additive_merge.py can see the merge base and refuse
                # anything that is not a pure add/add.
                if ! git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                       -c merge.conflictStyle=diff3 \
                       merge --no-ff --no-edit -m "Merge ${SRC}#${NUM} @ ${SHA}" "$SHA"; then
                  # The recurring conflict is two PRs adding a line to the same
                  # architecture table, where the answer is always "keep both".
                  # additive_merge.py resolves only that, and refuses when
                  # either side edited existing text, so a real disagreement
                  # still hard-fails here rather than being papered over.
                  if python3 "$ADDITIVE_MERGE" \
                       && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                    git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      commit -q --no-edit
                    echo "::warning::${SRC}#${NUM} needed an additive merge; every conflict was a pure add/add and both sides were kept"
                  else
                    git merge --abort 2>/dev/null
                    echo "- pin \`${SRC}#${NUM}\` (\`${SHA}\`) does not merge onto \`${BASE}\` + the pins before it" >> "$GITHUB_STEP_SUMMARY"
                    echo "${SRC}#${NUM} (${SHA}) does not merge cleanly onto ${BASE} + the PRs listed before it; reorder or drop it in scripts/unsloth/pr-set.json" >&2; exit 1
                  fi
                fi
              done < <(jq -r '.[] | "\(.repo) \(.number) \(.sha)"' <<<"$PRS")
              echo "MERGED_PINS=1" >> "$GITHUB_ENV"
            else
              # Plain build: only the base tree is needed. Shallow is fine -- the
              # build number is baked below, so no git history is needed at build time.
              git fetch -q --depth 1 --no-tags upstream "refs/tags/${BASE}:refs/tags/${BASE}"
              git checkout -q --detach "refs/tags/${BASE}"
            fi
            COMMIT="$(git rev-parse HEAD)"
            # ABI key for anything compiled against our ggml (whisper.cpp slim
            # bundles). The tree id changes only when ggml/ contents change, so
            # a release that touches nothing under ggml/ does not force a
            # rebuild downstream. The -mix- tag suffix is a hash of the PR set,
            # not a ggml identity: it stays constant while the base tag moves.
            GGML_TREE="$(git rev-parse HEAD:ggml)"
            GGML_VERSION="$(sed -nE 's/^set\(GGML_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)$/\2/p' ggml/CMakeLists.txt | paste -sd. -)"
            # Warn, do not fail: these only tighten downstream pairing, and
            # whisper falls back to the old comparison when they are absent.
            # Killing a 39-job release over a metadata field would be worse
            # than publishing without it.
            printf '%s' "$GGML_TREE" | grep -qE '^[0-9a-f]{40}$' \
              || { echo "::warning::could not resolve the ggml tree id"; GGML_TREE=""; }
            printf '%s' "$GGML_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::warning::could not parse GGML_VERSION from ggml/CMakeLists.txt"; GGML_VERSION=""; }
            echo "ggml tree ${GGML_TREE:-unknown} (version ${GGML_VERSION:-unknown})"

            # The tarball ships without .git, where cmake/build-info.cmake falls
            # back to its defaults; bake real values into those defaults so
            # llama-server --version doesn't report b0 (unknown). The build number
            # stays the BASE's b#### number (the upstream tag's commit count), so
            # anything comparing versions against upstream releases keeps working;
            # BUILD_COMMIT identifies the (possibly merged) head.
            COUNT="${BASE#b}"
            SHORT="$(git rev-parse --short HEAD)"
            sed -i "s/^set(BUILD_NUMBER 0)$/set(BUILD_NUMBER ${COUNT})/" cmake/build-info.cmake
            sed -i "s/^set(BUILD_COMMIT \"unknown\")$/set(BUILD_COMMIT \"${SHORT}\")/" cmake/build-info.cmake
            grep -q "set(BUILD_NUMBER ${COUNT})" cmake/build-info.cmake \
              && grep -q "set(BUILD_COMMIT \"${SHORT}\")" cmake/build-info.cmake \
              || { echo "cmake/build-info.cmake no longer has the expected fallback lines; cannot bake the build number into the source artifact" >&2; exit 1; }

            # Unsloth fingerprint: fold "Compiled by the Unsloth team"
            # into BUILD_TARGET, which cmake bakes into LLAMA_BUILD_TARGET, so it
            # prints on llama-server --version ("built with ... for ...") and shows
            # up in `strings` on every binary that links common. Append so it wraps
            # whatever BUILD_TARGET the build computes. Keep this string byte-identical
            # to MARK in the assemble job's verify gate, which re-checks it landed.
            grep -q 'set(BUILD_TARGET' cmake/build-info.cmake \
              || { echo "cmake/build-info.cmake has no BUILD_TARGET line to stamp" >&2; exit 1; }
            printf '\n# Unsloth fingerprint: shows in --version and strings.\nset(BUILD_TARGET "${BUILD_TARGET} (Compiled by the Unsloth team)")\n' >> cmake/build-info.cmake
            grep -q 'Compiled by the Unsloth team' cmake/build-info.cmake \
              || { echo "failed to stamp the Unsloth fingerprint into cmake/build-info.cmake" >&2; exit 1; }

            tar -czf "${RUNNER_TEMP}/llama.cpp-source-${TAG}.tar.gz" --exclude-vcs --transform "s,^\.,llama.cpp-${TAG}," .
            echo "prepared ${TAG} (${COMMIT}, build ${COUNT})"
          else
            echo "release ${TAG} already published; skipping source prep (nothing to build)"
          fi

          # ubuntu-22.04 is x64 (glibc 2.35). arm64 only has ubuntu-24.04-arm
          # available on GitHub-hosted runners (glibc 2.39). arm64 is cuda13-only
          # (no cuda12 SBSA) and ships the single "portable" coverage class.
          # cuda12 installs via Jimver; cuda13 is pinned to 13.3 (matching
          # upstream) which Jimver lacks, so those install via NVIDIA redist in
          # the build children -- on the same runners, so the glibc floor holds.
          # The matrix construction below moved into its own step: this one was at 98% of
          # GitHub's 21000-character limit per run string, and a step that exceeds it makes
          # the whole workflow refuse to compile with no annotation anywhere. A step boundary
          # resets the budget. These are the variables the second half reads.
          for v in BASE COMMIT EXISTS GFX GGML_TREE GGML_VERSION ONLY PRS REPO REQ SRC_ARTIFACT TAG; do
            printf "%s<<__UNSLOTH_EOF__\n%s\n__UNSLOTH_EOF__\n" "$v" "${!v}" >> "$GITHUB_ENV"
          done

      # Second half of resolve. Same script, same order, its own name so a failure
      # here is attributable instead of being another anonymous line in one 300-line
      # step. Reads the first half's variables from the environment.
      - id: m
        run: |
          set -euo pipefail
          PHASE='build the child matrices'
          on_err() { local rc=$? line=$1; printf '### Resolve (matrices) failed\n\nphase `%s`, line %s, command `%s`, exit %s\n' "$PHASE" "$line" "$BASH_COMMAND" "$rc" >> "$GITHUB_STEP_SUMMARY"; }
          trap 'on_err $LINENO' ERR

          ALL='[
            {"profile":"cuda12-legacy",  "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"legacy",  "rank":5, "cuda":"12.8.0","toolkit_line":"12.8","archs":"50-virtual 61-virtual","sms":"50 52 60 61"},
            {"profile":"cuda12-older",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"older",   "rank":10,"cuda":"12.8.0","toolkit_line":"12.8","archs":"70 75 80 86 89"},
            {"profile":"cuda12-newer",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"newer",   "rank":20,"cuda":"12.8.0","toolkit_line":"12.8","archs":"86 89 90 100 120"},
            {"profile":"cuda12-portable","arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"portable","rank":30,"cuda":"12.8.0","toolkit_line":"12.8","archs":"70 75 80 86 89 90 100 120"},
            {"profile":"cuda13-older",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda13","klass":"older",   "rank":40,"cuda":"13.3","toolkit_line":"13.3","archs":"75 80 86 89"},
            {"profile":"cuda13-newer",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda13","klass":"newer",   "rank":50,"cuda":"13.3","toolkit_line":"13.3","archs":"86 89 90 100 120"},
            {"profile":"cuda13-portable","arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda13","klass":"portable","rank":60,"cuda":"13.3","toolkit_line":"13.3","archs":"75 80 86 89 90 100 120"},
            {"profile":"cuda13-portable","arch":"arm64","runner":"ubuntu-24.04-arm","line":"cuda13","klass":"portable","rank":60,"cuda":"13.3","toolkit_line":"13.3","archs":"90 100 120 121"}
          ]'
          if [ "$ONLY" = "all" ]; then
            CUDA_INCLUDE="$(echo "$ALL" | jq -c .)"
          else
            CUDA_INCLUDE="$(echo "$ALL" | jq -c --arg p "$ONLY" '[.[] | select(.profile==$p)]')"
          fi
          # CUDA Windows reuses the x64 profiles (same arch lists / CUDA
          # versions), just on a Windows runner. arm64 has no CUDA Windows target.
          WIN_CUDA_INCLUDE="$(echo "$CUDA_INCLUDE" | jq -c '[.[] | select(.arch=="x64") | .runner="windows-2022"]')"

          [ -n "$GFX" ] || { echo "refusing empty gfx_target (would publish a CUDA-only release labeled CUDA + ROCm)" >&2; exit 1; }
          ROCM_MATRIX="$(jq -cn --arg g "$GFX" '{gfx_target: ($g | split(",") | map(gsub("^\\s+|\\s+$"; "")))}')"
          # Windows rows carry slices: gfx110X and gfx103X, the slowest ROCm legs, get a warm shard.
          ROCM_WIN_MATRIX="$(jq -c '{include: [.gfx_target[] as $g | (if ($g == "gfx110X" or $g == "gfx103X") then 2 else 1 end) as $n | range($n) as $s | {gfx_target: $g, slice: $s, slices: $n}]}' <<<"$ROCM_MATRIX")"

          # One weekly cutoff for the whole run, before fan-out. See the ROCm child for why it is the Saturday before.
          # Each leg reads its own clock otherwise, so a run crossing the SF Sat-to-Sun boundary would mix two toolchains in one release.
          ROCM_CUTOFF="$(TZ=America/Los_Angeles date -d "-$(( $(TZ=America/Los_Angeles date +%w) + 1 )) days" +%Y%m%d)"

          # macOS slices are static: two fixed runners with per-slice deployment
          # targets. arm64 builds on macos-26 (newest Metal SDK; avoids the
          # M5/A19 "error compiling source" the macos-14 SDK emits) while both
          # slices pin 13.3 to match upstream's Ventura compatibility floor.
          MACOS_INCLUDE='[
            {"build":"arm64","runner":"macos-26",      "expect_arch":"arm64", "deploy_target":"13.3","defines":"-DGGML_METAL_EMBED_LIBRARY=ON"},
            {"build":"x64",  "runner":"macos-15-intel","expect_arch":"x86_64","deploy_target":"13.3","defines":"-DGGML_METAL=OFF"}
          ]'
          MACOS_INCLUDE="$(echo "$MACOS_INCLUDE" | jq -c .)"

          {
            echo "tag=$TAG"
            echo "repo=$REPO"
            echo "base=$BASE"
            echo "prs=$PRS"
            echo "source_artifact=$SRC_ARTIFACT"
            echo "commit=$COMMIT"
            echo "ggml_tree=$GGML_TREE"
            echo "ggml_version=$GGML_VERSION"
            echo "exists=$EXISTS"
            echo "cuda_matrix={\"include\":$CUDA_INCLUDE}"
            echo "win_cuda_matrix={\"include\":$WIN_CUDA_INCLUDE}"
            echo "rocm_matrix=$ROCM_MATRIX"
            echo "rocm_win_matrix=$ROCM_WIN_MATRIX"
            echo "rocm_cutoff=$ROCM_CUTOFF"
            echo "macos_matrix={\"include\":$MACOS_INCLUDE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $REQ -> $TAG ($COMMIT); prs=$PRS; source_artifact=${SRC_ARTIFACT:-none}; release exists=$EXISTS; only=$ONLY; gfx=$GFX"

      # Warm shards for the CUDA children: each profile row is dealt into `shards` jobs that
      # pre-compile a slice of ggml-cuda through ccache; the children restore up to four. An
      # empty string, not an empty include list, tells the child to skip the job. Its own step:
      # GitHub caps one workflow string at 21000 chars and `r` is at it (check_workflow_scalars.py).
      - name: Warm shard matrix for the CUDA children
        id: warm
        env:
          CUDA_MATRIX: ${{ steps.m.outputs.cuda_matrix }}
          WIN_CUDA_MATRIX: ${{ steps.m.outputs.win_cuda_matrix }}
        run: |
          set -euo pipefail
          # N = slices per profile (max 4: the build restores 1..3). Every job starts at once, so the run's
          # job count is its peak runners: keep the total at 60 (breakdown in unslothai/llama.cpp#302).
          SHARDS='if .klass == "legacy" then 1 elif .klass == "portable" then (if .arch == "x64" then 3 else 1 end) else 2 end'
          WIN_SHARDS='if .klass == "legacy" then 1 elif .klass == "portable" then 4 else 2 end'
          expand_warm() { # $1 = slice rule; warm jobs take slices 1..N-1, the build takes 0
            jq -c ".include | [.[] | . as \$r | ($1) as \$k | select(\$k > 1) | range(1; \$k) as \$s | \$r + {shards: \$k, shard: \$s}]"
          }
          [ -n "${CUDA_MATRIX:-}" ] || CUDA_MATRIX='{"include":[]}'
          [ -n "${WIN_CUDA_MATRIX:-}" ] || WIN_CUDA_MATRIX='{"include":[]}'
          CUDA_WARM="$(printf '%s' "$CUDA_MATRIX" | expand_warm "$SHARDS")"
          WIN_CUDA_WARM="$(printf '%s' "$WIN_CUDA_MATRIX" | expand_warm "$WIN_SHARDS")"
          with_shards() { jq -c "{include: [.include[] | . + {shards: ($1)}]}"; }
          {
            echo "cuda_matrix=$(printf '%s' "$CUDA_MATRIX" | with_shards "$SHARDS")"
            echo "win_cuda_matrix=$(printf '%s' "$WIN_CUDA_MATRIX" | with_shards "$WIN_SHARDS")"
            [ "$CUDA_WARM" = "[]" ] && echo "cuda_warm_matrix=" || echo "cuda_warm_matrix={\"include\":$CUDA_WARM}"
            [ "$WIN_CUDA_WARM" = "[]" ] && echo "win_cuda_warm_matrix=" || echo "win_cuda_warm_matrix={\"include\":$WIN_CUDA_WARM}"
          } >> "$GITHUB_OUTPUT"
          echo "warm shards: linux $(jq length <<<"$CUDA_WARM"), windows $(jq length <<<"$WIN_CUDA_WARM")"

      # A bad pin resolution can still build fine, so it must be caught before the source artifact ships. See merge_checks.py.
      # Its own step, not more script in `resolve`: GitHub caps one workflow string at 21000 chars and that step is near it. See check_workflow_scalars.py.
      # That is also why `resolve` copies all of scripts/unsloth/ to ${RUNNER_TEMP}/us in one line rather than one cp per script: every check added
      # here would otherwise cost another line inside the capped block, and going over silently disables the whole workflow.
      - name: Check the merged tree for silently wrong resolutions
        if: ${{ env.MERGED_PINS == '1' }}
        run: |
          set -euo pipefail
          if ! python3 "${RUNNER_TEMP}/us/merge_checks.py" --root . ; then
            echo "::error::the pinned PRs merged, but merge_checks.py found a resolution that is silently wrong; see the log for file and line" >&2
            exit 1
          fi

      # merge_checks.py asserts the ABSENCE of two known-bad shapes. This asserts the PRESENCE of what each pin carries, which is a different question and
      # the one that goes unanswered when a pin rots into a no-op or a resolution quietly drops an arch registration. Free, so it runs before the compile gate.
      - name: Check every pin still contributes what it carries
        if: ${{ env.MERGED_PINS == '1' }}
        # Through env, never interpolated into the script: `prs` carries PR
        # titles, which are third-party text, and `${{ }}` pastes them into the
        # shell source before bash ever sees it.
        env:
          PRS: ${{ steps.m.outputs.prs }}
          BASE: ${{ steps.m.outputs.base }}
        run: |
          set -euo pipefail
          if ! python3 "${RUNNER_TEMP}/us/pin_contract.py" --root . --base "$BASE" \
               --prs-json "$PRS" --report "${RUNNER_TEMP}/pin_contract.json" ; then
            echo "::error::the pinned PRs merged, but the merged tree is missing code a pin carries; see the log for the pin and file" >&2
            exit 1
          fi

      # The gap this closes, observed 09-03: ggml-org#27754 merged with zero conflicts and did not compile, because upstream had added a parameter to
      # build_attn_mha and the pin's new build_attn_sparse still called the old signature. Nothing before this point can see that, and without it the release
      # dies in the CUDA leg after the 38-job fan-out. CPU only: a cold `llama` build took 59s at -j4 with no ccache, against 20-60 minutes for a CUDA build.
      # mtmd is in the gate because `llama` alone is not enough: observed 09-04, ggml-org#25731 built `llama` clean while tools/mtmd did not compile at all,
      # upstream having made mtmd_image_preprocessor::preprocess const while the pin's Inkling subclass stayed non-const, so it overrode nothing and the
      # vision and audio towers were abstract. Every vision pin lands in mtmd, so a gate that skips it cannot see the whole class.
      - name: Compile gate (CPU, llama and mtmd targets)
        if: ${{ env.MERGED_PINS == '1' }}
        run: |
          set -euo pipefail
          cmake -B "${RUNNER_TEMP}/gate" -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_CURL=OFF > /dev/null
          if ! cmake --build "${RUNNER_TEMP}/gate" --target llama mtmd -j "$(nproc)" ; then
            echo "::error::the pinned PRs merged cleanly and the merged tree does not compile; fix or drop the pin rather than letting the build matrix find this" >&2
            exit 1
          fi

      # The stamped source tree (every build): every build child extracts this
      # instead of cloning, and assemble ships it as the release's source-tarball
      # asset, so a source build reproduces the same fingerprinted binary. Only
      # produced when we build, so guard on the same condition as the build jobs
      # (resolve skips source prep on a scheduled no-op, leaving no tarball).
      - name: Upload source artifact
        if: ${{ steps.m.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ${{ steps.m.outputs.source_artifact }}
          path: ${{ runner.temp }}/llama.cpp-source-${{ steps.m.outputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 7
