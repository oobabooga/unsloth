name: "AMD CI: Linux Studio torch keep / upgrade e2e (unslothai/unsloth#9932)"

on:
  push:
    branches: [amd-ci-rocm72-torch214-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  linux:
    name: "Linux gfx1151: install / re-run / update / repair, base vs head"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "rocm72-e2e"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran with no torch; every scenario's install records torch.version.hip"

      - name: E2E
        timeout-minutes: 340
        run: |
          set +e
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          python3 -u amd_ci/probes/studio_linux_e2e.py \
            --base d9aded3801f41d1d55fe55b047e25d12730379ac \
            --head 83155acfa3b573e4d3a6b86341e323e93c2f42b0 \
            --work "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/e2e"
          echo "probe rc=$?"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocm72-e2e
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
