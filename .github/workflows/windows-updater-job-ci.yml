name: Windows updater Job Object CI

on:
  push:
    branches: [ci/windows-updater-job-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-updater-job:
    name: Windows updater process handoff
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: studio/src-tauri -> target

      - name: Build frontend
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run build

      - name: Run Windows Job Object and Rust unit tests
        working-directory: studio/src-tauri
        run: cargo test --locked --no-fail-fast

      - name: Build Windows desktop binary
        working-directory: studio/src-tauri
        run: cargo build --locked
