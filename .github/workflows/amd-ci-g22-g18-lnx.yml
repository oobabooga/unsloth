name: "AMD CI: validate PR 19766"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-g22-g18-lnx]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "19766"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  AMD1_BASE_OVERRIDE: "c479c38bb6300e9107d4ff242e88e30c557f1122"
  AMD1_HEAD_OVERRIDE: "41e9a14091627298aefd8084a618ce5f353a25b3"
  MERGED: "0"
  # Set by scaffold.py --patch: base = PATCH_BASE, head = PATCH_BASE plus this diff (relative to the checkout).
  PATCH_BASE: ""
  PATCH_FILE: ""
  PATCH_SHA256: "__PATCH_SHA256__"

jobs:

  gpu:
    name: "PR 19766 GPU check (shared GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 600
    # --shared-gpu: no concurrency group, so a co-tenant may share the card.
    # Correctness only; capability.py reports `exclusive_gpu` as a gap.
    env:
      AMD_CI_SHARED_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr19766-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          if [ -n "$PATCH_FILE" ]; then ARGS="--patch-base $PATCH_BASE --patch $GITHUB_WORKSPACE/$PATCH_FILE --patch-sha256 $PATCH_SHA256"; fi
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and host gate (no Studio)
        run: |
          set -euo pipefail
          echo "AMD_CI_PY=$(command -v python3)" >> "$GITHUB_ENV"
          # No torch here, so rocm/gpu read UNDETERMINED: the criteria gates prove the GPU ran.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/train5_probe.py \
            --criteria amd_ci/criteria/amdgate_rocm.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --unit g18 --state-repo unsloth --transformers 5.24.0 --trl 1.18.0 --cells env,flm16,flm4,grpo_txt,grpo_padeos,grpo_padeos_ref,grpo_padeos_refctl,dpo_txt,vision,tphost,gen_llama,gen_llama_f32,gen_mistral,gen_gemma3,gen_llama_mlpbias,plain_llama,plain_qwen2,plain_after,sa8k_q06,sa8k_q06_r,sa2k_q06,cmp_qwen3,vis_frozen,vis_frozen_ks,vis_unfrozen,aot_q06,cpp_qwen3,oom_ce,qgal,cthreads,gcfit,gcfit_gk0,flm16_gk0,loraround,cputhr,moe,moe_auto,rocmgate --companion-repo https://github.com/unslothai/unsloth-zoo --companion-base 07901303dcaa1874b5ef86b26508e78f0511e1d4 --companion-head 3dd11fcfc2236ea041b46e54081320a60e604305 --venv "$AMD_CI_WORK/tvenv" --tests tests/test_grpo_vllm_lora_rounding.py tests/test_token_balance_partition.py tests/test_gc_skip_auto.py tests/test_block_swap_install.py tests/test_nf4_dequant_cache.py tests/test_qat_weight_memo.py tests/test_on_policy_distillation.py tests/test_grpo_partial_rollout.py tests/test_ep_expert_lists_gloo.py tests/test_online_dpo_vllm_init.py tests/test_pp_adjacent_stage_warmup.py tests/test_tp_env_trainer_init_install.py tests/test_grpo_routing_replay_trainer_hooks.py tests/test_grpo_packing_shape_noise.py tests/test_dpo_top1_half_logits.py tests/test_fsdp2_generate_full_params_gloo.py tests/test_grpo_scalerl_resampling.py tests/test_lora_scale_warning.py tests/test_flash_adamw_triton_globals.py tests/test_grpo_move_model_to_vllm_sync.py tests/test_rloo_move_model_to_vllm_sync.py tests/test_pp_moe_aux_gloo.py tests/test_pp_moe_aux_off_gloo.py tests/test_moe_load_logging.py tests/test_parallel_cp_pipeline_gloo.py tests/python/test_grpo_head_hooks.py tests/test_layout_portable_resume_gloo.py tests/test_ep_expert_rows_gloo.py tests/test_ulysses_inkling2_bias.py tests/test_functorch_config_thread_mirror.py tests/test_pp_schedules_gloo.py tests/test_oom_does_not_latch_fast_paths.py tests/test_block_compile_cpp_wrapper.py tests/test_block_compile.py tests/utils/test_q_galore.py tests/test_fsd