name: "AMD CI: gfx1151 HIP+Vulkan auto-fit, master ba6ac303 vs #51 192306d9 vs fix ab36235"

# All three built on the box (HIP gfx1151 + Vulkan, TheRock 7.14 + LunarG SDK), measured in ONE job, interleaved per rep.
# fix ab36235 = #51 head + one commit (src/core/backend_fit.cpp), from danielhanchen/sd-cpp-staging branch fix51-ab36235.

on:
  push:
    branches: [amd-ci-sdxp-fix51]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-linux:
    name: "gfx1151 Linux: HIP+Vulkan auto-fit, master vs #51 vs fix"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    env:
      ROCM_VERSION: "7.14.0"
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: 241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf
      MASTER: ba6ac30346b0f174354419d820e6f11b3e9bc0f2
      H51: 192306d914969cff61e96d38afd5687e9ded4fdc
      FIX: ab36235b7536bb34aa5ff9cd2bf3934e4df1dc54
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "sdxp-fix51-linux"
      - name: Host gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require linux --out "$AMD_CI_WORK/out/host.json"
          python3 amd_ci/lib/capability.py > "$AMD_CI_WORK/out/capability.json" 2>&1 || true
          uname -n
      - name: "Box builds: HIP+Vulkan gfx1151, master / #51 / fix"
        timeout-minutes: 90
        run: |
          set +e
          cd "$AMD_CI_WORK"
          python3 -m venv .rocm && . .rocm/bin/activate
          python -m pip install -q --upgrade pip && python -m pip install -q ninja cmake pillow numpy
          python -m pip install -q --no-cache-dir --index-url https://repo.amd.com/rocm/whl-multi-arch/ \
            "rocm[libraries,devel,device-gfx1151]==${ROCM_VERSION}"
          ROCM_PATH="$(rocm-sdk path --root)"
          export ROCM_PATH HIP_PATH="$ROCM_PATH" CMAKE_PREFIX_PATH="$(rocm-sdk path --cmake)"
          export PATH="$(rocm-sdk path --bin):$AMD_CI_WORK/.rocm/bin:$PATH"
          echo "ROCM_LIB=$ROCM_PATH/lib" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/vulkansdk.tar.xz"; sdk_root="$RUNNER_TEMP/vulkansdk"
          curl -s --fail --location --retry 3 --output "$archive" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          echo "$VULKAN_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$sdk_root" && tar -xJf "$archive" -C "$sdk_root" --strip-components=1
          export VULKAN_SDK="$sdk_root/x86_64" PATH="$sdk_root/x86_64/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          bash sdrc/build.sh hv_master "$MASTER" hipvk "$AMD_CI_WORK/bin/hv_master" 2>&1 | tail -4
          bash sdrc/build.sh hv_h51 "$H51" hipvk "$AMD_CI_WORK/bin/hv_h51" 2>&1 | tail -4
          SRC_REPO=https://github.com/danielhanchen/sd-cpp-staging bash sdrc/build.sh hv_fix "$FIX" hipvk "$AMD_CI_WORK/bin/hv_fix" 2>&1 | tail -4
          cat "$AMD_CI_WORK"/bin/*/srcinfo.txt | grep label=
          exit 0
      - name: "Measure (5 arms x 2 cases x 3 reps, interleaved)"
        timeout-minutes: 120
        run: |
          set +e
          B="$AMD_CI_WORK/bin"
          "$AMD_CI_WORK/.rocm/bin/python" -u sdrc/run_fix51.py --bin hv_master=$B/hv_master --bin hv_h51=$B/hv_h51 --bin hv_fix=$B/hv_fix \
            --rocm-lib "${ROCM_LIB:-}" --models "$AMD_CI_WORK/models" --out "$AMD_CI_WORK/out/runs" --reps 3 2>&1 | tail -60
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdxp-fix51-linux
          path: |
            ${{ env.AMD_CI_WORK }}/out
            !${{ env.AMD_CI_WORK }}/out/**/*.png
          retention-days: 7
          if-no-files-found: warn
