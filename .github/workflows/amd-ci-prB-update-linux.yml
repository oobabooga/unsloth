name: "AMD CI: validate PR 10579"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-prB-update-linux]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "10579"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  gpu:
    name: "PR 10579 GPU measurement (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    # A shared constant, deliberately: it serialises every GPU measurement across
    # all branches. That is stricter than co-tenancy strictly requires now that the
    # pool is many machines, but nothing in the label set can pin or exclude a
    # machine, so "two GPU jobs never run at once" is the only enforceable version
    # of "no co-tenant moved my number".
    # The cost is that the group holds one runner plus one waiter,
    # so a third arrival evicts the waiter. `cancel-in-progress: false` protects
    # the job already running, not the one queued behind it. Re-run the job.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr10579-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          # Not a PR yet: the change lives on a fork branch (a workflow-free snapshot of the
          # PR B tree) and its base is the origin/main commit it branched from, snapshotted
          # the same way so the two installs differ only in the change under test.
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" \
            --state "base=https://github.com/oobabooga/unsloth#amd-ci-prB-src-base" \
            --state "head=https://github.com/oobabooga/unsloth#amd-ci-prB-src-head" \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Tools
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # The probe installs Studio itself, once per state, with each state's own installer
          # and wheel, into an isolated HOME under $AMD_CI_WORK. This step only provides the
          # build tool: uv builds the wheel from each checkout. Everything else the harness
          # runs is stdlib Python 3 plus bash, curl and (optionally) perl.
          python3 --version
          command -v perl >/dev/null && echo "perl: present" || echo "perl: absent (python timestamp filter will be used)"
          command -v curl >/dev/null || { echo "FATAL: curl missing"; exit 1; }
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="$AMD_CI_WORK/bin" UV_NO_MODIFY_PATH=1 sh
          "$AMD_CI_WORK/bin/uv" --version
          echo "AMD_CI_PY=$(command -v python3)" >> "$GITHUB_ENV"
          # amd-smi / KFD view of the host before any install, for the record.
          { command -v amd-smi >/dev/null && amd-smi static --asic 2>&1 | head -40; } || true
          cat /sys/class/kfd/kfd/topology/nodes/*/properties 2>/dev/null | grep -E 'gfx_target_version|simd_count' | head -8 || true
          df -h "$AMD_CI_WORK" | tail -1

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/studio_update_probe.py \
            --criteria amd_ci/criteria/studio_update_idempotent.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --harness "$GITHUB_WORKSPACE/amd_ci/vendor/bisect" --work "$AMD_CI_WORK/p" --uv "$AMD_CI_WORK/bin/uv"
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - name: Real gate on the head install
        if: always()
        run: |
          set -euo pipefail
          # The probe left the head state's Studio venv behind; its torch is the one the
          # update procedure must keep. --require rocm gpu FAILS here if it is not a ROCm
          # build that sees the gfx1151, which is the point: a green run on a CPU torch would
          # answer a different question than issue 10579 asks.
          PY=$(python3 -c "import json;print(json.load(open('$AMD_CI_WORK/out/gpu/obs_head.json'))['venv_python'])")
          "$PY" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host_head_venv.json"
          # Re-render the verdict under the venv python: differential.py ran under the system
          # python3, which has no torch, so its "Not tested here" section read UNDETERMINED.
          "$PY" "$GITHUB_WORKSPACE/amd_ci/lib/redecide.py" --dir "$AMD_CI_WORK/out/gpu" \
            --criteria "$GITHUB_WORKSPACE/amd_ci/criteria/studio_update_idempotent.py"
          cat "$AMD_CI_WORK/out/gpu/VERDICT_redecided.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10579-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
