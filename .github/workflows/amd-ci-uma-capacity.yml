# Does GGML_CUDA_ENABLE_UNIFIED_MEMORY buy CAPACITY on Strix Halo?
#
# The corruption work is finished and is not what this asks. This asks whether
# the flag is worth having at all, which the previous run made doubtful: with the
# flag unset a 45.1 GiB model sat in 49.3 GB of "VRAM" and ran 15% FASTER than
# with it set, because rocminfo reports a 64 GiB GPU pool against 62 GiB of
# system RAM. Those are the same DRAM. There is no bus to avoid.
#
# But "no speed benefit at 45 GiB" is not "no benefit". The flag's real claim is
# capacity: hipMallocManaged instead of hipMalloc, so allocation is not bounded
# by the GTT carveout. That claim is untested here, and the honest way to test it
# is a model that plainly does not fit.
#
# Qwen3.8-Flash-Next UD-Q4_K_XL is 103.7 GiB against 62 GiB of RAM with zero
# swap. If the flag extends capacity in any usable way, the =1 state loads and
# the unset state does not. If neither loads, the flag cannot conjure memory that
# is not there, and its value on this class of machine is limited to whatever
# band sits between the GTT limit and total RAM.
#
# Prediction, recorded before the run so it can be wrong: BOTH states fail to
# load. Managed memory needs physical backing and this host has no swap, so
# oversubscription has nowhere to go. A single load failure in the =1 state is
# the result that would refute the "flag is redundant here" reading.
#
# Unlike the corruption cells there is no positive control, because the question
# is not differential. The trust condition is different: the run is only
# interpretable if the fetch completed and both states used the same shards.

name: "AMD CI: does unified memory buy capacity for a model larger than RAM"

on:
  push:
    branches: [amd-ci-uma-capacity]
  workflow_dispatch:

permissions:
  contents: read

env:
  CODER_REPO: "unsloth/Qwen3.8-Flash-Next-GGUF"
  CODER_REV: "c8b5954a88c2775c546b92593eda40ea041d3176"
  CODER_DIR: "UD-Q4_K_XL"
  CODER_HEAD: "Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"
  CTX: "8192"
  NPREDICT: "30"
  REPEATS: "3"
  NGL: "999"
  LOAD_TIMEOUT: "1800"
  REQ_TIMEOUT: "420"

jobs:

  gpu:
    name: "103.7 GiB model on a 62 GiB host, gfx1151 (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 420
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "uma-capacity"

      - name: Hardware gate and memory bounds
        run: |
          set -eu
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"
          { rocminfo || true; } > "$AMD_CI_WORK/out/rocminfo.txt" 2>&1
          { free -g; } > "$AMD_CI_WORK/out/free_start.txt" 2>&1
          cat "$AMD_CI_WORK/out/free_start.txt"
          df -h "$AMD_CI_WORK" | tail -1

      - name: Refuse to start on a memory-starved host
        id: memgate
        run: |
          set -eu
          # Run 33339076027 produced 18 uninterpretable cells because it landed
          # on a host still holding 31 GB of shared memory from the sweep before
          # it: 27 GB available against a 45.1 GiB model, so every load thrashed
          # and hit the timeout. "ephemeral" describes the runner process, not
          # the machine's page cache.
          #
          # A longer timeout does not fix that, it only fails more slowly. Check
          # the precondition instead and fail in seconds with the numbers, so the
          # answer is "the host was busy", not three hours of empty verdicts.
          AVAIL=$(awk '/MemAvailable/ {print int($2/1024/1024)}' /proc/meminfo)
          # Calibration, from three observed runs on this host:
          #   58 GiB available -> 20/20 cells certified
          #   48 GiB available -> untested, model is 45.1 GiB so it should fit
          #   27 GiB available -> 0/18, every load thrashed past the timeout
          # 47 leaves ~2 GiB over the model for compute buffers and KV. The first
          # threshold was 52, which refused a host with 48 GiB that would very
          # likely have worked. If 47 turns out to be too tight the failure is
          # cheap and unambiguous: cells time out on load and say so.
          NEED=55
          echo "available=${AVAIL} GiB, required=${NEED} GiB (quiet-host check; the 103.7 GiB model exceeds RAM BY DESIGN)"
          free -g
          if [ "$AVAIL" -lt "$NEED" ]; then
            echo "::error::Host has ${AVAIL} GiB available, need ${NEED} GiB. A previous job has not released memory. Re-run when the host is idle; do not raise the load timeout to work around this."
            exit 1
          fi

      - name: Fetch Qwen3.8-Flash-Next UD-Q4_K_XL, 103.7 GiB over four shards
        timeout-minutes: 240
        run: |
          set -eu
          M="$AMD_CI_WORK/models"
          for N in 00001 00002 00003 00004; do
            F="Qwen3.8-Flash-Next-UD-Q4_K_XL-$N-of-00004.gguf"
            python3 amd_ci/lib/fetch_gguf.py --repo "$CODER_REPO" \
              --file "$CODER_DIR/$F" --revision "$CODER_REV" --as-name "$F" \
              --local-dir "$M/ctl" --out "$AMD_CI_WORK/out/model_$N.json"
          done
          mkdir -p "$M/uma1"
          for F in "$M"/ctl/*.gguf; do ln -f "$F" "$M/uma1/$(basename "$F")"; done
          printf '%s\n' '-GGML_CUDA_ENABLE_UNIFIED_MEMORY' > "$M/ctl/env"
          printf '%s\n' 'GGML_CUDA_ENABLE_UNIFIED_MEMORY=1' > "$M/uma1/env"
          python3 amd_ci/lib/write_states.py --require-file "$CODER_HEAD" \
            --path "base=$M/ctl" --path "head=$M/uma1" \
            --label "base=unset" --label "head==1" \
            --out "$AMD_CI_WORK/out/states.json"
          df -h "$AMD_CI_WORK" | tail -1

      - name: "C1 - 103.7 GiB model, UMA unset vs =1 (fixed binary)"
        if: always() && steps.memgate.outcome == 'success'
        timeout-minutes: 75
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          python3 amd_ci/lib/fetch_llamacpp.py --url "https://github.com/oobabooga/unsloth/releases/download/memcpydefault-test/llamacpp-memcpydefault-gfx1151.tar.gz" \
            --dest "$AMD_CI_WORK/lcpp/d1" --out "$AMD_CI_WORK/out/bin_d1.json"
          BIN="$(python3 -c "import json;print(json.load(open('$AMD_CI_WORK/out/bin_d1.json'))['bin_dir'])")"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/C1" \
            --title "C1 Qwen3.8-Flash-Next UD-Q4_K_XL 103.7 GiB on a 62 GiB host, unset vs =1, gfx1151" \
            -- --bin-dir "$BIN" --gguf "$CODER_HEAD" --ngl "$NGL" \
               --ctx-size "$CTX" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=--parallel --extra-arg=1 --extra-arg=-fa --extra-arg=off \
               --load-timeout "$LOAD_TIMEOUT" --request-timeout "$REQ_TIMEOUT"
          cat "$AMD_CI_WORK/out/C1/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/C1" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umacapacity-C1
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
