name: "AMD CI (Windows): fused losses on main, chunked r7"

# Generated by scripts/amd_r7/gen.py from the r6-win workflow (scaffold.py --windows output), one Windows job
# per short test chunk: three earlier single-job runs lost their runner ~12 min into one long GPU step.
# No GPU concurrency group: correctness only, no timing, and a shared group evicts its third waiter.

on:
  push:
    branches: [amd-ci-fused-linear-r7b-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOO_MAIN_SHA: "9910e5421a3c1265b0d2a410359236d0ed4874d4"
  UNSLOTH_SHA: "8fec28219290c45e74fae616818707a829a296e4"
  UNSLOTH_REPO: "https://github.com/unslothai/unsloth"
  AMD_TORCH_INDEX: "https://repo.amd.com/rocm/whl-multi-arch/"
  AMD_TORCH_SPEC: "torch[device-gfx1151]==2.11.0+rocm7.14.0"

jobs:

  linux-control:
    name: "linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"

  w_a2x:
    name: "zoo test_fused_linear.py (2/2) minus the device-assert test, 540638e8 vs main"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    env:
      UNSLOTH_IS_PRESENT: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # LF worktrees for every git call in this job, so the range patch applies as generated.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "core.autocrlf"
      GIT_CONFIG_VALUE_0: "false"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "r7-w_a2x"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_OS=[$env:RUNNER_OS] RUNNER_NAME=[$env:RUNNER_NAME] COMPUTERNAME=[$env:COMPUTERNAME]"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\states.py" `
            --repo "https://github.com/unslothai/unsloth-zoo" --pr 1866 --patch-base 540638e87137fdb2413873e62e415524901c77e0 --patch "$env:GITHUB_WORKSPACE\amd_ci\patches\zoo_540638e8_to_9910e542.diff" `
            --root "$env:AMD_CI_WORK" --out "$env:AMD_CI_WORK\out\states.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:AMD_CI_WORK\out\states.json"

      - name: Test environment
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          & $py -m pip install -q pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $kind = "rocm"
          & $py -m pip install --index-url "$env:AMD_TORCH_INDEX" "$env:AMD_TORCH_SPEC"
          if ($LASTEXITCODE -ne 0) {
            & $py -m pip install --index-url "$env:AMD_TORCH_INDEX" --extra-index-url "https://pypi.org/simple" "$env:AMD_TORCH_SPEC"
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::AMD ROCm torch for gfx1151 did not install; falling back to CPU torch (CPU RUN)"
            $kind = "cpu-fallback"
            & $py -m pip install --index-url "https://download.pytorch.org/whl/cpu" torch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $tv = & $py -c "import torch; print(torch.__version__)"
          $gpu = & $py -c "import torch; print(int(torch.cuda.is_available()))"
          & $py -c "import torch; print('torch', torch.__version__, 'hip', torch.version.hip, 'gpu', torch.cuda.is_available())"
          Set-Content -Path "$env:AMD_CI_WORK\constraints.txt" -Value "torch==$tv" -Encoding ASCII
          # zoo dependencies from the base checkout, torch held; plain list if a dependency has no Windows wheel.
          & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" "$env:AMD_CI_WORK\states\base"
          if ($LASTEXITCODE -ne 0) {
            & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" "transformers>=4.52.4,<=5.17.0" "trl>=0.18.2,<=1.15.0" "peft>=0.18.0" "accelerate>=0.34.1" "datasets>=3.4.1,<5.0.0" tyro einops packaging sentencepiece tqdm psutil numpy protobuf "huggingface_hub>=0.34.0" pillow regex msgspec typing_extensions filelock requests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $u = "$env:AMD_CI_WORK\unsloth"
          git clone -q --filter=blob:none "$env:UNSLOTH_REPO" "$u"
          git -C "$u" checkout -q --detach "$env:UNSLOTH_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q --no-deps -e "$u"
          & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" typer rich pydantic pyyaml nest-asyncio structlog click
          & $py -m pip list
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_TORCH_KIND=$kind"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_TORCH_GPU=$gpu"
          & $py "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --require windows --out "$env:AMD_CI_WORK\out\host_torch.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Differential (GPU run)
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/zoo_pytest_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/zoo_win_tests.py" `
            --out-dir "$env:AMD_CI_WORK\out\w_a2x" `
            --python "$env:AMD_CI_PY" -- --diag --only-states base,head --timeout 300 --wall 1800 --tests tests/test_fused_linear.py::test_ce_rejects_invalid_label_smoothing tests/test_fused_linear.py::test_head_bias_shape_is_checked_and_broadcast_bias_works tests/test_fused_linear.py::test_bias_on_another_device_follows_the_head `
            tests/test_fused_linear.py::test_fp32_head_chunks_stay_within_the_budget tests/test_fused_linear.py::test_recompute_backward_tiles_follow_the_budget tests/test_fused_linear.py::test_tiled_forward_follows_the_budget `
            tests/test_fused_linear.py::test_fp16_odd_vocab_hidden_gradient_does_not_overflow tests/test_fused_linear.py::test_fp16_frozen_head_keeps_small_unit_gradients tests/test_fused_linear.py::test_scale_rows_retries_one_transient_failure `
            tests/test_fused_linear.py::test_trainable_head_long_context_backward tests/test_fused_linear.py::test_trainable_head_long_context_skips_the_rows_accumulator tests/test_fused_linear.py::test_exact_top_backward_keeps_fp32_gradient_accuracy `
            tests/test_fused_linear.py::test_trainable_head_grad_and_no_grad_passes_are_bit_identical tests/test_fused_linear.py::test_trainable_head_single_row_chunk_backward tests/test_fused_linear.py::test_mm_into_restores_the_reduction_flags `
            tests/test_fused_linear.py::test_opcheck_exact_top_outputs tests/test_fused_linear.py::test_frozen_head_entropy_gradient_keeps_fp32_recompute tests/test_fused_linear.py::test_ce_gradient_scale_is_not_rounded_to_half `
            tests/test_fused_linear.py::test_exact_top_backward_with_tied_maxima tests/test_fused_linear.py::test_fp16_without_fp32_output_gemms_does_not_overflow tests/test_fused_linear.py::test_softcap_keeps_the_fp32_recompute `
            tests/test_fused_linear.py::test_lazy_entropy_only_logged_keeps_the_forward_gradient tests/test_fused_linear.py::test_lazy_entropy_gradient_when_used tests/test_fused_linear.py::test_lazy_entropy_with_a_trainable_head_recomputes `
            tests/test_fused_linear.py::test_lazy_entropy_compiles_without_graph_breaks tests/test_fused_linear.py::test_small_batches_take_the_tile_and_stay_bit_identical tests/test_fused_linear.py::test_tile_cap_leaves_large_and_half_layouts_alone `
            tests/test_fused_linear.py::test_flash_min_rows_follows_the_card_size tests/test_fused_linear.py::test_triton_skipped_where_core_turns_compile_off tests/test_fused_linear.py::test_recompute_backward_reuses_forward_index
          Get-Content "$env:AMD_CI_WORK\out\w_a2x\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\w_a2x"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-w_a2x
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  w_assert:
    name: "zoo device-assert test alone (suspected runner killer), 540638e8 vs main"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    env:
      UNSLOTH_IS_PRESENT: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # LF worktrees for every git call in this job, so the range patch applies as generated.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "core.autocrlf"
      GIT_CONFIG_VALUE_0: "false"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "r7-w_assert"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_OS=[$env:RUNNER_OS] RUNNER_NAME=[$env:RUNNER_NAME] COMPUTERNAME=[$env:COMPUTERNAME]"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\states.py" `
            --repo "https://github.com/unslothai/unsloth-zoo" --pr 1866 --patch-base 540638e87137fdb2413873e62e415524901c77e0 --patch "$env:GITHUB_WORKSPACE\amd_ci\patches\zoo_540638e8_to_9910e542.diff" `
            --root "$env:AMD_CI_WORK" --out "$env:AMD_CI_WORK\out\states.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:AMD_CI_WORK\out\states.json"

      - name: Test environment
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          & $py -m pip install -q pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $kind = "rocm"
          & $py -m pip install --index-url "$env:AMD_TORCH_INDEX" "$env:AMD_TORCH_SPEC"
          if ($LASTEXITCODE -ne 0) {
            & $py -m pip install --index-url "$env:AMD_TORCH_INDEX" --extra-index-url "https://pypi.org/simple" "$env:AMD_TORCH_SPEC"
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::AMD ROCm torch for gfx1151 did not install; falling back to CPU torch (CPU RUN)"
            $kind = "cpu-fallback"
            & $py -m pip install --index-url "https://download.pytorch.org/whl/cpu" torch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $tv = & $py -c "import torch; print(torch.__version__)"
          $gpu = & $py -c "import torch; print(int(torch.cuda.is_available()))"
          & $py -c "import torch; print('torch', torch.__version__, 'hip', torch.version.hip, 'gpu', torch.cuda.is_available())"
          Set-Content -Path "$env:AMD_CI_WORK\constraints.txt" -Value "torch==$tv" -Encoding ASCII
          # zoo dependencies from the base checkout, torch held; plain list if a dependency has no Windows wheel.
          & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" "$env:AMD_CI_WORK\states\base"
          if ($LASTEXITCODE -ne 0) {
            & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" "transformers>=4.52.4,<=5.17.0" "trl>=0.18.2,<=1.15.0" "peft>=0.18.0" "accelerate>=0.34.1" "datasets>=3.4.1,<5.0.0" tyro einops packaging sentencepiece tqdm psutil numpy protobuf "huggingface_hub>=0.34.0" pillow regex msgspec typing_extensions filelock requests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $u = "$env:AMD_CI_WORK\unsloth"
          git clone -q --filter=blob:none "$env:UNSLOTH_REPO" "$u"
          git -C "$u" checkout -q --detach "$env:UNSLOTH_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q --no-deps -e "$u"
          & $py -m pip install -q -c "$env:AMD_CI_WORK\constraints.txt" typer rich pydantic pyyaml nest-asyncio structlog click
          & $py -m pip list
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_TORCH_KIND=$kind"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_TORCH_GPU=$gpu"
          & $py "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --require windows --out "$env:AMD_CI_WORK\out\host_torch.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Differential (GPU run)
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/zoo_pytest_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/zoo_win_tests.py" `
            --out-dir "$env:AMD_CI_WORK\out\w_assert" `
            --python "$env:AMD_CI_PY" -- --diag --only-states base,head --timeout 300 --wall 1800 --tests tests/test_fused_linear.py::test_ce_out_of_range_target_is_a_device_assert_on_cuda
          Get-Content "$env:AMD_CI_WORK\out\w_assert\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\w_assert"

      - uses: actions/upload-artifact@v4
