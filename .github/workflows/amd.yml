name: AMD DevLab PR595

on:
  push:
    branches: [amd-devlab-pr595]

permissions: {}

jobs:
  amd:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 60
    steps:
      - name: Setup, PR595 check and Vulkan load
        run: |
          set -u
          export PIP_CONFIG_FILE=/dev/null
          W="$RUNNER_TEMP/w"; mkdir -p $W/tmp $W/models
          export TMPDIR=$W/tmp PIP_CACHE_DIR=$W/pipcache
          python3 -m venv $W/venv; . $W/venv/bin/activate
          pip install -q --upgrade pip numpy structlog
          ls -d /opt/rocm* 2>/dev/null; cat /opt/rocm/.info/version 2>/dev/null || true
          export PIP_CONFIG_FILE=/dev/null
          pip install -q --index-url https://rocm.nightlies.amd.com/v2/gfx1151/ --extra-index-url https://pypi.org/simple "torch==2.9.1+rocm7.13.0a20260513" 2>&1 | tail -3
          python -c "import torch; print(torch.__version__, torch.version.hip, torch.cuda.is_available())"
          python -c "import torch; assert torch.cuda.is_available() and torch.version.hip"
          git clone -q --depth 1 -b main https://github.com/oobabooga/unsloth.git $W/main
          git clone -q --depth 1 -b rocm-free-vram https://github.com/oobabooga/unsloth.git $W/pr
          (cd $W/pr && git log --oneline -1)
          curl -sL https://raw.githubusercontent.com/oobabooga/unsloth/amd-devlab-pr595/probe.py -o $W/probe.py
          echo "##### idle"
          python $W/probe.py $W/main/studio/backend main
          python $W/probe.py $W/pr/studio/backend pr
          echo "##### Vulkan llama-server holding a model"
          TAG=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          curl -sL -o $W/llama.zip "https://github.com/ggml-org/llama.cpp/releases/download/$TAG/llama-$TAG-bin-ubuntu-vulkan-x64.zip"
          (cd $W && unzip -q llama.zip -d llama) ; LS=$(find $W/llama -name llama-server -type f | head -1); echo "llama-server: $LS"
          curl -sL -o $W/models/m.gguf "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
          ls -la $W/models
          LD_LIBRARY_PATH=$(dirname $LS) $LS -m $W/models/m.gguf -ngl 99 -c 8192 --port 18080 > $W/ls.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:18080/health >/dev/null && break; sleep 2; done
          grep -iE "vulkan|ggml_vulkan|model buffer|KV buffer|offloaded" $W/ls.log | head -15
          python $W/probe.py $W/main/studio/backend main+vulkan
          python $W/probe.py $W/pr/studio/backend pr+vulkan
          echo "##### HIP allocation of 4 GiB (torch) for comparison"
          python - <<'PY'
          import torch; MiB=1<<20
          f0,_=torch.cuda.mem_get_info(0); x=torch.empty(4<<30, dtype=torch.uint8, device="cuda"); x.fill_(1); torch.cuda.synchronize()
          f1,_=torch.cuda.mem_get_info(0); print(f"torch free before={f0//MiB} after 4GiB alloc={f1//MiB} MiB")
          PY
          kill %1 || true
