name: AMD DevLab PR595 pip debug

on:
  push:
    branches: [amd-devlab-pr595]

permissions: {}

jobs:
  amd:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 30
    steps:
      - name: Pip debug
        run: |
          W="$RUNNER_TEMP/w"; mkdir -p $W/tmp; export TMPDIR=$W/tmp
          cat /opt/rocm/.info/version 2>/dev/null; ls /opt/rocm/lib | grep -E "libamdhip64" | head -3
          env | grep -iE "^PIP_|^UV_|INDEX" || echo "no pip env"
          cat /etc/pip.conf ~/.pip/pip.conf ~/.config/pip/pip.conf 2>/dev/null || echo "no pip.conf"
          python3 -m venv $W/venv; . $W/venv/bin/activate
          pip config list -v 2>&1 | head
          python -c "import sys; print(sys.version)"
          echo "=== index listing gfx1151"
          curl -s https://rocm.nightlies.amd.com/v2/gfx1151/torch/ | grep -oE 'torch-[^"<]*cp312[^"<]*linux[^"<]*\.whl' | tail -5
          echo "=== pytorch rocm7.0 listing"
          curl -s https://download.pytorch.org/whl/rocm7.0/torch/ | grep -oE 'torch-[^"<#]*cp312[^"<#]*\.whl' | tail -3
          echo "=== verbose install from gfx1151"
          pip install --no-cache-dir --index-url https://rocm.nightlies.amd.com/v2/gfx1151/ torch 2>&1 | grep -iE "Looking in|Collecting|Downloading|Successfully|error|Using cached" | head -20
          python -c "import torch; print(torch.__version__, torch.version.hip, torch.cuda.is_available())"
