name: Repeat parallel browser checks with a batch deadline
'on':
  push:
    branches:
    - ci-daniel-ab-20261006
permissions:
  contents: read
jobs:
  browsers:
    name: Parallel browser batch deadline r${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: studio/frontend
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: unslothai/unsloth
        ref: c17ca646c7ccae1032cba26103c32a9b6d32c8bb
    - name: Apply candidate
      working-directory: ${{ github.workspace }}
      run: printf '%s' ''
        | base64 --decode | git apply
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Lockfile supply-chain audit (pre-install scan)
      working-directory: ${{ github.workspace }}
      run: python scripts/lockfile_supply_chain_audit.py
    - run: npm ci --ignore-scripts --no-fund --no-audit
    - name: Install alignment test browsers
      working-directory: ${{ github.workspace }}
      timeout-minutes: 5
      run: 'python -m pip install playwright==1.63.0

        python -m playwright install chromium firefox

        '
    - name: Composer icon alignment
      working-directory: ${{ github.workspace }}
      timeout-minutes: 3
      run: python tests/studio/playwright_composer_icons.py chromium firefox
    - name: Data settings deletion choices in Chromium and Firefox
      working-directory: ${{ github.workspace }}
      run: "mkdir -p logs\n# Each driver owns its Vite server, optimizer cache and report.\nPW_ENGINE=chromium PW_PORT=5420 PW_OUT=logs/data_settings_report.json \\\n  VITE_TEST_CACHE_DIR=\"$RUNNER_TEMP/vite-data-chromium\" \\\n  python tests/studio/playwright_data_settings.py > logs/data_settings_chromium.log 2>&1 &\nchromium_pid=$!\nPW_ENGINE=firefox PW_PORT=5421 PW_OUT=logs/data_settings_firefox_report.json \\\n  VITE_TEST_CACHE_DIR=\"$RUNNER_TEMP/vite-data-firefox\" \\\n  python tests/studio/playwright_data_settings.py > logs/data_settings_firefox.log 2>&1 &\nfirefox_pid=$!\nfailed=0\nwait \"$chromium_pid\" || failed=1\nwait \"$firefox_pid\" || failed=1\nfor engine in chromium firefox; do\n  echo \"::group::Data settings: $engine\"\n  cat \"logs/data_settings_$engine.log\" || failed=1\n  echo \"::endgroup::\"\ndone\nexit \"$failed\"\n"
    - name: Upload alignment failure artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: frontend-batch-${{ matrix.rep }}
        path: 'logs/playwright-composer-icons

          logs/data_settings*

          '
        retention-days: 1
        if-no-files-found: ignore
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
        - 3
        - 4
