name: Paired native thread comparison on identical hardware
'on':
  push:
    branches:
    - ci-shell-ab-20261006
permissions:
  contents: read
jobs:
  paired:
    name: Paired Studio native threads ${{ matrix.order }} r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          order: default-first
          rep: 1
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          order: default-first
          rep: 2
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          order: limited-first
          rep: 1
        - shard: studio
          selection: tests/studio tests/python --ignore=tests/studio/install --ignore=tests/studio/studiobench --ignore=tests/studio/load_freeze --ignore=tests/studio/test_hardware_dispatch_matrix.py --ignore=tests/studio/test_is_mlx_dispatch_gate.py --ignore=tests/studio/test_xpu_spoof_pipeline.py --ignore=tests/studio/test_mlx_context_platform_matrix.py
          order: limited-first
          rep: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: unslothai/unsloth
        ref: c17ca646c7ccae1032cba26103c32a9b6d32c8bb
    - name: Prepare measurements
      run: 'mkdir -p "$RUNNER_TEMP/results"

        lscpu

        free -h'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - name: Install uv (for tests/python/* sandboxed venvs)
      run: pip install uv
    - name: Install deps (shared shape with backend pytest job)
      run: "python -m pip install --upgrade pip\npip install -r studio/backend/requirements/studio.txt\npip install \\\n  python-multipart aiofiles sqlalchemy cryptography psutil \\\n  pyyaml jinja2 mammoth unpdf requests typer \\\n  'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx\n# pytest-timeout: the --timeout flag on the pytest step below. Same reason as the\n# backend pytest job -- without it a test that never returns is reported as the\n# job being \"cancelled\", naming nothing.\n# torchvision: unsloth_zoo.vision_utils imports it at module scope.\npip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \\\n  'torch>=2.4,<2.11' 'torchvision<0.26' 'torchaudio<2.11'\n# Tracks pyproject.toml's cap. sentence-transformers rides the transformers pin rather than a separate install, so\n# resolving it cannot bump transformers past the ceiling. It is an extra, not a core\n# dependency, and tests/test_st_modules_json_trust_gate.py\
        \ skips without it, so\n# installing it here is what makes that gate run in this shard instead of skipping.\n# version-compat-ci's zoo-imports job runs the same file against the pinned\n# transformers matrix; this shard adds the core dependency set, where discovery\n# picks the file up and the importorskip would otherwise skip it for good.\npip install 'transformers>=4.51,<=5.17.0' sentence-transformers\n# bitsandbytes: hard import in unsloth/models/_utils.py. Recent\n# versions ship a CPU build that imports cleanly on Linux.\npip install 'bitsandbytes>=0.45'\n# zoo from git main (needed by the conftest preload), with deps so triton is installed.\nfor attempt in 1 2 3; do\n  if pip install \"unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo@ea59995addd5ddbe5d6cedc32d6deb51eebbac1e\"; then\n    break\n  fi\n  [ \"$attempt\" -eq 3 ] && { echo \"::error::unsloth_zoo install failed after 3 attempts\"; exit 1; }\n  sleep $((5 * attempt))\ndone\npip install -e . --no-deps\n"
    - name: Install the pinned ruff (formatter fixed-point guard)
      run: "pin=\"$(python -c 'import sys; sys.path.insert(0, \"scripts\"); import run_ruff_format as r; print(r.pinned_ruff_version(r.CONFIG.read_text(encoding = \"utf-8\")) or \"\")')\"\nif [ -z \"$pin\" ]; then\n  echo \"::error::.pre-commit-config.yaml no longer pins a ruff for ruff-format-with-kwargs\"\n  exit 1\nfi\npip install \"ruff==$pin\"\n"
    - name: Measure both thread settings on the same runner
      env:
        PYTHONPATH: ${{ github.workspace }}/studio
        UNSLOTH_COMPILE_DISABLE: '1'
        ORDER: ${{ matrix.order }}
      run: "cat > \"$RUNNER_TEMP/paired.py\" <<'PYBENCH'\nimport os, pathlib, subprocess, time, json, signal\ncommand='timeout --signal=INT --kill-after=60 2100 \\\\\\npython -m pytest ${{ matrix.selection }} -q --tb=short -n 4 --dist loadgroup --timeout=330 \\\\\\n  -m \\'not server and not e2e\\' --junitxml=\"$RUNNER_TEMP/results/6.xml\" --durations=30\\n'\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'results'\norder=['default','limited'] if os.environ['ORDER']=='default-first' else ['limited','default']\nrows=[]\nfor variant in order:\n    env=dict(os.environ)\n    if variant=='limited':env.update(OMP_NUM_THREADS='1',MKL_NUM_THREADS='1',OPENBLAS_NUM_THREADS='1',NUMEXPR_NUM_THREADS='1')\n    cmd=command.replace('/results/6.xml','/results/'+variant+'.xml')\n    start=time.monotonic();print('START',variant,flush=True)\n    with (out/(variant+'.log')).open('w') as log:\n        proc=subprocess.Popen(['bash','-e','-o','pipefail','-c',cmd],env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n\
        \        try:rc=proc.wait(timeout=2300)\n        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid,signal.SIGKILL);proc.wait();rc=124\n    row=dict(variant=variant,seconds=time.monotonic()-start,rc=rc);rows.append(row)\n    (out/'summary.json').write_text(json.dumps(dict(order=order,results=rows),indent=2))\n    print('::group::'+variant,flush=True)\n    print((out/(variant+'.log')).read_text(errors='replace'),flush=True)\n    print('::endgroup::',flush=True);print(json.dumps(row),flush=True)\nraise SystemExit(any(row['rc'] for row in rows))\n\nPYBENCH\npython \"$RUNNER_TEMP/paired.py\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: native-paired-${{ matrix.order }}-${{ matrix.rep }}
        path: ${{ runner.temp }}/results
        retention-days: 1
