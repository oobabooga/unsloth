        \ as d\\nfrom core.inference import diffusion_memory as dm\\nfrom core.inference.diffusion_attention import available_sdpa_kernels\\\
        nfrom core.inference.diffusion_device import resolve_diffusion_device_target\\n\\ntarget = resolve_diffusion_device_target()\\\
        nemit(\"target\", target=target.as_public_dict(), studio_sdpa_probe=available_sdpa_kernels(target))\\nprops = torch.cuda.get_device_properties(0)\\\
        nif args.free_gib:\\n    cap = int(args.free_gib * 2**30)\\n    torch.cuda.set_per_process_memory_fraction(cap / props.total_memory,\
        \ 0)\\n\\n    def virtual_memory(backend):\\n        physical_free, _ = torch.cuda.mem_get_info()\\n        return\
        \ min(physical_free, max(0, cap - torch.cuda.memory_reserved())) // 2**20, 20 * 1024, \"discrete_vram\"\\n\\n    dm._cuda_memory\
        \ = virtual_memory\\n    emit(\"synthetic_capacity\", total_gib=20, free_gib=args.free_gib)\\nfrom dataclasses import\
        \ replace\\norig_plan = d.plan_diffusion_memory\\n\\n\\ndef record_plan(**kw):\\n    plan = orig_plan(**kw)\\n   \
        \ if args.placement == \"auto-tiled\":\\n        plan = replace(plan, vae_tiling=True)\\n    elif args.placement in\
        \ (\"resident\", \"resident-tiled\"):\\n        plan = replace(plan, offload_policy=\"none\", stream_text_encoders=False,\
        \ stream_transformer=False,\\n                       vae_tiling=args.placement.endswith(\"tiled\"), resident_transformer_mib=None,\\\
        n                       resident_text_encoder_mib=None, reasons=(\"experimental forced resident placement\",))\\n\
        \    elif args.placement == \"model\":\\n        plan = replace(plan, offload_policy=\"model\", vae_tiling=True, stream_text_encoders=False,\\\
        n                       stream_transformer=False, resident_transformer_mib=None, resident_text_encoder_mib=None,\\\
        n                       reasons=(\"experimental whole-component placement\",))\\n    emit(\"plan\", plan=plan.as_public_dict())\\\
        n    return plan\\n\\n\\nd.plan_diffusion_memory = record_plan\\nproc = psutil.Process()\\n\\n\\ndef mem():\\n   \
        \ return dict(alloc=torch.cuda.memory_allocated(), reserved=torch.cuda.memory_reserved(),\\n                peak=torch.cuda.max_memory_allocated(),\
        \ rss=proc.memory_info().rss)\\n\\n\\nbackend = d.DiffusionBackend()\\ntry:\\n    t0 = time.perf_counter()\\n    backend.begin_load(\"\
        unsloth/Qwen-Image-2.1-GGUF\", gguf_filename=\"qwen-image-2.1-Q4_K_M.gguf\",\\n                       family_override=\"\
        qwen-image-2.1\", memory_mode=args.memory_mode,\\n                       **({} if args.te == \"auto\" else {\"text_encoder_quant\"\
        : args.te}))\\n    deadline = time.monotonic() + 3000\\n    while True:\\n        pr = backend.load_progress()\\n\
        \        if pr.get(\"error\"):\\n            raise RuntimeError(pr[\"error\"])\\n        if pr.get(\"phase\") == \"\
        ready\":\\n            break\\n        if time.monotonic() > deadline:\\n            raise TimeoutError(\"load > 50\
        \ min\")\\n        time.sleep(10)\\n    emit(\"loaded\", seconds=time.perf_counter() - t0, status=backend.status(),\
        \ mem=mem())\\n    import functools\\n    pipe = backend._state.pipe\\n    phase_rows = []\\n    def instrument(obj,\
        \ method, phase):\\n        original = getattr(obj, method)\\n        @functools.wraps(original)\\n        def measured(*a,\
        \ **kw):\\n            torch.cuda.synchronize()\\n            torch.cuda.reset_peak_memory_stats()\\n            before\
        \ = mem()\\n            began = time.perf_counter()\\n            try:\\n                return original(*a, **kw)\\\
        n            finally:\\n                torch.cuda.synchronize()\\n                row = dict(phase=phase, seconds=time.perf_counter()-began,\\\
