        n        import torch\\n\\n        device = _indexed_cuda_device(\\n            str(getattr(target, \"torch_device\"\
        , None) or getattr(target, \"device\", None) or \"\")\\n        )\\n        dtype = getattr(target, \"dtype\", None)\\\
        n        if dtype not in (torch.float16, torch.bfloat16):\\n            # The fused kernels are half precision only;\
