name: Validate consolidated security failure reporting
'on':
  push:
    branches:
    - ci-zoo-ab-20261006
permissions:
  contents: read
jobs:
  lint-failure-probe:
    name: Injected lint failure must still run security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Harden runner (egress block)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: block
        disable-sudo: true
        allowed-endpoints: 'api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443 download.pytorch.org:443 download-r2.pytorch.org:443

          '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: unslothai/unsloth-zoo
        ref: ea59995addd5ddbe5d6cedc32d6deb51eebbac1e
        persist-credentials: false
    - name: Apply candidate
      run: printf '%s' ''
        | base64 --decode | git apply
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pytest + PyYAML
      run: pip install pytest==9.0.3 pyyaml==6.0.2
    - name: Run workflow-trigger lint
      id: trigger-lint
      continue-on-error: true
      run: 'python3 scripts/lint_workflow_triggers.py

        echo "Injecting a lint failure to test enforcement"

        exit 7'
    - name: Install unsloth_zoo so tests/security can import what it guards
      run: "pip install --index-url https://download.pytorch.org/whl/cpu \\\n  \"torch>=2.4.0,<2.15.0\"\npip install -e .[core]\n"
    - name: Run security regression tests
      env:
        UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
      run: python3 -m pytest tests/security -v --junitxml="$RUNNER_TEMP/security.xml"
    - name: Enforce workflow-trigger lint result
      if: ${{ !cancelled() && steps.trigger-lint.outcome != 'success' }}
      run: 'echo "::error::Workflow-trigger lint did not pass"

        exit 1

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: security-injected-failure
        path: ${{ runner.temp }}/security.xml
        retention-days: 1
        if-no-files-found: ignore
    continue-on-error: true
