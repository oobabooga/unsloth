        \        torch.cuda.synchronize()\\n        for j, im in enumerate(res[\"images\"]):\\n            im.save(out / f\"\
        {args.case}-{i}-{j}.png\")\\n        emit(\"render\", index=i, seconds=time.perf_counter() - t1, mem=mem(), status=backend.status(),\\\
        n             phase_seconds={ph:sum(r[\"seconds\"] for r in phase_rows if r[\"phase\"]==ph) for ph in (\"encode\"\
        ,\"denoise\",\"decode\")},\\n             peak_allocated=max([r[\"after\"][\"peak\"] for r in phase_rows] or [torch.cuda.max_memory_allocated()]))\\\
        n    emit(\"complete\", success=True)\\nexcept Exception as exc:  # noqa: BLE001\\n    emit(\"failure\", error=repr(exc)[:2000],\
        \ traceback=traceback.format_exc()[-8000:], mem=None)\\n    raise\\nfinally:\\n    try:\\n        backend.unload()\\\
        n    except Exception:  # noqa: BLE001\\n        pass\\n',encoding=\"utf-8\")\n(root/\"sdpa_probe.py\").write_text('\"\
        \"\"One SDPA case per process: a failed fused launch poisons the HIP context, so cases must not share one.\"\"\"\\\
        nimport json\\nimport os\\nimport sys\\nimport traceback\\n\\ncase = sys.argv[1]\\nout_path = sys.argv[2]\\nos.environ.setdefault(\"\
        TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL\", \"1\")\\nimport torch\\nimport torch.nn.functional as F\\nfrom torch.nn.attention\
        \ import SDPBackend, sdpa_kernel\\n\\nBACKENDS = {\\n    \"default\": None,\\n    \"flash\": SDPBackend.FLASH_ATTENTION,\\\
        n    \"efficient\": SDPBackend.EFFICIENT_ATTENTION,\\n    \"math\": SDPBackend.MATH,\\n}\\n\\n\\ndef shapes(name):\\\
        n    g = torch.Generator(device=\"cuda\").manual_seed(0)\\n    r = lambda *s, dt=torch.bfloat16: torch.randn(*s, device=\"\
        cuda\", dtype=dt, generator=g)\\n    if name == \"studio_probe\":  # diffusion_attention._probe_sdpa_kernels\\n  \
        \      q = torch.zeros((1, 2, 8, 64), device=\"cuda\", dtype=torch.float16)\\n        return dict(q=q, k=q, v=q)\\\
        n    if name == \"dit_bhsd\":  # Qwen-Image-2.1 joint attention at 1024^2: 4096 image + ~256 text tokens, 32 x 128\\\
        n        return dict(q=r(1, 32, 4352, 128), k=r(1, 32, 4352, 128), v=r(1, 32, 4352, 128))\\n    if name == \"dit_bshd_view\"\
