name: AMD Qwen placement and attention measurements
'on':
  push:
    branches:
    - amd-qwen-placement-20261008
permissions: {}
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: Windows
          python: python
        - os: Linux
          python: python3
    runs-on:
    - self-hosted
    - ${{ matrix.os }}
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 300
    env:
      STACK: multiarch-7.14.0
      UNSLOTH_IS_PRESENT: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      HF_ENDPOINT: https://huggingface.co
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
    - name: Environment
      shell: ${{ matrix.python }} -X utf8 {0}
      run: "\nimport os,sys,subprocess,platform\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'qwen-placement'\n\
        for name in ['out','tmp','cache/huggingface','cache/torch','cache/pip','studio','miopen/db','miopen/kernels']:\n \
        \ (root/name).mkdir(parents=True,exist_ok=True)\nenv={'WORK_ROOT':str(root),'TMPDIR':str(root/'tmp'),'TEMP':str(root/'tmp'),'TMP':str(root/'tmp'),'HF_HOME':str(root/'cache/huggingface'),'HUGGINGFACE_HUB_CACHE':str(root/'cache/huggingface/hub'),'TORCH_HOME':str(root/'cache/torch'),'PIP_CACHE_DIR':str(root/'cache/pip'),'UNSLOTH_HOME':str(root/'unsloth'),'UNSLOTH_STUDIO_HOME':str(root/'unsloth/studio'),'PYTHONPATH':str(root/'code/studio/backend'),'MIOPEN_USER_DB_PATH':str(root/'miopen/db'),'MIOPEN_CUSTOM_CACHE_DIR':str(root/'miopen/kernels')}\n\
        os.environ.update(env)\nwith open(os.environ['GITHUB_ENV'],'a') as f:\n  for k,v in env.items(): f.write(k+'='+v+'\\\
        n')\ndef run(cmd,**kw):\n  print('RUN',cmd,flush=True); return subprocess.run(cmd,check=True,**kw)\nwith (root/'out/host.txt').open('w')\
        \ as f:\n  f.write(platform.platform()+'\\n')\n  if sys.platform=='win32': subprocess.run(['powershell','-NoProfile','-Command','Get-CimInstance\
        \ Win32_VideoController | Format-List Name,DriverVersion; Get-CimInstance Win32_OperatingSystem | Format-List Caption,TotalVisibleMemorySize'],stdout=f,stderr=subprocess.STDOUT)\n\
        \  else: subprocess.run(['bash','-c','uname -a; lscpu; free -h; df -h'],stdout=f,stderr=subprocess.STDOUT)\nrun(['git','init',str(root/'code')]);\
        \ run(['git','-C',str(root/'code'),'config','core.autocrlf','false'])\nrun(['git','-C',str(root/'code'),'remote','add','origin','https://github.com/unslothai/unsloth.git'])\n\
        run(['git','-C',str(root/'code'),'fetch','--depth=1','origin','0aaea8b585b080a590bfa632d37d5d563064327f']); run(['git','-C',str(root/'code'),'checkout','--detach','FETCH_HEAD'])\n\
        run([sys.executable,'-m','venv',str(root/'venv')])\npy=str(root/('venv/Scripts/python.exe' if sys.platform=='win32'\
        \ else 'venv/bin/python'))\nrun([py,'-m','pip','install','--upgrade','pip'])\nstack=os.environ['STACK']\nif stack=='multiarch-7.14.0':\n\
        \  specs=['torch[device-gfx1151]==2.11.0+rocm7.14.0','torchvision[device-gfx1151]==0.26.0+rocm7.14.0','torchaudio==2.11.0+rocm7.14.0']\n\
        \  idx='https://repo.amd.com/rocm/whl-multi-arch/'\n  cons=['torch==2.11.0+rocm7.14.0','torchvision==0.26.0+rocm7.14.0','torchaudio==2.11.0+rocm7.14.0']\n\
        else:\n  specs=['torch==2.11.0+rocm7.13.0','torchvision==0.26.0+rocm7.13.0']\n  idx='https://repo.amd.com/rocm/whl/gfx1151/'\n\
        \  cons=['torch==2.11.0+rocm7.13.0','torchvision==0.26.0+rocm7.13.0']\nrun([py,'-m','pip','install','--index-url',idx,'--extra-index-url','https://pypi.org/simple',*specs])\n\
        c=root/'torch-constraints.txt'; c.write_text('\\n'.join(cons)+'\\n')\nrq=root/'code/studio/backend/requirements'\n\
        run([py,'-m','pip','install','-c',str(c),'-r',str(rq/'studio.txt'),'-r',str(rq/'diffusers-pin.txt')])\nrun([py,'-m','pip','install','-c',str(c),'-r',str(rq/'diffusers-main.txt')])\n\
        run([py,'-m','pip','install','-c',str(c),'transformers==5.5.0','accelerate>=1.0','peft>=0.18','sentencepiece','psutil','protobuf','scipy','einops','Pillow','pyyaml','safetensors','tyro','msgspec','wheel'])\n\
        run([py,'-m','pip','install','--no-deps','unsloth-zoo>=2026.9.9'])\nrun([py,'-m','pip','install','--no-deps',str(root/'code')])\n\
        run([py,'-m','pip','install','--no-deps','torchao==0.17.0'])\nwith (root/'out/pip-freeze.txt').open('w') as f: run([py,'-m','pip','freeze'],stdout=f)\n\
        run([py,'-c',\"import main, torch; print(torch.__version__, torch.version.hip, torch.cuda.get_device_properties(0));\
        \ x=torch.randn((256,256),device='cuda',dtype=torch.bfloat16); print((x@x).sum().item()); from core.inference.diffusion\
        \ import DiffusionBackend; from diffusers import QwenImage21Pipeline; print('IMPORTS PASSED')\"])\n\n(root/\"generation_probe.py\"\
        ).write_text('\"\"\"Studio\\'s own DiffusionBackend: Qwen-Image-2.1 GGUF Q4_K_M, Auto, optionally under a simulated\
        \ 20 GB discrete card.\"\"\"\\nimport argparse\\nimport json\\nimport os\\nimport sys\\nimport threading\\nimport\
        \ time\\nimport traceback\\nfrom pathlib import Path\\n\\np = argparse.ArgumentParser()\\np.add_argument(\"--placement\"\
        , choices=[\"auto\",\"auto-tiled\",\"resident\",\"resident-tiled\",\"model\"], default=\"auto\")\\np.add_argument(\"\
        --query-chunking\", default=\"auto\")\\np.add_argument(\"--case\", required=True)\\np.add_argument(\"--output\", required=True)\\\
        np.add_argument(\"--free-gib\", type=float, default=0)\\np.add_argument(\"--te\", default=\"auto\")\\np.add_argument(\"\
        --steps\", type=int, default=4)\\np.add_argument(\"--repeats\", type=int, default=2)\\np.add_argument(\"--size\",\
        \ type=int, default=1024)\\np.add_argument(\"--serialize\", action=\"store_true\")\\np.add_argument(\"--disable-fused-sdpa\"\
        , action=\"store_true\")\\np.add_argument(\"--memory-mode\", default=\"auto\")\\np.add_argument(\"--env\", action=\"\
        append\", default=[])\\nargs = p.parse_args()\\nout = Path(args.output)\\nout.mkdir(parents=True, exist_ok=True)\\\
        nlock = threading.Lock()\\n\\n\\ndef emit(event, **fields):\\n    line = json.dumps(dict(event=event, case=args.case,\
