name: Zoo exact workflows and security consolidation
'on':
  push:
    branches:
    - ci-zoo-ab-20261006
permissions:
  contents: read
jobs:
  cpu:
    name: Exact Zoo CPU candidate r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Harden runner (audit)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: unslothai/unsloth-zoo
        ref: ea59995addd5ddbe5d6cedc32d6deb51eebbac1e
        persist-credentials: false
    - name: Apply candidate
      run: printf '%s' ''
        | base64 --decode | git apply
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install runtime + test deps
      run: "python -m pip install --upgrade pip\npip install --index-url https://download.pytorch.org/whl/cpu \\\n  \"torch>=2.4.0,<2.11.0\"\npip install -e .[core]\npip install --no-deps \"unsloth @ git+https://github.com/unslothai/unsloth@c17ca646c7ccae1032cba26103c32a9b6d32c8bb\" || true\npip install pytest==9.0.3 pyyaml==6.0.2\n# gguf is not a dependency of the zoo, and unsloth goes in --no-deps, so\n# without this every test that reads a GGUF back skips at\n# `pytest.importorskip(\"gguf\")`: 73 of them, the whole post conversion\n# verification file, silently and with the job still green.\npip install gguf\n# For the planner compressed-tensors gate; torch cap repeated or a newer release swaps in CUDA torch.\npip install compressed-tensors \"torch>=2.4.0,<2.11.0\"\n"
    - name: pytest CPU gates (two process lanes)
      run: "set -euo pipefail\nlogs=$(mktemp -d \"$RUNNER_TEMP/zoo-cpu-gates.XXXXXX\")\nrun_gate() {\n  local name=$1 rc=0\n  shift\n  \"$@\" > \"$logs/$name.log\" 2>&1 || rc=$?\n  printf '%s\\n' \"$rc\" > \"$logs/$name.status\"\n}\n# Two lanes on one runner. The behavioral suite overlaps the smaller\n# gates; each pytest command still owns a fresh Python process.\nbehavioral() {\n  run_gate behavioral python -m pytest \\\n    tests/test_ci_cpu_gate_results.py \\\n    tests/test_top_level_imports_are_declared.py \\\n    tests/test_training_utils_use_cache.py \\\n    tests/test_unsloth_train_scheduler_kwargs.py \\\n    tests/test_loss_normalization_contract.py \\\n    tests/test_mlx_finetune_last_n_layers.py \\\n    tests/test_mlx_double_quant_reject.py \\\n    tests/test_mlx_incomplete_config.py \\\n    tests/test_mlx_incomplete_config_vlm.py \\\n    tests/test_mlx_adam_epsilon.py \\\n    tests/test_mlx_optimizer_torch_parity.py \\\n    tests/test_hf_xet_fallback.py \\\n    tests/test_hf_xet_fallback_blob_scoped_redownload.py\
        \ \\\n    tests/test_llama_cpp_install_consent.py \\\n    tests/test_llama_cpp_consent_platforms.py \\\n    tests/test_converter_source_staging.py \\\n    tests/test_get_transformers_model_type_empty.py \\\n    tests/test_train_on_responses_list_labels.py \\\n    tests/test_mlx_preference.py \\\n    tests/test_mlx_trainer_internals.py \\\n    tests/test_mlx_arrays_cache_advance.py \\\n    tests/test_prepare_model_for_training_embedding_lora.py \\\n    tests/test_mlx_quantized_optimizer_routing.py \\\n    tests/test_mlx_embedding_guards.py \\\n    tests/test_fp16_emulation.py \\\n    tests/test_check_hf_model_exists_transport_errors.py \\\n    tests/test_hub_transport_errors_single_segment.py \\\n    tests/test_quant_status_transport_errors.py \\\n    tests/test_local_base_model_resolution_offline.py \\\n    tests/test_local_fp8_base_offline_resolution.py \\\n    tests/test_local_4bit_merge_offline_resolution.py \\\n    tests/test_gated_and_offline_config_classification.py \\\n  \
        \  tests/test_find_common_token_ids_no_match.py \\\n    tests/test_vllm_direct_lora_loading.py \\\n    tests/test_vllm_flashinfer_block_reversible.py \\\n    tests/test_vllm_flashinfer_survives_spawn.py \\\n    tests/test_vllm_weights_memory_usage.py \\\n    tests/test_sft_prepare_dataset_double_bos.py \\\n    tests/test_moe_preprocess_weight_transpose.py \\\n    tests/test_relative_imports_resolve.py \\\n    tests/test_grpo_mask_truncated_rows.py \\\n    tests/test_deepseek_v41_compile_entries.py \\\n    tests/test_moe_weight_preprocessor_registry_shared.py \\\n    tests/test_moe_triton_down_lora_roworder.py \\\n    tests/test_moe_router_not_a_lora_target.py \\\n    tests/test_moe_router_under_moe_block_not_quantized.py \\\n    tests/test_moe_stacked_expert_lora_reaches_forward.py \\\n    tests/test_bnb_expert_stack_slicing.py \\\n    tests/test_bnb_expert_stack_slicing_cpu.py \\\n    tests/test_bnb_expert_stack_merge_slicing.py \\\n    tests/test_fp8_expert_dequant_tile_limit.py\
        \ \\\n    tests/test_gpt_oss_mxfp4_blackwell_value_layout.py \\\n    tests/test_python39_compatibility.py \\\n    tests/test_checkpoint_modes.py \\\n    tests/test_gc_rewriter_bound_keywords.py \\\n    tests/test_wheel_top_level_packages.py \\\n    tests/test_vision_url_ssrf_guard.py \\\n    tests/test_vision_url_dns_rebinding.py \\\n    tests/test_merge_index_weight_map_traversal.py \\\n    tests/test_gguf_converter_child_env.py \\\n    tests/test_responses_only_last_turn_header.py \\\n    tests/test_gguf_post_conversion_validation.py \\\n    tests/test_mtp_config_reconcile.py \\\n    tests/test_llama_cpp_converter_scan.py \\\n    tests/test_compiled_cache_fail_closed.py \\\n    tests/test_forced_float32_lora_forward_result_dtype.py \\\n    tests/test_inductor_codegen_fallback.py \\\n    tests/test_inductor_single_compile_worker.py \\\n    tests/test_eager_fallback_latch.py \\\n    tests/test_recompile_limit_fallback.py \\\n    tests/test_checkpoint_compile_mix.py \\\n    tests/test_disabled_hook_graph_break.py\
        \ \\\n    tests/test_missing_parent_package_is_drift.py \\\n    tests/test_sibling_imports_do_not_go_through_a_tests_package.py \\\n    tests/test_hip_bf16_offload_dtype.py \\\n    tests/test_offload_recompute_dtype.py \\\n    tests/test_disabled_hook_checkpoint_guard.py \\\n    tests/test_conftest_module_leak_gate.py \\\n    tests/test_compiled_cache_collective.py \\\n    tests/test_gpt_oss_matmul_ogs_for.py \\\n    tests/test_compiled_cache_collective_gloo.py \\\n    tests/test_undefined_name_gate.py \\\n    tests/test_safe_serialization_none.py \\\n    tests/test_published_version_window.py \\\n    tests/test_device_map_planner_compressed_tensors.py \\\n    tests/test_gemma3n_kv_sharing_without_cache.py \\\n    tests/test_gemma3n_rmsnorm_with_scale.py \\\n    tests/test_mlx_gkd_guards.py \\\n    tests/test_output_collector_compile.py \\\n    -v\n}\nother_gates() {\n  run_gate security python -m pytest tests/security -v\n  run_gate mlx-adapters python -m pytest tests/test_mlx_save_lora_adapters_filter.py\
        \ -v\n  run_gate mlx-export python -m pytest tests/test_mlx_save_export_regressions.py -v\n  run_gate mlx-export-edges python -m pytest tests/test_mlx_save_export_edge_cases.py -v\n  run_gate mlx-moe-export python -m pytest tests/test_mlx_moe_gguf_export_invariants.py -v\n  run_gate tokens python -m pytest tests/test_add_new_tokens_padded_vocab.py -v\n  run_gate cpu-advisory python -m pytest    tests/test_mlx_module_exports.py    tests/test_rl_replacements_cpu.py    tests/test_temporary_patches_imports.py    tests/test_zoo_history_regressions.py    tests/test_pypi_version_sync.py    -v\n}\nbehavioral &\nbehavioral_pid=$!\nother_gates &\nother_pid=$!\nfailed=0\nwait \"$behavioral_pid\" || failed=1\nwait \"$other_pid\" || failed=1\nfor name in security behavioral mlx-adapters mlx-export mlx-export-edges mlx-moe-export tokens cpu-advisory; do\n  echo \"::group::$name\"\n  cat \"$logs/$name.log\" || failed=1\n  rc=$(cat \"$logs/$name.status\" 2>/dev/null) || rc=missing\n  if [ \"$rc\"\
        \ != 0 ]; then\n    # Preserve the pre-existing continue-on-error on these CPU tests.\n    if [ \"$name\" = cpu-advisory ] && [ \"$rc\" != missing ]; then\n      echo \"::warning::$name exited $rc\"\n    else\n      echo \"::error::$name exited $rc\"\n      failed=1\n    fi\n  fi\n  echo \"::endgroup::\"\ndone\nexit \"$failed\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: zoo-exact-${{ matrix.rep }}
        path: ${{ runner.temp }}/zoo-cpu-gates.*
        retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
  security-old:
    name: security-old r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Harden runner (egress block)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: block
        disable-sudo: true
        allowed-endpoints: 'api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443 download.pytorch.org:443 download-r2.pytorch.org:443

          '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: unslothai/unsloth-zoo
        ref: ea59995addd5ddbe5d6cedc32d6deb51eebbac1e
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pytest + PyYAML
      run: pip install pytest==9.0.3 pyyaml==6.0.2
    - name: Install unsloth_zoo so tests/security can import what it guards
      run: "pip install --index-url https://download.pytorch.org/whl/cpu \\\n  \"torch>=2.4.0,<2.15.0\"\npip install -e .[core]\n"
    - name: Run security regression tests
      env:
        UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
      run: python3 -m pytest tests/security -v --junitxml="$RUNNER_TEMP/security.xml"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: security-old-${{ matrix.rep }}
        path: ${{ runner.temp }}/security.xml
        retention-days: 1
        if-no-files-found: ignore
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
  lint-old:
    name: lint-old r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Harden runner (egress block)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: block
        disable-sudo: true
        allowed-endpoints: 'api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443

          '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: unslothai/unsloth-zoo
        ref: ea59995addd5ddbe5d6cedc32d6deb51eebbac1e
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install PyYAML
      run: pip install pyyaml==6.0.2
    - name: Run workflow-trigger lint
      run: python3 scripts/lint_workflow_triggers.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: lint-old-${{ matrix.rep }}
        path: ${{ runner.temp }}/security.xml
        retention-days: 1
        if-no-files-found: ignore
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
  security-combined:
    name: security-combined r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Harden runner (egress block)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: block
        disable-sudo: true
        allowed-endpoints: 'api.github.com:443 github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443 download.pytorch.org:443 download-r2.pytorch.org:443

          '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: unslothai/unsloth-zoo
        ref: ea59995addd5ddbe5d6cedc32d6deb51eebbac1e
        persist-credentials: false
    - name: Apply candidate
      run: printf '%s' ''
        | base64 --decode | git apply
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pytest + PyYAML
      run: pip install pytest==9.0.3 pyyaml==6.0.2
    - name: Run workflow-trigger lint
      id: trigger-lint
      continue-on-error: true
      run: python3 scripts/lint_workflow_triggers.py
    - name: Install unsloth_zoo so tests/security can import what it guards
      run: "pip install --index-url https://download.pytorch.org/whl/cpu \\\n  \"torch>=2.4.0,<2.15.0\"\npip install -e .[core]\n"
    - name: Run security regression tests
      env:
        UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
      run: python3 -m pytest tests/security -v --junitxml="$RUNNER_TEMP/security.xml"
    - name: Enforce workflow-trigger lint result
      if: ${{ !cancelled() && steps.trigger-lint.outcome != 'success' }}
      run: 'echo "::error::Workflow-trigger lint did not pass"

        exit 1

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: security-combined-${{ matrix.rep }}
        path: ${{ runner.temp }}/security.xml
        retention-days: 1
        if-no-files-found: ignore
    strategy:
      fail-fast: false
      matrix:
        rep:
        - 1
        - 2
