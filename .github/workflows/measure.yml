        \ Any) -> Optional[tuple[str, ...]]:\\n    \"\"\"The fused SDPA backends that raise or disagree with math on ``device``;\
        \ None when math itself fails.\"\"\"\\n    import torch\\n    import torch.nn.functional as F\\n    from torch.nn.attention\
        \ import SDPBackend, sdpa_kernel\\n\\n    # The denoiser\\'s non-causal head-128 attention, a text encoder\\'s causal\
