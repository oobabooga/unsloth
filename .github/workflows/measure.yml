        - shard: rest
          selection: tests/ --ignore=tests/studio --ignore=tests/python --ignore=tests/qlora --ignore=tests/saving --ignore=tests/utils --ignore=tests/sh --ignore=tests/vllm_compat --ignore=tests/version_compat --deselect tests/test_model_registry.py::test_model_registration --deselect tests/test_model_registry.py::test_all_model_registration
