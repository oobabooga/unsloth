name: CI consolidation measurements
'on':
  push:
    branches:
    - ci-daniel-ab-20261006
permissions:
  contents: read
jobs:
  zoo:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant:
        - serial
        - parallel
        rep:
        - 1
        - 2
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VARIANT: ${{ matrix.variant }}
      BENCH_KIND: zoo
    name: Zoo CPU gates ${{ matrix.variant }} r${{ matrix.rep }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: unslothai/unsloth-zoo
        ref: ea59995addd5ddbe5d6cedc32d6deb51eebbac1e
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install the production dependency set
      run: "python -m pip install --upgrade pip\npip install --index-url https://download.pytorch.org/whl/cpu \\\n  \"torch>=2.4.0,<2.11.0\"\npip install -e .[core]\npip install --no-deps \"unsloth @ git+https://github.com/unslothai/unsloth@c17ca646c7ccae1032cba26103c32a9b6d32c8bb\" || true\npip install pytest==9.0.3 pyyaml==6.0.2\n# gguf is not a dependency of the zoo, and unsloth goes in --no-deps, so\n# without this every test that reads a GGUF back skips at\n# `pytest.importorskip(\"gguf\")`: 73 of them, the whole post conversion\n# verification file, silently and with the job still green.\npip install gguf\n# For the planner compressed-tensors gate; torch cap repeated or a newer release swaps in CUDA torch.\npip install compressed-tensors \"torch>=2.4.0,<2.11.0\"\n"
    - name: Record environment
      run: 'python -m pip freeze > "$RUNNER_TEMP/dependencies.txt"

        lscpu

        free -h'
    - name: Measure all existing gates
      run: "cat > \"$RUNNER_TEMP/benchmark.py\" <<'PYBENCH'\n\nimport concurrent.futures as cf, json, os, pathlib, shlex, subprocess, time, sys, yaml\nroot=pathlib.Path.cwd()\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'measurements';out.mkdir(exist_ok=True)\nkind=os.environ['BENCH_KIND'];variant=os.environ['VARIANT']; rows=[]\nif kind=='zoo':\n    doc=yaml.safe_load(pathlib.Path('.github/workflows/consolidated-tests-ci.yml').read_text())\n    steps=doc['jobs']['repo-tests-cpu']['steps']; tasks=[]\n    for step in steps:\n        cmd=step.get('run','')\n        if 'python -m pytest' not in cmd:continue\n        for n,command in enumerate(cmd.replace('\\\\\\n',' ').strip().splitlines()):\n            if not command.strip() or command.lstrip().startswith('#'):continue\n            assert command.startswith('python -m pytest'),command\n            name=f'{len(tasks):02}'\n            args=shlex.split(command)+['--junitxml='+str(out/(name+'.xml')),'--durations=30']\n            tasks.append((name,step.get('name','')+f'\
        \ [{n}]',args,{}))\nelse:\n    tasks=[('icons','Composer icon alignment',[sys.executable,'tests/studio/playwright_composer_icons.py','chromium','firefox'],{'PW_PORT':'5417'}),\n      ('chromium','Data settings Chromium',[sys.executable,'tests/studio/playwright_data_settings.py'],{'PW_PORT':'5420','PW_ENGINE':'chromium','PW_OUT':'logs/data_settings_report.json'}),\n      ('firefox','Data settings Firefox',[sys.executable,'tests/studio/playwright_data_settings.py'],{'PW_PORT':'5421','PW_ENGINE':'firefox','PW_OUT':'logs/data_settings_firefox_report.json'})]\n    if variant=='parallel':\n        p=pathlib.Path('studio/frontend/vite.config.ts');s=p.read_text();anchor='export default defineConfig({'\n        assert s.count(anchor)==1\n        p.write_text(s.replace(anchor,anchor+'\\n  cacheDir: process.env.VITE_TEST_CACHE_DIR || \"node_modules/.vite\",'))\ndef run(task):\n    name,label,args,extra=task;env=dict(os.environ,**extra)\n    if kind=='frontend' and variant=='parallel':env['VITE_TEST_CACHE_DIR']=str(out/('vite-'+name))\n\
        \    start=time.time();print('START',name,label,flush=True)\n    with (out/(name+'.log')).open('w') as log:\n        try:rc=subprocess.run(args,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=1200).returncode\n        except subprocess.TimeoutExpired:rc=124\n    row=dict(id=name,label=label,args=args,seconds=time.time()-start,rc=rc)\n    print('RESULT',json.dumps(row),flush=True);return row\nstart=time.time()\nif variant=='serial':rows=[run(t) for t in tasks]\nelse:\n    # The existing heavyweight behavioral invocation runs beside the other invocations.\n    if kind=='zoo':\n        heavy=[t for t in tasks if 'behavioral gates' in t[1]];other=[t for t in tasks if t not in heavy]\n        def lane(ts):return [run(t) for t in ts]\n        with cf.ThreadPoolExecutor(2) as ex:rows=sum(list(ex.map(lane,[heavy,other])),[])\n    else:\n        # Composer is short and stays serial; two independent engines overlap afterwards.\n        rows=[run(tasks[0])]\n        with cf.ThreadPoolExecutor(2)\
        \ as ex:rows+=list(ex.map(run,tasks[1:]))\nsummary=dict(kind=kind,variant=variant,seconds=time.time()-start,tasks=rows)\n(out/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary),flush=True)\nsys.exit(any(r['rc'] for r in rows))\n\nPYBENCH\npython \"$RUNNER_TEMP/benchmark.py\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: zoo-${{ matrix.variant }}-${{ matrix.rep }}
        path: '${{ runner.temp }}/measurements

          ${{ runner.temp }}/dependencies.txt'
        retention-days: 1
  frontend:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant:
        - serial
        - parallel
        rep:
        - 1
        - 2
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VARIANT: ${{ matrix.variant }}
      BENCH_KIND: frontend
    name: Windows browser gates ${{ matrix.variant }} r${{ matrix.rep }}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: unslothai/unsloth
        ref: c17ca646c7ccae1032cba26103c32a9b6d32c8bb
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Audit and install dependencies
      run: 'python scripts/lockfile_supply_chain_audit.py

        npm ci --prefix studio/frontend --ignore-scripts --no-fund --no-audit

        python -m pip install playwright==1.57.0 pyyaml

        python -m playwright install chromium firefox'
    - name: Measure the existing browser gates
      run: "cat > \"$RUNNER_TEMP/benchmark.py\" <<'PYBENCH'\n\nimport concurrent.futures as cf, json, os, pathlib, shlex, subprocess, time, sys, yaml\nroot=pathlib.Path.cwd()\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'measurements';out.mkdir(exist_ok=True)\nkind=os.environ['BENCH_KIND'];variant=os.environ['VARIANT']; rows=[]\nif kind=='zoo':\n    doc=yaml.safe_load(pathlib.Path('.github/workflows/consolidated-tests-ci.yml').read_text())\n    steps=doc['jobs']['repo-tests-cpu']['steps']; tasks=[]\n    for step in steps:\n        cmd=step.get('run','')\n        if 'python -m pytest' not in cmd:continue\n        for n,command in enumerate(cmd.replace('\\\\\\n',' ').strip().splitlines()):\n            if not command.strip() or command.lstrip().startswith('#'):continue\n            assert command.startswith('python -m pytest'),command\n            name=f'{len(tasks):02}'\n            args=shlex.split(command)+['--junitxml='+str(out/(name+'.xml')),'--durations=30']\n            tasks.append((name,step.get('name','')+f'\
        \ [{n}]',args,{}))\nelse:\n    tasks=[('icons','Composer icon alignment',[sys.executable,'tests/studio/playwright_composer_icons.py','chromium','firefox'],{'PW_PORT':'5417'}),\n      ('chromium','Data settings Chromium',[sys.executable,'tests/studio/playwright_data_settings.py'],{'PW_PORT':'5420','PW_ENGINE':'chromium','PW_OUT':'logs/data_settings_report.json'}),\n      ('firefox','Data settings Firefox',[sys.executable,'tests/studio/playwright_data_settings.py'],{'PW_PORT':'5421','PW_ENGINE':'firefox','PW_OUT':'logs/data_settings_firefox_report.json'})]\n    if variant=='parallel':\n        p=pathlib.Path('studio/frontend/vite.config.ts');s=p.read_text();anchor='export default defineConfig({'\n        assert s.count(anchor)==1\n        p.write_text(s.replace(anchor,anchor+'\\n  cacheDir: process.env.VITE_TEST_CACHE_DIR || \"node_modules/.vite\",'))\ndef run(task):\n    name,label,args,extra=task;env=dict(os.environ,**extra)\n    if kind=='frontend' and variant=='parallel':env['VITE_TEST_CACHE_DIR']=str(out/('vite-'+name))\n\
        \    start=time.time();print('START',name,label,flush=True)\n    with (out/(name+'.log')).open('w') as log:\n        try:rc=subprocess.run(args,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=1200).returncode\n        except subprocess.TimeoutExpired:rc=124\n    row=dict(id=name,label=label,args=args,seconds=time.time()-start,rc=rc)\n    print('RESULT',json.dumps(row),flush=True);return row\nstart=time.time()\nif variant=='serial':rows=[run(t) for t in tasks]\nelse:\n    # The existing heavyweight behavioral invocation runs beside the other invocations.\n    if kind=='zoo':\n        heavy=[t for t in tasks if 'behavioral gates' in t[1]];other=[t for t in tasks if t not in heavy]\n        def lane(ts):return [run(t) for t in ts]\n        with cf.ThreadPoolExecutor(2) as ex:rows=sum(list(ex.map(lane,[heavy,other])),[])\n    else:\n        # Composer is short and stays serial; two independent engines overlap afterwards.\n        rows=[run(tasks[0])]\n        with cf.ThreadPoolExecutor(2)\
        \ as ex:rows+=list(ex.map(run,tasks[1:]))\nsummary=dict(kind=kind,variant=variant,seconds=time.time()-start,tasks=rows)\n(out/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary),flush=True)\nsys.exit(any(r['rc'] for r in rows))\n\nPYBENCH\npython \"$RUNNER_TEMP/benchmark.py\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: frontend-${{ matrix.variant }}-${{ matrix.rep }}
        path: '${{ runner.temp }}/measurements

          logs/data_settings*

          logs/playwright-composer-icons'
        retention-days: 1
