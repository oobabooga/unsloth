        \  with (out / (args.case + \".jsonl\")).open(\"a\", encoding=\"utf-8\") as f:\\n            f.write(line + \"\\\\\
        n\")\\n\\n\\nfor kv in args.env:\\n    k, _, v = kv.partition(\"=\")\\n    os.environ[k] = v\\nif args.serialize:\\\
