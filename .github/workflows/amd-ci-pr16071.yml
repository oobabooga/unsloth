name: "AMD CI (Windows): validate PR 16071"

# Generated from amd_ci/templates/workflow_windows.yml by scaffold.py --windows.
#
# The Windows half of the devlab-dispatch pool: four GMKtec NucBox EVO-X2 Strix
# Halo boxes running Windows 11 Pro, with an AMD Radeon 8060S visible to Windows.
# They match in seconds and never queue. Everything below is measured on them:
#
#   shell: powershell     the ONLY correct value. `pwsh` is not installed (there
#                         is no PowerShell 7, only 5.1 Desktop) and neither is
#                         `bash`. Either one fails before the step's first line.
#                         Set as a job default so no step can drift off it.
#   no docker             not installed on any of the four. Containerised work
#                         stays on the Linux runners; there is no Windows target
#                         for it on this pool.
#   RUNNER_OS             has been observed EMPTY on these jobs, and correct on
#                         others. Echo it before branching on it; a bash-style
#                         ${RUNNER_OS:-?} in a PowerShell block is always "".
#   machine names         the X2-LA01-* prefix is SHARED with the Linux pool, so
#                         the name does not tell you which OS answered.
#   no shared state       jobs land on DIFFERENT machines and share no image
#                         cache and no disk. Anything fetched in one job must be
#                         fetched again in the next.
#
# The linux-control job exists to be diagnostic, not useful. A label that matches
# no runner does not fail a job, it queues it forever, and that looks exactly like
# a busy pool from the run list. This job differs from the Windows one ONLY in the
# OS label, so if it starts and the Windows job does not, the selector is wrong.
# Keep it, or reproduce it by pushing the same workflow twice.

on:
  push:
    branches: [amd-ci-t7h5j-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "16071"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  linux-control:
    name: "PR 16071 linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"
          echo "If this job runs and the windows job stays queued, the Windows"
          echo "selector matched no runner. If BOTH stay queued, the pool is busy."

  windows:
    name: "PR 16071 on Windows (non-Docker)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    # Uncomment when the job actually measures the GPU. It is off by default
    # because the four Windows boxes are four separate machines with four separate
    # GPUs, so serialising all of them costs throughput for nothing; the labels
    # cannot pin one machine, so there is no finer group to ask for. `lint_workflow.py`
    # raises W101 if a step here touches GPU memory without a group.
    # concurrency:
    #   group: amd-ci-strix-halo-windows-gpu
    #   cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "pr16071-windows"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            Write-Host "Not skipping: a run that cannot start is a failure, not nothing to see."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          $extra = @()
          if ($env:MERGED -eq "1") { $extra += "--merged" }
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\states.py" `
            --repo "$env:UPSTREAM" --pr "$env:PR" @extra `
            --root "$env:AMD_CI_WORK" --out "$env:AMD_CI_WORK\out\states.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Studio install from the head (install.ps1 --local --skip-autostart)
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = "Continue"
          $u = & $env:AMD_CI_PY -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['paths']['head'])" "$env:AMD_CI_WORK\out\states.json"
          Write-Host "head checkout: $u"
          $env:UNSLOTH_STUDIO_HOME = "$env:AMD_CI_WORK\studio"
          Add-Content -Path $env:GITHUB_ENV -Value "UNSLOTH_STUDIO_HOME=$env:UNSLOTH_STUDIO_HOME"
          Push-Location "$u"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$u\install.ps1" --local --skip-autostart *>&1 | Select-Object -Last 40
          $rc = $LASTEXITCODE
          Pop-Location
          Write-Host "install.ps1 exit $rc"
          $cands = Get-ChildItem -Path "$env:UNSLOTH_STUDIO_HOME" -Recurse -Filter python.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\Scripts\\python.exe$" }
          $v = $null
          foreach ($c in $cands) {
            & $c.FullName -c "import torch, unsloth" 2>$null
            if ($LASTEXITCODE -eq 0) { $v = $c.FullName; break }
          }
          if ($null -eq $v) { Write-Host "FATAL: no Studio venv with torch + unsloth"; exit 1 }
          Write-Host "Studio venv: $v"
          & $v -m pip install -q pytest pytest-timeout
          & $v -m pip list 2>$null | Select-String -Pattern "triton|torch|bitsandbytes|unsloth|transformers|peft"
          & $v -c "import torch; print('torch', torch.__version__, 'hip', torch.version.hip, 'gpu', torch.cuda.is_available(), torch.cuda.get_device_properties(0).gcnArchName)"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$v"
          & $v "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --require rocm gpu --expect-arch gfx1151 --min-gpus 1 --out "$env:AMD_CI_WORK\out\host_torch.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Differential (LoRA kernel test files, base vs head)
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/pytest_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/pytest_no_regression.py" `
            --out-dir "$env:AMD_CI_WORK\out\suites" `
            --python "$env:AMD_CI_PY" -- --subdir . --tests tests/test_fused_lora_dropout_bias.py tests/test_fused_lora_peft_fallbacks.py tests/test_lora_gradient_layout.py tests/test_fast_lora_cast_cache.py tests/test_float32_lora_fallback.py tests/test_fp8_fp16_lora_dtype.py tests/test_fused_lora_unloaded_trainable_base.py
          Get-Content "$env:AMD_CI_WORK\out\suites\VERDICT.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Differential
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/t7h5e_lora_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/t7h5e_lora.py" `
            --out-dir "$env:AMD_CI_WORK\out\windows" `
            --python "$env:AMD_CI_PY" 
          Get-Content "$env:AMD_CI_WORK\out\windows\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          # This is the last command, so its exit status is the step's.
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\windows"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16071-windows
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
