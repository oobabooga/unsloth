name: AMD AOTriton gfx1151 probe

# Throwaway. Lives on an orphan branch holding this file and nothing else, so the
# push that starts it cannot trigger any other workflow in the repository.
# Asserts nothing: it reports what a stable multi-arch ROCm install actually gives
# a gfx1151 part, with and without TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL.

on:
  push:
    branches: [amd-aotriton-gfx1151-probe]

permissions: {}

jobs:
  aotriton:
    name: Strix Halo (gfx1151)
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 60
    steps:
      - name: Hardware
        run: |
          uname -a
          echo "--- gfx target ---"
          rocminfo 2>/dev/null | grep -E 'Name:|Marketing Name:|gfx' | head -20 || echo "rocminfo unavailable"
          echo "--- scratch ---"
          df -h /mnt/scratch / 2>/dev/null || true

      - name: Install stable torch with the gfx1151 device extra
        run: |
          set -euo pipefail
          # /mnt/scratch is the big volume but is not writable by the runner user on
          # every host, so take the first base that actually accepts a mkdir.
          ROOT=""
          for base in /mnt/scratch "${RUNNER_TEMP:-}" "$HOME" /tmp; do
            [ -n "$base" ] || continue
            if mkdir -p "$base/aotriton-probe" 2>/dev/null; then
              ROOT="$base/aotriton-probe"; break
            fi
          done
          [ -n "$ROOT" ] || { echo "no writable base directory"; exit 1; }
          echo "using $ROOT"; df -h "$ROOT"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          export TMPDIR="$ROOT/tmp"; mkdir -p "$TMPDIR"
          export PIP_CACHE_DIR="$ROOT/pipcache"
          python3 -m venv "$ROOT/venv"
          "$ROOT/venv/bin/python" -m pip install -q --upgrade pip
          # The exact command AMD documents for a stable gfx1151 install. No nightly index.
          "$ROOT/venv/bin/python" -m pip install \
            --index-url https://repo.amd.com/rocm/whl-multi-arch/ \
            --extra-index-url https://pypi.org/simple \
            "torch[device-gfx1151]==2.11.0+rocm7.14.0"
          echo "$ROOT/venv/bin/python" > "$HOME/probe_python"
          echo "$ROOT" > "$HOME/probe_root"

      - name: What landed on disk
        run: |
          set -euo pipefail
          PY=$(cat "$HOME/probe_python")
          "$PY" -m pip list 2>/dev/null | grep -iE 'torch|amd-|rocm' || true
          LIB=$("$PY" -c 'import torch,os;print(os.path.join(os.path.dirname(torch.__file__),"lib"))')
          echo "--- torch/lib/aotriton.images ---"
          ls -1 "$LIB/aotriton.images" 2>/dev/null || echo "NO aotriton.images DIRECTORY"
          for d in "$LIB"/aotriton.images/*/; do
            echo "$(basename "$d"): $(find "$d" -type f | wc -l) files"
          done
          echo "--- signature ---"
          cat "$LIB"/aotriton.images/*/__signature__ 2>/dev/null | head -8 || true
          echo "--- runtime libs ---"
          ls -1 "$LIB" | grep -i aotriton || echo "no aotriton runtime lib"

      - name: SDPA backends WITHOUT the experimental flag
        env:
          PROBE_LABEL: "flag unset"
        run: |
          set -euo pipefail
          unset TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL || true
          "$(cat "$HOME/probe_python")" - <<'PY'
          import os, torch
          print("label:", os.environ.get("PROBE_LABEL"))
          print("TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL =",
                repr(os.environ.get("TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL")))
          print("torch", torch.__version__, "hip", torch.version.hip)
          print("cuda available:", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("no ROCm device visible")
          props = torch.cuda.get_device_properties(0)
          print("device:", props.name, "arch:", getattr(props, "gcnArchName", "?"))
          from torch.backends.cuda import SDPAParams, can_use_flash_attention, can_use_efficient_attention
          q = torch.randn(1, 8, 256, 64, dtype=torch.float16, device="cuda")
          for arity in (7, 6, 5):
              try:
                  params = SDPAParams(*( [q, q, q, None, 0.0, False, False][:arity] ))
                  break
              except TypeError:
                  params = None
          print("flash available:      ", can_use_flash_attention(params, True))
          print("mem_efficient avail.: ", can_use_efficient_attention(params, True))
          from torch.nn.attention import sdpa_kernel, SDPBackend
          for backend, name in ((SDPBackend.FLASH_ATTENTION, "flash"),
                                (SDPBackend.EFFICIENT_ATTENTION, "mem_efficient"),
                                (SDPBackend.MATH, "math")):
              try:
                  with sdpa_kernel([backend]):
                      out = torch.nn.functional.scaled_dot_product_attention(q, q, q)
                  torch.cuda.synchronize()
                  print(f"{name}: RAN ok, out {tuple(out.shape)} {out.dtype}")
              except Exception as exc:
                  print(f"{name}: FAILED {type(exc).__name__}: {str(exc)[:200]}")
          PY

      - name: SDPA backends WITH the experimental flag
        env:
          TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
          PROBE_LABEL: "flag = 1"
        run: |
          set -euo pipefail
          "$(cat "$HOME/probe_python")" - <<'PY'
          import os, torch
          print("label:", os.environ.get("PROBE_LABEL"))
          print("TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL =",
                repr(os.environ.get("TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL")))
          from torch.backends.cuda import SDPAParams, can_use_flash_attention, can_use_efficient_attention
          q = torch.randn(1, 8, 256, 64, dtype=torch.float16, device="cuda")
          for arity in (7, 6, 5):
              try:
                  params = SDPAParams(*( [q, q, q, None, 0.0, False, False][:arity] ))
                  break
              except TypeError:
                  params = None
          print("flash available:      ", can_use_flash_attention(params, True))
          print("mem_efficient avail.: ", can_use_efficient_attention(params, True))
          from torch.nn.attention import sdpa_kernel, SDPBackend
          for backend, name in ((SDPBackend.FLASH_ATTENTION, "flash"),
                                (SDPBackend.EFFICIENT_ATTENTION, "mem_efficient")):
              try:
                  with sdpa_kernel([backend]):
                      out = torch.nn.functional.scaled_dot_product_attention(q, q, q)
                  torch.cuda.synchronize()
                  print(f"{name}: RAN ok, out {tuple(out.shape)} {out.dtype}")
              except Exception as exc:
                  print(f"{name}: FAILED {type(exc).__name__}: {str(exc)[:200]}")
          PY

      - name: Clean up the scratch install
        if: always()
        run: |
          rm -rf "$(cat "$HOME/probe_root" 2>/dev/null)" "$HOME/probe_python" "$HOME/probe_root" || true
