name: "AMD CI: sd.cpp conv-direct + ROCm regional compile on gfx1151 (Linux)"

# Built from the amd_ci scaffold (templates/workflow.yml) and the diffusion_bench v6 job: same preamble, gate,
# Studio install, differential and artifact plumbing. Measurement only: no secret is referenced, every model is a
# public download (token=False).

on:
  push:
    branches: [amd-ci-opt2-amd]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: "https://github.com/unslothai/unsloth"
  BASE_SHA: "9f606d6fa1ccdf9fdeefb89e9245f121d29b544a"

jobs:

  gpu:
    name: "sd.cpp conv-direct A/B + ROCm regional compile (gfx1151, exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 600
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "opt2-amd"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Disk, memory, cores
        run: |
          set +e
          df -h "$RUNNER_TEMP"
          free -g
          nproc
          exit 0

      - name: Resolve states (main, and main + opt2_amd.patch)
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "$UPSTREAM" "$AMD_CI_WORK/repo"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/base" "$BASE_SHA"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/head" "$BASE_SHA"
          git -C "$AMD_CI_WORK/states/head" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/opt2_amd.patch"
          git -C "$AMD_CI_WORK/states/head" diff --cached --stat
          python3 "$GITHUB_WORKSPACE/diffusion_bench/amd/write_states.py" --work "$AMD_CI_WORK" \
            --base-sha "$BASE_SHA" --patch opt2_amd.patch --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"

      - name: "ROCm compile: _alloc_from_pool repro (memory_planning on/off) and the head probe"
        timeout-minutes: 40
        run: |
          set +e
          export TORCH_HOME="$AMD_CI_WORK/torch_home"
          "$AMD_CI_PY" amd_ci/probes/rocm_compile_repro.py --head "$AMD_CI_WORK/states/head" \
            --out "$AMD_CI_WORK/out/rocm_compile_repro.json" > "$AMD_CI_WORK/out/rocm_compile_repro.log" 2>&1
          echo "repro rc=$?"
          tail -c 3000 "$AMD_CI_WORK/out/rocm_compile_repro.json"
          exit 0

      - name: "Differential: sd.cpp conv-direct on Vulkan / ROCm"
        timeout-minutes: 240
        run: |
          set +e
          export HF_HOME="$AMD_CI_WORK/hf_home"
          export HF_HUB_DOWNLOAD_TIMEOUT=120
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/sdcpp_conv_probe.py \
            --criteria amd_ci/criteria/sdcpp_conv_direct.py \
            --out-dir "$AMD_CI_WORK/out/sdcpp" \
            --python "$AMD_CI_PY" -- --shared "$AMD_CI_WORK/sdcpp_shared" --reps 4 --state-reps 2
          cat "$AMD_CI_WORK/out/sdcpp/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/sdcpp"
          exit 0

      - name: "Differential: ROCm regional compile end to end (FLUX.2-klein, Z-Image)"
        timeout-minutes: 300
        run: |
          set +e
          export TORCH_HOME="$AMD_CI_WORK/torch_home"
          export HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe diffusion_bench/amd/diffusion_probe.py \
            --criteria diffusion_bench/amd/criteria_differential.py \
            --out-dir "$AMD_CI_WORK/out/compile" \
            --python "$AMD_CI_PY" -- --spec diffusion_bench/specs/amd_rocm_compile.json --budget-min 240.0 --cell-timeout 3600.0 --only 'klein_*' --only 'zimg_*' --defect slow:klein_cmp:klein_nc:0.97
          cat "$AMD_CI_WORK/out/compile/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/compile"

      - name: Stop anything this job started
        if: always()
        run: |
          set +e
          for d in /proc/[0-9]*; do
            pid=${d#/proc/}
            [ "$pid" = "$$" ] && continue
            cwd=$(readlink "$d/cwd" 2>/dev/null)
            case "$cwd" in
              "$AMD_CI_WORK"*) echo "stopping pid $pid (cwd $cwd)"; kill "$pid" 2>/dev/null ;;
            esac
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opt2-amd
          path: |
            ${{ env.AMD_CI_WORK }}/out
            ${{ env.AMD_CI_WORK }}/sdcpp_shared/shared.json
            ${{ env.AMD_CI_WORK }}/sdcpp_shared/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/sdcpp_shared/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/record.json
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/dbench/states/*/logs
          retention-days: 14
          if-no-files-found: warn
