name: Docker image verification

on:
  push:
    branches: [docker-verify-ci]

permissions:
  contents: read

jobs:
  labels:
    name: OCI labels from docker/metadata-action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Labels as the publish workflow resolves them today
        id: before
        uses: docker/metadata-action@v5
        with:
          images: docker.io/unsloth/unsloth
      - name: Labels with the license override this PR adds
        id: after
        uses: docker/metadata-action@v5
        with:
          images: docker.io/unsloth/unsloth
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND AGPL-3.0-only
      - name: Compare
        run: |
          echo '${{ steps.before.outputs.labels }}' > before.txt
          echo '${{ steps.after.outputs.labels }}' > after.txt
          echo "=== before"; grep -i licenses before.txt
          echo "=== after";  grep -i licenses after.txt
      - name: The label as build-push-action would apply it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./probe/Dockerfile
          push: false
          load: true
          tags: label-probe:latest
          labels: ${{ steps.after.outputs.labels }}
      - name: Read it back from the image
        run: docker image inspect label-probe:latest --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}'
