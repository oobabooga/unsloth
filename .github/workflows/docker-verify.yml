name: Docker image verification

on:
  push:
    branches: [docker-verify-ci]

permissions:
  contents: read

jobs:
  labels:
    name: OCI labels from docker/metadata-action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Labels as the publish workflow resolves them today
        id: before
        uses: docker/metadata-action@v5
        with:
          images: docker.io/unsloth/unsloth
      - name: Labels with the license override this PR adds
        id: after
        uses: docker/metadata-action@v5
        with:
          images: docker.io/unsloth/unsloth
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND AGPL-3.0-only
      - name: Compare
        run: |
          echo "=== before"; echo '${{ steps.before.outputs.labels }}' | grep -i licenses
          echo "=== after";  echo '${{ steps.after.outputs.labels }}'  | grep -i licenses
          # the label reaches the image the same way build-push-action applies it
          printf 'FROM alpine\n' > Dockerfile.probe
          docker build -q -t label-probe -f Dockerfile.probe \
            $(echo '${{ steps.after.outputs.labels }}' | sed 's/^/--label /' | tr '\n' ' ') . >/dev/null
          docker image inspect label-probe --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}'
