name: "AMD CI: can Unsloth Desktop (Tauri) be built and run here?"

# SCOUTING RUN. Takes NO GPU on purpose.
#
# The Studio WEB UI ladder has already been measured on this host in real WebKitGTK 2.52.3 and
# did NOT collapse: 60.0 fps at every rung from 0K to 500K, with the main thread going from 5%
# to 94% busy, so the venue was loaded and the presented frame rate still did not move.
#
# Desktop is the next suspect and there is a concrete mechanism for it being different:
# studio/src-tauri/src/linux_webkit.rs decides at startup whether to apply a rendering
# workaround, and one option is WEBKIT_DISABLE_DMABUF_RENDERER, which turns accelerated
# compositing OFF. Its own comment concedes the trigger is "module presence, not the GPU that
# will render". If Desktop ends up software-composited where the web UI is GPU-composited,
# that is a plausible source of a collapse the web UI does not show.
#
# Before any of that can be measured, one cheap question has to be settled: can a Tauri v2 app
# be BUILT on this host at all, with no root? That needs no GPU, so it must not take the
# amd-ci-gfx1151-gpu concurrency group. The group holds one runner plus one waiter and a THIRD
# arrival cancels the waiter while the suites job stays green, so spending it on "does cargo
# exist" would silently cost somebody else's measurement.

on:
  push:
    branches: [amd-ci-desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  toolchain:
    name: "Desktop build toolchain (no GPU)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 60
    # No concurrency group, deliberately: this job must never queue behind or evict a GPU
    # measurement. It is masked instead, so it cannot touch the device even by accident.
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "desktop-toolchain"

      - name: Hardware gate
        run: |
          set -euo pipefail
          # Fails rather than skips. Only `linux` is required here: this job asks about a
          # BUILD toolchain and deliberately does not touch the GPU, so requiring rocm would
          # gate on a thing it also masks.
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"

      - name: Toolkit self-test
        run: |
          set +e
          python3 amd_ci/selftest.py 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          echo "selftest rc=$rc"
          [ "$rc" -eq 0 ] || exit "$rc"

      # Its own step and deliberately early: step logs are only served once the JOB completes,
      # so anything needed while the job is in flight has to be visible in per-step status.
      - name: Toolchain inventory
        run: |
          set +e
          echo "== identity"; id; echo "root=$([ "$(id -u)" = 0 ] && echo yes || echo no)"
          echo "== os"; cat /etc/os-release 2>&1 | head -4
          echo "== tools"
          for t in rustc cargo rustup cc gcc pkg-config node npm python3 dpkg-deb apt-get Xvfb; do
            printf '%-12s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          echo "== versions"
          rustc --version 2>&1; cargo --version 2>&1; node --version 2>&1; npm --version 2>&1
          echo "== pkg-config, as the host stands"
          for p in webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 gtk+-3.0 libxdo; do
            printf '%-24s %s\n' "$p" "$(pkg-config --modversion "$p" 2>&1)"
          done
          echo "== webkit runtime"
          ls -1 /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so* 2>&1
          echo "always exits 0: this is inventory, the probe's own gate decides"
          exit 0

      - name: Toolchain probe
        timeout-minutes: 45
        run: |
          set +e
          python3 amd_ci/lib/capability_run.py \
            --probe amd_ci/probes/desktop_toolchain_probe.py \
            --criteria amd_ci/criteria/desktop_toolchain.py \
            --out-dir "$AMD_CI_WORK/out/toolchain"
          cat "$AMD_CI_WORK/out/toolchain/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (INCONCLUSIVE) does not.
          python3 amd_ci/lib/announce.py "$AMD_CI_WORK/out/toolchain"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-toolchain
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
