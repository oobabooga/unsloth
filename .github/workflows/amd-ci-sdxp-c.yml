name: "AMD CI: gfx1151 ggml patches 0028 (HIP bf16 WMMA operands) and 0029 (Vulkan no host import on AMD)"

# base = unslothai/stable-diffusion.cpp master ba6ac303; heads from danielhanchen/sd-cpp-staging:
#   0028 d81db2ad (branch src-hipwmma-d81db2ad), 0029 426f4d45 (branch src-vkuma-426f4d45)
# hip_06db = 0028 + ggml 06db896e3b (conv2d unroll), harness arm only. All built on the box, measured in ONE job.

on:
  push:
    branches: [amd-ci-sdxp-c]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-linux:
    name: "gfx1151 Linux: HIP 0028 and RADV 0029, base vs head"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    env:
      ROCM_VERSION: "7.14.0"
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: 241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf
      MASTER: ba6ac30346b0f174354419d820e6f11b3e9bc0f2
      WMMA: d81db2adec62bc6e87a26cdc4213cd1d373ed5f8
      UMA: 426f4d45e848bad1ed969112452f8242f8554f53
      STAGING: https://github.com/danielhanchen/sd-cpp-staging
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "sdxp-c-linux"
      - name: Host gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require linux --out "$AMD_CI_WORK/out/host.json"
          python3 amd_ci/lib/capability.py > "$AMD_CI_WORK/out/capability.json" 2>&1 || true
          uname -n
      - name: "Box builds: HIP gfx1151 (master, 0028, 0028+06db) and Vulkan (master, 0029)"
        timeout-minutes: 120
        run: |
          set +e
          cd "$AMD_CI_WORK"
          python3 -m venv .rocm && . .rocm/bin/activate
          python -m pip install -q --upgrade pip && python -m pip install -q ninja cmake pillow numpy
          python -m pip install -q --no-cache-dir --index-url https://repo.amd.com/rocm/whl-multi-arch/ \
            "rocm[libraries,devel,device-gfx1151]==${ROCM_VERSION}"
          ROCM_PATH="$(rocm-sdk path --root)"
          export ROCM_PATH HIP_PATH="$ROCM_PATH" CMAKE_PREFIX_PATH="$(rocm-sdk path --cmake)"
          export PATH="$(rocm-sdk path --bin):$AMD_CI_WORK/.rocm/bin:$PATH"
          echo "ROCM_LIB=$ROCM_PATH/lib" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/vulkansdk.tar.xz"; sdk_root="$RUNNER_TEMP/vulkansdk"
          curl -s --fail --location --retry 3 --output "$archive" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          echo "$VULKAN_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$sdk_root" && tar -xJf "$archive" -C "$sdk_root" --strip-components=1
          export VULKAN_SDK="$sdk_root/x86_64" PATH="$sdk_root/x86_64/bin:$PATH"
          (LD_LIBRARY_PATH= "$sdk_root/x86_64/bin/vulkaninfo" --summary 2>&1 | grep -E "deviceName|driverInfo|deviceType") > "$AMD_CI_WORK/out/vulkaninfo.txt"
          cat "$AMD_CI_WORK/out/vulkaninfo.txt"
          cd "$GITHUB_WORKSPACE"
          bash sdrc/build_hip.sh hip_master "$MASTER" "$AMD_CI_WORK/bin/hip_master" 2>&1 | tail -3
          SRC_REPO=$STAGING bash sdrc/build_hip.sh hip_wmma "$WMMA" "$AMD_CI_WORK/bin/hip_wmma" 2>&1 | tail -3
          SRC_REPO=$STAGING bash sdrc/build_hip.sh hip_06db "$WMMA" "$AMD_CI_WORK/bin/hip_06db" "$GITHUB_WORKSPACE/sdrc/0030-harness-ggml-cuda-conv2d-no-unroll-06db896e3b.patch" 2>&1 | tail -3
          bash sdrc/build.sh vk_master "$MASTER" vk "$AMD_CI_WORK/bin/vk_master" 2>&1 | tail -3
          SRC_REPO=$STAGING bash sdrc/build.sh vk_uma "$UMA" vk "$AMD_CI_WORK/bin/vk_uma" 2>&1 | tail -3
          cat "$AMD_CI_WORK"/bin/*/srcinfo.txt | grep label=
          exit 0
      - name: "Measure (interleaved, 3 reps)"
        timeout-minutes: 180
        run: |
          set +e
          B="$AMD_CI_WORK/bin"
          "$AMD_CI_WORK/.rocm/bin/python" -u sdrc/run_c.py --bin hip_master=$B/hip_master --bin hip_wmma=$B/hip_wmma --bin hip_06db=$B/hip_06db \
            --bin vk_master=$B/vk_master --bin vk_uma=$B/vk_uma \
            --rocm-lib "${ROCM_LIB:-}" --models "$AMD_CI_WORK/models" --out "$AMD_CI_WORK/out/runs" --reps 3 2>&1 | tail -80
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdxp-c-linux
          path: |
            ${{ env.AMD_CI_WORK }}/out
            !${{ env.AMD_CI_WORK }}/out/**/*.png
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sdxp-c-linux-png, path: "${{ env.AMD_CI_WORK }}/out/**/*_r0.png", retention-days: 7, if-no-files-found: warn }
