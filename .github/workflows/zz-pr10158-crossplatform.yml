# Throwaway cross-platform gate for the unslothai/unsloth#10158 mirror.
# Not for merge: this file exists only on the disposable CI branch.

name: "PR10158 cross-platform"

on:
  pull_request:
  push:
    branches: [pr-10158-studio-ci, pr-10158-baseline-ci]

concurrency:
  group: pr10158-xplat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: "frontend ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  studio_contract:
    name: "studio contract ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Studio prompt-queue contract
        run: python -m pytest tests/studio/test_multi_chat_prompt_queue_contract.py -q
