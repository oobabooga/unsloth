name: Live duplicate metadata validation

on:
  push:
    branches:
      - validation/duplicate-metadata-live
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-and-repair:
    name: ${{ matrix.os }} live reproduction
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare the isolated package environment
        run: python -m pip install --disable-pip-version-check uv typer

      - name: Reproduce the stale metadata bug and run the production repair
        run: python .github/scripts/live_duplicate_metadata_validation.py
