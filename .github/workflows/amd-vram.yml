name: AMD DevLab audio.cpp Vulkan VRAM

on:
  push:
    branches: [amd-devlab-music-vram]

permissions: {}

jobs:
  amd:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 150
    steps:
      - name: Hardware
        run: |
          uname -a
          lscpu | head -20
          free -h
          lspci -nn | grep -iE 'vga|display|processing accelerator' || true
          ls /sys/class/drm/ || true
          for c in /sys/class/drm/card*/device; do echo "$c"; cat "$c/mem_info_vram_total" "$c/mem_info_gtt_total" 2>/dev/null; done
          ls /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>/dev/null || true
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|driverName|apiVersion' || echo "no vulkaninfo"
          df -h "$RUNNER_TEMP"
      - name: Vulkan driver
        run: |
          if ls /usr/share/vulkan/icd.d/ 2>/dev/null | grep -qi radeon; then echo "RADV present"; exit 0; fi
          sudo -n apt-get update -qq && sudo -n apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools || echo "could not install RADV"
          ls /usr/share/vulkan/icd.d/ 2>/dev/null || true
      - name: Measure
        env:
          JOBS_GZ: 
          SCRIPT_GZ: 
        run: |
          WORK_ROOT="$RUNNER_TEMP/unsloth-work"
          mkdir -p "$WORK_ROOT"/{tmp,cache/huggingface}
          python3 -m venv "$WORK_ROOT/venv"
          . "$WORK_ROOT/venv/bin/activate"
          export TMPDIR="$WORK_ROOT/tmp" HF_HOME="$WORK_ROOT/cache/huggingface"
          pip install -q huggingface_hub
          echo "$JOBS_GZ" | base64 -d | gunzip > "$WORK_ROOT/jobs.json"
          echo "$SCRIPT_GZ" | base64 -d | gunzip > "$WORK_ROOT/amd_measure.py"
          sha256sum "$WORK_ROOT/jobs.json" "$WORK_ROOT/amd_measure.py"
          python3 "$WORK_ROOT/amd_measure.py" "$WORK_ROOT" "$WORK_ROOT/jobs.json"
