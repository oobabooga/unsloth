name: "AMD CI: W8A8 torch._int_mm vs weight-only int8 (Linux)"

# Is PR 11631's int8 faster on gfx1151 when the activations are int8 too, so the GEMM
# runs through torch._int_mm instead of dequantising the weight to bf16? The branch
# under test is studio-amd-int8-intmm (PR 11631 plus an opt-in UNSLOTH_NATIVE_INT8_ACT=1
# path). Two measurements: one Linear on the DiT's real shapes, eager and compiled,
# then Qwen-Image-2.1 end to end through Studio at bf16 / int8 weight-only / int8 W8A8,
# eager and with Studio's default compile. No HF token is used anywhere.

on:
  push:
    branches: [amd-ci-int8mm]
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC_REPO: "https://github.com/danielhanchen/unsloth-staging-2"
  SRC_BRANCH: "studio-amd-int8-intmm"

jobs:

  gpu:
    name: "int8 W8A8 on gfx1151 Linux (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "int8mm-gpu"

      - name: Checkout the branch under test
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b "$SRC_BRANCH" "$SRC_REPO" "$AMD_CI_WORK/src/unsloth"
          git -C "$AMD_CI_WORK/src/unsloth" log -1 --format='%h %s'

      - name: Environment and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/src/unsloth"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"

      - name: Scoring dependency
        run: |
          set +e
          "$AMD_CI_PY" -m pip --version > /dev/null 2>&1 || "$AMD_CI_PY" -m ensurepip -q
          "$AMD_CI_PY" -m pip install -q --no-deps lpips 2>&1 | tail -2
          "$AMD_CI_PY" -c "import torch, lpips; print('lpips ok, torch', torch.__version__)"
          exit 0

      - name: Layer micro-benchmark
        timeout-minutes: 30
        run: |
          set +e
          "$AMD_CI_PY" -u amd_ci/probes/int8mm_layer_probe.py --checkout "$AMD_CI_WORK/src/unsloth" \
            --out "$AMD_CI_WORK/out/layer.json" 2>&1 | grep -v "Warning\|warn("
          exit 0

      - name: End to end, eager
        timeout-minutes: 120
        run: |
          set +e
          export TORCH_HOME="$AMD_CI_WORK/torch_home" HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" -u amd_ci/probes/int8mm_e2e_probe.py --checkout "$AMD_CI_WORK/src/unsloth" \
            --out-dir "$AMD_CI_WORK/out/e2e_off" --models "$AMD_CI_WORK/models" --speed off
          { echo "### Eager"; cat "$AMD_CI_WORK/out/e2e_off/SUMMARY.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: End to end, Studio default compile
        timeout-minutes: 120
        run: |
          set +e
          export TORCH_HOME="$AMD_CI_WORK/torch_home" HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" -u amd_ci/probes/int8mm_e2e_probe.py --checkout "$AMD_CI_WORK/src/unsloth" \
            --out-dir "$AMD_CI_WORK/out/e2e_default" --models "$AMD_CI_WORK/models" --speed default
          { echo "### Studio default speed mode"; cat "$AMD_CI_WORK/out/e2e_default/SUMMARY.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int8mm-linux
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
