name: "AMD CI (Windows): issue 10656 Vulkan vs ROCm prefill on gfx1151"

on:
  push:
    branches: [amd-ci-issue10656]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEW_TAG: "b11541-mix-2500203"
  OLD_TAG: "b10840-mix-d5c17a0"
  MODEL_URL: "https://huggingface.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF/resolve/main/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"

jobs:

  linux-control:
    name: "linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "machine: $(uname -n)"

  linux:
    name: "gfx1151 Linux: llama.cpp Vulkan vs ROCm prefill"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Bench
        timeout-minutes: 230
        run: |
          set +e
          source amd_ci/lib/preamble.sh issue10656-linux
          OUT="$AMD_CI_WORK/out"; SRC="$AMD_CI_WORK/src"
          uname -a | tee "$OUT/os.txt"
          free -g | tee "$OUT/ram.txt"
          (ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>&1) | tee "$OUT/icd.txt"
          for kind in vulkan rocm-gfx1151; do
            name="app-$NEW_TAG-linux-x64-$kind.tar.gz"
            curl -sSfL --retry 5 -o "$SRC/$name" "https://github.com/unslothai/llama.cpp/releases/download/$NEW_TAG/$name" || { echo "FATAL download $name"; exit 1; }
            mkdir -p "$SRC/$kind"; tar -xzf "$SRC/$name" -C "$SRC/$kind" || { echo "FATAL untar $name"; exit 1; }
          done
          VK="$(dirname "$(find "$SRC/vulkan" -name llama-bench -type f | head -n 1)")"
          RO="$(dirname "$(find "$SRC/rocm-gfx1151" -name llama-bench -type f | head -n 1)")"
          echo "VK=$VK RO=$RO"
          curl -sSfL --retry 5 -o "$SRC/model.gguf" "$MODEL_URL" || { echo "FATAL model"; exit 1; }
          for d in "$VK" "$RO"; do (cd "$d" && LD_LIBRARY_PATH="$d:${LD_LIBRARY_PATH:-}" ./llama-bench --list-devices) 2>&1 | tee -a "$OUT/devices.txt"; done
          for arm in rocm_r1:$RO vulkan_r1:$VK rocm_r2:$RO vulkan_r2:$VK; do
            tag="${arm%%:*}"; d="${arm#*:}"
            echo "=== $tag ==="
            (cd "$d" && LD_LIBRARY_PATH="$d:${LD_LIBRARY_PATH:-}" ./llama-bench -m "$SRC/model.gguf" -ngl 99 -fa 1 -p 512,4096 -n 128 -d 0,16384 -r 2 -o json) > "$OUT/bench_$tag.json" 2> "$OUT/bench_$tag.err"
            echo "exit $?"
          done
          for arm in srv_rocm:$RO srv_vulkan:$VK; do
            tag="${arm%%:*}"; d="${arm#*:}"
            LD_LIBRARY_PATH="$d:${LD_LIBRARY_PATH:-}" python3 bench/server_prefill.py --server "$d/llama-server" --model "$SRC/model.gguf" --label "$tag" --log "$OUT/$tag.log" --out "$OUT/$tag.json" -- -c 262144 -ngl 999 -fa on --jinja -np 1
            echo "exit $?"
          done
          echo "AMD_CI_WORK=$AMD_CI_WORK" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue10656-linux
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
