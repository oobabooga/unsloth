name: AMD H3 memory probe Windows

on:
  push:
    branches: [amd-h3-mem-probe-win-20261014]

permissions: {}

jobs:
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 330
    env:
      TAG: master-951-f89d9b1-uafac7a7
    steps:
      - name: Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $W = Join-Path $env:RUNNER_TEMP "h3"
          New-Item -ItemType Directory -Force -Path "$W\models","$W\out","$W\vk","$W\hf","$W\tmp" | Out-Null
          $env:W = $W; $env:MODELS = "$W\models"; $env:OUT = "$W\out"
          "W=$W" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "MODELS=$W\models" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OUT=$W\out" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-CimInstance Win32_VideoController | Select-Object Name,AdapterRAM,DriverVersion | Format-List
          foreach ($f in "h3probe.py","gttfill.py") { Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/oobabooga/unsloth/${{ github.sha }}/$f" -OutFile "$W\$f" }
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -UseBasicParsing "https://github.com/unslothai/stable-diffusion.cpp/releases/download/$env:TAG/sd-$env:TAG-bin-win-vulkan-x64.zip" -OutFile "$W\vk.zip"
          Expand-Archive -Force "$W\vk.zip" "$W\vk"
          Get-ChildItem -Recurse "$W\vk" -Filter sd-cli.exe | Select-Object -ExpandProperty FullName
          python -m venv "$W\venv"
          & "$W\venv\Scripts\python.exe" -m pip -q install -U "huggingface_hub[hf_xet]" vulkan
          $env:HF_HOME = "$W\hf"; $env:TMP = "$W\tmp"; $env:TEMP = "$W\tmp"
          & "$W\venv\Scripts\python.exe" -c "import os; from huggingface_hub import hf_hub_download as d; [print(d('unsloth/MiniMax-H3-GGUF', f, local_dir=os.environ['MODELS'])) for f in ['minimax_h3_fl2va_pruned-Q4_K.gguf','qwen3vl_32b_minimax_h3-Q4_K_M.gguf','vae/minimax_h3_video_vae_fp16.safetensors','vae/minimax_h3_audio_vae_fp32.safetensors']]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: List devices
        shell: powershell
        run: |
          $VK = (Get-ChildItem -Recurse "$env:W\vk" -Filter sd-cli.exe | Select-Object -First 1).FullName
          "VK=$VK" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & $VK --list-devices
          exit 0
      - name: W_studio_c (Studio Windows Auto flags, TE on GPU; shared pool held to 30 GiB)
        shell: powershell
        run: |
          $fill = Start-Process -PassThru -NoNewWindow -FilePath "$env:W\venv\Scripts\python.exe" -ArgumentList "$env:W\gttfill.py","30" -RedirectStandardOutput "$env:W\fill_W_studio_c.log" -RedirectStandardError "$env:W\fill_W_studio_c.err"
          for ($i = 0; $i -lt 600; $i++) { if ((Test-Path "$env:W\fill_W_studio_c.log") -and (Select-String -Quiet -Path "$env:W\fill_W_studio_c.log" -Pattern "FILLED gtt")) { break }; Start-Sleep 1 }
          Get-Content "$env:W\fill_W_studio_c.log"; Get-Content "$env:W\fill_W_studio_c.err" -ErrorAction SilentlyContinue
          python "$env:W\h3probe.py" W_studio_c "$env:VK" --offload-to-cpu --diffusion-fa --max-vram -1 --backend diffusion=Vulkan0,te=Vulkan0,vae=Vulkan0
          Stop-Process -Id $fill.Id -Force
          exit 0
      - name: W_te_cpu_c (TE on CPU; shared pool held to 30 GiB)
        shell: powershell
        run: |
          $fill = Start-Process -PassThru -NoNewWindow -FilePath "$env:W\venv\Scripts\python.exe" -ArgumentList "$env:W\gttfill.py","30" -RedirectStandardOutput "$env:W\fill_W_te_cpu_c.log" -RedirectStandardError "$env:W\fill_W_te_cpu_c.err"
          for ($i = 0; $i -lt 600; $i++) { if ((Test-Path "$env:W\fill_W_te_cpu_c.log") -and (Select-String -Quiet -Path "$env:W\fill_W_te_cpu_c.log" -Pattern "FILLED gtt")) { break }; Start-Sleep 1 }
          Get-Content "$env:W\fill_W_te_cpu_c.log"; Get-Content "$env:W\fill_W_te_cpu_c.err" -ErrorAction SilentlyContinue
          python "$env:W\h3probe.py" W_te_cpu_c "$env:VK" --offload-to-cpu --diffusion-fa --max-vram -1 --clip-on-cpu --backend diffusion=Vulkan0,te=cpu,vae=Vulkan0
          Stop-Process -Id $fill.Id -Force
          exit 0
      - name: Summary
        if: always()
        shell: cmd
        run: |
          type "%OUT%\results.jsonl"
          for %%f in ("%OUT%\*.log") do (echo === %%f & findstr /i /c:"error" /c:"lost" /c:"abort" /c:"assert" /c:"prepared params" /c:"out of" "%%f")
          exit /b 0
