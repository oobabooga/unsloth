name: AMD Strix dropdown crash

on:
  push:
    branches: [amd-strix-dropdown-crash]

permissions:
  contents: read

jobs:
  repro:
    name: Reproduce Strix Halo telemetry crash
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Hardware
        run: bash probe/01_hardware.sh
      - name: Install Unsloth Studio
        run: bash probe/05_install_studio.sh
      - name: Which request reaches the native GPU probes
        run: bash probe/10_trace_dropdown_local_model.sh
      - name: Dump logs
        if: always()
        run: bash probe/07_dump.sh
