name: PR 11116 Windows icon refresh simulation

on:
  push:
    branches: [pr11116-win-sim]

permissions: {}

jobs:
  sim:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Environment
        shell: powershell
        run: |
          [Environment]::OSVersion.VersionString
          "session=" + (Get-Process -Id $PID).SessionId
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId, StartTime | Format-Table
          python --version
          [Environment]::GetFolderPath("Desktop")
      - name: Fetch the PR head and the simulation
        shell: powershell
        run: |
          git init -q "$env:RUNNER_TEMP\pr"
          git -C "$env:RUNNER_TEMP\pr" fetch -q --depth 1 https://github.com/unslothai/unsloth c8f7f19cb749444f9c6882ee1f69032e10fbe7e1
          git -C "$env:RUNNER_TEMP\pr" checkout -q FETCH_HEAD
          git -C "$env:RUNNER_TEMP\pr" log -1 --format=%H
          git clone -q --depth 1 -b pr11116-win-sim https://github.com/oobabooga/unsloth "$env:RUNNER_TEMP\simsrc"
          python -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -c "import sys; print(sys.executable, sys.version)"
      - name: A/B flushed vs unflushed from an exiting child (venv interpreter)
        continue-on-error: true
        shell: powershell
        run: python "$env:RUNNER_TEMP\simsrc\sim\ab.py" "$env:RUNNER_TEMP\venv\Scripts\python.exe" "$env:RUNNER_TEMP\ab" 15
      - name: New-StudioShortcuts, fallback rung, pwsh 7
        continue-on-error: true
        shell: pwsh
        run: pwsh -NoProfile -File "$env:RUNNER_TEMP\simsrc\sim\shortcuts.ps1" -InstallPs1 "$env:RUNNER_TEMP\pr\install.ps1" -Mode fallback -VenvPython "$env:RUNNER_TEMP\venv\Scripts\python.exe" -Work "$env:RUNNER_TEMP\fb7" -HostPython (Get-Command python).Source
      - name: New-StudioShortcuts, fallback rung, Windows PowerShell 5.1
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -File "$env:RUNNER_TEMP\simsrc\sim\shortcuts.ps1" -InstallPs1 "$env:RUNNER_TEMP\pr\install.ps1" -Mode fallback -VenvPython "$env:RUNNER_TEMP\venv\Scripts\python.exe" -Work "$env:RUNNER_TEMP\fb51" -HostPython (Get-Command python).Source
      - name: New-StudioShortcuts, primary rung (ordinary host), Windows PowerShell 5.1
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -File "$env:RUNNER_TEMP\simsrc\sim\shortcuts.ps1" -InstallPs1 "$env:RUNNER_TEMP\pr\install.ps1" -Mode primary -VenvPython "$env:RUNNER_TEMP\venv\Scripts\python.exe" -Work "$env:RUNNER_TEMP\pr51" -HostPython (Get-Command python).Source
