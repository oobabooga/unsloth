name: "AMD CI: does the Windows selector match a runner"

# Hand written, NOT scaffolded, for the same reason as the Linux branch:
# scaffold.py emits a PR base-vs-head differential and this is a capability
# probe. Linted with amd_ci/lib/lint_workflow.py.
#
# A label matching no runner does not fail the job, it queues it forever, and a
# stalled queue looks exactly like a busy pool. So this workflow carries jobs
# that differ ONLY in the OS label:
#
#   linux-control  [self-hosted, Linux,   strix-halo, devlab-dispatch]
#   windows        [self-hosted, Windows, strix-halo, devlab-dispatch]
#
# Round 1 result: the Windows label DID match, on machine X2-LA01-S04-D02, and
# the pwsh step died with "pwsh: command not found" in three seconds. That is a
# Linux shaped error, so windows-bash re-asks the same selector with bash and
# prints RUNNER_OS and uname, to establish whether the label is attached to a
# Linux runner rather than to a Windows host.
#
# No job touches the GPU, so none takes the amd-ci-gfx1151-gpu group.

on:
  push:
    branches: [amd-ci-docker-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  linux-control:
    name: "control: Linux label"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 20
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Identify
        run: |
          set +e
          set -uo pipefail
          echo "runner_name=${RUNNER_NAME:-?} runner_os=${RUNNER_OS:-?} arch=${RUNNER_ARCH:-?}"
          uname -a
          date -Is

  windows-bash:
    name: "subject: Windows label, bash shell"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 30
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Identify with bash
        shell: bash
        run: |
          set +e
          set -uo pipefail
          echo "runner_name=${RUNNER_NAME:-?} runner_os=${RUNNER_OS:-?} arch=${RUNNER_ARCH:-?}"
          echo "OS=${OS:-unset} COMSPEC=${COMSPEC:-unset}"
          uname -a
          cat /proc/version
          command -v pwsh powershell cmd.exe docker
          ls -l /dev/kfd /dev/dri
          date -Is

  windows-default-shell:
    name: "subject: Windows label, default shell"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 30
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Identify with the runner default shell
        continue-on-error: true
        run: |
          echo "default shell reached"
          echo "runner_os=${RUNNER_OS:-?}"
          uname -a
