name: "AMD CI: does the Windows selector match a runner"

# Hand written, NOT scaffolded, for the same reason as the Linux branch:
# scaffold.py emits a PR base-vs-head differential and this is a capability
# probe. Linted with amd_ci/lib/lint_workflow.py.
#
# A label matching no runner does not fail the job, it queues it forever, and a
# stalled queue looks exactly like a busy pool. So every round keeps a
# linux-control job that differs from the subject ONLY in the OS label.
#
# Round 1: `shell: pwsh` died "pwsh: command not found" in 3 s.
# Round 2: `shell: bash` died "bash: command not found" on DESKTOP-O81NVEC, and
#          the default shell resolved to
#          C:\WINDOWS\System32\WindowsPowerShell\v1.0\powershell.EXE on
#          DESKTOP-NILQUD2. So the label matches genuine Windows hosts running
#          Windows PowerShell 5.1, with neither pwsh nor bash installed.
# Round 3: recon through powershell, four parallel slots so more than one
#          machine in the pool is sampled.
#
# No job touches the GPU, so none takes the amd-ci-gfx1151-gpu group.

on:
  push:
    branches: [amd-ci-docker-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  linux-control:
    name: "control: Linux label"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 20
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Identify
        run: |
          set +e
          set -uo pipefail
          echo "runner_name=${RUNNER_NAME:-?} runner_os=${RUNNER_OS:-?} arch=${RUNNER_ARCH:-?}"
          uname -a
          date -Is

  windows-recon:
    name: "subject: Windows label, powershell recon"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Identify
        shell: powershell
        continue-on-error: true
        run: |
          echo "slot=${{ matrix.slot }}"
          echo "computername=$env:COMPUTERNAME os=$env:OS runner_name=$env:RUNNER_NAME"
          $PSVersionTable
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
          Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model, TotalPhysicalMemory, NumberOfLogicalProcessors

      - name: GPU as Windows sees it
        shell: powershell
        continue-on-error: true
        run: |
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterCompatibility, VideoProcessor, Status
          Get-ChildItem 'C:\Program Files\AMD' -ErrorAction SilentlyContinue | Format-Table Name
          Get-ChildItem 'C:\Program Files\AMD\ROCm' -ErrorAction SilentlyContinue | Format-Table Name

      - name: Tooling present
        shell: powershell
        continue-on-error: true
        run: |
          Get-Command docker -ErrorAction SilentlyContinue | Format-List Name, Source, Version
          Get-Command pwsh -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-Command bash -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-Command wsl -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-Command git -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-Command python -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-Command hipInfo -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-Command rocm-smi -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-Command amd-smi -ErrorAction SilentlyContinue | Format-List Name, Source
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

      - name: Docker daemon
        shell: powershell
        continue-on-error: true
        run: |
          docker version
          docker info
          docker run --rm hello-world
