name: "AMD CI (Windows): on-demand SSM kernels (9f5b13325 vs main vs 7092b2bdf)"

# Built from amd_ci/templates/workflow_windows.yml (scaffold.py --windows), then extended:
#   windows-amd     real Studio install (install.ps1 --local, head) on the Radeon 8060S, then the
#                   on-demand probe per state: setup SSM step, inference + training SSM blocks,
#                   a short LoRA run and decode.
#   windows-cuda13  a venv with a REAL torch 2.12.0+cu130 wheel (no NVIDIA driver here), the
#                   state's wheel resolver over torch 2.10-2.13 x cp311-cp313, real installs of
#                   the release wheels and an import of the compiled extensions.

on:
  push:
    branches: [amd-ci-v4-ondemand-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "13971"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  MERGED: "0"

jobs:

  linux-control:
    name: "linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"

  windows-amd:
    name: "Windows AMD: Studio on-demand SSM kernels"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    concurrency:
      group: amd-ci-strix-halo-windows-gpu
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "v4-windows-amd"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) { Write-Host "FATAL: no system Python"; exit 1 }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "SYS_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:SYS_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          & $env:SYS_PY "$env:GITHUB_WORKSPACE\.github\make_states.py" "$env:AMD_CI_WORK"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Studio install (head, install.ps1 --local)
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = "Continue"
          $env:UNSLOTH_STUDIO_HOME = "$env:AMD_CI_WORK\studio"
          Add-Content -Path $env:GITHUB_ENV -Value "UNSLOTH_STUDIO_HOME=$env:UNSLOTH_STUDIO_HOME"
          Set-Location "$env:AMD_CI_WORK\states\head"
          $t0 = Get-Date
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --local *> "$env:AMD_CI_WORK\out\install_head.log"
          $rc = $LASTEXITCODE
          $wall = [int]((Get-Date) - $t0).TotalSeconds
          "install.ps1 --local (head) rc=$rc wall=${wall}s" | Tee-Object -FilePath "$env:AMD_CI_WORK\out\install_head_time.txt"
          Get-Content "$env:AMD_CI_WORK\out\install_head.log" -Tail 20
          Select-String -Path "$env:AMD_CI_WORK\out\install_head.log" -Pattern "causal|mamba|ssm" | Select-Object -First 40
          $py = $null
          foreach ($c in @("$env:UNSLOTH_STUDIO_HOME\unsloth_studio\Scripts\python.exe")) {
            if (Test-Path -LiteralPath $c) { $py = $c }
          }
          if ($null -eq $py) { Write-Host "FATAL: no Studio venv"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"
          & $py -c "import torch; print(torch.__version__, torch.version.hip, torch.cuda.is_available())"

      - name: Differential
        run: |
          $ErrorActionPreference = "Continue"
          $env:V4_SCRATCH = "$env:AMD_CI_WORK\scratch"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/v4_ondemand_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/v4_ondemand_criteria.py" `
            --out-dir "$env:AMD_CI_WORK\out\windows" `
            --python "$env:AMD_CI_PY" -- --budget-min 90
          Get-Content "$env:AMD_CI_WORK\out\windows\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\windows"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-amd
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  windows-cuda13:
    name: "Windows + CUDA 13.0 torch wiring (no NVIDIA driver)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "v4-windows-cuda13"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = "C:\Program Files\Python312\python.exe"
          if (-not (Test-Path -LiteralPath $found)) { Write-Host "FATAL: no Python312"; exit 1 }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "SYS_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:SYS_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          & $env:SYS_PY "$env:GITHUB_WORKSPACE\.github\make_states.py" "$env:AMD_CI_WORK" --only base,head
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CUDA 13.0 torch venv
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = "Continue"
          & $env:SYS_PY -m venv "$env:AMD_CI_WORK\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          & $py -m pip install -q torch==2.12.0 --index-url https://download.pytorch.org/whl/cu130
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q "triton-windows==3.7.0.post26" structlog packaging requests huggingface_hub einops
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"

      - name: Differential
        run: |
          $ErrorActionPreference = "Continue"
          $env:V4_SCRATCH = "$env:AMD_CI_WORK\scratch"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/v4_wiring_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/v4_wiring_criteria.py" `
            --out-dir "$env:AMD_CI_WORK\out\cuda13" `
            --python "$env:AMD_CI_PY"
          Get-Content "$env:AMD_CI_WORK\out\cuda13\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\cuda13"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-windows-cuda13
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
