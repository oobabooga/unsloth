name: "AMD CI: validate PR 10301"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-pr10301]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "10301"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  suites:
    name: "PR 10301 suites, base vs head"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr10301-suites"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment
        timeout-minutes: 60
        run: |
          set -euo pipefail
          # Heavy, and only needed if the suites import torch. Delete otherwise.
          cd "$AMD_CI_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          # The runners' uv index (/etc/uv/uv.toml) is a PyPI mirror that lags new releases, so a
          # tree pinning the newest unsloth fails to resolve. pip.conf already adds pypi.org as an
          # extra index; give uv the same. A global UV_EXCLUDE_NEWER is NOT a substitute: it drops
          # the ROCm torch index, whose wheels carry no upload time.
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" -m pip install -q pytest pytest-asyncio pytest-timeout

      - name: Differential
        run: |
          set +e
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/pytest_probe.py \
            --criteria amd_ci/criteria/pytest_no_regression.py \
            --out-dir "$AMD_CI_WORK/out/suites" \
            --python "${AMD_CI_PY:-python3}" \
            -- --tests tests/test_a_cancelled_round_drains_every_call.py tests/test_a_caption_holder_is_refused_when_its_victims_stay_wedged.py tests/test_a_closed_gguf_round_stops_its_siblings.py tests/test_a_contended_report_reclaims_idle_residue_before_it_plans.py tests/test_a_diffusion_runner_never_asks_for_an_exact_reload.py tests/test_a_direct_holder_never_goes_upstream_before_its_victims_let_go.py tests/test_a_direct_holder_waits_for_its_victims_to_let_go.py tests/test_a_direct_holder_waits_for_the_victim_that_replaced_a_revoked_one.py tests/test_a_failed_pause_wait_is_not_permission_to_decode.py tests/test_a_failed_props_read_keeps_the_park_notices.py tests/test_a_first_token_waits_for_a_probe_started_after_it.py tests/test_a_fitted_plain_prompt_is_what_the_ledger_counts.py tests/test_a_generically_erased_approval_waits_to_recost.py tests/test_a_holder_that_parks_during_the_erases_keeps_its_charge.py tests/test_a_legacy_completion_is_counted_beside_a_chat.py tests/test_a_load_in_flight_counts_for_the_exact_reload.py tests/test_a_long_prefill_keeps_its_batch_reserve.py tests/test_a_parallel_round_charges_its_arguments_once.py tests/test_a_parallel_round_classifies_the_healed_arguments_before_overlapping.py tests/test_a_parallel_round_dedupes_healed_calls_and_freezes_its_branch.py tests/test_a_park_keepalive_cannot_outlive_the_cap.py tests/test_a_parked_victim_counts_as_freed_only_once_erased.py tests/test_a_parking_server_admits_every_chat_that_fits_alone.py tests/test_a_pause_inside_a_textual_tool_call_restarts_the_call.py tests/test_a_pause_keeps_the_thought_and_a_stop_ends_the_wait.py tests/test_a_pause_on_a_spent_cap_ends_the_turn.py tests/test_a_paused_final_pass_resumes_from_its_answer_not_its_display.py tests/test_a_paused_round_keeps_its_counts_and_caps.py tests/test_a_plain_resume_clears_the_signal_before_it_reopens.py tests/test_a_plain_resume_does_not_refit_what_was_already_dropped.py tests/test_a_plain_resume_keeps_the_callers_arguments.py tests/test_a_provider_round_honours_parallel_tool_calls_false.py tests/test_a_raw_holder_announces_its_prompt_not_its_allowance.py tests/test_a_raw_park_reaches_the_client_and_exact_needs_the_server_to_park.py tests/test_a_reclaimed_round_keeps_its_replay_until_published.py tests/test_a_refused_yield_and_a_padded_name_keep_their_accounting.py tests/test_a_resume_books_its_replay_not_the_stale_charge.py tests/test_a_resume_counts_every_pending_replay.py tests/test_a_resume_counts_only_the_cells_it_owns.py tests/test_a_resume_holds_its_room_and_a_pause_keeps_its_lease_alive.py tests/test_a_resume_keeps_the_thought_before_its_prose.py tests/test_a_resume_replays_its_prompt_and_a_choice_starts_afresh.py tests/test_a_resume_shares_one_hard_deadline.py tests/test_a_revoked_victim_is_replaced_and_pending_pressure_reclaims_idle_first.py tests/test_a_round_that_may_ask_stays_in_order.py tests/test_a_rounds_growth_stays_on_top_until_a_reading_holds_it.py tests/test_a_server_that_parks_its_own_slots_gets_no_per_token_callback.py tests/test_a_solo_chat_pays_for_no_sweep.py tests/test_a_spent_allowance_is_not_charged_twice.py tests/test_a_stopped_parallel_round_ends_its_tool_drivers.py tests/test_a_tool_round_publishes_the_count_its_recost_took.py tests/test_account_installation_mutations.py tests/test_account_shared_load_settings.py tests/test_admission_switches_are_honoured_everywhere.py tests/test_an_approval_during_an_erase_still_records_it.py tests/test_an_auto_load_with_an_unsized_pool_does_not_keep_an_oversized_parking_budget.py tests/test_an_erase_is_seen_and_a_prefill_stays_reserved.py tests/test_an_erase_never_lands_on_a_slot_reassigned_since_the_snapshot.py tests/test_an_exact_retry_bounds_its_parking_like_a_plain_launch.py tests/test_an_unavailable_slots_probe_says_so_once.py tests/test_an_unpausable_holder_is_sized_and_ordered.py tests/test_anthropic_messages.py tests/test_anthropic_studio_tools.py tests/test_arming_a_chat_never_blocks_the_event_loop.py tests/test_arming_honours_the_accounting_gate_and_the_counted_prompt.py tests/test_arming_on_a_parking_server_starts_no_residency_thread.py tests/test_auto_exact_falls_back_before_launch_when_its_weights_take_the_room.py tests/test_auto_exact_on_an_unreadable_host_and_a_save_during_resolution.py tests/test_cached_idle_residue_is_reclaimed_before_a_victim_is_chosen.py tests/test_chat_generation_lease_compat.py tests/test_checkpoint_compaction.py tests/test_context_overflow_truncation.py tests/test_conversation_recall_injection.py tests/test_exact_concurrency_switch.py tests/test_external_tool_edge_cases.py tests/test_gguf_admission_token_count.py tests/test_length_truncated_reasoning_continuation.py tests/test_llama_admission_compat_matrix.py tests/test_llama_admission_enforced_max_tokens.py tests/test_llama_admission_enforced_paths.py tests/test_llama_admission_kv_budget.py tests/test_llama_admission_kv_budget_media_and_tools.py tests/test_llama_admission_unstated_max_tokens.py tests/test_llama_cpp_tool_loop.py tests/test_llama_plain_chat_preempt_resume.py tests/test_llama_preemption.py tests/test_llama_preemption_cancel_during_arm.py tests/test_llama_preemption_is_armed_on_chat_surfaces.py tests/test_llama_preemption_resume_order.py tests/test_llama_route_timeouts.py tests/test_llama_server_args.py tests/test_llama_tool_loop_preempt_resume.py tests/test_mcp_image.py tests/test_only_output_counts_and_a_spent_cap_is_not_reopened.py tests/test_openai_tool_passthrough.py tests/test_overlapping_probes_are_ordered_by_when_they_started.py tests/test_parallel_round_divides_room_among_launched_calls.py tests/test_preempt_resumes_end_on_stalls_not_counts.py tests/test_preemption_on_by_default.py tests/test_preemption_survives_a_respawn_and_a_slow_server.py tests/test_raw_nonstream_waits_out_a_server_park.py tests/test_research_internal_call_tool_gate.py tests/test_research_preempt_pause_deadline.py tests/test_server_mode_token_path_reads_no_slots.py tests/test_server_park_notices_are_indexed.py tests/test_server_side_preemption_handoff.py tests/test_single_user_latency_levers.py tests/test_studio_tool_loop.py tests/test_studio_tool_loop_preemption.py tests/test_the_anthropic_tool_loop_reports_like_the_gguf_one.py tests/test_the_first_tool_round_stays_unmeasured_until_its_prompt_is_in.py tests/test_the_optimism_matches_what_can_be_reclaimed.py tests/test_tool_approval_context_release.py tests/test_tool_calls_within_one_turn_overlap.py tests/test_two_probes_started_on_one_epoch_keep_the_later_reading.py tests/test_underscore_spellings_are_read_as_llama_cpp_reads_them.py tests/test_without_preemption_a_tool_round_recosts_as_main_did.py tests/test_without_preemption_admission_charges_what_main_charged.py
          cat "$AMD_CI_WORK/out/suites/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/suites"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10301-suites
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  gpu:
    name: "PR 10301 GPU measurement (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 240
    # A shared constant, deliberately: it serialises every GPU measurement across
    # all branches. That is stricter than co-tenancy strictly requires now that the
    # pool is many machines, but nothing in the label set can pin or exclude a
    # machine, so "two GPU jobs never run at once" is the only enforceable version
    # of "no co-tenant moved my number".
    # The cost is that the group holds one runner plus one waiter,
    # so a third arrival evicts the waiter. `cancel-in-progress: false` protects
    # the job already running, not the one queued behind it. Re-run the job.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr10301-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          # The runners' uv index (/etc/uv/uv.toml) is a PyPI mirror that lags new releases, so a
          # tree pinning the newest unsloth fails to resolve. pip.conf already adds pypi.org as an
          # extra index; give uv the same. A global UV_EXCLUDE_NEWER is NOT a substitute: it drops
          # the ROCm torch index, whose wheels carry no upload time.
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          # Now with torch present, the gate is meaningful. It EXITS 1 on a miss.
          # Absolute path: this step cd'd into the head worktree, which has no amd_ci/.
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/llama_preempt_probe.py \
            --criteria amd_ci/criteria/llama_preempt_criteria.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --map base=https://github.com/ggml-org/llama.cpp@2639a3b4e029d1be80ca4a472d62dfea23609075 --map head=https://github.com/unslothai/llama.cpp@d1766ccb53d00a6313b3658a75b9f013919265e8 --map merge=https://github.com/unslothai/llama.cpp@d1766ccb53d00a6313b3658a75b9f013919265e8
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10301-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
