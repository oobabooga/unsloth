name: "AMD CI: is the unified-memory corruption about the model or about the size (gfx1151)"

# Third pass at the Strix Halo gibberish. The first two are on branches
# amd-ci-llamacpp-uma (INCONCLUSIVE: upstream b10639 could not load qwen4exp at
# all) and amd-ci-llamacpp-uma2 (run 33066591381, six cells, every one
# NO_REGRESSION with byte-identical greedy output).
#
# THE CONFOUND THIS BRANCH EXISTS TO BREAK
#
# uma2 could not fit any Qwen3.8-Flash-Next quant (>= 67.6 GiB against 62 GB of
# RAM), so it substituted Qwen3.8-27B UD-Q4_K_XL at 16.4 GiB. That substitution
# happened to pick the ONE model in the affected set that is not a mixture of
# experts:
#
#   model                 model_type    experts          reported
#   Qwen3.8-Flash-Next    qwen4_exp     512, 10 active   corrupt (HF #30, 5 on Reddit)
#   DeepSeek-V4-Flash     deepseek_v4   256, 6 active    corrupt (aigemie, huaj1ng)
#   Qwen3-Coder-Next      qwen3_next    512, 10 active   corrupt (llama.cpp#26148)
#   Qwen3.8-27B           qwen3_5       none, DENSE      clean, 6 cells
#
# Every model that corrupts is a large MoE. The one measured clean is dense and
# small. Size and architecture are confounded in every report anyone has, and
# uma2's negative does not separate them.
#
# ggml-org/llama.cpp#26148 is the lever. It is a second, independent report of
# this exact variable corrupting output on this exact arch, open since
# 2026-07-26 with zero comments, and it is on Qwen3-Coder-Next rather than any
# Qwen3.8 model, reproduced on Qwen's own GGUF as well as Unsloth's. Its
# reporter has 64 GB, the same class as this runner, and its Q4_K_M is 45.1 GiB,
# which FITS here. The reported model finally fits.
#
# CELLS, cheapest first. U2 and U3 use uma2's W2 flags VERBATIM so that the only
# thing that changes between W2, U2 and U3 is the model file.
#
#   U1  hipMallocManaged / hipMemAdvise, ctypes, no model    2 min
#   U2  Qwen3-30B-A3B UD-Q4_K_XL 16.5 GiB, MoE               MoE or size? Same
#                                                            size as W2's dense
#   U3  Qwen3-Coder-Next Q4_K_M 45.1 GiB, W2 flags           model held to one
#                                                            variable against U2
#   U4  Qwen3-Coder-Next, llama.cpp#26148's flags verbatim   the reporter's own
#                                                            configuration
#   U5  Qwen3-Coder-Next, --ngl 24 so it sits inside         pressure or arch?
#
# U2 is the cell to care about. W2 already says dense-and-small is clean. If
# MoE-and-small corrupts, this is the expert gather and the size story is dead.
# If U2 stays clean and U3 corrupts, it is memory pressure and the argument for
# the fix changes completely.
#
# BOUNDS, written before the run rather than after. 62 GB of RAM and NO SWAP.
# U3 to U5 put 45.1 GiB of weights on a host that already had 14 GB in use when
# uma2 measured it, so an OOM kill is a real outcome; `free` is recorded around
# every cell and the criteria module reads an OOM as INCONCLUSIVE rather than as
# a clean negative. One physical gfx1151, Linux, RADV or upstream ROCm. Nothing
# here speaks to Windows, to discrete RDNA 3 or 4, or to the 128 GB hosts the
# Reddit reporters have.

on:
  push:
    branches: [amd-ci-llamacpp-uma3]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The reporters' build, not an upstream tag of the same number.
  UNSLOTH_LLAMA_TAG: "b10639-mix-f6f92fe"
  # 16.50 GiB. Sized to match uma2's W2 (16.4 GiB) so the pair differs in
  # architecture and not in how much memory is being asked for.
  MOE_REPO: "unsloth/Qwen3-30B-A3B-GGUF"
  MOE_REV: "d5b1d57bd0b504ac62ae6c725904e96ef228dc74"
  MOE_FILE: "Qwen3-30B-A3B-UD-Q4_K_XL.gguf"
  # 45.1 GiB over four shards. llama.cpp#26148's model, at Qwen's own repo
  # rather than Unsloth's, because the reporter saw it on both and the one that
  # is not ours is the stronger evidence.
  CODER_REPO: "Qwen/Qwen3-Coder-Next-GGUF"
  CODER_REV: "b82fb7382639d97b38fa7672e526c760c2fb358e"
  CODER_DIR: "Qwen3-Coder-Next-Q4_K_M"
  CODER_HEAD: "Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf"
  CTX: "8192"
  CTX_26148: "4096"
  NPREDICT: "30"
  REPEATS: "3"
  NGL: "999"
  NGL_PARTIAL: "24"

jobs:

  gpu:
    name: "unified memory, MoE against dense, on gfx1151 (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 400
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "llamacpp-uma3"

      - name: Hardware gate and memory bounds
        run: |
          set -eu
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"
          { rocminfo || true; } > "$AMD_CI_WORK/out/rocminfo.txt" 2>&1
          { vulkaninfo --summary || true; } > "$AMD_CI_WORK/out/vulkaninfo.txt" 2>&1
          { uname -a; } > "$AMD_CI_WORK/out/uname.txt" 2>&1
          # Evidence, not decoration: 45.1 GiB of weights on this is the whole
          # question, so the reader needs the number the job actually saw.
          { free -g; } > "$AMD_CI_WORK/out/free_start.txt" 2>&1
          cat "$AMD_CI_WORK/out/free_start.txt"
          df -h "$AMD_CI_WORK" | tail -1

      - name: Fetch the Unsloth llama.cpp build
        timeout-minutes: 30
        run: |
          set -eu
          R="https://github.com/unslothai/llama.cpp/releases/download/$UNSLOTH_LLAMA_TAG"
          python3 amd_ci/lib/fetch_llamacpp.py \
            --url "$R/app-$UNSLOTH_LLAMA_TAG-linux-x64-rocm-gfx1151.tar.gz" \
            --dest "$AMD_CI_WORK/lcpp/rocm" --out "$AMD_CI_WORK/out/bin_rocm.json"
          python3 amd_ci/lib/emit_bin_env.py "$AMD_CI_WORK/out" >> "$GITHUB_ENV"
          python3 amd_ci/lib/emit_bin_env.py "$AMD_CI_WORK/out"

      - name: U1 - what hipMallocManaged and hipMemAdvise do here
        if: always()
        run: |
          set +e
          # No model, no differential: this is one reading of one host, and the
          # question it answers is whether the coarse-grain hint that ggml
          # discards succeeds on Linux gfx1151. On a Windows gfx1201 R9700 every
          # advice value returned hipErrorInvalidValue, which contradicts
          # llama.cpp#20536's stated reason for making the call non-fatal.
          # The ROCm bundle ships its own libamdhip64 flat beside the binaries.
          python3 amd_ci/probes/hip_managed_memory_probe.py \
            --lib-dir "$ROCM_BIN" --mib 512 \
            --out "$AMD_CI_WORK/out/U1_hip_managed.json"
          rc=$?
          echo "probe exit: $rc"
          {
            echo '### U1 hipMallocManaged and hipMemAdvise on this host'
            echo '```json'
            cat "$AMD_CI_WORK/out/U1_hip_managed.json" 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch models
        timeout-minutes: 180
        run: |
          set -eu
          M="$AMD_CI_WORK/models"
          python3 amd_ci/lib/fetch_gguf.py --repo "$MOE_REPO" --file "$MOE_FILE" \
            --revision "$MOE_REV" --as-name model.gguf --local-dir "$M/moe_ctl" \
            --out "$AMD_CI_WORK/out/model_moe.json"
          # Every shard under its real name: llama.cpp is pointed at shard 1 and
          # finds the rest by the -of-0000N convention, and the probe's own gate
          # globs *.gguf to assert the states hold the same set.
          for N in 00001 00002 00003 00004; do
            F="Qwen3-Coder-Next-Q4_K_M-$N-of-00004.gguf"
            python3 amd_ci/lib/fetch_gguf.py --repo "$CODER_REPO" \
              --file "$CODER_DIR/$F" --revision "$CODER_REV" --as-name "$F" \
              --local-dir "$M/coder_ctl" \
              --out "$AMD_CI_WORK/out/model_coder_$N.json"
          done
          df -h "$AMD_CI_WORK" | tail -1
          du -sh "$M/moe_ctl" "$M/coder_ctl"

      - name: Build the state directories
        run: |
          set -eu
          # Hardlinks: write_states.py resolve()s paths and refuses two states on
          # one directory, so a symlink is rejected and a copy would cost another
          # 62 GB. Distinct directories over identical bytes is exactly what the
          # "same model file, shard for shard" gate asserts.
          M="$AMD_CI_WORK/models"
          mkdir -p "$M/moe_uma1"
          ln -f "$M/moe_ctl/model.gguf" "$M/moe_uma1/model.gguf"
          for D in coder_uma1 coder_ctl26 coder_uma126 coder_ctlp coder_uma1p; do
            mkdir -p "$M/$D"
            for F in "$M"/coder_ctl/*.gguf; do ln -f "$F" "$M/$D/$(basename "$F")"; done
          done
          # `-NAME` means UNSET, and it is the only honest control: ggml enables
          # unified memory on the PRESENCE of the name, so `NAME=` would enable
          # the very thing being controlled for.
          for D in moe_ctl coder_ctl coder_ctl26 coder_ctlp; do
            printf '%s\n' '-GGML_CUDA_ENABLE_UNIFIED_MEMORY' > "$M/$D/env"
          done
          for D in moe_uma1 coder_uma1 coder_uma126 coder_uma1p; do
            printf '%s\n' 'GGML_CUDA_ENABLE_UNIFIED_MEMORY=1' > "$M/$D/env"
          done
          for D in moe_ctl moe_uma1 coder_ctl coder_uma1 coder_ctl26 coder_uma126 \
                   coder_ctlp coder_uma1p; do
            echo "--- $D/env"; cat "$M/$D/env"
          done
          python3 amd_ci/lib/write_states.py --require-file model.gguf \
            --path "base=$M/moe_ctl" --path "head=$M/moe_uma1" \
            --label "base=unset" --label "head==1" \
            --out "$AMD_CI_WORK/out/states_moe.json"
          python3 amd_ci/lib/write_states.py --require-file "$CODER_HEAD" \
            --path "base=$M/coder_ctl" --path "head=$M/coder_uma1" \
            --label "base=unset" --label "head==1" \
            --out "$AMD_CI_WORK/out/states_coder.json"
          python3 amd_ci/lib/write_states.py --require-file "$CODER_HEAD" \
            --path "base=$M/coder_ctl26" --path "head=$M/coder_uma126" \
            --label "base=unset" --label "head==1" \
            --out "$AMD_CI_WORK/out/states_coder26.json"
          python3 amd_ci/lib/write_states.py --require-file "$CODER_HEAD" \
            --path "base=$M/coder_ctlp" --path "head=$M/coder_uma1p" \
            --label "base=unset" --label "head==1" \
            --out "$AMD_CI_WORK/out/states_coderp.json"

      - name: U2 - Qwen3-30B-A3B 16.5 GiB MoE, ROCm, unset vs =1
        if: always()
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          # uma2's W2 flags verbatim. W2 ran a DENSE 16.4 GiB model here and came
          # out clean; this is 128 experts at the same size, so a divergence is
          # the expert gather and not the memory footprint.
          free -g > "$AMD_CI_WORK/out/free_U2_before.txt"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states_moe.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/U2" \
            --title "U2 Qwen3-30B-A3B UD-Q4_K_XL (MoE, 16.5 GiB), ROCm, unset vs =1, gfx1151" \
            -- --bin-dir "$ROCM_BIN" --gguf model.gguf --ngl "$NGL" \
               --ctx-size "$CTX" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=--parallel --extra-arg=1 --extra-arg=-fa --extra-arg=off \
               --load-timeout 1800 --request-timeout 1200
          free -g > "$AMD_CI_WORK/out/free_U2_after.txt"
          cat "$AMD_CI_WORK/out/U2/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/U2"

      - name: U3 - Qwen3-Coder-Next 45.1 GiB, ROCm, unset vs =1, W2 flags
        if: always()
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          # Same flags again, so U2 to U3 changes only the model. This is the
          # first time any run has put a REPORTED model on this hardware.
          free -g > "$AMD_CI_WORK/out/free_U3_before.txt"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states_coder.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/U3" \
            --title "U3 Qwen3-Coder-Next Q4_K_M (MoE, 45.1 GiB), ROCm, unset vs =1, gfx1151" \
            -- --bin-dir "$ROCM_BIN" --gguf "$CODER_HEAD" --ngl "$NGL" \
               --ctx-size "$CTX" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=--parallel --extra-arg=1 --extra-arg=-fa --extra-arg=off \
               --load-timeout 3600 --request-timeout 2400
          free -g > "$AMD_CI_WORK/out/free_U3_after.txt"
          cat "$AMD_CI_WORK/out/U3/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/U3"

      - name: U4 - Qwen3-Coder-Next with llama.cpp#26148's own flags
        if: always()
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          # The reporter's configuration verbatim: -c 4096, flash attention on,
          # q8_0 KV, --load-mode none, --fit off. --fit off is the load-bearing
          # one; with fitting on, llama.cpp quietly drops layers to make the
          # model sit inside the pool, which is precisely the pressure under test.
          free -g > "$AMD_CI_WORK/out/free_U4_before.txt"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states_coder26.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/U4" \
            --title "U4 Qwen3-Coder-Next Q4_K_M, llama.cpp#26148 flags verbatim, gfx1151" \
            -- --bin-dir "$ROCM_BIN" --gguf "$CODER_HEAD" --ngl "$NGL" \
               --ctx-size "$CTX_26148" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=-fa --extra-arg=on \
               --extra-arg=-ctk --extra-arg=q8_0 --extra-arg=-ctv --extra-arg=q8_0 \
               --extra-arg=--load-mode --extra-arg=none \
               --extra-arg=--fit --extra-arg=off \
               --load-timeout 3600 --request-timeout 2400
          free -g > "$AMD_CI_WORK/out/free_U4_after.txt"
          cat "$AMD_CI_WORK/out/U4/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/U4"

      - name: U5 - Qwen3-Coder-Next at partial offload, well inside the pool
        if: always()
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          # Same model, same flags as U3, but only 24 of 48 layers on the GPU, so
          # the managed allocation is roughly halved. If U3 diverges and this does
          # not, the variable is oversubscription rather than the architecture,
          # and the fix argument becomes "do not do this when the model does not
          # fit" instead of "do not do this at all".
          free -g > "$AMD_CI_WORK/out/free_U5_before.txt"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states_coderp.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/U5" \
            --title "U5 Qwen3-Coder-Next Q4_K_M at --ngl 24, ROCm, unset vs =1, gfx1151" \
            -- --bin-dir "$ROCM_BIN" --gguf "$CODER_HEAD" --ngl "$NGL_PARTIAL" \
               --ctx-size "$CTX" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=--parallel --extra-arg=1 --extra-arg=-fa --extra-arg=off \
               --load-timeout 3600 --request-timeout 2400
          free -g > "$AMD_CI_WORK/out/free_U5_after.txt"
          cat "$AMD_CI_WORK/out/U5/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/U5"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llamacpp-uma3-gfx1151
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
