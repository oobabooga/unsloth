name: "AMD CI: ROCm flash admission by whole-block timing, base vs head, gfx1151 (Linux)"

# Measurement only, origin/main. No secret is referenced; every model is a public download.

on:
  push:
    branches: [amd-ci-opt3-amdfa]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: "https://github.com/unslothai/unsloth"
  BASE_SHA: "5e927b0fa337ad18e84261dd1ca691f98a8931c6"
  FA_REPO: "https://github.com/Dao-AILab/flash-attention"
  FA_SHA: "1fc0221183e799363001394a12dd9e78e15f5dda"
  FA_TRITON_SHA: "bbe25bacff9f337568b66e69950e549df9839068"

jobs:

  gpu:
    name: "fused attention on gfx1151 (exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 600
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "opt3-amdfa"

      - name: Disk, memory, cores, ROCm toolchain on the host
        run: |
          set +e
          df -h "$RUNNER_TEMP"; free -g; nproc
          command -v hipcc; ls -d /opt/rocm* 2>/dev/null
          mkdir -p "$AMD_CI_WORK/out"
          exit 0

      - name: Resolve states (main, and main + opt3_amdfa.patch)
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "$UPSTREAM" "$AMD_CI_WORK/repo"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/base" "$BASE_SHA"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/head" "$BASE_SHA"
          git -C "$AMD_CI_WORK/states/head" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/opt3_amdfa.patch"
          git -C "$AMD_CI_WORK/states/head" diff --cached --stat
          python3 "$GITHUB_WORKSPACE/diffusion_bench/amd/write_states.py" --work "$AMD_CI_WORK" \
            --base-sha "$BASE_SHA" --patch opt3_amdfa.patch --out "$AMD_CI_WORK/out/states.json"

      - name: Studio install and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/states/base"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"

      - name: "flash-attention: CK build for gfx1151 (ROCm SDK devel from pip), Triton build in its own dir"
        timeout-minutes: 300
        run: |
          set +e
          O="$AMD_CI_WORK/out"
          "$AMD_CI_PY" -m pip install -q setuptools wheel packaging psutil ninja einops kernels > "$O/fa_deps.log" 2>&1
          echo "deps rc=$?"
          "$AMD_CI_PY" -m pip list 2>/dev/null | grep -i -E "^(torch|triton|rocm|pytorch)" | tee "$O/rocm_pkgs.txt"
          echo "host hipcc: $(command -v hipcc) (run 1: a wrapper whose /usr/lib/llvm/bin/clang++ is missing)"
          RV=$("$AMD_CI_PY" -c "import importlib.metadata as m; print(m.version('rocm'))")
          for IDX in https://repo.amd.com/rocm/whl/gfx1151/ https://rocm.nightlies.amd.com/v2/gfx1151/; do
            "$AMD_CI_PY" -m pip install "rocm[devel]==$RV" --extra-index-url "$IDX" >> "$O/rocm_devel.log" 2>&1 && { echo "rocm[devel]==$RV from $IDX"; break; }
          done
          tail -3 "$O/rocm_devel.log"
          VBIN=$(dirname "$AMD_CI_PY")
          ROOT=$("$VBIN/rocm-sdk" path --root 2>>"$O/rocm_devel.log")
          [ -n "$ROOT" ] || ROOT=$("$AMD_CI_PY" -m rocm_sdk path --root 2>>"$O/rocm_devel.log")
          echo "ROCm SDK root: '$ROOT'"; ls "$ROOT/bin" 2>/dev/null | grep -E "^(hipcc|amdclang|clang)" | head -5
          export ROCM_HOME="$ROOT" ROCM_PATH="$ROOT" HIP_PATH="$ROOT" PATH="$ROOT/bin:$ROOT/lib/llvm/bin:$PATH"
          echo "hipcc now: $(command -v hipcc)"; hipcc --version 2>&1 | head -3
          git clone -q "$FA_REPO" "$AMD_CI_WORK/src/flash-attention"
          cd "$AMD_CI_WORK/src/flash-attention"
          git checkout -q "$FA_SHA"
          git submodule update --init --depth 1 csrc/composable_kernel > /dev/null 2>&1
          git -C csrc/composable_kernel log -1 --format='CK %H %cd'
          T0=$(date +%s)
          GPU_ARCHS=gfx1151 OPT_DIM=128 MAX_JOBS=$(nproc) "$AMD_CI_PY" -m pip install -v --no-build-isolation --no-deps . > "$O/fa_ck_build.log" 2>&1
          rc=$?
          T1=$(date +%s)
          echo "CK build rc=$rc in $((T1-T0)) s"; grep -m5 -E "error:|FAILED" "$O/fa_ck_build.log" | cut -c1-300; tail -5 "$O/fa_ck_build.log"
          trc=-1
          echo "{\"ck_build_rc\": $rc, \"ck_build_s\": $((T1-T0)), \"triton_build_rc\": $trc, \"rocm_root\": \"$ROOT\"}" > "$O/fa_build.json"
          exit 0

      - name: "Attention alone + whole synthetic block at DiT shapes"
        timeout-minutes: 60
        run: |
          set +e
          O="$AMD_CI_WORK/out"
          export TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1 HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" amd_ci/probes/attn_bench.py --out "$O/attn_ck.json" > "$O/attn_ck.log" 2>&1
          echo "ck rc=$?"
          head -c 6000 "$O/attn_ck.json"
          exit 0

      - name: "Differential: auto attention on ROCm with flash_attn CK installed (klein, Z-Image)"
        timeout-minutes: 300
        run: |
          set +e
          export TORCH_HOME="$AMD_CI_WORK/torch_home"
          export HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe diffusion_bench/amd/diffusion_probe.py \
            --criteria diffusion_bench/amd/criteria_differential.py \
            --out-dir "$AMD_CI_WORK/out/ab" \
            --python "$AMD_CI_PY" -- --spec diffusion_bench/specs/amd_fa_ab.json --budget-min 200.0 --cell-timeout 3600.0 --only 'klein_*' --only 'zimg_*' --defect slow:zimg_auto:zimg_nat:0.95
          cat "$AMD_CI_WORK/out/ab/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/ab"

      - name: Stop anything this job started
        if: always()
        run: |
          set +e
          for d in /proc/[0-9]*; do
            pid=${d#/proc/}
            [ "$pid" = "$$" ] && continue
            cwd=$(readlink "$d/cwd" 2>/dev/null)
            case "$cwd" in
              "$AMD_CI_WORK"*) echo "stopping pid $pid (cwd $cwd)"; kill "$pid" 2>/dev/null ;;
            esac
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opt3-amdfa
          path: |
            ${{ env.AMD_CI_WORK }}/out
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/cell.log
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/record.json
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/dbench/states/*/logs
          retention-days: 14
          if-no-files-found: warn
