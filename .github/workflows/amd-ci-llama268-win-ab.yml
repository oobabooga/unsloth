name: "AMD CI (Windows): llama.cpp PR 268 MoE lookup mmap A/B"

# Generated from amd_ci/templates/workflow_windows.yml by scaffold.py --windows.
#
# The Windows half of the devlab-dispatch pool: four GMKtec NucBox EVO-X2 Strix
# Halo boxes running Windows 11 Pro, with an AMD Radeon 8060S visible to Windows.
# They match in seconds and never queue. Everything below is measured on them:
#
#   shell: powershell     the ONLY correct value. `pwsh` is not installed (there
#                         is no PowerShell 7, only 5.1 Desktop) and neither is
#                         `bash`. Either one fails before the step's first line.
#                         Set as a job default so no step can drift off it.
#   no docker             not installed on any of the four. Containerised work
#                         stays on the Linux runners; there is no Windows target
#                         for it on this pool.
#   RUNNER_OS             has been observed EMPTY on these jobs, and correct on
#                         others. Echo it before branching on it; a bash-style
#                         ${RUNNER_OS:-?} in a PowerShell block is always "".
#   machine names         the X2-LA01-* prefix is SHARED with the Linux pool, so
#                         the name does not tell you which OS answered.
#   no shared state       jobs land on DIFFERENT machines and share no image
#                         cache and no disk. Anything fetched in one job must be
#                         fetched again in the next.
#
# The linux-control job exists to be diagnostic, not useful. A label that matches
# no runner does not fail a job, it queues it forever, and that looks exactly like
# a busy pool from the run list. This job differs from the Windows one ONLY in the
# OS label, so if it starts and the Windows job does not, the selector is wrong.
# Keep it, or reproduce it by pushing the same workflow twice.

on:
  push:
    branches: [amd-ci-llama268-win-ab]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "268"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  linux-control:
    name: "PR 268 linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"
          echo "If this job runs and the windows job stays queued, the Windows"
          echo "selector matched no runner. If BOTH stay queued, the pool is busy."

  windows:
    name: "PR 268 on Windows (non-Docker)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 200
    # Uncomment when the job actually measures the GPU. It is off by default
    # because the four Windows boxes are four separate machines with four separate
    # GPUs, so serialising all of them costs throughput for nothing; the labels
    # cannot pin one machine, so there is no finer group to ask for. `lint_workflow.py`
    # raises W101 if a step here touches GPU memory without a group.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "pr268-windows"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            Write-Host "Not skipping: a run that cannot start is a failure, not nothing to see."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: TheRock toolchain, model download, build base and fix
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = "Continue"
          $W = $env:AMD_CI_WORK; $OUT = "$W\out"
          $WANT = "87fa81fbc53431ef0cae125e9fa36a947cc101f9"
          New-Item -ItemType Directory -Force -Path "$W\model" | Out-Null
          $MODEL = "$W\model\Qwen3-30B-A3B-UD-IQ1_S.gguf"
          $URL = "https://huggingface.co/unsloth/Qwen3-30B-A3B-GGUF/resolve/main/Qwen3-30B-A3B-UD-IQ1_S.gguf"
          # Model download in the background (python, no progress bar), waited on below.
          $dlpy = "$W\dl.py"
          [IO.File]::WriteAllText($dlpy, "import urllib.request, shutil, sys`nr = urllib.request.urlopen(sys.argv[1])`nwith open(sys.argv[2], 'wb') as f:`n    shutil.copyfileobj(r, f, 16 << 20)`nprint('download ok')`n", (New-Object System.Text.UTF8Encoding $false))
          $dl = Start-Process -FilePath $env:AMD_CI_PY -PassThru -NoNewWindow -RedirectStandardOutput "$OUT\dl.log" -RedirectStandardError "$OUT\dl.err" -ArgumentList @("`"$dlpy`"", $URL, "`"$MODEL`"")
          function Log($s) { Write-Host $s; Add-Content -Encoding utf8 -Path "$OUT\toolchain.txt" -Value $s }

          & $env:AMD_CI_PY -m venv "$W\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $VP = "$W\venv\Scripts\python.exe"
          $t0 = Get-Date
          & $VP -m pip install -q --index-url https://rocm.nightlies.amd.com/v2/gfx1151/ "rocm[libraries,devel]" *> "$OUT\therock_pip.log"
          $prc = $LASTEXITCODE
          Get-Content "$OUT\therock_pip.log" -Tail 20
          if ($prc -ne 0) { Write-Host "FATAL: TheRock pip rc=$prc"; exit 1 }
          & "$W\venv\Scripts\rocm-sdk.exe" init *> "$OUT\therock_init.log"
          Get-Content "$OUT\therock_init.log" -Tail 5
          $ROCM = (& "$W\venv\Scripts\rocm-sdk.exe" path --root).Trim()
          Write-Host "TheRock install took $([int]((Get-Date) - $t0).TotalSeconds) s, root $ROCM"
          & $VP -m pip list 2>$null | Select-String -Pattern "rocm" | ForEach-Object { Log "$_" }
          $CLANG = "$ROCM\lib\llvm\bin\clang.exe"; $CLANGXX = "$ROCM\lib\llvm\bin\clang++.exe"
          if (-not (Test-Path $CLANG)) { Write-Host "FATAL: no clang at $CLANG"; Get-ChildItem $ROCM, "$ROCM\lib" | Select-Object -First 60 | ForEach-Object { $_.FullName }; exit 1 }

          # MSVC environment (headers, CRT, link) for clang
          $vc = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vc`" >nul 2>&1 && set" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2]) } }
          $env:HIP_PATH = $ROCM; $env:ROCM_PATH = $ROCM; $env:HIP_PLATFORM = "amd"
          $env:PATH = "$ROCM\bin;$ROCM\lib\llvm\bin;$env:PATH"
          Add-Content -Path $env:GITHUB_ENV -Value "HIP_PATH=$ROCM"
          Add-Content -Path $env:GITHUB_ENV -Value "ROCM_PATH=$ROCM"
          Add-Content -Path $env:GITHUB_PATH -Value "$ROCM\bin"
          Log ((& $CLANG --version) -join " | ")
          Log "ROCM=$ROCM"

          $SRC = "$W\llama"
          New-Item -ItemType Directory -Force -Path $SRC | Out-Null
          git -C $SRC init -q
          git -C $SRC config core.autocrlf false
          git -C $SRC remote add origin https://github.com/unslothai/llama.cpp
          git -C $SRC fetch -q --depth 1 origin refs/pull/268/head
          $NOW = (git -C $SRC rev-parse FETCH_HEAD).Trim()
          Log "pull/268/head now = $NOW (pinned base = $WANT)"
          git -C $SRC fetch -q --depth 1 origin $WANT
          if ($LASTEXITCODE -ne 0) { Write-Host "FATAL: fetch $WANT"; exit 1 }
          git -C $SRC checkout -q --detach $WANT
          $GOT = (git -C $SRC rev-parse HEAD).Trim()
          Log "checked out = $GOT"
          if ($GOT -ne $WANT) { Write-Host "FATAL: checkout $GOT"; exit 1 }

          $SRCF = $SRC.Replace('\', '/')
          $t0 = Get-Date
          cmake -S $SRC -B "$SRC\build" -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$CLANG" "-DCMAKE_CXX_COMPILER=$CLANGXX" "-DCMAKE_HIP_COMPILER=$CLANGXX" `
            "-DCMAKE_PREFIX_PATH=$ROCM" "-DROCM_DIR=$ROCM" `
            -DGGML_HIP=ON -DAMDGPU_TARGETS=gfx1151 -DGPU_TARGETS=gfx1151 -DGGML_HIP_ROCWMMA_FATTN=OFF `
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF *> "$OUT\cmake_configure.log"
          $crc = $LASTEXITCODE
          Get-Content "$OUT\cmake_configure.log" -Tail 25
          if ($crc -ne 0) { exit 1 }
          cmake --build "$SRC\build" --target llama-completion llama-server llama-cli -j 32 *> "$OUT\build_base.log"
          $brc = $LASTEXITCODE
          if ($brc -ne 0) { Get-Content "$OUT\build_base.log" | Select-String -Pattern "error|FAILED" | Select-Object -First 40; exit 1 }
          Log "base build took $([int]((Get-Date) - $t0).TotalSeconds) s"
          foreach ($s in "base", "head") { New-Item -ItemType Directory -Force -Path "$W\states\$s\bin" | Out-Null }
          Copy-Item "$SRC\build\bin\*" "$W\states\base\bin\" -Recurse
          git -C $SRC apply --index "$env:GITHUB_WORKSPACE\amd_ci\moe_materialize.patch"
          if ($LASTEXITCODE -ne 0) { Write-Host "FATAL: patch does not apply"; exit 1 }
          git -C $SRC diff --cached --stat
          $t0 = Get-Date
          cmake --build "$SRC\build" --target llama-completion llama-server llama-cli -j 32 *> "$OUT\build_fix.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$OUT\build_fix.log" | Select-String -Pattern "error|FAILED" | Select-Object -First 40; exit 1 }
          Log "fix rebuild took $([int]((Get-Date) - $t0).TotalSeconds) s"
          Copy-Item "$SRC\build\bin\*" "$W\states\head\bin\" -Recurse
          Get-ChildItem "$W\states\*\bin\llama-completion.exe" | ForEach-Object { "$($_.FullName) $((Get-FileHash $_.FullName -Algorithm MD5).Hash) materialize=$((Select-String -Path $_.FullName -Pattern 'materialize_mapped' -SimpleMatch -Quiet))" } | ForEach-Object { Log $_ }

          $states = @{ pr = 268; merged = $false; commits = @{ base = $GOT; head = "$GOT+materialize-533edbff60" }; paths = @{ base = "$W\states\base"; head = "$W\states\head" } }
          [IO.File]::WriteAllText("$OUT\states.json", ($states | ConvertTo-Json -Depth 4), (New-Object System.Text.UTF8Encoding $false))
          Get-Content "$OUT\states.json"

          $dl.WaitForExit()
          Get-Content "$OUT\dl.log", "$OUT\dl.err" -ErrorAction SilentlyContinue
          if (-not (Test-Path $MODEL) -or (Get-Item $MODEL).Length -lt 9000000000) { Write-Host "FATAL: model download"; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_MODEL=$MODEL"
          # smoke: does the base binary start and see the GPU?
          & "$W\states\base\bin\llama-completion.exe" --list-devices *> "$OUT\list_devices.txt"
          Get-Content "$OUT\list_devices.txt"

      - name: Differential
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/llama_moe_lookup_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/llama_moe_lookup.py" `
            --out-dir "$env:AMD_CI_WORK\out\windows" `
            --python "$env:AMD_CI_PY" -- --model "$env:AMD_CI_MODEL" --cache-mib 2580 --reps 3 --arms mmap:mmap none:none mmap_mat0:mmap:LLAMA_MOE_CACHE_MATERIALIZE=0 auto:auto:1
          Get-Content "$env:AMD_CI_WORK\out\windows\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          # This is the last command, so its exit status is the step's.
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\windows"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr268-windows
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
