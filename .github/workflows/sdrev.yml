name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  ab:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "pr18-vulkan2"
            backend: "vulkan"
            base: "ff941a8"
            head: "d2f58e3"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: "alloff:SD_H3_GRAPH_FAST=0 SD_H3_VAE_GRAPH_OPT=0 SD_H3_VAE_KEEP_RESIDENT=0"
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling"
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: ""
            h3_ab_reps: ""
            zimg_cap: ""
          - name: "pr19-vulkan"
            backend: "vulkan"
            base: "d2f58e3"
            head: "3c26b6a"
            tbo: "ROPE_PE_PERMUTE,CONV_2D_DW,RMS_NORM"
            tbo_env: ""
            h3: "1"
            h3_envs: "alloff:SD_H3_FAST_SAGE_QKV=0 SD_TILE_ASYNC_MERGE=0 SD_H3_VAE_ASYNC_ASSEMBLY=0 SD_H3_VAE_REUSE_MEMQUERY=0 SD_H3_VAE_FUSED_QKV=0 SD_H3_VAE_FUSED_QK_NORM=0 SD_H3_AUDIO_DIRECT_DW=0;dw0:SD_H3_AUDIO_DIRECT_DW=0"
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling"
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: ""
            h3_ab_reps: ""
            zimg_cap: ""
          - name: "pr21-hip"
            backend: "hip"
            base: "6321a69"
            head: "ee5829c"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: ""
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling 496x496:--vae-tiling 496x496 1008x1008:--offload-to-cpu"
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: ""
            h3_ab_reps: "1"
            zimg_cap: "5:1008x1008:--offload-to-cpu"
          - name: "pr21-vulkan"
            backend: "vulkan"
            base: "6321a69"
            head: "ee5829c"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: ""
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling 496x496:--vae-tiling 496x496 1008x1008:--offload-to-cpu"
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: ""
            h3_ab_reps: "1"
            zimg_cap: ""
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        run: git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" && echo "H=$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" >> "$GITHUB_ENV"
      - name: Run
        env:
          BACKEND: ${{ matrix.backend }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          TBO_ENV_VARIANTS: ${{ matrix.tbo_env }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
          SRC_REPO: ${{ matrix.src_repo }}
          VARIANTS: ${{ matrix.variants }}
          STEPS: ${{ matrix.steps }}
          REPS: ${{ matrix.reps }}
          H3_STEPS: ${{ matrix.h3_steps }}
          H3_AB_REPS: ${{ matrix.h3_ab_reps }}
          ZIMG_CAP: ${{ matrix.zimg_cap }}
        run: bash "$H/ci/${{ matrix.script }}"
      - name: Upload
        if: always() && env.ART != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
