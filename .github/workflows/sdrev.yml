name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  ab:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ref1-hip-s42"
            backend: "hip"
            base: "6321a69"
            head: "ae9429f"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: ""
            zimg: ""
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: "1"
            h3_ab_reps: "1"
            zimg_cap: ""
            h3_warmup: ""
            h3_w: "640"
            h3_h: "384"
            h3_f: "56"
            h3_prompt: "A street band plays upbeat brass funk on a sunny city corner, trumpet and saxophone solos over a driving drum groove and bass line, people dancing."
            h3_refcpu: "1"
            h3_seed: "42"
          - name: "ref1-hip-s7"
            backend: "hip"
            base: "6321a69"
            head: "ae9429f"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: ""
            zimg: ""
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: "1"
            h3_ab_reps: "1"
            zimg_cap: ""
            h3_warmup: ""
            h3_w: "640"
            h3_h: "384"
            h3_f: "56"
            h3_prompt: "A street band plays upbeat brass funk on a sunny city corner, trumpet and saxophone solos over a driving drum groove and bass line, people dancing."
            h3_refcpu: "1"
            h3_seed: "7"
          - name: "ref1-hip-s1234"
            backend: "hip"
            base: "6321a69"
            head: "ae9429f"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: ""
            zimg: ""
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: "1"
            h3_ab_reps: "1"
            zimg_cap: ""
            h3_warmup: ""
            h3_w: "640"
            h3_h: "384"
            h3_f: "56"
            h3_prompt: "A street band plays upbeat brass funk on a sunny city corner, trumpet and saxophone solos over a driving drum groove and bass line, people dancing."
            h3_refcpu: "1"
            h3_seed: "1234"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        run: git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" && echo "H=$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" >> "$GITHUB_ENV"
      - name: Run
        env:
          BACKEND: ${{ matrix.backend }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          TBO_ENV_VARIANTS: ${{ matrix.tbo_env }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
          SRC_REPO: ${{ matrix.src_repo }}
          VARIANTS: ${{ matrix.variants }}
          STEPS: ${{ matrix.steps }}
          REPS: ${{ matrix.reps }}
          H3_STEPS: ${{ matrix.h3_steps }}
          H3_AB_REPS: ${{ matrix.h3_ab_reps }}
          ZIMG_CAP: ${{ matrix.zimg_cap }}
          H3_W: ${{ matrix.h3_w }}
          H3_H: ${{ matrix.h3_h }}
          H3_F: ${{ matrix.h3_f }}
          H3_PROMPT: ${{ matrix.h3_prompt }}
          H3_REFCPU: ${{ matrix.h3_refcpu }}
          H3_SEED: ${{ matrix.h3_seed }}
        run: bash "$H/ci/${{ matrix.script }}"
      - name: Upload
        if: always() && env.ART != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
