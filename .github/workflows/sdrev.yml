name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  ab:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "pr18-hip"
            backend: "hip"
            base: "ca92d95"
            head: "5f222b8"
            tbo: "FLASH_ATTN_EXT,RMS_NORM,MUL_MAT,ROPE_PE_PERMUTE,MODULATE_ROWS,SWIGLU_SCALED,ADD,MUL,SWIGLU"
            tbo_env: "FLASH_ATTN_EXT:GGML_CUDA_FA_LONGSEQ=0 RMS_NORM:GGML_CUDA_NORM_SMALL_ROWS=0 MUL_MAT:GGML_CUDA_CUBLAS_EPILOGUE_FUSION=0"
            h3: "1"
            h3_envs: "alloff:SD_H3_GRAPH_FAST=0 SD_H3_VAE_GRAPH_OPT=0 SD_H3_VAE_KEEP_RESIDENT=0 GGML_CUDA_FA_LONGSEQ=0 GGML_CUDA_CUBLAS_EPILOGUE_FUSION=0 GGML_CUDA_NORM_SMALL_ROWS=0"
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling"
            head_cmake: ""
          - name: "pr18-vulkan"
            backend: "vulkan"
            base: "ca92d95"
            head: "5f222b8"
            tbo: "FLASH_ATTN_EXT,RMS_NORM,ROPE_PE_PERMUTE,MODULATE_ROWS,SWIGLU_SCALED"
            tbo_env: ""
            h3: "1"
            h3_envs: "alloff:SD_H3_GRAPH_FAST=0 SD_H3_VAE_GRAPH_OPT=0 SD_H3_VAE_KEEP_RESIDENT=0"
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling"
            head_cmake: ""
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        run: git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" && echo "H=$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" >> "$GITHUB_ENV"
      - name: Run
        env:
          BACKEND: ${{ matrix.backend }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          TBO_ENV_VARIANTS: ${{ matrix.tbo_env }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
        run: bash "$H/ci/run.sh"
      - name: Upload
        if: always() && env.ART != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
