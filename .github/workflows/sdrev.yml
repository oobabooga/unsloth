name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  ab:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pr17-hip
            backend: hip
            base: 6321a69
            head: ca92d95
            tbo: CPY,MUL_MAT
            tbo_env: "CPY:GGML_CUDA_CPY_ROWS=0 MUL_MAT:GGML_CUDA_QUANT_CUBLAS_MIN_BATCH=1"
            h3: "1"
            h3_envs: "vaefa0:SD_H3_VAE_FLASH_ATTN=0"
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling"
          - name: pr17-vulkan
            backend: vulkan
            base: 6321a69
            head: ca92d95
            tbo: CPY
            tbo_env: ""
            h3: "1"
            h3_envs: "vaefa0:SD_H3_VAE_FLASH_ATTN=0"
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        run: git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h"
      - name: Run
        env:
          BACKEND: ${{ matrix.backend }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          TBO_ENV_VARIANTS: ${{ matrix.tbo_env }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
        run: bash "$RUNNER_TEMP/h/ci/run.sh"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
