name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  win:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "stack-windows-speed"
            backend: ""
            base: "6321a69"
            head: "1957123"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: ""
            zimg: ""
            head_cmake: ""
            src_repo: ""
            script: "run.sh"
            variants: ""
            steps: ""
            reps: ""
            h3_steps: ""
            h3_ab_reps: "3"
            zimg_cap: ""
            h3_warmup: "1"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP ("h-" + $env:GITHUB_RUN_ID + "-" + $PID)
          git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth $h
          Add-Content $env:GITHUB_ENV "H=$h"
      - name: Run
        shell: powershell
        env:
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
          H3_WARMUP: ${{ matrix.h3_warmup }}
          H3_AB_REPS: ${{ matrix.h3_ab_reps }}
        run: '& "$env:H\\ci\\run.ps1"'
      - name: Upload
        if: always() && env.ART != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
