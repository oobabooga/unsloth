name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth h
          echo "matrix=$(jq -c . h/ci/jobs.json)" >> "$GITHUB_OUTPUT"
  ab:
    needs: plan
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        run: git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" && echo "H=$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" >> "$GITHUB_ENV"
      - name: Run
        env:
          BACKEND: ${{ matrix.backend }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          TBO_ENV_VARIANTS: ${{ matrix.tbo_env }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
        run: bash "$H/ci/run.sh"
      - name: Upload
        if: always() && env.ART != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
