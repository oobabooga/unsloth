name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  ab:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "pr17fix-vulkan"
            backend: "vulkan"
            base: "6321a69"
            head: "ff941a8"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: "vaefa1:SD_H3_VAE_FLASH_ATTN=1"
            zimg: ""
            head_cmake: ""
            src_repo: "oobabooga"
          - name: "pr17fix-hip"
            backend: "hip"
            base: "6321a69"
            head: "ff941a8"
            tbo: ""
            tbo_env: ""
            h3: "1"
            h3_envs: "vaefa0:SD_H3_VAE_FLASH_ATTN=0"
            zimg: ""
            head_cmake: ""
            src_repo: "oobabooga"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        run: git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" && echo "H=$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" >> "$GITHUB_ENV"
      - name: Run
        env:
          BACKEND: ${{ matrix.backend }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          TBO_ENV_VARIANTS: ${{ matrix.tbo_env }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
          SRC_REPO: ${{ matrix.src_repo }}
        run: bash "$H/ci/run.sh"
      - name: Upload
        if: always() && env.ART != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
