name: sd.cpp PR A/B on AMD

on:
  push:
    branches: [sdrev-amd]

permissions: {}

jobs:
  ab:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "pr19-hip"
            backend: "hip"
            base: "5f222b8"
            head: "338079e"
            tbo: "ROPE_PE_PERMUTE,RMS_NORM,CONV_2D_DW,FLASH_ATTN_EXT"
            tbo_env: ""
            h3: "1"
            h3_envs: "alloff:SD_H3_FAST_SAGE_QKV=0 SD_TILE_ASYNC_MERGE=0 SD_H3_VAE_ASYNC_ASSEMBLY=0 SD_H3_VAE_REUSE_MEMQUERY=0 SD_H3_VAE_FUSED_QKV=0 SD_H3_VAE_FUSED_QK_NORM=0 SD_H3_AUDIO_DIRECT_DW=0;dw0:SD_H3_AUDIO_DIRECT_DW=0"
            zimg: "1024x1024:--vae-tiling 1008x1008:--vae-tiling"
            head_cmake: ""
            src_repo: ""
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    steps:
      - name: Fetch harness
        run: git clone -q --depth 1 --branch sdrev-amd https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" && echo "H=$RUNNER_TEMP/h-$GITHUB_RUN_ID-$$" >> "$GITHUB_ENV"
      - name: Run
        env:
          BACKEND: ${{ matrix.backend }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          TBO_OPS: ${{ matrix.tbo }}
          TBO_ENV_VARIANTS: ${{ matrix.tbo_env }}
          H3: ${{ matrix.h3 }}
          H3_HEAD_ENVS: ${{ matrix.h3_envs }}
          ZIMG: ${{ matrix.zimg }}
          HEAD_CMAKE: ${{ matrix.head_cmake }}
          SRC_REPO: ${{ matrix.src_repo }}
        run: bash "$H/ci/run.sh"
      - name: Upload
        if: always() && env.ART != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ART }}
          if-no-files-found: ignore
