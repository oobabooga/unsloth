name: "AMD CI run 2: k9 vs k8 vs release b11734-mix, Qwen3.6 MTP 8 GB on gfx1151 Linux + Windows, bundles with the release kpack step"

# k9 = upstream ggml-org b11721 (ff5a2337) + k6p/k9.patch.gz (moe-combined-k9 ccaa52783b), k8 = b11721 + k6p/k8.patch.gz (927aeaa8c5).
# ROCm builds use the release recipe and the TheRock weekly pin of b11734-mix-c208e5f (10.2.0a20261017). Matrix: k6p/k6p_plan.py.

on:
  push:
    branches: [amd-ci-llama-k9p2]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  hosted-linux-build:
    name: "Linux HIP gfx1151 build + CPU ctest ${{ matrix.n }} (hosted ubuntu-22.04, release recipe)"
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        n: [k9, k8]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - name: Build
        run: |
          bash k6p/hosted_linux_build.sh ${{ matrix.n }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bin_${{ matrix.n }}
          path: ${{ runner.temp }}/art
          retention-days: 3
          if-no-files-found: error

  gpu-linux:
    name: "k9 vs k8 vs release, Linux ROCm gfx1151 (exclusive)"
    needs: [hosted-linux-build, gpu-windows]
    if: ${{ always() && needs.hosted-linux-build.result == 'success' }}
    env:
      K9P_CELLS: q3m,q3mu
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 330
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "k9-linux-gpu"
      - name: Hardware gate
        run: |
          set +e
          python3 amd_ci/lib/gate.py --no-torch --out "$AMD_CI_WORK/out/host.json" > /dev/null
          ls -la /dev/kfd /dev/dri 2>&1 | head -5
          R=$(command -v rocminfo || echo /opt/rocm/bin/rocminfo)
          "$R" 2>&1 | grep -m3 -E "Marketing Name|gfx1151" | tee "$AMD_CI_WORK/out/rocminfo.txt"
          if [ ! -e /dev/kfd ] || ! grep -q gfx1151 "$AMD_CI_WORK/out/rocminfo.txt"; then echo "GATE FAILED: no gfx1151 via KFD"; exit 1; fi
          echo "gate ok"
      - uses: actions/download-artifact@v4
        with:
          name: bin_k9
          path: ${{ env.AMD_CI_WORK }}/art/bin_k9
      - uses: actions/download-artifact@v4
        with:
          name: bin_k8
          path: ${{ env.AMD_CI_WORK }}/art/bin_k8
      - name: Cells
        timeout-minutes: 310
        run: |
          set +e
          bash k6p/linux_gpu.sh
          rc=$?
          echo "job rc=$rc"
          test -s "$AMD_CI_WORK/out/rows_linux.jsonl"
      - name: Stop leftover servers
        if: always()
        run: |
          set +e
          for p in $(pgrep -u "$(id -u)" -x llama-server; pgrep -u "$(id -u)" -x llama-perplexit; pgrep -u "$(id -u)" -x test-backend-op); do kill -9 "$p"; done
          echo "cleanup done"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k9-linux-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  gpu-windows:
    name: "k9 vs k8 vs release, Windows 11 ROCm gfx1151 (build + ctest + measure, exclusive)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    env:
      K9P_CELLS: q3m,q3mu
    timeout-minutes: 330
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "k9-windows"
      - name: Build k8 / k9 with the release's TheRock, ctest, cells
        timeout-minutes: 320
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "RUNNER_OS='$env:RUNNER_OS' RUNNER_NAME='$env:RUNNER_NAME'"
          & "$env:GITHUB_WORKSPACE\k6p\win_gpu.ps1"
          if (-not (Test-Path "$env:AMD_CI_WORK\out\rows_win.jsonl")) { exit 1 }
      - name: Stop leftover servers
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          Get-Process -Name llama-server, llama-perplexity, test-backend-ops -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "cleanup done"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k9-windows-gpu
          path: ${{ env.AMD_CI_WORK }}\out
          retention-days: 7
          if-no-files-found: warn

