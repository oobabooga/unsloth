name: AMD DevLab probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Strix Halo probe and CI smoke
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 20
    steps:
      - name: Runner and operating system
        run: |
          echo "runner=${{ runner.name }}"
          echo "host=$(hostname)"
          echo "user=$(whoami)"
          echo "arch=$(uname -m)"
          uname -a
          cat /etc/os-release

      - name: CPU and memory
        run: |
          lscpu
          free -h

      - name: AMD devices
        run: |
          lspci -nn | grep -iE 'vga|display|processing accelerator|signal processing' || true
          for card in /sys/class/drm/card[0-9]*; do
            [ -e "$card/device/vendor" ] || continue
            echo "card=$card"
            echo "vendor=$(cat "$card/device/vendor")"
            echo "device=$(cat "$card/device/device")"
            echo "vram=$(cat "$card/device/mem_info_vram_total" 2>/dev/null || echo unavailable)"
            echo "gtt=$(cat "$card/device/mem_info_gtt_total" 2>/dev/null || echo unavailable)"
          done

      - name: ROCm and NPU
        run: |
          rocminfo 2>/dev/null | grep -E 'Name:|Marketing Name:|gfx' | head -40 || true
          rocm-smi 2>/dev/null || true
          ls -l /dev/accel* 2>/dev/null || true
          xrt-smi examine 2>/dev/null || true

      - name: Disk and toolchain
        run: |
          df -hT . /tmp
          for tool in gcc g++ clang cmake ninja make git python3 pip3 docker podman uv; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%-8s %s\n' "$tool" "$($tool --version 2>&1 | head -1)"
            else
              printf '%-8s NOT INSTALLED\n' "$tool"
            fi
          done

      - name: Network egress
        run: |
          for url in https://github.com https://huggingface.co https://pypi.org; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 15 -I "$url")
            printf '%-28s %s\n' "$url" "$code"
          done

      - name: Unsloth CI smoke
        run: |
          git clone --depth 1 --branch main https://github.com/oobabooga/unsloth.git source
          python3 -m compileall -q source/unsloth
