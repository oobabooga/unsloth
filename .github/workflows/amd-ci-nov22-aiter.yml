name: "AMD CI: diffusion_bench amd_nov22_aiter on gfx1151 (Linux)"

# Generated by diffusion_bench/amd/gen_workflow.py. Measurement only: no secret is referenced, every model is a
# public download. Base = unsloth da4430f3209e; baseline UI v0.46.2.

on:
  push:
    branches: [amd-ci-nov22-aiter]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: "https://github.com/unslothai/unsloth"
  BASE_SHA: "da4430f3209ef5b2b1f1e47ce9b8c8ef5a1691b1"
  AITER_REPO: "https://github.com/ROCm/aiter"
  AITER_SHA: "c16d44b93a528b2a4bfd6d8d3409116d465872a9"

jobs:

  m1_cells:
    name: "amd:gfx1151-linux 17 cells (gfx1151, exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 600
    # The shared GPU group: one GPU measurement at a time across all branches.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "dbench-m1_cells"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Disk, memory, cores
        run: |
          set +e
          df -h "$RUNNER_TEMP"; free -g; nproc
          exit 0

      - name: Resolve states (base, and base + dbench_marker.patch)
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "$UPSTREAM" "$AMD_CI_WORK/repo"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/base" "$BASE_SHA"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/head" "$BASE_SHA"
          git -C "$AMD_CI_WORK/states/head" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/dbench_marker.patch"
          git -C "$AMD_CI_WORK/states/head" diff --cached --stat
          python3 "$GITHUB_WORKSPACE/diffusion_bench/amd/write_states.py" --work "$AMD_CI_WORK" \
            --base-sha "$BASE_SHA" --patch dbench_marker.patch --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/states/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"
          "$V/bin/python" -c "import torch, diffusers, transformers; print('studio torch', torch.__version__, 'hip', torch.version.hip, 'diffusers', diffusers.__version__, 'transformers', transformers.__version__)"

      - name: AITER (ROCm/aiter, JIT mode, GPU_ARCHS=gfx1151) into the Studio venv, then a kernel smoke
        timeout-minutes: 90
        run: |
          set +e
          O="$AMD_CI_WORK/out"
          echo "AITER_OK=0" >> "$GITHUB_ENV"
          "$AMD_CI_PY" -m pip --version > /dev/null 2>&1 || "$AMD_CI_PY" -m ensurepip -q
          "$AMD_CI_PY" -m pip list 2>/dev/null | grep -i -E "^(torch|triton|rocm|pytorch|diffusers)" | tee "$O/pkgs_before.txt"
          # pin what Studio installed so no AITER dependency can swap the torch / ROCm stack
          "$AMD_CI_PY" -m pip list --format=freeze 2>/dev/null | grep -i -E "^(torch|torchvision|torchaudio|triton|pytorch-triton-rocm|rocm|rocm-sdk-core|rocm-sdk-libraries[^=]*)==" > "$O/pins.txt"
          cat "$O/pins.txt"
          RV=$("$AMD_CI_PY" -c "import importlib.metadata as m; print(m.version('rocm'))")
          for IDX in https://repo.amd.com/rocm/whl/gfx1151/ https://rocm.nightlies.amd.com/v2/gfx1151/; do
            "$AMD_CI_PY" -m pip install "rocm[devel]==$RV" -c "$O/pins.txt" --extra-index-url "$IDX" >> "$O/rocm_devel.log" 2>&1 && { echo "rocm[devel]==$RV from $IDX"; break; }
          done
          tail -3 "$O/rocm_devel.log"
          VBIN=$(dirname "$AMD_CI_PY")
          ROOT=$("$VBIN/rocm-sdk" path --root 2>>"$O/rocm_devel.log")
          [ -n "$ROOT" ] || ROOT=$("$AMD_CI_PY" -m rocm_sdk path --root 2>>"$O/rocm_devel.log")
          echo "ROCm SDK root: '$ROOT'"
          export ROCM_HOME="$ROOT" ROCM_PATH="$ROOT" HIP_PATH="$ROOT" PATH="$ROOT/bin:$ROOT/lib/llvm/bin:$PATH"
          echo "hipcc: $(command -v hipcc)"; hipcc --version 2>&1 | head -3
          "$AMD_CI_PY" -m pip install -q -c "$O/pins.txt" setuptools wheel packaging psutil ninja einops pandas pyyaml \
            "pybind11>=3.0.1" setuptools_scm vcs_versioning "flydsl==0.3.1" > "$O/aiter_deps.log" 2>&1
          echo "aiter deps rc=$?"
          git clone -q "$AITER_REPO" "$AMD_CI_WORK/src/aiter"
          cd "$AMD_CI_WORK/src/aiter"
          git checkout -q "$AITER_SHA"
          git submodule update --init --recursive > "$O/aiter_submodules.log" 2>&1
          echo "submodules rc=$?"; git log -1 --format='aiter %H %cd'
          export AITER_JIT_DIR="$AMD_CI_WORK/aiter_jit" GPU_ARCHS=gfx1151 MAX_JOBS=$(nproc)
          mkdir -p "$AITER_JIT_DIR"
          T0=$(date +%s)
          "$AMD_CI_PY" -m pip install -v --no-build-isolation --no-deps -c "$O/pins.txt" \
            --config-settings editable_mode=compat -e . > "$O/aiter_build.log" 2>&1
          rc=$?
          T1=$(date +%s)
          echo "aiter install rc=$rc in $((T1-T0)) s"; grep -m5 -E "error:|FAILED|Error" "$O/aiter_build.log" | cut -c1-300; tail -3 "$O/aiter_build.log"
          cd "$AMD_CI_WORK"
          "$AMD_CI_PY" -m pip list 2>/dev/null | grep -i -E "^(torch|triton|rocm|pytorch|diffusers|amd-aiter|aiter|flydsl)" | tee "$O/pkgs_after.txt"
          # the cells inherit the SDK toolchain + JIT dir (AITER JIT-builds on first call)
          { echo "ROCM_HOME=$ROOT"; echo "ROCM_PATH=$ROOT"; echo "HIP_PATH=$ROOT"; echo "AITER_JIT_DIR=$AITER_JIT_DIR"; echo "GPU_ARCHS=gfx1151"; echo "PATH=$ROOT/bin:$ROOT/lib/llvm/bin:$PATH"; } >> "$GITHUB_ENV"
          export TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
          T0=$(date +%s)
          timeout 3000 "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/aiter_smoke.py" --out "$O/aiter_smoke_ck.json" > "$O/aiter_smoke_ck.log" 2>&1
          echo "smoke CK rc=$? in $(( $(date +%s) - T0 )) s"; head -c 3000 "$O/aiter_smoke_ck.json"; echo
          ENABLE_CK=0 timeout 1200 "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/aiter_smoke.py" --out "$O/aiter_smoke_triton.json" > "$O/aiter_smoke_triton.log" 2>&1
          echo "smoke Triton rc=$?"; head -c 3000 "$O/aiter_smoke_triton.json"; echo
          # the measured arms run AITER's default (CK) path; if only the Triton path runs, use it and say so
          MODE=$("$AMD_CI_PY" -c "import json, sys; ok = lambda p: (lambda r: isinstance(r.get('aiter'), dict) and 'median_ms' in r['aiter'] and r['aiter'].get('finite') and r['aiter']['max_abs_vs_fp32'] < 0.05)(json.load(open(p))); ck = ok('$O/aiter_smoke_ck.json') if __import__('os').path.exists('$O/aiter_smoke_ck.json') else False; tr = ok('$O/aiter_smoke_triton.json') if __import__('os').path.exists('$O/aiter_smoke_triton.json') else False; print('ck' if ck else ('triton' if tr else 'none'))" 2>/dev/null)
          echo "AITER mode for the cells: ${MODE:-none}" | tee "$O/aiter_mode.txt"
          [ "$MODE" = ck ] || echo "ENABLE_CK=0" >> "$GITHUB_ENV"
          [ "$MODE" = ck ] || [ "$MODE" = triton ] && echo "AITER_OK=1" >> "$GITHUB_ENV"
          exit 0

      - name: Model files ({repo, file} refs in the spec, public downloads)
        timeout-minutes: 150
        run: |
          set -euo pipefail
          export HF_HOME="$AMD_CI_WORK/hf_home" HF_HUB_DISABLE_TELEMETRY=1
          "$AMD_CI_PY" -m pip install -q huggingface_hub > /dev/null 2>&1 || true
          TOOLARG=()
          "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/targets/fetch_files.py" --spec "$GITHUB_WORKSPACE/diffusion_bench/specs/plan_amd-gfx1151-linux-1.json" \
            --root "$AMD_CI_WORK/cm" --write "$GITHUB_WORKSPACE/diffusion_bench/specs/plan_amd-gfx1151-linux-1.json" "${TOOLARG[@]}"
          df -h "$RUNNER_TEMP"

      - name: Clean GPU pool preflight (fail loudly on a co-tenant)
        timeout-minutes: 35
        run: |
          set -euo pipefail
          "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/preflight_free.py" --min-free-gib 50 \
            --timeout-s 1800 --out "$AMD_CI_WORK/out/preflight.json"

      - name: "Differential (amd:gfx1151-linux 17 cells)"
        timeout-minutes: 525
        run: |
          set +e
          # harness invariants (gen_workflow.py): AOTriton opt-in on, CI unset, both asserted
          unset CI
          export TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
          [ "${TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL:-}" = 1 ] || { echo "FATAL: AOTriton opt-in missing"; exit 3; }
          [ -z "${CI+x}" ] || { echo "FATAL: CI is still set"; exit 3; }
          "$AMD_CI_PY" -c "import os, sys; ok = os.environ.get('TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL') == '1' and 'CI' not in os.environ; print('HARNESS_ENV', 'ok' if ok else 'BAD'); sys.exit(0 if ok else 3)" || exit 3
          export TORCH_HOME="$AMD_CI_WORK/torch_home"
          export HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe diffusion_bench/amd/diffusion_probe.py \
            --criteria diffusion_bench/amd/criteria_no_regression.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --spec diffusion_bench/specs/plan_amd-gfx1151-linux-1.json --budget-min 240 --cell-timeout 3600 --only trial__amd-gfx1151-linux-1 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter16__k1p0 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter4__k1p1 --only flux3-klein_amd-gfx1151-linux__s_bf16_default16__k1p2 --only flux3-klein_amd-gfx1151-linux__s_bf16_default4__k1p3 --only flux3-klein_amd-gfx1151-linux__s_bf16_default4__k1p4 --only flux3-klein_amd-gfx1151-linux__s_bf16_default16__k1p5 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter4__k1p6 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter16__k1p7 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter16__k2p0 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter4__k2p1 --only flux3-klein_amd-gfx1151-linux__s_bf16_default16__k2p2 --only flux3-klein_amd-gfx1151-linux__s_bf16_default4__k2p3 --only flux3-klein_amd-gfx1151-linux__s_bf16_default4__k2p4 --only flux3-klein_amd-gfx1151-linux__s_bf16_default16__k2p5 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter4__k2p6 --only flux3-klein_amd-gfx1151-linux__s_bf16_aiter16__k2p7 --state-only head=flux3-klein_amd-gfx1151-linux__s_bf16_aiter16__k1p0
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - name: Stop anything this job started (arms that never exited)
        if: always()
        run: |
          set +e
          # an unset / relative / root work dir would match every process: stop nothing then
          W="${AMD_CI_WORK:-}"
          case "$W" in /?*/?*) ;; *) echo "no usable AMD_CI_WORK root ('$W'): nothing to stop"; exit 0 ;; esac
          [ -d "$W" ] || { echo "AMD_CI_WORK $W is not a directory: nothing to stop"; exit 0; }
          W="${W%/}"
          for sig in TERM KILL; do
            for d in /proc/[0-9]*; do
              pid=${d#/proc/}
              [ "$pid" = "$$" ] && continue
              cwd=$(readlink "$d/cwd" 2>/dev/null)
              case "$cwd" in
                "$W"|"$W"/*) echo "$sig pid $pid (cwd $cwd)"; kill -$sig "$pid" 2>/dev/null ;;
              esac
            done
            sleep 5
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbench-m1_cells
          path: |
            ${{ env.AMD_CI_WORK }}/out
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/record.json
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.mp4
            ${{ env.AMD_CI_WORK }}/dbench/states/*/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/dbench/states/*/logs
          retention-days: 14
          if-no-files-found: warn
