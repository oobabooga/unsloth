name: FastFlow live A-B AP
'on':
  push:
    branches:
    - fastflow-ab-ci-db509544
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
    - name: Prepare exact AP source and probes
      run: 'set -e

        python3 -c "import base64; exec(base64.b64decode(''''))"

        git clone --filter=blob:none --no-checkout https://github.com/unslothai/unsloth.git source

        git -C source checkout 5f38afbc2db9e6771785b3cf02b0029fb2cb1229

        '
    - name: Build Studio and browser
      timeout-minutes: 35
      run: '"$RUNNER_TEMP/ab-venv/bin/python" -u "$RUNNER_TEMP/build_ui.py"'
    - name: Live UI and generation A-B matrix
      timeout-minutes: 65
      env:
        AB_LEG: AP
        PYTHONUTF8: '1'
      run: '"$RUNNER_TEMP/ab-venv/bin/python" -u "$RUNNER_TEMP/ui_penalty_ab.py"'
    - name: Save evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AP-linux
        path: '${{ runner.temp }}/fastflow-ab/evidence

          ${{ runner.temp }}/runtime-build-logs'
        retention-days: 14
