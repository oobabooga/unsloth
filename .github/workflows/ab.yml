name: FastFlow live A-B B
'on':
  push:
    branches:
    - fastflow-ab-ci-db509544
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
    - name: Prepare exact B source and probes
      run: 'set -e

        python3 -c "import base64; exec(base64.b64decode(''''))"

        git clone --filter=blob:none --no-checkout https://github.com/unslothai/unsloth.git source

        git -C source checkout 5f38afbc2db9e6771785b3cf02b0029fb2cb1229

        "$RUNNER_TEMP/ab-venv/bin/python" -c "import pathlib,base64; pathlib.Path(''studio.patch'').write_bytes(base64.b64decode(''''))"

        git -C source apply ../studio.patch

        '
    - name: Build patched FastFlowLM
      timeout-minutes: 55
      run: '"$RUNNER_TEMP/ab-venv/bin/python" -u "$RUNNER_TEMP/build_runtime.py"'
    - name: Build Studio and browser
      timeout-minutes: 35
      run: '"$RUNNER_TEMP/ab-venv/bin/python" -u "$RUNNER_TEMP/build_ui.py"'
    - name: Live UI and generation A-B matrix
      timeout-minutes: 65
      env:
        AB_LEG: B
        PYTHONUTF8: '1'
      run: '"$RUNNER_TEMP/ab-venv/bin/python" -u "$RUNNER_TEMP/ui_ab.py"'
    - name: Save evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: B-linux
        path: '${{ runner.temp }}/fastflow-ab/evidence

          ${{ runner.temp }}/runtime-build-logs'
        retention-days: 14
