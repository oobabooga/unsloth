name: FastFlow live A-B BV
'on':
  push:
    branches:
    - fastflow-ab-ci-db509544
permissions: {}
jobs:
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell
    steps:
    - name: Prepare exact BV source and probes
      run: '$ErrorActionPreference = ''Stop''

        @''

        

        ''@ | Set-Content -Encoding ASCII "$env:RUNNER_TEMP/bootstrap.b64"

        python -c "import base64,pathlib,os; exec(base64.b64decode((pathlib.Path(os.environ[''RUNNER_TEMP''])/''bootstrap.b64'').read_text()))"

        git clone --filter=blob:none --no-checkout https://github.com/unslothai/unsloth.git source

        git -C source checkout 5f38afbc2db9e6771785b3cf02b0029fb2cb1229

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        & "$env:RUNNER_TEMP/ab-venv/Scripts/python.exe" -c "import pathlib,base64; pathlib.Path(''studio.patch'').write_bytes(base64.b64decode(''''))"

        git -C source apply ../studio.patch

        '
    - name: Repair image decoder dependency
      timeout-minutes: 40
      run: '& "$env:RUNNER_TEMP/ab-venv/Scripts/python.exe" -u "$env:RUNNER_TEMP/reuse_runtime.py"'
    - name: Build Studio and browser
      timeout-minutes: 35
      run: '& "$env:RUNNER_TEMP/ab-venv/Scripts/python.exe" -u "$env:RUNNER_TEMP/build_ui.py"'
    - name: Live UI and generation A-B matrix
      timeout-minutes: 65
      env:
        AB_LEG: BV
        PYTHONUTF8: '1'
      run: '& "$env:RUNNER_TEMP/ab-venv/Scripts/python.exe" -u "$env:RUNNER_TEMP/ui_vision_ab.py"'
    - name: Save evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: BV-windows
        path: '${{ runner.temp }}/fastflow-ab/evidence

          ${{ runner.temp }}/runtime-build-logs'
        retention-days: 14
