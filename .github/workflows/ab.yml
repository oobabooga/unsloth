name: AB codeql
on:
  push:
    branches: [ab-codeql]
permissions:
  contents: read
jobs:
  analyze:
    name: ${{ matrix.language }} ${{ matrix.variant }} r${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions, rust]
        variant: [main, pr]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.variant == 'pr' && './.github/codeql/codeql-config.yml' || '' }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: ab-${{ matrix.language }}-${{ matrix.variant }}-${{ matrix.rep }}
          upload: never
          output: ${{ runner.temp }}/sarif
      - uses: actions/upload-artifact@v4
        if: matrix.rep == 1
        with:
          name: sarif-${{ matrix.language }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/sarif
