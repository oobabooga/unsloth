name: SAC 4551 installer A/B

on:
  push:
    branches: [sac4551-ab]

permissions: {}

jobs:
  ab:
    name: ${{ matrix.leg }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: [base, fix]
    env:
      UNSLOTH_STUDIO_HOME: 'C:\sac\home'
      UNSLOTH_SKIP_AUTOSTART: '1'
      UNSLOTH_VERBOSE: '1'
    steps:
      - name: Clone
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --branch sac4551-ab-fix https://github.com/oobabooga/unsloth C:\sac\src
          if ('${{ matrix.leg }}' -eq 'base') { git -C C:\sac\src checkout --quiet --detach HEAD~1 }
          git -C C:\sac\src log -1 --format='%H %s'
          New-Item -ItemType Directory -Force -Path C:\sac\logs | Out-Null

      - name: Install with no policy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location C:\sac\src
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\install.ps1 --local --no-torch *>&1 | Tee-Object -FilePath C:\sac\logs\install-1.log | Select-Object -Last 40
          $code = $LASTEXITCODE
          "install 1 exit $code"
          if ($code -ne 0) { exit 1 }
          $exe = 'C:\sac\home\unsloth_studio\Scripts\unsloth.exe'
          if (-not (Test-Path $exe)) { "missing $exe"; exit 1 }
          & $exe --version
          "unsloth.exe --version before policy: exit $LASTEXITCODE"
          exit 0

      - name: Enforce a WDAC hash deny for the generated unsloth.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\sac\home\unsloth_studio\Scripts\unsloth.exe'
          $work = 'C:\sac\policy'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "$env:windir\schemas\CodeIntegrity\ExamplePolicies\AllowAll.xml" "$work\allowall.xml"
          $rules = New-CIPolicyRule -DriverFilePath $target -Level Hash -Deny
          Merge-CIPolicy -PolicyPaths "$work\allowall.xml" -OutputFilePath "$work\policy.xml" -Rules $rules | Out-Null
          Set-RuleOption -FilePath "$work\policy.xml" -Option 3 -Delete
          Set-RuleOption -FilePath "$work\policy.xml" -Option 0
          Set-CIPolicyIdInfo -FilePath "$work\policy.xml" -ResetPolicyID -PolicyName 'sac4551 unsloth.exe deny' | Out-Null
          [xml]$xml = Get-Content "$work\policy.xml"
          $id = $xml.SiPolicy.PolicyID
          ConvertFrom-CIPolicy -XmlFilePath "$work\policy.xml" -BinaryFilePath "$work\$id.cip" | Out-Null
          & CiTool.exe --update-policy "$work\$id.cip" -json
          if ($LASTEXITCODE -ne 0) { throw "CiTool failed: $LASTEXITCODE" }
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content C:\sac\logs\policy-applied-at.txt

      - name: Negative control - the launcher is refused with 4551
        shell: powershell
        run: |
          $code = @'
          import subprocess, sys
          exe = sys.argv[1]
          try:
              subprocess.run([exe, "--version"], capture_output=True, timeout=60)
          except OSError as e:
              print("refused:", repr(e))
              sys.exit(0 if getattr(e, "winerror", None) == 4551 else 2)
          print("ran: policy not enforced")
          sys.exit(1)
          '@
          $code | Set-Content C:\sac\check.py
          foreach ($i in 1..12) {
            python C:\sac\check.py C:\sac\home\unsloth_studio\Scripts\unsloth.exe
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          }
          exit 1

      - name: Re-run the installer under the policy
        id: rerun
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location C:\sac\src
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\install.ps1 --local --no-torch *>&1 | Set-Content -LiteralPath C:\sac\logs\install-2.log -Encoding UTF8
          $code = $LASTEXITCODE
          "install 2 exit $code" | Tee-Object -FilePath C:\sac\logs\install-2-exit.txt
          "---- setup handoff onward ----"
          $lines = Get-Content C:\sac\logs\install-2.log
          $start = ($lines | Select-String -Pattern 'running unsloth studio setup' | Select-Object -First 1).LineNumber
          if ($start) { $lines | Select-Object -Skip ($start - 1) | Select-Object -Last 60 } else { $lines | Select-Object -Last 60 }
          "---- policy lines ----"
          Select-String -Path C:\sac\logs\install-2.log -Pattern '4551|Application Control|update failed|setup failed|unsloth\.cmd|unsloth studio -p' | ForEach-Object { $_.Line.Trim() }
          "exit=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: The launcher was still refused afterwards
        shell: powershell
        run: |
          python C:\sac\check.py C:\sac\home\unsloth_studio\Scripts\unsloth.exe
          if ($LASTEXITCODE -ne 0) { "the launcher is no longer denied; this run proved nothing"; exit 1 }
          python C:\sac\check.py C:\sac\home\bin\unsloth.exe
          "bin\unsloth.exe check exit $LASTEXITCODE"
          $since = [datetime](Get-Content C:\sac\logs\policy-applied-at.txt)
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-CodeIntegrity/Operational'; Id = 3077; StartTime = $since.ToLocalTime() } -ErrorAction SilentlyContinue
          "CodeIntegrity 3077 events since the policy: $(@($events).Count)"
          $events | Select-Object -First 3 | Format-List TimeCreated, Message

      - name: Policy-safe shim runs the CLI
        if: matrix.leg == 'fix'
        shell: cmd
        run: C:\sac\home\bin\unsloth.cmd --version

      - name: Verdict
        shell: powershell
        run: |
          $code = [int]'${{ steps.rerun.outputs.exit }}'
          $log = Get-Content C:\sac\logs\install-2.log -Raw
          "leg=${{ matrix.leg }} installer exit=$code"
          if ('${{ matrix.leg }}' -eq 'base') {
            if ($code -ne 0 -and $log -match 'WinError 4551') { 'EXPECTED: main fails setup on WinError 4551'; exit 0 }
            'UNEXPECTED: main did not fail on 4551'; exit 1
          }
          if ($code -ne 0) { 'UNEXPECTED: the fix still fails'; exit 1 }
          if ($log -match 'WinError 4551') { 'UNEXPECTED: 4551 still surfaced'; exit 1 }
          if ($log -notmatch 'running unsloth studio setup') { 'UNEXPECTED: setup handoff never ran'; exit 1 }
          if ($log -notmatch 'unsloth\.cmd studio -p 8888') { 'UNEXPECTED: launch instructions still name the blocked unsloth.exe'; exit 1 }
          'EXPECTED: the fix installs, and names unsloth.cmd'
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sac4551-${{ matrix.leg }}
          path: C:\sac\logs
