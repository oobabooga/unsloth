name: pre-commit hook split A/B

on:
  push:
    branches: [precommit-split-ab]

permissions: {}

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        cpus: [real]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Host
        run: |
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'; free -h; python3 --version
      - name: Harness
        run: git clone -q --depth 1 -b precommit-split-ab https://github.com/oobabooga/unsloth "$RUNNER_TEMP/h"
      - name: pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" -q install pre-commit
          "$RUNNER_TEMP/v/bin/pre-commit" --version
      - name: A/B
        env:
          AB_PY: ${{ runner.temp }}/v/bin/python
        run: bash "$RUNNER_TEMP/h/ab.sh" "$RUNNER_TEMP/w" d22feecf2233bae41b21829e8fe0314eae1f2c9f 5 ${{ matrix.cpus }} main split2_py_first split2_ruff_first split single_par
      - name: Summary
        if: always()
        run: python3 "$RUNNER_TEMP/h/summarize.py" "$RUNNER_TEMP"/w/results-*.tsv | tee -a "$GITHUB_STEP_SUMMARY"
