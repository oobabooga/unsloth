name: "AMD CI: llama.cpp #406 Inkling 2 banded attention on gfx1151"

# One GPU job on the Linux half of the pool. It builds unslothai/llama.cpp at BASE_SHA
# (#386 head, base) and BASE_SHA + pr406.patch (git am of the 8 #406 commits, head) with
# ggml-hip for gfx1151, on the same host in the same job, then runs the probe for both
# through amd_ci/lib/differential.py:
#   probe     amd_ci/probes/llama_banded_probe.py   observes (test-backend-ops, KLD, llama-bench)
#   criteria  amd_ci/criteria/llama_banded_amd.py   judges (VOID if base does not show the slowdown)
# Windows is not covered.

on:
  push:
    branches: [amd-ci-llama406]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_REPO: "https://github.com/unslothai/llama.cpp"
  BASE_SHA: "6348de261e825d9abcd9cbc33d578c4ff076f1cd"
  MODEL_URL: "https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/resolve/main/Mainline_Support/Inkling-2-Mini-UD-IQ1_S.gguf_file"
  ROCM_GFX: "gfx1151"

jobs:

  gpu:
    name: "banded #386 vs #406 (exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "llama406-gpu"

      - name: Host diagnostics
        run: |
          set +e
          uname -a
          nproc
          free -g
          ls -d /opt/rocm* || echo "no /opt/rocm"
          for b in hipconfig hipcc rocminfo amd-smi cmake ninja python3 git; do
            printf '%-10s %s\n' "$b" "$(command -v $b || echo MISSING)"
          done
          ls -l /dev/kfd /dev/dri || echo "no /dev/kfd or /dev/dri"
          python3 amd_ci/lib/gate.py --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: ROCm toolchain
        timeout-minutes: 45
        run: |
          set -eu
          V="$AMD_CI_WORK/venv"
          python3 -m venv "$V"
          "$V/bin/python" -m pip install -q --upgrade pip
          "$V/bin/python" -m pip install -q "cmake>=3.28" ninja
          ROOT=""
          if command -v hipconfig > /dev/null; then
            ROOT="$(hipconfig -R)"
            echo "using the host ROCm at $ROOT"
          else
            ok=0
            for idx in "https://rocm.nightlies.amd.com/v2/${ROCM_GFX}/" "https://repo.amd.com/rocm/whl/${ROCM_GFX}/"; do
              if "$V/bin/python" -m pip install -q --index-url "$idx" "rocm[libraries,devel]"; then
                ok=1
                echo "ROCm SDK wheels from $idx"
                break
              fi
            done
            if [ "$ok" != 1 ]; then
              echo "FATAL: no ROCm SDK on the host and the wheel install failed"
              exit 1
            fi
            ROOT="$("$V/bin/rocm-sdk" path --root)"
          fi
          if [ ! -x "$ROOT/bin/hipconfig" ] && [ ! -x "$ROOT/bin/hipcc" ]; then
            echo "FATAL: ROCm root $ROOT has no hipconfig/hipcc"
            exit 1
          fi
          CLANG="$ROOT/lib/llvm/bin/clang"
          if [ ! -x "$CLANG" ]; then
            CLANG="$(PATH="$ROOT/bin:$PATH" hipconfig -l)/clang"
          fi
          {
            echo "ROCM_ROOT=$ROOT"
            echo "HIP_PATH=$ROOT"
            echo "ROCM_PATH=$ROOT"
            echo "CMAKE_PREFIX_PATH=$ROOT"
            echo "HIPCXX=$CLANG"
            echo "PATH=$V/bin:$ROOT/bin:$PATH"
            echo "LD_LIBRARY_PATH=$ROOT/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          "$CLANG" --version

      - name: Hardware gate (fails, never skips)
        run: |
          set +e
          rocminfo > "$AMD_CI_WORK/out/rocminfo.txt" 2>&1
          rc=$?
          grep -m3 -E "Name: +gfx" "$AMD_CI_WORK/out/rocminfo.txt"
          if [ "$rc" -ne 0 ]; then
            echo "GATE FAILED: rocminfo exit $rc"
            exit 1
          fi
          if ! grep -q "$ROCM_GFX" "$AMD_CI_WORK/out/rocminfo.txt"; then
            echo "GATE FAILED: no $ROCM_GFX agent"
            exit 1
          fi
          echo "gate ok"

      - name: Resolve states
        run: |
          set -eu
          python3 amd_ci/lib/llama_states.py --repo "$LLAMA_REPO" --base-sha "$BASE_SHA" \
            --patch "$GITHUB_WORKSPACE/pr406.patch" \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Download Inkling-2-Mini UD-IQ1_S (Mainline_Support layout, which the 386 base tree reads)
        timeout-minutes: 60
        run: |
          set +e
          ok=0
          for a in 1 2 3; do
            curl -fL --retry 3 -o "$AMD_CI_WORK/model.gguf" "$MODEL_URL" && ok=1 && break
            sleep 30
          done
          ls -l "$AMD_CI_WORK/model.gguf"
          df -h "$AMD_CI_WORK"
          [ "$ok" = 1 ] || exit 1

      - name: Build base and head (ggml-hip)
        timeout-minutes: 150
        run: |
          set +e
          fail=0
          for s in base head; do
            d="$AMD_CI_WORK/states/$s"
            cmake -S "$d" -B "$d/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DGGML_HIP=ON -DGPU_TARGETS="$ROCM_GFX" -DAMDGPU_TARGETS="$ROCM_GFX" \
              -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF > "$AMD_CI_WORK/out/cmake_$s.log" 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "cmake failed for $s (rc $rc)"
              tail -40 "$AMD_CI_WORK/out/cmake_$s.log"
              fail=1
              continue
            fi
            start=$(date +%s)
            cmake --build "$d/build" -j "$(nproc)" --target test-backend-ops llama-perplexity llama-bench > "$AMD_CI_WORK/out/build_$s.log" 2>&1
            rc=$?
            echo "$s build rc=$rc in $(( $(date +%s) - start )) s"
            if [ "$rc" -ne 0 ]; then
              grep -m20 -E "error" "$AMD_CI_WORK/out/build_$s.log"
              tail -60 "$AMD_CI_WORK/out/build_$s.log"
              fail=1
            fi
            ls -l "$d/build/bin/libggml-hip.so" "$d/build/bin/test-backend-ops" "$d/build/bin/llama-perplexity" "$d/build/bin/llama-bench"
          done
          exit "$fail"

      - name: Differential
        timeout-minutes: 150
        run: |
          set +e
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/llama_banded_probe.py \
            --criteria amd_ci/criteria/llama_banded_amd.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python python3 \
            -- --model "$AMD_CI_WORK/model.gguf" --text "$GITHUB_WORKSPACE/data/wiki.test.head400k.raw" \
               --kld-dir "$AMD_CI_WORK/kld"
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "${AMD_CI_WORK:?}/kld"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - name: Cleanup
        if: always()
        run: |
          rm -f "${AMD_CI_WORK:?}/model.gguf"
          rm -rf "${AMD_CI_WORK:?}/kld"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llama406-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
