name: AMD DevLab parity Windows ROCm load test

on:
  push:
    branches: [amd-devlab-parity-win-r2]

permissions: {}

jobs:
  win:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Load test with the 10.2.0a20260923 runtime DLLs
        run: |
          $W = "$env:RUNNER_TEMP\w"
          New-Item -ItemType Directory -Force -Path $W, "$W\t" | Out-Null
          curl.exe -fsSL --retry 3 -o "$W\r.zip" https://github.com/unslothai/llama.cpp/releases/download/b11139-mix-a6922cc/app-b11139-mix-a6922cc-windows-x64-rocm-gfx1151.zip
          New-Item -ItemType Directory -Force -Path "$W\old" | Out-Null
          tar -xf "$W\r.zip" -C "$W\old"
          curl.exe -fsSL --retry 3 -o "$W\t.tgz" https://nightly.repo.amd.com/rocm/core/tarball/therock-dist-windows-gfx1151-10.2.0a20260923.tar.gz
          tar -xzf "$W\t.tgz" -C "$W\t" "./bin"
          Get-ChildItem "$W\t\bin" -Filter *.dll | Select-Object -First 40 | ForEach-Object Name
          function Probe($dir, $label) {
            $p = Start-Process -FilePath "$dir\llama-bench.exe" -ArgumentList '--list-devices' -WorkingDirectory $dir -RedirectStandardOutput "$W\$label.out" -RedirectStandardError "$W\$label.err" -NoNewWindow -Wait -PassThru
            Write-Host "=== $label exit=$($p.ExitCode) (0x$('{0:X8}' -f $p.ExitCode))"
            Get-Content "$W\$label.out","$W\$label.err" -ErrorAction SilentlyContinue | Select-String -Pattern 'ROCm|Device|gfx|error|Available' | Select-Object -First 6 | ForEach-Object Line
          }
          Probe "$W\old" "shipped-0822"
          Copy-Item -Recurse "$W\old" "$W\new"
          $list = @('amdhip64_*.dll','rocm_kpack.dll','amd_comgr*.dll','libhipblas.dll','rocblas.dll','rocsolver.dll','hipblaslt.dll','libhipblaslt.dll','hipblas.dll','origami.dll')
          foreach ($pat in $list) { Get-ChildItem "$W\t\bin" -Filter $pat -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "$W\new\" -Force; "copied $($_.Name)" } }
          Probe "$W\new" "new-current-list"
          Copy-Item "$W\t\bin\libtensilelite-host.dll" "$W\new\" -Force
          Probe "$W\new" "new-plus-tensilelite"
          exit 0
