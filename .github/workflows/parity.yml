name: AMD DevLab parity Windows CPU backends

# CPU-backend A/B on the Windows Strix Halo box (Zen 5), using the published
# b11139-mix-a6922cc bundles and upstream b11139:
#   WA  fork windows-x64-cpu zip as shipped (clang, debug_nonredist libomp140)
#   WB  WA with libomp140.x86_64.dll replaced by LLVM 20.1.8 libomp.dll (from upstream zip), byte-identical ggml
#   WC  fork windows-x64-cuda13-newer zip (MSVC CPU backends, vcomp), -dev none
#   WD  fork windows-x64-vulkan zip (MSVC, OpenMP off), -dev none
#   WE  WA with ggml-cpu-zen4.dll removed (forces icelake variant)
#   WF  upstream llama-b11139-bin-win-cpu-x64 (clang + LLVM libomp) reference
#   WG  fork windows-x64-rocm-gfx1151 zip, -dev none (CPU backend of the ROCm bundle)

on:
  push:
    branches: [amd-devlab-parity-win]

permissions: {}

jobs:
  win:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
    steps:
      - name: Hardware
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion | Format-List
          Test-Path C:\Windows\System32\vcomp140.dll
          Test-Path C:\Windows\System32\msvcp140.dll
          python --version

      - name: Fetch bundles and models
        run: |
          $ErrorActionPreference = 'Stop'
          $W = "$env:RUNNER_TEMP\w"
          New-Item -ItemType Directory -Force -Path $W, "$W\z", "$W\m", "$W\out" | Out-Null
          $F = 'https://github.com/unslothai/llama.cpp/releases/download/b11139-mix-a6922cc'
          $U = 'https://github.com/ggml-org/llama.cpp/releases/download/b11139'
          $dl = @{
            'fcpu'  = "$F/app-b11139-mix-a6922cc-windows-x64-cpu.zip";
            'fcuda' = "$F/app-b11139-mix-a6922cc-windows-x64-cuda13-newer.zip";
            'fvk'   = "$F/app-b11139-mix-a6922cc-windows-x64-vulkan.zip";
            'frocm' = "$F/app-b11139-mix-a6922cc-windows-x64-rocm-gfx1151.zip";
            'ucpu'  = "$U/llama-b11139-bin-win-cpu-x64.zip"
          }
          foreach ($k in $dl.Keys) {
            curl.exe -fsSL --retry 3 -o "$W\z\$k.zip" $dl[$k]
            if ($LASTEXITCODE -ne 0) { throw "download $k failed" }
            New-Item -ItemType Directory -Force -Path "$W\$k" | Out-Null
            tar -xf "$W\z\$k.zip" -C "$W\$k"
          }
          curl.exe -fsSL --retry 3 -o "$W\m\q8b.gguf" https://huggingface.co/unsloth/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
          curl.exe -fsSL --retry 3 -o "$W\m\q30b.gguf" https://huggingface.co/unsloth/Qwen3-30B-A3B-GGUF/resolve/main/Qwen3-30B-A3B-Q4_K_M.gguf
          # Derived arms
          Copy-Item -Recurse "$W\fcpu" "$W\fcpu_llvmomp"
          Remove-Item "$W\fcpu_llvmomp\libomp140.x86_64.dll"
          Copy-Item "$W\ucpu\libomp.dll" "$W\fcpu_llvmomp\libomp140.x86_64.dll"
          Copy-Item -Recurse "$W\fcpu" "$W\fcpu_nozen4"
          Remove-Item "$W\fcpu_nozen4\ggml-cpu-zen4.dll"
          Get-ChildItem "$W\m" | Format-Table Name,Length
          foreach ($k in 'fcpu','fcpu_llvmomp','fcuda','fvk','frocm','ucpu','fcpu_nozen4') { "$k : " + ((Get-ChildItem "$W\$k" -Filter '*omp*' | ForEach-Object Name) -join ',') + ' | ' + ((Get-ChildItem "$W\$k" -Filter 'ggml-cpu*' | Measure-Object).Count) + ' cpu dlls' }

      - name: Benchmarks (interleaved, two rounds)
        run: |
          $W = "$env:RUNNER_TEMP\w"
          $arms = [ordered]@{ 'WA'='fcpu'; 'WB'='fcpu_llvmomp'; 'WC'='fcuda'; 'WD'='fvk'; 'WE'='fcpu_nozen4'; 'WF'='ucpu'; 'WG'='frocm' }
          $tests = [ordered]@{ '8b' = "-m $W\m\q8b.gguf"; '30b' = "-m $W\m\q30b.gguf" }
          foreach ($round in 1,2) {
            foreach ($a in $arms.Keys) {
              foreach ($t in $tests.Keys) {
                $dir = "$W\" + $arms[$a]
                $bargs = $tests[$t] + ' -dev none -p 512 -n 128 -r 3 -o jsonl'
                $o = "$W\out\$a-$t-r$round.jsonl"; $e = "$W\out\$a-$t-r$round.err"
                Write-Host "round $round $a $t $(Get-Date -Format T)"
                $p = Start-Process -FilePath "$dir\llama-bench.exe" -ArgumentList $bargs -WorkingDirectory $dir -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow -Wait -PassThru
                if ($p.ExitCode -ne 0) { Write-Host "  exit $($p.ExitCode)"; Get-Content $e -Tail 8 }
              }
            }
          }
          exit 0

      - name: Summary
        if: always()
        run: |
          $W = "$env:RUNNER_TEMP\w"
          Get-ChildItem "$W\out\*-8b-r1.err" | ForEach-Object { "== $($_.Name)"; Select-String -Path $_.FullName -Pattern 'load_backend|CPU backend|OpenMP|error' | ForEach-Object Line | Select-Object -First 6 }
          $py = @'
          import json,glob,os,sys,statistics as st
          rows={}
          for f in sorted(glob.glob(sys.argv[1]+'/*.jsonl')):
              arm,test,_=os.path.basename(f)[:-6].split('-')
              for l in open(f, encoding='utf-8', errors='replace'):
                  l=l.strip()
                  if not l.startswith('{'): continue
                  d=json.loads(l)
                  rows.setdefault((test,'pp' if d['n_prompt'] else 'tg',arm),[]).append(d['avg_ts'])
          for k in sorted(rows):
              v=rows[k]; print(f"{k[0]:4} {k[1]:3} {k[2]:3} {st.mean(v):9.2f}  {[round(x,2) for x in v]}")
          '@
          $py | Out-File -Encoding ascii "$W\sum.py"
          python "$W\sum.py" "$W\out"
          Get-ChildItem "$W\out\*.jsonl" | ForEach-Object { "===== $($_.Name)"; Get-Content $_.FullName }
