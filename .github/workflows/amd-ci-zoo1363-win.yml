name: "AMD CI (Windows): validate unsloth-zoo PR 1363"

# Generated from amd_ci/templates/workflow_windows.yml by scaffold.py --windows.
#
# The Windows half of the devlab-dispatch pool: four GMKtec NucBox EVO-X2 Strix
# Halo boxes running Windows 11 Pro, with an AMD Radeon 8060S visible to Windows.
# They match in seconds and never queue. Everything below is measured on them:
#
#   shell: powershell     the ONLY correct value. `pwsh` is not installed (there
#                         is no PowerShell 7, only 5.1 Desktop) and neither is
#                         `bash`. Either one fails before the step's first line.
#                         Set as a job default so no step can drift off it.
#   no docker             not installed on any of the four. Containerised work
#                         stays on the Linux runners; there is no Windows target
#                         for it on this pool.
#   RUNNER_OS             has been observed EMPTY on these jobs, and correct on
#                         others. Echo it before branching on it; a bash-style
#                         ${RUNNER_OS:-?} in a PowerShell block is always "".
#   machine names         the X2-LA01-* prefix is SHARED with the Linux pool, so
#                         the name does not tell you which OS answered.
#   no shared state       jobs land on DIFFERENT machines and share no image
#                         cache and no disk. Anything fetched in one job must be
#                         fetched again in the next.
#
# The linux-control job exists to be diagnostic, not useful. A label that matches
# no runner does not fail a job, it queues it forever, and that looks exactly like
# a busy pool from the run list. This job differs from the Windows one ONLY in the
# OS label, so if it starts and the Windows job does not, the selector is wrong.
# Keep it, or reproduce it by pushing the same workflow twice.

on:
  push:
    branches: [amd-ci-zoo1363-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "1363"
  UPSTREAM: "https://github.com/unslothai/unsloth-zoo"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  linux-control:
    name: "zoo PR 1363 linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"
          echo "If this job runs and the windows job stays queued, the Windows"
          echo "selector matched no runner. If BOTH stay queued, the pool is busy."

  windows:
    name: "zoo PR 1363 on Windows (non-Docker)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    concurrency:
      group: amd-ci-gfx1151-gpu-windows
      cancel-in-progress: false
    # Uncomment when the job actually measures the GPU. It is off by default
    # because the four Windows boxes are four separate machines with four separate
    # GPUs, so serialising all of them costs throughput for nothing; the labels
    # cannot pin one machine, so there is no finer group to ask for. `lint_workflow.py`
    # raises W101 if a step here touches GPU memory without a group.
    # concurrency:
    #   group: amd-ci-strix-halo-windows-gpu
    #   cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "zoo1363-windows"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            Write-Host "Not skipping: a run that cannot start is a failure, not nothing to see."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          $extra = @()
          if ($env:MERGED -eq "1") { $extra += "--merged" }
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\states.py" `
            --repo "$env:UPSTREAM" --pr "$env:PR" @extra `
            --root "$env:AMD_CI_WORK" --out "$env:AMD_CI_WORK\out\states.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test environment
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          # The ROCm torch Studio's install.ps1 resolves for gfx1151 on Windows: AMD's per-arch index.
          & $py -m pip install -q --index-url https://repo.amd.com/rocm/whl/gfx1151/ "torch>=2.11.0,<2.12.0" "torchvision>=0.26.0,<0.27.0"
          Write-Host "torch install exit: $LASTEXITCODE"
          # unsloth and unsloth-zoo with --no-deps: both declare torch, and a resolver pass would
          # swap the ROCm build for PyPI's CPU one. zoo itself comes from each state's checkout
          # via PYTHONPATH, so only its dependencies are installed here.
          # PyPI's wheel, not a git build: building from source on Windows dies on MAX_PATH under
          # studio/backend/plugins (measured on run 35854320947).
          & $py -m pip install -q --no-deps unsloth
          Write-Host "unsloth install exit: $LASTEXITCODE"
          & $py -m pip install -q "transformers==5.5.0" "trl>=0.18.2,!=0.19.0,<=1.13.0" "peft>=0.18.0" accelerate "datasets>=3.4.1,!=4.0.*,!=4.1.0,<4.4.0" sentencepiece tqdm psutil wheel numpy protobuf huggingface_hub hf_transfer pillow regex msgspec typing_extensions filelock tyro typer rich pydantic pyyaml nest-asyncio structlog click
          Write-Host "stack install exit: $LASTEXITCODE"
          # torchao as a plain `pip install unsloth` gets it from zoo's dependency: present, and
          # crashing at import on Windows ROCm torch, which is what makes zoo install its stub.
          & $py -m pip install -q --no-deps "torchao==0.17.0"
          Write-Host "torchao install exit: $LASTEXITCODE"
          & $py -c "import torch; print('torch', torch.__version__, 'hip', torch.version.hip, 'cuda?', torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no device')"
          & $py -c "import torchao" 2>&1 | Select-Object -Last 3
          Write-Host "bare import torchao exit: $LASTEXITCODE"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"
          & $py "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --require rocm gpu --expect-arch gfx1151 --min-gpus 1 --out "$env:AMD_CI_WORK\out\host_rocm.json"
          Write-Host "rocm gate exit: $LASTEXITCODE"
          exit 0

      - name: Differential, torchao installed (plain pip install unsloth)
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = "Continue"
          $env:HF_HOME = "$env:AMD_CI_WORK\hf_home"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/zoo_rocm_stub_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/zoo_rocm_stub.py" `
            --out-dir "$env:AMD_CI_WORK\out\present" `
            --python "$env:AMD_CI_PY" -- --torchao-mode present
          Get-Content "$env:AMD_CI_WORK\out\present\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" "$env:AMD_CI_WORK\out\present"
          Write-Host "announce exit: $LASTEXITCODE"
          exit 0

      - name: Differential, torchao absent (a --no-deps install)
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = "Continue"
          $env:HF_HOME = "$env:AMD_CI_WORK\hf_home"
          & $env:AMD_CI_PY -m pip uninstall -y -q torchao
          Write-Host "torchao uninstall exit: $LASTEXITCODE"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/zoo_rocm_stub_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/zoo_rocm_stub.py" `
            --out-dir "$env:AMD_CI_WORK\out\absent" `
            --python "$env:AMD_CI_PY" -- --torchao-mode absent
          Get-Content "$env:AMD_CI_WORK\out\absent\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          # Last command: its exit status is the step's, so VOID / INCONCLUSIVE fail the job.
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" "$env:AMD_CI_WORK\out\absent"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoo1363-windows
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
