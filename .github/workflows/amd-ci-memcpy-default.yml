# Is the COPY KIND the mechanism, or merely the code block?
#
# Established already. The bisect put the corruption on one commit, 0ed235ea
# (b9826 clean, b9827 broken, direct parent-child). The revert test then proved
# causation: with only that 45-line cpy.cu hunk removed the run is clean, while
# the stock build in the same job on the same host reproduces the reported
# fingerprint ' Paris.,,, or or or is is is is,,,,, from from from'.
#
# What that does NOT show is WHY. Any defect inside those 45 lines would give
# the same answer. This run keeps the fast path and changes one word,
# cudaMemcpyDeviceToDevice to cudaMemcpyDefault, so a clean result implicates
# the copy kind specifically: DeviceToDevice asserts both pointers are device
# resident, which is false for hipMallocManaged pages once oversubscribed.
#
# It also matters because it is the SHIPPABLE shape. Deleting the fast path
# drops same-type strided copies outside F32/F16/BF16/I32 onto GGML_ABORT at
# cpy.cu:609, losing the coverage #25057 added for the GDN recurrent snapshot
# with -np 4. Changing the kind keeps it.
#
# The first attempt at this build did not compile: neither vendors/hip.h nor
# vendors/musa.h mapped cudaMemcpyDefault, so the one copy kind that resolves
# residency per pointer was unreachable from this file on non-CUDA backends.
# That mapping is now part of the branch under test.
#
# D2 is not optional. A build that failed to load, or a host too starved to
# reproduce, would also make D1 look clean. If D2 does not regress the run is
# void whatever D1 says.

name: "AMD CI: does cudaMemcpyDefault fix it while keeping the fast path"

on:
  push:
    branches: [amd-ci-memcpy-default]
  workflow_dispatch:

permissions:
  contents: read

env:
  CODER_REPO: "Qwen/Qwen3-Coder-Next-GGUF"
  CODER_REV: "b82fb7382639d97b38fa7672e526c760c2fb358e"
  CODER_DIR: "Qwen3-Coder-Next-Q4_K_M"
  CODER_HEAD: "Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf"
  CTX: "8192"
  NPREDICT: "30"
  REPEATS: "3"
  NGL: "999"
  LOAD_TIMEOUT: "900"
  REQ_TIMEOUT: "420"

jobs:

  gpu:
    name: "cudaMemcpyDefault vs stock, gfx1151 (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 420
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "memcpy-default"

      - name: Hardware gate and memory bounds
        run: |
          set -eu
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"
          { rocminfo || true; } > "$AMD_CI_WORK/out/rocminfo.txt" 2>&1
          { free -g; } > "$AMD_CI_WORK/out/free_start.txt" 2>&1
          cat "$AMD_CI_WORK/out/free_start.txt"
          df -h "$AMD_CI_WORK" | tail -1

      - name: Refuse to start on a memory-starved host
        id: memgate
        run: |
          set -eu
          # Run 33339076027 produced 18 uninterpretable cells because it landed
          # on a host still holding 31 GB of shared memory from the sweep before
          # it: 27 GB available against a 45.1 GiB model, so every load thrashed
          # and hit the timeout. "ephemeral" describes the runner process, not
          # the machine's page cache.
          #
          # A longer timeout does not fix that, it only fails more slowly. Check
          # the precondition instead and fail in seconds with the numbers, so the
          # answer is "the host was busy", not three hours of empty verdicts.
          AVAIL=$(awk '/MemAvailable/ {print int($2/1024/1024)}' /proc/meminfo)
          # Calibration, from three observed runs on this host:
          #   58 GiB available -> 20/20 cells certified
          #   48 GiB available -> untested, model is 45.1 GiB so it should fit
          #   27 GiB available -> 0/18, every load thrashed past the timeout
          # 47 leaves ~2 GiB over the model for compute buffers and KV. The first
          # threshold was 52, which refused a host with 48 GiB that would very
          # likely have worked. If 47 turns out to be too tight the failure is
          # cheap and unambiguous: cells time out on load and say so.
          NEED=47
          echo "available=${AVAIL} GiB, required=${NEED} GiB (45.1 GiB model plus headroom)"
          free -g
          if [ "$AVAIL" -lt "$NEED" ]; then
            echo "::error::Host has ${AVAIL} GiB available, need ${NEED} GiB. A previous job has not released memory. Re-run when the host is idle; do not raise the load timeout to work around this."
            exit 1
          fi

      - name: Fetch Qwen3-Coder-Next Q4_K_M, 45.1 GiB over four shards
        timeout-minutes: 240
        run: |
          set -eu
          M="$AMD_CI_WORK/models"
          for N in 00001 00002 00003 00004; do
            F="Qwen3-Coder-Next-Q4_K_M-$N-of-00004.gguf"
            python3 amd_ci/lib/fetch_gguf.py --repo "$CODER_REPO" \
              --file "$CODER_DIR/$F" --revision "$CODER_REV" --as-name "$F" \
              --local-dir "$M/ctl" --out "$AMD_CI_WORK/out/model_$N.json"
          done
          mkdir -p "$M/uma1"
          for F in "$M"/ctl/*.gguf; do ln -f "$F" "$M/uma1/$(basename "$F")"; done
          printf '%s\n' '-GGML_CUDA_ENABLE_UNIFIED_MEMORY' > "$M/ctl/env"
          printf '%s\n' 'GGML_CUDA_ENABLE_UNIFIED_MEMORY=1' > "$M/uma1/env"
          python3 amd_ci/lib/write_states.py --require-file "$CODER_HEAD" \
            --path "base=$M/ctl" --path "head=$M/uma1" \
            --label "base=unset" --label "head==1" \
            --out "$AMD_CI_WORK/out/states.json"
          df -h "$AMD_CI_WORK" | tail -1

      - name: "D1 - cudaMemcpyDefault variant (fast path KEPT)"
        if: always() && steps.memgate.outcome == 'success'
        timeout-minutes: 30
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          python3 amd_ci/lib/fetch_llamacpp.py --url "https://github.com/oobabooga/unsloth/releases/download/memcpydefault-test/llamacpp-memcpydefault-gfx1151.tar.gz" \
            --dest "$AMD_CI_WORK/lcpp/d1" --out "$AMD_CI_WORK/out/bin_d1.json"
          BIN="$(python3 -c "import json;print(json.load(open('$AMD_CI_WORK/out/bin_d1.json'))['bin_dir'])")"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/D1" \
            --title "D1 Qwen3-Coder-Next Q4_K_M, cudaMemcpyDefault variant, unset vs =1, gfx1151" \
            -- --bin-dir "$BIN" --gguf "$CODER_HEAD" --ngl "$NGL" \
               --ctx-size "$CTX" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=--parallel --extra-arg=1 --extra-arg=-fa --extra-arg=off \
               --load-timeout "$LOAD_TIMEOUT" --request-timeout "$REQ_TIMEOUT"
          cat "$AMD_CI_WORK/out/D1/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/D1" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memcpydefault-after-D1
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

      - name: "D2 - stock build (positive control, must REGRESS or the run is void)"
        if: always() && steps.memgate.outcome == 'success'
        timeout-minutes: 30
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          python3 amd_ci/lib/fetch_llamacpp.py --url "https://github.com/unslothai/llama.cpp/releases/download/b10687-mix-67dfc8b/app-b10687-mix-67dfc8b-linux-x64-rocm-gfx1151.tar.gz" \
            --dest "$AMD_CI_WORK/lcpp/d2" --out "$AMD_CI_WORK/out/bin_d2.json"
          BIN="$(python3 -c "import json;print(json.load(open('$AMD_CI_WORK/out/bin_d2.json'))['bin_dir'])")"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/D2" \
            --title "D2 same file, STOCK b10687-mix-67dfc8b gfx1151, unset vs =1, gfx1151" \
            -- --bin-dir "$BIN" --gguf "$CODER_HEAD" --ngl "$NGL" \
               --ctx-size "$CTX" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=--parallel --extra-arg=1 --extra-arg=-fa --extra-arg=off \
               --load-timeout "$LOAD_TIMEOUT" --request-timeout "$REQ_TIMEOUT"
          cat "$AMD_CI_WORK/out/D2/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/D2" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memcpydefault-after-D2
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
