name: llama.cpp drift harness

on:
  push:
    branches: [llamacpp-drift-harness]

permissions:
  contents: read

jobs:
  source:
    name: Source artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the published stamped source
        run: curl -fsSL --retry 5 -o "$RUNNER_TEMP/llama.cpp-source-b12209-mix-b84c2bf.tar.gz" https://github.com/unslothai/llama.cpp/releases/download/b12209-mix-b84c2bf/llama.cpp-source-b12209-mix-b84c2bf.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: app-source-b12209-mix-b84c2bf
          path: ${{ runner.temp }}/llama.cpp-source-b12209-mix-b84c2bf.tar.gz
          if-no-files-found: error
          retention-days: 1

  rocm:
    name: ROCm
    needs: source
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/unsloth-prebuilt-rocm.yml
    with:
      tag: b12209-mix-b84c2bf
      repo: unslothai/llama.cpp
      source_artifact: app-source-b12209-mix-b84c2bf
      matrix: '{"gfx_target":["gfx1151","gfx103X"]}'
      windows_matrix: '{"include":[{"gfx_target":"gfx1151","slice":0,"slices":2},{"gfx_target":"gfx1151","slice":1,"slices":2}]}'
      operating_systems: 'windows,ubuntu'
      rocm_version: weekly

  cpu:
    name: CPU
    needs: source
    uses: ./.github/workflows/unsloth-prebuilt-cpu.yml
    with:
      tag: b12209-mix-b84c2bf
      repo: unslothai/llama.cpp
      source_artifact: app-source-b12209-mix-b84c2bf

  test-rocm-linux:
    name: Test ROCm Linux gfx1151 (DevLab)
    needs: rocm
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling
          sparse-checkout: harness
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: app-b12209-mix-b84c2bf-linux-x64-rocm-gfx1151
          path: new
      - name: Hardware
        run: |
          uname -r
          lscpu | grep 'Model name' || true
          ls -l /dev/kfd /dev/dri 2>/dev/null || true
      - name: Test
        run: |
          python3 tooling/harness/bundle_test.py --kind rocm \
            --new new/app-b12209-mix-b84c2bf-linux-x64-rocm-gfx1151.tar.gz \
            --old https://github.com/unslothai/llama.cpp/releases/download/b12209-mix-b84c2bf/app-b12209-mix-b84c2bf-linux-x64-rocm-gfx1151.tar.gz \
            --model https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf \
            --work "$RUNNER_TEMP/bt"

  test-rocm-linux-static:
    name: Check ROCm Linux gfx103X (static)
    needs: rocm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling
          sparse-checkout: harness
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: app-b12209-mix-b84c2bf-linux-x64-rocm-gfx103X
          path: new
      - name: Test
        run: |
          python3 tooling/harness/bundle_test.py --kind static \
            --new new/app-b12209-mix-b84c2bf-linux-x64-rocm-gfx103X.tar.gz \
            --old https://github.com/unslothai/llama.cpp/releases/download/b12209-mix-b84c2bf/app-b12209-mix-b84c2bf-linux-x64-rocm-gfx103X.tar.gz \
            --work "$RUNNER_TEMP/bt"
          ls -la "$RUNNER_TEMP/bt/new" | grep -E 'hsa-runtime|LICENSE|comgr'
          cmp "$RUNNER_TEMP/bt/new/libhsa-runtime64.so" "$RUNNER_TEMP/bt/new/libhsa-runtime64.so.1" && echo "hsa names agree"

  test-rocm-windows:
    name: Test ROCm Windows gfx1151 (DevLab)
    needs: rocm
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling
          sparse-checkout: harness
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: app-b12209-mix-b84c2bf-windows-x64-rocm-gfx1151
          path: new
      - name: Test
        run: |
          python tooling\harness\bundle_test.py --kind rocm `
            --new new\app-b12209-mix-b84c2bf-windows-x64-rocm-gfx1151.zip `
            --old https://github.com/unslothai/llama.cpp/releases/download/b12209-mix-b84c2bf/app-b12209-mix-b84c2bf-windows-x64-rocm-gfx1151.zip `
            --model https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf `
            --work "$env:RUNNER_TEMP\bt-rocm-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          exit $LASTEXITCODE

  test-cpu-windows-x64:
    name: Test CPU Windows x64 (DevLab)
    needs: cpu
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling
          sparse-checkout: harness
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: app-b12209-mix-b84c2bf-windows-x64-cpu
          path: new
      - name: Test
        run: |
          python tooling\harness\bundle_test.py --kind cpu `
            --new new\app-b12209-mix-b84c2bf-windows-x64-cpu.zip `
            --old https://github.com/unslothai/llama.cpp/releases/download/b12209-mix-b84c2bf/app-b12209-mix-b84c2bf-windows-x64-cpu.zip `
            --model https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf `
            --work "$env:RUNNER_TEMP\bt-cpu-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $rc = $LASTEXITCODE
          Get-ChildItem "$env:RUNNER_TEMP\bt-cpu-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT\new" -Filter 'libomp*' | ForEach-Object { "{0} {1} bytes signature={2}" -f $_.Name, $_.Length, (Get-AuthenticodeSignature $_.FullName).Status }
          exit $rc

  test-cpu-windows-arm64:
    name: Test CPU Windows arm64 (hosted)
    needs: cpu
    if: ${{ !cancelled() }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling
          sparse-checkout: harness
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: app-b12209-mix-b84c2bf-windows-arm64-cpu
          path: new
      - name: Test
        shell: pwsh
        run: |
          python tooling\harness\bundle_test.py --kind cpu `
            --new new\app-b12209-mix-b84c2bf-windows-arm64-cpu.zip `
            --old https://github.com/unslothai/llama.cpp/releases/download/b12209-mix-b84c2bf/app-b12209-mix-b84c2bf-windows-arm64-cpu.zip `
            --model https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf `
            --work "$env:RUNNER_TEMP\bt"
          exit $LASTEXITCODE
