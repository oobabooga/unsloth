name: unsloth PR 17463 Windows install test (HARNESS ONLY)

# Runs Studio's real llama.cpp installer on Windows as a chat-only NVIDIA host would, with only host
# detection replaced: once at ddcecd7579 (before the follow-up) and once at 0f9265c15f (the pushed follow-up commit).
# Then checks whether ggml-cuda.dll loads through the search dirs Studio builds. Nothing published.

on:
  push:
    branches: [pr17463-harness]

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.line }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: cuda13, driver: '13.1', cap: '120' }
          - { line: cuda12, driver: '12.8', cap: '86' }
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: '3.12' }
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1

      - name: Fetch the PR's studio code, before and after the follow-up commit
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($pair in @(@('pr_orig', 'ddcecd7579edd09d1c0aa7ac6128e80cea045353'), @('pr_fix', '0f9265c15f055e4a4746e1ca04b730420e12b6b3'))) {
            git init -q $pair[0]
            git -C $pair[0] fetch -q --depth 1 https://github.com/LeoBorcherding/unsloth $pair[1]
            if ($LASTEXITCODE -ne 0) { throw "could not fetch $($pair[1])" }
            git -C $pair[0] checkout -q FETCH_HEAD
            git -C $pair[0] log -1 --format='%H %s'
          }
          New-Item -ItemType Directory -Force -Path driver | Out-Null
          foreach ($e in 'env_orig', 'env_fix') { python -m venv $e; & "$e\Scripts\python.exe" -m pip install -q uv }

      - name: PR as pushed, real installer
        run: |
          $env:PATH = "$PWD\env_orig\Scripts;$env:PATH"
          & env_orig\Scripts\python.exe -B h/win_e2e.py pr_orig/studio install_orig ${{ matrix.driver }} ${{ matrix.cap }} driver ORIGINAL install 2>&1 | Tee-Object -FilePath orig_install.log | Select-String -Pattern 'RESULT|selected|no CUDA runtime|wheel|validated|PrebuiltFallback|Traceback|Error' | ForEach-Object { $_.Line }
          exit 0

      - name: Build the nvcuda.dll stand-in (the runner has no NVIDIA driver)
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path install_orig -Recurse -Filter ggml-cuda.dll | Select-Object -First 1
          if (-not $dll) { throw 'the original install has no ggml-cuda.dll' }
          python -B h/probe.py gen-stub $dll.FullName driver/stub.c
          if (Test-Path driver/stub.c) {
            Push-Location driver
            cl /nologo /LD stub.c /Fe:nvcuda.dll
            if ($LASTEXITCODE -ne 0) { throw 'stub build failed' }
            Pop-Location
          }

      - name: PR as pushed, result
        run: |
          $env:PATH = "$PWD\env_orig\Scripts;$env:PATH"
          & env_orig\Scripts\python.exe -B h/win_e2e.py pr_orig/studio install_orig ${{ matrix.driver }} ${{ matrix.cap }} driver ORIGINAL probe 2>&1 | Tee-Object -FilePath orig.log
          & env_orig\Scripts\python.exe -B h/win_e2e.py pr_orig/studio install_orig ${{ matrix.driver }} ${{ matrix.cap }} driver ORIGINAL check 2>&1 | Select-String -Pattern 'RESULT' | ForEach-Object { $_.Line } | Tee-Object -FilePath orig.log -Append

      - name: With the follow-up, real installer
        run: |
          $env:PATH = "$PWD\env_fix\Scripts;$env:PATH"
          & env_fix\Scripts\python.exe -B h/win_e2e.py pr_fix/studio install_fix ${{ matrix.driver }} ${{ matrix.cap }} driver FIXED install 2>&1 | Tee-Object -FilePath fix_install.log | Select-String -Pattern 'RESULT|selected|no CUDA runtime|wheel|validated|PrebuiltFallback|Traceback|Error' | ForEach-Object { $_.Line }
          exit 0

      - name: With the follow-up, result
        run: |
          $env:PATH = "$PWD\env_fix\Scripts;$env:PATH"
          & env_fix\Scripts\python.exe -B h/win_e2e.py pr_fix/studio install_fix ${{ matrix.driver }} ${{ matrix.cap }} driver FIXED probe 2>&1 | Tee-Object -FilePath fix.log
          & env_fix\Scripts\python.exe -B h/win_e2e.py pr_fix/studio install_fix ${{ matrix.driver }} ${{ matrix.cap }} driver FIXED check 2>&1 | Select-String -Pattern 'RESULT' | ForEach-Object { $_.Line } | Tee-Object -FilePath fix.log -Append

      - name: With the follow-up, the wheels are removed and the installer runs again
        run: |
          $env:PATH = "$PWD\env_fix\Scripts;$env:PATH"
          $pkgs = (& env_fix\Scripts\python.exe -m pip list --disable-pip-version-check --format=freeze) | Where-Object { $_ -match '^nvidia' } | ForEach-Object { ($_ -split '==')[0] }
          & env_fix\Scripts\python.exe -m pip uninstall -y -q @pkgs
          & env_fix\Scripts\python.exe -B h/win_e2e.py pr_fix/studio install_fix ${{ matrix.driver }} ${{ matrix.cap }} driver REMOVED check 2>&1 | Select-String -Pattern 'RESULT' | ForEach-Object { $_.Line } | Tee-Object -FilePath removed.log
          & env_fix\Scripts\python.exe -B h/win_e2e.py pr_fix/studio install_fix ${{ matrix.driver }} ${{ matrix.cap }} driver RERUN install 2>&1 | Select-String -Pattern 'RESULT|no CUDA runtime|skipping download|already matches' | ForEach-Object { $_.Line } | Tee-Object -FilePath removed.log -Append
          & env_fix\Scripts\python.exe -B h/win_e2e.py pr_fix/studio install_fix ${{ matrix.driver }} ${{ matrix.cap }} driver RERUN probe 2>&1 | Tee-Object -FilePath removed.log -Append
          & env_fix\Scripts\python.exe -B h/win_e2e.py pr_fix/studio install_fix ${{ matrix.driver }} ${{ matrix.cap }} driver RERUN check 2>&1 | Select-String -Pattern 'RESULT' | ForEach-Object { $_.Line } | Tee-Object -FilePath removed.log -Append

      - name: Verdict
        shell: bash
        run: |
          set -uo pipefail
          grep -ah '^RESULT' orig.log fix.log removed.log | grep -v 'list-devices' | cut -c1-260
          set -e
          grep -aq 'RESULT FIXED nvidia wheels in the env: \[' fix.log
          grep -aq 'RESULT FIXED LoadLibrary(ggml-cuda.dll): loaded' fix.log
          grep -aq 'RESULT FIXED --check-installed exit code: 0' fix.log
          grep -aq 'RESULT RERUN LoadLibrary(ggml-cuda.dll): loaded' removed.log
          echo "RESULT VERDICT: with the follow-up a real chat-only style install gets the wheels and ggml-cuda.dll loads"
