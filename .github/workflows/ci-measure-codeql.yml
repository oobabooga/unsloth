name: CI measure codeql
on:
  push:
    branches: [ci-measure-codeql]
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: codeql ${{ matrix.variant }} r${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [base, no-tests]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: python
          build-mode: none
          config-file: ${{ matrix.variant == 'no-tests' && './.github/codeql/no-tests.yml' || '' }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: measure-${{ matrix.variant }}-${{ matrix.rep }}
          upload: never
          output: ${{ runner.temp }}/sarif
      - name: Count results
        if: always()
        run: python3 -c "import json,glob;print(sum(len(r['results']) for f in glob.glob('${{ runner.temp }}/sarif/*.sarif') for r in json.load(open(f))['runs']),'alerts')"
