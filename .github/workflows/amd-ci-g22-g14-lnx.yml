name: "AMD CI: validate PR 19516"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-g22-g14-lnx]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "19516"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  AMD1_BASE_OVERRIDE: "40dcaecec96085d109cf241eff083f18a0243cd0"
  AMD1_HEAD_OVERRIDE: "31c9556c83e094181f702d2ac6895992664266de"
  MERGED: "0"
  # Set by scaffold.py --patch: base = PATCH_BASE, head = PATCH_BASE plus this diff (relative to the checkout).
  PATCH_BASE: ""
  PATCH_FILE: ""
  PATCH_SHA256: "__PATCH_SHA256__"

jobs:

  gpu:
    name: "PR 19516 GPU check (shared GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    # --shared-gpu: no concurrency group, so a co-tenant may share the card.
    # Correctness only; capability.py reports `exclusive_gpu` as a gap.
    env:
      AMD_CI_SHARED_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr19516-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          if [ -n "$PATCH_FILE" ]; then ARGS="--patch-base $PATCH_BASE --patch $GITHUB_WORKSPACE/$PATCH_FILE --patch-sha256 $PATCH_SHA256"; fi
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and host gate (no Studio)
        run: |
          set -euo pipefail
          echo "AMD_CI_PY=$(command -v python3)" >> "$GITHUB_ENV"
          # No torch here, so rocm/gpu read UNDETERMINED: the criteria gates prove the GPU ran.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/train5_probe.py \
            --criteria amd_ci/criteria/amdgate_rocm.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --unit g14 --state-repo unsloth --transformers 5.24.0 --trl 1.18.0 --cells env,flm16,flm4,grpo_txt,grpo_padeos,dpo_txt,vision,tphost,gen_llama,gen_llama_f32,gen_mistral,gen_gemma3,plain_llama,plain_qwen2,plain_after,grpo_padeos_ref,grpo_padeos_refctl,gen_llama_mlpbias --companion-repo https://github.com/unslothai/unsloth-zoo --companion-base a9e7f62143583a2a436d76dff5606b197f6375e7 --companion-head 641c14e7b36a3ce647e1945f97a507455b53b4e1 --venv "$AMD_CI_WORK/tvenv" --tests tests/test_async_grpo_server_info.py tests/test_bf16_stochastic_rounding_check_oom.py tests/test_fast_linear_forward_prefill_bias.py tests/test_fp8_block_op_schema.py tests/test_large_head_attention.py tests/test_dpo_prefix_share.py tests/test_functorch_config_thread_mirror.py tests/utils/test_q_galore.py tests/test_grpo_pad_is_eos_old_ref_logps.py tests/test_grpo_packed_raw_logits_nograd.py tests/test_grpo_padded_loop_frees_chunk.py tests/test_grpo_ep_ddp_reducer_gloo.py tests/test_optimizer_state_offload_overlap_dtensor.py tests/test_pp_env_engagement_gloo.py tests/test_parallel_capabilities_evidence.py tests/test_int4_fast_probe_oom.py tests/test_gdn_probe_oom.py tests/test_prefix_grouper_rocm_static_flex.py tests/test_inkling2_flex.py tests/test_import_keeps_plain_model_backends.py tests/test_import_metadata_cache.py tests/test_ulysses_whole_sequence_mask.py tests/test_pp_router_statistics_sync_free.py tests/test_fp8_lora.py --repeat flm16,flm4,grpo_txt,dpo_txt,gen_llama,gen_mistral,plain_llama,grpo_padeos_refctl --companion-tests tests/test_grpo_expert_parallel_collective_gloo.py tests/test_fast_path_probe_oom.py tests/test_patch_torch_compile_env_hygiene.py tests/test_standby_fast_wake.py tests/test_grpo_pad_in_prompt.py tests/test_grpo_pad_is_eos_mask.py tests/test_temporary_patches_imports.py tests/test_triton_fast_launch.py tests/test_masks_plain_model_unpatched.py tests/test_rocm_sdk_wheel_detection.py tests/test_flex_rocm_static_compile.py tests/test_moe_grouped_mm_rocm_crash_probe.py tests/test_moe_grouped_fp16_mm_oom.py tests/test_block_swap.py tests/test_block_swap_disk.py tests/test_cpu_ce_head_cast_once.py tests/test_cpu_backend.py tests/test_fused_aligned_ce.py tests/test_fused_ast_fallback.py tests/test_fused_lm_head_peft_adapter.py tests/test_fused_loss_post_head_scale.py --companion-tests-from-head tests/test_grpo_expert_parallel_collective_gloo.py tests/test_fast_path_probe_oom.py tests/test_patch_torch_compile_env_hygiene.py tests/test_standby_fast_wake.py !tests/test_grpo_pad_in_prompt.py !tests/test_grpo_pad_is_eos_mask.py !tests/test_temporary_patches_imports.py !tests/test_triton_fast_launch.py !tests/test_masks_plain_model_unpatched.py tests/test_rocm_sdk_wheel_detection.py !tests/test_flex_rocm_static_compile.py !tests/test_moe_grouped_mm_rocm_crash_probe.py tests/test_moe_grouped_fp16_mm_oom.py !tests/test_block_swap.py tests/test_block_swap_disk.py tests/test_cpu_ce_head_cast_once.py !tests/test_cpu_backend.py --tests-from-head tests/test_async_grpo_server_info.py tests/test_bf16_stochastic_rounding_check_oom.py tests/test_fast_linear_forward_prefill_bias.py tests/test_fp8_block_op_schema.py !tests/test_large_head_attention.py !tests/test_dpo_prefix_share.py tests/test_functorch_config_thread_mirror.py !tests/utils/test_q_galore.py !tests/test_grpo_pad_is_eos_old_ref_logps.py !tests/test_grpo_packed_raw_logits_nograd.py tests/test_grpo_padded_loop_frees_chunk.py tests/test_grpo_ep_ddp_reducer_gloo.py tests/test_optimizer_state_offload_overlap_dtensor.py tests/test_pp_env_engagement_gloo.py !tests/test_parallel_capabilities_evidence.py tests/test_int4_fast_probe_oom.py tests/test_gdn_probe_oom.py !tests/test_prefix_grouper_rocm_static_flex.py !tests/test_inkling2_flex.py !tests/test_import_keeps_plain_model_backends.py !tests/test_import_metadata_cache.py !tests/test_ulysses_whole_sequence_mask.py tests/test_pp_router_statistics_sync_free.py !tests/test_fp8_lora.py
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr19516-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
