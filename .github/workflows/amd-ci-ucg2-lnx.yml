name: "AMD CI: validate PR 18607"

# Generated from amd_ci/templates/workflow.yml. Edit the PROBE and CRITERIA env
# values, and the tests/args, rather than the plumbing.
#
# Two jobs, because two jobs of this workflow may land on the SAME machine and
# then share its one GPU:
#   suites  masks the GPU, so it cannot perturb a measurement running beside it
#   gpu     is the only job allowed to allocate, and is serialised against every
#           other run of the same concurrency group
#
# They may equally land on different machines: the Linux pool is at least seven
# (a 24-way matrix ran essentially concurrently across seven distinct hosts).
# Nothing is shared between them, including the Docker image cache, so a job that
# pulls an image does not make it available to the next one.
#
# This is the LINUX template. For the Windows boxes use
# `scaffold.py --windows`, which emits templates/workflow_windows.yml.
#
# If your change needs no GPU measurement, delete the gpu job. If it needs no
# test suites, delete suites. Do not delete the gate: it fails rather than
# skipping, because a skip misreports missing hardware as nothing to see.

on:
  push:
    branches: [amd-ci-ucg2-lnx]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "18607"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  AMD1_BASE_OVERRIDE: "b2143346a3f95de3cb42733161eec95246999d83"
  AMD1_HEAD_OVERRIDE: "1ff01c7d6a2e47827b7af08a41ac2b9fb4ae8bef"
  MERGED: "0"
  # Set by scaffold.py --patch: base = PATCH_BASE, head = PATCH_BASE plus this diff (relative to the checkout).
  PATCH_BASE: ""
  PATCH_FILE: ""
  PATCH_SHA256: "__PATCH_SHA256__"

jobs:

  gpu:
    name: "PR 18607 GPU check (shared GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 180
    # --shared-gpu: no concurrency group, so a co-tenant may share the card.
    # Correctness only; capability.py reports `exclusive_gpu` as a gap.
    env:
      AMD_CI_SHARED_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "pr18607-gpu"

      - name: Hardware gate
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json" || \
          echo "note: gate ran before the venv exists; re-gated after install below"

      - name: Resolve states
        run: |
          set -euo pipefail
          ARGS=""
          [ "$MERGED" = "1" ] && ARGS="--merged"
          if [ -n "$PATCH_FILE" ]; then ARGS="--patch-base $PATCH_BASE --patch $GITHUB_WORKSPACE/$PATCH_FILE --patch-sha256 $PATCH_SHA256"; fi
          python3 amd_ci/lib/states.py --repo "$UPSTREAM" --pr "$PR" $ARGS \
            --root "$AMD_CI_WORK" --out "$AMD_CI_WORK/out/states.json"

      - name: Environment and host gate (no Studio)
        run: |
          set -euo pipefail
          echo "AMD_CI_PY=$(command -v python3)" >> "$GITHUB_ENV"
          # No torch here, so rocm/gpu read UNDETERMINED: the criteria gates prove the GPU ran.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --no-torch --out "$AMD_CI_WORK/out/host.json"

      - name: Differential
        run: |
          set +e
          "$AMD_CI_PY" amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/train5_probe.py \
            --criteria amd_ci/criteria/train5_rocm.py \
            --out-dir "$AMD_CI_WORK/out/gpu" \
            --python "$AMD_CI_PY" -- --unit ucg2 --state-repo unsloth --transformers 5.23.0 --trl 1.18.0 --cells env,cg2_qwen3,cg2_qwen3_nbc,cg2_qwen3_nbc_off,cg2_llama,cg2_llama_nbc,cg2_llama4_nbc --companion-repo https://github.com/unslothai/unsloth-zoo --companion-base a5152752a24949fb7bb410b562ff8cbcc995d81d --companion-head fb30df80c0eb8c813be5afbb0db01eb301a36b8c --venv "$AMD_CI_WORK/tvenv" --tests tests/test_gc_skip_replay_mlp_down.py --repeat cg2_qwen3,cg2_qwen3_nbc,cg2_llama,cg2_llama_nbc,cg2_llama4_nbc --companion-tests tests/test_gc_replay_module.py --companion-tests-from-head tests/test_gc_replay_module.py --tests-from-head tests/test_gc_skip_replay_mlp_down.py
          cat "$AMD_CI_WORK/out/gpu/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/gpu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr18607-gpu
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
