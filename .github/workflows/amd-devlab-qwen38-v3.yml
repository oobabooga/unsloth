name: "Qwen3.8-27B V2 vs V3 on AMD"

# A Reddit thread reports the V3 Qwen3.8-27B quants crashing on the first
# generated token on dual-AMD Vulkan setups (RX 9070 XT + RX 7800 XT, and other
# RDNA4 + RDNA3 pairs) on Windows, with the V2 revision working. Rolling back
# the revision fixes it, so the question is whether V3 is a bad quant or whether
# it exposes something in the backend.
#
# This runner cannot answer the dual-GPU Windows half: it is one gfx1151 APU on
# Linux. What it CAN answer is whether V3 runs clean on AMD at all, on both
# backends, with everything else held equal. A clean V3 here points at the
# multi-GPU split rather than the file; a broken V3 here is a much larger
# finding and is reproducible without the reporter's hardware.
#
# No system packages are installed and nothing outside $RUNNER_TEMP is written:
# the two llama.cpp builds are release tarballs, a sudo shim on PATH refuses any
# escalation, and there is no pip or apt anywhere in the job.

on:
  push:
    branches: [amd-devlab-qwen38-v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quants:
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 150
    env:
      LLAMA_BUILD: "b10590"
      HF_REPO: "unsloth/Qwen3.8-27B-GGUF"
      # The quant the thread names, and one of the few present under the same
      # filename in both revisions, so V2 and V3 are the only variable.
      QUANT: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
      V2_REV: "408fcc1807ab"
      V3_REV: "main"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Isolation and hardware gate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/qwen38"
          mkdir -p "$WORK"/{bin,models,out,tmp}

          # Nothing in this job may touch the system. install.sh is not used
          # here, but a shim makes that a property of the job rather than a
          # claim about it: anything reaching for sudo fails loudly.
          cat > "$WORK/bin/sudo" <<'SH'
          #!/bin/sh
          echo "sudo refused: this job installs no system packages ($*)" >&2
          exit 1
          SH
          chmod +x "$WORK/bin/sudo"
          {
            echo "WORK=$WORK"
            echo "TMPDIR=$WORK/tmp"
            echo "PATH=$WORK/bin:$PATH"
          } >> "$GITHUB_ENV"

          echo "::group::hardware"
          uname -a; free -h; df -h "$RUNNER_TEMP"
          rocminfo | grep -E 'Marketing Name:|gfx' | head -10 || true
          rocm-smi || true
          echo "::endgroup::"

          echo "::group::vulkan"
          # The reporter's backend. If the image has no ICD the Vulkan half of
          # the matrix cannot run, and saying so beats reporting ROCm as if it
          # answered the question.
          ls /usr/share/vulkan/icd.d/ 2>/dev/null || echo "(no icd.d)"
          command -v vulkaninfo && vulkaninfo --summary 2>&1 | head -30 || echo "(no vulkaninfo)"
          # An ICD json is the driver, not the loader. ggml-vulkan dlopens
          # libvulkan.so.1, and without it the whole Vulkan backend fails to
          # register and llama silently runs on CPU instead, which looks like a
          # clean pass and answers nothing.
          ldconfig -p | grep -i vulkan || echo "(no vulkan libs in ldconfig)"
          echo "::endgroup::"

          echo "::group::vulkan loader"
          if ldconfig -p | grep -q 'libvulkan\.so\.1'; then
            echo "loader present system-wide"
          else
            # Unpacked into the job's own tree, never installed: no apt, no
            # system package is touched, and it dies with the runner.
            echo "loader missing, unpacking libvulkan1 locally"
            mkdir -p "$WORK/vk"
            ( cd "$WORK/vk"
              for pkg in libvulkan1 mesa-vulkan-drivers; do
                url=$(curl -s "https://packages.ubuntu.com/noble/amd64/$pkg/download" \
                  | grep -oE 'https?://[^"]*'"$pkg"'[^"]*_amd64\.deb' | head -1)
                echo "$pkg -> ${url:-none}"
                [ -n "$url" ] && curl -fLs -o "$pkg.deb" "$url" && dpkg-deb -x "$pkg.deb" . || true
              done )
            find "$WORK/vk" -name 'libvulkan*' -o -name 'libvulkan_radeon*' | head
          fi
          # The RADV ICD, by glob: the filename is radeon_icd.json on some
          # images and radeon_icd.x86_64.json on others, and naming the wrong
          # one is another way to land silently on CPU.
          icd=$(ls /usr/share/vulkan/icd.d/radeon_icd*.json "$WORK"/vk/usr/share/vulkan/icd.d/radeon_icd*.json 2>/dev/null | head -1 || true)
          echo "ICD: ${icd:-none found}"
          [ -n "$icd" ] && echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Fetch llama.cpp release builds
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd "$WORK"
          base="https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_BUILD"
          for flavour in vulkan-x64 rocm-7.14-x64; do
            name="llama-$LLAMA_BUILD-bin-ubuntu-$flavour.tar.gz"
            echo "== $name"
            if curl -fL --retry 3 -o "$name" "$base/$name"; then
              mkdir -p "build-$flavour"
              tar xzf "$name" -C "build-$flavour"
              rm -f "$name"
              find "build-$flavour" -name 'llama-cli' -printf '%p\n'
            else
              echo "WARN: $name unavailable"
            fi
          done
          du -sh "$WORK"/build-* 2>/dev/null || true

          echo "::group::vulkan backend library"
          # libvulkan.so.1 is present on this image, so the CPU fallback in the
          # previous run was not a missing loader. ggml dlopens its backends and
          # swallows the failure, so resolve the library by hand and let ldd
          # name whatever it cannot find.
          vklib=$(find "$WORK/build-vulkan-x64" -name '*ggml-vulkan*' 2>/dev/null | head -1)
          echo "backend lib: ${vklib:-none}"
          if [ -n "$vklib" ]; then
            ldd "$vklib" 2>&1 | grep -iE "not found|vulkan" || echo "(all deps resolve)"
          fi
          ls "$(dirname "$(find "$WORK/build-vulkan-x64" -name llama-completion | head -1)")" | head -30
          echo "::endgroup::"

      - name: Download the V2 and V3 quant
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$WORK/models"
          for pair in "v2:$V2_REV" "v3:$V3_REV"; do
            label="${pair%%:*}"; rev="${pair##*:}"
            url="https://huggingface.co/$HF_REPO/resolve/$rev/$QUANT"
            echo "== $label from $rev"
            curl -fL --retry 5 --retry-delay 10 -o "$label.gguf" "$url"
            ls -l "$label.gguf"
            sha256sum "$label.gguf" | tee -a "$WORK/out/checksums.txt"
          done
          df -h "$RUNNER_TEMP"

      - name: Header diff, V2 against V3
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/gguf_local_diff.py" \
            "$WORK/models/v2.gguf" "$WORK/models/v3.gguf" \
            2>&1 | tee "$WORK/out/header_diff.txt" | tail -40

      - name: Generate on every backend and revision
        timeout-minutes: 60
        run: |
          # GitHub runs step shells with -e, so a crashing cell would abort the
          # step before its exit code could be recorded. A crash is the result
          # here, so errexit is explicitly off.
          set +e
          set -uo pipefail
          cd "$WORK"
          : > out/matrix.txt
          for flavour in vulkan-x64 rocm-7.14-x64; do
            # llama-completion is the non-interactive binary. llama-cli was
            # rewritten into a chat UI whose args differ (it rejects -no-cnv and
            # takes -st instead), and left to itself it waits on stdin.
            cli=$(find "build-$flavour" -name llama-completion -type f 2>/dev/null | head -1)
            oneshot="-no-cnv"
            if [ -z "$cli" ]; then
              cli=$(find "build-$flavour" -name llama-cli -type f 2>/dev/null | head -1)
              oneshot="-st"
            fi
            if [ -z "$cli" ]; then
              echo "$flavour: build missing, skipped" | tee -a out/matrix.txt
              continue
            fi
            libdir=$(dirname "$cli")
            echo "$flavour: using $(basename "$cli") with $oneshot"
            for rev in v2 v3; do
              log="out/${flavour}_${rev}.log"
              echo "===== $flavour $rev"
              # Greedy and seeded so the two revisions are comparable, short so a
              # crash on the first token is the thing being measured rather than
              # a long run being waited on.
              # -no-cnv is load-bearing: without it llama-cli opens a chat
              # session for a template model, ignores -n and waits on stdin, and
              # the run is killed by its own timeout instead of generating.
              LD_LIBRARY_PATH="$libdir:$WORK/vk/usr/lib/x86_64-linux-gnu" \
              timeout 420 "$cli" \
                -m "models/$rev.gguf" \
                -ngl 999 --temp 0 --seed 1234 -n 64 -c 4096 --no-warmup \
                $oneshot \
                -p "Write one sentence about the sea." \
                < /dev/null > "$log" 2>&1
              rc=$?
              # Which backend actually registered. A cell that fell back to CPU
              # is not a Vulkan result and must not be reported as one.
              sysinfo=$(grep -a "system_info:" "$log" | head -1)
              echo "$sysinfo" | tr '|' '\n' | grep -aE "ROCm|Vulkan|BLAS" | head -3
              backend="cpu-only"
              case "$sysinfo" in
                *Vulkan*) backend="vulkan" ;;
                *ROCm*)   backend="rocm" ;;
              esac
              printf '%-16s %-3s backend=%-9s exit=%-4s %s\n' "$flavour" "$rev" "$backend" "$rc" \
                "$(grep -aoE 'error|assert|Aborted|out of memory|device lost|SIGSEGV' "$log" | sort -u | tr '\n' ',' )" \
                | tee -a out/matrix.txt
              tail -25 "$log"
            done
          done
          echo; cat out/matrix.txt
          # A crashing cell is the result, not a broken job: the table and the
          # logs are the deliverable and the summary step reads them.
          exit 0

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Qwen3.8-27B $QUANT, V2 ($V2_REV) against V3 ($V3_REV)"
            echo
            echo '```'
            cat "$WORK/out/matrix.txt" 2>/dev/null || echo "(no matrix)"
            echo '```'
            echo
            echo "### Header diff"
            echo '```'
            sed -n '/type moves/,$p' "$WORK/out/header_diff.txt" 2>/dev/null | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-v2-v3
          path: ${{ env.WORK }}/out
          retention-days: 7
          if-no-files-found: warn
