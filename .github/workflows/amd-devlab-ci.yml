name: AMD DevLab CI

on:
  push:
    branches: [amd-devlab-ci]

permissions: {}

env:
  BASE_SHA: 177a57b3b416cd572d3ed482eb2e08e6a3de5061

jobs:
  pr2tests:
    name: PR2 -- routing tests on the final patch
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 45
    steps:
      - name: Apply and run
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/pr2"; mkdir -p "$WORK"/{tmp,cache}
          git clone --filter=blob:none --no-checkout https://github.com/unslothai/unsloth "$WORK/repo"
          git -C "$WORK/repo" fetch --depth 1 origin "$BASE_SHA"
          git -C "$WORK/repo" checkout --detach "$BASE_SHA"
          echo '' | base64 -d > "$WORK/pr2.patch"
          git -C "$WORK/repo" apply --verbose "$WORK/pr2.patch"
          export TMPDIR="$WORK/tmp" PIP_CACHE_DIR="$WORK/cache"
          python3 -m venv "$WORK/venv"
          . "$WORK/venv/bin/activate"
          pip install -q --upgrade pip pytest
          cd "$WORK/repo"
          python -m pytest tests/studio/install/test_missing_kernel_arch_routing_9396.py -q
