name: AMD DevLab CI

on:
  push:
    branches: [amd-devlab-npu-e2e]

permissions:
  contents: read

env:
  BASE_SHA: 00693c6f72

jobs:
  linux:
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Install Studio from the patched checkout
        run: |
          set -euxo pipefail
          W="$RUNNER_TEMP/npu-e2e-$GITHUB_RUN_ID"
          mkdir -p "$W/tmp" "$W/hf" "$W/uv"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "TMPDIR=$W/tmp" >> "$GITHUB_ENV"
          echo "HF_HOME=$W/hf" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$W/uv" >> "$GITHUB_ENV"
          echo "UNSLOTH_STUDIO_HOME=$W/studio" >> "$GITHUB_ENV"
          export TMPDIR="$W/tmp" HF_HOME="$W/hf" UV_CACHE_DIR="$W/uv" UNSLOTH_STUDIO_HOME="$W/studio"
          git clone -q --filter=blob:none https://github.com/unslothai/unsloth.git "$W/src"
          cd "$W/src"
          git checkout -q "$BASE_SHA"
          git apply --index "$GITHUB_WORKSPACE/harness/npu.patch"
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m npu
          uname -a; ulimit -l; ls -l /dev/accel* || true
          UNSLOTH_SKIP_AUTOSTART=1 ./install.sh --local --no-torch --no-rollback > "$W/install.log" 2>&1 || { tail -150 "$W/install.log"; exit 1; }
          tail -40 "$W/install.log"
      - name: NPU end to end
        shell: bash {0}
        run: |
          set -uxo pipefail
          cd "$W/src"
          PY="$UNSLOTH_STUDIO_HOME/unsloth_studio/bin/python"
          PW="npu-e2e-$GITHUB_RUN_ID-Pw1"
          start() {
            PORT=$(shuf -i 18800-18899 -n 1)
            echo "PORT=$PORT"
            # --password sets the initial password only; a second start with it refuses to run.
            if [ "$1" = main ]; then PWARG=(--password "$PW"); else PWARG=(); fi
            # The built frontend when there is one, for the UI walkthrough; the API alone otherwise.
            if [ -f "$PWD/studio/frontend/dist/index.html" ]; then FE=(--frontend "$PWD/studio/frontend/dist"); else FE=(--api-only); fi
            # Not "(cd ... && nohup ... &)": that backgrounds a subshell, and $! would be the subshell's pid.
            pushd studio/backend > /dev/null
            nohup "$PY" run.py --host 127.0.0.1 --port "$PORT" "${FE[@]}" "${PWARG[@]}" >> "$W/studio-$1.log" 2>&1 &
            echo $! > "$W/studio.pid"
            popd > /dev/null
            ps -o pid,ppid,cmd -p "$(cat "$W/studio.pid")"
            for i in $(seq 1 300); do curl -sf "http://127.0.0.1:$PORT/api/health" >/dev/null && break; sleep 1; done
            if ! curl -sf "http://127.0.0.1:$PORT/api/health"; then echo "Studio did not start"; tail -80 "$W/studio-$1.log"; fi; echo
          }
          procs() { echo "== $1"; pgrep -af 'lemond|flm-real|/flm ' | grep -v pgrep || echo "no lemond/flm processes"; }
          start main
          python3 "$GITHUB_WORKSPACE/harness/npu_e2e.py" "http://127.0.0.1:$PORT" "$PW" "$W/e2e-main.json" --phase main
          procs "with a model loaded"
          python3 "$GITHUB_WORKSPACE/harness/npu_e2e.py" "http://127.0.0.1:$PORT" "$PW" "$W/e2e-unload.json" --phase unload
          ls studio/frontend/dist | head -3
          python3 -m venv "$W/pw" && "$W/pw/bin/pip" install -q 'playwright>=1.45,<2' && "$W/pw/bin/python" -m playwright install chromium > "$W/pw-install.log" 2>&1
          "$W/pw/bin/python" "$GITHUB_WORKSPACE/harness/npu_ui.py" "http://127.0.0.1:$PORT" "$PW" "$W/ui" || tail -20 "$W/pw-install.log"
          mkdir -p "$GITHUB_WORKSPACE/ui-shots" && cp -r "$W/ui/." "$GITHUB_WORKSPACE/ui-shots/" || true
          python3 "$GITHUB_WORKSPACE/harness/npu_e2e.py" "http://127.0.0.1:$PORT" "$PW" "$W/e2e-shutdown.json" --phase shutdown
          for i in $(seq 1 60); do kill -0 "$(cat "$W/studio.pid")" 2>/dev/null || break; sleep 1; done
          sleep 3
          procs "after graceful shutdown"
          start restart
          python3 "$GITHUB_WORKSPACE/harness/npu_e2e.py" "http://127.0.0.1:$PORT" "$PW" "$W/e2e-restart.json" --phase after-restart
          procs "before SIGKILL"
          SPID=$(cat "$W/studio.pid")
          for p in $(pgrep -f "$W/studio/lemonade/11.9.0/lemond"); do echo "lemond $p parent: $(ps -o pid=,cmd= -p "$(ps -o ppid= -p "$p")" | cut -c1-120)"; done
          kill -KILL "$SPID"
          sleep 1
          if kill -0 "$SPID" 2>/dev/null; then echo "Studio $SPID survived SIGKILL"; else echo "Studio $SPID is gone"; fi
          # PR_SET_PDEATHSIG delivers SIGKILL to lemond; lemond's own flm child follows it.
          LEFT=1
          for i in $(seq 1 30); do
            sleep 1
            if ! pgrep -f "$W/studio/lemonade" >/dev/null; then echo "Studio's lemond and flm gone ${i}s after SIGKILL"; LEFT=0; break; fi
          done
          procs "after SIGKILL of Studio"
          pkill -KILL -f "$W/studio/lemonade" || true
          sleep 2
          # Which death signal lemond needs with a model loaded: SIGTERM (child_popen_kwargs' default) or SIGKILL.
          for SIG in TERM KILL; do
            python3 "$GITHUB_WORKSPACE/harness/pdeath_probe.py" "$W/studio/lemonade" "$SIG" > "$W/probe-$SIG.log" 2>&1 &
            OWNER=$!
            for i in $(seq 1 120); do grep -q '^READY' "$W/probe-$SIG.log" && break; sleep 1; done
            cat "$W/probe-$SIG.log"
            LPID=$(awk '/^READY/ {print $2}' "$W/probe-$SIG.log")
            procs "probe $SIG: before owner SIGKILL"
            kill -KILL "$OWNER"
            T0=$(date +%s)
            for i in $(seq 1 90); do
              if ! pgrep -f "$W/studio/lemonade" >/dev/null; then break; fi
              sleep 1
            done
            if pgrep -f "$W/studio/lemonade" >/dev/null; then echo "PROBE $SIG: lemond/flm still running $(( $(date +%s) - T0 ))s after owner SIGKILL"; procs "probe $SIG leftovers"; pkill -KILL -f "$W/studio/lemonade"; else echo "PROBE $SIG: lemond $LPID and flm gone $(( $(date +%s) - T0 ))s after owner SIGKILL"; fi
            sleep 2
          done
          echo "======== studio-main.log (NPU lines)"; grep -iE "npu|lemonade|fastflowlm|error|traceback" "$W/studio-main.log" | tail -120
          echo "======== studio-restart.log (tail)"; tail -80 "$W/studio-restart.log"
          python3 - "$W" <<'PY'
          import json, sys, pathlib
          w = pathlib.Path(sys.argv[1])
          bad = 0
          for name in ("e2e-main.json", "e2e-unload.json", "ui/ui-results.json", "e2e-shutdown.json", "e2e-restart.json"):
              p = w / name
              rows = json.loads(p.read_text()) if p.exists() else []
              fails = [r["name"] for r in rows if not r["ok"]]
              bad += len(fails) + (0 if rows else 1)
              print(f"{name}: {len(rows) - len(fails)}/{len(rows)} passed", fails)
          sys.exit(1 if bad else 0)
          PY
          RC=$?
          [ "$LEFT" = 0 ] || { echo "lemond or flm outlived a SIGKILLed Studio"; RC=1; }
          exit $RC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npu-ui-screenshots
          path: ui-shots
          if-no-files-found: ignore

  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Install Studio from the patched checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $W = Join-Path $env:RUNNER_TEMP "npu-e2e-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path "$W\tmp","$W\hf","$W\uv" | Out-Null
          "W=$W" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "HF_HOME=$W\hf" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UV_CACHE_DIR=$W\uv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UNSLOTH_STUDIO_HOME=$W\studio" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:HF_HOME = "$W\hf"; $env:UV_CACHE_DIR = "$W\uv"; $env:UNSLOTH_STUDIO_HOME = "$W\studio"
          git clone -q --no-checkout --filter=blob:none https://github.com/unslothai/unsloth.git "$W\src"
          Set-Location "$W\src"
          # In the clone's own config: a -c on clone alone does not reach the checkout below.
          git config core.autocrlf false
          git checkout -q $env:BASE_SHA
          # The branch's changed files, whole: a patch fights the runner's line-ending conversion.
          tar -xzf "$env:GITHUB_WORKSPACE\harness\npu-files.tar.gz"
          if ($LASTEXITCODE -ne 0) { throw "files did not extract" }
          git status --short | Select-Object -First 40
          $env:UNSLOTH_SKIP_AUTOSTART = '1'
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File .\install.ps1 --local --no-torch --no-rollback *> "$W\install.log"
          $rc = $LASTEXITCODE
          Get-Content "$W\install.log" -Tail 60
          if ($rc -ne 0) { throw "install.ps1 exited $rc" }
      - name: NPU end to end
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $W = $env:W
          Set-Location "$W\src"
          $PY = "$env:UNSLOTH_STUDIO_HOME\unsloth_studio\Scripts\python.exe"
          $PW = "npu-e2e-$env:GITHUB_RUN_ID-Pw1"
          function Start-Studio($tag) {
            $script:PORT = Get-Random -Minimum 18800 -Maximum 18899
            $argList = @('run.py','--host','127.0.0.1','--port',"$script:PORT",'--api-only')
            # --password sets the initial password only; a second start with it refuses to run.
            if ($tag -eq 'main') { $argList += @('--password', $PW) }
            $script:proc = Start-Process -FilePath $PY -ArgumentList $argList -WorkingDirectory "$W\src\studio\backend" -RedirectStandardOutput "$W\studio-$tag.out" -RedirectStandardError "$W\studio-$tag.err" -PassThru -WindowStyle Hidden
            $up = $false
            for ($i = 0; $i -lt 300; $i++) { try { Invoke-RestMethod "http://127.0.0.1:$script:PORT/api/health" | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
            if (-not $up) { Write-Host "Studio did not start"; Get-Content "$W\studio-$tag.out","$W\studio-$tag.err" -Tail 80 -ErrorAction SilentlyContinue }
            Write-Host "Studio pid $($script:proc.Id) port $script:PORT"
          }
          function Show-Procs($label) {
            Write-Host "== $label"
            $p = Get-Process | Where-Object { $_.ProcessName -match '^(lemond|flm)$' }
            if ($p) { $p | Format-Table Id, ProcessName, WorkingSet64 | Out-String | Write-Host } else { Write-Host "no lemond/flm processes" }
          }
          Start-Studio 'main'
          python "$env:GITHUB_WORKSPACE\harness\npu_e2e.py" "http://127.0.0.1:$PORT" $PW "$W\e2e-main.json" --phase main
          Show-Procs 'with a model loaded'
          python "$env:GITHUB_WORKSPACE\harness\npu_e2e.py" "http://127.0.0.1:$PORT" $PW "$W\e2e-shutdown.json" --phase shutdown
          $proc.WaitForExit(90000) | Out-Null
          Start-Sleep 5
          Show-Procs 'after graceful shutdown'
          Start-Studio 'restart'
          python "$env:GITHUB_WORKSPACE\harness\npu_e2e.py" "http://127.0.0.1:$PORT" $PW "$W\e2e-restart.json" --phase after-restart
          Show-Procs 'before a forced kill'
          Stop-Process -Id $proc.Id -Force
          Start-Sleep 8
          Show-Procs 'after Stop-Process -Force of Studio'
          Write-Host '======== studio-main (NPU lines)'
          Select-String -Path "$W\studio-main.out","$W\studio-main.err" -Pattern 'npu|lemonade|fastflowlm|error|traceback' | Select-Object -Last 120 | ForEach-Object { $_.Line }
          Get-Process | Where-Object { $_.ProcessName -match '^(lemond|flm)$' } | Stop-Process -Force -ErrorAction SilentlyContinue
          $bad = 0
          foreach ($name in 'e2e-main.json','e2e-shutdown.json','e2e-restart.json') {
            $p = "$W\$name"
            if (Test-Path $p) {
              $rows = Get-Content $p -Raw | ConvertFrom-Json
              $fails = @($rows | Where-Object { -not $_.ok } | ForEach-Object { $_.name })
              Write-Host "$name : $(@($rows).Count - $fails.Count)/$(@($rows).Count) passed $($fails -join '; ')"
              $bad += $fails.Count
            } else { Write-Host "$name missing"; $bad += 1 }
          }
          exit $bad
