name: AMD DevLab CI

on:
  push:
    branches: [amd-devlab-ci-health-faults]

permissions: {}

jobs:
  windows:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 30
    steps:
      - name: Hardware
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, BuildNumber
          Get-CimInstance Win32_Processor | Select-Object Name
          python --version
      - name: Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $work = Join-Path $env:RUNNER_TEMP "faults"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          python -m venv (Join-Path $work "venv")
          & (Join-Path $work "venv\Scripts\python.exe") -m pip install -q psutil
          Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/oobabooga/unsloth/$env:GITHUB_SHA/fault_probe.py" -OutFile (Join-Path $work "fault_probe.py")
          $zip = "https://github.com/ggml-org/llama.cpp/releases/download/b10988/llama-b10988-bin-win-cpu-x64.zip"
          Invoke-WebRequest -UseBasicParsing $zip -OutFile (Join-Path $work "llama.zip")
          Expand-Archive (Join-Path $work "llama.zip") -DestinationPath (Join-Path $work "llama") -Force
          Invoke-WebRequest -UseBasicParsing "https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf" -OutFile (Join-Path $work "Qwen3-0.6B-Q4_K_M.gguf")
      - name: mmap page-ins
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "faults"
          & (Join-Path $work "venv\Scripts\python.exe") (Join-Path $work "fault_probe.py") mmap (Join-Path $work "mmapwork")
      - name: idle HTTP server probed
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "faults"
          & (Join-Path $work "venv\Scripts\python.exe") (Join-Path $work "fault_probe.py") idle-http
      - name: idle llama-server probed
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "faults"
          $server = Get-ChildItem -Recurse -Filter llama-server.exe (Join-Path $work "llama") | Select-Object -First 1
          & (Join-Path $work "venv\Scripts\python.exe") (Join-Path $work "fault_probe.py") llama $server.FullName (Join-Path $work "Qwen3-0.6B-Q4_K_M.gguf") $work
          Get-Content (Join-Path $work "llama.log") -Tail 5
