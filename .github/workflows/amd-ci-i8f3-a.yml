name: "AMD CI: Studio vs the baseline, image priority families on gfx1151 (prio8)"

# Generated by diffusion_bench/amd/gen_prio8_img_workflow.py. Measurement only: no secret is referenced, every model
# is a public download (token=False); the baseline's files are built here from the official repos (amd/q5/build_q5.py).

on:
  push:
    branches: [amd-ci-i8f3-a]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: "https://github.com/unslothai/unsloth"
  BASE_SHA: "0d4793e18fe546638b6789a1cd18bbc09314bbc1"
  COMFY_SHA: "2c75dc1b379a59e0880619d029607af5169a62ef"
  GGUF_SHA: "6ea2651e7df66d7585f6ffee804b20e92fb38b8a"

jobs:

  f3i8a:
    name: "f3i8a: f3 (gfx1151, exclusive GPU, prio8)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 530
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "prio8-f3i8a"

      - name: Hardware gate (pre-venv)
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require rocm gpu --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host_pre.json" || echo "note: re-gated after install"

      - name: Disk, memory, cores
        run: |
          set +e
          df -h "$RUNNER_TEMP"; free -g; nproc; uname -a
          exit 0

      - name: States (base = main; head = main + patch)
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "$UPSTREAM" "$AMD_CI_WORK/repo"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/base" "$BASE_SHA"
          git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/head" "$BASE_SHA"
          for bp in ; do
            git -C "$AMD_CI_WORK/states/base" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/$bp"
            git -C "$AMD_CI_WORK/states/head" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/$bp"
          done
          for hp in nov5_marker.patch; do
            git -C "$AMD_CI_WORK/states/head" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/$hp"
          done
          if [ -n "" ]; then
            git -C "$AMD_CI_WORK/repo" worktree add -q --detach "$AMD_CI_WORK/states/head2" "$BASE_SHA"
            for bp in  ; do
              git -C "$AMD_CI_WORK/states/head2" apply --index "$GITHUB_WORKSPACE/amd_ci/patches/$bp"
            done
            git -C "$AMD_CI_WORK/states/head2" diff --cached --stat | tail -2
          fi
          git -C "$AMD_CI_WORK/states/base" diff --cached --stat | tail -2
          git -C "$AMD_CI_WORK/states/head" diff --cached --stat | tail -3
          git -C "$AMD_CI_WORK/states/base" log -1 --format='base %H %s'

      - name: Studio install (install.sh --local from the base tree) and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/states/base"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu --expect-arch gfx1151 --min-gpus 1 \
            --out "$AMD_CI_WORK/out/host.json"
          "$V/bin/python" -m pip --version > /dev/null 2>&1 || "$V/bin/python" -m ensurepip -q
          "$V/bin/python" -m pip install -q --no-deps lpips > "$AMD_CI_WORK/out/lpips_install.log" 2>&1 || true
          "$V/bin/python" -m pip install -q scikit-image psutil >> "$AMD_CI_WORK/out/lpips_install.log" 2>&1 || true
          "$V/bin/python" -c "import torch, diffusers, transformers; print('studio torch', torch.__version__, 'hip', torch.version.hip, 'diffusers', diffusers.__version__, 'transformers', transformers.__version__)"
          "$V/bin/python" -m pip freeze > "$AMD_CI_WORK/out/studio_freeze.txt" 2>/dev/null || true

      - name: Baseline v0.44.0 (GitHub) on Studio's torch (+ README ROCm torch venv), GGUF loader node, profiler node
        timeout-minutes: 60
        run: |
          set +e
          git clone -q https://github.com/Comfy-Org/ComfyUI "$AMD_CI_WORK/ComfyUI"
          git -C "$AMD_CI_WORK/ComfyUI" checkout -q "$COMFY_SHA"
          git -C "$AMD_CI_WORK/ComfyUI" log -1 --format='baseline %H %s'
          git clone -q https://github.com/city96/ComfyUI-GGUF "$AMD_CI_WORK/ComfyUI/custom_nodes/ComfyUI-GGUF"
          git -C "$AMD_CI_WORK/ComfyUI/custom_nodes/ComfyUI-GGUF" checkout -q "$GGUF_SHA"
          cp "$GITHUB_WORKSPACE/diffusion_bench/amd/prof_comfy_node.py" "$AMD_CI_WORK/ComfyUI/custom_nodes/prof_node.py"
          BASEPY=$("$AMD_CI_PY" -c "import sys; print(sys._base_executable)")
          TV=$("$AMD_CI_PY" -c "import torch; print(torch.__version__)")
          VV=$("$AMD_CI_PY" -c "import torchvision; print(torchvision.__version__)")
          for arm in rock; do
            "$BASEPY" -m venv "$AMD_CI_WORK/comfy_venv_$arm"
            P="$AMD_CI_WORK/comfy_venv_$arm/bin/python"
            "$P" -m pip install -q --upgrade pip > /dev/null 2>&1
            if [ "$arm" = default ]; then
              PIP_CONFIG_FILE=/dev/null "$P" -m pip install "torch==2.14.1+rocm7.2" "torchvision==0.29.1+rocm7.2" --index-url https://download.pytorch.org/whl/rocm7.2 > "$AMD_CI_WORK/out/comfy_${arm}_torch.log" 2>&1
            else
              "$P" -m pip install --index-url https://repo.amd.com/rocm/whl/gfx1151/ "torch==$TV" "torchvision==$VV" > "$AMD_CI_WORK/out/comfy_${arm}_torch.log" 2>&1
            fi
            echo "baseline $arm torch rc=$?"
            "$P" -m pip install -r "$AMD_CI_WORK/ComfyUI/requirements.txt" "gguf>=0.13.0" sentencepiece protobuf psutil > "$AMD_CI_WORK/out/comfy_${arm}_reqs.log" 2>&1
            echo "baseline $arm requirements rc=$?"
            "$P" -c "import torch, comfy_kitchen; print('baseline $arm torch', torch.__version__, 'hip', torch.version.hip, 'gpu', torch.cuda.is_available(), 'kitchen', getattr(comfy_kitchen, '__version__', '?'))"
            (cd "$AMD_CI_WORK/ComfyUI" && timeout 600 "$P" main.py --quick-test-for-ci --disable-api-nodes > "$AMD_CI_WORK/out/comfy_${arm}_quicktest.log" 2>&1; echo "baseline $arm quick test rc=$?")
            grep -E "Device:|pytorch version|comfy-kitchen|Using .* attention|Set vram state|prof_hook|GGUF" "$AMD_CI_WORK/out/comfy_${arm}_quicktest.log" | head -10
          done
          exit 0

      - name: Baseline files from the official repos (build_q5) + Studio prefetch of the same repos
        timeout-minutes: 240
        run: |
          set +e
          export HF_HOME="$AMD_CI_WORK/hf_home" HF_HUB_DISABLE_TELEMETRY=1 HF_HUB_ENABLE_HF_TRANSFER=0
          export COMFY_DIR="$AMD_CI_WORK/ComfyUI"
          unset HF_TOKEN HF_TOKEN_ORG
          mkdir -p "$AMD_CI_WORK/cm" "$AMD_CI_WORK/cm_tmp"
          CPY="$AMD_CI_WORK/comfy_venv_rock/bin/python"
          for gr in f3~dit_int8,te_bf16,vae; do
            g="${gr%%~*}"; roles=""
            case "$gr" in *"~"*) roles="${gr#*~}" ;; esac
            echo "=== build_q5 $g $roles ($(date -u +%H:%M:%S))"
            "$CPY" -u "$GITHUB_WORKSPACE/diffusion_bench/amd/q5/build_q5.py" --group "$g" --roles "$roles" \
              --out "$AMD_CI_WORK/cm" --tmp "$AMD_CI_WORK/cm_tmp" --refs "$GITHUB_WORKSPACE/diffusion_bench/amd/q5/ref_headers" \
              --tool "$GITHUB_WORKSPACE/diffusion_bench/amd/q5/quant_int8_convrot.py" > "$AMD_CI_WORK/out/build_$g.log" 2>&1
            echo "build_q5 $g rc=$?"
            grep -E "BUILT|EXISTS|QUANTIZED|SHA|TOOL_FAILED|Error|error|BUILD_Q5_DONE" "$AMD_CI_WORK/out/build_$g.log" | tail -25
          done
          ls -la "$AMD_CI_WORK/cm"
          # Studio: one tiny load + render per distinct Studio arm with downloads allowed, so timed loads read the cache
          export DIFFUSION_BENCH_STUDIO_SRC="$AMD_CI_WORK/states/base"
          [ -f "$AMD_CI_WORK/out/SKIP_CELLS" ] && { echo "kernel step failed: no prefetch"; exit 0; }
          for t in f3_s_bf16 f3_s_int8ad f3_s_int8d f3_s_int8d_i8a f3_s_int8dc; do
            echo "=== prefetch $t ($(date -u +%H:%M:%S))"
            timeout 2400 "$AMD_CI_PY" -u "$GITHUB_WORKSPACE/diffusion_bench/run_cell.py" --spec "$GITHUB_WORKSPACE/diffusion_bench/specs/prio8_img.json" \
              --tag "$t" --set n=1 --set warmup=0 --set short_n=0 --set width=256 --set height=256 --set steps=1 \
              --out "$AMD_CI_WORK/prefetch" > "$AMD_CI_WORK/out/prefetch_$t.log" 2>&1
            echo "prefetch $t rc=$?"; grep -E "loaded in|BROKEN|ok:" "$AMD_CI_WORK/out/prefetch_$t.log" | tail -3 | cut -c1-600
          done
          du -sh "$HF_HOME" "$AMD_CI_WORK/cm"; df -h "$RUNNER_TEMP"; free -g
          exit 0

      - name: Clean GPU pool preflight
        timeout-minutes: 35
        run: |
          set -euo pipefail
          "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/preflight_free.py" --min-free-gib 50 \
            --timeout-s 1800 --out "$AMD_CI_WORK/out/preflight.json"

      - name: "Cells (f3i8a: f3)"
        timeout-minutes: 270
        run: |
          set +e
          export HF_HOME="$AMD_CI_WORK/hf_home" TORCH_HOME="$AMD_CI_WORK/torch_home" HF_HUB_DISABLE_TELEMETRY=1
          unset HF_TOKEN HF_TOKEN_ORG
          export PROF_HOOK_DIR="$GITHUB_WORKSPACE/diffusion_bench/amd"
          RUNS="$AMD_CI_WORK/runs"; mkdir -p "$RUNS" "$AMD_CI_WORK/out/prof"
          DEADLINE=$(( $(date +%s) + 12000 ))
          for spec_arm in f3_s_bf16 f3_s_int8d f3_c_int8d f3_s_int8dc f3_s_int8ad f3_s_int8d_i8a f3_s_bf16_r f3_s_int8d_r f3_c_int8d_r; do
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then echo "budget spent: skipping $spec_arm"; continue; fi
            arm="${spec_arm%@*}"; state=base; name="$arm"; tree=base
            case "$spec_arm" in *@head) state=head; tree=head; name="${arm}@head" ;; *@head2) state=head2; tree=head2; name="${arm}@head2" ;; *@base2) state=base2; name="${arm}@base2" ;; esac
            if [ -f "$AMD_CI_WORK/out/SKIP_CELLS" ]; then echo "kernel step failed: skipping $name"; continue; fi
            export DIFFUSION_BENCH_STUDIO_SRC="$AMD_CI_WORK/states/$tree"
            export PROF_OUT="$AMD_CI_WORK/out/prof/$name" PROF_TAG="$name" PROF_RENDER=prof PROF_STEP=5
            echo "=== $name ($(date -u +%H:%M:%S))"
            cd "$AMD_CI_WORK"
            timeout 3600 "$AMD_CI_PY" -u "$GITHUB_WORKSPACE/diffusion_bench/amd/prof_cell.py" \
              --spec "$GITHUB_WORKSPACE/diffusion_bench/specs/prio8_img.json" --tag "$arm"  \
              --out "$RUNS/$state" > "$AMD_CI_WORK/out/cell_$name.log" 2>&1
            echo "$name rc=$?"
            grep -E "loaded in|prof_hook|ok:|BROKEN" "$AMD_CI_WORK/out/cell_$name.log" | tail -6 | cut -c1-500
            gzip -f "$PROF_OUT"/*.trace.json 2>/dev/null
          done
          for st in base head head2 base2; do
            [ -d "$RUNS/$st" ] && "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/score.py" "$RUNS/$st" > "$AMD_CI_WORK/out/score_$st.log" 2>&1
          done
          "$AMD_CI_PY" "$GITHUB_WORKSPACE/diffusion_bench/amd/prio8_report.py" --runs "$RUNS" --prof "$AMD_CI_WORK/out/prof" \
            --spec "$GITHUB_WORKSPACE/diffusion_bench/specs/prio8_img.json" --out "$AMD_CI_WORK/out/REPORT.md" > "$AMD_CI_WORK/out/report.log" 2>&1
          cat "$AMD_CI_WORK/out/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Stop anything this job started
        if: always()
        run: |
          set +e
          for d in /proc/[0-9]*; do
            pid=${d#/proc/}
            [ "$pid" = "$$" ] && continue
            cwd=$(readlink "$d/cwd" 2>/dev/null)
            case "$cwd" in
              "$AMD_CI_WORK"*) echo "stopping pid $pid (cwd $cwd)"; kill "$pid" 2>/dev/null ;;
            esac
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prio8-f3i8a
          path: |
            ${{ env.AMD_CI_WORK }}/out
            ${{ env.AMD_CI_WORK }}/cm/manifest*.json
            ${{ env.AMD_CI_WORK }}/runs/**/record.json
            ${{ env.AMD_CI_WORK }}/runs/**/*.png
            ${{ env.AMD_CI_WORK }}/runs/**/*.log
            ${{ env.AMD_CI_WORK }}/runs/*/scores.*
            ${{ env.AMD_CI_WORK }}/prefetch/**/record.json
          retention-days: 14
          if-no-files-found: warn
