name: "AMD CI: placement calibration on gfx1151 (windows-rocm, windows-vulkan)"

# Generated by scripts/placement/bench/amd_calib_ci.py. Absolute calibration readings (no base/head): each leg
# runs placement/run_bench.py on the unslothai/llama.cpp prebuilt b12757-mix-ef2df21 (rocm-gfx1151/vulkan)
# with placement/points.json, legs chained one after another, each holding the shared GPU group. The gate step
# FAILS a leg that measured nothing on the expected backend. Artifacts: calib-<leg> (jsonl, server logs, host record).

on:
  push:
    branches: [amd-ci-placement-calib-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  CALIB_TAG: "b12757-mix-ef2df21"

jobs:

  windows-rocm:
    name: "placement calib windows-rocm (exclusive GPU)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 200
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "calib-windows-rocm"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host record
        run: |
          $ErrorActionPreference = "Continue"
          $h = Join-Path $env:AMD_CI_WORK "out\host_windows-rocm.txt"
          $lines = @()
          $lines += "machine: $env:COMPUTERNAME"
          $lines += (Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version,TotalVisibleMemorySize,FreePhysicalMemory | Out-String)
          $lines += (Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Out-String)
          $lines += (Get-CimInstance Win32_PhysicalMemory | Format-Table Capacity,Speed,ConfiguredClockSpeed,Manufacturer -AutoSize | Out-String)
          $lines += (Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion,AdapterRAM,VideoProcessor | Out-String)
          $lines += (Get-PhysicalDisk | Format-Table FriendlyName,MediaType,BusType,Size -AutoSize | Out-String)
          $lines += (Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize | Out-String)
          $lines += "vulkan-1.dll: $(Test-Path C:\Windows\System32\vulkan-1.dll)"
          $am = Get-Command amd-smi.exe -ErrorAction SilentlyContinue
          if ($am) { $lines += (& amd-smi.exe static 2>&1 | Out-String) }
          [System.IO.File]::WriteAllText($h, ($lines -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          Get-Content -LiteralPath $h -Encoding UTF8 | Select-Object -First 120
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\gate_windows-rocm.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Calibration run (rocm-gfx1151)
        timeout-minutes: 185
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          $py = Join-Path $env:AMD_CI_WORK "venv\Scripts\python.exe"
          if (Test-Path -LiteralPath $py) { & $py -m pip install -q huggingface_hub hf_xet }
          if (-not (Test-Path -LiteralPath $py)) { $py = $env:AMD_CI_PY }
          $env:HF_HOME = Join-Path $env:AMD_CI_WORK "hf"
          $env:HF_DOWNLOAD_MAX_GB = "200"
          $env:HF_XET_CHUNK_CACHE_SIZE_BYTES = "0"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $out = Join-Path $env:AMD_CI_WORK "out"
          $log = Join-Path $out "run_windows-rocm.log"
          $err = Join-Path $out "run_windows-rocm.err.log"
          $argv = @("-u", "`"$env:GITHUB_WORKSPACE\placement\run_bench.py`"",
                    "--points", "`"$env:GITHUB_WORKSPACE\placement\points.json`"",
                    "--out", "`"$out\calib_windows-rocm.jsonl`"",
                    "--models-dir", "`"$env:AMD_CI_WORK\m`"", "--tag", $env:CALIB_TAG, "--variant", "rocm-gfx1151",
                    "--rounds", "3", "--timeout", "300", "--fill-frac", "0.95", "--sample-period", "0.5",
                    "--own-existing", "--merge-models", "--budget-min", "170")
          $p = Start-Process -FilePath $py -ArgumentList $argv -NoNewWindow -Wait -PassThru `
                 -WorkingDirectory $env:AMD_CI_WORK -RedirectStandardOutput $log -RedirectStandardError $err
          Write-Host "run_bench rc=$($p.ExitCode)"
          Get-Content -LiteralPath $log -Encoding UTF8 -Tail 250
          Get-Content -LiteralPath $err -Encoding UTF8 -Tail 60

      - name: Gate (fails when nothing was measured on ROCm)
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\placement\calib_gate.py" `
            "$env:AMD_CI_WORK\out\calib_windows-rocm.jsonl" ROCm "$env:GITHUB_STEP_SUMMARY"
          exit $LASTEXITCODE

      - name: Cleanup
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          foreach ($d in @("m", "hf", "llama_bin")) {
            $p = Join-Path $env:AMD_CI_WORK $d
            if ($env:AMD_CI_WORK -and (Test-Path -LiteralPath $p)) { Remove-Item -LiteralPath $p -Recurse -Force }
          }
          Get-Process llama-server, llama-bench -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calib-windows-rocm
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 14
          if-no-files-found: warn

  windows-vulkan:
    name: "placement calib windows-vulkan (exclusive GPU)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 200
    needs: [windows-rocm]
    if: ${{ !cancelled() }}
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "calib-windows-vulkan"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host record
        run: |
          $ErrorActionPreference = "Continue"
          $h = Join-Path $env:AMD_CI_WORK "out\host_windows-vulkan.txt"
          $lines = @()
          $lines += "machine: $env:COMPUTERNAME"
          $lines += (Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version,TotalVisibleMemorySize,FreePhysicalMemory | Out-String)
          $lines += (Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Out-String)
          $lines += (Get-CimInstance Win32_PhysicalMemory | Format-Table Capacity,Speed,ConfiguredClockSpeed,Manufacturer -AutoSize | Out-String)
          $lines += (Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion,AdapterRAM,VideoProcessor | Out-String)
          $lines += (Get-PhysicalDisk | Format-Table FriendlyName,MediaType,BusType,Size -AutoSize | Out-String)
          $lines += (Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize | Out-String)
          $lines += "vulkan-1.dll: $(Test-Path C:\Windows\System32\vulkan-1.dll)"
          $am = Get-Command amd-smi.exe -ErrorAction SilentlyContinue
          if ($am) { $lines += (& amd-smi.exe static 2>&1 | Out-String) }
          [System.IO.File]::WriteAllText($h, ($lines -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          Get-Content -LiteralPath $h -Encoding UTF8 | Select-Object -First 120
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\gate_windows-vulkan.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Calibration run (vulkan)
        timeout-minutes: 185
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          $py = Join-Path $env:AMD_CI_WORK "venv\Scripts\python.exe"
          if (Test-Path -LiteralPath $py) { & $py -m pip install -q huggingface_hub hf_xet }
          if (-not (Test-Path -LiteralPath $py)) { $py = $env:AMD_CI_PY }
          $env:HF_HOME = Join-Path $env:AMD_CI_WORK "hf"
          $env:HF_DOWNLOAD_MAX_GB = "200"
          $env:HF_XET_CHUNK_CACHE_SIZE_BYTES = "0"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $out = Join-Path $env:AMD_CI_WORK "out"
          $log = Join-Path $out "run_windows-vulkan.log"
          $err = Join-Path $out "run_windows-vulkan.err.log"
          $argv = @("-u", "`"$env:GITHUB_WORKSPACE\placement\run_bench.py`"",
                    "--points", "`"$env:GITHUB_WORKSPACE\placement\points.json`"",
                    "--out", "`"$out\calib_windows-vulkan.jsonl`"",
                    "--models-dir", "`"$env:AMD_CI_WORK\m`"", "--tag", $env:CALIB_TAG, "--variant", "vulkan",
                    "--rounds", "3", "--timeout", "300", "--fill-frac", "0.95", "--sample-period", "0.5",
                    "--own-existing", "--merge-models", "--budget-min", "170")
          $p = Start-Process -FilePath $py -ArgumentList $argv -NoNewWindow -Wait -PassThru `
                 -WorkingDirectory $env:AMD_CI_WORK -RedirectStandardOutput $log -RedirectStandardError $err
          Write-Host "run_bench rc=$($p.ExitCode)"
          Get-Content -LiteralPath $log -Encoding UTF8 -Tail 250
          Get-Content -LiteralPath $err -Encoding UTF8 -Tail 60

      - name: Gate (fails when nothing was measured on Vulkan)
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\placement\calib_gate.py" `
            "$env:AMD_CI_WORK\out\calib_windows-vulkan.jsonl" Vulkan "$env:GITHUB_STEP_SUMMARY"
          exit $LASTEXITCODE

      - name: Cleanup
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          foreach ($d in @("m", "hf", "llama_bin")) {
            $p = Join-Path $env:AMD_CI_WORK $d
            if ($env:AMD_CI_WORK -and (Test-Path -LiteralPath $p)) { Remove-Item -LiteralPath $p -Recurse -Force }
          }
          Get-Process llama-server, llama-bench -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calib-windows-vulkan
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 14
          if-no-files-found: warn
