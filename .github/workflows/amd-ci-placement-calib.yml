name: "AMD CI: placement calibration on gfx1151 (linux-rocm, linux-vulkan)"

# Generated by scripts/placement/bench/amd_calib_ci.py. Absolute calibration readings (no base/head): each leg
# runs placement/run_bench.py on the unslothai/llama.cpp prebuilt b12757-mix-ef2df21 (rocm-gfx1151/vulkan)
# with placement/points.json, legs chained one after another, each holding the shared GPU group. The gate step
# FAILS a leg that measured nothing on the expected backend. Artifacts: calib-<leg> (jsonl, server logs, host record).

on:
  push:
    branches: [amd-ci-placement-calib]
  workflow_dispatch:

permissions:
  contents: read

env:
  CALIB_TAG: "b12757-mix-ef2df21"

jobs:

  linux-rocm:
    name: "placement calib linux-rocm (exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 200
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "calib-linux-rocm"

      - name: Host record
        run: |
          set +e
          H="$AMD_CI_WORK/out/host_linux-rocm.txt"
          {
            uname -a
            nproc
            lscpu
            free -b
            df -B1 "$AMD_CI_WORK"
            cat /proc/meminfo
            ls -l /dev/kfd /dev/dri
            for f in /sys/class/drm/card*/device/mem_info_vram_total /sys/class/drm/card*/device/mem_info_vram_used \
                     /sys/class/drm/card*/device/mem_info_gtt_total /sys/class/drm/card*/device/mem_info_gtt_used; do
              [ -r "$f" ] && echo "$f $(cat "$f")"
            done
            cat /sys/module/amdgpu/parameters/gttsize 2>/dev/null
            cat /sys/module/ttm/parameters/pages_limit 2>/dev/null
            ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null
            command -v vulkaninfo && vulkaninfo --summary 2>&1 | head -40
            command -v rocminfo && rocminfo 2>&1 | grep -m4 -E "Marketing Name|Name: +gfx"
            command -v amd-smi && amd-smi static 2>&1 | head -60
            command -v python3 && python3 --version
          } > "$H" 2>&1
          head -c 6000 "$H"
          python3 amd_ci/lib/gate.py --no-torch --out "$AMD_CI_WORK/out/gate_linux-rocm.json"

      - name: Calibration run (rocm-gfx1151)
        timeout-minutes: 185
        run: |
          set +e
          cd "$AMD_CI_WORK"
          python3 -m venv venv
          venv/bin/python -m pip install -q huggingface_hub hf_xet
          PY="$AMD_CI_WORK/venv/bin/python"
          if ! "$PY" -c "import huggingface_hub" > /dev/null 2>&1; then
            echo "huggingface_hub unavailable: run_bench falls back to urllib downloads"
            PY=python3
          fi
          export HF_HOME="$AMD_CI_WORK/hf" HF_DOWNLOAD_MAX_GB=200 HF_XET_CHUNK_CACHE_SIZE_BYTES=0
          "$PY" -u "$GITHUB_WORKSPACE/placement/run_bench.py" \
            --points "$GITHUB_WORKSPACE/placement/points.json" \
            --out "$AMD_CI_WORK/out/calib_linux-rocm.jsonl" \
            --models-dir "$AMD_CI_WORK/m" --tag "$CALIB_TAG" --variant rocm-gfx1151 \
            --rounds 3 --timeout 300 --fill-frac 0.95 --sample-period 0.5 \
            --own-existing --merge-models --budget-min 170 > "$AMD_CI_WORK/out/run_linux-rocm.log" 2>&1
          rc=$?
          echo "run_bench rc=$rc"
          tail -n 250 "$AMD_CI_WORK/out/run_linux-rocm.log"

      - name: Gate (fails when nothing was measured on ROCm)
        run: |
          set +e
          python3 "$GITHUB_WORKSPACE/placement/calib_gate.py" "$AMD_CI_WORK/out/calib_linux-rocm.jsonl" ROCm "$GITHUB_STEP_SUMMARY"
          rc=$?
          exit "$rc"

      - name: Cleanup
        if: always()
        run: |
          rm -rf "${AMD_CI_WORK:?}/m" "${AMD_CI_WORK:?}/hf" "${AMD_CI_WORK:?}/llama_bin"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calib-linux-rocm
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 14
          if-no-files-found: warn

  linux-vulkan:
    name: "placement calib linux-vulkan (exclusive GPU)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 200
    needs: [linux-rocm]
    if: ${{ !cancelled() }}
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "calib-linux-vulkan"

      - name: Host record
        run: |
          set +e
          H="$AMD_CI_WORK/out/host_linux-vulkan.txt"
          {
            uname -a
            nproc
            lscpu
            free -b
            df -B1 "$AMD_CI_WORK"
            cat /proc/meminfo
            ls -l /dev/kfd /dev/dri
            for f in /sys/class/drm/card*/device/mem_info_vram_total /sys/class/drm/card*/device/mem_info_vram_used \
                     /sys/class/drm/card*/device/mem_info_gtt_total /sys/class/drm/card*/device/mem_info_gtt_used; do
              [ -r "$f" ] && echo "$f $(cat "$f")"
            done
            cat /sys/module/amdgpu/parameters/gttsize 2>/dev/null
            cat /sys/module/ttm/parameters/pages_limit 2>/dev/null
            ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null
            command -v vulkaninfo && vulkaninfo --summary 2>&1 | head -40
            command -v rocminfo && rocminfo 2>&1 | grep -m4 -E "Marketing Name|Name: +gfx"
            command -v amd-smi && amd-smi static 2>&1 | head -60
            command -v python3 && python3 --version
          } > "$H" 2>&1
          head -c 6000 "$H"
          python3 amd_ci/lib/gate.py --no-torch --out "$AMD_CI_WORK/out/gate_linux-vulkan.json"

      - name: Calibration run (vulkan)
        timeout-minutes: 185
        run: |
          set +e
          cd "$AMD_CI_WORK"
          python3 -m venv venv
          venv/bin/python -m pip install -q huggingface_hub hf_xet
          PY="$AMD_CI_WORK/venv/bin/python"
          if ! "$PY" -c "import huggingface_hub" > /dev/null 2>&1; then
            echo "huggingface_hub unavailable: run_bench falls back to urllib downloads"
            PY=python3
          fi
          export HF_HOME="$AMD_CI_WORK/hf" HF_DOWNLOAD_MAX_GB=200 HF_XET_CHUNK_CACHE_SIZE_BYTES=0
          "$PY" -u "$GITHUB_WORKSPACE/placement/run_bench.py" \
            --points "$GITHUB_WORKSPACE/placement/points.json" \
            --out "$AMD_CI_WORK/out/calib_linux-vulkan.jsonl" \
            --models-dir "$AMD_CI_WORK/m" --tag "$CALIB_TAG" --variant vulkan \
            --rounds 3 --timeout 300 --fill-frac 0.95 --sample-period 0.5 \
            --own-existing --merge-models --budget-min 170 > "$AMD_CI_WORK/out/run_linux-vulkan.log" 2>&1
          rc=$?
          echo "run_bench rc=$rc"
          tail -n 250 "$AMD_CI_WORK/out/run_linux-vulkan.log"

      - name: Gate (fails when nothing was measured on Vulkan)
        run: |
          set +e
          python3 "$GITHUB_WORKSPACE/placement/calib_gate.py" "$AMD_CI_WORK/out/calib_linux-vulkan.jsonl" Vulkan "$GITHUB_STEP_SUMMARY"
          rc=$?
          exit "$rc"

      - name: Cleanup
        if: always()
        run: |
          rm -rf "${AMD_CI_WORK:?}/m" "${AMD_CI_WORK:?}/hf" "${AMD_CI_WORK:?}/llama_bin"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calib-linux-vulkan
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 14
          if-no-files-found: warn
