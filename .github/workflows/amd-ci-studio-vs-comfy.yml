          FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE "$P" -m pip install --no-build-isolation --no-deps . > "$AMD_CI_WORK/out/fa_comfy_build.log" 2>&1
          echo "flash-attn into ComfyUI venv: rc=$?"
