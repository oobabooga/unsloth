name: AMD Vulkan ICD A/B

on:
  push:
    branches: [amd-vulkan-icd-ab]

permissions: {}

jobs:
  ab:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            ref: main
          - name: fixed
            ref: vulkan-icd-device-registry
    steps:
      - name: Hardware and Vulkan registrations
        shell: powershell
        run: |
          # reg.exe writes "key not found" to stderr, which PowerShell turns into a
          # terminating error record; an absent key is the finding here, not a failure.
          $ErrorActionPreference = "Continue"
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
          "--- Khronos legacy key ---"
          cmd /c 'reg query "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" 2>&1'
          "--- Display adapter class ---"
          cmd /c 'reg query "HKLM\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}" /s /v VulkanDriverName 2>&1'
          "--- SoftwareComponent class ---"
          cmd /c 'reg query "HKLM\SYSTEM\CurrentControlSet\Control\Class\{5c4c3332-344d-483c-8739-259e934c9cc8}" /s /v VulkanDriverName 2>&1'
          exit 0

      - name: Clone ${{ matrix.ref }}
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP "src"
          git clone --filter=blob:none --branch ${{ matrix.ref }} --depth 1 `
            https://github.com/oobabooga/unsloth $src
          git -C $src rev-parse HEAD

      - name: ICD discovery (${{ matrix.name }})
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP "src"
          $probe = Join-Path $env:RUNNER_TEMP "probe.py"
          @'
          import json, os, sys
          sys.path.insert(0, os.path.join(sys.argv[1], "studio"))
          import install_llama_prebuilt as ilp
          host = ilp.detect_host()
          out = {
              "manifest_paths": ilp._amd_vulkan_icd_manifest_paths(),
              "icd_present": ilp._amd_vulkan_icd_present(),
              "host_has_rocm": host.has_rocm,
              "host_gfx": host.rocm_gfx_target,
              "host_gfx_targets": list(host.rocm_gfx_targets or []),
          }
          # The reported shape: an existing install whose recorded arch is replayed, which
          # is what makes the integrated-GPU preference reachable on a host with no HIP SDK.
          os.environ["UNSLOTH_ROCM_GFX_REMEMBERED"] = "gfx1151"
          remembered = ilp.detect_host()
          remembered = ilp._apply_host_overrides(
              remembered, override_has_rocm = False, override_rocm_gfx = None, force_cpu = False
          )
          out["remembered_gfx"] = ilp._active_rocm_gfx_target(remembered)
          out["prefers_vulkan"] = ilp._should_prefer_vulkan_for_amd_igpu(remembered)
          with open(sys.argv[2], "w", encoding = "utf-8") as handle:
              json.dump(out, handle, indent = 2)
          '@ | Set-Content -Encoding UTF8 $probe
          python $probe $src (Join-Path $env:RUNNER_TEMP "icd.json")
          Get-Content (Join-Path $env:RUNNER_TEMP "icd.json")

      - name: Backend resolution (${{ matrix.name }})
        shell: powershell
        env:
          UNSLOTH_ROCM_GFX_REMEMBERED: gfx1151
        run: |
          # The resolver logs its routing decision to stderr; PowerShell would turn that
          # into a terminating error, so redirect inside cmd and read the file back.
          $ErrorActionPreference = "Continue"
          $src = Join-Path $env:RUNNER_TEMP "src"
          $raw = Join-Path $env:RUNNER_TEMP "resolve.txt"
          $script = Join-Path $src "studio\install_llama_prebuilt.py"
          cmd /c "python `"$script`" --resolve-backends latest --output-format json > `"$raw`" 2>&1"
          Get-Content $raw
          $pick = Join-Path $env:RUNNER_TEMP "pick.py"
          @'
          import json, sys
          payload = None
          for line in open(sys.argv[1], encoding = "utf-8", errors = "replace"):
              line = line.strip()
              if line.startswith("{"):
                  try:
                      payload = json.loads(line)
                  except Exception:
                      pass
          if payload is None:
              raise SystemExit("no JSON payload in resolver output")
          auto = next(e for e in payload["backends"] if e["backend"] == "auto")
          print(json.dumps(auto, indent = 2))
          '@ | Set-Content -Encoding UTF8 $pick
          python $pick $raw

      - name: Upload artifacts (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-icd-ab-${{ matrix.name }}
          path: ${{ runner.temp }}/*.json
          if-no-files-found: warn
