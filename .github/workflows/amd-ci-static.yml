name: "AMD CI: static step skip on Qwen-Image-2.1 (PR 11737, Linux)"

# PR 11737 adds transformer_cache=static: a fixed schedule that skips whole transformer calls.
# Studio runs eager on ROCm, so skipped calls are a direct wall-clock saving there. Three arms, one
# process each: head uncached (reference), head with static, base (main) with static, which main
# does not have (else the run is VOID). No HF token is used anywhere.

on:
  push:
    branches: [amd-ci-static]
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC_REPO: "https://github.com/unslothai/unsloth"
  HEAD_BRANCH: "studio-static-step-skip"
  BASE_BRANCH: "main"

jobs:

  gpu:
    name: "static skip on gfx1151 Linux (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 330
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "static-gpu"

      - name: Checkout head and base
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b "$HEAD_BRANCH" "$SRC_REPO" "$AMD_CI_WORK/src/head"
          git clone -q --depth 1 -b "$BASE_BRANCH" "$SRC_REPO" "$AMD_CI_WORK/src/base"
          git -C "$AMD_CI_WORK/src/head" log -1 --format='head %h %s'
          git -C "$AMD_CI_WORK/src/base" log -1 --format='base %h %s'

      - name: Environment and real gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$AMD_CI_WORK/src/head"
          export UNSLOTH_STUDIO_HOME="$AMD_CI_WORK/studio"
          echo "UNSLOTH_STUDIO_HOME=$UNSLOTH_STUDIO_HOME" >> "$GITHUB_ENV"
          export UV_EXTRA_INDEX_URL="https://pypi.org/simple"
          set +e
          bash install.sh --local 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          V=""
          for c in "$UNSLOTH_STUDIO_HOME"/unsloth_studio "$UNSLOTH_STUDIO_HOME"/.venv_t5_*; do
            [ -x "$c/bin/python" ] && { V="$c"; break; }
          done
          [ -n "$V" ] || { echo "FATAL: no Studio venv"; exit 1; }
          echo "AMD_CI_PY=$V/bin/python" >> "$GITHUB_ENV"
          "$V/bin/python" "$GITHUB_WORKSPACE/amd_ci/lib/gate.py" --require rocm gpu \
            --expect-arch gfx1151 --min-gpus 1 --out "$AMD_CI_WORK/out/host.json"

      - name: Scoring dependency
        run: |
          set +e
          "$AMD_CI_PY" -m pip --version > /dev/null 2>&1 || "$AMD_CI_PY" -m ensurepip -q
          "$AMD_CI_PY" -m pip install -q --no-deps lpips 2>&1 | tail -2
          "$AMD_CI_PY" -c "import torch, lpips; print('lpips ok, torch', torch.__version__)"
          exit 0

      - name: End to end, eager (Studio's ROCm default)
        timeout-minutes: 240
        run: |
          set +e
          export TORCH_HOME="$AMD_CI_WORK/torch_home" HF_HOME="$AMD_CI_WORK/hf_home"
          "$AMD_CI_PY" -u amd_ci/probes/fbcache_e2e_probe.py --head "$AMD_CI_WORK/src/head" \
            --base "$AMD_CI_WORK/src/base" --out-dir "$AMD_CI_WORK/out/e2e" --models "$AMD_CI_WORK/models" \
            --steps 25 --prompts 3 --cache static
          { echo "### Qwen-Image-2.1, static skip vs uncached, eager"; cat "$AMD_CI_WORK/out/e2e/SUMMARY.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-linux
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
