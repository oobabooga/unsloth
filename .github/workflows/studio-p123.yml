name: "AMD CI: which mechanism owns PR 9477's 4.981x, and can we have it for free?"

# A CAPABILITY question about the APP, not a differential one, so lib/differential.py and its
# base/head pair are not used. The independent variable is which mechanism is compiled into the
# bundle, and the control for "the mechanism caused this" is the same arm with that one mechanism
# turned off and nothing else changed.
#
# Why it exists: on this host, at a 100K-character thread, opening EVERY reasoning pane reads 5.1
# effective fps at 93% busy on upstream main and 25.3 fps at 60% busy with all of 9477 applied and
# pagination off. That 4.981x is one lump and nobody has split it. The branch already carries an
# ablation of the same PR, but it was measured on a STREAMING window, and this campaign has been
# caught once already by two different gestures sharing one name.
#
# TWO JOBS, ON PURPOSE. Building nine frontends needs no GPU, and holding the exclusive
# gfx1151 group while it happens costs everyone else on the box for nothing. It also removes a
# confound: every arm differs from every other ONLY inside `studio/frontend/src`, so the backend
# is common, and installing it once rather than nine times means an install flake can no longer
# land on one arm and be read as that arm's mechanism.

on:
  push:
    branches: [amd-ci-9477-attribution]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: "Build nine frontend arms (no GPU)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 120
    # NOT in the gfx1151 group, and explicitly blind to the device, so this cannot allocate on the
    # one GPU the four ephemeral slots share while a measurement is in flight.
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "studio-p123-build"

      - name: Toolkit self-test
        run: |
          set +e
          python3 amd_ci/selftest.py 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          echo "selftest rc=$rc"
          [ "$rc" -eq 0 ] || exit "$rc"

      # SEPARATE AND EARLY, because it is the gate that protects the expensive job from the
      # mistake this run is most likely to repeat. It replays the r500K numbers from run
      # 32819830754, where the deliberately JAMMED arm read FASTER than the clean one, and
      # asserts that rung is now VOID rather than scoring and carrying the verdict.
      - name: Criteria self-test (the r500K control fix)
        run: |
          set +e
          python3 amd_ci/selftest_p123.py 2>&1 | tail -60
          rc=${PIPESTATUS[0]}
          echo "p123 selftest rc=$rc"
          [ "$rc" -eq 0 ] || exit "$rc"

      # The integrity checks live HERE, with the build, not with the measurement: asked-versus-
      # landed per checkout, every patch applied cleanly, the sentinel greppable back out of the
      # built source, a distinct bundle hash per arm, and nothing changed outside the frontend.
      # A failed arm fails its own gate and the loop continues; aborting on the first bad arm is
      # what threw away three good arms earlier in this campaign.
      - name: Build the arms
        timeout-minutes: 100
        run: |
          set +e
          python3 amd_ci/probes/studio_p123_probe.py \
            --mode build \
            --dist-out "$AMD_CI_WORK/dists" \
            --out "$AMD_CI_WORK/out/build_obs.json"
          echo "build probe rc=$?"
          ls -la "$AMD_CI_WORK/dists" 2>/dev/null | head -20
          python3 - <<'PY'
          import json, os, pathlib
          w = pathlib.Path(os.environ["AMD_CI_WORK"])
          m = w / "dists" / "build_manifest.json"
          if not m.is_file():
              print("::error::no build manifest was produced")
              raise SystemExit(1)
          d = json.loads(m.read_text())
          hashes = {}
          for n, s in d["states"].items():
              print(f"{n:6s} landed={str(s.get('commit'))[:9]} patch_ok={s.get('patch_ok')} "
                    f"mask={s.get('piece_mask')} defer={s.get('fence_defer_enabled')} "
                    f"bundle={s.get('exported_bundle_hash')}")
              if s.get("exported_bundle_hash"):
                  hashes.setdefault(s["exported_bundle_hash"], []).append(n)
          dupes = {h: v for h, v in hashes.items() if len(v) > 1}
          if dupes:
              print(f"::warning::arms share a bundle hash, so those arms are the same tree: {dupes}")
          print(f"built {len(hashes)} distinct bundles across {len(d['states'])} arms")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p123-dists
          path: ${{ env.AMD_CI_WORK }}/dists
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p123-build-observations
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn

  measure:
    name: "Measure nine arms in WebKitGTK (exclusive)"
    needs: build
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 300
    # Compositing a browser and seeding a 1 MB thread both allocate on the one gfx1151 the four
    # ephemeral slots share, so this takes the GPU group. The group holds one runner plus one
    # waiter and a third arrival cancels the waiter silently.
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "studio-p123"

      - name: Hardware gate
        run: |
          set -euo pipefail
          # Fails rather than skips. A skip would misreport missing hardware as nothing to see.
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"

      - uses: actions/download-artifact@v4
        with:
          name: p123-dists
          path: ${{ env.AMD_CI_WORK }}/dists

      - name: Engine inventory
        run: |
          set +e
          for p in /usr/bin/python3 /usr/bin/python3.12; do
            [ -x "$p" ] || continue
            echo "== $p"
            "$p" -c "import gi; gi.require_version('WebKit2','4.1'); from gi.repository import WebKit2; print('  WebKit', WebKit2.get_major_version(), WebKit2.get_minor_version(), WebKit2.get_micro_version())" 2>&1 | tail -2
          done
          echo "== arms that arrived"
          ls "$AMD_CI_WORK/dists" 2>&1 | head -20
          echo "always exits 0: this is inventory, the probe's own gate decides"
          exit 0

      # r100K ONLY, and the time that buys goes into REPETITIONS.
      #
      # r500K is roughly half the measurement time and it is the rung whose ratios were already
      # agreed to be direction-only: the reference arm and the jammed control both sit at 0.1 fps
      # there, so the channel cannot resolve anything and the criteria's per-rung control gate now
      # correctly calls it VOID. Five repetitions at r100K, where the control resolves cleanly
      # (5.1 -> 1.3 fps, a 75% fall) and the arm rep spread was 0.2 fps, buys cell-level
      # confidence, which is what a nine-arm design actually needs. The winner goes to r500K
      # afterwards as a separate short confirmation run.
      - name: Attribution on action:reasoning_toggle_all at r100K
        timeout-minutes: 240
        run: |
          set +e
          python3 amd_ci/lib/capability_run.py \
            --probe amd_ci/probes/studio_p123_probe.py \
            --criteria amd_ci/criteria/studio_p123_attribution.py \
            --out-dir "$AMD_CI_WORK/out/p123" \
            -- --mode measure --dist-in "$AMD_CI_WORK/dists" \
               --rungs 100K --reps 100K:5 --hog-ms 200
          cat "$AMD_CI_WORK/out/p123/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          python3 amd_ci/lib/announce.py "$AMD_CI_WORK/out/p123"

      - name: Stop anything left holding the GPU
        if: always()
        run: |
          set +e
          # By PORT, then by PID. A pattern-matching process killer would match this very step's
          # own shell, because the pattern ends up on its command line; that has cost a real run
          # before. A Studio or an Xvfb that outlives the job holds VRAM on a machine three other
          # slots share, so this cannot simply be skipped either.
          for p in $(seq 5451 5560); do
            pid=$(ss -lptnH "sport = :$p" 2>/dev/null | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2)
            [ -n "$pid" ] && { echo "killing $pid on port $p"; kill -TERM "$pid" 2>/dev/null; }
          done
          sleep 3
          exit 0

      # The logs, separately from the verdict, because the ask is to SEE that Studio functions
      # rather than be told it does: Studio's own --verbose log per run, the browser console and
      # page-error stream, and every failed resource load.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-p123-logs
          path: |
            ${{ env.AMD_CI_WORK }}/p123/out/logs
            ${{ env.AMD_CI_WORK }}/p123/out/*.jsonl
            ${{ env.AMD_CI_WORK }}/p123/**/logs/*.log
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-p123
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
