name: Qwen3.8 NPU context boundary
'on':
  push:
    branches:
    - qwen38-ctx-probe-cc7a0a
permissions: {}
jobs:
  a-linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 160
    defaults:
      run:
        shell: bash
    steps:
    - name: Hardware
      run: uname -a; lscpu | head -15; free -h; ls -l /dev/accel* || true
      continue-on-error: true
    - name: Prepare A source
      run: 'set -e

        python3 -c "import base64; exec(base64.b64decode(''''))"

        git clone --filter=blob:none --no-checkout https://github.com/unslothai/unsloth.git source

        git -C source checkout 0f7bdbb62386abbe9f7ab0610b2d3986ce7a214d

        git -C source status --short

        '
    - name: Build Studio and browser
      timeout-minutes: 40
      run: '"$RUNNER_TEMP/ab-venv/bin/python" -u "$RUNNER_TEMP/build_ui.py"'
    - name: Live Playwright A-B probe
      timeout-minutes: 90
      env:
        AB_LEG: A
        PYTHONUTF8: '1'
      run: '"$RUNNER_TEMP/ab-venv/bin/python" -u "$RUNNER_TEMP/native_ctx.py"'
    - name: Save evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: A-linux
        path: ${{ runner.temp }}/npu-ab/evidence
        retention-days: 14
  a-windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 160
    defaults:
      run:
        shell: powershell
    steps:
    - name: Hardware
      run: Get-CimInstance Win32_Processor | Select Name; Get-PnpDevice -FriendlyName "*NPU*" | Select FriendlyName,Status
      continue-on-error: true
    - name: Prepare A source
      run: '$ErrorActionPreference = ''Stop''

        @''

        

        ''@ | Set-Content -Encoding ASCII "$env:RUNNER_TEMP/bootstrap.b64"

        python -c "import base64,pathlib,os; exec(base64.b64decode((pathlib.Path(os.environ[''RUNNER_TEMP''])/''bootstrap.b64'').read_text()))"

        git clone --filter=blob:none --no-checkout https://github.com/unslothai/unsloth.git source

        git -C source checkout 0f7bdbb62386abbe9f7ab0610b2d3986ce7a214d

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git -C source status --short

        '
    - name: Build Studio and browser
      timeout-minutes: 40
      run: '& "$env:RUNNER_TEMP/ab-venv/Scripts/python.exe" -u "$env:RUNNER_TEMP/build_ui.py"'
    - name: Live Playwright A-B probe
      timeout-minutes: 90
      env:
        AB_LEG: A
        PYTHONUTF8: '1'
      run: '& "$env:RUNNER_TEMP/ab-venv/Scripts/python.exe" -u "$env:RUNNER_TEMP/native_ctx.py"'
    - name: Save evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: A-windows
        path: ${{ runner.temp }}/npu-ab/evidence
        retention-days: 14

