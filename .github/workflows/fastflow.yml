name: FastFlowLM Studio lifecycle validation
'on':
  push:
    branches:
    - amd-fastflow-qwen38-72c87b98
permissions: {}
jobs:
  lifecycle-linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 65
    steps:
    - name: Studio context boundary, history, code tool and deletion
      shell: bash
      run: 'python3 -c "import base64,pathlib; pathlib.Path(''studio_lifecycle.py'').write_bytes(base64.b64decode(''''))"

        python3 -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''studio-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if
        os.name==''nt'' else ''bin/python''); sys.exit(subprocess.call([str(exe),''-u'',''studio_lifecycle.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lifecycle-linux
        path: evidence
        retention-days: 7
  lifecycle-windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 65
    steps:
    - name: Studio context boundary, history, code tool and deletion
      shell: powershell
      run: 'python -c "import base64,pathlib; pathlib.Path(''studio_lifecycle.py'').write_bytes(base64.b64decode(''''))"

        python -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''studio-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if
        os.name==''nt'' else ''bin/python''); sys.exit(subprocess.call([str(exe),''-u'',''studio_lifecycle.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lifecycle-windows
        path: evidence
        retention-days: 7
