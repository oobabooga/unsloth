name: FastFlowLM Studio context UI reproduction
'on':
  push:
    branches:
    - amd-fastflow-qwen38-72c87b98
permissions: {}
jobs:
  context-ui-linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 50
    steps:
    - name: Change context in model settings and submit chat
      shell: bash
      run: 'python3 -c "import base64,pathlib; pathlib.Path(''studio_context_ui.py'').write_bytes(base64.b64decode(''''))"

        python3 -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''studio-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if
        os.name==''nt'' else ''bin/python''); sys.exit(subprocess.call([str(exe),''-u'',''studio_context_ui.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: context-ui-linux
        path: evidence
        retention-days: 7
  context-ui-windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 50
    steps:
    - name: Change context in model settings and submit chat
      shell: powershell
      run: 'python -c "import base64,pathlib; pathlib.Path(''studio_context_ui.py'').write_bytes(base64.b64decode(''''))"

        python -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''studio-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if
        os.name==''nt'' else ''bin/python''); sys.exit(subprocess.call([str(exe),''-u'',''studio_context_ui.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: context-ui-windows
        path: evidence
        retention-days: 7
