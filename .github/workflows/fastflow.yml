name: FastFlowLM Qwen3.8 live validation
'on':
  push:
    branches:
    - amd-fastflow-qwen38-72c87b98
permissions: {}
jobs:
  windows-cli:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 75
    steps:
    - name: Interactive Windows CLI
      shell: powershell
      run: 'python -c "import base64,pathlib; pathlib.Path(''windows_cli.py'').write_bytes(base64.b64decode(''''))"

        python -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''native-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if os.name==''nt'' else ''bin/python'');
        subprocess.check_call([str(exe),''-m'',''pip'',''install'',''requests'',''pillow'',''pywinpty'']); sys.exit(subprocess.call([str(exe),''-u'',''windows_cli.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-cli
        path: evidence
        retention-days: 7
