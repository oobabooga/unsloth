name: FastFlowLM Qwen3.8 live validation
'on':
  push:
    branches:
    - amd-fastflow-qwen38-72c87b98
permissions: {}
jobs:
  studio-linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 90
    steps:
    - name: Studio browser live matrix
      shell: bash
      run: 'python3 -c "import base64,pathlib; pathlib.Path(''studio_probe.py'').write_bytes(base64.b64decode(''''))"

        python3 -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''studio-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if os.name==''nt'' else ''bin/python'');
        sys.exit(subprocess.call([str(exe),''-u'',''studio_probe.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: studio-linux
        path: evidence
        retention-days: 7
