name: FastFlowLM Qwen3.8 live validation
'on':
  push:
    branches:
    - amd-fastflow-qwen38-72c87b98
permissions: {}
jobs:
  edges-linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 75
    steps:
    - name: Context and API boundary checks
      shell: bash
      run: 'python3 -c "import base64,pathlib; pathlib.Path(''native_edges.py'').write_bytes(base64.b64decode(''''))"

        python3 -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''native-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if os.name==''nt'' else ''bin/python'');
        subprocess.check_call([str(exe),''-m'',''pip'',''install'',''requests'',''pillow'']); sys.exit(subprocess.call([str(exe),''-u'',''native_edges.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: edges-linux
        path: evidence
        retention-days: 7
  edges-windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 75
    steps:
    - name: Context and API boundary checks
      shell: powershell
      run: 'python -c "import base64,pathlib; pathlib.Path(''native_edges.py'').write_bytes(base64.b64decode(''''))"

        python -c "import os,sys,pathlib,venv,subprocess; p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''native-venv'';
        venv.EnvBuilder(with_pip=True).create(p); exe=p/(''Scripts/python.exe'' if os.name==''nt'' else ''bin/python'');
        subprocess.check_call([str(exe),''-m'',''pip'',''install'',''requests'',''pillow'']); sys.exit(subprocess.call([str(exe),''-u'',''native_edges.py'']))"'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: edges-windows
        path: evidence
        retention-days: 7
