name: FastFlowLM Qwen3.8 live validation
'on':
  push:
    branches:
    - amd-fastflow-qwen38-72c87b98
permissions: {}
jobs:
  linux:
    runs-on:
    - self-hosted
    - Linux
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 90
    steps:
    - name: Native FastFlowLM Qwen3.8 live matrix
      shell: bash
      run: 'python3 -m pip install --user requests pillow

        python3 -c "import base64,pathlib; pathlib.Path(''native_probe.py'').write_bytes(base64.b64decode(''''))"

        python3 -u native_probe.py'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-linux
        path: evidence
        retention-days: 7
  windows:
    runs-on:
    - self-hosted
    - Windows
    - strix-halo
    - devlab-dispatch
    timeout-minutes: 90
    steps:
    - name: Native FastFlowLM Qwen3.8 live matrix
      shell: powershell
      run: 'python -m pip install --user requests pillow

        python -c "import base64,pathlib; pathlib.Path(''native_probe.py'').write_bytes(base64.b64decode(''''))"

        python -u native_probe.py'
    - name: Collect evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-windows
        path: evidence
        retention-days: 7
