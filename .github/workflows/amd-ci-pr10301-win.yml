name: "AMD CI (Windows): validate PR 10301"

# Generated from amd_ci/templates/workflow_windows.yml by scaffold.py --windows.
#
# The Windows half of the devlab-dispatch pool: four GMKtec NucBox EVO-X2 Strix
# Halo boxes running Windows 11 Pro, with an AMD Radeon 8060S visible to Windows.
# They match in seconds and never queue. Everything below is measured on them:
#
#   shell: powershell     the ONLY correct value. `pwsh` is not installed (there
#                         is no PowerShell 7, only 5.1 Desktop) and neither is
#                         `bash`. Either one fails before the step's first line.
#                         Set as a job default so no step can drift off it.
#   no docker             not installed on any of the four. Containerised work
#                         stays on the Linux runners; there is no Windows target
#                         for it on this pool.
#   RUNNER_OS             has been observed EMPTY on these jobs, and correct on
#                         others. Echo it before branching on it; a bash-style
#                         ${RUNNER_OS:-?} in a PowerShell block is always "".
#   machine names         the X2-LA01-* prefix is SHARED with the Linux pool, so
#                         the name does not tell you which OS answered.
#   no shared state       jobs land on DIFFERENT machines and share no image
#                         cache and no disk. Anything fetched in one job must be
#                         fetched again in the next.
#
# The linux-control job exists to be diagnostic, not useful. A label that matches
# no runner does not fail a job, it queues it forever, and that looks exactly like
# a busy pool from the run list. This job differs from the Windows one ONLY in the
# OS label, so if it starts and the Windows job does not, the selector is wrong.
# Keep it, or reproduce it by pushing the same workflow twice.

on:
  push:
    branches: [amd-ci-pr10301-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR: "10301"
  UPSTREAM: "https://github.com/unslothai/unsloth"
  # Set to "1" for a PR already merged: compares the merge commit to its parent.
  MERGED: "0"

jobs:

  linux-control:
    name: "PR 10301 linux control (selector diagnosis)"
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 10
    env:
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Report which machine answered
        run: |
          set +e
          echo "control leg: the same selector with Linux in place of Windows"
          echo "machine: $(uname -n)"
          echo "If this job runs and the windows job stays queued, the Windows"
          echo "selector matched no runner. If BOTH stay queued, the pool is busy."

  windows:
    name: "PR 10301 on Windows (non-Docker)"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 120
    # Uncomment when the job actually measures the GPU. It is off by default
    # because the four Windows boxes are four separate machines with four separate
    # GPUs, so serialising all of them costs throughput for nothing; the labels
    # cannot pin one machine, so there is no finer group to ask for. `lint_workflow.py`
    # raises W101 if a step here touches GPU memory without a group.
    # concurrency:
    #   group: amd-ci-strix-halo-windows-gpu
    #   cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "pr10301-windows"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) {
            Write-Host "FATAL: no system Python found at any known location."
            Write-Host "Not skipping: a run that cannot start is a failure, not nothing to see."
            exit 1
          }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Host gate
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --no-torch `
            --require windows --out "$env:AMD_CI_WORK\out\host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve states
        run: |
          $ErrorActionPreference = "Continue"
          $extra = @()
          if ($env:MERGED -eq "1") { $extra += "--merged" }
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\states.py" `
            --repo "$env:UPSTREAM" --pr "$env:PR" @extra `
            --root "$env:AMD_CI_WORK" --out "$env:AMD_CI_WORK\out\states.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test environment
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          & $py -m pip install -q pytest pytest-asyncio pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Studio backend's own deps, as its Linux backend CI installs them, from the head tree.
          & $py -m pip install -q -r "$env:AMD_CI_WORK\states\head\studio\backend\requirements\studio.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests "numpy<3" pytest-xdist httpx soundfile librosa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.4,<2.11" "torchaudio<2.11"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -q "transformers>=4.51,<=5.17.0" peft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"
          # If the change needs a ROCm torch, install it here and then re-gate with
          # --require rocm gpu --expect-arch gfx1151. The gate EXITS 1 when it is
          # absent, which is the point: whether these boxes carry a ROCm-enabled
          # torch has not been measured, and a green skip would hide that.

      - name: Differential
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\differential.py" `
            --states "$env:AMD_CI_WORK\out\states.json" `
            --probe "$env:GITHUB_WORKSPACE/amd_ci/probes/pytest_probe.py" `
            --criteria "$env:GITHUB_WORKSPACE/amd_ci/criteria/pytest_no_regression.py" `
            --out-dir "$env:AMD_CI_WORK\out\windows" `
            --python "$env:AMD_CI_PY" -- --tests tests/test_a_cancelled_round_drains_every_call.py tests/test_a_caption_holder_is_refused_when_its_victims_stay_wedged.py tests/test_a_closed_gguf_round_stops_its_siblings.py tests/test_a_contended_report_reclaims_idle_residue_before_it_plans.py tests/test_a_diffusion_runner_never_asks_for_an_exact_reload.py tests/test_a_direct_holder_never_goes_upstream_before_its_victims_let_go.py tests/test_a_direct_holder_waits_for_its_victims_to_let_go.py tests/test_a_direct_holder_waits_for_the_victim_that_replaced_a_revoked_one.py tests/test_a_failed_pause_wait_is_not_permission_to_decode.py tests/test_a_failed_props_read_keeps_the_park_notices.py tests/test_a_first_token_waits_for_a_probe_started_after_it.py tests/test_a_fitted_plain_prompt_is_what_the_ledger_counts.py tests/test_a_generically_erased_approval_waits_to_recost.py tests/test_a_holder_that_parks_during_the_erases_keeps_its_charge.py tests/test_a_legacy_completion_is_counted_beside_a_chat.py tests/test_a_load_in_flight_counts_for_the_exact_reload.py tests/test_a_long_prefill_keeps_its_batch_reserve.py tests/test_a_parallel_round_charges_its_arguments_once.py tests/test_a_parallel_round_classifies_the_healed_arguments_before_overlapping.py tests/test_a_parallel_round_dedupes_healed_calls_and_freezes_its_branch.py tests/test_a_park_keepalive_cannot_outlive_the_cap.py tests/test_a_parked_victim_counts_as_freed_only_once_erased.py tests/test_a_parking_server_admits_every_chat_that_fits_alone.py tests/test_a_pause_inside_a_textual_tool_call_restarts_the_call.py tests/test_a_pause_keeps_the_thought_and_a_stop_ends_the_wait.py tests/test_a_pause_on_a_spent_cap_ends_the_turn.py tests/test_a_paused_final_pass_resumes_from_its_answer_not_its_display.py tests/test_a_paused_round_keeps_its_counts_and_caps.py tests/test_a_plain_resume_clears_the_signal_before_it_reopens.py tests/test_a_plain_resume_does_not_refit_what_was_already_dropped.py tests/test_a_plain_resume_keeps_the_callers_arguments.py tests/test_a_provider_round_honours_parallel_tool_calls_false.py tests/test_a_raw_holder_announces_its_prompt_not_its_allowance.py tests/test_a_raw_park_reaches_the_client_and_exact_needs_the_server_to_park.py tests/test_a_reclaimed_round_keeps_its_replay_until_published.py tests/test_a_refused_yield_and_a_padded_name_keep_their_accounting.py tests/test_a_resume_books_its_replay_not_the_stale_charge.py tests/test_a_resume_counts_every_pending_replay.py tests/test_a_resume_counts_only_the_cells_it_owns.py tests/test_a_resume_holds_its_room_and_a_pause_keeps_its_lease_alive.py tests/test_a_resume_keeps_the_thought_before_its_prose.py tests/test_a_resume_replays_its_prompt_and_a_choice_starts_afresh.py tests/test_a_resume_shares_one_hard_deadline.py tests/test_a_revoked_victim_is_replaced_and_pending_pressure_reclaims_idle_first.py tests/test_a_round_that_may_ask_stays_in_order.py tests/test_a_rounds_growth_stays_on_top_until_a_reading_holds_it.py tests/test_a_server_that_parks_its_own_slots_gets_no_per_token_callback.py tests/test_a_solo_chat_pays_for_no_sweep.py tests/test_a_spent_allowance_is_not_charged_twice.py tests/test_a_stopped_parallel_round_ends_its_tool_drivers.py tests/test_a_tool_round_publishes_the_count_its_recost_took.py tests/test_account_installation_mutations.py tests/test_account_shared_load_settings.py tests/test_admission_switches_are_honoured_everywhere.py tests/test_an_approval_during_an_erase_still_records_it.py tests/test_an_auto_load_with_an_unsized_pool_does_not_keep_an_oversized_parking_budget.py tests/test_an_erase_is_seen_and_a_prefill_stays_reserved.py tests/test_an_erase_never_lands_on_a_slot_reassigned_since_the_snapshot.py tests/test_an_exact_retry_bounds_its_parking_like_a_plain_launch.py tests/test_an_unavailable_slots_probe_says_so_once.py tests/test_an_unpausable_holder_is_sized_and_ordered.py tests/test_anthropic_messages.py tests/test_anthropic_studio_tools.py tests/test_arming_a_chat_never_blocks_the_event_loop.py tests/test_arming_honours_the_accounting_gate_and_the_counted_prompt.py tests/test_arming_on_a_parking_server_starts_no_residency_thread.py tests/test_auto_exact_falls_back_before_launch_when_its_weights_take_the_room.py tests/test_auto_exact_on_an_unreadable_host_and_a_save_during_resolution.py tests/test_cached_idle_residue_is_reclaimed_before_a_victim_is_chosen.py tests/test_chat_generation_lease_compat.py tests/test_checkpoint_compaction.py tests/test_context_overflow_truncation.py tests/test_conversation_recall_injection.py tests/test_exact_concurrency_switch.py tests/test_external_tool_edge_cases.py tests/test_gguf_admission_token_count.py tests/test_length_truncated_reasoning_continuation.py tests/test_llama_admission_compat_matrix.py tests/test_llama_admission_enforced_max_tokens.py tests/test_llama_admission_enforced_paths.py tests/test_llama_admission_kv_budget.py tests/test_llama_admission_kv_budget_media_and_tools.py tests/test_llama_admission_unstated_max_tokens.py tests/test_llama_cpp_tool_loop.py tests/test_llama_plain_chat_preempt_resume.py tests/test_llama_preemption.py tests/test_llama_preemption_cancel_during_arm.py tests/test_llama_preemption_is_armed_on_chat_surfaces.py tests/test_llama_preemption_resume_order.py tests/test_llama_route_timeouts.py tests/test_llama_server_args.py tests/test_llama_tool_loop_preempt_resume.py tests/test_mcp_image.py tests/test_only_output_counts_and_a_spent_cap_is_not_reopened.py tests/test_openai_tool_passthrough.py tests/test_overlapping_probes_are_ordered_by_when_they_started.py tests/test_parallel_round_divides_room_among_launched_calls.py tests/test_preempt_resumes_end_on_stalls_not_counts.py tests/test_preemption_on_by_default.py tests/test_preemption_survives_a_respawn_and_a_slow_server.py tests/test_raw_nonstream_waits_out_a_server_park.py tests/test_research_internal_call_tool_gate.py tests/test_research_preempt_pause_deadline.py tests/test_server_mode_token_path_reads_no_slots.py tests/test_server_park_notices_are_indexed.py tests/test_server_side_preemption_handoff.py tests/test_single_user_latency_levers.py tests/test_studio_tool_loop.py tests/test_studio_tool_loop_preemption.py tests/test_the_anthropic_tool_loop_reports_like_the_gguf_one.py tests/test_the_first_tool_round_stays_unmeasured_until_its_prompt_is_in.py tests/test_the_optimism_matches_what_can_be_reclaimed.py tests/test_tool_approval_context_release.py tests/test_tool_calls_within_one_turn_overlap.py tests/test_two_probes_started_on_one_epoch_keep_the_later_reading.py tests/test_underscore_spellings_are_read_as_llama_cpp_reads_them.py tests/test_without_preemption_a_tool_round_recosts_as_main_did.py tests/test_without_preemption_admission_charges_what_main_charged.py
          Get-Content "$env:AMD_CI_WORK\out\windows\VERDICT.md" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          # A finding keeps the job green; a NON-result (VOID / INCONCLUSIVE) does not.
          # This is the last command, so its exit status is the step's.
          & $env:AMD_CI_PY "$env:GITHUB_WORKSPACE\amd_ci\lib\announce.py" `
            "$env:AMD_CI_WORK\out\windows"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr10301-windows
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
