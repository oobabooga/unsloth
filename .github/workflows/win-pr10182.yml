name: PR 10182 Windows ACL matrix

on:
  push:
    branches: [amd-win-10182-ci]

permissions:
  contents: read

jobs:
  windows-acl-matrix:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 45
    steps:
      - name: Checkout the test harness
        uses: actions/checkout@v4

      - name: Host
        shell: powershell
        run: |
          systeminfo | Select-String "OS Name","OS Version","System Type"
          whoami
          python --version
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP"
          fsutil fsinfo volumeinfo C:

      - name: Clone the PR head and main
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($pair in @(@("pr10182-src", "refs/pull/10182/head"), @("main-src", "main"))) {
            $work = Join-Path $env:RUNNER_TEMP $pair[0]
            if (Test-Path $work) { Remove-Item -Recurse -Force $work }
            git init $work
            Push-Location $work
            git remote add origin https://github.com/unslothai/unsloth.git
            git -c protocol.version=2 fetch --depth 1 origin $pair[1]
            git checkout FETCH_HEAD
            Write-Host "$($pair[0]) -> $(git log --oneline -1)"
            Pop-Location
          }

      - name: CONTROL - what main does with the same real failure
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python "$env:GITHUB_WORKSPACE\winacl_matrix.py" "$env:RUNNER_TEMP\main-src" --control
          Write-Host "control exit: $LASTEXITCODE"
          exit 0

      - name: MATRIX - the PR head
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python "$env:GITHUB_WORKSPACE\winacl_matrix.py" "$env:RUNNER_TEMP\pr10182-src"
          exit $LASTEXITCODE

      # An elevated token bypasses deny ACEs, so the permissions case can only be
      # reproduced as an ordinary user -- which is how #9928's reporter hit it.
      - name: UNPRIVILEGED - the #9928 scenario end to end
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $U = "pr10182u"
          $P = "Pr10182!" + (Get-Random -Maximum 99999)
          net user $U $P /add /y 2>&1 | Out-Null
          net localgroup Users $U /add 2>&1 | Out-Null
          $sec  = ConvertTo-SecureString $P -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($U, $sec)

          $py   = (Get-Command python).Source
          $sc   = "C:\pr10182work\acl_user_matrix.py"
          $work = "C:\pr10182work"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\acl_user_matrix.py" $sc -Force
          Write-Host "python interpreter: $py"
          # A standard user must be able to read the interpreter and the harness.
          $pyRoot = Split-Path $py -Parent
          icacls $pyRoot /grant "${U}:(OI)(CI)(RX)" /T /C 2>&1 | Select-Object -Last 1
          icacls $sc /grant "${U}:(RX)" 2>&1 | Select-Object -Last 1
          # Where Python lives under a profile the probe user cannot traverse, say so
          # loudly rather than producing an empty run.
          if ($pyRoot -like "*\Users\administrator\*") {
            Write-Host "NOTE: the interpreter lives under the administrator profile; granting traversal"
            icacls "C:\Users\administrator" /grant "${U}:(RX)" 2>&1 | Select-Object -Last 1
            icacls "C:\Users\administrator\AppData" /grant "${U}:(RX)" 2>&1 | Select-Object -Last 1
            icacls "C:\Users\administrator\AppData\Local" /grant "${U}:(RX)" 2>&1 | Select-Object -Last 1
          }

          # Start-Process -Credential lands the child on a window station the target
          # user cannot open, so every run died with 0xC0000142 (STATUS_DLL_INIT_FAILED).
          # Task Scheduler uses a batch logon instead, which has no such requirement.
          function Invoke-AsUser($phase, $src, $wd) {
            $cmd = "$wd\run_$phase.cmd"
            $out = "$wd\$phase.out"; $err = "$wd\$phase.err"; $rc = "$wd\$phase.rc"
            Remove-Item $out, $err, $rc -ErrorAction SilentlyContinue
            @(
              '@echo off',
              "`"$py`" `"$sc`" $phase `"$src`" `"$wd`" $U > `"$out`" 2> `"$err`"",
              "echo %ERRORLEVEL% > `"$rc`""
            ) | Set-Content -Path $cmd -Encoding ASCII
            icacls $cmd /grant "${U}:(RX)" 2>&1 | Out-Null

            $tn = "pr10182_$phase"
            schtasks /Create /TN $tn /TR "`"$cmd`"" /SC ONCE /ST 23:59 /RU $U /RP $P /F 2>&1 |
              Select-Object -Last 1
            schtasks /Run /TN $tn 2>&1 | Select-Object -Last 1
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 2
              $q = schtasks /Query /TN $tn /FO LIST 2>&1 | Out-String
              if ($q -notmatch "Running") { break }
            }
            schtasks /Delete /TN $tn /F 2>&1 | Out-Null

            if (Test-Path $rc) { Write-Host "  (exit code $((Get-Content $rc).Trim()))" }
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 0) { Get-Content $out }
            else { Write-Host "  (no stdout)" }
            if ((Test-Path $err) -and (Get-Item $err).Length -gt 0) {
              Write-Host "  --- stderr:"; Get-Content $err
            }
          }
          foreach ($v in @("pr", "main")) {
            $src = if ($v -eq "pr") { "$env:RUNNER_TEMP\pr10182-src" } else { "$env:RUNNER_TEMP\main-src" }
            $wd  = "$work\$v"
            Write-Host ""
            Write-Host ("=" * 78)
            Write-Host "### $($v.ToUpper()) -- unprivileged run"
            Write-Host ("=" * 78)

            New-Item -ItemType Directory -Force -Path $wd | Out-Null
            icacls $src /grant "${U}:(OI)(CI)(RX)" /T /C 2>&1 | Out-Null
            # Grant BEFORE setup so the deny ACEs setup adds are the last word.
            icacls $wd /grant "${U}:(OI)(CI)(M)" /T /C 2>&1 | Select-Object -Last 1

            Write-Host "--- phase: setup (admin)"
            & $py $sc setup $src $wd $U

            Write-Host "--- phase: probe (standard user $U)"
            Invoke-AsUser "probe" $src $wd

            Write-Host "--- phase: repair (elevated, running exactly what was printed)"
            & $py $sc repair $src $wd $U

            Write-Host "--- phase: verify (standard user $U)"
            Invoke-AsUser "verify" $src $wd
          }

          icacls $work /reset /T /C 2>&1 | Out-Null
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          net user $U /delete 2>&1 | Out-Null
          exit 0
