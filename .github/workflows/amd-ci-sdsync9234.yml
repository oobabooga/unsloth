name: "AMD CI: sd.cpp Vulkan image s/step on RADV, master ba6ac30 vs sync e7f4838 vs sync+fix 71bf552"

# Builds: Vulkan sd-cli of both refs on GitHub-hosted ubuntu-22.04 (the unsloth-sd-prebuilt.yml Linux Vulkan
# leg flags, ggml-patches applied). Measurement: one job on one gfx1151 machine, RADV.

on:
  push:
    branches: [amd-ci-sdsync9234]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-linux:
    name: "build vk ${{ matrix.label }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: M, sha: ba6ac30346b0f174354419d820e6f11b3e9bc0f2}
          - {label: U, sha: e7f4838c7d0c496ecac4c6357f1ea3566c1dd654}
          - {label: F, sha: 71bf552d6cbc1c656eb3e7aaa0844834e83f39f5}
    env:
      VULKAN_VERSION: 1.4.328.1
      VULKAN_SHA256: 241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build deps (as the prebuilt leg)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev xz-utils ninja-build
          archive="$RUNNER_TEMP/vulkansdk.tar.xz"; sdk_root="$RUNNER_TEMP/vulkansdk"
          curl --fail --location --retry 3 --output "$archive" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          echo "$VULKAN_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$sdk_root" && tar -xJf "$archive" -C "$sdk_root" --strip-components=1
          echo "VULKAN_SDK=$sdk_root/x86_64" >> "$GITHUB_ENV"
          echo "$sdk_root/x86_64/bin" >> "$GITHUB_PATH"
      - name: Build
        run: bash sdrc/build.sh ${{ matrix.label }} ${{ matrix.sha }} vk "$RUNNER_TEMP/out/${{ matrix.label }}"
      - name: Pack (tar keeps the exec bits)
        run: tar -C "$RUNNER_TEMP/out" -cf "$RUNNER_TEMP/b-${{ matrix.label }}.tar" ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with: { name: "b-${{ matrix.label }}", path: "${{ runner.temp }}/b-${{ matrix.label }}.tar", retention-days: 5 }

  gpu-linux:
    name: "gfx1151 Linux RADV: Flux / Qwen-Image / Z-Image s/step"
    needs: [build-linux]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, strix-halo, devlab-dispatch]
    timeout-minutes: 360
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "sdsync9234-linux"
      - name: Host gate + device strings
        run: |
          set -euo pipefail
          python3 amd_ci/lib/gate.py --no-torch --require linux --out "$AMD_CI_WORK/out/host.json"
          python3 amd_ci/lib/capability.py > "$AMD_CI_WORK/out/capability.json" 2>&1 || true
          {
            echo "node: $(uname -n)  kernel: $(uname -r)"
            ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
            dpkg-query -W -f='${Package} ${Version}\n' 'mesa-vulkan-drivers' 'libvulkan1' 2>/dev/null || true
            free -m; df -h "$RUNNER_TEMP"
          } > "$AMD_CI_WORK/out/host_strings.txt" 2>&1
          cat "$AMD_CI_WORK/out/host_strings.txt"
      - uses: actions/download-artifact@v4
        with: { path: "${{ runner.temp }}/dl", pattern: "b-*" }
      - name: Unpack builds + python deps
        run: |
          set -euo pipefail
          mkdir -p "$AMD_CI_WORK/bin"
          for t in "$RUNNER_TEMP"/dl/b-*/b-*.tar; do tar -C "$AMD_CI_WORK/bin" -xf "$t"; done
          cat "$AMD_CI_WORK"/bin/*/srcinfo.txt | grep label=
          python3 -m venv "$AMD_CI_WORK/pyv" && "$AMD_CI_WORK/pyv/bin/pip" install -q pillow numpy
          "$AMD_CI_WORK/bin/F/sd-cli" --list-devices 2>&1 | tail -5 | tee "$AMD_CI_WORK/out/list_devices.txt" || true
      - name: Models (public, no token)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          M="$AMD_CI_WORK/models"; mkdir -p "$M"; H=https://huggingface.co
          get() { curl -sS --fail -L --retry 5 --retry-delay 10 -o "$M/$1" "$H/$2"; }
          get flux1-schnell-Q2_K.gguf unsloth/FLUX.1-schnell-GGUF/resolve/main/flux1-schnell-Q2_K.gguf
          get t5-v1_1-xxl-encoder-Q3_K_M.gguf city96/t5-v1_1-xxl-encoder-gguf/resolve/main/t5-v1_1-xxl-encoder-Q3_K_M.gguf
          get clip_l.safetensors unsloth/FLUX.1-schnell/resolve/main/text_encoder/model.safetensors
          get ae.safetensors unsloth/FLUX.1-schnell/resolve/main/ae.safetensors
          get qwen-image-Q2_K.gguf unsloth/Qwen-Image-GGUF/resolve/main/qwen-image-Q2_K.gguf
          get Qwen2.5-VL-7B-Instruct-Q2_K.gguf unsloth/Qwen2.5-VL-7B-Instruct-GGUF/resolve/main/Qwen2.5-VL-7B-Instruct-Q2_K.gguf
          get qwen_vae.safetensors Qwen/Qwen-Image/resolve/main/vae/diffusion_pytorch_model.safetensors
          get z-image-turbo-Q2_K.gguf unsloth/Z-Image-Turbo-GGUF/resolve/main/z-image-turbo-Q2_K.gguf
          get Qwen3-4B-Q2_K.gguf unsloth/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q2_K.gguf
          ls -la "$M"
      - name: "Measure (one machine, interleaved)"
        timeout-minutes: 240
        run: |
          set +e
          "$AMD_CI_WORK/pyv/bin/python" -u sdrc/img.py --bin-root "$AMD_CI_WORK/bin" --models "$AMD_CI_WORK/models" --out "$AMD_CI_WORK/out/img" 2>&1 | tail -200
          exit 0
      - name: Stop leftovers
        if: always()
        run: |
          pkill -u "$(id -u)" -x sd-cli || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdsync9234-linux
          path: |
            ${{ env.AMD_CI_WORK }}/out
            !${{ env.AMD_CI_WORK }}/out/**/*.png
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sdsync9234-linux-png, path: "${{ env.AMD_CI_WORK }}/out/img/*.r0.png", retention-days: 7, if-no-files-found: warn }
