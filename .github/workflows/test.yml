name: PR 14245 Desktop chat-only on Windows AMD

on:
  push:
    branches: [amd-devlab-14245-win]

permissions: {}

env:
  SRC_SHA: f1f283a24e2dcda1166f45ddafa73e53f8d38c2d

jobs:
  win:
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
    steps:
      - name: Setup paths and set existing state aside
        run: |
          $W = Join-Path $env:RUNNER_TEMP "pr14245-$env:GITHUB_RUN_ID"
          $B = Join-Path $env:RUNNER_TEMP "pr14245-build"
          New-Item -ItemType Directory -Force -Path $W, "$W\art", $B | Out-Null
          "H_W=$W" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "H_B=$B" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "H_ART=$W\art" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled | Select-Object LongPathsEnabled
          node --version; npm --version; rustc --version; cargo --version; python --version
          Get-Process | Where-Object { $_.Name -match 'unsloth|llama' } | Format-Table Name,Id,SessionId
          $aside = @()
          foreach ($p in @("$env:USERPROFILE\.unsloth", "$env:APPDATA\ai.unsloth.studio", "$env:LOCALAPPDATA\ai.unsloth.studio")) {
            if (Test-Path -LiteralPath $p) {
              $to = "$p.aside-$env:GITHUB_RUN_ID"
              Rename-Item -LiteralPath $p -NewName (Split-Path $to -Leaf)
              $aside += "$p|$to"
              Write-Host "set aside: $p -> $to"
            }
          }
          Set-Content -LiteralPath "$W\aside.txt" -Value $aside
          Get-ChildItem "$env:LOCALAPPDATA" -Directory | Where-Object Name -match '^uv$' | ForEach-Object { "LOCALAPPDATA\uv exists" }
          exit 0

      - name: Fetch harness and source
        run: |
          $ErrorActionPreference = 'Continue'
          git init -q "$env:H_W\h" 2>&1 | Out-Null
          git -C "$env:H_W\h" fetch -q --depth 1 https://github.com/oobabooga/unsloth $env:GITHUB_SHA
          git -C "$env:H_W\h" checkout -q FETCH_HEAD
          $src = "$env:H_B\src"
          if (-not (Test-Path "$src\.git")) { git init -q $src }
          $head = git -C $src rev-parse HEAD 2>$null
          if ($head -ne $env:SRC_SHA) {
            git -C $src fetch -q --depth 1 https://github.com/unslothai/unsloth $env:SRC_SHA
            git -C $src checkout -q -f FETCH_HEAD
          }
          git -C $src log --oneline -1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      - name: Build the Desktop app (debug, main at SRC_SHA)
        run: |
          $ErrorActionPreference = 'Continue'
          $src = "$env:H_B\src"
          $exe = "$env:H_B\target\debug\unsloth-studio.exe"
          $stamp = "$env:H_B\built-sha.txt"
          $want = "$env:SRC_SHA-cdp-rel"
          if ((Test-Path $exe) -and (Test-Path $stamp) -and ((Get-Content $stamp) -eq $want)) { Write-Host "cached build"; exit 0 }
          git -C $src checkout -- studio/src-tauri/tauri.conf.json
          python "$env:H_W\h\h\patch_conf.py" "$src\studio\src-tauri\tauri.conf.json"
          Push-Location "$src\studio\frontend"
          npm ci --no-fund --no-audit 2>&1 | Select-Object -Last 5
          npm run build 2>&1 | Select-Object -Last 15
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::frontend build failed"; exit 1 }
          Pop-Location
          $env:CARGO_TARGET_DIR = "$env:H_B\target"
          # The box's rustup has no default toolchain; keep a private one in the build cache.
          $env:RUSTUP_HOME = "$env:H_B\rustup"
          $env:CARGO_HOME = "$env:H_B\cargo"
          rustup toolchain install stable --profile minimal --no-self-update 2>&1 | Select-Object -Last 3
          $env:RUSTUP_TOOLCHAIN = "stable"
          rustc --version
          cargo build --manifest-path "$src\studio\src-tauri\Cargo.toml" 2>&1 | Select-Object -Last 25
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::cargo build failed"; exit 1 }
          # Release build too: startup auto-repair only runs when debug_assertions are off. It runs the
          # bundled install.ps1 from its resource dir, which for a bare exe is the exe's folder.
          cargo build --release --manifest-path "$src\studio\src-tauri\Cargo.toml" 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::cargo release build failed"; exit 1 }
          Copy-Item "$src\install.ps1" "$env:H_B\target\release\install.ps1" -Force
          Set-Content $stamp $want
          Get-Item $exe | Select-Object FullName,Length
          exit 0

      - name: Harness venv
        run: |
          $ErrorActionPreference = 'Continue'
          python -m venv "$env:H_W\hv"
          & "$env:H_W\hv\Scripts\python.exe" -m pip install -q playwright==1.55.0 pywinauto==0.6.9 pillow 2>&1 | Select-Object -Last 3
          & "$env:H_W\hv\Scripts\python.exe" -c "import playwright, pywinauto, PIL; print('ok')"
          exit 0

      - name: "Run 9 A: default location, Chat only"
        run: |
          . "$env:H_W\h\h\session1.ps1"
          $uvBefore = (Get-ChildItem "$env:LOCALAPPDATA\uv" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          "UV_BEFORE=$uvBefore" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $root = "$env:USERPROFILE\.unsloth\studio"
          $rc = Invoke-InSession1 -Name defaultchat -TimeoutMin 40 -Command "`"$env:H_W\hv\Scripts\python.exe`" `"$env:H_W\h\h\harness.py`" firstrun" -Env @{ H_APP = "$env:H_B\target\release\unsloth-studio.exe"; H_ART = "$env:H_ART\A"; H_PICK = ""; H_ROOT = $root; H_EXPLORE = "0" }
          & "$env:H_W\hv\Scripts\python.exe" "$env:H_W\h\h\measure.py" $root "A-default-chat-only" "$env:H_ART"
          $uvAfter = (Get-ChildItem "$env:LOCALAPPDATA\uv" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          Write-Host ("LOCALAPPDATA\uv grew by {0:N3} GB" -f (($uvAfter - $uvBefore) / 1GB))
          Get-ChildItem "$root\cache" -ErrorAction SilentlyContinue | Format-Table Name
          Get-Content "$root\cache\uv-cache-dir" -ErrorAction SilentlyContinue
          exit 0

      - name: "Run 9 B: custom location, default (full) install"
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:H_W\h\h\session1.ps1"
          taskkill /F /T /IM unsloth-studio.exe 2>$null
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match '\.unsloth' -and $_.Name -match 'python|llama' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 5
          Remove-Item -LiteralPath "$env:USERPROFILE\.unsloth" -Recurse -Force -ErrorAction SilentlyContinue
          $pick = "$env:H_W\Full Root"
          New-Item -ItemType Directory -Force -Path $pick | Out-Null
          $root = "$pick\Unsloth\studio"
          $rc = Invoke-InSession1 -Name defaultfull -TimeoutMin 60 -Command "`"$env:H_W\hv\Scripts\python.exe`" `"$env:H_W\h\h\harness.py`" firstrun" -Env @{ H_APP = "$env:H_B\target\release\unsloth-studio.exe"; H_ART = "$env:H_ART\B"; H_PICK = $pick; H_ROOT = $root; H_CHAT_ONLY = "0"; H_EXPLORE = "0" }
          & "$env:H_W\hv\Scripts\python.exe" "$env:H_W\h\h\measure.py" $root "B-full-install" "$env:H_ART"
          exit 0

      - name: Collect logs
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force "$env:H_ART\logs" | Out-Null
          Copy-Item "$env:H_W\*.log" "$env:H_ART\logs\" -ErrorAction SilentlyContinue
          foreach ($d in @("$env:LOCALAPPDATA\ai.unsloth.studio", "$env:APPDATA\ai.unsloth.studio", "$env:USERPROFILE\.unsloth")) {
            if (Test-Path $d) {
              Get-ChildItem $d -Recurse -File -Include *.log,*.json,*.txt -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 20MB -and $_.FullName -notmatch 'EBWebView' } | ForEach-Object {
                $rel = $_.FullName.Substring(3) -replace '[\\:]', '_'
                Copy-Item $_.FullName "$env:H_ART\logs\$rel" -ErrorAction SilentlyContinue
              }
            }
          }
          if ($env:H_ROOT -and (Test-Path $env:H_ROOT)) {
            Get-ChildItem $env:H_ROOT -Recurse -File -Include *.log -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'site-packages' -and $_.Length -lt 20MB } | ForEach-Object {
              $rel = $_.FullName.Substring($env:H_ROOT.Length) -replace '[\\:]', '_'
              Copy-Item $_.FullName "$env:H_ART\logs\root$rel" -ErrorAction SilentlyContinue
            }
          }
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: pr14245-win
          path: ${{ env.H_ART }}
          if-no-files-found: warn

      - name: Cleanup and restore
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ScheduledTask -TaskName 'pr14245-*' -ErrorAction SilentlyContinue | Unregister-ScheduledTask -Confirm:$false
          taskkill /F /T /IM unsloth-studio.exe 2>$null
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'pr14245' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 5
          foreach ($p in @("$env:USERPROFILE\.unsloth", "$env:APPDATA\ai.unsloth.studio", "$env:LOCALAPPDATA\ai.unsloth.studio")) {
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          foreach ($line in (Get-Content "$env:H_W\aside.txt" -ErrorAction SilentlyContinue)) {
            if (-not $line) { continue }
            $from, $to = $line -split '\|'
            if ((Test-Path -LiteralPath $to) -and -not (Test-Path -LiteralPath $from)) { Rename-Item -LiteralPath $to -NewName (Split-Path $from -Leaf); Write-Host "restored $from" }
          }
          Remove-Item -LiteralPath $env:H_W -Recurse -Force -ErrorAction SilentlyContinue
          reg delete "HKCU\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" /v unsloth-studio.exe /f 2>$null
          exit 0
