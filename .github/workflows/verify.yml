name: PR 10765 verification (throwaway)

# main = ffb5539d2f (the PR's merge base), pr = edd4f0dc1d (PR head).

on:
  push:
    branches: [pr10765-verify]

permissions: {}

env:
  MAIN_SHA: ffb5539d2f07b7a978511d70c0243bf100a500fe
  PR_SHA: edd4f0dc1d550e0efbae88605bab47b5a4f4224c

jobs:
  realuser:
    name: real account "${{ matrix.account }}", default install (pr)
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        account: ['John Doe', 'JohnDoe']
    env:
      LEG: real account ${{ matrix.account }}, default install, pr
      ACCOUNT: ${{ matrix.account }}
    steps:
      - name: Fetch scripts and installer; 8.3 names on
        shell: pwsh
        run: |
          git clone -q --depth 1 -b pr10765-verify https://github.com/oobabooga/unsloth "$env:RUNNER_TEMP\h"
          New-Item -ItemType Directory -Force -Path C:\Users\Public\e2e | Out-Null
          Copy-Item "$env:RUNNER_TEMP\h\*.ps1" C:\Users\Public\e2e\
          curl.exe -fsSL -o C:\Users\Public\e2e\install.ps1 "https://raw.githubusercontent.com/oobabooga/unsloth/$env:PR_SHA/install.ps1"
          if ($LASTEXITCODE) { throw "download failed" }
          fsutil 8dot3name set 0
          exit 0
      - name: Create the account and run the installer as it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = 'Aa1!' + [guid]::NewGuid().ToString('N')
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name $env:ACCOUNT -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group 'Administrators' -Member $env:ACCOUNT
          icacls C:\Users\Public\e2e /grant '*S-1-1-0:(OI)(CI)M' | Out-Null
          $arg = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\Users\Public\e2e\run_install.ps1 -Installer C:\Users\Public\e2e\install.ps1 -OutDir C:\Users\Public\e2e\out -TimeoutMinutes 45'
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $arg
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 2)
          Register-ScheduledTask -TaskName 'unsloth-e2e' -Action $action -Settings $settings -User $env:ACCOUNT -Password $pw -RunLevel Highest | Out-Null
          Start-ScheduledTask -TaskName 'unsloth-e2e'
          $ErrorActionPreference = 'Continue'
          $deadline = (Get-Date).AddMinutes(60)
          $done = 'C:\Users\Public\e2e\out\done.txt'
          while (-not (Test-Path $done)) {
            if ((Get-Date) -gt $deadline) { Write-Host '::error::timed out waiting for run_install'; break }
            Start-Sleep -Seconds 60
            $st = (Get-ScheduledTask -TaskName 'unsloth-e2e').State
            $tail = Get-Content C:\Users\Public\e2e\out\install.log -Tail 1 -ErrorAction SilentlyContinue
            Write-Host "[$(Get-Date -Format HH:mm:ss)] task=$st :: $tail"
            if ("$st" -eq 'Ready' -and -not (Test-Path $done)) {
              Start-Sleep -Seconds 15
              if (-not (Test-Path $done)) { Write-Host '::error::task stopped without finishing'; break }
            }
          }
          exit 0
      - name: Check
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File C:\Users\Public\e2e\check_install.ps1 -OutDir C:\Users\Public\e2e\out -Expect success
