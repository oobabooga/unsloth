name: "AMD CI: W8A8 torch._int_mm vs weight-only int8 (Windows)"

# Windows counterpart of amd-ci-int8mm.yml: same branch, same two probes, on the
# non-Docker Windows gfx1151 runners with AMD's gfx1151 torch wheels.

on:
  push:
    branches: [amd-ci-int8mm-win]
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC_REPO: "https://github.com/danielhanchen/unsloth-staging-2"
  SRC_BRANCH: "studio-amd-int8-intmm"

jobs:

  windows:
    name: "int8 W8A8 on gfx1151 Windows"
    runs-on: [self-hosted, Windows, strix-halo, devlab-dispatch]
    timeout-minutes: 300
    concurrency:
      group: amd-ci-gfx1151-gpu-windows
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          .\amd_ci\lib\preamble.ps1 -Name "int8mm-windows"

      - name: Locate the system Python
        run: |
          $ErrorActionPreference = "Continue"
          $found = $null
          foreach ($c in @("C:\Program Files\Python312\python.exe",
                           "C:\Program Files\Python311\python.exe",
                           "C:\Program Files\Python310\python.exe")) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if ($null -eq $found) { Write-Host "FATAL: no system Python found."; exit 1 }
          & $found --version
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$found"

      - name: Checkout the branch under test
        run: |
          $ErrorActionPreference = "Continue"
          git clone -q --depth 1 -b $env:SRC_BRANCH $env:SRC_REPO "$env:AMD_CI_WORK\src\unsloth"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:AMD_CI_WORK\src\unsloth" log -1 --format='%h %s'

      - name: Carry PR 11640 (torchao stub version transformers 5 can parse)
        run: |
          $ErrorActionPreference = "Continue"
          $src = "$env:AMD_CI_WORK\src\unsloth"
          # The clone is shallow, so apply the PR's diff rather than merge its history.
          Invoke-WebRequest -UseBasicParsing -Uri "https://patch-diff.githubusercontent.com/raw/unslothai/unsloth/pull/11640.diff" -OutFile "$env:AMD_CI_WORK\pr11640.diff"
          git -C $src apply --whitespace=nowarn "$env:AMD_CI_WORK\pr11640.diff"
          Write-Host "apply exit $LASTEXITCODE"
          git -C $src status --short
          exit 0

      - name: Test environment
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -m venv "$env:AMD_CI_WORK\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:AMD_CI_WORK\venv\Scripts\python.exe"
          & $py -m pip install -q --upgrade pip
          & $py -m pip install -q --index-url https://repo.amd.com/rocm/whl/gfx1151/ "torch>=2.11.0,<2.12.0" "torchvision>=0.26.0,<0.27.0"
          Write-Host "torch install exit: $LASTEXITCODE"
          & $py -m pip install -q "diffusers @ https://github.com/huggingface/diffusers/archive/80c7ed262aeffbeb43ef13ae04baeb9b84515a69.zip" "transformers==5.5.0" accelerate safetensors "gguf>=0.10" huggingface_hub pillow numpy scipy tqdm
          & $py -m pip install -q -r "$env:AMD_CI_WORK\src\unsloth\studio\backend\requirements\studio.txt"
          Write-Host "studio requirements exit: $LASTEXITCODE"
          & $py -m pip install -q --no-deps lpips
          & $py -c "import torch; print('torch', torch.__version__, 'hip', torch.version.hip, 'cuda?', torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no device')"
          Add-Content -Path $env:GITHUB_ENV -Value "AMD_CI_PY=$py"
          & $py "$env:GITHUB_WORKSPACE\amd_ci\lib\gate.py" --require rocm gpu --expect-arch gfx1151 --min-gpus 1 --out "$env:AMD_CI_WORK\out\host_rocm.json"
          Write-Host "rocm gate exit: $LASTEXITCODE"
          exit 0

      - name: Layer micro-benchmark
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Continue"
          & $env:AMD_CI_PY -u "$env:GITHUB_WORKSPACE\amd_ci\probes\int8mm_layer_probe.py" `
            --checkout "$env:AMD_CI_WORK\src\unsloth" --out "$env:AMD_CI_WORK\out\layer.json"
          exit 0

      - name: End to end, eager
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = "Continue"
          $env:TORCH_HOME = "$env:AMD_CI_WORK\torch_home"
          $env:HF_HOME = "$env:AMD_CI_WORK\hf_home"
          & $env:AMD_CI_PY -u "$env:GITHUB_WORKSPACE\amd_ci\probes\int8mm_e2e_probe.py" `
            --checkout "$env:AMD_CI_WORK\src\unsloth" --out-dir "$env:AMD_CI_WORK\out\e2e_off" `
            --models "$env:AMD_CI_WORK\models" --speed off
          "### Eager (Windows)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:AMD_CI_WORK\out\e2e_off\SUMMARY.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int8mm-windows
          path: ${{ env.AMD_CI_WORK }}/out
          retention-days: 7
          if-no-files-found: warn
