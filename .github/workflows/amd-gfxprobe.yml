name: AMD DevLab gfx probe

on:
  push:
    branches: [amd-devlab-gfxprobe-9829]

permissions:
  contents: read

jobs:
  owns:
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Does torch itself declare the rocm family
        run: |
          set +e
          W="$RUNNER_TEMP/w"; mkdir -p "$W/tmp"
          export TMPDIR="$W/tmp" PIP_CACHE_DIR="$W/pipcache"
          python3 -m venv "$W/venv"; . "$W/venv/bin/activate"
          python -m pip install -q --upgrade pip

          echo "========== AMD per-arch torch (gfx110X-all) =========="
          python -m pip install -q torch --index-url https://repo.amd.com/rocm/whl/gfx110X-all/ 2>&1 | tail -2
          python "$GITHUB_WORKSPACE/probe/owns.py"

          echo "========== now install GENERIC rocm7.1 torch over it =========="
          python -m pip install -q "torch>=2.4,<2.11.0" --force-reinstall --no-cache-dir \
            --index-url https://download.pytorch.org/whl/rocm7.1 2>&1 | tail -2
          python "$GITHUB_WORKSPACE/probe/owns.py"
          echo "===== END ====="
          exit 0
