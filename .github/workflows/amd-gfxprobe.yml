name: AMD DevLab gfx probe

on:
  push:
    branches: [amd-devlab-gfxprobe-9829]

permissions:
  contents: read

jobs:
  wheels:
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Wheel architecture lists
        run: |
          set +e
          W="$RUNNER_TEMP/w"; mkdir -p "$W/tmp"
          export TMPDIR="$W/tmp" PIP_CACHE_DIR="$W/pipcache"
          python3 -m venv "$W/venv"
          . "$W/venv/bin/activate"
          python -m pip install -q --upgrade pip
          for pair in "generic-rocm7.1|https://download.pytorch.org/whl/rocm7.1" \
                      "gfx110X-all|https://repo.amd.com/rocm/whl/gfx110X-all/" \
                      "gfx103X-all|https://repo.amd.com/rocm/whl/gfx103X-all/" \
                      "gfx1152|https://repo.amd.com/rocm/whl/gfx1152/"; do
            leaf="${pair%%|*}"; url="${pair##*|}"
            echo "========== $leaf =========="
            echo "--- available torch versions ---"
            python -m pip index versions torch --index-url "$url" 2>&1 | head -4
            echo "--- install ---"
            python -m pip install -q torch --index-url "$url" 2>&1 | tail -3
            python "$GITHUB_WORKSPACE/probe/archlist.py" 2>&1
            python -m pip uninstall -y -q torch 2>&1 | tail -1
            python -m pip freeze 2>/dev/null | grep -i rocm | head -5
            python -m pip uninstall -y -q -r <(python -m pip freeze | grep -iE '^(rocm|pytorch-triton)' | cut -d= -f1) 2>&1 | tail -1
            rm -rf "$W/pipcache"
          done
          echo "===== END ====="
          exit 0
