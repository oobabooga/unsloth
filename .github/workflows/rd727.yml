name: RD-727 Windows uv --project probe

on:
  push:
    branches: [rd727-win-repro]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          python -m pip install -q uv==0.13.1
          uv --version
          uv python install 3.13 2>&1 | Out-Host
          uv venv -q --python 3.13 target
          "TEMP=$env:TEMP"
          python -c "import tempfile, os; print('tempfile:', tempfile.gettempdir()); print('realpath:', os.path.realpath(tempfile.gettempdir()))"
          $proxyLog = (Join-Path (Resolve-Path logs).Path 'proxy.log')
          $flag = Join-Path $env:RUNNER_TEMP 'noflag'
          $proxy = Start-Process python -PassThru -WindowStyle Hidden -ArgumentList @(
            '.github/rd727/proxy.py', '18080', '0', $flag, $proxyLog)
          for ($w = 0; $w -lt 30 -and -not (Test-Path $proxyLog); $w++) { Start-Sleep -Seconds 1 }
          $env:HTTPS_PROXY = 'http://127.0.0.1:18080'
          python .github/rd727/probe_project.py (Resolve-Path target\Scripts\python.exe).Path
          Stop-Process -Id $proxy.Id -Force -ErrorAction SilentlyContinue
