# Narrow the unified-memory window from 500 builds to about 24, in one job.
#
# Take 2 (run 33334900583) put the window at b9500 clean, b10000 broken, i.e.
# between 2026-06-04 and 2026-07-14. Upstream publishes a ubuntu-rocm tarball for
# 349 of the 500 builds in that window, so this needs NO COMPILATION and no
# ccache: every point is already built. That is also why this is not a git
# bisect - the runner has no compiler, and with prebuilts it does not need one.
#
# WHY 20 CELLS IN ONE JOB rather than parallel jobs. The four CI slots share a
# single gfx1151 and 62 GB of RAM, and one cell holds a 45.1 GiB model resident.
# Two concurrent cells do not fit, so parallelism here would thrash and OOM,
# which is how the FIRST attempt lost its runner. The fixed cost is the one-time
# 45 GiB model download; the marginal cost of another cell is a ~200 MB tarball
# and a few minutes. So the efficient shape is many sequential cells amortising
# one download, not many jobs fighting over one GPU.
#
# 20 evenly spaced interior points cut 347 candidates to ~24. A second sweep of
# the same shape over the survivors reaches a single build, and a build number is
# a commit.
#
# DISK. Each cell deletes its build tree before the next fetch, so peak usage is
# the model plus one build, not the model plus twenty.
#
# PROBE FIX CARRIED HERE. Older releases print "version: 9503 (deadbeef1)" while
# newer ones print "version: 0.3.0-dev (build 10631, commit ...)". The probe only
# understood the newer spelling, so every pre-b10xxx cell in the last sweep
# recorded build=None and went INCONCLUSIVE on the "same build" gate. Fixed in
# amd_ci/probes/llamacpp_uma_probe.py.
#
# Footprint is load-bearing: Family B is inert at 47% of RAM and corrupts at 73%.
# The 45.1 GiB model is 73% here. Do not shrink it to save time.

name: "AMD CI: narrow the unified memory window"

on:
  push:
    branches: [amd-ci-uma-narrow]
  workflow_dispatch:

permissions:
  contents: read

env:
  CODER_REPO: "Qwen/Qwen3-Coder-Next-GGUF"
  CODER_REV: "b82fb7382639d97b38fa7672e526c760c2fb358e"
  CODER_DIR: "Qwen3-Coder-Next-Q4_K_M"
  CODER_HEAD: "Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf"
  CTX: "8192"
  NPREDICT: "30"
  REPEATS: "3"
  NGL: "999"
  LOAD_TIMEOUT: "900"
  REQ_TIMEOUT: "420"

jobs:

  gpu:
    name: "narrow unified memory window, 20 builds, gfx1151 (exclusive)"
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    timeout-minutes: 420
    concurrency:
      group: amd-ci-gfx1151-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Preamble
        run: |
          source amd_ci/lib/preamble.sh "uma-narrow"

      - name: Hardware gate and memory bounds
        run: |
          set -eu
          python3 amd_ci/lib/gate.py --no-torch --require linux \
            --out "$AMD_CI_WORK/out/host.json"
          { rocminfo || true; } > "$AMD_CI_WORK/out/rocminfo.txt" 2>&1
          { free -g; } > "$AMD_CI_WORK/out/free_start.txt" 2>&1
          df -h "$AMD_CI_WORK" | tail -1

      - name: Fetch Qwen3-Coder-Next Q4_K_M, 45.1 GiB over four shards
        timeout-minutes: 240
        run: |
          set -eu
          M="$AMD_CI_WORK/models"
          for N in 00001 00002 00003 00004; do
            F="Qwen3-Coder-Next-Q4_K_M-$N-of-00004.gguf"
            python3 amd_ci/lib/fetch_gguf.py --repo "$CODER_REPO" \
              --file "$CODER_DIR/$F" --revision "$CODER_REV" --as-name "$F" \
              --local-dir "$M/ctl" --out "$AMD_CI_WORK/out/model_$N.json"
          done
          mkdir -p "$M/uma1"
          for F in "$M"/ctl/*.gguf; do ln -f "$F" "$M/uma1/$(basename "$F")"; done
          printf '%s\n' '-GGML_CUDA_ENABLE_UNIFIED_MEMORY' > "$M/ctl/env"
          printf '%s\n' 'GGML_CUDA_ENABLE_UNIFIED_MEMORY=1' > "$M/uma1/env"
          python3 amd_ci/lib/write_states.py --require-file "$CODER_HEAD" \
            --path "base=$M/ctl" --path "head=$M/uma1" \
            --label "base=unset" --label "head==1" \
            --out "$AMD_CI_WORK/out/states.json"
          df -h "$AMD_CI_WORK" | tail -1

      - name: "N1 - b9503"
        if: always()
        timeout-minutes: 30
        env:
          AMD_CI_EXPECT_DEVICE: ROCm
        run: |
          set +e
          python3 amd_ci/lib/fetch_llamacpp.py --url "https://github.com/ggml-org/llama.cpp/releases/download/b9503/llama-b9503-bin-ubuntu-rocm-7.2-x64.tar.gz" \
            --dest "$AMD_CI_WORK/lcpp/n1" --out "$AMD_CI_WORK/out/bin_n1.json"
          BIN="$(python3 -c "import json;print(json.load(open('$AMD_CI_WORK/out/bin_n1.json'))['bin_dir'])")"
          python3 amd_ci/lib/differential.py \
            --states "$AMD_CI_WORK/out/states.json" \
            --probe amd_ci/probes/llamacpp_uma_probe.py \
            --criteria amd_ci/criteria/llamacpp_uma_regression.py \
            --out-dir "$AMD_CI_WORK/out/N1_b9503" \
            --title "N1 Qwen3-Coder-Next Q4_K_M, upstream b9503, unset vs =1, gfx1151" \
            -- --bin-dir "$BIN" --gguf "$CODER_HEAD" --ngl "$NGL" \
               --ctx-size "$CTX" --n-predict "$NPREDICT" --repeats "$REPEATS" \
               --extra-arg=--parallel --extra-arg=1 --extra-arg=-fa --extra-arg=off \
               --load-timeout "$LOAD_TIMEOUT" --request-timeout "$REQ_TIMEOUT"
          cat "$AMD_CI_WORK/out/N1_b9503/VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          # Reclaim before the next fetch: model + one build, never model + twenty.
          rm -rf "$AMD_CI_WORK/lcpp/n1"
          python3 "$GITHUB_WORKSPACE/amd_ci/lib/announce.py" "$AMD_CI_WORK/out/N1_b9503" || true

